<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Hit&amp;Damage Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10151d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Char Calc">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#10151d; --panel:#18212c; --panel2:#202b38; --text:#edf3f8;
  --muted:#aebdcc; --gold:#d6b35f; --gold2:#f1d78b; --red:#d76a63; --green:#72c69c;
  --blue:#6aa8d9; --line:#344354; --border:#313949; --violet:#b18ce8;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0d1218,#141c26);color:var(--text)}
.wrap{max-width:1680px;margin:auto;padding:16px}
header{padding:14px 18px;border:1px solid var(--line);background:rgba(24,33,44,.96);border-radius:16px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:24px}
.subtitle{color:var(--muted);font-size:.85rem}
h2{font-size:17px;margin:0 0 12px;color:var(--gold)}
h3{font-size:14px;margin:14px 0 8px;color:#fff}
.card{background:rgba(24,33,44,.97);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card-char{border-top-color:var(--gold)}
.card-mod{border-top-color:var(--blue)}
.card-mod h2{color:var(--blue)}
.card-active{border-top-color:var(--green)}
.card-active h2{color:var(--green)}
/* An active effect that contributes nothing to the numbers above (Vital Strike-style
   "changes how you roll", conditional-on-something-else, resource-tracked, etc.) is
   easy to miss sitting in a wide breakdown table as just another 0/0 row -- this callout
   puts it somewhere it can't be scrolled past unnoticed. */
.unmodeledBox{background:rgba(230,126,34,.12);border:1px solid #e67e22;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.unmodeledHeader{font-weight:800;color:#f0a850;font-size:.85rem;margin-bottom:8px}
.unmodeledItem{font-size:.8rem;line-height:1.4;padding:7px 0;border-top:1px dashed rgba(230,126,34,.35)}
.unmodeledItem:first-child{border-top:none;padding-top:0}
.unmodeledItem b{color:#fff}
.ackBtn{display:block;margin-top:5px;font-size:.68rem;padding:3px 8px;border-radius:999px;background:rgba(230,126,34,.18);border:1px solid #e67e22;color:#f0a850;cursor:pointer}
.ackBtn:hover{background:rgba(230,126,34,.32)}
.card-results{border-top-color:var(--violet)}
.card-results h2{color:var(--violet);display:flex;align-items:center;gap:10px}
.pinBtn{font-size:.7rem;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-weight:400}
.pinBtn.active{background:var(--gold);color:#151515;border-color:var(--gold);font-weight:700}
/* Pinning floats Results over the page (desktop only) so it stays visible while
   scrolling through a long Modifiers catalog, instead of always being pinned. */
@media(min-width:901px){
  .card-results.pinned{position:fixed;top:16px;right:16px;width:340px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow-y:auto;z-index:300;box-shadow:0 16px 40px rgba(0,0,0,.55)}
  .card-results.pinned .resultBox{grid-template-columns:1fr}
}
.row{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:7px 0}
label{color:var(--muted);font-size:.85rem}
input,select{width:100%;background:#0f161f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.9rem}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:.85rem}
button.primary{background:var(--gold);color:#151515;border:0;font-weight:700}
button.danger{background:#3a1d21;border-color:#67343b;color:#f0a}
/* Six 2-digit stat boxes don't need a 320px column each -- a small square box (label
   above, centered number below) reads far better than a giant field stretched to fit a
   grid track meant for "Character Level"-sized rows. */
.statsGrid{display:grid;grid-template-columns:repeat(6,minmax(52px,1fr));gap:8px;max-width:460px}
.statsGrid>div{text-align:center}
.statsGrid label{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.statsGrid input{width:100%;text-align:center;padding:8px 2px;font-size:1rem;font-weight:700}
@media(max-width:520px){.statsGrid{grid-template-columns:repeat(3,1fr);max-width:none}}
.card-char{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,320px));gap:2px 18px;align-content:start}
.card-char>h2,.card-char>h3{grid-column:1/-1}
/* Every Character & Weapons row: label sized to its own text (shrinkable, so it wraps
   instead of overflowing if a row is ever squeezed) rather than 1fr, which let it swallow
   all the row's spare width and strand the input far to the right of its own label --
   right under whatever field's box sits above it in the next row. Input/select then fills
   the rest, which also gives long dropdown values (weapon names, alignments...) more room
   than the old fixed 110px. Declared before the more specific row overrides below so those
   still win on equal selector specificity. */
.card-char>.row{grid-template-columns:minmax(0,max-content) 1fr}
/* Grid items default to min-width:auto, which floors their shrink at their own
   min-content size -- for a multi-word label that's still fairly wide, or a <select>
   whose widest option is wider than a narrow-viewport track, that silently resists the
