<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabriel — Paladin Spellbook</title><style>
:root{--bg:#0f1117;--panel:#181c24;--panel2:#202633;--text:#eef2f7;--muted:#9ba7b7;--gold:#d5ad55;--gold2:#f1d78b;--red:#d66b6b;--border:#313949}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;background:#0f1117;color:var(--text)}header,main{max-width:1180px;margin:auto;padding:12px 16px}header{border-bottom:1px solid var(--border)}h1{margin:0;font-size:1.35rem}.sub{color:var(--muted);font-size:.78rem;margin:2px 0 8px}.controls{display:grid;grid-template-columns:90px 90px 1fr;gap:8px}label{font-size:.68rem;color:var(--muted);display:block;margin-bottom:2px}select,input{width:100%;background:#121721;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px}.stat b{color:var(--gold2);font-size:1rem}.stat span{display:block;color:var(--muted);font-size:.62rem}.levels{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;cursor:pointer}button.active,button.primary{background:#5a4318;border-color:#816427;color:#fff1c2}.toolbar{display:grid;grid-template-columns:1fr 160px auto auto;gap:6px;margin-bottom:8px}.slotbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.slot{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px}.slot small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}section{margin:8px 0 14px}h2{font-size:.95rem;color:var(--gold2);margin:6px 0}.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px}.card.oath{border-color:#816427}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:750}.badge{font-size:.58rem;color:var(--gold2)}.desc{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.25}.prep{display:flex;align-items:center;gap:4px}.count{min-width:22px;text-align:center;color:var(--gold2);font-weight:700}.disabled{opacity:.45}.warn{color:#ffd27c;font-size:.68rem;margin-top:5px}
@media(max-width:780px){header,main{padding:5px 7px}h1{display:none}.sub{display:none}.controls{grid-template-columns:55px 62px 1fr;gap:3px}label{font-size:.45rem}select,input{height:23px;padding:2px 4px;font-size:.6rem}.stats{gap:2px;margin-top:3px}.stat{padding:2px;text-align:center;min-height:29px}.stat b{font-size:.68rem}.stat span{font-size:.38rem}.levels{margin:3px 0;gap:2px}button{padding:3px 5px;font-size:.55rem}.slotbar{gap:2px;margin-bottom:4px}.slot{padding:3px;font-size:.58rem}.slot small{font-size:.42rem}.toolbar{grid-template-columns:1fr 100px auto auto;gap:3px;margin-bottom:4px}.grid{grid-template-columns:1fr;gap:3px}section{margin:4px 0 8px}h2{font-size:.72rem;margin:3px 0}.card{padding:5px}.name{font-size:.74rem}.desc{font-size:.58rem}.badge{font-size:.45rem}}
</style></head><body><header><h1>Gabriel — Paladin Spellbook</h1><div class="sub">Pathfinder 1e Core Rulebook paladin spells + oath spells</div><div class="controls"><div><label>Paladin Level</label><select id="level"></select></div><div><label>Charisma</label><select id="cha"></select></div><div><label>Paladin Oath</label><input value="Oath of Vengeance" readonly></div></div><div class="stats"><div class="stat"><b id="cl">0</b><span>Caster level</span></div><div class="stat"><b id="daily">0</b><span>Total spell slots/day</span></div><div class="stat"><b id="prepared">0</b><span>Prepared in normal slots</span></div><div class="stat"><b id="oathprep">0</b><span>Oath slots prepared</span></div></div><div id="levelButtons" class="levels"></div><div class="warn" id="ruleNote"></div></header><main><div id="slots" class="slotbar"></div><div class="toolbar"><input id="search" placeholder="Search spell name or description..."><select id="filter"><option value="all">All spells</option><option value="prepared">Prepared only</option><option value="unprepared">Unprepared only</option><option value="oath">Oath spells only</option></select><button class="primary" id="newDay">New Day</button><button id="clear">Clear</button></div><div id="list"></div></main><script>
const SPELLS=[{"n": "Bless", "l": 1, "x": "Allies gain +1 morale on attack rolls and saves against fear.", "oath": false}, {"n": "Bless Water", "l": 1, "x": "Makes holy water.", "oath": false}, {"n": "Bless Weapon", "l": 1, "x": "Weapon strikes true against evil foes.", "oath": false}, {"n": "Create Water", "l": 1, "x": "Creates 2 gallons/level of pure water.", "oath": false}, {"n": "Cure Light Wounds", "l": 1, "x": "Cures 1d8 damage + 1/level (max +5).", "oath": false}, {"n": "Detect Poison", "l": 1, "x": "Detects poison in one creature or small object.", "oath": false}, {"n": "Detect Undead", "l": 1, "x": "Reveals undead within 60 ft.", "oath": false}, {"n": "Divine Favor", "l": 1, "x": "Gain +1 per three caster levels on attack and weapon damage rolls.", "oath": false}, {"n": "Endure Elements", "l": 1, "x": "Exist comfortably in hot or cold environments.", "oath": false}, {"n": "Magic Weapon", "l": 1, "x": "Weapon gains +1 enhancement bonus.", "oath": false}, {"n": "Protection from Chaos", "l": 1, "x": "+2 AC and saves, plus protection against chaotic mental control and summoned creatures.", "oath": false}, {"n": "Protection from Evil", "l": 1, "x": "+2 AC and saves, plus protection against evil mental control and summoned creatures.", "oath": false}, {"n": "Read Magic", "l": 1, "x": "Read magical inscriptions.", "oath": false}, {"n": "Resistance", "l": 1, "x": "Subject gains +1 resistance bonus on saving throws.", "oath": false}, {"n": "Lesser Restoration", "l": 1, "x": "Dispels magical ability penalties or cures 1d4 temporary ability damage; also helps fatigue/exhaustion.", "oath": false}, {"n": "Virtue", "l": 1, "x": "Subject gains 1 temporary hit point.", "oath": false}, {"n": "Bull's Strength", "l": 2, "x": "Subject gains +4 enhancement bonus to Strength.", "oath": false}, {"n": "Delay Poison", "l": 2, "x": "Stops poison from harming subject for 1 hour/level.", "oath": false}, {"n": "Eagle's Splendor", "l": 2, "x": "Subject gains +4 enhancement bonus to Charisma.", "oath": false}, {"n": "Owl's Wisdom", "l": 2, "x": "Subject gains +4 enhancement bonus to Wisdom.", "oath": false}, {"n": "Remove Paralysis", "l": 2, "x": "Frees one or more creatures from paralysis or related effects.", "oath": false}, {"n": "Resist Energy", "l": 2, "x": "Grants resistance against one chosen energy type.", "oath": false}, {"n": "Shield Other", "l": 2, "x": "You take half of the subject’s hit point damage while the spell lasts.", "oath": false}, {"n": "Undetectable Alignment", "l": 2, "x": "Conceals alignment from magical detection for 24 hours.", "oath": false}, {"n": "Zone of Truth", "l": 2, "x": "Creatures in the area that fail their save cannot deliberately lie.", "oath": false}, {"n": "Cure Moderate Wounds", "l": 3, "x": "Cures 2d8 damage + 1/level (max +10).", "oath": false}, {"n": "Daylight", "l": 3, "x": "Object sheds bright light in a 60-foot radius.", "oath": false}, {"n": "Discern Lies", "l": 3, "x": "Reveals deliberate falsehoods while you concentrate.", "oath": false}, {"n": "Dispel Magic", "l": 3, "x": "Cancels a spell or magical effect.", "oath": false}, {"n": "Heal Mount", "l": 3, "x": "Heals and removes many adverse conditions from your special mount.", "oath": false}, {"n": "Magic Circle against Chaos", "l": 3, "x": "As protection from chaos, but in a 10-foot-radius emanation.", "oath": false}, {"n": "Magic Circle against Evil", "l": 3, "x": "As protection from evil, but in a 10-foot-radius emanation.", "oath": false}, {"n": "Greater Magic Weapon", "l": 3, "x": "Weapon gains +1 enhancement bonus per four caster levels (max +5).", "oath": false}, {"n": "Prayer", "l": 3, "x": "Allies gain +1 luck bonus on many rolls; foes take –1.", "oath": false}, {"n": "Remove Blindness/Deafness", "l": 3, "x": "Cures normal or magical blindness or deafness.", "oath": false}, {"n": "Remove Curse", "l": 3, "x": "Frees a creature or object from curses, subject to caster-level checks where required.", "oath": false}, {"n": "Break Enchantment", "l": 4, "x": "Frees subjects from enchantments, transmutations, and curses.", "oath": false}, {"n": "Cure Serious Wounds", "l": 4, "x": "Cures 3d8 damage + 1/level (max +15).", "oath": false}, {"n": "Death Ward", "l": 4, "x": "Protects against death effects, energy drain, and negative energy.", "oath": false}, {"n": "Dispel Chaos", "l": 4, "x": "Protects against chaotic creatures and can banish or dispel certain chaotic effects.", "oath": false}, {"n": "Dispel Evil", "l": 4, "x": "Protects against evil creatures and can banish or dispel certain evil effects.", "oath": false}, {"n": "Holy Sword", "l": 4, "x": "Melee weapon functions as a +5 holy weapon and projects magic circle against evil.", "oath": false}, {"n": "Mark of Justice", "l": 4, "x": "Places a conditional curse on a willing or restrained subject.", "oath": false}, {"n": "Neutralize Poison", "l": 4, "x": "Neutralizes poison in a creature or object.", "oath": false}, {"n": "Restoration", "l": 4, "x": "Restores ability damage/drain and negative levels as described by the spell.", "oath": false}, {"n": "Wrath", "l": 1, "x": "Oath of Vengeance spell.", "oath": true}, {"n": "Confess", "l": 2, "x": "Oath of Vengeance spell.", "oath": true}, {"n": "Blessing of Fervor", "l": 3, "x": "Oath of Vengeance spell.", "oath": true}, {"n": "Order's Wrath", "l": 4, "x": "Oath of Vengeance spell.", "oath": true}]; const BASE={"4": [0, 0, 0, 0], "5": [1, 0, 0, 0], "6": [1, 0, 0, 0], "7": [1, 0, 0, 0], "8": [1, 1, 0, 0], "9": [2, 1, 0, 0], "10": [2, 1, 0, 0], "11": [2, 1, 1, 0], "12": [2, 2, 1, 0], "13": [3, 2, 1, 0], "14": [3, 2, 1, 1], "15": [3, 2, 2, 1], "16": [3, 3, 2, 1], "17": [4, 3, 2, 1], "18": [4, 3, 2, 2], "19": [4, 3, 3, 2], "20": [4, 4, 3, 3]}; const KEY='gabrielPaladinSpellbookPF1CoreV1';
const $=id=>document.getElementById(id);let state=JSON.parse(localStorage.getItem(KEY)||'{}');state.level??=7;state.cha??=20;state.prep??={};state.oathPrep??={};state.used??=[0,0,0,0];state.show??=[1,2,3,4];
for(let i=1;i<=20;i++)$('level').add(new Option(i,i));for(let i=8;i<=30;i++)$('cha').add(new Option(i,i));$('level').value=state.level;$('cha').value=state.cha;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function mod(){return Math.floor((state.cha-10)/2)}
function bonus(l){let m=mod();if(m<l)return 0;return 1+Math.floor((m-l)/4)}
function baseSlots(l){return (BASE[state.level]||[0,0,0,0])[l-1]||0}function canCast(l){return state.level>=4&&state.cha>=10+l&&(baseSlots(l)>0||bonus(l)>0)}
function normalSlots(l){return canCast(l)?baseSlots(l)+bonus(l):0}function oathSlot(l){return canCast(l)?1:0}function prepCount(l){return Object.entries(state.prep).filter(([k,v])=>v&&+k.split('|')[0]===l).reduce((a,[k,v])=>a+v,0)}
function oathPrepCount(l){return state.oathPrep[l]?1:0}function totalDaily(){let n=0;for(let l=1;l<=4;l++)n+=normalSlots(l)+oathSlot(l);return n}
function renderButtons(){let b=$('levelButtons');b.innerHTML='';let all=document.createElement('button');all.textContent='All';all.className=state.show.length===4?'active':'';all.onclick=()=>{state.show=[1,2,3,4];save();render()};b.appendChild(all);for(let l=1;l<=4;l++){let x=document.createElement('button');x.textContent='Level '+l;x.className=state.show.includes(l)?'active':'';x.onclick=()=>{state.show=state.show.includes(l)?state.show.filter(v=>v!==l):[...state.show,l].sort();save();render()};b.appendChild(x)}}
function renderSlots(){let b=$('slots');b.innerHTML='';for(let l=1;l<=4;l++){let d=document.createElement('div');d.className='slot'+(canCast(l)?'':' disabled');let n=normalSlots(l),o=oathSlot(l),used=Math.min(state.used[l-1]||0,n+o);state.used[l-1]=used;d.innerHTML=`<b>L${l}</b> ${n+o-used}/${n+o} remaining<br><small>${n} normal + ${o} oath</small>`;d.onclick=()=>{if(!canCast(l))return;state.used[l-1]=(used+1)%(n+o+1);save();renderSlots()};b.appendChild(d)}}
function renderList(){let q=$('search').value.toLowerCase(),f=$('filter').value,out=$('list');out.innerHTML='';for(let l of state.show){let arr=SPELLS.filter(s=>s.l===l&&(s.n+' '+s.x).toLowerCase().includes(q));arr=arr.filter(s=>{let key=l+'|'+s.n,p=(state.prep[key]||0)>0,op=state.oathPrep[l]===s.n;if(f==='prepared')return p||op;if(f==='unprepared')return !p&&!op;if(f==='oath')return s.oath;return true});if(!arr.length)continue;let sec=document.createElement('section');sec.innerHTML=`<h2>Level ${l}</h2><div class="grid"></div>`;let g=sec.querySelector('.grid');arr.sort((a,b)=>a.n.localeCompare(b.n)).forEach(s=>{let key=l+'|'+s.n,c=state.prep[key]||0,op=state.oathPrep[l]===s.n,card=document.createElement('div');card.className='card'+(s.oath?' oath':'')+(canCast(l)?'':' disabled');card.innerHTML=`<div class="head"><div><div class="name">${s.n}</div>${s.oath?'<div class="badge">Oath spell</div>':''}</div><div class="prep">${s.oath?`<button class="ob">${op?'Oath ✓':'Oath'}</button>`:''}<button class="minus">−</button><span class="count">${c}</span><button class="plus">+</button></div></div><div class="desc">${s.x}</div>`;card.querySelector('.plus').onclick=()=>{if(!canCast(l))return;if(prepCount(l)>=normalSlots(l))return alert('All normal level '+l+' preparation slots are already filled.');state.prep[key]=c+1;save();render()};card.querySelector('.minus').onclick=()=>{if(c>0){state.prep[key]=c-1;save();render()}};let ob=card.querySelector('.ob');if(ob)ob.onclick=()=>{if(!canCast(l))return;state.oathPrep[l]=op?null:s.n;save();render()};g.appendChild(card)});out.appendChild(sec)}}
function render(){$('cl').textContent=state.level<4?'—':state.level-3;$('daily').textContent=totalDaily();$('prepared').textContent=Object.values(state.prep).reduce((a,v)=>a+(+v||0),0);$('oathprep').textContent=Object.values(state.oathPrep).filter(Boolean).length;$('ruleNote').textContent='Preparation is tracked per spell level. Each castable spell level has '+ 'one separate oath slot; with multiple oaths, choose one oath spell for that slot.';renderButtons();renderSlots();renderList()}
$('level').onchange=e=>{state.level=+e.target.value;state.used=[0,0,0,0];save();render()};$('cha').onchange=e=>{state.cha=+e.target.value;state.used=[0,0,0,0];save();render()};$('search').oninput=renderList;$('filter').onchange=renderList;$('newDay').onclick=()=>{state.used=[0,0,0,0];save();render()};$('clear').onclick=()=>{state.prep={};state.oathPrep={};save();render()};render();</script></body></html>
