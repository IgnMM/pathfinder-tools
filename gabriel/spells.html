<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabriel — Paladin Spellbook</title><style>
:root{--bg:#0f1117;--panel:#181c24;--panel2:#202633;--text:#eef2f7;--muted:#9ba7b7;--gold:#d5ad55;--gold2:#f1d78b;--red:#d66b6b;--border:#313949}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;background:#0f1117;color:var(--text)}header,main{max-width:1180px;margin:auto;padding:12px 16px}header{border-bottom:1px solid var(--border)}h1{margin:0;font-size:1.35rem}.sub{color:var(--muted);font-size:.78rem;margin:2px 0 8px}.controls{display:grid;grid-template-columns:90px 90px 1fr;gap:8px}label{font-size:.68rem;color:var(--muted);display:block;margin-bottom:2px}select,input{width:100%;background:#121721;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px}.oathval{width:100%;box-sizing:border-box;padding:7px 0;color:var(--text);font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px}.stat b{color:var(--gold2);font-size:1rem}.stat span{display:block;color:var(--muted);font-size:.62rem}.levels{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;cursor:pointer}button.active,button.primary{background:#5a4318;border-color:#816427;color:#fff1c2}.toolbar{display:grid;grid-template-columns:1fr 160px auto auto;gap:6px;margin-bottom:8px}.slotbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.slot{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px}.slot small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}section{margin:8px 0 14px}h2{font-size:.95rem;color:var(--gold2);margin:6px 0}.dc{font-size:.68rem;color:var(--muted);font-weight:400;margin-left:6px}.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px}.card.oath{border-color:#816427}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:750}.badge{font-size:.58rem;color:var(--gold2)}.savebadge{font-size:.58rem;color:var(--muted);margin-top:2px}.desc{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.25}.desc summary{cursor:pointer;color:var(--gold2);font-size:.68rem;list-style:none}.desc summary::-webkit-details-marker{display:none}.desc summary:before{content:"▸ ";display:inline-block}.desc[open] summary:before{content:"▾ "}.desc[open] summary{margin-bottom:3px}.prep{display:flex;align-items:center;gap:4px}.count{min-width:22px;text-align:center;color:var(--gold2);font-weight:700}.disabled{opacity:.45}.warn{color:#ffd27c;font-size:.68rem;margin-top:5px}.favbtn{background:none;border:none;font-size:1.05rem;line-height:1;cursor:pointer;padding:0 4px;color:var(--muted)}.favbtn.active{color:var(--gold2)}
@media(max-width:780px){header,main{padding:5px 7px}h1{display:none}.sub{display:none}.controls{grid-template-columns:55px 62px 1fr;gap:3px}label{font-size:.45rem}select,input{height:23px;padding:2px 4px;font-size:.6rem}.stats{gap:2px;margin-top:3px}.stat{padding:2px;text-align:center;min-height:29px}.stat b{font-size:.68rem}.stat span{font-size:.38rem}.levels{margin:3px 0;gap:2px}button{padding:3px 5px;font-size:.55rem}.slotbar{gap:2px;margin-bottom:4px}.slot{padding:3px;font-size:.58rem}.slot small{font-size:.42rem}.toolbar{grid-template-columns:1fr 100px auto auto;gap:3px;margin-bottom:4px}.grid{grid-template-columns:1fr;gap:3px}section{margin:4px 0 8px}h2{font-size:.72rem;margin:3px 0}.card{padding:5px}.name{font-size:.74rem}.desc{font-size:.58rem}.desc summary{font-size:.55rem}.badge{font-size:.45rem}}
</style></head><body><header><h1>Gabriel — Paladin Spellbook</h1><div class="sub">Pathfinder 1e Core Rulebook paladin spells + oath spells</div><div class="controls"><div><label>Paladin Level</label><select id="level"></select></div><div><label>Charisma</label><select id="cha"></select></div><div><label>Paladin Oath</label><div class="oathval">Oath of Vengeance</div></div></div><div class="stats"><div class="stat"><b id="cl">0</b><span>Caster level</span></div><div class="stat"><b id="daily">0</b><span>Total spell slots/day</span></div><div class="stat"><b id="prepared">0</b><span>Prepared in normal slots</span></div><div class="stat"><b id="oathprep">0</b><span>Oath slots prepared</span></div></div><div id="levelButtons" class="levels"></div><div class="warn" id="ruleNote"></div></header><main><div id="slots" class="slotbar"></div><div class="toolbar"><input id="search" placeholder="Search spell name or description..."><select id="filter"><option value="all">All spells</option><option value="prepared">Prepared only</option><option value="unprepared">Unprepared only</option><option value="oath">Oath spells only</option><option value="favorites">Favorites only</option></select><button class="primary" id="newDay">New Day</button><button id="clear">Clear</button></div><div id="list"></div></main><script>
const SPELLS=[{"n":"Bless","l":1,"x":"Allies gain +1 morale on attack rolls and saves against fear.","oath":false,"save":"none"},{"n":"Bless Water","l":1,"x":"Makes holy water.","oath":false,"save":"none"},{"n":"Bless Weapon","l":1,"x":"Weapon strikes true against evil foes.","oath":false,"save":"none"},{"n":"Create Water","l":1,"x":"Creates 2 gallons/level of pure water.","oath":false,"save":"none"},{"n":"Cure Light Wounds","l":1,"x":"Cures 1d8 damage + 1/level (max +5).","oath":false,"save":"Will half (harmless); see text"},{"n":"Detect Poison","l":1,"x":"Detects poison in one creature or small object.","oath":false,"save":"none"},{"n":"Detect Undead","l":1,"x":"Reveals undead within 60 ft.","oath":false,"save":"none"},{"n":"Divine Favor","l":1,"x":"Gain +1 per three caster levels on attack and weapon damage rolls.","oath":false,"save":"none (harmless)"},{"n":"Endure Elements","l":1,"x":"Exist comfortably in hot or cold environments.","oath":false,"save":"none (harmless)"},{"n":"Magic Weapon","l":1,"x":"Weapon gains +1 enhancement bonus.","oath":false,"save":"none"},{"n":"Protection from Chaos","l":1,"x":"+2 AC and saves, plus protection against chaotic mental control and summoned creatures.","oath":false,"save":"Will negates (harmless); see text"},{"n":"Protection from Evil","l":1,"x":"+2 AC and saves, plus protection against evil mental control and summoned creatures.","oath":false,"save":"Will negates (harmless); see text"},{"n":"Read Magic","l":1,"x":"Read magical inscriptions.","oath":false,"save":"none"},{"n":"Resistance","l":1,"x":"Subject gains +1 resistance bonus on saving throws.","oath":false,"save":"none (harmless)"},{"n":"Lesser Restoration","l":1,"x":"Dispels magical ability penalties or cures 1d4 temporary ability damage; also helps fatigue/exhaustion.","oath":false,"save":"none (harmless)"},{"n":"Virtue","l":1,"x":"Subject gains 1 temporary hit point.","oath":false,"save":"none (harmless)"},{"n":"Bull's Strength","l":2,"x":"Subject gains +4 enhancement bonus to Strength.","oath":false,"save":"none (harmless)"},{"n":"Delay Poison","l":2,"x":"Stops poison from harming subject for 1 hour/level.","oath":false,"save":"none (harmless)"},{"n":"Eagle's Splendor","l":2,"x":"Subject gains +4 enhancement bonus to Charisma.","oath":false,"save":"none (harmless)"},{"n":"Owl's Wisdom","l":2,"x":"Subject gains +4 enhancement bonus to Wisdom.","oath":false,"save":"none (harmless)"},{"n":"Remove Paralysis","l":2,"x":"Frees one or more creatures from paralysis or related effects.","oath":false,"save":"none (harmless)"},{"n":"Resist Energy","l":2,"x":"Grants resist energy 10 (20 at CL 7, 30 at CL 11) against one chosen energy type, protecting the subject's gear as well. Note: this is the same spell whether prepared as the normal 2nd-level version or as the Oath Against Fiends/Oath of the Crusade 1st-level oath spell; the saving throw is identical either way.","oath":false,"save":"Fortitude negates (harmless); SR yes (harmless)"},{"n":"Shield Other","l":2,"x":"You take half of the subject’s hit point damage while the spell lasts.","oath":false,"save":"none (harmless)"},{"n":"Undetectable Alignment","l":2,"x":"Conceals alignment from magical detection for 24 hours.","oath":false,"save":"none"},{"n":"Zone of Truth","l":2,"x":"Creatures in the area that fail their save cannot deliberately lie.","oath":false,"save":"Will negates"},{"n":"Cure Moderate Wounds","l":3,"x":"Cures 2d8 damage + 1/level (max +10).","oath":false,"save":"Will half (harmless); see text"},{"n":"Daylight","l":3,"x":"Object sheds bright light in a 60-foot radius.","oath":false,"save":"none"},{"n":"Discern Lies","l":3,"x":"Reveals deliberate falsehoods while you concentrate.","oath":false,"save":"none"},{"n":"Dispel Magic","l":3,"x":"Cancels a spell or magical effect.","oath":false,"save":"none"},{"n":"Heal Mount","l":3,"x":"Heals and removes many adverse conditions from your special mount.","oath":false,"save":"none (harmless)"},{"n":"Magic Circle against Chaos","l":3,"x":"As protection from chaos, but in a 10-foot-radius emanation.","oath":false,"save":"Will negates (harmless); see text"},{"n":"Magic Circle against Evil","l":3,"x":"As protection from evil, but in a 10-foot-radius emanation.","oath":false,"save":"Will negates (harmless); see text"},{"n":"Greater Magic Weapon","l":3,"x":"Weapon gains +1 enhancement bonus per four caster levels (max +5).","oath":false,"save":"none"},{"n":"Prayer","l":3,"x":"Allies gain +1 luck bonus on many rolls; foes take –1.","oath":false,"save":"none"},{"n":"Remove Blindness/Deafness","l":3,"x":"Cures normal or magical blindness or deafness.","oath":false,"save":"none (harmless)"},{"n":"Remove Curse","l":3,"x":"Frees a creature or object from curses, subject to caster-level checks where required.","oath":false,"save":"none (harmless)"},{"n":"Break Enchantment","l":4,"x":"Frees subjects from enchantments, transmutations, and curses.","oath":false,"save":"none"},{"n":"Cure Serious Wounds","l":4,"x":"Cures 3d8 damage + 1/level (max +15).","oath":false,"save":"Will half (harmless); see text"},{"n":"Death Ward","l":4,"x":"Protects against death effects, energy drain, and negative energy.","oath":false,"save":"none (harmless)"},{"n":"Dispel Chaos","l":4,"x":"Protects against chaotic creatures and can banish or dispel certain chaotic effects.","oath":false,"save":"see text"},{"n":"Dispel Evil","l":4,"x":"Protects against evil creatures and can banish or dispel certain evil effects.","oath":false,"save":"see text"},{"n":"Holy Sword","l":4,"x":"Melee weapon functions as a +5 holy weapon and projects magic circle against evil.","oath":false,"save":"none"},{"n":"Mark of Justice","l":4,"x":"Places a conditional curse on a willing or restrained subject.","oath":false,"save":"none"},{"n":"Neutralize Poison","l":4,"x":"Neutralizes poison in a creature or object.","oath":false,"save":"Will negates (harmless, object)"},{"n":"Restoration","l":4,"x":"Restores ability damage/drain and negative levels as described by the spell.","oath":false,"save":"none (harmless)"},{"n":"Wrath","l":1,"x":"Designates one visible enemy and grants +1 morale bonus (per 3 caster levels, min +1, max +3) on attack and damage rolls against it, plus the same bonus on caster level checks against its SR; grants Improved Critical against that target at 12th level.","oath":true,"save":"none"},{"n":"Confess","l":2,"x":"Asks the target a single question it must answer truthfully on its next action or take damage and become sickened for 2d4 rounds; a successful save negates the sickening and halves the damage.","oath":true,"save":"Will partial; see text"},{"n":"Blessing of Fervor","l":3,"x":"Each round, affected allies choose one of: +30 ft speed, standing as a swift action without provoking, an extra attack at their highest base attack bonus, +2 on attacks/dodge AC/Reflex, or casting a single 2nd-level-or-lower spell with a metamagic feat applied for free.","oath":true,"save":"Fortitude negates (harmless); SR yes (harmless)"},{"n":"Order's Wrath","l":4,"x":"Channels lawful energy in a grid pattern that damages non-lawful creatures (with a chance to stun them) while dealing reduced damage to neutral creatures, who get an additional save option.","oath":true,"save":"Will partial; see text; SR yes"},{"n":"Animal Purpose Training","l":1,"x":"Overrides an animal's general purpose training (e.g. combat, guard, riding) with a new one for the duration; original training and tricks return when the spell ends.","oath":false,"save":"none"},{"n":"Aspect of the Nightingale","l":1,"x":"Grants a clear, pleasant voice for bonuses to Perform and Diplomacy checks, and lets you reroll once per minute a saving throw against a charm effect that allows one.","oath":false,"save":"none"},{"n":"Bed of Iron","l":1,"x":"Lets the touched creature sleep comfortably in medium or heavy armor without suffering fatigue the next day.","oath":false,"save":"Fort negates (harmless)"},{"n":"Blessed Fist","l":1,"x":"Target's unarmed strikes count as armed (no attacks of opportunity) and deal lethal or nonlethal damage at will; if already unarmed-capable, they instead gain +1 enhancement and count as good-aligned weapons.","oath":false,"save":"none"},{"n":"Blessing of the Watch","l":1,"x":"Functions like bless but only within the caster's home city or areas patrolled by its watch, displaying the worshiped deity's symbol above affected allies.","oath":false,"save":"Will negates"},{"n":"Bowstaff","l":1,"x":"A touched bow becomes rigid enough to be wielded as a melee weapon (shortbow as club, longbow as quarterstaff) while keeping its hit points, hardness, and enhancement bonuses.","oath":false,"save":"Will negates (harmless, object)"},{"n":"Build Trust","l":1,"x":"Grants a +2 circumstance bonus on Charisma checks and Charisma-based skill checks with the target, and lets you reroll a failed one as an immediate action.","oath":false,"save":"Will negates"},{"n":"Challenge Evil","l":1,"x":"Grants +2 sacred bonus on melee attacks against the target; the target becomes sickened if it hasn't attacked you by the end of its turn, and the spell ends if you move away.","oath":false,"save":"Will negates"},{"n":"Compel Hostility","l":1,"x":"Forces creatures threatening you in melee to attack you instead of your allies if they fail a Will save (or lack SR); a summoner may instead target their own eidolon.","oath":false,"save":"see text; SR see text"},{"n":"Conditional Favor","l":1,"x":"Cast immediately before another spell on a willing creature; if that creature later violates an attached oath or prohibition, the paired spell (and any healing/conditions it removed) is undone.","oath":false,"save":"none (see below)"},{"n":"Deadeye's Arrow","l":1,"x":"A conjured electricity arrow that either makes a ranged touch attack for 1d6 damage +1/level (max +5), or bursts harmlessly at maximum range as a bright thunderous signal.","oath":false,"save":"none"},{"n":"Detect Charm","l":1,"x":"Functions like detect magic but specifically reveals charm, compulsion, and possession auras within a 60-foot cone, with increasing detail over 3 rounds of concentration.","oath":false,"save":"none"},{"n":"Detect Demon","l":1,"x":"Reveals the presence, then number and power, then exact location of demons and Abyssal-corrupted creatures/taint over 3 rounds of concentration.","oath":false,"save":"none (see text)"},{"n":"Detect the Faithful","l":1,"x":"Detects worshipers of your deity within a 60-foot cone, revealing presence, then count, then exact location over 3 rounds of concentration.","oath":false,"save":"none"},{"n":"Diagnose Disease","l":1,"x":"Reveals whether a creature, object, or area carries a disease/infestation and identifies it, granting +4 on Heal checks to treat a diagnosed creature.","oath":false,"save":"none; SR no"},{"n":"Emblazon Crest","l":1,"x":"Any tabard, tunic, or shield the subject wears or carries displays the subject's chosen coat of arms, regardless of the item's actual appearance.","oath":false,"save":"Will negates (harmless)"},{"n":"Empower Holy Water","l":1,"x":"Empowers 1-3 vials of holy water (scaling with caster level) to deal bonus damage equal to caster level (max +10) to undead on a direct hit, half that on a splash hit.","oath":false,"save":"none (object)"},{"n":"Enhance Water","l":1,"x":"Transforms water into a middling alcoholic beverage while purging poisons, disease, minerals, and toxins from it.","oath":false,"save":"Fort negates (harmless, object)"},{"n":"Firebelly","l":1,"x":"Grants fire resistance 5 and lets you breathe a 15-foot cone of flame for 1d4 fire damage as a standard action, each use shortening the spell's remaining duration by 1 minute.","oath":false,"save":"Reflex half; see text"},{"n":"Ghostbane Dirge","l":1,"x":"Makes an incorporeal target semi-physical, so it takes half damage from nonmagical attacks but full damage from magic weapons and effects.","oath":false,"save":"Will negates"},{"n":"Grace","l":1,"x":"Your movement provokes no attacks of opportunity until the end of your turn.","oath":false,"save":"none"},{"n":"Guardian Armor","l":1,"x":"Teleports your worn armor onto a same-size, same-shape ally within range, instantly equipping them with its benefits; their prior armor falls harmlessly aside.","oath":false,"save":"none"},{"n":"Haze of Dreams","l":1,"x":"Fills the target's mind with waking dreams, halving its speed for the duration; doesn't stack with itself or with slow.","oath":false,"save":"Will negates"},{"n":"Hedging Weapons","l":1,"x":"Summons floating force weapons granting +1 deflection bonus to AC per weapon (max +5); each can be thrown as a ranged attack for 2d6 force damage, reducing the AC bonus and disappearing.","oath":false,"save":"none"},{"n":"Hero's Defiance","l":1,"x":"The instant before you'd drop to 0 or fewer hit points, lets you expend a lay on hands use to heal yourself (plus 1d6 extra) and remain conscious if it brings you above 0 hp.","oath":false,"save":"none"},{"n":"Honeyed Tongue","l":1,"x":"Lets you roll twice and keep the higher result on Diplomacy checks to shift attitude, or gain a +5 competence bonus on Diplomacy checks to gather information.","oath":false,"save":"none"},{"n":"Horn of Pursuit","l":1,"x":"Creates the sound of a large hunting horn audible up to 2 miles, letting you send simple coded messages via short or long notes.","oath":false,"save":"none"},{"n":"Ironbeard","l":1,"x":"Grows a stiff iron beard granting +1 armor bonus to AC (stacking with worn armor) that counts as cold iron, but imposes a 20% arcane spell failure chance.","oath":false,"save":"Fort negates (harmless)"},{"n":"Keep Watch","l":1,"x":"Lets subjects stand watch all night without ill effect, gaining the restorative benefits of full sleep while remaining awake and alert, though any fighting or vigorous activity ends the effect.","oath":false,"save":"Will negates (harmless)"},{"n":"Knight's Calling","l":1,"x":"Compels an enemy to move its full speed directly toward you and do nothing else, letting you make an attack of opportunity if it ends its move adjacent to you.","oath":false,"save":"Will negates"},{"n":"Know the Enemy","l":1,"x":"Grants a +10 insight bonus on Knowledge checks about one specific creature type you encountered within the last day.","oath":false,"save":"none"},{"n":"Liberating Command","l":1,"x":"Grants the target an immediate-action Escape Artist check against a bind/grapple/restraint with a competence bonus equal to twice your caster level (max +20).","oath":false,"save":"Will negates (harmless)"},{"n":"Linebreaker","l":1,"x":"Grants a +20-foot bonus to speed when charging and a +2 bonus on bull rush and overrun combat maneuver checks for 1 minute per level.","oath":false,"save":"none"},{"n":"Litany of Sloth","l":1,"x":"The target can no longer take attacks of opportunity or cast spells defensively, and cannot be affected by another 'litany' spell while under this one.","oath":false,"save":"Will negates"},{"n":"Longshot","l":1,"x":"Grants a +10-foot bonus to the range increment of the subject's weapon for 1 minute per caster level.","oath":false,"save":"none"},{"n":"Positive Pulse","l":1,"x":"A burst of positive energy deals 1d6 damage + 1/2 caster levels (max +5) to undead and positive-energy-vulnerable creatures on a failed save, while living creatures gain +2 on saves vs. death effects, energy drain, negative energy, and haunts for 1 round.","oath":false,"save":"Will negates or Will negates (harmless); see text"},{"n":"Rally Point","l":1,"x":"Creates a 5-foot favorable zone where entering good-aligned creatures gain a +2 morale bonus on attacks/saves and 2 temporary hit points per caster level for 1 round, once each.","oath":false,"save":"Will negates (harmless)"},{"n":"Rite of Bodily Purity","l":1,"x":"Grants a +2 resistance bonus on saves against disease, drugs, and poison, with a one-time immediate-action reroll on a failed such save before the spell ends.","oath":false,"save":"none"},{"n":"Sanctify Corpse","l":1,"x":"Protects a corpse so attempts to raise it as undead automatically fail, postponing any such effect from the slaying creature until the spell ends; renewable daily or made permanent via permanency.","oath":false,"save":"none; SR no"},{"n":"Shield of Fortification","l":1,"x":"Gives a 25% chance that a critical hit or sneak attack against the target is negated and its damage rolled normally instead.","oath":false,"save":"Fort negates (harmless)"},{"n":"Shield of Shards","l":1,"x":"Fractures a wielded shield into 2 or more orbiting shards (max 12) that lose the shield's AC bonus but can each be directed to attack an adjacent foe for 1d4+ damage; the shield reforms when the spell ends.","oath":false,"save":"none; SR no"},{"n":"Songbird","l":1,"x":"Depending on use, grants +3 to a concurrent Perform check, lets you activate a bardic performance without spending a daily round, or increases the save DC of a sonic-descriptor spell by 1.","oath":false,"save":"none"},{"n":"Stunning Barrier","l":1,"x":"Grants +1 deflection bonus to AC and +1 resistance bonus on saves; the first creature to hit you with a melee attack must save or be stunned for 1 round, ending the spell.","oath":false,"save":"none and Will negates (see text); SR no and yes (see text)"},{"n":"Swift Girding","l":1,"x":"Instantly and properly equips multiple willing targets in unworn suits of armor of your choosing.","oath":false,"save":"none; SR yes (harmless)"},{"n":"Sun Metal","l":1,"x":"A weapon ignites with harmless flame that deals an extra 1d4 fire damage on hits (not multiplied on a critical), ending if submerged and unable to stack with flaming or function on frost weapons.","oath":false,"save":"Fort negates (object)"},{"n":"Tactical Acumen","l":1,"x":"Grants an extra +1 insight bonus (scaling up to +4 with level) whenever you or allies gain a tactical bonus such as flanking, high ground, or cover.","oath":false,"save":"Will negates (harmless)"},{"n":"Touch of Truthtelling","l":1,"x":"Functions like zone of truth on a touched creature, which briefly and visibly takes on the momentary appearance of a lawful outsider (archon or inevitable) while compelled.","oath":false,"save":"Consultar manual"},{"n":"Tracking Mark","l":1,"x":"Lowers Survival DCs to track the target by 5 and grants a +5 bonus on Perception checks to notice it using Stealth or to recognize it in disguise.","oath":false,"save":"Will negates"},{"n":"Unbreakable Heart","l":1,"x":"Grants +4 morale bonus on saves against mind-affecting effects rooted in negative emotion (despair, rage, fear) and suppresses an existing such effect; a charmed target also gets a new save if ordered to harm a true ally.","oath":false,"save":"Will negates (harmless)"},{"n":"Veil of Heaven","l":1,"x":"Grants +2 sacred bonus to AC and saves against evil outsiders; can be dismissed as a swift action to deal 1d8 damage + 1/paladin level (Will half) to all such outsiders within 5 feet.","oath":false,"save":"Will half"},{"n":"Veil of Positive Energy","l":1,"x":"Grants +2 sacred bonus to AC and saves against undead; can be dismissed to deal damage equal to your level to all undead within 5 feet.","oath":false,"save":"none"},{"n":"Wartrain Mount","l":1,"x":"Grants a target animal the combat general purpose training, overriding its previous trained purpose and tricks until the spell ends, when they return.","oath":false,"save":"none"},{"n":"Weapons Against Evil","l":1,"x":"Causes wielded weapons to glow with pale light (illuminating 5 feet) and bypass damage reduction of 5 or lower (not DR/epic) possessed by evil creatures.","oath":false,"save":"Fort negates (harmless, object)"},{"n":"Word of Resolve","l":1,"x":"Lets an ally reroll a failed save against fear or charm with a +4 sacred bonus, but only protects against fear if you have aura of courage, or charm if you have aura of resolve.","oath":false,"save":"Will negate (harmless)"},{"n":"Abeyance","l":2,"x":"Suppresses the effects of a single curse afflicting a creature without restoring damage or drain the curse caused; does not work on curses immune to remove curse.","oath":false,"save":"Will negates (harmless)"},{"n":"Angelic Aspect, Lesser","l":2,"x":"Grants low-light vision, acid resistance 5, cold resistance 5, and the benefits of protection from evil.","oath":false,"save":"none; SR no"},{"n":"Aquatic Cavalry","l":2,"x":"Summons 1 hippocampus (plus 1 per 3 caster levels, max 6) to serve as combat-trained mounts that avoid combat unless attacked.","oath":false,"save":"none; SR no"},{"n":"Arrow of Law","l":2,"x":"Ranged touch attack with an arrow of order dealing 1d8/2 caster levels (max 5d8) to chaotic creatures, or 1d6/level (max 10d6) plus 1-round daze to chaotic outsiders; half damage to neutral creatures, none to lawful.","oath":false,"save":"Will partial (see text); SR yes"},{"n":"Aura of Greater Courage","l":2,"x":"Makes all allies within your aura of courage immune to fear (magical or otherwise); requires you to possess the aura of courage class feature.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Bestow Grace","l":2,"x":"Grants a good creature a sacred bonus on all saving throws equal to its Charisma modifier (if positive) for 1 minute per caster level.","oath":false,"save":"Will (harmless); SR yes (harmless)"},{"n":"Bestow Weapon Proficiency","l":2,"x":"Grants the target proficiency with one weapon (including exotic weapons) for 1 minute per caster level, as long as they're holding it.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Blade Tutor's Spirit","l":2,"x":"Conjures a spirit that reduces attack penalties from voluntary defensive actions or feats like Power Attack by 1 (plus 1 per 5 caster levels).","oath":false,"save":"none"},{"n":"Blessing of Courage and Life","l":2,"x":"Grants +2 morale bonus on saves against fear and death effects; can be ended as a swift action to heal 1d8 damage +1/caster level (max +10).","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Blessings of Luck and Resolve","l":2,"x":"Grants +2 morale bonus on saves against fear (or immunity if already fearless); on a failed fear save, lets you reroll once as an immediate action with a +4 morale bonus, accepting the new result.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Blinding Ray","l":2,"x":"Fires 1 (plus more at higher levels, max 3) ray(s) of sunlight as ranged touch attacks that blind the target for 1 round (or 1d4 rounds plus 1d4 damage/2 levels if light-vulnerable).","oath":false,"save":"Fort negates; SR yes"},{"n":"Bullet Ward","l":2,"x":"Summons hovering adamantine bullets (half caster level, max 4) that can be expended as an immediate action to grant +10 AC against one firearm attack, destroying the bullet regardless of outcome.","oath":false,"save":"none"},{"n":"Carry Companion","l":2,"x":"Transforms a willing animal or magical beast into an inert, petrification-like stone figurine that can be restored to normal form by touching it and speaking a command word.","oath":false,"save":"none; SR yes (harmless)"},{"n":"Corruption Resistance","l":2,"x":"Grants the touched creature and its gear damage reduction of 5 (10 at CL 7, 15 at CL 11) against magical effects of a chosen alignment (chaos, evil, good, or law).","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Delay Disease","l":2,"x":"Grants 1 day of immunity to new diseases, or suspends an existing disease if the caster beats its DC with a caster level check; doesn't heal existing disease damage.","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Divine Arrow","l":2,"x":"Imbues a projectile with holy energy dealing bonus damage to undead equal to your lay on hands die (not multiplied on a crit); requires an available lay on hands use without expending it.","oath":false,"save":"none; SR no"},{"n":"Divine Illumination","l":2,"x":"Creates a 10-ft spread of light that illuminates undead, imposing a -20 Stealth penalty and negating invisibility-based location concealment; first exposure forces a Will save or the undead loses channel resistance and takes -2 on saves vs. positive energy.","oath":false,"save":"Will partial; SR yes"},{"n":"Effortless Armor","l":2,"x":"Removes speed reduction from worn armor and reduces its armor check penalty by 1 (plus 1 per 5 caster levels, max 5).","oath":false,"save":"none"},{"n":"Endure Elements, Communal","l":2,"x":"Functions like endure elements, except the duration is divided in 1-hour intervals among the creatures touched.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Fairness","l":2,"x":"Compels affected humanoids to conduct trades fairly according to their knowledge of value and prevents them from cheating in exchanges.","oath":false,"save":"Will negates; SR yes"},{"n":"Fire of Entanglement","l":2,"x":"Wraps the target in flames that leave it entangled for the duration, or unable to move at all if it starts its turn adjacent to the caster; a successful save limits the effect to 1 round.","oath":false,"save":"Reflex partial; SR yes"},{"n":"Holy Javelin","l":2,"x":"Conjures a javelin of holy energy that deals 1d6 damage to an evil target on a ranged touch hit (dissipating harmlessly against other alignments), then continues dealing 1d6/round while lodged, glowing to reveal the target's location and imposing -2 on attacks/skill checks.","oath":false,"save":"none; SR yes"},{"n":"Holy Shield","l":2,"x":"Lets you project your shield's AC bonus onto an ally within 30 feet as a swift action (losing it yourself), redirectable each turn or reverting if the target moves out of range.","oath":false,"save":"none; SR no"},{"n":"Instant Armor","l":2,"x":"Creates a suit of force armor (type scaling with caster level, up to full plate) replacing worn garments, or a lesser armor type with a magical enhancement bonus instead.","oath":false,"save":"none"},{"n":"Ironskin","l":2,"x":"Hardens your skin for a +4 enhancement bonus to natural armor (plus 1 per 4 caster levels above 4th), and can be dismissed to negate a confirmed critical hit or sneak attack from a physical weapon.","oath":false,"save":"none"},{"n":"Life Shield","l":2,"x":"Surrounds you with a positive energy field that deals half the damage back to any undead that hits you in melee, until it has dealt 5 points per caster level (max 50) or the duration ends.","oath":false,"save":"none"},{"n":"Light Lance","l":2,"x":"Conjures a +1 holy lance of radiance usable as a weapon for the duration, or as a bright 90-ft beacon visible up to 2 additional miles at night.","oath":false,"save":"none"},{"n":"Litany of Defense","l":2,"x":"Doubles any enhancement bonus from your armor and grants immunity to fear; you cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"no; SR yes"},{"n":"Litany of Eloquence","l":2,"x":"Fascinates the target with a compelling diatribe, causing it to do nothing but listen (subject to normal fascination rules); it cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"no; SR yes"},{"n":"Litany of Entanglement","l":2,"x":"Conjures chains of energy that entangle the target (no effect on flying or airborne creatures); it cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"Will negates; SR yes"},{"n":"Litany of Righteousness","l":2,"x":"Doubles damage dealt to an evil target by creatures with a good aura, and dazzles evil-subtype targets for 1d4 rounds on a hit.","oath":false,"save":"Will negates; SR yes"},{"n":"Litany of Warding","l":2,"x":"Grants two bonus attacks of opportunity this round plus a +2 sacred bonus to AC against them; cannot be stacked with other 'litany' spells.","oath":false,"save":"none"},{"n":"Magic Siege Engine","l":2,"x":"Grants +1 to attack and damage rolls for an indirect-fire siege engine, or functions as magic weapon on a direct-fire siege engine, for 1 minute per caster level.","oath":false,"save":"Will negates (harmless, object); SR yes (harmless, object)"},{"n":"Martyr's Bargain","l":2,"x":"Cast as an immediate action to delay incoming spell damage by a number of rounds equal to your caster level, at which point it hits maximized as though affected by Maximize Spell; only one instance can affect you at a time.","oath":false,"save":"none; SR no"},{"n":"Paladin's Sacrifice","l":2,"x":"Lets you take on the damage and effects of an attack or failed save that would otherwise hit a nearby creature, as if you had been the target instead.","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Protection from Chaos, Communal","l":2,"x":"Functions like protection from chaos, except the duration is divided in 1-minute intervals among the creatures touched.","oath":false,"save":"Will negates (harmless); SR no; see text"},{"n":"Protection from Evil, Communal","l":2,"x":"Functions like protection from evil, except the duration is divided in 1-minute intervals among the creatures touched.","oath":false,"save":"Will negates (harmless); SR no; see text"},{"n":"Protection From Outsiders","l":2,"x":"Grants +4 deflection bonus to AC and +4 resistance on saves against a chosen outsider subtype, a new save with +4 morale bonus against that subtype's mental control, and blocks bodily contact from summoned creatures of that subtype.","oath":false,"save":"see text"},{"n":"Righteous Vigor","l":2,"x":"Each successful melee hit grants a cumulative +1 morale bonus to attack rolls (max +4) and 1d8 temporary hit points (max 20); a miss resets the attack bonus but keeps accrued temporary hp.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Righteous Blood","l":2,"x":"When an evil creature damages the good-aligned target with a slashing or piercing melee weapon, it takes 1d6 divine damage (2d6 if the target has the good subtype or aura).","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Sacred Bond","l":2,"x":"Lets you and a touched creature deliver touch-range conjuration (healing) spells to each other at close range while both wear a pair of golden bracelets; removing a bracelet ends the spell.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Sacred Space","l":2,"x":"Sanctifies an area, adding +2 to DCs of good spells/channeled energy against evil outsiders there, imposing -1 on evil outsiders' attacks/damage/saves, and blocking their summoning into the area.","oath":false,"save":"none; SR no"},{"n":"Saddle Surge","l":2,"x":"Grants you and your mount a +1 competence bonus on Ride checks per 5 feet moved that round, and a +1 morale bonus on weapon/natural attack damage for one round, both capped at your caster level.","oath":false,"save":"Consultar manual"},{"n":"Sea Steed","l":2,"x":"Grants a mounted creature the aquatic subtype, the amphibious quality, and a swim speed equal to its base speed, at the cost of 10 feet of ground speed (minimum 10 ft).","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Sense Madness","l":2,"x":"Detects whether nearby creatures suffer from madness, addiction, sanity damage, or magical compulsion, revealing specifics and aiding dispelling with continued concentration.","oath":false,"save":"none; SR no"},{"n":"Stave Off Corruption","l":2,"x":"Grants a +2 circumstance bonus on saves against the advancement of an existing corruption; doesn't stack with itself or with morale/profane/sacred bonuses.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Shield Companion","l":1,"x":"Functions as shield other, but affects only the caster's animal companion, familiar, or fiendish servant.","oath":false,"save":"none; SR yes (harmless)"},{"n":"Soothing Word","l":2,"x":"Reduces the severity of one qualifying condition by a step (e.g. nauseated to sickened, stunned to dazed, paralyzed to staggered) without shortening its duration.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Spiritual Squire","l":2,"x":"Creates an indestructible-to-physical-attacks force construct that can fetch/carry items (up to 10 lb/caster level), aid another using your BAB + Wisdom modifier, or help allies don armor faster.","oath":false,"save":"none; SR no"},{"n":"Suppress Charms and Compulsions","l":2,"x":"Grants +4 morale bonus on saves against charm/compulsion effects for 10 minutes, or lets you actively suppress an existing charm/compulsion (and block new ones) while concentrating, up to 1 round per caster level.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Vestment of the Champion","l":2,"x":"Functions as magic vestment, but affects only armor or a shield worn/carried by you, losing effect if someone else takes it and resuming when you have it again.","oath":false,"save":"none; SR no"},{"n":"Wake of Light","l":2,"x":"You and a mount leave a glowing mist that treats difficult terrain as normal for good creatures and normal terrain as difficult for evil creatures, with no effect on neutral ones.","oath":false,"save":"none; SR yes"},{"n":"Weapon of Awe","l":2,"x":"Grants a weapon a +2 sacred bonus to damage rolls, and automatically shakes the target for 1 round on a confirmed critical hit.","oath":false,"save":"Will negates (harmless, object); SR yes (harmless, object)"},{"n":"Widen Auras","l":2,"x":"Doubles the range of your paladin or antipaladin auras (e.g. aura of courage extends from 10 feet to 20 feet).","oath":false,"save":"none"},{"n":"Winged Sword","l":2,"x":"Grows small feathered wings on a weapon, granting it the throwing special weapon ability for the spell's duration.","oath":false,"save":"Will negates (harmless, object)"},{"n":"Accept Affliction","l":3,"x":"Transfers a curse, disease, poison, or condition (blindness, deafness, fatigue, nausea, shaken, sickened) from a touched creature onto yourself.","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Angelic Aspect","l":3,"x":"Grants darkvision 60 ft, acid and cold resistance 10, DR 5/evil, white feathered wings for 30-ft flight, and good-aligned weapons for overcoming DR.","oath":false,"save":"none; SR no"},{"n":"Archon's Aura","l":3,"x":"Grants an aura like an archon's aura of menace; hostile creatures within 20 feet take -2 on attacks, saves, and AC until they hit you or succeed on a Will save, and cannot be affected again by that casting.","oath":false,"save":"Will negates; SR yes"},{"n":"Aura of Inviolate Ownership","l":3,"x":"Increases the DC to steal or palm the target's attended items by 20 and grants +20 to CMD against disarm and steal maneuvers.","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Bestow Auras","l":3,"x":"Transfers one or more of your paladin/antipaladin auras to another creature as their center point, while you keep the aura's personal benefit.","oath":false,"save":"Will negates (harmless); SR yes"},{"n":"Blade of Bright Victory","l":3,"x":"Grants your divine bond weapon the ghost touch property, lets you change its damage type as a swift action, and adds a sacred bonus (half caster level) to CMD against disarm and sunder.","oath":false,"save":"Will negates (harmless); SR no"},{"n":"Blessing of the Mole","l":3,"x":"Grants the targets darkvision 30 feet and a +2 competence bonus on Stealth checks.","oath":false,"save":"none (harmless); SR yes (harmless)"},{"n":"Burst of Speed","l":3,"x":"Grants +20 feet to speed (+10 in medium/heavy armor) until the end of your turn, with movement that provokes no attacks of opportunity and can pass through larger creatures' spaces.","oath":false,"save":"none"},{"n":"Damnation","l":3,"x":"Deals holy damage in a 30-ft burst based on the highest-level evil spell known or affecting each enemy present.","oath":false,"save":"Will half; SR yes"},{"n":"Daybreak Arrow","l":3,"x":"Enchants ammunition so struck creatures suffer bright-light penalties for 1 round (plus 1d6 extra damage to undead/light-vulnerable creatures), and the projectile glows like a sunrod for 1 round after firing.","oath":false,"save":"Fort negates (harmless, object); SR yes (harmless, object)"},{"n":"Deadly Juggernaut","l":3,"x":"Grants a stacking +1 luck bonus (max +5) on melee attack/damage rolls, Strength checks, and DR 2/- (max 10/-) for each qualifying foe (HD within 4 of yours) you kill in melee.","oath":false,"save":"none"},{"n":"Delay Poison, Communal","l":3,"x":"Functions like delay poison, except the duration is divided in 1-hour intervals among the creatures touched.","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Detect Anxieties","l":3,"x":"Functions like detect thoughts but reveals creatures' anxieties, Wisdom scores, and fear conditions over 3 rounds, granting a bonus to Intimidate a creature with its own anxiety.","oath":false,"save":"Will negates (see text); SR no"},{"n":"Detect Desires","l":3,"x":"Functions like detect thoughts but reveals creatures' Charisma scores and most pressing desires over several rounds of concentration.","oath":false,"save":"Will negates (see text)"},{"n":"Divine Transfer","l":3,"x":"Heals the touched target up to your Constitution score in hit points (not exceeding its max) and grants it DR against evil equal to your Charisma bonus for the duration.","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Draconic Malice","l":3,"x":"Creates a 10-ft aura that strips fear/mind-affecting immunity from creatures within it when targeted by your fear effects or Intimidate checks; doubles the antipaladin aura of cowardice penalty if you have it.","oath":false,"save":"Will negates (harmless); SR no"},{"n":"Fire of Judgment","l":3,"x":"Your next smite evil engulfs the target in positive-energy flames dealing 1d6 (1d10 vs. evil outsiders/dragons/undead) each turn, plus an extra 1d6/1d10 if it attacks someone other than you, unless it saves to limit the effect to 1 round.","oath":false,"save":"Will partial; SR yes"},{"n":"Ghostbane Dirge, Mass","l":3,"x":"Functions as ghostbane dirge, except it affects one incorporeal creature per level, no two of which can be more than 30 feet apart.","oath":false,"save":"Will negates; SR yes"},{"n":"Firewalker's Meditation","l":3,"x":"Grants DR 5/magic, fire resistance 10, and +4 on saves against pain effects, expendable as an immediate action to boost to DR 10/magic, fire resistance 30, and pain immunity for 3 rounds.","oath":false,"save":"none"},{"n":"Guardian Monument, Lesser","l":3,"x":"Grants DR 2/magic to humans within 40 feet (60 if the touched object is a monument to human achievement), retained even if they leave and return.","oath":false,"save":"Will negates (harmless); SR yes"},{"n":"Heroic Fortune","l":3,"x":"Grants the target one hero point, usable before any it already has, lost if unspent when the spell ends.","oath":false,"save":"Will negates (harmless); SR no"},{"n":"Holy Whisper","l":3,"x":"Sickens evil creatures in a cone unless they save (evil outsiders, evil dragons, and undead also take 2d8 damage on a failure); good creatures in the area get +2 sacred bonus on attack and damage for 1 round.","oath":false,"save":"Fort negates; see text"},{"n":"Litany of Escape","l":3,"x":"Extracts an ally from a grapple, removing the grappled/pinned conditions and teleporting them 10 feet away (fails if no space is available).","oath":false,"save":"no; SR yes"},{"n":"Litany of Sight","l":3,"x":"Lets you perceive invisible creatures and objects within 30 feet; the target cannot be affected by another 'litany' spell while active.","oath":false,"save":"no; SR yes"},{"n":"Mantle of Calm","l":3,"x":"Surrounds you with calming energy giving enemies +2 on saves against your spells (and you -2 on attack rolls); raging creatures that strike you must save or have their rage end.","oath":false,"save":"none and Will negates (see text); SR no and yes (see text)"},{"n":"Marks of Forbiddance","l":3,"x":"Brands one enemy and one ally; either must succeed at a Will save to attack the other (including targeted spells), wasting the action on failure, though area effects bypass the restriction.","oath":false,"save":"Will negates; see text"},{"n":"Positive Pulse, Greater","l":3,"x":"Functions like positive pulse, but deals 3d6 + caster level damage to undead/haunts and grants living creatures a +8 bonus against the relevant effects for 1 round.","oath":false,"save":"Will negates or Will negates (harmless); see text"},{"n":"Resilient Reservoir","l":3,"x":"Stores 1 point per melee/touch-spell hit you take (up to caster level) that can be spent as an immediate action for an insight bonus on a check/attack/damage/CMB roll; if you drop to negative hp while charged, it releases as a 15-ft blast dealing 1d6 per 2 points (max 10d6).","oath":false,"save":"none (see below); SR yes"},{"n":"Resist Energy, Communal","l":3,"x":"Functions like resist energy, except the duration is divided in 10-minute intervals among the creatures touched.","oath":false,"save":"Fortitude negates (harmless); SR yes (harmless)"},{"n":"Revenant Armor","l":3,"x":"If the wearer is knocked unconscious or killed, the armor animates as a Medium animated object carrying the body, preventing helplessness and gaining abilities from its material.","oath":false,"save":"none; SR no"},{"n":"Sanctify Armor","l":3,"x":"Grants armor a +1 enhancement bonus per 4 caster levels (max +5), and grants DR 5/evil while using judgment or smite.","oath":false,"save":"Will negates (harmless, object)"},{"n":"Sanctify Weapons","l":3,"x":"Lets manufactured weapons in the area bypass the damage reduction of a chosen evil outsider subtype without becoming aligned or changing composition.","oath":false,"save":"Will negates (harmless, object)"},{"n":"Scales of Deflection","l":3,"x":"Surrounds you with draconic imagery so touch attacks against you resolve against your normal AC instead of touch AC; ends after one such attack resolves, at the latest by the end of your next turn.","oath":false,"save":"none"},{"n":"Shield of Fortification, Greater","l":3,"x":"Functions as shield of fortification, except the chance to negate a critical hit or sneak attack (rolling damage normally instead) increases to 50%.","oath":false,"save":"Fort negates (harmless); SR yes (harmless)"},{"n":"Sky Steed","l":3,"x":"Sprouts angelic wings on the target, granting flight equal to its base speed with average maneuverability plus a Fly check bonus equal to caster level.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Spotlight","l":3,"x":"Creates a mobile bright light on the target that suppresses other light sources within 20 feet, imposing -20 on Stealth and denying darkness-based concealment; a successful save keeps the light stationary instead.","oath":false,"save":"Reflex partial; SR yes"},{"n":"Stunning Barrier, Greater","l":3,"x":"Functions as stunning barrier, except it isn't discharged until it has stunned a number of creatures equal to your caster level.","oath":false,"save":"none and Will negates (see text); SR no and yes (see text)"},{"n":"Tail Strike","l":3,"x":"Grows (or extends the reach of) a draconic tail granting a tail slam secondary attack for 1d6 damage plus Strength modifier (scaling by size).","oath":false,"save":"none"},{"n":"They Know","l":3,"x":"Convinces the target that another creature knows its darkest secret, compelling it to investigate; if it cannot, it becomes shaken for the duration.","oath":false,"save":"Will negates; SR yes"},{"n":"Trial By Fire","l":3,"x":"Exposes a touched creature to divine fire dealing 1d6 damage per 2 caster levels (max 5d6, half fire/half divine) if it isn't within one alignment step of your deity; also lets you attempt an Intimidate check against directly opposed targets.","oath":false,"save":"None; SR yes"},{"n":"Vigilant Rest","l":3,"x":"Lets a sleeping target retain partial perception, ignoring the usual +10 Perception penalty while asleep and waking as a free action upon detecting a threat.","oath":false,"save":"Will (harmless); SR yes (harmless)"},{"n":"Wrathful Mantle","l":3,"x":"Grants a resistance bonus of +1 per 4 caster levels (max +5) on all saves, dismissible as a swift action to deal 2d8 force damage to creatures within 5 feet.","oath":false,"save":"Will negates (harmless)"},{"n":"Absolution","l":4,"x":"Removes charm and compulsion effects from the target and prevents forced actions from those effects costing it class abilities; cannot reverse alignment changes or restore abilities lost to willing misdeeds.","oath":false,"save":"none; SR no"},{"n":"Angelic Aspect, Greater","l":4,"x":"Grants darkvision 60 ft, DR 10/evil, immunity to acid/cold/petrification, electricity and fire resistance 10, +4 on poison saves, a protective aura within 20 feet, truespeech, and 60-ft flight wings.","oath":false,"save":"none; SR no"},{"n":"Archon's Trumpet","l":4,"x":"All creatures in the area of the burst are paralyzed for 1d4 rounds.","oath":false,"save":"Fort negates; SR yes"},{"n":"Ban Corruption","l":4,"x":"Strips all creatures in the emanation of abilities granted by corruptions, which cease to function as if dispelled.","oath":false,"save":"Will negates; SR yes"},{"n":"Banishing Blade","l":4,"x":"Imbues a weapon so its first strike each round triggers a free bull rush (1d20 + caster level); extraplanar creatures with HD up to your caster level pushed back 10+ feet must save or be banished to their home plane.","oath":false,"save":"none and Will partial (see text)"},{"n":"Bestow Grace of the Champion","l":4,"x":"Grants the target paladin-like abilities: at-will detect evil, immunity to disease and fear, one use of lay on hands, one smite evil, a Charisma bonus on saves, and the ability to use spellcasting-restricted magic items.","oath":false,"save":"yes (harmless)"},{"n":"Blaze of Glory","l":4,"x":"You fall unconscious and unleash a 30-ft burst that heals good creatures (and damages evil creatures) 1d6 per 2 caster levels, while all affected creatures gain the benefits of prayer for 1 round per caster level.","oath":false,"save":"Will partial; SR yes"},{"n":"Blessings of Luck and Resolve, Mass","l":4,"x":"Functions like blessings of luck and resolve, except it affects one creature per level, no two of which can be more than 30 feet apart.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Bloodsworn Retribution","l":4,"x":"You cut yourself and swear an oath, taking up to 25 unhealable damage while active, gaining a morale bonus (damage taken / 5) on actions performed to fulfill that oath.","oath":false,"save":"none"},{"n":"Burst of Glory","l":4,"x":"Allies within a 10-ft radius of you gain +1 sacred bonus on attacks and fear saves plus temporary hit points equal to your level (max 20); you also shed torchlight, dismissible as a free action.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Burst With Light","l":4,"x":"Fills the target with magical light for 2d6 damage (2d8 to undead), making it shed bright light in a 30-ft radius; adjacent creatures that fail a save take half damage and are blinded for 1 round.","oath":false,"save":"see text; SR yes"},{"n":"Chains of Light","l":4,"x":"Binds a creature in glowing chains of light, paralyzing it (new save each round to break free) and blocking extradimensional travel abilities while bound.","oath":false,"save":"Reflex negates; SR no"},{"n":"Companion Transposition","l":4,"x":"Swaps your position with your animal companion, familiar, or spirit animal via teleportation; you're unable to act until your next turn and the companion is staggered until the end of its next turn.","oath":false,"save":"none (harmless); SR no"},{"n":"Crusader's Edge","l":4,"x":"Grants a melee weapon the bane quality against evil outsiders; a critical hit against one nauseates it for 1d3 rounds (reducible to sickened 1 round with a Fortitude save).","oath":false,"save":"Fort negates; SR no"},{"n":"Dimensional Blade","l":4,"x":"Turns a wielded melee weapon flat and two-dimensional, making its attacks melee touch attacks that ignore armor (but not force effects); bludgeoning weapons deal half damage and count as slashing; ends if it leaves your hand.","oath":false,"save":"none"},{"n":"Eaglesoul","l":4,"x":"Infuses you with a good outsider's power, granting Perception/initiative bonuses and constant detect evil, plus an activatable surge granting AC/Strength bonuses, energy resistance, fast healing, and automatic critical confirmation against evil foes.","oath":false,"save":"none"},{"n":"Fire of Vengeance","l":4,"x":"Engulfs the next target of your smite evil in holy flames; if it attacks anyone but you during the smite, it takes 3d8 fire damage, and the spell ends once triggered or the smite expires.","oath":false,"save":"none; SR no"},{"n":"Flash Forward","l":4,"x":"Lets you make a charge attack against an enemy as part of casting, then instantly teleport back to your original position as a free action, keeping any damage/conditions dealt.","oath":false,"save":"none (harmless); SR no"},{"n":"Forced Repentance","l":4,"x":"Overwhelms an evil creature (without the evil subtype) with remorse, causing it to fall prone and confess its sins aloud for the duration, ending if you break line of sight or it's attacked.","oath":false,"save":"Will negates; SR yes"},{"n":"Forceful Strike","l":4,"x":"Cast during a melee attack to add 1d4 force damage per caster level (max 10d4) to the hit, potentially bull rushing the target back on a failed Fortitude save.","oath":false,"save":"Fortitude partial; SR yes"},{"n":"Guardian of Faith","l":4,"x":"Grants the target shield of faith plus a chosen protection from chaos/evil/good/law effect; the target can transfer the spell to a touched ally as a move action.","oath":false,"save":"Will negates (harmless); SR no"},{"n":"Invoke Deity","l":4,"x":"Assumes an aspect of your deity, letting you choose one domain to gain its granted powers (which can be swapped by concentrating, at a 10-minute duration cost); individual domain effects use this spell's save DC where applicable.","oath":false,"save":"see text"},{"n":"King's Castle","l":4,"x":"Teleports you into an ally's space while that ally teleports into your former space, swapping their positions.","oath":false,"save":"Will negates (harmless); SR yes (harmless)"},{"n":"Litany of Thunder","l":4,"x":"Permanently deafens the target and leaves it confused for 1 round; it cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"Fort negates; SR yes"},{"n":"Litany of Vengeance","l":4,"x":"Grants any creature that hits the target a +5 sacred or profane bonus (matching your alignment) to that attack's damage; the target cannot be affected by another 'litany' spell while under it.","oath":false,"save":"no; SR yes"},{"n":"Magic Siege Engine, Greater","l":4,"x":"Grants an indirect-fire siege engine +1 per 4 caster levels (max +5) on targeting and damage rolls, or functions as greater magic weapon on a direct-fire siege engine.","oath":false,"save":"Will negates (harmless, object); SR yes (harmless, object)"},{"n":"Oath of Peace","l":4,"x":"Grants +5 sacred bonus to AC and saves plus DR 10/evil, but ends immediately if you make any attack or act with hostility toward any creature.","oath":false,"save":"none"},{"n":"Paragon Surge","l":4,"x":"Temporarily grants +2 enhancement to Dexterity and Intelligence and the benefit of one qualifying feat of your choice, while keeping your form and extraordinary/supernatural abilities.","oath":false,"save":"none"},{"n":"Planeslayer's Call","l":4,"x":"After choosing an alignment subtype, grants allies +2 on caster level checks to beat the spell resistance of matching outsiders and lets their spells ignore the first 10 points of that subtype's energy resistance.","oath":false,"save":"none; SR yes"},{"n":"Raise Animal Companion","l":4,"x":"Functions like raise dead, but can only restore life to an animal companion, familiar, or paladin's bonded mount.","oath":false,"save":"none, see text; SR yes (harmless)"},{"n":"Red Hand of the Killer","l":4,"x":"Permanently and indelibly stains the right hand of whoever directly killed the corpse used as a focus, though it can be hidden by magic or covering.","oath":false,"save":"Will negates; SR yes"},{"n":"Reprobation","l":4,"x":"Casts the target out from their faith, marking them visibly to the faith's members, making them immune to (and treated as an enemy by) the faithful's helpful spells, and stripping faith-based class abilities.","oath":false,"save":"none; SR yes"},{"n":"Resounding Blow","l":4,"x":"A melee hit deals 1d6 sonic damage and staggers the target for 1 round if delivered via judgment/smite; a critical hit instead stuns it 1 round and deafens it 1d6 rounds; ends if the weapon leaves your hand.","oath":false,"save":"Fortitude partial; see text"},{"n":"Sacred Nimbus","l":4,"x":"Surrounds you in golden light that deals 1d6 + 1/caster level (max +15) damage to evil creatures that strike you, while you take half damage from evil-descriptor magical attacks (none on a successful Reflex save).","oath":false,"save":"none"},{"n":"Sacrificial Oath","l":4,"x":"Creates a bond letting you absorb damage and failed-save effects that would hit a touched creature instead, taking full damage or Constitution damage as backlash; ends if line of sight is broken.","oath":false,"save":"Fortitude negates (harmless); SR yes (harmless)"},{"n":"Sea Stallion","l":4,"x":"Functions like sea steed, but also grants you the amphibious quality and freedom of movement on your melee attacks while mounted; amphibious lingers about a minute after dismounting.","oath":false,"save":"none"},{"n":"Shield of Dawn","l":4,"x":"Manifests a sunlight disk on your arm that deals 1d6 + 1/caster level (max +15) fire damage to melee attackers and sheds continual-flame-level light; doesn't stack with similar auras like fire shield.","oath":false,"save":"see text"},{"n":"Speak with Soul","l":4,"x":"Lets you hold a normal (not just question-based) conversation with a deceased creature's soul at its location, drawing on its living knowledge without compelling truthfulness.","oath":false,"save":"Will negates; see text; SR no"},{"n":"Stay the Hand","l":4,"x":"Prevents the target from striking a chosen creature, wasting its action on a failed save, or imposing -5 on attack/damage if it saves; either way it takes -2 on attacks/damage against that creature for the duration.","oath":false,"save":"Will partial; SR yes"},{"n":"Symbol of Healing","l":4,"x":"Bathes creatures within 60 feet in positive energy, healing 2d8 + 1/caster level (max +15); undead or positive-vulnerable creatures instead take that damage (Will half); each creature affected once per 24 hours.","oath":false,"save":"Will half (harmless) (see text)"}]; const BASE={"4": [0, 0, 0, 0], "5": [1, 0, 0, 0], "6": [1, 0, 0, 0], "7": [1, 0, 0, 0], "8": [1, 1, 0, 0], "9": [2, 1, 0, 0], "10": [2, 1, 0, 0], "11": [2, 1, 1, 0], "12": [2, 2, 1, 0], "13": [3, 2, 1, 0], "14": [3, 2, 1, 1], "15": [3, 2, 2, 1], "16": [3, 3, 2, 1], "17": [4, 3, 2, 1], "18": [4, 3, 2, 2], "19": [4, 3, 3, 2], "20": [4, 4, 3, 3]}; const KEY='gabrielPaladinSpellbookPF1CoreV1';
const $=id=>document.getElementById(id);let state=JSON.parse(localStorage.getItem(KEY)||'{}');state.level??=7;state.cha??=20;state.prep??={};state.oathPrep??={};state.used??=[0,0,0,0];state.show??=[1,2,3,4];state.fav??={};
for(let i=1;i<=20;i++)$('level').add(new Option(i,i));for(let i=8;i<=30;i++)$('cha').add(new Option(i,i));$('level').value=state.level;$('cha').value=state.cha;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function mod(){return Math.floor((state.cha-10)/2)}
function bonus(l){let m=mod();if(m<l)return 0;return 1+Math.floor((m-l)/4)}
function baseSlots(l){return (BASE[state.level]||[0,0,0,0])[l-1]||0}const MIN_LEVEL={1:4,2:7,3:10,4:13};function canCast(l){return state.level>=MIN_LEVEL[l]&&state.cha>=10+l&&(baseSlots(l)>0||bonus(l)>0)}
function normalSlots(l){return canCast(l)?baseSlots(l)+bonus(l):0}function oathSlot(l){return canCast(l)?1:0}function prepCount(l){return Object.entries(state.prep).filter(([k,v])=>v&&+k.split('|')[0]===l).reduce((a,[k,v])=>a+v,0)}
function oathPrepCount(l){return state.oathPrep[l]?1:0}function totalDaily(){let n=0;for(let l=1;l<=4;l++)n+=normalSlots(l)+oathSlot(l);return n}
function renderButtons(){let b=$('levelButtons');b.innerHTML='';let all=document.createElement('button');all.textContent='All';all.className=state.show.length===4?'active':'';all.onclick=()=>{state.show=[1,2,3,4];save();render()};b.appendChild(all);for(let l=1;l<=4;l++){let x=document.createElement('button');x.textContent='Level '+l;x.className=(state.show.length<4&&state.show.includes(l))?'active':'';x.onclick=()=>{if(state.show.length===4){state.show=[l]}else if(state.show.includes(l)){let next=state.show.filter(v=>v!==l);state.show=next.length?next:[1,2,3,4]}else{state.show=[...state.show,l].sort()};save();render()};b.appendChild(x)}}
function renderSlots(){let b=$('slots');b.innerHTML='';for(let l=1;l<=4;l++){let d=document.createElement('div');d.className='slot'+(canCast(l)?'':' disabled');let n=normalSlots(l),o=oathSlot(l),used=Math.min(state.used[l-1]||0,n+o);state.used[l-1]=used;d.innerHTML=`<b>L${l}</b> ${n+o-used}/${n+o} remaining<br><small>${n} normal + ${o} oath</small>`;d.onclick=()=>{if(!canCast(l))return;state.used[l-1]=(used+1)%(n+o+1);save();renderSlots()};b.appendChild(d)}}
function renderList(){let q=$('search').value.toLowerCase(),f=$('filter').value,out=$('list');out.innerHTML='';for(let l of state.show){let arr=SPELLS.filter(s=>s.l===l&&(s.n+' '+s.x).toLowerCase().includes(q));arr=arr.filter(s=>{let key=l+'|'+s.n,p=(state.prep[key]||0)>0,op=state.oathPrep[l]===s.n,fav=!!state.fav[key];if(f==='prepared')return p||op;if(f==='unprepared')return !p&&!op;if(f==='oath')return s.oath;if(f==='favorites')return fav;return true});if(!arr.length)continue;let sec=document.createElement('section');sec.innerHTML=`<h2>Level ${l} <span class="dc">DC ${10+l+mod()}</span></h2><div class="grid"></div>`;let g=sec.querySelector('.grid');arr.sort((a,b)=>a.n.localeCompare(b.n)).forEach(s=>{let key=l+'|'+s.n,c=state.prep[key]||0,op=state.oathPrep[l]===s.n,fav=!!state.fav[key],card=document.createElement('div');card.className='card'+(s.oath?' oath':'')+(canCast(l)?'':' disabled');card.innerHTML=`<div class="head"><div><div class="name">${s.n}</div>${s.oath?'<div class="badge">Oath spell</div>':''}${s.save?`<div class="savebadge">Save: ${s.save}</div>`:''}</div><div class="prep"><button class="favbtn${fav?' active':''}" title="Favorite" aria-label="Favorite">${fav?'★':'☆'}</button>${s.oath?`<button class="ob">${op?'Oath ✓':'Oath'}</button>`:''}<button class="minus">−</button><span class="count">${c}</span><button class="plus">+</button></div></div><details class="desc"><summary>Description</summary>${s.x}</details>`;card.querySelector('.plus').onclick=()=>{if(!canCast(l))return;if(prepCount(l)>=normalSlots(l))return alert('All normal level '+l+' preparation slots are already filled.');state.prep[key]=c+1;save();render()};card.querySelector('.minus').onclick=()=>{if(c>0){state.prep[key]=c-1;save();render()}};card.querySelector('.favbtn').onclick=()=>{if(fav)delete state.fav[key];else state.fav[key]=true;save();render()};let ob=card.querySelector('.ob');if(ob)ob.onclick=()=>{if(!canCast(l))return;state.oathPrep[l]=op?null:s.n;save();render()};g.appendChild(card)});out.appendChild(sec)}}
function render(){$('cl').textContent=state.level<4?'—':state.level-3;$('daily').textContent=totalDaily();$('prepared').textContent=Object.values(state.prep).reduce((a,v)=>a+(+v||0),0);$('oathprep').textContent=Object.values(state.oathPrep).filter(Boolean).length;$('ruleNote').textContent='Preparation is tracked per spell level. Each castable spell level has '+ 'one separate oath slot; with multiple oaths, choose one oath spell for that slot.';renderButtons();renderSlots();renderList()}
$('level').onchange=e=>{state.level=+e.target.value;state.used=[0,0,0,0];save();render()};$('cha').onchange=e=>{state.cha=+e.target.value;state.used=[0,0,0,0];save();render()};$('search').oninput=renderList;$('filter').onchange=renderList;$('newDay').onclick=()=>{state.used=[0,0,0,0];save();render()};$('clear').onclick=()=>{state.prep={};state.oathPrep={};save();render()};render();</script></body></html>
