function save(){localStorage.setItem(KEY,JSON.stringify(state))}function mod(){return Math.floor((state.cha-10)/2)}
function bonus(l){let m=mod();if(m<l)return 0;return 1+Math.floor((m-l)/4)}
function baseSlots(l){return (BASE[state.level]||[0,0,0,0])[l-1]||0}const MIN_LEVEL={1:4,2:7,3:10,4:13};function canCast(l){return state.level>=MIN_LEVEL[l]&&state.cha>=10+l&&(baseSlots(l)>0||bonus(l)>0)}

function renderButtons(){let b=$('levelButtons');b.innerHTML='';let all=document.createElement('button');all.textContent='All';all.className=state.show.length===4?'active':'';all.onclick=()=>{state.show=[1,2,3,4];save();render()};b.appendChild(all);for(let l=1;l<=4;l++){let x=document.createElement('button');x.textContent='Level '+l;x.className=(state.show.length<4&&state.show.includes(l))?'active':'';x.onclick=()=>{if(state.show.length===4){state.show=[l]}else if(state.show.includes(l)){let next=state.show.filter(v=>v!==l);state.show=next.length?next:[1,2,3,4]}else{state.show=[...state.show,l].sort()};save();render()};b.appendChild(x)}}

function renderList(){let q=$('search').value.toLowerCase(),f=$('filter').value,out=$('list');out.innerHTML='';for(let l of state.show){let arr=SPELLS.filter(s=>s.l===l&&(s.n+' '+s.x).toLowerCase().includes(q));arr=arr.filter(s=>{let key=l+'|'+s.n,p=(state.prep[key]||0)>0,op=state.oathPrep[l]===s.n,fav=!!state.fav[key];if(f==='prepared')return p||op;if(f==='unprepared')return !p&&!op;if(f==='oath')return s.oath;if(f==='favorites')return fav;return true});if(!arr.length)continue;let sec=document.createElement('section');sec.innerHTML=`<h2>Level ${l}</h2><div class="grid"></div>`;let g=sec.querySelector('.grid');arr.sort((a,b)=>a.n.localeCompare(b.n)).forEach(s=>{let key=l+'|'+s.n,c=state.prep[key]||0,op=state.oathPrep[l]===s.n,fav=!!state.fav[key],card=document.createElement('div');card.className='card'+(s.oath?' oath':'')+(canCast(l)?'':' disabled');card.innerHTML=`<div class="head"><div><div class="name">${s.n}</div>${s.oath?'<div class="badge">Oath spell</div>':''}</div><div class="prep"><button class="favbtn${fav?' active':''}" title="Favorite" aria-label="Favorite">${fav?'★':'☆'}</button>${s.oath?`<button class="ob">${op?'Oath ✓':'Oath'}</button>`:''}<button class="minus">−</button><span class="count">${c}</span><button class="plus">+</button></div></div><details class="desc"><summary>Description</summary>${s.x}</details>`;card.querySelector('.plus').onclick=()=>{if(!canCast(l))return;if(prepCount(l)>=normalSlots(l))return alert('All normal level '+l+' preparation slots are already filled.');state.prep[key]=c+1;save();render()};card.querySelector('.minus').onclick=()=>{if(c>0){state.prep[key]=c-1;save();render()}};card.querySelector('.favbtn').onclick=()=>{if(fav)delete state.fav[key];else state.fav[key]=true;save();render()};let ob=card.querySelector('.ob');if(ob)ob.onclick=()=>{if(!canCast(l))return;state.oathPrep[l]=op?null:s.n;save();render()};g.appendChild(card)});out.appendChild(sec)}}
