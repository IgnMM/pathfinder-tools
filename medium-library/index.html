<style>
:root{--bg:#0f1117;--panel:#181c24;--panel2:#202633;--text:#eef2f7;--muted:#9ba7b7;--gold:#d5ad55;--gold2:#f1d78b;--border:#313949}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;background:#0f1117;color:var(--text)}header,main{max-width:1180px;margin:auto;padding:12px 16px}header{border-bottom:1px solid var(--border)}h1{margin:0;font-size:1.35rem}.sub{color:var(--muted);font-size:.78rem;margin:2px 0 8px}label{font-size:.68rem;color:var(--muted);display:block;margin-bottom:2px}select,input{width:100%;background:#121721;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px}.levels{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;cursor:pointer}button.active,button.primary{background:#5a4318;border-color:#816427;color:#fff1c2}.toolbar{display:grid;grid-template-columns:1fr 160px auto;gap:6px;margin-bottom:8px}.count{color:var(--muted);font-size:.78rem;margin:4px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}section{margin:8px 0 14px}h2{font-size:.95rem;color:var(--gold2);margin:6px 0}.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:750}.savebadge{font-size:.58rem;color:var(--muted);margin-top:2px}.sourcebadge{font-size:.56rem;color:#7d8aa3;margin-top:2px;font-style:italic}.desc{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.25}.desc summary{cursor:pointer;color:var(--gold2);font-size:.68rem;list-style:none}.desc summary::-webkit-details-marker{display:none}.desc summary:before{content:"▸ ";display:inline-block}.desc[open] summary:before{content:"▾ "}.desc[open] summary{margin-bottom:3px}.stat-block{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:5px 7px;margin-bottom:5px}.stat-row{font-size:.68rem;line-height:1.5}.stat-row b{color:var(--gold2);font-weight:700;margin-right:4px}.effect-text p{margin:0 0 6px}.effect-text p:last-child{margin-bottom:0}.favbtn{background:none;border:none;font-size:1.1rem;line-height:1;cursor:pointer;padding:0 4px;color:var(--muted)}.favbtn.active{color:var(--gold2)}.sourcesbox{position:relative}.sourcesbox summary{cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.78rem;list-style:none;white-space:nowrap}.sourcesbox summary::-webkit-details-marker{display:none}.sourcesbox[open] summary{border-color:var(--gold)}.sourcesPanel{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px;z-index:20;max-height:300px;overflow-y:auto;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.sourcesPanel label{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text);padding:3px 0;cursor:pointer}.sourcesPanel input{width:auto}.sourcesPanel .srcActions{display:flex;gap:6px;margin-bottom:6px}.sourcesPanel .srcActions button{font-size:.65rem;padding:4px 7px}
@media(max-width:780px){header,main{padding:6px 8px}.toolbar{grid-template-columns:1fr;gap:4px}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px}.card{padding:6px}.name{font-size:.8rem}.desc{font-size:.62rem}}
</style>

<header><h1>Medium Spell Library</h1><div class="sub">Pathfinder 1e — full Medium spell list (its own distinct list). A reference tool for browsing, searching, and shortlisting spells — not a session play-tool: no character level, no caster stats, no daily preparation tracking.</div>
<div class="levels" id="levelButtons"></div>
<div class="levels" id="ctButtons"></div>
</header><main>
<div class="toolbar"><div class="searchWrap"><svg class="searchIcon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="search" placeholder="Search spell name or description..."><button id="searchClear" type="button" title="Clear search" aria-label="Clear search">&times;</button></div><style>.searchWrap{position:relative}.searchWrap input{padding-left:26px;padding-right:24px}.searchIcon{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.searchWrap button{position:absolute;right:1px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;padding:4px 7px}.searchWrap button:hover{color:var(--text)}</style><select id="filter"><option value="all">All spells</option><option value="favorites">Favorites only</option></select><select id="archetype"><option value="">— Base Medium —</option><option value="Storm Dreamer">Storm Dreamer</option></select><details class="sourcesbox"><summary>Sources</summary><div class="sourcesPanel"><div class="srcActions"><button id="srcAll" type="button">All</button><button id="srcNone" type="button">None</button><button id="srcResetGlobal" type="button" title="Follow the site-wide Valid Sources selection again">Reset to global</button></div><div id="sourcesNote" style="font-size:.62rem;color:var(--muted);margin-bottom:4px"></div><div id="sourceList"></div></div></details></div>
<div class="count" id="resultCount"></div>
<div id="list"></div>
</main>
<script src="../assets/valid-sources.js"></script>
<script src="../assets/casting-time.js"></script>
<script src="../assets/spell-crossref.js"></script>
<script>
const STORE_KEY='mediumSpellLibraryPF1V1';
const $=id=>document.getElementById(id);
function statRow(label,val){return val?`<div class="stat-row"><b>${label}</b> ${val}</div>`:''}
function loadStore(){
  let raw=localStorage.getItem(STORE_KEY);
  if(raw){try{let s=JSON.parse(raw);if(s)return s}catch(e){}}
  return {fav:{},excludedSources:{},show:[0,1,2,3,4,5,6],sourcesCustomized:false};
}
let store=loadStore();
if(store.sourcesCustomized===undefined) store.sourcesCustomized=Object.keys(store.excludedSources||{}).length>0;
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(store));}
function currentSpells(){let a=ARCHETYPES[store.archetype];return (a&&a.spells)||SPELLS;}
function applyGlobalSources(){
  if(store.sourcesCustomized) return;
  let allSrc=[...new Set(currentSpells().map(s=>s.source||'Unknown'))];
  store.excludedSources=PFSources.computeExcludedSources(allSrc, PFSources.loadGlobalExcludedLocal());
}
let PRESENT_CT=[];
function renderCtButtons(){
  let b=$('ctButtons'); if(!b) return;
  if(PRESENT_CT.length<2){ b.style.display='none'; b.innerHTML=''; return; }
  b.style.display=''; b.innerHTML='';
  let shown=store.ctShow||PRESENT_CT;
  let all=document.createElement('button');all.textContent='All';all.className=shown.length===PRESENT_CT.length?'active':'';
  all.onclick=()=>{store.ctShow=null;save();renderList();renderCtButtons()};
  b.appendChild(all);
  PRESENT_CT.forEach(c=>{
    let x=document.createElement('button');x.textContent=PFCastingTime.CT_LABELS[c];
    x.className=(shown.length<PRESENT_CT.length&&shown.includes(c))?'active':'';
    x.onclick=()=>{
      let cur=store.ctShow||PRESENT_CT.slice();
      if(cur.length===PRESENT_CT.length){store.ctShow=[c]}
      else if(cur.includes(c)){let next=cur.filter(v=>v!==c);store.ctShow=next.length?next:null}
      else{store.ctShow=[...cur,c]}
      save();renderList();renderCtButtons()
    };
    b.appendChild(x)
  });
}

function renderButtons(){
  let b=$('levelButtons');b.innerHTML='';
  let all=document.createElement('button');all.textContent='All';all.className=store.show.length===7?'active':'';
  all.onclick=()=>{store.show=[0,1,2,3,4,5,6];save();renderList()};b.appendChild(all);
  for(let l=0;l<=6;l++){
    let x=document.createElement('button');x.textContent=l===0?'Orisons':'L'+l;
    x.className=(store.show.length<7&&store.show.includes(l))?'active':'';
    x.onclick=()=>{
      if(store.show.length===7){store.show=[l]}
      else if(store.show.includes(l)){let next=store.show.filter(v=>v!==l);store.show=next.length?next:[0,1,2,3,4,5,6]}
      else{store.show=[...store.show,l].sort((a,b)=>a-b)}
      save();renderList()
    };
    b.appendChild(x)
  }
}
function buildCard(s){
  let key=s.l+'|'+s.n;
  let fav=!!store.fav[key];
  let card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="head"><div><div class="name">${s.n} <span style="color:var(--muted);font-weight:400;font-size:.72rem">L${s.l}</span></div>${s.save?`<div class="savebadge">Save: ${s.save}</div>`:''}${s.source?`<div class="sourcebadge">${s.source}</div>`:''}</div><button class="favbtn${fav?' active':''}" title="Favorite" aria-label="Favorite">${fav?'★':'☆'}</button></div><details class="desc"><summary>Description</summary><div class="stat-block">${statRow('School',s.school)}${statRow('Casting Time',s.castingTime)}${statRow('Components',s.components)}${statRow('Range',s.range)}${statRow('Target/Area',s.target)}${statRow('Duration',s.duration)}${statRow('Saving Throw',s.save)}${statRow('Spell Resistance',s.sr)}</div><div class="effect-text">${(s.effect||'').split('\n\n').map(p=>`<p>${PFSpellRefs.linkify(p,s.n)}</p>`).join('')}</div></details>`;
  card.querySelector('.favbtn').onclick=()=>{if(fav)delete store.fav[key];else store.fav[key]=true;save();renderList()};
  return card;
}
function renderList(){
  let q=$('search').value.toLowerCase(),f=$('filter').value,out=$('list');out.innerHTML='';
  let total=0;
  for(let l of store.show){
    let ctShown=store.ctShow||PRESENT_CT;
    let arr=currentSpells().filter(s=>s.l===l&&(s.n+' '+(s.effect||'')).toLowerCase().includes(q)&&!store.excludedSources[s.source||'Unknown']&&(()=>{let cats=PFCastingTime.ctCategory(s.castingTime);return cats.length===0||cats.some(c=>ctShown.includes(c))})());
    if(f==='favorites')arr=arr.filter(s=>!!store.fav[l+'|'+s.n]);
    if(!arr.length)continue;
    total+=arr.length;
    let sec=document.createElement('section');
    sec.innerHTML=`<h2>${l===0?'Orisons (0-level)':'Level '+l}</h2><div class="grid"></div>`;
    let g=sec.querySelector('.grid');
    arr.sort((a,b)=>a.n.localeCompare(b.n)).forEach(s=>g.appendChild(buildCard(s)));
    out.appendChild(sec);
  }
  $('resultCount').textContent=total+' spell'+(total===1?'':'s')+' shown';
}
function renderSources(){
  let box=$('sourceList');box.innerHTML='';
  let all=[...new Set(currentSpells().map(s=>s.source||'Unknown'))].sort();
  all.forEach(src=>{
    let lbl=document.createElement('label');
    let cb=document.createElement('input');cb.type='checkbox';cb.checked=!store.excludedSources[src];
    cb.onchange=()=>{store.sourcesCustomized=true;if(cb.checked)delete store.excludedSources[src];else store.excludedSources[src]=true;save();renderList();renderSourcesNote()};
    lbl.appendChild(cb);lbl.appendChild(document.createTextNode(src));box.appendChild(lbl);
  });
  renderSourcesNote();
}
function renderSourcesNote(){
  let el=$('sourcesNote');if(!el)return;
  el.textContent=store.sourcesCustomized?'Customized for this page':'Following the site\'s global Valid Sources';
}
$('search').oninput=renderList;$('searchClear').onclick=()=>{$('search').value='';renderList();$('search').focus()};
$('filter').onchange=renderList;
$('srcAll').onclick=()=>{store.sourcesCustomized=true;store.excludedSources={};save();renderSources();renderList()};
$('srcNone').onclick=()=>{store.sourcesCustomized=true;[...new Set(currentSpells().map(s=>s.source||'Unknown'))].forEach(src=>store.excludedSources[src]=true);save();renderSources();renderList()};
$('srcResetGlobal').onclick=()=>{store.sourcesCustomized=false;applyGlobalSources();save();renderSources();renderList()};
$('archetype').value=store.archetype||'';
$('archetype').onchange=()=>{store.archetype=$('archetype').value;save();renderSources();renderList()};

// Full Medium spell list, derived from this site's own spell-master-index.json.
// with its own distinct spell list (real overlap with Sorcerer/Wizard's list, but not
// identical), levels 0-6 only, confirmed against the class's own "Spells Known" table.
const ARCHETYPES={"Storm Dreamer":{"source":"Adventurer's Guide pg. (Storm Dreamer)","note":"Gozreh's Domain: selects one of Gozreh's domains (Air, Animal, Plant, Water, or Weather); the 1st-6th level bonus spells from that domain are added to her spell list, cast as psychic spells. Modeled here using the Weather domain (obscuring mist, fog cloud, call lightning, sleet storm, ice storm, control winds); the Air/Animal/Plant/Water alternatives are not modeled.","spells":[{"n":"Bleed","l":0,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One living creature","duration":"Instantaneous","save":"Will negates","sr":"Yes","effect":"You cause a living creature that is below 0 hit points but stabilized to resume dying. Upon casting this spell, you target a living creature that has –1 or fewer hit points. That creature begins dying, taking 1 point of damage per round. The creature can be stabilized later normally. This spell causes a creature that is dying to take 1 point of damage.","source":"Core Rulebook"},{"n":"Dancing Lights","l":0,"school":"evocation [light]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"up to four lights, all within a 10-ft.-radius area","duration":"1 minute (D)","save":"none","sr":"no","effect":"Depending on the version selected, you create up to four lights that resemble lanterns or torches (and cast that amount of light), or up to four glowing spheres of light (which look like will-o'-wisps), or one faintly glowing, vaguely humanoid shape. The dancing lights must stay within a 10-foot-radius area in relation to each other but otherwise move as you desire (no concentration required): forward or back, up or down, straight or turning corners, or the like. The lights can move up to 100 feet per round. A light winks out if the distance between you and it exceeds the spell's range.\n\nYou can only have one dancing lights spell active at any one time. If you cast this spell while another casting is still in effect, the previous casting is dispelled. If you make this spell permanent, it does not count against this limit.\n\nDancing lights can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 263"},{"n":"Daze","l":0,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a pinch of wool or similar substance)","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature of 4 HD or less","duration":"1 round","save":"Will negates","sr":"yes","effect":"This spell clouds the mind of a humanoid creature with 4 or fewer Hit Dice so that it takes no actions. Humanoids of 5 or more HD are not affected. A dazed subject is not stunned, so attackers get no special advantage against it. After a creature has been dazed by this spell, it is immune to the effects of this spell for 1 minute.","source":"PRPG Core Rulebook pg. 264"},{"n":"Detect Magic","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 min./level (D)","save":"none","sr":"no","effect":"You detect magical auras. The amount of information revealed depends on how long you study a particular area or subject.\n\n1st Round: Presence or absence of magical auras.\n\n2nd Round: Number of different magical auras and the power of the most potent aura.\n\n3rd Round: The strength and location of each aura. If the items or creatures bearing the auras are in line of sight, you can make Knowledge (arcana) skill checks to determine the school of magic involved in each. (Make one check per aura: DC 15 + spell level, or 15 + 1/2 caster level for a nonspell effect.) If the aura eminates from a magic item, you can attempt to identify its properties (see Spellcraft).\n\nMagical areas, multiple types of magic, or strong local magical emanations may distort or conceal weaker auras.\n\nAura Strength: An aura's power depends on a spell's functioning spell level or an item's caster level; see the accompanying table. If an aura falls into more than one category, detect magic indicates the stronger of the two.\n\nLingering Aura: A magical aura lingers after its original source dissipates (in the case of a spell) or is destroyed (in the case of a magic item). If detect magic is cast and directed at such a location, the spell indicates an aura strength of dim (even weaker than a faint aura). How long the aura lingers at this dim level depends on its original power:\n\nOriginal StrengthDuration of Lingering AuraFaint1d6 roundsModerate1d6 minutesStrong1d6 x 10 minutesOverwhelming1d6 days\nOutsiders and elementals are not magical in themselves, but if they are summoned, the conjuration spell registers. Each round, you can turn to detect magic in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.\n\nDetect magic can be made permanent with a permanency spell.\n\nSpell or ObjectAura PowerFaintModerateStrongOverwhelmingFunctioning spell (spell level)3rd or lower4th-6th7th-9th10th+ (deity-level)Magic item (caster level)5th or lower6th-11th12th-20th21st+ (artifact)","source":"PRPG Core Rulebook pg. 267"},{"n":"Detect Psychic Significance","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"40 ft.","target":"40-ft.-radius burst, centered on you","duration":"instantaneous","save":"none","sr":"no","effect":"You detect the presence of psychically significant items in your vicinity. Such items are those that might have significant psychic imprints or histories that can be read by the psychometry occult skill unlock (see page 196), or items under the effects of the charge object or implant false reading spells. Items within range that contain significant psychic energy spark a recognition in your mind’s eye, but no other information is imparted. This spell doesn’t automatically detect magic items or strongly aligned items, though such items often have storied histories and might have had previous owners who possessed psychic abilities.","source":"Occult Adventures pg. 164"},{"n":"Flare","l":0,"school":"evocation [light]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"burst of light","duration":"instantaneous","save":"Fortitude negates","sr":"yes","effect":"This cantrip creates a burst of light. If you cause the light to burst in front of a single creature, that creature is dazzled for 1 minute unless it makes a successful Fortitude save. Sightless creatures, as well as creatures already dazzled, are not affected by flare.","source":"PRPG Core Rulebook pg. 284"},{"n":"Ghost Sound","l":0,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, M (a bit of wool or a small lump of wax)","range":"close (25 ft. + 5 ft./2 levels)","target":"illusory sounds","duration":"1 round/level (D)","save":"Will disbelief","sr":"no","effect":"Ghost sound allows you to create a volume of sound that rises, recedes, approaches, or remains at a fixed place. You choose what type of sound ghost sound creates when casting it and cannot thereafter change the sound's basic character.\n\nThe volume of sound created depends on your level. You can produce as much noise as four normal humans per caster level (maximum 40 humans). Thus, talking, singing, shouting, walking, marching, or running sounds can be created. The noise a ghost sound spell produces can be virtually any type of sound within the volume limit. A horde of rats running and squeaking is about the same volume as eight humans running and shouting. A roaring lion is equal to the noise from 16 humans, while a roaring dragon is equal to the noise from 32 humans. Anyone who hears a ghost sound receives a Will save to disbelieve.\n\nGhost sound can enhance the effectiveness of a silent image spell.\n\nGhost sound can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 289"},{"n":"Grave Words","l":0,"school":"necromancy [ language-dependent ]","castingTime":"1 minute","components":"S","range":"touch","target":"one dead creature","duration":"1 round","save":"","sr":"","effect":"With this spell and a touch, you can force a corpse talk to you, but you can’t ask it specific questions or communicate with it at all. The corpse will start babbling for 1 round, spitting out random sentences. There is a 10% chance this information is of some use to the caster, but it is difficult to distinguish whether the information is useful (the GM makes the percentile roll in secret). Useful information may include warnings about dangers deeper in a dungeon, the command word to a magic item, or even vague and spectral warnings of your or your companions’ future. The GM decides what information, useful or not, the corpse spews out in its babbling. Once a corpse has been subject to grave words by any caster, any new attempt to cast grave words on that corpse fails. You can cast this spell on a corpse that has been deceased for any amount of time, but the head of the corpse must have a mouth in order to speak at all. This spell doesn’t affect a corpse that has been turned into an undead creature.","source":"Occult Adventures pg. 172"},{"n":"Guidance","l":0,"school":"Divination","castingTime":"1 standard action","components":"V, S","range":"Touch","target":"Creature touched","duration":"1 minute or until discharged","save":"Will negates (harmless)","sr":"Yes","effect":"This spell imbues the subject with a touch of divine guidance. The creature gets a +1 competence bonus on a single attack roll, saving throw, or skill check. It must choose to use the bonus before making the roll to which it applies.","source":"Core Rulebook"},{"n":"Haunted Fey Aspect","l":0,"school":"illusion (glamer)","castingTime":"1 standard action","components":"S","range":"Personal","target":"You","duration":"1 round/level (D)","save":"","sr":"","effect":"You surround yourself with disturbing illusions, making you look and sound like a bizarre, insane fey creature. You gain DR 1/cold iron against a single opponent until the end of the spell, or until you take damage.","source":"Ultimate Combat pg. 230"},{"n":"Light","l":0,"school":"evocation [light]","castingTime":"1 standard action","components":"V, M/DF (a firefly)","range":"touch","target":"object touched","duration":"10 min./level","save":"none","sr":"no","effect":"This spell causes a touched object to glow like a torch, shedding normal light in a 20-foot radius, and increasing the light level for an additional 20 feet by one step, up to normal light (darkness becomes dim light, and dim light becomes normal light). In an area of normal or bright light, this spell has no effect. The effect is immobile, but it can be cast on a movable object.\n\nYou can only have one light spell active at any one time. If you cast this spell while another casting is still in effect, the previous casting is dispelled. If you make this spell permanent (through permanency or a similar effect), it does not count against this limit. Light can be used to counter or dispel any darkness spell of equal or lower spell level.","source":"PRPG Core Rulebook pg. 304"},{"n":"Mage Hand","l":0,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one nonmagical, unattended object weighing up to 5 lbs.","duration":"concentration","save":"none","sr":"no","effect":"You point your finger at an object and can lift it and move it at will from a distance. As a move action, you can propel the object as far as 15 feet in any direction, though the spell ends if the distance between you and the object ever exceeds the spell's range.","source":"PRPG Core Rulebook pg. 306"},{"n":"Message","l":0,"school":"transmutation [language-dependent]","castingTime":"1 standard action","components":"V, S, F (a piece of copper wire)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level","duration":"10 min./level","save":"none","sr":"no","effect":"You can whisper messages and receive whispered replies. Those nearby can hear these messages with a DC 25 Perception check. You point your finger at each creature you want to receive the message. When you whisper, the whispered message is audible to all targeted creatures within range. Magical silence, 1 foot of stone, 1 inch of common metal (or a thin sheet of lead), or 3 feet of wood or dirt blocks the spell. The message does not have to travel in a straight line. It can circumvent a barrier if there is an open path between you and the subject, and the path's entire length lies within the spell's range. The creatures that receive the message can whisper a reply that you hear. The spell transmits sound, not meaning; it doesn't transcend language barriers. To speak a message, you must mouth the words and whisper.","source":"PRPG Core Rulebook pg. 313"},{"n":"Oath of Anonymity","l":0,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V","range":"personal","target":"you","duration":"10 minutes/level","save":"","sr":"","effect":"You swear an oath not to reveal your identity, magically preventing anyone from discovering it so long as you avoid revealing your face or other easily identifiable features. The spell distorts your voice and subtly alters your body language and the appearance of your gear and any animals you use, whether as companions, mounts, or otherwise. This spell does not make you appear to be a different creature type, nor does it change your apparent height or body type.\n\nThis spell provides you with a +10 bonus on Disguise checks to conceal your identity, but not on checks to impersonate anyone in particular. This spell distorts the appearance of your voice, gear, and animals in the same way each time, essentially creating an alternate persona that can be recognized by those who have observed it before.","source":"Inner Sea Intrigue pg. 60"},{"n":"Open/Close","l":0,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (a brass key)","range":"close (25 ft. + 5 ft./2 levels)","target":"object weighing up to 30 lbs. or portal that can be opened or closed","duration":"instantaneous","save":"Will negates (object)","sr":"yes (object)","effect":"You can open or close (your choice) a door, chest, box, window, bag, pouch, bottle, barrel, or other container. If anything resists this activity (such as a bar on a door or a lock on a chest), the spell fails. In addition, the spell can only open and close things weighing 30 pounds or less. Thus, doors, chests, and similar objects sized for enormous creatures may be beyond this spell's ability to affect.","source":"PRPG Core Rulebook pg. 317"},{"n":"Prestidigitation","l":0,"school":"universal","castingTime":"1 standard action","components":"V, S","range":"10 ft. Target, Effect, or Area see text","target":"","duration":"1 hour","save":"see text","sr":"no","effect":"Prestidigitations are minor tricks that novice spellcasters use for practice. Once cast, a prestidigitation spell enables you to perform simple magical effects for 1 hour. The effects are minor and have severe limitations. A prestidigitation can slowly lift 1 pound of material. It can color, clean, or soil items in a 1-foot cube each round. It can chill, warm, or flavor 1 pound of nonliving material. It cannot deal damage or affect the concentration of spellcasters. Prestidigitation can create small objects, but they look crude and artificial. The materials created by a prestidigitation spell are extremely fragile, and they cannot be used as tools, weapons, or spell components. Finally, prestidigitation lacks the power to duplicate any other spell effects. Any actual change to an object (beyond just moving, cleaning, or soiling it) persists only 1 hour.","source":"PRPG Core Rulebook pg. 325"},{"n":"Read Magic","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S, F (a clear crystal or mineral prism)","range":"personal","target":"you","duration":"10 min./level","save":"none","sr":"no","effect":"Lets you decipher magical writing on an object at 250 words per minute; once read this way, you can reread that specific text without recasting. Also lets you identify a glyph of warding (DC 13 Spellcraft), a greater glyph of warding (DC 16 Spellcraft), or any symbol spell (DC 10 + spell level). Can be made permanent with permanency.","source":"PRPG Core Rulebook pg. 330"},{"n":"Resistance","l":0,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M/DF (a miniature cloak)","range":"touch","target":"creature touched","duration":"1 minute","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You imbue the subject with magical energy that protects it from harm, granting it a +1 resistance bonus on saves.\n\nResistance can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 334"},{"n":"Sift","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"30 ft.","target":"one 10-ft. cube","duration":"instantaneous","save":"none","sr":"no","effect":"You examine an area at range as if you were searching for fine details with the Perception skill. Make a Perception check with a –5 penalty, modified as normal for conditions. No penalty is applied for distance. Apply the result against the DC for any hidden features, such as secret doors, traps, or hidden treasure. You must be able to see the area you are attempting to search, and you only find details that can be perceived with sight or touch. Sift detects only objects and features, not actual creatures.","source":"Advanced Player's Guide pg. 244"},{"n":"Stabilize","l":0,"school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One living creature","duration":"Instantaneous","save":"Will negates (harmless)","sr":"Yes (harmless)","effect":"Upon casting this spell, you target a living creature that has –1 or fewer hit points. That creature is automatically stabilized and does not lose any further hit points. If the creature later takes damage, it continues dying normally.","source":"Core Rulebook"},{"n":"Virtue","l":0,"school":"Transmutation","castingTime":"1 standard action","components":"V, S, DF","range":"Touch","target":"Creature touched","duration":"1 min.","save":"None","sr":"Yes (harmless)","effect":"With a touch, you infuse a creature with a tiny surge of life, granting the subject 1 temporary hit point.","source":"Core Rulebook"},{"n":"Ally Across Time","l":1,"school":"conjuration (summoning)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one 5-ft. cube of temporal possibility/2 levels","duration":"1 round/level","save":"none","sr":"no","effect":"You create one or more 5-foot cubes of temporal possibility where your timeline overlaps with those of your parallel existences. As a free action, you can summon a duplicate of yourself (not including any animal companions, familiars, intelligent items, or other creatures) from an alternate timeline in one of the cubes you can see, which lasts until the end of your turn. This duplicate has your statistics (though its hit points equal your caster level), threatens all squares adjacent to it, and has any teamwork feats you have. Although the duplicate appears with all of the equipment you currently carry, it cannot use any of its equipment and all its equipment disappears when the duplicate does. This duplicate cannot voluntarily move from the space in which it’s summoned. During its brief existence, a duplicate can use the aid another action once to assist you, but it cannot take any other type of action. Once a duplicate disappears, the cube of temporal possibility it occupied dissipates.\n\nYou can summon only one duplicate before the spell ends. For every 4 caster levels you have beyond 3rd, you can summon an additional duplicate before the spell ends, though you cannot have more than one duplicate in existence at once.","source":"Legacy of the First World pg. 30"},{"n":"Ant Haul","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a small pulley)","range":"touch","target":"creature touched","duration":"2 hours/level","save":"Fortitude negates (harmless)","sr":"yes (harmless)","effect":"The target’s carrying capacity triples. This does not affect the creature’s actual Strength in any way, merely the amount of material it can carry while benefiting from this spell. It also has no effect on encumbrance due to armor. If the creature wears armor it still takes the normal penalties for doing so regardless of how much weight the spell allows it to carry.","source":"Advanced Player's Guide pg. 201"},{"n":"Anticipate Peril","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 minute/level or until activated","save":"Will negates","sr":"yes","effect":"A creature affected by anticipate peril gains a preternatural sense of danger. The first time during this spell’s duration that the target has to make an initiative check, the creature adds an insight bonus on that initiative check equal to the spell’s caster level (maximum +5). Once this bonus applies, the effects of the spell end.\nMythic Anticipate Peril\n##Source## Mythic Adventures pg. 84\nAdd your tier to the spell’s initiative bonus and the maximum initiative bonus the spell can grant.","source":"Ultimate Magic pg. 206"},{"n":"Assumed Likeness","l":1,"school":"illusion (phantasm) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"10 minutes/level (D)","save":"Will disbelief","sr":"yes","effect":"You draw upon the memories of the targets to create a visual disguise for yourself that only they can see. When you cast the spell, you choose an emotion from the table below. Each target perceives you as a creature it feels that way toward. If it doesn’t feel that way toward anyone, it instead perceives you as a stranger with features likely to evoke that emotion (e.g., if you choose respect, a guard who was taught to respect her elders but who currently knows no elders might see you as an elderly version of yourself). Since you don’t know how you will appear to each target, you must match your actions and statements to fit with the illusion as best you can. While the spell grants a +10 bonus on Disguise checks like disguise self does, you also take a –5 penalty on Disguise checks until you can get a sense of who the target thinks you are. Each target who fails to disbelieve the phantasm and is fooled by your Disguise check takes a –2 penalty on Sense Motive checks to notice your lies, and each emotion choice grants you an additional benefit against such targets, as listed in the table below. EmotionEffect Fear+4 bonus on Intimidate checks Hate+2 bonus on attack rolls, -2 penalty to AC Lust+4 bonus on Sleight of Hands checks Respect+4 bonus on Diplomacy checks Trust+4 bonus on Bluff checks","source":"Inner Sea Intrigue pg. 58"},{"n":"Auditory Hallucination","l":1,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration","save":"Will disbelief","sr":"yes","effect":"You cause the targets to believe they hear any sound you imagine. The sound can include intelligible speech. Instead of precisely imagining a sound, you can identify a sound the subjects know and they imagine it doing what you describe as you cast the spell. For example, you could cast this spell on orc warriors and have them imagine the sound of their chieftain calling for help, even if you’ve never heard their chieftain and even if the chieftain speaks in a language you don’t understand. All targets hear the same hallucination. You can change the sound as part of concentrating on the spell.","source":"Ultimate Intrigue pg. 204"},{"n":"Bestow Planar Infusion I","l":1,"school":"Evocation","castingTime":"1 standard action","components":"V, S","range":"Touch","target":"Creature touched","duration":"1 hour/level","save":"Fortitude negates (harmless)","sr":"Yes","effect":"This spell draws upon the latent planar energy of the caster's surroundings, allowing her to temporarily infuse a creature with the plane's power. The touched creature gains that plane's basic infusion for the spell's duration. This spell has no effect if cast on the Material Plane, and it ends as soon as the spell's target leaves the plane with which it has been infused. Details on planar infusions can be found in each plane's Infusion section (listed here).\n\nOnce a creature gains the benefits of bestow planar infusion I, it remains attuned to that plane for 24 hours. Additional castings of bestow planar infusion I during this time bestow the same infusion that was granted by the initial casting that day. Planar infusions that can be used a limited number of times per day are not refreshed by multiple castings of bestow planar infusion I.","source":"Planar Adventures"},{"n":"Bleed Glory","l":1,"school":"Necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One mythic creature","duration":"1 minute/level","save":"Will negates","sr":"Yes","effect":"The mythic power cost for all path abilities, feats, spells, and other effects used by the target increases by 1.","source":"Mythic Adventures"},{"n":"Bloodbath","l":1,"school":"necromancy","castingTime":"1 standard action","components":"V, S, F (a ceremonial dagger)","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one living creature/level, no two more than 30 ft. apart","duration":"1 round/level (D)","save":"Fortitude negates","sr":"yes","effect":"You cut yourself with the ceremonial dagger, taking 1d6 bleed damage; as long as you keep bleeding, each target takes 1d6 bleed damage at the start of its turn unless it saves. Magical healing that stops your bleed, or your own healing, ends the effect on all targets.","source":"Horror Adventures pg. 110"},{"n":"Borrow Skill","l":1,"school":"transmutation","castingTime":"1 standard action","components":"S","range":"touch","target":"creature touched","duration":"up to 1 round/level (see description)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You borrow one of the target’s known skills. After touching the subject, you can make a single check with the chosen skill using the subject’s skill ranks, but modified by your own key ability. If you take longer than the spell’s duration to make the check or the check requires more time, then it fails and you must use your own skill ranks (if any). If the borrowed skill is a class skill for you, you gain the +3 bonus on checks using that skill.","source":"Advanced Player's Guide pg. 207"},{"n":"Burst of Insight","l":1,"school":"transmutation","castingTime":"1 immediate action","components":"V, S","range":"personal","target":"you","duration":"instantaneous","save":"none","sr":"no","effect":"You plumb the depths of your mind for insight, leaving you momentarily frazzled. When you are about to make a d20 roll based on Intelligence, Wisdom, or Charisma, you can cast this spell to gain a +8 enhancement bonus to Intelligence, Wisdom, or Charisma for that roll, but you are dazed for 1 round afterward.","source":"Occult Adventures pg. 160"},{"n":"Calm Spirit","l":1,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One incorporeal undead creature or haunt","duration":"1 minute or 1 round/level; see text","save":"Will negates or none, see text","sr":"Yes","effect":"This spell temporarily calms agitated haunts and incorporeal undead such as ghosts. You have no control over the affected creatures, but calm spirit postpones hostile action by the affected spirits for the duration of the spell. Entities so affected cannot take violent actions or do anything destructive, including triggering persistent haunt abilities, though they can defend themselves. Any aggressive action against or damage dealt to a calmed spirit or haunt immediately ends the effect.\n\nHaunts do not receive a saving throw against the spell, but the caster must succeed at a caster level check whose difficulty is equal to at least 10 + the haunt's CR in order to temporarily calm the angry entity. The spell's duration changes to concentration (up to 1 round/level) when affecting a haunt.","source":"Occult Adventures"},{"n":"Cause Fear","l":1,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature with 5 HD or fewer","duration":"1d4 rounds (or 1 round; see text)","save":"Will partial","sr":"yes","effect":"Target becomes frightened; a successful save reduces this to shaken for 1 round instead. Creatures with 6 or more HD are unaffected. Counters and dispels remove fear.","source":"PRPG Core Rulebook pg. 252"},{"n":"Charge Object","l":1,"school":"transmutation","castingTime":"10 minutes","components":"V, S","range":"touch","target":"object touched","duration":"permanent","save":"none, see text","sr":"no","effect":"You charge an item with minor psychic energy. The item can be detected by the detect psychic significance spell. If you wish, you can imprint the item with your ownership history. Spells such as object reading and uses of the psychometry occult skill unlock (see page 196) can reveal any information about yourself you impart into the object, including your name, alignment, profession, and a summary of your experiences with the item. You can’t impart false information into the object, but you can omit any details you’d prefer not to divulge. If the target object is already psychically charged, you can add more information to it, but you can’t use charge object to erase existing psychic information.","source":"Occult Adventures pg. 161"},{"n":"Command","l":1,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"Issues a single-word command the target must obey on its next turn: Approach, Drop, Fall, Flee, or Halt. Approach/Flee force movement (provoking attacks of opportunity); Drop forces release of held items; Fall forces prone; Halt forces the target to stand motionless (taking no actions). A target unable to obey is unaffected.","source":"PRPG Core Rulebook pg. 256"},{"n":"Compel Hostility","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a drop of your blood)","range":"personal","target":"you","duration":"1 round/level","save":"see text","sr":"see text","effect":"Whenever a creature you can see that threatens you makes an attack against one of your allies, as an immediate action, you can compel that creature to attack you instead. When you compel a creature to attack you, you must first overcome that creature’s spell resistance, and the creature can attempt a Will saving throw to ignore the compulsion.\n\nA summoner casting this spell can choose his eidolon as the target of the spell.","source":"Ultimate Combat pg. 226"},{"n":"Comprehend Languages","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (pinch of soot and salt)","range":"personal","target":"you","duration":"10 min./level","save":"none","sr":"no","effect":"You can understand the spoken words of creatures or read otherwise incomprehensible written messages. The ability to read does not necessarily impart insight into the material, merely its literal meaning. The spell enables you to understand or read an unknown language, not speak or write it.\nWritten material can be read at the rate of one page (250 words) per minute. Magical writing cannot be read, though the spell reveals that it is magical. This spell can be foiled by certain warding magic (such as the secret page and illusory script spells). It does not decipher codes or reveal messages concealed in otherwise normal text.\nComprehend languages can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 258"},{"n":"Confusion, Lesser","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"This spell causes a single creature to become confused for 1 round.","source":"PRPG Core Rulebook pg. 258"},{"n":"Contact Entity I","l":1,"school":"Evocation","castingTime":"1 minute","components":"V, S, M (see text)","range":"100 miles","target":"Up to 20 entities of 6 HD or fewer; see text","duration":"Instantaneous","save":"None","sr":"No","effect":"You send out a magical message to any eldritch entities of a particular kind within a 100-mile radius, which can be delivered to up to 20 such creatures, starting with the nearest creatures until the limit has been met. This spell can't contact creatures with more than 6 Hit Dice. You can't send a specific message, but this spell (and all similar contact entity spells) can be characterized as an open invitation to make contact and establish communication. If there is an appropriate entity within range, the spell succeeds automatically. You don't know whether the message was received, nor any specific details about what creatures received it or how many. Creatures that receive the message know the location and distance from where the spell was cast. Because this spell doesn't call or summon the target, the target must have its own way to reach the place where the spell was cast.\n\nHow creatures respond to a contact spell is circumstantial and it is possible the creatures will simply ignore the spell. Creatures that come and investigate do so in their own time. They usually arrive cautiously, aware of the potential for ambush. Targets of the spell might inform their organization or community if they have one. There are no restrictions on how the creatures react to being contacted, and they might respond with hostility, parley, entertain an alliance, or subjugate the caster and their related community. Using this spell counts as mentally contacting the creature for the purpose of any of its special abilities (such as the star-spawn's overwhelming mind). For the purpose of spells like scrying, the creature has firsthand knowledge of you and a connection similar to if it possessed a likeness of you.\n\nEach type of creature requires a different material component that must be included when casting the spell, as shown on Table 4-1: Contact Entity on page 112. Some of these components are expensive or might require quests to acquire. Contacting certain types of creatures makes the spell chaotic, evil, or both, as indicated on the table.Contact Entity IMaterial ComponentCerebric fungusB3Scholarly tomeDeep oneB5Engraved stone tabletGriothB5An eye struck blind during an eclipse [evil]NightgauntB4Sculpture of an animal with the face filed smooth [chaotic]RatlingB4Spell scroll of 1st level or higher [chaotic, evil]VoonithB3Bundle of cattail plants [chaotic]Contact Entity IIMaterial ComponentColour out of spaceB4Shard of a meteoriteDenizen of LengB2Painting of a memory from a dream worth 1,000 gpElder thingB4Magic item or piece of technology worth 2,000 gpHound of TindalosB2Exotic, trance-inducing elixir worth 500 gpLeng ghoulB5Skull of a dead scholarMi-goB4Fresh brains of an intelligent creature [evil]Neh-thalgguB2Vial of cerebrospinal fluid from a creature that still lives [chaotic, evil]Rhu-chalikB5Brain of a creature that had 16 Int or higher [evil]ShantakB2A shard of rock harvested from another world [chaotic]YangetheB5Scroll of an emotionUM spell of 4th level or higherContact Entity IIIMaterial ComponentAatheriexaB5A swatch of flesh recently damaged by magic [evil]Deep one elderB5Engraved stone tabletFlying polypB4Eerie music played upon a wind instrument carved from the bone of a living creature [chaotic, evil]GugB2Fresh flesh of a creature of 5 HD or more [chaotic, evil]Leng spiderB2Head of a denizen of Leng [evil]Moon-beastB3Intelligent humanoid sacrificed while dreaming [chaotic, evil]Spawn of Yog-SothothB4All blood drained from a sacrificed intelligent humanoid [chaotic, evil]WendigoB2Must devour the flesh of sentient creatures with 8 HD total [chaotic, evil]YithianB3Quartz geodeContact Entity IVMaterial ComponentBholeB4Jar of slime created by a bhole's breath weaponBodythiefB4Chunks of brain from a lobotomy subject [evil]NeothelidRuby worth 3,000 gp [chaotic, evil]ShoggothArt object worth 3,000 gp recovered from the bottom of a sea [chaotic]Star-spawn of CthulhuB4Sacrificed humanoid of 10 HD or more [chaotic, evil]","source":"Horror Adventures"},{"n":"Crafter's Nightmare","l":1,"school":"necromancy (haunted) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a broken tool)","range":"close (25 ft. + 5 ft./2 levels)","target":"one 5-ft. cube/level (S)","duration":"1 day/level (D)","save":"Will negates","sr":"yes","effect":"You concentrate feelings of competitiveness, envy, and ill will into a poltergeist-like haunt that wreaks havoc on its victim’s long-term endeavors. Every time a creature in the affected area attempts a Craft or Profession check to generate income, create an item, or earn capital (Pathfinder RPG Ultimate Campaign 85), any skill check required for crafting or repairing a magic item, or any skill check required for an occult ritual (Pathfinder RPG Occult Adventures 208), the haunt imposes a –5 penalty on the check. If the creature fails its check by 5 or more, the haunt’s mischief deals 1d6 points of damage to the creature in addition to any other negative effects from such a failure. If the creature attempts to cast a spell with a casting time of 1 minute or longer, the haunt becomes similarly disruptive, requiring the caster to succeed at a concentration check (DC = 15 + spell level) or lose the spell and take 1d6 points of damage from the mischief. Each time the haunt is disruptive, the spell’s haunt-like manifestation occurs during that round.\n\nHaunt StatisticsNotice Perception DC 20 (to hear faint, sinister laughter)\nhp 2 hp/level; Trigger skill check or spell; Reset none","source":"Haunted Heroes Handbook pg. 27"},{"n":"Cultural Adaptation","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (a document written in the language of the culture to be emulated)","range":"personal","target":"you","duration":"10 minutes/level","save":"","sr":"","effect":"When casting this spell, you must concentrate on a culture or subculture to which you wish to adapt. If you speak the native language of the culture in question, then for the duration of this spell, you speak the language with a native accent. The spell doesn’t teach you the language in question, but can be combined with tongues or a similar spell. Your body language and gestures mark you as a native of the culture, and you unconsciously make small decisions that help you blend in. Combined, these grant you a +2 circumstance bonus on Diplomacy checks to influence members of the culture to which you have adapted, which doesn’t stack with other circumstance bonuses you might possess by virtue of being a member of the chosen culture. You also gain a +2 circumstance bonus on Disguise checks to pass yourself off as if you were a member of the culture, if you are not.\n\nThis doesn’t provide benefits when disguising yourself as a specific member of the culture, though it negates any circumstance penalties you might otherwise have taken due to not acting appropriately for that person’s culture. Finally, the DCs of enchantment (charm) spells you cast against natives of the culture to which you are attuned increase by 1.","source":"Ultimate Intrigue pg. 208"},{"n":"Deathwatch","l":1,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"30 ft.","target":"Cone-shaped emanation","duration":"10 min./level","save":"None","sr":"No","effect":"Using the powers of necromancy, you can determine the condition of creatures near death within the spell's range. You instantly know whether each creature within the area is dead, fragile (alive and wounded, with 3 or fewer hit points left), fighting off death (alive with 4 or more hit points), healthy, undead, or neither alive nor dead (such as a construct). Deathwatch sees through any spell or ability that allows creatures to feign death.","source":"Core Rulebook"},{"n":"Decompose Corpse","l":1,"school":"Necromancy","castingTime":"1 standard action","components":"V, S, M (a pinch of dried toadstool)","range":"Touch","target":"One corpse or corporeal undead","duration":"Instantaneous or 1 minute; see text","save":"Fortitude negates (object)","sr":"Yes (object)","effect":"Using this spell, the caster rapidly decomposes the flesh from a single corpse of size Huge or smaller, leaving behind a perfectly cleaned skeleton. If it is cast on a non-skeletal corporeal undead, the creature takes a -2 penalty on all rolls and to its Armor Class and CMD for 1 minute.","source":"Ultimate Magic"},{"n":"Decrepit Disguise","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one object of no more than 10 cu. ft./level","duration":"1 day/level","save":"none (object) or Will disbelief (if interacted with)","sr":"no","effect":"You make an object seem like a worthless version of itself. A masterwork or magic sword could seem to be a useless, rusting, discarded blade, and a luxurious throne could appear to be a decrepit wooden chair. If used against an attended object, the wielder can immediately attempt a Will save to disbelieve the effect. Decrepit disguise counters and dispels quintessence.\n\nDecrepit disguise can be made permanent with a permanency spell by a caster of 9th level or higher for the cost of 500 gp.","source":"Occult Adventures pg. 163"},{"n":"Delusional Pride","l":1,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute","save":"Will negates","sr":"yes","effect":"The target becomes so distracted by an overblown sense of its worth that it takes a –2 penalty on attacks and skill checks. However, this feeling also gives the target a +2 morale bonus on saves against charm and compulsion effects.","source":"Ultimate Magic pg. 216"},{"n":"Detect Charm","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"none","sr":"no","effect":"This spell functions as per detect magic, except that it detects only charm, compulsion, and possession effects. You immediately detect the strength and location of each such aura on all creatures in the area. You can attempt to identify the properties of each aura (see Spellcraft on page 106 the Pathfinder RPG Core Rulebook). In addition to noticing the targets of these effects, you can recognize when creatures in the area are using these effects on others by attempting a Sense Motive check as a standard action (DC = 20 + caster level). If you succeed, you can attempt a Spellcraft check to identify what magic it is using (even if the target is not in the area).","source":"Adventurer's Guide pg. 77, Andoran, Spirit of Liberty pg. 27"},{"n":"Detect Undead","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (earth from a grave)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 min./level","save":"none","sr":"no","effect":"You can detect the aura that surrounds undead creatures. The amount of information revealed depends on how long you study a particular area.\n1st Round: Presence or absence of undead auras.\n2nd Round: Number of undead auras in the area and the strength of the strongest undead aura present. If you are of good alignment, and the strongest undead aura's strength is overwhelming (see below), and the creature has HD of at least twice your character level, you are stunned for 1 round and the spell ends.\n3rd Round: The strength and location of each undead aura. If an aura is outside your line of sight, then you discern its direction but not its exact location.\nAura Strength: The strength of an undead aura is determined by the HD of the undead creature, as given on the table below.\nLingering Aura: An undead aura lingers after its original source is destroyed. If detect undead is cast and directed at such a location, the spell indicates an aura strength of dim (even weaker than a faint aura). How long the aura lingers at this dim level depends on its original power, as given on the table below.\nHDStrengthLingering Aura Duration\n1 or lowerFaint1d6 rounds\n2-4Moderate1d6 minutes\n5-10Strong1d6 x 10 minutes\n11 or higherOverwhelming1d6 days\nEach round, you can turn to detect undead in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"PRPG Core Rulebook pg. 269"},{"n":"Discern Next of Kin","l":1,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F (a copper piece)","range":"60 ft.","target":"one creature","duration":"concentration, up to 1 minute/level (D)","save":"Will negates (see text)","sr":"yes","effect":"You can scan the thoughts of one individual and learn the names and locations of the target’s living relatives, as well as the attitude of the target toward those relatives (and vice versa). You learn about one relative per round you concentrate on the target. For example, you might learn that the target’s father’s name is Jarn, the father lives on a nearby farm, and the target and his father don’t get along. Since this spell reads the target’s mind, you can learn only what the target knows or believes.","source":"Advanced Class Guide pg. 179"},{"n":"Disguise Self","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 min./level (D)","save":"none","sr":"no","effect":"You make yourself—including clothing, armor, weapons, and equipment—look different. You can seem 1 foot shorter or taller, thin, fat, or in between. You cannot change your creature type (although you can appear as another subtype). Otherwise, the extent of the apparent change is up to you. You could add or obscure a minor feature or look like an entirely different person or gender.\nThe spell does not provide the abilities or mannerisms of the chosen form, nor does it alter the perceived tactile (touch) or audible (sound) properties of you or your equipment. If you use this spell to create a disguise, you get a +10 bonus on the Disguise check. A creature that interacts with the glamer gets a Will save to recognize it as an illusion.","source":"PRPG Core Rulebook pg. 271"},{"n":"Disguise Weapon","l":1,"school":"illusion (glamer)","castingTime":"1 round","components":"V, S","range":"touch","target":"manufactured weapon touched","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"You make one manufactured weapon look like a different manufactured weapon of the same size and relative encumbrance (light, one-handed, or two-handed). For example, you could make a Small greatsword look like a Small quarterstaff, a Medium club, or a Large dagger. Even the appearance of an improvised weapon is possible. The extent of the apparent change is up to you. You could add or obscure a minor feature or make the item look like it is composed of different materials (stone, wood, adamantine, and so on). The spell does not provide any of the abilities of the chosen form, nor does it alter the perceived tactile or audible properties of the item or how it is wielded. A creature that interacts with the glamer may attempt a Will save to recognize it as an illusion.","source":"Advanced Class Guide pg. 180"},{"n":"Ear-Piercing Scream","l":1,"school":"evocation [sonic]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"instantaneous; see text","save":"Fortitude partial (see text)","sr":"yes","effect":"You unleash a powerful scream, inaudible to all but a single target. The target is dazed for 1 round and takes 1d6 points of sonic damage per two caster levels (maximum 5d6). A successful save negates the daze effect and halves the damage.","source":"Ultimate Magic pg. 218"},{"n":"Echo","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"S, F (a conch shell)","range":"close (25 ft. + 5 ft./2 levels) or long (400 ft. + 40 ft./level); see text","target":"one 10--ft. cube/level (S)","duration":"1 round/level (D)","save":"Will disbelief (if interacted with)","sr":"yes","effect":"You cause a sound heard in the target area up to 1 round ago and lasting up to 1 round in duration to repeat at a regular interval. The original sound need not have come from the area, but it echoes from the target area at its original full volume. Any special effects of the sound are not duplicated by this spell. If the area is naturally prone to echoes, such as a space surrounded on at least two sides by cliffs or high river banks, the spell’s range is long. Otherwise, the spell’s range is close.\n\nYou can concentrate as a standard action to alter the echo. You can change it to be any sound audible in the area within the last 1 round, move the apparent source of the sound within the area, or attempt a Bluff check to create a distraction to hide with a bonus equal to your caster level.","source":"Ultimate Wilderness pg. 229"},{"n":"Enlarge Person","l":1,"school":"transmutation","castingTime":"1 round","components":"V, S, M (powdered iron)","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 min./level (D)","save":"Fortitude negates","sr":"yes","effect":"This spell causes instant growth of a humanoid creature, doubling its height and multiplying its weight by 8. This increase changes the creature's size category to the next larger one. The target gains a +2 size bonus to Strength, a –2 size penalty to Dexterity (to a minimum of 1), and a –1 penalty on attack rolls and AC due to its increased size.\nA humanoid creature whose size increases to Large has a space of 10 feet and a natural reach of 10 feet. This spell does not change the target's speed.\nIf insufficient room is available for the desired growth, the creature attains the maximum possible size and may make a Strength check (using its increased Strength) to burst any enclosures in the process. If it fails, it is constrained without harm by the materials enclosing it—the spell cannot be used to crush a creature by increasing its size.\nAll equipment worn or carried by a creature is similarly enlarged by the spell. Melee weapons affected by this spell deal more damage (see Table: Tiny and Large Weapon Damage). Other magical properties are not affected by this spell. Any enlarged item that leaves an enlarged creature's possession (including a projectile or thrown weapon) instantly returns to its normal size. This means that thrown and projectile weapons deal their normal damage. Magical properties of enlarged items are not increased by this spell.\nMultiple magical effects that increase size do not stack.\nEnlarge person counters and dispels reduce person.\nEnlarge person can be made permanent with a permanency spell.\nMythic Enlarge Person\n##Source## Mythic Adventures pg. 93\nYou can increase the target’s size by up to two size categories, to a maximum of Huge. If the target grows two sizes, its weight increases by a factor of 25, it gains a +4 size bonus to Strength, and takes a –4 size penalty to Dexterity and a –2 penalty on attack rolls and to AC because of its increased size. A Medium humanoid creature whose size increases to Huge has a space of 15 feet and a natural reach of 10 feet. Mythic enlarge person counters and dispels mythic reduce person.","source":"PRPG Core Rulebook pg. 277"},{"n":"Expeditious Retreat","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 min./level (D)","save":"none","sr":"no","effect":"This spell increases your base land speed by 30 feet. This adjustment is treated as an enhancement bonus. There is no effect on other modes of movement, such as burrow, climb, fly, or swim. As with any effect that increases your speed, this spell affects your jumping distance (see the Acrobatics skill).\nMythic Expeditious Retreat\n##Source## Mythic Adventures pg. 93\nThe speed bonus from the spell increases to 40 feet. Add your tier to Acrobatics checks to avoid attacks of opportunity from movement, and when your movement provokes an attack of opportunity, add your tier to your AC against that attack.","source":"PRPG Core Rulebook pg. 279"},{"n":"Fool's Gold (VC)","l":1,"school":"illusion","castingTime":"1 standard action","components":"V, S, M (a copper piece or silver piece)","range":"touch","target":"objects touched","duration":"1 hour/level","save":"none or Will disbelief (see text)","sr":"no","effect":"You can temporarily make copper or silver seem to be an equivalent amount of gold. The spell affects 1 gp/level worth of material (thus, at 3rd level, the spell affects up to 300 copper pieces, 30 silver pieces, or a copper or silver item worth no more than 3 gp). Coins increase in value as normal for the new type of coinage. For items other than coins, some of the value of the item comes from its craftsmanship, regardless of the metal used, so the value of the item seems to be 5 times (for silver items) or 50 times (for copper items) its true value. Thus, a copper candlestick originally worth 5 cp transformed by this spell appears to be worth 250 cp, or 2 gp and 5 sp. A successful DC 25 Appraise check automatically detects the true nature of the coins or items. Creatures inspecting or interacting with the coins or items can attempt a saving throw to disbelieve the illusion.","source":"Villain Codex pg. 117"},{"n":"Heightened Awareness","l":1,"school":"divination","castingTime":"1 standard action","components":"V, M/DF (a coffee bean)","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"You enter a heightened state of awareness that allows you to notice more about your surroundings and recall information effortlessly. You gain a +2 competence bonus on Perception checks and on all Knowledge checks that you are trained in.\nIf this spell is active when you have to make an initiative check, you can instantly dismiss this spell and gain a +4 bonus on that check.","source":"Advanced Class Guide pg. 183"},{"n":"Hermean Potential","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F (a gold dragon scale)","range":"touch","target":"creature touched","duration":"1 minute/level","save":"Will negates (harmless)","sr":"no","effect":"You gift the target with the ability to perfect its actions via mental clarity. On the next attack roll, saving throw, ability check, or skill check the target attempts, it rolls twice and takes the more favorable result. For every 5 caster levels you have, the target can roll twice on an additional attack roll, saving throw, ability check, or skill check (to a maximum of 5 rolls at 20th level).  Hermean potential is countered and dispelled by ill omenAPG, but does not itself counter or dispel ill omen.","source":"Legacy of Dragons pg. 31"},{"n":"Identify","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M (wine stirred with an owl's feather)","range":"60 ft.","target":"cone-shaped emanation","duration":"3 rounds/level (D)","save":"none","sr":"no","effect":"This spell functions as detect magic, except that it gives you a +10 enhancement bonus on Spellcraft checks made to identify the properties and command words of magic items in your possession. This spell does not allow you to identify artifacts.","source":"PRPG Core Rulebook pg. 299"},{"n":"Ill Omen","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (hair from a black cat)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level or until discharged","save":"none","sr":"yes","effect":"You afflict the target with bad luck. On the next d20 roll the target makes, it must roll twice and take the less favorable result. For every five caster levels you have, the target must roll twice on an additional d20 roll (to a maximum of five rolls at 20th level).  A target who can speak and has at least one free hand and who is aware of the spell and its effects (such as from a Spellcraft check to identify the spell as it is cast) can negate one reroll by spending a move action to utter a brief prayer or good luck charm to appease the spirits of ill fortune.","source":"Advanced Player's Guide pg. 229"},{"n":"Implant Urge","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level","save":"Will partial","sr":"yes","effect":"You make the target unconsciously desire a goal you define when you cast this spell. The DC of any Diplomacy check to ask the target to act in a way that it believes will lead it toward that goal decreases by 5. The target takes a –2 penalty on saving throws against mind-affecting effects that compel it to act in a way that it believes will lead it toward that goal. Spells that reveal the target’s goals or thoughts reveal the implanted urge as the target’s most important goal and the target does not register as thinking of anything else as long as it is presented with the focus of its urge or a way to move toward its goal. Anyone studying the target’s thoughts can notice the implanted nature of this urge with a successful caster level check.","source":"Inner Sea Intrigue pg. 60"},{"n":"Invigorate","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"V","range":"touch","target":"creature touched","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell banishes feelings of weariness. For the duration, the subject takes no penalties from the fatigued or exhausted conditions. The effect of invigorate is merely an illusion, however, not a substitute for actual rest or respite. When the spell ends, the subject takes 1d6 points of nonlethal damage, along with the return of the original condition(s). A creature can be under the effects of only one invigorate spell at a time; if it is cast a second time on that creature, the first effect immediately ends.","source":"Advanced Player's Guide pg. 230"},{"n":"Know Peerage","l":1,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (thread from a tabard of livery)","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You impart your knowledge of nobility and peerage to the target, allowing her to recognize members of noble households, differentiate one set of heraldry from another, and otherwise identify who’s who at a royal gala or other noteworthy social event. The target is able to identify noble individuals, noble family names, and noble crests, signets, heraldry, and other symbols. The target treats her number of ranks in Knowledge (nobility) as though it were equal to your number of ranks in Knowledge (nobility), to a maximum of 5 ranks and a minimum of 0. If the target’s number of ranks is greater than yours, she uses her own number of ranks instead. In addition, if the target’s new total skill bonus on Knowledge (nobility) checks is at least +0, she automatically succeeds on all Knowledge (nobility) checks with a DC of 10 or lower.","source":"Ultimate Intrigue pg. 218"},{"n":"Liberating Command","l":1,"school":"transmutation","castingTime":"1 immediate action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"If the target is bound, grappled, or otherwise restrained, he may make an Escape Artist check to escape as an immediate action. He gains a competence bonus on this check equal to twice your caster level (maximum +20). This spell has no effect if the target could not get free by using the Escape Artist skill (for example, if he were under the effects of a hold person spell or paralyzed by Strength damage).","source":"Ultimate Combat pg. 233, Andoran, Spirit of Liberty pg. 27"},{"n":"Linked Legacy","l":1,"school":"divination","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"two willing creatures plus another creature per 6 levels, no two of which can be more than 30 feet apart","duration":"10 minutes/level","save":"none","sr":"yes","effect":"This spell helps build community and ensure a shared vision for the future. When any of the affected creatures succeeds at a Knowledge check to answer a question within its field of study or identify a monster and its special powers or vulnerabilities, as a free action the affected creature can share any information gained automatically with all targets of the spell. If any of the targets move out of the spell’s range, the spell ceases to function for all of them until they are all within close range of you again.","source":"Arcane Anthology pg. 9"},{"n":"Long Arm","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level (D)","save":"none","sr":"no","effect":"Your arms temporarily grow in length, increasing your reach with those limbs by 5 feet.","source":"Advanced Class Guide pg. 186"},{"n":"Mindlink","l":1,"school":"divination [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"touch","target":"creature touched","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes","effect":"You link your mind to that of a touched creature to swiftly communicate a large amount of complex information in an instant. You decide what the target learns, limited to any amount of information that otherwise could be communicated in 10 minutes. This information comes in a series of visual images and emotional sensations, and isn’t language-dependent.","source":"Occult Adventures pg. 177"},{"n":"Murderous Command","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"Compels the target to immediately attack its nearest ally with melee or natural weapons, moving or charging as needed to reach it; if that ally is currently unreachable, the target instead spends its turn moving toward it.","source":"Ultimate Magic pg. 230"},{"n":"Negative Reaction","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"The target’s actions and words fail to impress. The target of this spell takes a –10 penalty on any Bluff, Diplomacy, and Intimidate checks as well as any performance combat checks it attempts.","source":"Ultimate Combat pg. 238"},{"n":"Object Reading","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one touched object","duration":"concentration, up to 1 round per level (D)","save":"none","sr":"no","effect":"You read the psychic impressions left upon an object by emotionally or psychically charged events in the item’s history, or the information imprinted by the charge object or implant false reading spells. This spell returns the same information as the psychometry occult skill unlock (see page 196), but gives 1 piece of information when cast and requires 1 round of concentration per additional piece of information instead of 1 minute. You must still attempt an Appraise check to see how much information you gain. You gain a +10 competence bonus on the check.","source":"Occult Adventures pg. 179"},{"n":"Obscuring Mist","l":1,"school":"Conjuration (creation)","castingTime":"1 standard action","components":"V, S","range":"20 feet","target":"Cloud spreads in 20-ft. radius from you, 20 ft. high","duration":"1 minute per level (dismissible)","save":"None","sr":"No","effect":"This conjured vapor creates an obscuring effect centered on the caster. The mist impairs vision up to 5 feet away (providing 20% conc
