 hit points from mythic false life and a wyvern stings you for 3 points of Constitution damage, you can dismiss the spell to prevent 2 points of Constitution damage from that attack.","source":"PRPG Core Rulebook pg. 280"},{"n":"Find Traps","l":2,"school":"Divination","castingTime":"1 standard action","components":"V, S","range":"Personal","target":"You","duration":"1 min./level","save":"Consultar manual","sr":"Consultar manual","effect":"This divination spell enhances your ability to detect traps. You gain an insight bonus equal to 1/2 your caster level (maximum +10) on Perception checks made to find traps while the spell is in effect. Additionally, you automatically receive a check to notice traps within 10 feet, even if you're not actively searching. However, the spell provides no assistance in disarming discovered traps; it only aids in their detection.","source":"Core Rulebook"},{"n":"First World Revisions","l":2,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"willing wayang touched","duration":"24 hours (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions as ancestral regressionARG, except as noted above and as follows. The wayang loses her darkvision racial trait and gains the low-light vision racial trait in its place. The alignment and personality of the wayang are not affected by the transformation, but the spell conceals her alignment as per undetectable alignment. Unlike ancestral regression, this spell grants the target a +20 bonus on Disguise checks to pass as a gnome; even though the wayang appears as a gnomish analog of herself, the differences between gnomes and wayangs are great enough that she cannot be mistaken for a gnome by other wayangs who know her.","source":"Blood of Shadows pg. 11"},{"n":"Focused Scrutiny","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"You gain heightened sensitivity to the mannerisms, reactions, and body language of one creature you can perceive, allowing you to sense its state of mind and easily influence it. You gain a +10 bonus on Perception, Sense Motive, and Survival checks attempted against the target creature, as well as a +5 bonus on Diplomacy and Intimidate checks attempted against it.","source":"Advanced Class Guide pg. 182"},{"n":"Fog Cloud","l":2,"school":"conjuration (creation)","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"fog spreads in 20-ft. radius","duration":"10 min./level","save":"none","sr":"no","effect":"A bank of fog billows out from the point you designate. The fog obscures all sight, including darkvision, beyond 5 feet. A creature within 5 feet has concealment (attacks have a 20% miss chance). Creatures farther away have total concealment (50% miss chance, and the attacker can't use sight to locate the target).\n\nA moderate wind (11+ mph) disperses the fog in 4 rounds; a strong wind (21+ mph) disperses the fog in 1 round.\n\nThe spell does not function underwater.","source":"Core Rulebook pg. 284"},{"n":"Fox's Cunning","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (hairs or dung from a fox)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes","effect":"The target becomes smarter. The spell grants a +4 enhancement bonus to Intelligence, adding the usual benefits to Intelligence-based skill checks and other uses of the Intelligence modifier. Wizards (and other spellcasters who rely on Intelligence) affected by this spell do not gain any additional bonus spells for the increased Intelligence, but the save DCs for spells they cast while under this spell's effect do increase. This spell doesn't grant extra skill ranks.","source":"PRPG Core Rulebook pg. 286"},{"n":"Gentle Repose","l":2,"school":"Necromancy","castingTime":"1 standard action","components":"V, S, M/DF (salt and a copper piece for each of the corpse's eyes)","range":"Touch","target":"Corpse touched","duration":"1 day/level","save":"Will negates (object)","sr":"Yes (object)","effect":"This necromantic spell preserves dead creature remains from decay, effectively extending the window for resurrection magic. Days spent under the influence of this spell don't count against the time limit for raising the dead. The spell also reduces the practical difficulties of transporting deceased companions and functions on severed body parts.","source":"Core Rulebook"},{"n":"Ghostly Disguise","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minute/level (D)","save":"none","sr":"no","effect":"You make yourself—including clothing, armor, weapons, and equipment—appear translucent like a ghost. Any mundane or magical disguise on you is affected by this illusion as well; for example, if you are disguised as the king or a sahuagin, you look like a ghostly version of the king or a sahuagin. Your ghostly form may have a pale green, blue, or violet coloration, or a muted version of your normal appearance.\nThe spell does not actually make you ghostly or provide any incorporeal abilities. If you choose, the illusion can make you appear to float slightly above the ground, though you are actually still on the ground. A creature that interacts with the glamer gets a Will save to recognize it as an illusion.","source":"Ultimate Magic pg. 222"},{"n":"Haste","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a shaving of licorice root)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Fortitude negates (harmless)","sr":"yes (harmless)","effect":"The transmuted creatures move and act more quickly than normal. This extra speed has several effects.\nWhen making a full attack action, a hasted creature may make one extra attack with one natural or manufactured weapon. The attack is made using the creature's full base attack bonus, plus any modifiers appropriate to the situation. (This effect is not cumulative with similar effects, such as that provided by a speed weapon, nor does it actually grant an extra action, so you can't use it to cast a second spell or otherwise take an extra action in the round.)\nA hasted creature gains a +1 bonus on attack rolls and a +1 dodge bonus to AC and Reflex saves. Any condition that makes you lose your Dexterity bonus to Armor Class (if any) also makes you lose dodge bonuses.\nAll of the hasted creature's modes of movement (including land movement, burrow, climb, fly, and swim) increase by 30 feet, to a maximum of twice the subject's normal speed using that form of movement. This increase counts as an enhancement bonus, and it affects the creature's jumping distance as normal for increased speed. Multiple haste effects don't stack. Haste dispels and counters slow.\nMythic Haste\n##Source## Mythic Adventures pg. 97\nAffected creatures gain an additional move action each round. The movement speed increase changes to 50 feet, to a maximum of three times the creature’s normal speed for that movement type.\nAugmented (3rd): If you expend two uses of mythic power, the movement speed increase changes to 70 feet, with no limit based on the creature’s normal speed. If an affected creature moves at least 30 feet on its turn, it can travel across liquid as if the liquid were solid. If the liquid deals damage on contact, the creature takes only half damage from moving across it.","source":"PRPG Core Rulebook pg. 293"},{"n":"Helping Hand","l":2,"school":"Evocation","castingTime":"1 standard action","components":"V, S, DF","range":"5 miles","target":"Ghostly hand","duration":"1 hour/level","save":"None","sr":"No","effect":"The caster manifests an ethereal hand that locates and summons a specific creature within a 5-mile radius. The hand is described as ghostly and invisible except to the caster and potential target. Once located, the hand beckons the creature to follow, pointing toward the caster's location and moving ahead at up to 240 feet per round.\n\nThe target creature is not magically compelled to comply; it may refuse to follow. Search time varies by distance, ranging from 1 round for targets under 100 feet to 4 hours for those at maximum range. If unsuccessful after 4 hours, the hand returns displaying an outstretched palm before vanishing.\n\nThe hand cannot pass through solid objects, engage in combat, or perform tasks beyond location and guidance.","source":"Core Rulebook"},{"n":"Heroism","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"10 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell imbues a single creature with great bravery and morale in battle. The target gains a +2 morale bonus on attack rolls, saves, and skill checks.\nMythic Heroism\n##Source## Mythic Adventures pg. 98\nThe morale bonus increases to +4 and applies on all checks, attack rolls, saves, and weapon damage rolls. Allies adjacent to the target gain a +4 morale bonus on saves against fear effects.\nAugmented (3rd): If you expend two uses of mythic power, the target can attempt one additional attack per round when taking a full attack action (as if using a haste spell). The target can use this additional attack ability a number of times equal to your tier.","source":"PRPG Core Rulebook pg. 295"},{"n":"Hidden Knowledge","l":2,"school":"transmutation","castingTime":"1 round","components":"V, S, M (a drop of ink)","range":"personal","target":"you","duration":"up to 1 day/level (see text)","save":"","sr":"","effect":"This subtle but useful spell allows you to safeguard important knowledge—even from yourself. While casting this spell, you recite one piece of knowledge (up to a maximum of 50 words). Upon completion of the spell’s casting, you transfer the knowledge from your mind to your skin in the form of an intricate, runic tattoo placed anywhere you choose on your body. The knowledge disappears utterly from your mind, and you might not realize you forgot something. The magic of the spell patches over gaps in your memory with recollections from the past. Until the spell’s duration ends, the knowledge is lost to you. When you cast this spell, you decide how long you wish the spell’s duration to be, up to a maximum duration of 1 day per level.\n\nMany Cyphermages commission nonmagical tattoos to disguise the effects of this spell. A detect magic spell or a successful Linguistics or Spellcraft check (DC 20 + your Intelligence modifier) reveals an enchanted tattoo, but not its contents. The effects of hidden knowledge can be dispelled normally, in which case the knowledge is completely lost.","source":"Adventurer's Guide pg. 60, Second Darkness Player's Guide pg. 26"},{"n":"Hidden Speech","l":2,"school":"transmutation [language-dependent]","castingTime":"1 standard action","components":"V, S, M/DF (a cipher written on a piece of parchment)","range":"close (25 ft. + 5 ft./2 levels)","target":"you plus one creature/level, no two of which can be more than 30 ft. apart","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes","effect":"You greatly enhance the ability of the subjects to communicate hidden messages to each other. Each target gains a +10 competence bonus on Bluff checks to send secret message to other recipients. Others using opposed Sense Motive checks to decipher these messages receive a –5 penalty. All subjects affected by the spell must share a language to be able to pass messages.","source":"Advanced Player's Guide pg. 227"},{"n":"Hideous Laughter","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (tiny fruit tarts and a feather)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature; see text","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"This spell afflicts the subject with uncontrollable laughter. It collapses into gales of manic laughter, falling prone. The subject can take no actions while laughing, but is not considered helpless. After the spell ends, it can act normally. On the creature's next turn, it may attempt a new saving throw to end the effect. This is a full round action that does not provoke attacks of opportunity. If this save is successful, the effect ends. If not, the creature continues laughing for the entire duration.\n\nA creature with an Intelligence score of 2 or lower is not affected. A creature whose type is different from the caster's receives a +4 bonus on its saving throw, because humor doesn't “translate” well.","source":"PRPG Core Rulebook pg. 296"},{"n":"Hold Person","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a small, straight piece of iron)","range":"medium (100 ft. + 10 ft./level)","target":"one humanoid creature","duration":"1 round/level (D); see text","save":"Will negates; see text","sr":"yes","effect":"Paralyzes the target, who remains conscious and breathing but can take no actions, including speech, for the duration; each round it may attempt a new save as a full-round action (without provoking attacks of opportunity) to break free. A winged creature that fails cannot flap and falls, and a swimmer that fails cannot swim and may drown.","source":"PRPG Core Rulebook pg. 296"},{"n":"Hoodwink","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (small piece of black cloth)","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one creature/level, no two of which can be more than 30 ft. apart","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"You befuddle the targets’ senses, preventing the targets from clearly perceiving their surroundings. Instead, hoodwinked creatures see only the roughest shapes and details and hear only muffled noises. However, targets can clearly hear verbal communication from the spell’s caster. This spell does not impart understanding of the caster’s language if the creature can’t already understand it. Other than to hear the caster speak, targets automatically fail Perception checks with DCs greater than 5, and they are too disoriented by the spell to accurately remember the path they took while under its effects.\n\nWhile under the effects of this spell, targets without the help of a guide move at half speed, and any attacks they make are treated as though the creature they are attacking had concealment.\n\nMoving faster than half speed requires targets to succeed at a DC 10 Acrobatics check. Those that fail this check fall prone. If the target is attacked or physically harmed by any creature other than another target of hoodwink, the spell’s effect ends immediately for that target only.","source":"Villain Codex pg. 212"},{"n":"Hostile Levitation","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a leather loop studded with lodestones)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You levitate the target a few inches off the ground, removing solid footing and halving the target’s speed. The target also takes a –4 penalty to CMD against bull rush, drag, and reposition attempts. A targeted creature that attacks with a melee or ranged weapon finds itself increasingly unstable; the first attack has a –1 penalty on attack rolls, the second –2, and so on, to a maximum penalty of –5. A full-round action spent stabilizing allows the creature to begin again at –1. \n\nThis spell fails if cast on a flying creature.","source":"Ultimate Combat pg. 231"},{"n":"Human Potential","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a human hair)","range":"touch","target":"creature touched","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes","effect":"The target shares in humanity’s great potential as encouraged by Aroden. The target chooses one ability score and gains a +2 enhancement bonus to that ability score. The bonus confers the usual benefit to skills and abilities based on the ability enhanced, but does not affect bonus spells or skill ranks.","source":"Arcane Anthology pg. 9"},{"n":"Hypercognition","l":2,"school":"divination","castingTime":"1 standard action","components":"V","range":"personal","target":"you","duration":"see text","save":"none","sr":"no","effect":"You rapidly catalog and collate all available data on a person, place, thing, or event, calling to mind scraps of memory and assembling clues in a logical and systematic order. Immediately after casting the spell, you can begin spending the necessary time to perform an Intelligence check, a Linguistics check to detect a forgery or decipher a hidden message, or a Knowledge check. If the check requires at least 3 rounds, you can perform it five times as quickly (minimum 1 round). If the check required fewer than 3 rounds, you can perform it instantly. Either way, you gain an insight bonus on the check equal to your caster level (maximum bonus +10), but this bonus can’t raise your result above what you could have achieved on a natural 20.","source":"Occult Adventures pg. 172"},{"n":"Ignoble Form","l":2,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, M (a half-elf ear)","range":"touch","target":"one drow","duration":"24 hours","save":"Fortitude negates (harmless)","sr":"no","effect":"The target takes on the form of a half-elf from the surface world. Its skin, hair, and eyes change to match a specific human ethnicity. You can even change the target’s facial features or produce light facial hair or stubble. The target loses its darkvision, light blindness, and light sensitivity traits, if it normally has them. The target gains lowlight vision; a +3 racial bonus on a single Craft, Knowledge, Perform, or Profession skill of its choice; and both a +4 bonus on Bluff checks and a +10 bonus on Disguise checks to pass itself off as a half-elf.","source":"Blood of Shadows pg. 16"},{"n":"Inflict Pain","l":2,"school":"enchantment [mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will partial; successful save reduces duration to 1 round","sr":"yes","effect":"Wracks the target with mental and physical distress, imposing a -4 penalty on attack rolls, skill checks, and ability checks for the duration.","source":"Occult Adventures pg. 174"},{"n":"Influence Wild Magic","l":2,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"Target: you; Effect: 20-foot-radius burst of stabilizing magic centered on you","duration":"10 minutes/level","save":"none (harmless)","sr":"no (harmless)","effect":"This spell creates an area of stabilizing magical energy that emanates from you. Any creature within this area that fails a concentration check to cast a spell normally in an area of wild magic rolls twice to determine the wild magic effect and choose its preferred result.","source":"People of the Wastes pg. 29"},{"n":"Instigate Psychic Duel","l":2,"school":"illusion ( phantasm ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"You begin a psychic duel (see page 202) with a creature. This psychic duel takes place on a binary mindscape (see page 235) that includes only two minds: yours and the target’s. This spell ends and both minds return to their respective bodies if one of you drops below 0 hit points or if both of you agree to end the psychic duel (a free action that you can perform even if it isn’t your turn). Even if you cast the spell, you must succeed at a Will save to escape your own psychic duel if your opponent doesn’t want to allow you to leave. Spells like mindscape door can also free you from the mindscape (and mindscape door is one of the few spells you can cast in a binary mindscape). A binary mindscape is clearly illusory, and disbelieving the illusion doesn’t alter how the mindscape works.","source":"Occult Adventures pg. 174"},{"n":"Intensify Psyche","l":2,"school":"enchantment [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"A sense of euphoria suffuses the target, amplifying all sensations, good or bad. The target creature gains a +2 competence bonus on Diplomacy, Handle Animal, Perform, and Sense Motive checks. In addition, the DC for any spells or effects with the emotion or pain descriptors cast or caused by the target increases by 1 while the target is under the effects of the spell. However, increased sensitivity causes the target to take a –2 penalty on saving throws against spells and effects with the emotion or pain descriptor.","source":"Heroes of the Darklands pg. 20"},{"n":"Investigative Mind","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level or until discharged","save":"none","sr":"no","effect":"Your mind is able to correlate information effectively. When attempting an Appraise, Knowledge, Linguistics, or Spellcraft check, you can roll twice and take the higher result. If you have an ability that allows you to roll twice, you cannot use that ability and this benefit on the same roll.\nThe spell is discharged once you have used its benefit a number of times equal to your caster level.","source":"Advanced Class Guide pg. 185"},{"n":"Invisibility","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M/DF (an eyelash encased in gum arabic)","range":"personal or touch","target":"you or a creature or object weighing no more than 100 lbs./level","duration":"1 min./level (D)","save":"Will negates (harmless) or Will negates (harmless, object)","sr":"yes (harmless) or yes (harmless, object)","effect":"The creature or object touched becomes invisible. If the recipient is a creature carrying gear, that vanishes, too. If you cast the spell on someone else, neither you nor your allies can see the subject, unless you can normally see invisible things or you employ magic to do so.\nItems dropped or put down by an invisible creature become visible; items picked up disappear if tucked into the clothing or pouches worn by the creature. Light, however, never becomes invisible, although a source of light can become so (thus, the effect is that of a light with no visible source). Any part of an item that the subject carries but that extends more than 10 feet from it becomes visible.\nOf course, the subject is not magically silenced, and certain other conditions can render the recipient detectable (such as swimming in water or stepping in a puddle). If a check is required, a stationary invisible creature has a +40 bonus on its Stealth checks. This bonus is reduced to +20 if the creature is moving. The spell ends if the subject attacks any creature. For purposes of this spell, an attack includes any spell targeting a foe or whose area or effect includes a foe. Exactly who is a foe depends on the invisible character's perceptions. Actions directed at unattended objects do not break the spell. Causing harm indirectly is not an attack. Thus, an invisible being can open doors, talk, eat, climb stairs, summon monsters and have them attack, cut the ropes holding a rope bridge while enemies are on the bridge, remotely trigger traps, open a portcullis to release attack dogs, and so forth. If the subject attacks directly, however, it immediately becomes visible along with all its gear. Spells such as bless that specifically affect allies but not foes are not attacks for this purpose, even when they include foes in their area.\nInvisibility can be made permanent (on objects only) with a permanency spell.\nMythic Invisibility\n##Source## Mythic Adventures pg. 99\nThe invisible target can’t be detected with detect magic or other spells that detect magic auras. The invisibility can’t be penetrated, revealed, or dispelled by spells of 2nd level or lower (such as see invisibility or glitterdust), though true seeing and dust of appearance can reveal the invisible target’s presence.\nAugmented (3rd): If you expend two uses of mythic power, the invisible target is undetectable by blindsense, blindsight, scent, and tremorsense.","source":"PRPG Core Rulebook pg. 301"},{"n":"Invisibility Bubble","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (needle from a sea urchin)","range":"touch","target":"touched creature's space, up to one 5-foot-cube","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"A glamered bubble surrounds the target’s space, rendering her completely invisible underwater by hiding both the target and any water she displaces. Because of the bubble’s size limit, this spell works only on Medium or smaller targets. Other objects and creatures within the bubble’s space are also invisible while they stay in the space, which could reveal the spell’s existence to a canny observer who notices fish disappearing into the bubble and reappearing on the other side. Creatures inside the bubble can see each other, which allows foes who can pinpoint the bubble’s location (such as dragons) to stick their heads into the bubble in order to see the target. Any creature on the inside of the bubble that takes any action that would break invisibility pops the bubble and ends the spell early. On land, the bubble is clearly visible, acting much as invisibility does in the water. Unlike with invisibility, the inside of the bubble blocks light from escaping the bubble, meaning that light sources inside the bubble don’t illuminate past its edges, but also don’t reveal a telltale glow.","source":"Aquatic Adventures pg. 60"},{"n":"Irregular Size","l":2,"school":"transmutation [curse]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"permanent","save":"Fortitude negates","sr":"yes","effect":"Curses a creature so that one set of limbs (arms, legs, or wings, your choice) shrivels. Shriveled arms make the creature treated as one size smaller for wielding weapons and reduce natural arm attack damage; shriveled legs reduce base speed by 10 feet (minimum 5) and its Strength score counts as 4 lower for carrying capacity; shriveled wings reduce fly speed by 10 feet (minimum 5), reduce wing attack damage, and worsen fly maneuverability by one step (minimum clumsy).","source":"Magic Tactics Toolbox pg. 21"},{"n":"Knock","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V","range":"medium (100 ft. + 10 ft./level)","target":"one door, box, or chest with an area of up to 10 sq. ft./level","duration":"instantaneous; see text","save":"none","sr":"no","effect":"Knock opens stuck, barred, or locked doors, as well as those subject to hold portal or arcane lock. When you complete the casting of this spell, make a caster level check against the DC of the lock with a +10 bonus. If successful, knock opens up to two means of closure. This spell opens secret doors, as well as locked or trick-opening boxes or chests. It also loosens welds, shackles, or chains (provided they serve to hold something shut). If used to open an arcane locked door, the spell does not remove the arcane lock but simply suspends its functioning for 10 minutes. In all other cases, the door does not relock itself or become stuck again on its own. Knock does not raise barred gates or similar impediments (such as a portcullis), nor does it affect ropes, vines, and the like. The effect is limited by the area. Each casting can undo as many as two means of preventing access.","source":"PRPG Core Rulebook pg. 303"},{"n":"Lead Anchor","l":2,"school":"evocation","castingTime":"1 standard action","components":"V, S, M (a bag of air), DF","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates","sr":"yes","effect":"The target’s buoyancy becomes and stays swiftly sinking, regardless of how dense the target and its gear are. Among other effects, the target can walk on the bottom, but she also needs to succeed at a DC 20 Swim check to swim towards the surface and to stay above the bottom (see Buoyancy on page 43). This makes lead anchor a useful spell both for exploring the sea floor and for drowning an air-breathing foe in the water.","source":"Aquatic Adventures pg. 60"},{"n":"Lend Path","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You temporarily transfer one of your mythic path abilities to another creature, which can use it as if it were part of the creature’s own path. If the target is unable to expend mythic power, it can’t activate any part of the ability that requires expending uses of mythic power, but the ability otherwise functions as if the creature were 1st tier.\n\nWhile your path ability is transferred in this way, you can’t use it yourself (even if it’s an automatic ability or one that doesn’t require expending uses of mythic power).","source":"Mythic Adventures pg. 114"},{"n":"Levitate","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (a leather loop or golden wire bent into a cup shape)","range":"personal or close (25 ft. + 5 ft./2 levels)","target":"you or one willing creature or one object (total weight up to 100 lbs./level)","duration":"1 min./level (D)","save":"none","sr":"no","effect":"Levitate allows you to move yourself, another creature, or an object up and down as you wish. A creature must be willing to be levitated, and an object must be unattended or possessed by a willing creature. You can mentally direct the recipient to move up or down as much as 20 feet each round; doing so is a move action. You cannot move the recipient horizontally, but the recipient could clamber along the face of a cliff, for example, or push against a ceiling to move laterally (generally at half its base land speed).\nA levitating creature that attacks with a melee or ranged weapon finds itself increasingly unstable; the first attack has a –1 penalty on attack rolls, the second –2, and so on, to a maximum penalty of –5. A full round spent stabilizing allows the creature to begin again at –1.\nMythic Levitate\n##Source## Mythic Adventures pg. 99\nInstead of affecting one creature, you can affect a number of targets up to your caster level, but the total weight supported can be no more than 100 pounds per caster level. You can spend a move action to mentally direct all targets, but you must move all of them identically.\nAugmented (8th): If you expend 10 uses of mythic power, you permanently levitate a 5-foot cube of rock, which you can move 20 feet vertically or horizontally as a move action.\nIf you have created multiple cubes and they are physically touching each other, you can direct them all as a single move action (as if they were one object), even if some of them are out of range. Each levitating cube can support approximately 1,000 pounds of weight, allowing you to use it as a portion of the foundation for a bridge, floating castle, or similar construction project.","source":"PRPG Core Rulebook pg. 304"},{"n":"Locate Object","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S, F/DF (a forked twig)","range":"long (400 ft. + 40 ft./level)","target":"circle, centered on you, with a radius of 400 ft. + 40 ft./level","duration":"1 min./level","save":"none","sr":"no","effect":"You sense the direction of a well-known or clearly visualized object. You can search for general items, in which case you locate the nearest of its kind if more than one is within range. Attempting to find a certain item requires a specific and accurate mental image; if the image is not close enough to the actual object, the spell fails. You cannot specify a unique item unless you have observed that particular item firsthand (not through divination).\n\nThe spell is blocked by even a thin sheet of lead. Creatures cannot be found by this spell. Polymorph any object and nondetection fool it.","source":"PRPG Core Rulebook pg. 305"},{"n":"Magic Mouth","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (a small bit of honeycomb and jade dust worth 10 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object","duration":"permanent until discharged","save":"Will negates (object)","sr":"yes (object)","effect":"This spell imbues the chosen object or creature with an enchanted mouth that suddenly appears and speaks its message the next time a specified event occurs. The message, which must be 25 or fewer words long, can be in any language known by you and can be delivered over a period of 10 minutes. The mouth cannot utter verbal components, use command words, or activate magical effects. It does, however, move according to the words articulated; if it were placed upon a statue, the mouth of the statue would move and appear to speak. Magic mouth can also be placed upon a tree, rock, or any other object or creature.\n\nThe spell functions when specific conditions are fulfilled according to your command as set in the spell. Commands can be as general or as detailed as desired, although only visual and audible triggers can be used. Triggers react to what appears to be the case. Disguises and illusions can fool them. Normal darkness does not defeat a visual trigger, but magical darkness or invisibility does. Silent movement or magical silence defeats audible triggers. Audible triggers can be keyed to general types of noises or to a specific noise or spoken word. Actions can serve as triggers if they are visible or audible. A magic mouth cannot distinguish alignment, level, Hit Dice, or class except by external garb.\n\nThe range limit of a trigger is 15 feet per caster level, so a 6th-level caster can command a magic mouth to respond to triggers as far as 90 feet away. Regardless of range, the mouth can respond only to visible or audible triggers and actions in line of sight or within hearing distance.\n\nMagic mouth can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 310"},{"n":"Mindshock","l":2,"school":"divination [mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 round/level (D)","save":"none","sr":"no","effect":"Charges your weapon, natural weapon, and unarmed strike attacks with violent psychic energy, adding 1d4 nonlethal damage per hit (no effect against creatures immune to mind-affecting or pain effects). Whenever you score a critical hit, the psychic trauma leaves the target confused for 1 round, unless it's immune to critical hits, mind-affecting effects, or pain effects; a given target can only be confused this way once per casting no matter how many critical hits it takes.","source":"Occult Origins pg. 28"},{"n":"Minor Dream","l":2,"school":"illusion (figment) [mind-affecting]","castingTime":"1 minute","components":"V, S","range":"unlimited","target":"you or one gnome touched","duration":"see text","save":"none","sr":"no","effect":"This spell functions as the dream spell, except as follows. The messenger must be yourself or a gnome touched. The message can be no longer than 20 words. If the recipient of the message is not asleep when the spell is cast, the spell automatically fails.","source":"Advanced Race Guide pg. 39"},{"n":"Minor Image","l":2,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10 ft. cubes + one 10 ft. cube/level (S)","duration":"concentration + 2 rounds","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that minor image includes some minor sounds but not understandable speech.","source":"PRPG Core Rulebook pg. 314"},{"n":"Mirror Image","l":2,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 min./level","save":"","sr":"","effect":"This spell creates a number of illusory doubles of you that inhabit your square. These doubles make it difficult for enemies to precisely locate and attack you.\n\nWhen mirror image is cast, 1d4 images plus one image per three caster levels (maximum eight images total) are created. These images remain in your space and move with you, mimicking your movements, sounds, and actions exactly. Whenever you are attacked or are the target of a spell that requires an attack roll, there is a possibility that the attack targets one of your images instead. If the attack is a hit, roll randomly to see whether the selected target is real or a figment. If it is a figment, the figment is destroyed. If the attack misses by 5 or less, one of your figments is destroyed by the near miss. Area spells affect you normally and do not destroy any of your figments. Spells and effects that do not require an attack roll affect you normally and do not destroy any of your figments. Spells that require a touch attack are harmlessly discharged if used to destroy a figment.\n\nAn attacker must be able to see the figments to be fooled. If you are invisible or the attacker is blind, the spell has no effect (although the normal miss chances still apply).","source":"PRPG Core Rulebook pg. 314"},{"n":"Misdirection","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object, up to a 10-ft. cube in size","duration":"1 hour/level","save":"none or Will negates; see text","sr":"no","effect":"By means of this spell, you misdirect the information from divination spells that reveal auras (detect evil, detect magic, discern lies, and the like). On casting the spell, you choose another object within range. For the duration of the spell, the subject of misdirection is detected as if it were the other object. Neither the subject nor the other object gets a saving throw against this effect. Detection spells provide information based on the second object rather than on the actual target of the detection unless the caster of the detection succeeds on a Will save. For instance, you could make yourself detect as a tree if one were within range at casting: not evil, not lying, not magical, neutral in alignment, and so forth. This spell does not affect other types of divination magic (augury, detect thoughts, clairaudience/clairvoyance, and the like).","source":"PRPG Core Rulebook pg. 314"},{"n":"Mythic Severance","l":2,"school":"Necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature","duration":"Permanent","save":"Will negates","sr":"Yes","effect":"You restrict the target's access to its mythic power. Each time the target attempts to cast a mythic spell, expend mythic power to activate a path ability, or use any other effect that requires expending uses of mythic power, it must attempt a Will saving throw against the DC of this spell. If it fails this saving throw, the creature loses its action and the ability it was attempting to use has no effect.\n\nThis spell has no effect on mythic abilities that don't require the target to expend mythic power.","source":"Mythic Adventures"},{"n":"Neutral Buoyancy","l":2,"school":"evocation","castingTime":"1 standard action","components":"V, S, M (a bag of air), DF","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates","sr":"yes","effect":"The target’s buoyancy becomes and stays neutral, regardless of how dense the target and its gear are. Among other effects, the target neither sinks nor rises when it doesn’t attempt a Swim check, making it easier to stay put while performing demanding actions or when helpless or disabled, and the target can swim up and down with equal ease.","source":"Aquatic Adventures pg. 60"},{"n":"Nondetection","l":2,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (diamond dust worth 50 gp)","range":"touch","target":"creature or object touched","duration":"1 hour/level","save":"Will negates (harmless, object)","sr":"yes (harmless, object)","effect":"The warded creature or object becomes difficult to detect by divination spells such as clairaudience/clairvoyance, locate object, and detect spells. Nondetection also prevents location by such magic items as crystal balls. If a divination is attempted against the warded creature or item, the caster of the divination must succeed on a caster level check (1d20 + caster level) against a DC of 11 + the caster level of the spellcaster who cast nondetection. If you cast nondetection on yourself or on an item currently in your possession, the DC is 15 + your caster level.\nIf cast on a creature, nondetection wards the creature's gear as well as the creature itself.","source":"PRPG Core Rulebook pg. 317"},{"n":"Object Possession, Lesser","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"touch","target":"unattended Tiny or Small object","duration":"1 minute/level (D)","save":"None","sr":"No","effect":"This spell functions as possession, except you possess an object instead of a creature.  A possessed object becomes capable of animation, gaining the statistics of an animated object of its size (including 1 CP worth of abilities; Pathfinder RPG Bestiary 14). You can't use any spells or other abilities while possessing an object.  A spiritual tether connects your body to the possessed object, in a manner similar to a silver cord (see page 244). If the possessed object and your body are ever farther than close range (25 ft. + 5 ft./2 levels) from one another, this tether breaks, returning your consciousness to your body.","source":"Occult Adventures pg. 179"},{"n":"Oneiric Horror, Greater","l":2,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round/level (D)","save":"Will negates, Fortitude negates, see text","sr":"yes","effect":"This spell functions as oneiric horror except each round the subject fails its Will save, it takes 1 point of Strength damage, and after the spell ends, the subject must succeed at a Fortitude save or be fatigued for a number of minutes equal to the number of rounds spent under the spell’s effect.","source":"Occult Adventures pg. 179"},{"n":"Oppressive Boredom","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level or until broken (see text)","save":"Will negates (see text)","sr":"yes","effect":"You fill your target with boredom. The target loses all interest in its current task and must make a Will save against the spell’s effect in order to perform its next action. If the target fails, it takes no action that round. The boredom lasts until the duration expires or the target breaks the spell’s effect with a successful Will save.","source":"Ultimate Magic pg. 230"},{"n":"Owl's Wisdom","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (feathers or droppings from an owl)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes","effect":"The transmuted creature becomes wiser. The spell grants a +4 enhancement bonus to Wisdom, adding the usual benefit to Wisdom-related skills. Clerics, druids, and rangers (and other Wisdom-based spellcasters) who receive owl's wisdom do not gain any additional bonus spells for the increased Wisdom, but the save DCs for their spells increase.","source":"PRPG Core Rulebook pg. 318"},{"n":"Pack Empathy","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"you plus one willing living creature per 3 levels, no two of which can be more than 30 ft. apart","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"You create an instinctual connection between the targets. Each can sense the others’ overall emotional states, which allows them to communicate basic emotional concepts (such as alerting each other of danger due to increased stress). Once the spell has been cast on the subjects, the distance between them and the caster doesn’t affect the spell as long as they are on the same plane of existence. If a subject leaves the plane, or if it dies, the spell ceases to function for it.","source":"Ultimate Intrigue pg. 221"},{"n":"Pilfering Hand","l":2,"school":"evocation [force]","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one object","duration":"see text","save":"none","sr":"yes (object)","effect":"You create and control an invisible telekinetic force, manipulating it with either startling abruptness or careful deliberateness, allowing you to seize an object from an opponent or remotely manipulate an object. You can utilize this force to one of two ends.\n\nAbrupt Maneuver: You instantaneously attempt a disarm or steal combat maneuver against a target within range. Use your caster level as your Combat Maneuver Bonus, adding your Charisma modifier (bard, oracle, sorcerer), Intelligence modifier (magus, wizard), or Wisdom modifier (cleric) in place of your Strength or Dexterity modifier. This combat maneuver attempt does not provoke an attack of opportunity from its target, but casting this spell might. If you are successful, you pull the target object to you, and if you have enough hands free, you can catch it. Otherwise, the object lands in your square as if you dropped it.\n\nCareful Maneuver: You attempt a Disable Device check or a Sleight of Hand check to pick-pocket a target within range. This spell lasts as long as you need to accomplish the task, requiring your full concentration for that duration. Once you resolve the skill check, the spell ends. If you are successful on your Sleight of Hand check, you pull the target object to you as with an abrupt maneuver. The target gains a +2 bonus on its Perception check to notice the successful attempt.","source":"Ultimate Combat pg. 239"},{"n":"Placebo Effect","l":2,"school":"illusion ( phantasm ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, M (a sugar cube)","range":"touch","target":"creature touched","duration":"1 minute/level","save":"Will disbelief (harmless)","sr":"yes (harmless)","effect":"The subject temporarily ceases to feel the ill effects of a single ongoing affliction or condition from the following list: blinded, cursed, dazed, deafened, diseased, fatigued, frightened, nauseated, panicked, paralyzed, poisoned, shaken, sickened, staggered, or stunned. If that affliction or condition has a duration, it is suspended until this spell expires. If the subject has multiple instances of the same type of affliction (such as multiple diseases), a single casting of this spell can suspend only one of them. Placebo effect doesn’t remove or temporarily negate any damage that the affliction may have already caused, nor does it provide protection against receiving such conditions again.","source":"Occult Adventures pg. 180"},{"n":"Purge Spirit","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature or haunt","duration":"instantaneous","save":"Will partial","sr":"yes","effect":"Purge spirit rips away at the target's spiritual substance, scattering it over a wide area and hampering the target's ability to reform. The target takes 1d6 points of damage per caster level (maximum 10d6) and is staggered for 1 round. On a successful saving throw, the target takes half damage and is not staggered. This spell affects astrally projected creatures, ethereal creatures, haunts, incorporeal creatures, mediums channeling a spirit, and phantoms, and at the GM's discretion can affect other spirits or creatures made of ectoplasm. Incorporeal creatures take full damage from purge spirit.","source":"Occult Adventures pg. 184"},{"n":"Qualm","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level or until discharged","save":"Will negates","sr":"yes","effect":"The target is suddenly beset with unexplainable doubts about the effectiveness of its actions and the righteousness of its cause. The creature takes a –10 penalty on its ability checks, skill checks, and concentration checks, until the duration ends, or until it spends its entire turn doing absolutely nothing (it spends a full-round action gaining focus). Spending an entire turn doing nothing discharges the spell.","source":"Ultimate Combat pg. 241"},{"n":"Quick Change","l":2,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 hour/level","save":"none","sr":"no","effect":"If you have the change shape special quality, you can revert to your true form as a swift action. If a creature is not aware of your true form, when you use this spell to revert to your true form and attack that creature in the same round, the creature is denied its Dexterity bonus to AC against your first attack.","source":"Horror Adventures pg. 125"},{"n":"Restore Mythic Power","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"touch","target":"you and one mythic creature","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"By laying your hands on the target, you’re able to transfer some of your mythic essence to the target. You expend three uses of your mythic power to restore one use of the target’s mythic power.","source":"Mythic Adventures pg. 114"},{"n":"Riding Possession","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 hour/level (D); see effect","save":"Will negates","sr":"yes","effect":"Projects your soul into the target's body as a hidden passenger who does not take control; the host retains full control and normally has no idea it's possessed. You cannot speak directly, but can cast mind-affecting spells that only affect the host; if the host makes its save against such a spell it becomes aware of the possession and gets a new save against this spell. Protection from evil (or similar) stops you from casting further spells on the host but doesn't expel you.","source":"Occult Adventures pg. 185"},{"n":"Rope Trick","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (powdered corn and a twisted loop of parchment)","range":"touch","target":"one touched piece of rope from 5 ft. to 30 ft. long","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"When this spell is cast upon a piece of rope from 5 to 30 feet long, one end of the rope rises into the air until the whole rope hangs perpendicular to the ground, as if affixed at the upper end. The upper end is, in fact, fastened to an extradimensional space that is outside the usual multiverse of extradimensional spaces. Creatures in the extradimensional space are hidden, beyond the reach of spells (including divinations), unless those spells work across planes. The space holds as many as eight creatures (of any size). The rope cannot be removed or hidden. The rope can support up to 16,000 pounds. A weight greater than that can pull the rope free.\n\nSpells cannot be cast across the extradimensional interface, nor can area effects cross it. Those in the extradimensional space can see out of it as if a 3-foot-by-5-foot window were centered on the rope. The window is invisible, and even creatures that can see the window can't see through it. Anything inside the extradimensional space drops out when the spell ends. The rope can be climbed by only one person at a time. The rope trick spell enables climbers to reach a normal place if they do not climb all the way to the extradimensional space.","source":"PRPG Core Rulebook"},{"n":"Scare","l":2,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a bone from an undead creature)","range":"medium (100 ft. + 10 ft./level)","target":"one living creature per three levels, no two of which can be more than 30 ft. apart","duration":"1 round/level (or 1 round on a successful save)","save":"Will partial","sr":"yes","effect":"Functions like cause fear, except that it can affect multiple creatures with fewer than 6 Hit Dice at once, rendering each frightened on a failed save (or shaken for 1 round on a success).","source":"PRPG Core Rulebook pg. 336"},{"n":"Sealed Life","l":2,"school":"abjuration","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"none","sr":"yes","effect":"You seal the life force within the target, preventing it from sharing its vitality with others. Affected creatures can’t transfer damage to or from another, such as through shield other , a spiritualist’s life bond, or a summoner’s life link. Effects such as vampiric touch that steal vitality from others deal damage normally, but provide no benefits.","source":"Occult Adventures pg. 185"},{"n":"Seek Thoughts","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a handful of copper coins)","range":"40 ft.","target":"40-ft.-radius emanation centered on you","duration":"concentration, up to 1 minute/level","save":"Will negates","sr":"no","effect":"Similar to detect thoughts, seek thoughts allows you to sift through the surface thoughts of those around you. You may scan for either the answer to a simple question (such as “Where is the hidden lair of the wererats?”) or for information on a general topic (such as the beliefs of an evil cult). You detect the number of creatures who are thinking about this question or topic within range, as well as their location if they are visible to you. Seek thoughts does not let you read actual surface thoughts, only if a given creature is thinking about the topic you are concentrating on. A successful Will save prevents you from sensing a creature’s thoughts for the duration of the spell.\nYou can maintain concentration on seek thoughts while you engage in normal conversation, allowing you to ask leading questions about topics of interest. A creature conversing with you while you concentrate can notice that you are distracted with a successful DC 25 Sense Motive check.","source":"Advanced Player's Guide pg. 242"},{"n":"Sense Madness","l":2,"school":"Divination","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"Creatures in range (see text)","duration":"Concentration, up to 1 round/level","save":"None","sr":"No","effect":"You can sense the presence of mental disturbance in creatures within range, focusing your detection on one creature each round. If the target is currently suffering from any form of madness (see page 182) or addiction (GameMastery Guide 236), has total sanity damage greater than or equal to its sanity edge (see page 12), or is under a magical compulsion that could be detected by detect magic, you can detect the presence of such a disturbance on the first round of concentration.\n\nIf you concentrate on the same creature for an additional round, you learn if the creature's total sanity damage is greater than or equal to its sanity edge, and you can attempt a Sense Motive check against a DC equal to 10 + the save DC of the target's madness or addiction to determine the exact nature of a madness or addiction. Additionally, you can attempt a Spellcraft check with a DC equal to 11 + the caster level of the compulsion against each magical compulsion currently affecting the target that could be detected by detect magic. If successful, you can identify the specific spell affecting the target. You gain a +4 bonus on your Spellcraft check if the effect is confusion, insanity, or a similar effect that explicitly causes madness or insanity. If you successfully identify such an effect with sense madness, the insights provided by this spell grant you a +1 circumstance bonus on your next caster level check in the following 1 minute made to counter, dispel, or remove that specific effect. After attempting a check to identify a madness, addiction, or compulsion, you can't attempt that check against the same creature again, even if you concentrate on the creature again.","source":"Horror Adventures"},{"n":"Sensory Amplifier","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"S","range":"personal","target":"10-ft.-radius emanation centered on you","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You open the minds of all creatures near you and enhance their sensory receptors. All living creatures other than you in the area gain a +5 bonus on Perception checks. Sighted creatures gain low-light vision, and creatures with a sense of smell gain scent. In addition, the first time each round that a creature in the area takes damage, it takes an additional 2d6 points of damage of the same type. Despite being within the area, the caster does not take this extra damage.","source":"Occult Origins pg. 29"},{"n":"Sessile Spirit","l":2,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"Medium (100 ft. + 10 ft./level)","target":"One creature or object (see text)","duration":"1 round/level (D)","save":"Will negates (harmless)","sr":"Yes","effect":"You reach into the target creature and cause that spirits within to become dormant and inactive. If the target is a medium with a spirit inhabiting its body or a spiritualist with a phantom inhabiting its consciousness (or a member of another class using the spirit or phantom class features), a failed save renders that spirit or phantom powerless, suppressing any benefits the spirit or phantom normally provides to its host, including bonus feats and spells known.\n\nIf a spirit within the target is a creature using a possession effect, including possess object, possession, or a ghost's malevolence, the spell targets the possessing creature rather than the creature it inhabits. On a failed save, the possessing spirit isn't exorcised from the target but is dazed for the duration of the spell.","source":"Occult Adventures"},{"n":"Share Memory","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"touch","target":"you and one creature touched","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"You momentarily link your mind with the target and share a single memory of no longer than 1 minute. You can show the target one of your memories, show the target one of its own memories, or view one of the target’s memories.","source":"Ultimate Magic pg. 238"},{"n":"Shield Of Shards","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (a shield)","range":"personal","target":"one shield you wield","duration":"1 round/level","save":"none","sr":"","effect":"This defensive spell must be cast on a shield you are currently wielding, and fractures the shield into two shards, plus one additional shard per 2 caster levels (to a maximum of 12 shards at 20th level). While shield of shards is active, you lose your shield’s bonus to AC as its broken pieces orbit you. On your turn, you can direct the shards to attack an adjacent opponent as a move action. The shards’ attack bonus is equal to your caster level + the modifier for the ability score that determines your spell save DCs. The shards deal an amount of slashing and piercing damage equal to 1d4 points + 1 point per shard beyond the first, and have a threat range of 19–20. They are considered magic weapons for the purpose of bypassing damage reduction. Additionally, if your shield is made from a special material (such as adamantine), the shards penetrate damage reduction and hardness as if they were weapons made from the same material.\n\nAt the end of this spell’s duration, the shards reform into their original shield form. You regain its shield bonus to AC, provided you still have a free hand in which to wield it. Otherwise, the shield falls at your feet in your square.","source":"Armor Master's Handbook pg. 23"},{"n":"Shifted Steps","l":2,"school":"illusion (glamer) [sonic]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object up to 10 feet across","duration":"concentration + 1 round/level (D)","save":"Will negates (harmless) and Will disbelief (if interacted with); see text","sr":"no","effect":"You cause the target to sound as if it is elsewhere within range, including its movements, speech, and all other sounds. As long as you concentrate, you can cause the sound’s apparent location to change as you see fit within range from your current location. Once you cease concentrating, the sound moves so that it remains the same relative distance and direction from the target. This spell can fool any sound-based blindsense or blindsight (including echolocation), but it can’t fool other forms of detection such as other forms of blindsense or blindsight, lifesense, normal vision, and tremorsense. The target receives a saving throw against the effect if it doesn’t wish for you to shift its sound, and any creature that interacts with the illusion receives a Will save to disbelieve the glamer.","source":"Ultimate Intrigue pg. 225"},{"n":"Slow","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a drop of molasses)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"An affected creature moves and attacks at a drastically slowed rate. Creatures affected by this spell are staggered and can take only a single move action or standard action each turn, but not both (nor may it take full-round actions). Additionally, it takes a –1 penalty on attack rolls, AC, and Reflex saves. A slowed creature moves at half its normal speed (round down to the next 5-foot increment), which affects the creature's jumping distance as normal for decreased speed.\n\nMultiple slow effects don't stack. Slow counters and dispels haste.","source":"PRPG Core Rulebook pg. 344"},{"n":"Speak with Dead","l":2,"school":"Necromancy [language-dependent]","castingTime":"10 minutes","components":"V, S, DF","range":"10 ft.","target":"One dead creature","duration":"1 min./level","save":"Will negates; see text","sr":"No","effect":"You grant the semblance of life to a corpse, allowing it to answer questions. You may ask one question per two caster levels. The corpse's knowledge is limited to what it knew during life, including the languages it spoke. Answers are brief, cryptic, or repetitive, especially if the creature would have opposed you in life.\n\nIf the dead creature's alignment was different from yours, the corpse gets a Will save to resist the spell as if it were alive. If successful, the corpse can refuse to answer your questions or attempt to deceive you, using Bluff. The soul can only speak about what it knew in life. It cannot answer any questions that pertain to events that occurred after its death.\n\nIf the corpse has been subject to speak with dead within the past week, the new spell fails. You can cast this spell on a corpse that has been deceased for any amount of time, but the body must be mostly intact to be able to respond. A damaged corpse may be able to give partial answers or partially correct answers, but it must at least have a mouth in order to speak at all. This spell does not affect a corpse that has been turned into an undead creature.","source":"Core Rulebook"},{"n":"Speak with Haunt","l":2,"school":"Necromancy [language-dependent]","castingTime":"10 minutes","components":"V, S, DF","range":"10 ft. (see text)","target":"One haunt","duration":"1 minute/level","save":"Will negates (see text)","sr":"No","effect":"You stir a haunt (Pathfinder RPG GameMastery Guide 242) to a limited sense of awareness and consciousness, allowing it to answer questions. The spell's range must reach any square within 10 feet of the haunt's area. You must be aware of the haunt prior to casting the spell, and casting the spell does not trigger the haunt. You can ask one question per 2 caster levels. The haunt's knowledge is limited to what its original creature knew during life, including the languages it spoke. A haunt often remembers the circumstance that led to its existence (though this recollection might be from the original victim's perspective and therefore not objective), what triggers it, and how it can be laid to rest (destroyed). Answers are brief, cryptic, or repetitive, especially if the haunt is angry and vindictive.\n\nIf the haunt's alignment is more than one step away from yours, the haunt can attempt a Will save to resist the spell. A haunt's Will save modifier is equal to 3 + the haunt's CR. If the save is successful, the haunt can refuse to answer your questions or attempt to deceive you (using Bluff). A haunt's Bluff modifier equals its CR (minimum +0) or might be determined by the GM based upon the original victim. The haunt can speak only about what it knew in life and the circumstances by which it became a haunt. It cannot answer any questions that pertain to events that occurred after it was created. A neutral or good haunt might cooperate with similarly aligned creatures in order to end its suffering.\n\nIf a haunt has been subject to this spell within the past week, a new casting of this spell on it fails. You can cast this on a haunt that has been deceased for any amount of time. Unlike a corpse affected by speak with dead, a haunt wants to express itself, if only to share its pain or to cause mischief.","source":"Advanced Class Guide"},{"n":"Spectral Hand","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one spectral hand","duration":"1 min./level","save":"none","sr":"no","effect":"A ghostly hand shaped from your life force materializes and moves as you desire, allowing you to deliver low-level, touch range spells at a distance. On casting the spell, you lose 1d4 hit points that return when the spell ends (even if it is dispelled), but not if the hand is destroyed. (The hit points can be healed as normal.) For as long as the spell lasts, any touch range spell of 4th level or lower that you cast can be delivered by the spectral hand. The spell gives you a +2 bonus on your melee touch attack roll, and attacking with the hand counts normally as an attack. The hand always strikes from your direction. The hand cannot flank targets like a creature can. After it delivers a spell, or if it goes beyond the spell range or goes out of your sight, the hand returns to you and hovers.  The hand is incorporeal and thus cannot be harmed by normal weapons. It has improved evasion (half damage on a failed Reflex save and no damage on a successful save), your save bonuses, and an AC of 22 (+8 size, +4 natural armor). Your Intelligence modifier applies to the hand's AC as if it were the hand's Dexterity modifier. The hand has 1 to 4 hit points, the same number that you lost in creating it.","source":"PRPG Core Rulebook pg. 346"},{"n":"Spider Climb","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a live spider)","range":"touch","target":"creature touched","duration":"10 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject can climb and travel on vertical surfaces or even traverse ceilings as well as a spider does. The affected creature must have its hands free to climb in this manner. The subject gains a climb speed of 20 feet and a +8 racial bonus on Climb skill checks; furthermore, it need not make Climb checks to traverse a vertical or horizontal surface (even upside down). A spider climbing creature retains its Dexterity bonus to Armor Class (if any) while climbing, and opponents get no special bonus to their attacks against it. It cannot, however, use the run action while climbing.\nMythic Spider Climb\n##Source## Mythic Adventures pg. 109\nThe target gains a climb speed equal to its base land speed or 30 feet, whichever is higher. The target can take the run action while climbing and needs only one hand free to climb.\nThe target can move freely across spider webs (including giant spider webs), web spells, and similar adhesives of 2nd level or less (including tanglefoot bags) as if it were using freedom of movement.","source":"PRPG Core Rulebook pg. 347"},{"n":"Spiritual Weapon","l":2,"school":"Evocation [force]","castingTime":"1 standard action","components":"V, S, DF","range":"Medium (100 ft. + 10 ft./level)","target":"Magic weapon of force","duration":"1 round/level (D)","save":"None","sr":"Yes","effect":"A magical force weapon materializes and attacks designated adversaries under your command, dealing 1d8 force damage per hit, +1 point per three caster levels (maximum +5 at 15th level). The weapon assumes a form meaningful to your deity or faith and shares identical threat ranges and critical multipliers with physical equivalents.\n\nThe weapon attacks using your base attack bonus (possibly allowing it multiple attacks per round in subsequent rounds) plus your Wisdom modifier as its attack bonus. It functions as a spell rather than a physical weapon, enabling it to harm creatures with damage reduction and incorporeal beings without penalty.\n\nEach subsequent round, redirect the weapon via move action to a new target; otherwise it continues attacking the previous target. The weapon cannot be damaged physically but yields to dispel magic, disintegrate, sphere of annihilation, or rod of cancellation. Its touch AC is 12.","source":"Core Rulebook"},{"n":"Status","l":2,"school":"Divination","castingTime":"1 standard action","components":"V, S","range":"Touch","target":"One living creature touched per three levels","duration":"1 hour/level","save":"Will negates (harmless)","sr":"Yes (harmless)","effect":"This divination spell enables you to mentally track separated allies. You perceive direction, distance, and condition of affected creatures, detecting states such as being unharmed, wounded, disabled, staggered, unconscious, dying, nauseated, panicked, stunned, poisoned, diseased, or confused. The spell functions regardless of distance as long as subjects remain on the same plane. If a subject changes planes or perishes, the spell ceases functioning for that creature.","source":"Core Rulebook"},{"n":"Steal Voice","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"permanent (D)","save":"Fortitude negates","sr":"yes","effect":"The target’s throat constricts, giving it the caster croak spellblight (see Ultimate Magic).","source":"Ultimate Magic pg. 240"},{"n":"Suggestion","l":2,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, M (a snake's tongue and a honeycomb)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 hour/level or until completed","save":"Will negates","sr":"yes","effect":"You influence the actions of the target creature by suggesting a course of activity (limited to a sentence or two). The suggestion must be worded in such a manner as to make the activity sound reasonable. Asking the creature to do some obviously harmful act automatically negates the effect of the spell.\n\nThe suggested course of activity can continue for the entire duration. If the suggested activity can be completed in a shorter time, the spell ends when the subject finishes what it was asked to do. You can instead specify conditions that will trigger a special activity during the duration. If the condition is not met before the spell duration expires, the activity is not performed.\n\nA very reasonable suggestion causes the save to be made with a penalty (such as –1 or –2).","source":"PRPG Core Rulebook pg. 350"},{"n":"Summon Monster 2","l":2,"school":"conjuration (summoning)","castingTime":"1 round","components":"V, S, F/DF (a tiny bag and a small candle)","range":"close (25 ft. + 5 ft./2 levels)","target":"one summoned creature","duration":"1 round/level (D)","save":"none","sr":"no","effect":"Calls either one creature from the 2nd-level summon list or 1d3 creatures from the 1st-level list to fight for you, appearing where you designate and acting immediately on your turn. Creatures with an alignment subtype gain the celestial template if you're good, fiendish if you're evil, or your choice if neutral; summoned creatures cannot summon others, teleport, or cast spells with expensive material components.","source":"PRPG Core Rulebook pg. 352"},{"n":"Tactical Acumen","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a small piece of a map)","range":"30 ft.","target":"The caster and all allies within a 30-ft.-radius burst, centered on the caster","duration":"1 round/level (D)","save":"","sr":"","effect":"Tactical acumen grants you and your allies a mastery of battlefield tactics. Whenever you would gain a bonus on attack rolls or to AC due to battlefield position, such as flanking, higher ground, or cover, you gain an additional +1 insight bonus. This bonus increases by +1 for every five caster levels above 5th you possess (maximum +4).","source":"Ultimate Combat pg. 246"},{"n":"Tongues","l":2,"school":"divination","castingTime":"1 standard action","components":"V, M/DF (a clay model of a ziggurat)","range":"touch","target":"creature touched","duration":"10 min./level","save":"Will negates (harmless)","sr":"no","effect":"This spell grants the creature touched the ability to speak and understand the language of any intelligent creature, whether it is a racial tongue or a regional dialect. The subject can speak only one language at a time, although it may be able to understand several languages. Tongues does not enable the subject to speak with creatures who don't speak. The subject can make itself understood as far as its voice carries. This spell does not predispose any creature addressed toward the subject in any way.\nTongues can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 360"},{"n":"Touch of Idiocy","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"living creature touched","duration":"10 min./level","save":"no","sr":"yes","effect":"With a touch, you reduce the target's mental faculties. Your successful melee touch attack applies a 1d6 penalty to the target's Intelligence, Wisdom, and Charisma scores. This penalty can't reduce any of these scores below 1.\n\nThis spell's effect may make it impossible for the target to cast some or all of its spells, if the requisite ability score drops below the minimum required to cast spells of that level.","source":"PRPG Core Rulebook pg. 360"},{"n":"Voluminous Vocabulary","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a quill)","range":"touch","target":"creature touched","duration":"8 hours (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You choose any language (except for secret languages, such as Druidic). The target gains the ability to speak, understand, read, and write that language. When you cast this spell, you can attempt a DC 15 Linguistics check. If you succeed, choose an additional language, plus one more language for every 10 by which your check result exceeded the DC.\nWritten material can be read at the rate of one page (250 words) per minute. As with comprehend languages, this spell doesn’t impart insight into material the target read, just the literal meaning, and it doesn’t allow the target to read magical writing or decipher codes.\nIf the target lacks the mental capacity to grasp a language, it still gains enough knowledge to respond to and carry out even extremely complex commands or suggestions coached in the language (whether written or spoken). However, since this spell endows the target merely with a temporarily enhanced vocabulary, the person offering instructions to nonsentient creatures must take care to avoid metaphors or any other ambiguity.","source":"Ultimate Intrigue pg. 229"},{"n":"Water Walk","l":2,"school":"Transmutation [water]","castingTime":"1 standard action","components":"V, S, DF","range":"Touch","target":"One touched creature/level","duration":"10 min./level (D)","save":"Will negates (harmless)","sr":"Yes (harmless)","effect":"The transmuted creatures can tread on any liquid as if it were firm ground. Mud, oil, snow, quicksand, running water, ice, and even lava can be traversed easily, since the subjects' feet hover an inch or two above the surface. Creatures crossing molten lava still take damage from the heat because they are near it. The subjects can walk, run, charge, or otherwise move across the surface as if it were normal ground.\n\nIf the spell is cast underwater (or while the subjects are partially or wholly submerged in whatever liquid they are in), the subjects are borne toward the surface at 60 feet per round until they can stand on it.","source":"Core Rulebook"},{"n":"Whispering Wind","l":2,"school":"transmutation [air]","castingTime":"1 standard action","components":"V, S","range":"1 mile/level","target":"10-ft.-radius spread","duration":"no more than 1 hour/level or until discharged (destination is reached)","save":"none","sr":"no","effect":"You send a message or sound on the wind to a designated spot. The whispering wind travels to a specific location within range that is familiar to you, provided that it can find a way to the location. A whispering wind is as gentle and unnoticed as a zephyr until it reaches the location. It then delivers its whisper-quiet message or other sound. Note that the message is delivered regardless of whether anyone is present to hear it. The wind then dissipates.\n\nYou can prepare the spell to bear a message
