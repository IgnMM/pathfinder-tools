 then dissipates.\n\nYou can prepare the spell to bear a message of no more than 25 words, cause the spell to deliver other sounds for 1 round, or merely have the whispering wind seem to be a faint stirring of the air. You can likewise cause the whispering wind to move as slowly as 1 mile per hour or as quickly as 1 mile per 10 minutes.\n\nWhen the spell reaches its objective, it swirls and remains in place until the message is delivered. As with magic mouth, whispering wind cannot speak verbal components, use command words, or activate magical effects.","source":"PRPG Core Rulebook pg. 369"},{"n":"Zone of Truth","l":2,"school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"Close (25 ft. + 5 ft./2 levels)","target":"20-ft.-radius emanation","duration":"1 min./level","save":"Will negates","sr":"Yes","effect":"This enchantment prevents creatures within its emanation from speaking deliberate and intentional lies. Affected creatures receive a save when the spell is cast or upon entering the area. They remain aware of the effect and may simply refrain from answering questions or speak evasively while staying truthful. Once they leave the zone's boundaries, they may speak freely again.","source":"Core Rulebook"},{"n":"Adjustable Disguise","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"This spell functions as disguise self, except as a swift action you can alter the disguise (within the limitations of disguise self). For example, you could make yourself look like a young human city guard, then an old elven wizard of the opposite gender, then a halfling thief, and so on. You can change the disguise a number of times equal to your caster level.","source":"Advanced Class Guide pg. 172"},{"n":"Akashic Communion","l":3,"school":"divination","castingTime":"10 minutes","components":"V, S, M/DF (a square of reflective silver worth 100 gp)","range":"personal","target":"","duration":"1 minute/level","save":"","sr":"","effect":"You attempt to obtain a glimpse of some specific event from the Akashic Record (Occult Adventures 244), the extraplanar repository of all experiences that have ever occurred. This allows you to attempt one Knowledge skill check of your choice per 3 caster levels you have, each with a +10 insight bonus. You are treated as trained in any Knowledge skills used for these checks, and can use this spell to reroll a Knowledge skill check you have already failed. The GM rolls these Knowledge checks in secret, as the Akashic Record is incredibly remote, and impressions gleaned from the distant repository are sometimes skewed when received. On a natural 1, the resulting answer is wildly inaccurate.\n\nThis spell provides experiential guidance based on your ability to understand the flashes of insight gleaned from the Akashic Record, rather than the perfect knowledge available to those who travel to the extraplanar repository of knowledge. If you lag, discuss the answers, or go off to do anything else, the spell ends. Once you have used this spell to gain information on a specific topic or event, you cannot use it for Knowledge checks regarding that topic or event again until you have gained a caster level.","source":"Magic Tactics Toolbox pg. 16"},{"n":"Amnesia","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"You cause the target to lose most of its memories; its skills, its past, and even its name become mysteries to it. While the target can build new memories, it has trouble accessing those gained before falling victim to the spell. The target can still speak and read any languages it knows and perform basic tasks, but it loses all class abilities, feats, and skill ranks gained before being affected by amnesia. It retains its base attack bonus, saving throws bonuses, Combat Maneuver Bonus, Combat Maneuver Defense, total experience points, Hit Dice, and hit points. If the target gains a character level while suffering from amnesia, it can use any abilities gained by that class level normally. If the class level it gained was from a class in which it already has levels, it gains the abilities of a 1st-level character of that class, even though it is technically of a higher level in that class.\n\nIf the amnesia is cured, the target regains the full abilities of the class, including those gained from any levels taken while suffering from this condition. Amnesia can be removed only by heal, limited wish, miracle, psychic surgeryOA, or wish.","source":"Villain Codex pg. 8"},{"n":"Apport Animal","l":3,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V","range":"touch","target":"one touched animal of Tiny or smaller size","duration":"instantaneous or 1 hour/level","save":"Will negates (object)","sr":"yes (object)","effect":"This spell functions like apport object except the target is an animal. Only normal, nonmagical creatures of the animal type can be teleported.","source":"Occult Adventures pg. 157"},{"n":"Apsu's Shining Scales","l":3,"school":"evocation [draconic, good]","castingTime":"1 standard action","components":"V, S, M (a drop of mercury)","range":"personal","target":"you","duration":"1 minute/level","save":"none","sr":"no","effect":"You envelop your body with silver radiance that manifests as scales surrounding your body, granting you a +5 armor bonus to your AC and causing your natural attacks and unarmed strikes to bypass damage reduction as if they were good and silver weapons.\nWhenever you attack with a breath weapon (including effects that are similar to a dragon’s breath weapon, such as an elixir of dragon breath or the dragon’s breathAPG spell), you can discharge the Apsu’s shining scales spell as a swift action in order to infuse your breath with silver light, causing any evil creature caught within the area of the breath to take a -4 penalty on its Reflex save and to lose the benefits of the evasion ability against that breath weapon attack. Evil creatures with improved evasion are instead treated as if they had only evasion when attempting to save against this breath weapon attack.\nClerics, inquisitors, oracles, paladins, and warpriests who worship Apsu add Apsu’s shining scales to their class spell lists as a 3rd-level spell.","source":"Legacy of Dragons pg. 28"},{"n":"Army Across Time","l":3,"school":"conjuration (summoning)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"five 5-ft. cubes of temporal possibility plus one additional cube/level","duration":"1 round/level","save":"none","sr":"no","effect":"This spell functions as ally across time as noted above with two exceptions. First, you can summon one duplicate per caster level before the spell ends. Second, you can have up to one duplicate in existence at a time for every 3 caster levels you have.","source":"Legacy of the First World pg. 30"},{"n":"Assume Appearance","l":3,"school":"transmutation (polymorph)","castingTime":"1 minute","components":"V, S, F (corpse of the deceased creature whose form you plan to assume)","range":"personal","target":"you","duration":"1 day/level (D)","save":"none","sr":"no","effect":"This spell functions similarly to alter self, except for the following differences. You assume the exact form of a deceased Small or Medium creature of the humanoid type. Your voice changes to match that of the form you assume. The creature whose form you assume must be dead and you must have access to its fresh corpse (either dead less than 24 hours, or preserved via gentle repose or similar effect). Any attempt to copy the form of a living creature causes the spell to fail. You do not have access to the assumed form’s abilities, memories, mannerisms, or speech patterns. The spell grants a +10 bonus on Disguise checks to appear as the imitated creature.\nIf the assumed creature is returned to life while this spell is active, assume appearance immediately ends.","source":"Horror Adventures pg. 108"},{"n":"Aura Alteration","l":3,"school":"illusion","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one object or willing creature","duration":"1 day/level (D)","save":"Will negates (harmless, object)","sr":"yes","effect":"You mask and manipulate the target creature’s or object’s aura, confounding those who would attempt to discern helpful information from it using the read aura occult skill unlock (see page 197) or the analyze aura spell. You can change each of the following four auras with one casting of aura alteration . Alignment Aura : You can change the target’s apparent alignment to thwart spells that detect alignment, such as detect evil . You can alter the alignment by up to one step on each alignment axis, but can’t make the creature appear to have a diametrically opposed alignment. For instance, you couldn’t make a lawful evil character appear to be chaotic or good. You can also adjust the power of the alignment aura up or down in level by a number of steps equal to 1/2 your level or fewer. Emotion Aura : Your manipulations mask the true emotions of the target, instead depicting any combination of colors on the emotional spectrum that you wish. Creatures attempting Bluff, Diplomacy, Intimidate, or Sense Motive checks against the target receive no bonuses on their checks based on information gleaned from the target’s aura. Health Aura : You adulterate the target’s aura to mask the condition of its physical body, revealing instead a wounded status, poison or disease status, and conditions of your choice. You likewise mask the target’s available ki points or similar resources, manipulating its aura to suggest any number within the range normally available to the target. Magic Aura : You alter a creature or item’s magic aura so that it registers to detect magic (and spells with similar capabilities, like analyze aura ) as though it were nonmagical, a magic item of a kind you specify, or the subject of a spell you specify. A single casting of aura alteration is sufficient to mask all of the magic auras on the target. If an object bearing aura alteration has identify cast on it or is similarly examined, the examiner recognizes the aura is false and detects the object’s actual qualities if he succeeds at a Will save. If a targeted item’s own aura is overwhelming, aura alteration can’t alter it.","source":"Occult Adventures pg. 157"},{"n":"Ban Corruption","l":3,"school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, F (a ceremonial dagger)","range":"Consultar manual","target":"30 ft.-radius emanation centered on you","duration":"Concentration plus 1 round/level, up to 1 hour/level","save":"Will negates","sr":"Yes","effect":"You strip all creatures within the emanation of any gifts associated with corruptions (see page 14). Abilities associated with corruptions cease to function, as if they were magically dispelled. The corruption stains still fully affect creatures. A creature that enters the emanation and fails its saving throw loses its gifts until the spell's duration ends, even if it leaves the emanation, but a successful saving throw renders a creature immune to the spell, even if it enters and exits the emanation several times.","source":"Horror Adventures"},{"n":"Borrow Fortune","l":3,"school":"evocation","castingTime":"1 immediate action","components":"V","range":"personal","target":"you","duration":"instantaneous; see text","save":"","sr":"","effect":"When you make a d20 roll, you may choose to immediately cast this spell to reroll that die before success or failure is known, keeping the more favorable result. For the next two rounds following your casting of the spell, you must roll two dice each time a d20 roll is called for, keeping the less favorable result.","source":"Advanced Player's Guide pg. 206"},{"n":"Burst of Speed","l":3,"school":"transmutation","castingTime":"1 swift action","components":"V","range":"personal","target":"you","duration":"see text","save":"none","sr":"no","effect":"Until the end of your turn, you gain a +20-foot bonus to speed (or +10-foot bonus if you are wearing Medium or Heavy armor), your movement does not provoke attacks of opportunity, and you can move through the space of creatures that are larger than you are, but you cannot end your movement this round in a space occupied by a creature.","source":"Ultimate Combat pg. 225"},{"n":"Call Spirit","l":3,"school":"Conjuration (calling)","castingTime":"10 minutes","components":"V, S","range":"10 ft.","target":"Call the spirit of a single deceased humanoid creature","duration":"Concentration","save":"Will negates, see text","sr":"No","effect":"You attempt to cause the spirit of a specific individual to manifest from its final resting place. You must request the spirit's presence by speaking its name.\n\nUnwilling spirits can resist the summons by succeeding at a Will save. If the chosen spirit resists your call, another spirit with malevolent intent almost always takes its place, intent on deceiving you. The difficulty of the save depends on how well you know the subject and what sort of physical connection (if any) you have to the creature whose spirit you wish to call.\n\nKnowledgeWill Save Modifier Name only†+15 Secondhand (you have heard of the subject)+10 Firsthand (you met the subject in life)+5 Familiar (you knew the subject well)+0 † You must have at least a name the creature was called in life.\nConnectionWill Save Modifier Likeness or picture-2 Possession or garment-4 Body part, lock of hair, nail clipping, etc.-10 Different alignment+4\nA successfully called spirit manifests as a wispy, vaporous form that vaguely resembles the form the deceased creature had in life. The spirit has the physical attributes of an unseen servant and is capable of minor physical manipulations, with the ability to speak in quiet, ghostly whispers in whatever languages the creature knew while it was alive. The spirit isn't an undead creature, and isn't beholden to its caller. Whether you summoned the chosen spirit or a deceitful replacement, the spirit can refuse to answer your questions or attempt to deceive you using Bluff, though in either case these spirits can speak about only what they knew in life and have no knowledge of events that occurred after their deaths. Malevolent spirits might take advantage of their limited physical abilities to cause terrifying spectacles designed to scare the caster.\n\nYou must concentrate on maintaining the spell (as a standard action) in order to ask questions at the rate of one per round. You can ask a total of one question per caster level; the spirit answers each during the same round. When the spell ends, the spirit's ectoplasmic form fades and the soul returns to its rest. This spell can't call the spirits of creatures that are currently undead.","source":"Occult Adventures"},{"n":"Complex Hallucination","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration + 3 rounds","save":"Will disbelief","sr":"yes","effect":"This spell functions as audiovisual hallucination, except that the phantasm you create can also include olfactory, tactile, and thermal effects.","source":"Ultimate Intrigue pg. 206"},{"n":"Conditional Curse","l":3,"school":"necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"permanent; see text","save":"Will negates","sr":"yes","effect":"Functions as bestow curse, but you must specify a condition (achievable within a year and a day without requiring self-harm, statable in 25 words or fewer) under which the curse automatically ends; the target instantly understands the condition regardless of language. The curse is harder to lift than a normal bestow curse: the DC to remove it with break enchantment or remove curse is increased by 5.","source":"Ultimate Intrigue pg. 206"},{"n":"Contact Entity III","l":3,"school":"Evocation","castingTime":"1 minute","components":"V, S, M (see text)","range":"200 miles","target":"Up to 20 entities of 18 HD or fewer","duration":"Instantaneous","save":"Consultar manual","sr":"Consultar manual","effect":"This spell functions like contact entity II, except that you can contact creatures from the contact entity III list, and as noted above. Additionally, if a contacted creature has telepathy, it can send a telepathic message to you of up to 10 words.","source":"Horror Adventures"},{"n":"Daze, Mass","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one or more humanoid creatures, no two of which may be more than 30 ft. apart","duration":"1 round","save":"will negates","sr":"yes","effect":"This spell functions as daze, except as noted above.","source":"Ultimate Magic pg. 216"},{"n":"Deceitful Veneer","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"10 minutes/level (D)","save":"Will negates","sr":"yes","effect":"Subtly warps the target's aura and body language so that everything it says appears false to magical lie detection and to Sense Motive checks, which require a DC 15 + your caster level check to see through; while the target is within close range, you may suppress or resume this effect as a standard action.","source":"Ultimate Intrigue pg. 210"},{"n":"Deft Digits","l":3,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"Medium (100 ft. + 10 ft./level)","target":"1 unattended gauntlet or glove","duration":"10 minutes/level","save":"None (harmless, object)","sr":"no","effect":"You animate the target of the spell, manipulating the glove with your own hand from a distance. The glove moves as you direct it with a fly speed of 30 feet and average maneuverability. Directing the glove is a standard action, though the glove can move up to its speed and perform a task in the same action. You can attempt Disable Device and Sleight of Hand checks using the glove, though attempting these checks at a distance increases the normal skill check DCs by 5, or by 20 if you do not have line of sight to the object you are manipulating. The glove can also lift or drag objects using your caster level as your Strength score. The glove cannot wield weapons or make attacks effectively while this spell is in effect. If you cast this spell on a magical glove, its innate magic is suppressed for the duration of the spell.","source":"Arcane Anthology pg. 19"},{"n":"Demanding Message","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F (a piece of copper wire)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level","duration":"10 minutes/level, then 1 hour/level or until completed (D); see text","save":"Will negates (see text)","sr":"yes; see text","effect":"This spell initially functions as message (allowing no save or spell resistance). Once during the message effect, you can concentrate as a standard action to issue a suggestion to one target as part of delivering a message. Spell resistance and a Will save apply to the suggestion, and it lasts for 1 hour per level or until completed.","source":"Ultimate Intrigue pg. 210"},{"n":"Detect Scrying","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a piece of mirror and a miniature brass hearing trumpet)","range":"40 ft.","target":"40-ft.-radius emanation centered on you","duration":"24 hours","save":"none","sr":"no","effect":"You immediately become aware of any attempt to observe you by means of a divination (scrying) spell or effect. The spell's area radiates from you and moves as you move. You know the location of every magical sensor within the spell's area.\n\nIf the scrying attempt originates within the area, you also know its location; otherwise, you and the scrier immediately make opposed caster level checks (1d20 + caster level). If you at least match the scrier's result, you get a visual image of the scrier and an accurate sense of his direction and distance from you.","source":"PRPG Core Rulebook pg. 268"},{"n":"Dimension Door","l":3,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V","range":"long (400 ft. + 40 ft./level)","target":"you and touched objects or other touched willing creatures","duration":"instantaneous","save":"none and Will negates (object)","sr":"no and yes (object)","effect":"You instantly transfer yourself from your current location to any other spot within range. You always arrive at exactly the spot desired—whether by simply visualizing the area or by stating direction. After using this spell, you can't take any other actions until your next turn. You can bring along objects as long as their weight doesn't exceed your maximum load. You may also bring one additional willing Medium or smaller creature (carrying gear or objects up to its maximum load) or its equivalent per three caster levels. A Large creature counts as two Medium creatures, a Huge creature counts as two Large creatures, and so forth. All creatures to be transported must be in contact with one another, and at least one of those creatures must be in contact with you.\n\nIf you arrive in a place that is already occupied by a solid body, you and each creature traveling with you take 1d6 points of damage and are shunted to a random open space on a suitable surface within 100 feet of the intended location.\n\nIf there is no free space within 100 feet, you and each creature traveling with you take an additional 2d6 points of damage and are shunted to a free space within 1,000 feet. If there is no free space within 1,000 feet, you and each creature travelling with you take an additional 4d6 points of damage and the spell simply fails.","source":"PRPG Core Rulebook pg. 269"},{"n":"Dimensional Anchor","l":3,"school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"Medium (100 ft. + 10 ft./level)","target":"Ray","duration":"1 min./level","save":"None","sr":"Yes (object)","effect":"This abjuration spell creates a shimmering emerald field that completely blocks extradimensional travel. The caster makes a ranged touch attack, and affected targets cannot use teleportation, dimension door, astral projection, blink, or similar movement abilities for the spell's duration.\n\nThe spell does not hinder creatures already in ethereal or astral form when cast, nor does it block extradimensional perception or attacks. Additionally, dimensional anchor does not prevent summoned creatures from disappearing at the end of a summoning spell.","source":"Core Rulebook"},{"n":"Discern Lies","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration, up to 1 round/level","save":"Will negates","sr":"no","effect":"Each round, you concentrate on one target, who must be within range. You know if the target deliberately and knowingly speaks a lie by discerning disturbances in its aura caused by lying. The spell does not reveal the truth, uncover unintentional inaccuracies, or necessarily reveal evasions.\nEach round, you may concentrate on a different target.","source":"PRPG Core Rulebook pg. 270"},{"n":"Dispel Magic","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one spellcaster, creature, or object","duration":"instantaneous","save":"none","sr":"no","effect":"Ends one ongoing magical effect on the target by making a dispel check (1d20 + your caster level) against DC 11 + the target spell's caster level, attempting the highest-level effect first unless you specify otherwise; can also suppress a magic item's properties for 1d4 rounds, or be used as a counterspell requiring a dispel check against the opposing caster. Instantaneous-duration effects and certain protected effects cannot be dispelled.","source":"PRPG Core Rulebook pg. 272"},{"n":"Displacement","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, M (a small loop of leather)","range":"touch","target":"creature touched","duration":"1 round/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject of this spell appears to be about 2 feet away from its true location. The creature benefits from a 50% miss chance as if it had total concealment. Unlike actual total concealment, displacement does not prevent enemies from targeting the creature normally. True seeing reveals its true location and negates the miss chance.","source":"PRPG Core Rulebook pg. 273"},{"n":"Divination","l":3,"school":"Divination","castingTime":"10 minutes","components":"V, S, M (incense and offering worth 25 gp)","range":"Personal","target":"You","duration":"Instantaneous","save":"None","sr":"No","effect":"This enhanced variant of augury grants a useful piece of advice in reply to a question concerning a specific goal, event, or activity that is to occur within 1 week. The response may range from brief guidance to cryptic omens. Success depends on a base 70% chance plus 1% per caster level (maximum 90%). Failed castings are detectable unless false information magic obscures the failure. Repeated divinations on identical topics by the same caster produce consistent results from the initial casting.","source":"Core Rulebook"},{"n":"Dreadscape","l":3,"school":"illusion (phantasm) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a pinch of black sand)","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one creature/level, no two of which can be more than 30 feet apart","duration":"10 minutes/level","save":"Will negates","sr":"yes","effect":"Your targets see their surroundings as a nightmarish reflection of the world around them. Buildings and furnishings take on a dirty, ruined appearance. Even allies appear foreign and hostile, with friendly speech turning into garbled mockery and threats. Each target gains the scared condition and has a hostile attitude toward any new creature it encounters (though not toward creatures that were already present at the time of the casting). Being hostile doesn’t necessarily mean the target will attack, and creatures can attempt Diplomacy checks to gain a target’s trust at the normal DC. If a creature becomes frightened or panicked while under the influence of dreadscape, that creature takes 1d6 points of Wisdom damage, though only once per casting of dreadscape.\n\nIf your campaign uses the sanity system (see page 12), creatures that become frightened or panicked take 2d6 sanity damage instead of Wisdom damage.","source":"Horror Adventures pg. 116"},{"n":"Dream","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 minute","components":"V, S","range":"unlimited","target":"one living creature touched","duration":"see text","save":"none","sr":"yes","effect":"You, or a messenger you touch, send a message to others in the form of a dream. At the beginning of the spell, you must name the recipient or identify him or her by some title that leaves no doubt as to identity. The messenger then enters a trance, appears in the intended recipient's dream, and delivers the message. The message can be of any length, and the recipient remembers it perfectly upon waking. The communication is one-way. The recipient cannot ask questions or offer information, nor can the messenger gain any information by observing the dreams of the recipient.\nOnce the message is delivered, the messenger's mind returns instantly to its body. The duration of the spell is the time required for the messenger to enter the recipient's dream and deliver the message.\nIf the recipient is awake when the spell begins, the messenger can choose to wake up (ending the spell) or remain in the trance. The messenger can remain in the trance until the recipient goes to sleep, then enter the recipient's dream and deliver the message as normal. A messenger that is disturbed during the trance comes awake, ending the spell.\nCreatures who don't sleep or don't dream cannot be contacted by this spell.\nThe messenger is unaware of its own surroundings or of the activities around it while in the trance. It is defenseless both physically and mentally (always failing any saving throw) while in the trance.\nMythic Dream\n##Source## Mythic Adventures pg. 92\nYou or the messenger may gain information from the dreamer you contact by asking questions as if using speak with dead to speak with a corpse. An unwilling dreamer can attempt to resist this probing with a Will save (as speak with dead, using the DC dream would have if it allowed a saving throw). Answers to these questions are still generally brief and cryptic.","source":"PRPG Core Rulebook pg. 274"},{"n":"Enter Image","l":3,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a drop of paint and a ball of clay)","range":"50 ft./level","target":"transfer consciousness to any object bearing your likeness","duration":"concentration","save":"none","sr":"no","effect":"You gain a dim impression of the activities around any object bearing your face or form and can also project your consciousness into one such object at a time, allowing you to observe or even interact with nearby creatures. This spell allows you to leave your body and subconsciously monitor the immediate area around any depiction of your image whether one, hundreds, or even thousands. Each such image has the full range of your normal senses (sight, hearing, smell, etc.) and you can make a Perception check to notice anything occurring nearby. The DC of this check is always 10 greater than what it would be if you were actually present at that location, so even if you would normally notice something automatically (such as talking, normally a DC of 0), you would need to make a DC 10 Perception check to notice it.\n\nYou may, at any time, choose to fill one specific image within range with your consciousness. While inside an image you lose the ability to monitor any other images within range but remain fully aware of your own body’s surroundings. Your body is defenseless and helpless (always failing any saving throw) while your consciousness is filling an image, but you can return to it at any time as an immediate action.\n\nWhen you fill an image with your consciousness it gains a limited form of animation. Statues and similar three-dimensional representations can move their heads, make gestures, and talk, but cannot attack or leave their square without assistance. Portraits or similar two-dimensional representations bearing your likeness can also talk and your image can move anywhere within the picture or even temporarily alter it (such as by picking a flower in the painting). You cannot use any spells or other abilities while within an image.\n\nYou may leave the image at any time, returning you to your body. Once your consciousness departs from an object bearing your likeness, it immediately reverts to the appearance it had before you entered it. If someone destroys or damages the image you return to your body unharmed. The spell lasts until you cease concentrating, or until it is terminated by some outside means, such as a dispel magic cast upon either the image or your body, or if your body is killed.","source":"Advanced Player's Guide pg. 219"},{"n":"Entice Fey, Lesser","l":3,"school":"conjuration (calling)","castingTime":"10 minutes","components":"V, S, M (offerings worth 500 gp plus payment, see text), DF","range":"close (25 ft. + 5 ft./2 levels)","target":"one called fey, with 6 Hit Dice or fewer","duration":"instantaneous","save":"none","sr":"no","effect":"This spell functions as lesser planar ally, except that you entice a fey of 6 HD or fewer to lend you its aid with an offering of music or something else it finds appealing. Like lesser planar ally, this spell is unpredictable, and the fey who answers the calling is up to the whims of nature and the fey, not your own choice. You must succeed at a Knowledge (nature) check or Perform check (DC = 20 + target’s HD) in addition to the spell’s material component to entice the fey into appearing, after which you can negotiate for the service and your payment. The maximum HD of fey that you can call with that casting is equal to the result of your check – 20. For example, if your check result is a 24, the maximum HD for the called fey is 4. A high result doesn’t allow you to break the HD maximum for the spell, and a result of 20 or less means you can’t call a fey at all. If the fey doesn’t like the sound of your offer, it can simply choose to refuse, in which case you don’t expend any of the material components for the spell, either the offerings or the payment.","source":"Ultimate Intrigue pg. 213"},{"n":"Erase Impressions","l":3,"school":"abjuration","castingTime":"1 round","components":"V, S","range":"touch","target":"object touched","duration":"instantaneous","save":"Will negates (object)","sr":"yes (object)","effect":"You banish psychic impressions from the object touched, rendering it devoid of recent history. You choose how much time to erase, up to a maximum of 1 day per caster level. You must erase impressions from the present time back; you cannot choose to leave recent events untouched. Impressions erased in this manner cannot be recovered via object reading , legend lore , or similar measures. Casting erase impressions on a corpse removes recent psychic impressions from when the creature was alive as well, making those memories unavailable to speak with dead . For example, a 5th-level caster casting the spell on a 2-day-old corpse could erase the past 2 days of psychic impressions from the corpse and 3 additional days of information from just before the creature died.","source":"Occult Adventures pg. 170"},{"n":"False Future","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (crushed jade worth 100 gp)","range":"touch","target":"creature or object touched","duration":"1 hour/level (D)","save":"Will negates or Will disbelief (see text)","sr":"yes","effect":"You interfere with attempts to predict the target’s future by preventing divinations from revealing what the target will do and what will befall the target while under the spell’s effects. Instead of the target’s true actions or experiences, divinations resolve as if the target will experience some different future you describe as you cast false future. The target creature can attempt a Will save to avoid the initial effect, and creatures using divinations get a Will save to disbelieve the illusion. This spell doesn’t prevent divinations cast after the duration’s end from determining what the subject actually did during the time you obscured using false future.\n\nFalse future can’t be detected by detect magic or identify, but greater detect magic can detect it.","source":"Ultimate Intrigue pg. 214"},{"n":"False Life, Greater","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a drop of blood)","range":"personal","target":"you","duration":"1 hour/level or until discharged; see text","save":"none","sr":"no","effect":"This spell functions as false life, except you gain temporary hit points equal to 2d10 + 1 point per caster level (maximum +20). The effects of this spell do not stack with those of false life.","source":"Ultimate Magic pg. 219"},{"n":"Find Fault","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"1 creature","duration":"instantaneous","save":"none","sr":"yes","effect":"You instantly learn many of the target’s weaknesses, as if you had made an appropriate Knowledge skill check with a result equal to 20 + your caster level. Additionally, your first melee or ranged attack roll against the creature before the end of your next turn gains a +5 insight bonus. If the creature is polymorphed, disguised, or hidden by an illusion and you are not aware of it’s true form, this spell fails as if the target has spell resistance you failed to penetrate (the GM may have you attempt a caster level check to conceal the true reason for the spell’s failure).","source":"Arcane Anthology pg. 24"},{"n":"Fly","l":3,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (a wing feather)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject can fly at a speed of 60 feet (or 40 feet if it wears medium or heavy armor, or if it carries a medium or heavy load). It can ascend at half speed and descend at double speed, and its maneuverability is good. Using a fly spell requires only as much concentration as walking, so the subject can attack or cast spells normally. The subject of a fly spell can charge but not run, and it cannot carry aloft more weight than its maximum load, plus any armor it wears. The subject gains a bonus on Fly skill checks equal to 1/2 your caster level.\nShould the spell duration expire while the subject is still aloft, the magic fails slowly. The subject floats downward 60 feet per round for 1d6 rounds. If it reaches the ground in that amount of time, it lands safely. If not, it falls the rest of the distance, taking 1d6 points of damage per 10 feet of fall. Since dispelling a spell effectively ends it, the subject also descends safely in this way if the fly spell is dispelled, but not if it is negated by an antimagic field.\nMythic Fly\n##Source## Mythic Adventures pg. 95\nThe fly speed changes to 120 feet (or 80 feet if the target is wearing medium or heavy armor, or carrying a medium or heavy load) with perfect maneuverability. When the duration expires, the target is protected by feather fall for a number of rounds equal to your caster level.\nAugmented (3rd): If you expend two uses of mythic power, the target adds your tier on Reflex saves and as a dodge bonus to AC. It gains these bonuses only while flying.","source":"PRPG Core Rulebook pg. 284"},{"n":"Free Spirit","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"This spell allows you to channel the essence of Cayden Cailean’s philosophy, giving you the benefits of a freedom of movement spell and granting you a +4 bonus on saving throws against fear effects. The spell also makes you drunk. For the duration of the spell, you take a –2 penalty on attack rolls, ability checks, skill checks, and concentration checks. If you somehow remove or avoid these penalties, the spell’s duration ends.","source":"Inner Sea Temples pg. 23"},{"n":"Free Swim","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (a strip of kelp bound to the target), DF","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The target can move and attack underwater normally without the usual penalties involved with underwater combat, as if under the effects of freedom of movement. However, the target doesn’t gain any protections against grapple, paralysis, and magical effects that impede movement (such as solid fog, slow, and web).","source":"Aquatic Adventures pg. 59"},{"n":"Gaseous Form","l":3,"school":"transmutation","castingTime":"1 standard action","components":"S, M/DF (a bit of gauze and a wisp of smoke)","range":"touch","target":"willing corporeal creature touched","duration":"2 min./level (D)","save":"none","sr":"no","effect":"The subject and all its gear become insubstantial, misty, and translucent. Its material armor (including natural armor) becomes worthless, though its size, Dexterity, deflection bonuses, and armor bonuses from force effects still apply. The subject gains DR 10/magic and becomes immune to poison, sneak attacks, and critical hits. It can't attack or cast spells with verbal, somatic, material, or focus components while in gaseous form. This does not rule out the use of certain spells that the subject may have prepared using the feats Silent Spell, Still Spell, and Eschew Materials. The subject also loses supernatural abilities while in gaseous form. If it has a touch spell ready to use, that spell is discharged harmlessly when the gaseous form spell takes effect.\nA gaseous creature can't run, but it can fly at a speed of 10 feet and automatically succeeds on all Fly skill checks. It can pass through small holes or narrow openings, even mere cracks, with all it was wearing or holding in its hands, as long as the spell persists. The creature is subject to the effects of wind, and it can't enter water or other liquid. It also can't manipulate objects or activate items, even those carried along with its gaseous form. Continuously active items remain active, though in some cases their effects may be moot.\nMythic Gaseous Form\n##Source## Mythic Adventures pg. 96\nThe damage reduction changes to DR 10/epic and magic, and the fly speed increases to 30 feet. The target can expand itself as a free action, filling an area equal to double its normal space and height (a Medium creature fills a 10-foot-by-10-foot space to a height of about 10 feet) and blocking vision as obscuring mist. Returning from expanded to normal size is also a free action.\nAugmented: If you expend two uses of mythic power, the target can shift into or out of gaseous form as a move action.","source":"PRPG Core Rulebook pg. 287"},{"n":"Geomessage","l":3,"school":"illusion (figment)","castingTime":"1 minute","components":"V, S, M (a scrap of vellum)","range":"touch","target":"surface touched","duration":"1 day/level","save":"none","sr":"no","effect":"You create a written message of 50 words or fewer, or else an image, a drawing, or a similar diagram. The figment hangs invisible and obscured upon the target surface for the duration of the spell. Another casting of geomessage is needed to cause the figment to arrange itself into the intended message.\n\nWhen you cast the spell, you can choose to incorporate a passphrase into the spell. If you do so, the message is protected as if nondetection had been cast on it for the full duration of the spell, though creatures that cast geomessage on the surface and speak the passphrase ignore the nondetection effect and cause the image to become visible until the caster speaks the passphrase again.\n\nWithout a passphrase, the message simply remains invisible to those who cast geomessage. Detection methods like detect magic and see invisibility indicate the message’s presence but do not reveal its contents.","source":"Villain Codex pg. 237"},{"n":"Glimpse of Truth","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a tourmaline costing 50 gp)","range":"personal","target":"you","duration":"1 round","save":"none","sr":"no","effect":"This spell functions like true seeing, except as noted above.","source":"Ultimate Intrigue pg. 215"},{"n":"Hollow Heroism","l":3,"school":"enchantment (compulsion) [mind-affecting, ruse]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions as heroism, except that you can reverse the spell by issuing a special command as a standard action if you are within medium range (100 feet + 10 feet per caster level) of the target. The target loses the bonuses and instead takes a –2 penalty on attack rolls, saving throws, and skill checks until the spell’s duration ends (no save).\n\nAttempts to identify hollow heroism with a skill check incorrectly identify it as heroism.","source":"Ultimate Intrigue pg. 216"},{"n":"Horrific Doubles","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"You create several illusory doubles of yourself, where you and each image all seem slightly off or wrong in appearance. Treat this spell as mirror image, except as noted.\n\nEach creature that can see the doubles must succeed at a Will save or become shaken for as long as it can see any of the doubles. A successful saving throw negates the shaken condition and renders the creature immune to the further effects of this spell (beyond the usual effects of mirror image). In addition, the first time a creature that failed its initial saving throw destroys one of the images, it must succeed at a Will save or its perception of the double shifts at the last second. The double takes on the face of the attacker, the face of a loved one, or some other equally disturbing image, causing the attacker to become frightened for 1 round and take 1d3 points of Wisdom damage from the traumatic shock. Both additional effects are mind-affecting fear effects, and spell resistance applies against them.\n\nIf your campaign uses the sanity system (see page 12), a creature takes 1d8 points of sanity damage instead of Wisdom damage.","source":"Horror Adventures pg. 120"},{"n":"Impossible Angles","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, M (a melted prism)","range":"medium (100 ft. + 10 ft./level)","target":"contiguous area up to one 5-foot cube/caster level (S)","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"You cause the surrounding area to appear to distort. The angles and corners of the area subtly twist and contort, creating unnatural and impossible shapes. Any creature entering the area must succeed at a Will save or become disoriented. Disoriented characters treat the area as difficult terrain and are sickened. In addition, whenever a disoriented creature uses an action to move (including taking a 5-foot step if it can do so in difficult terrain), roll 1d8 to see which direction it moves, in a similar manner to determining where a splash weapon lands on a miss (Pathfinder RPG Core Rulebook 202). On a 1, the creature moves in its intended direction, with 2 through 8 rotating around the creature’s starting square in a clockwise direction. Only the creature’s first 5 feet of movement each round are affected in this way—it can move normally for any remaining movement, either from the same action or from later actions, as the creature acclimatizes to the distortion. An affected creature can attempt a new Will save each round to end the disoriented effect. A creature that leaves the area and re-enters must attempt the saving throw again, even if it succeeded at its initial save.","source":"Horror Adventures"},{"n":"Invisibility, Greater","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal or touch","target":"you or creature touched","duration":"1 round/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions like invisibility, except that it doesn't end if the subject attacks.","source":"PRPG Core Rulebook pg. 302"},{"n":"Janni's Jaunt","l":3,"school":"Conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, F (a forked metal rod attuned to the plane of travel)","range":"Touch","target":"Up to eight willing creatures joining hands","duration":"Instantaneous","save":"Will negates (harmless)","sr":"Yes (harmless)","effect":"This spell functions as per plane shift, but with the following exceptions. First, you are able to transport only willing creatures. Second, the spell can transport you and any other willing targets only to an Elemental Plane, the Astral Plane, or the Material Plane.","source":"Planes of Power"},{"n":"Locate Creature","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S, M (fur from a bloodhound)","range":"long (400 ft. + 40 ft./level)","target":"circle, centered on you, with a radius of 400 ft. + 40 ft./level","duration":"10 min./level","save":"none","sr":"no","effect":"This spell functions like locate object, except this spell locates a known creature. You slowly turn and sense when you are facing in the direction of the creature to be located, provided it is within range. You also know in which direction the creature is moving, if any.\n\nThe spell can locate a creature of a specific kind or a specific creature known to you. It cannot find a creature of a certain type. To find a kind of creature, you must have seen such a creature up close (within 30 feet) at least once.\n\nRunning water blocks the spell. It cannot detect objects. It can be fooled by mislead, nondetection, and polymorph spells.","source":"PRPG Core Rulebook pg. 305"},{"n":"Magic Circle against Chaos","l":3,"school":"Abjuration [lawful]","castingTime":"1 standard action","components":"V, S, M/DF (a 3-ft.-diameter circle of powdered silver)","range":"Touch","target":"10-ft.-radius emanation from touched creature","duration":"10 min./level","save":"Will negates (harmless)","sr":"No","effect":"This spell operates identically to magic circle against evil but provides protection from chaos effects instead. The spell can imprison a nonlawful called creature and creates a protective barrier around the touched subject through its magical emanation.","source":"Core Rulebook"},{"n":"Magic Circle against Evil","l":3,"school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, M/DF (a 3-ft.-diameter circle of powdered silver)","range":"Touch","target":"10-ft.-radius emanation from touched creature","duration":"10 min./level","save":"Will negates (harmless)","sr":"No; see text","effect":"This abjuration provides protection similar to the protection from evil spell for all creatures within its area. Evil summoned entities cannot penetrate the barrier. When creatures enter the protected zone, control effects targeting them may be suppressed, though only one suppression attempt is granted.\n\nThe spell offers an alternative casting mode focused inward, allowing it to bind nongood summoned creatures for up to 24 hours per caster level. The creature cannot cross the circle's boundaries unless it possesses dimensional travel abilities. The powdered silver circle can be broken to end the effect immediately.\n\nCasters may enhance the circle with a special diagram requiring 10 minutes and a DC 20 Spellcraft check, providing greater security and preventing creatures from using spell resistance or crossing its boundaries.","source":"Core Rulebook"},{"n":"Magic Circle against Good","l":3,"school":"abjuration [evil]","castingTime":"1 standard action","components":"V, S, M/DF (a 3-ft.-diameter circle of powdered silver)","range":"touch","target":"10-ft.-radius emanation from touched creature","duration":"10 min./level","save":"Will negates (harmless)","sr":"no; see text","effect":"Functions like magic circle against evil, but wards against good creatures instead: it grants the protection of protection from good to everyone inside, bars nongood summoned creatures from entering, and can imprison a bound nongood summoned creature within the emanation.","source":"PRPG Core Rulebook pg. 308"},{"n":"Magic Circle against Law","l":3,"school":"abjuration [chaotic]","castingTime":"1 standard action","components":"V, S, M/DF (a 3-ft.-diameter circle of powdered silver)","range":"touch","target":"10-ft.-radius emanation from touched creature","duration":"10 min./level","save":"Will negates (harmless)","sr":"no; see text","effect":"Functions like magic circle against evil, but wards against lawful creatures instead: it grants the protection of protection from law to everyone inside, bars nonlawful summoned creatures from entering, and can imprison a bound nonlawful summoned creature within the emanation.","source":"PRPG Core Rulebook pg. 308"},{"n":"Major Image","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10-ft. cubes + one 10-ft. cube/level (S)","duration":"concentration + 3 rounds","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that sound, smell, and thermal illusions are included in the spell effect. While concentrating, you can move the image within the range.\n\nThe image disappears when struck by an opponent unless you cause the illusion to react appropriately.","source":"PRPG Core Rulebook pg. 311"},{"n":"Mind Probe","l":3,"school":"divination [mind-affecting]","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You gain access to the subject’s memories and knowledge. You can attempt to learn the answer to one question per round. A successful Will save ends the spell. Otherwise, the creature can attempt a Bluff check with a DC equal to 11 + your Sense Motive modifier. If it fails its Bluff check, you gain the answer you desire. If it succeeds at its check, you gain no information. If it succeeds by 5 or more, it answers whatever it chooses, and you believe that wrong answer to be true. Your questions are purely telepathic inquiries, and the answers to those questions are imparted directly to your mind. You and the target don’t need to speak the same language, though less intelligent creatures may yield up only appropriate sensory images in answer to your questions.","source":"Occult Adventures"},{"n":"Mind Swap","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"As possession, but both minds fully swap bodies and take control of their new forms, functioning as though each creature had cast possession on the other simultaneously.","source":"Occult Adventures pg. 176"},{"n":"Mindscape Door","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one illusory portal","duration":"10 minutes/level","save":"Will negates (see text)","sr":"no","effect":"You or other creatures enter into or escape from a mindscape (see page 234) through an imaginary doorway. This doorway takes on any form of your choosing, but can be no larger than a 5-foot cube. This spell has different effects depending on whether you are inside a mindscape when you cast it.\n\nWhen you cast this spell outside a mindscape, the doorway connects to one mindscape inhabited by a creature of your choice within close range (25 feet + 5 feet per 2 levels) of the door. That creature becomes the door’s conduit, but can attempt a Will save to deny access to the mindscape. You must be aware of the mindscape to connect a mindscape door to it. If you connect to the mindscape, you designate any number of creatures to be able to see and pass through the door as though it were a normal doorway. You can name specific creatures or categories of creatures, or allow all creatures access. Creatures other than those you designate can’t perceive or use the door, nor can mindless creatures or those immune to mind-affecting effects. Once anyone enters the mindscape through the door, a duplicate of the door appears inside the mindscape next to the creature you used as a conduit. Anyone inside a mindscape is able to perceive and use a mindscape door within that mindscape. Anyone who enters is subject to all rules of the mindscape, but is aware she is in a mindscape if you informed her where the portal leads.\n\nWhen you cast this spell inside a mindscape, a duplicate of the door appears next to your body in the real world. The creator of the mindscape can attempt a Will saving throw to prevent you from creating the door if she is within the mindscape. The two doors operate as if you’d cast the spell outside a mindscape. You still designate who can use the door from the real world to get into the mindscape, but you can’t prevent creatures within the mindscape from exiting to the real world.\n\nTypically, a mindscape door operates in both directions, but you can create it as a one-way door if you so choose. Unlike with other spells, you can cast this spell as a full-round action while engaged in a psychic duel. This spell can be used to exit a binary mindscape, but not to enter one. If you successfully cast mindscape door within a veiled mindscape, you learn that you are in a mindscape, but other creatures observing the door don’t automatically realize they are.","source":"Occult Adventures"},{"n":"Mischievous Shadow","l":3,"school":"necromancy (haunted) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a black candle)","range":"close (25 ft. + 5 ft./2 levels)","target":"one 5-ft. cube/level","duration":"1 day/level (D)","save":"Will negates","sr":"yes","effect":"You direct spirits into the shadows of creatures. The shadows of creatures that fail their Will saving throws appear slightly different for the duration of the spell, bearing small horns, unusually long and slender arms, or other small discrepancies. This spell does not work on creatures that do not cast shadows or reflections. At will as an immediate action (but no more often than once every 10 minutes), a mischievous shadow can interfere with its host’s actions or the actions of adjacent creatures by interacting with their shadows in ways that affect their physical counterparts, such as grabbing the shadow of a crossbow to redirect the physical weapon’s aim. Each disruption either imposes a –8 penalty on a single attack roll, combat maneuver check, or Strength- or Dexterity-based skill check, or requires a spellcaster to succeed at a concentration check (DC = 15 + spell level) or lose a spell being cast. If you are within range of the spell effect, you can decide how these shadows interfere; otherwise, their actions are timed and decided by the GM as needed, typically manifesting during important or crucial roles. Each time a mischievous shadow makes such a disruption, the spell’s haunt-like manifestation occurs during that round.\n\nHaunt StatisticsNotice Perception DC 25 (to see a target’s shadow act incongruously with its physical motions)\nhp 2 hp/level; Trigger proximity; Reset none","source":"Haunted Heroes Handbook pg. 28"},{"n":"Motes of Dusk and Dawn","l":3,"school":"evocation [darkness, light]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"Up to four motes, all within a 10-ft.-radius area","duration":"1 minute (D)","save":"none","sr":"no","effect":"When you cast this spell, you create up to four motes that shed light or darkness in a 20-foot-radius, increasing or decreasing the illumination level by up to two categories. You decide whether each individual mote sheds light or darkness when the spell is cast.\n\nThe motes of dusk and dawn must stay within a 10-foot-radius area of one another but otherwise move as you desire (no concentration required): forward or back, up or down, straight or turning corners, or the like. The motes can move up to 100 feet per round. A mote winks out if the distance between you and it exceeds the spell’s range.","source":"Blood of Shadows pg. 28"},{"n":"Node of Blasting","l":3,"school":"abjuration [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"touch","target":"one touched object weighing no more than 10 lbs.","duration":"permanent until discharged (D)","save":"Will partial, see text","sr":"no","effect":"You imbue an object with psychic energy. The node of blasting unleashes a mental blast when a creature with a mind touches the object, dealing 6d6 points of damage to the creature touching the object and causing the creature to be staggered for 1 minute. A successful saving throw halves the damage and negates the staggered condition. Magic traps such as node of blasting are hard to detect and disable. A character with the trapfinding class feature can use Disable Device to thwart node of blasting . The DCs to find a node of blasting using Perception and to disable it using Disable Device are both equal to 25 + the spell’s level. Additionally, a creature with the read aura occult skill unlock (see page 197) can attempt the same Perception check to notice a node of blasting .","source":"Occult Adventures pg. 178"},{"n":"Out of Sight","l":3,"school":"enchantment [ mind-affecting ]","castingTime":"1 standard action","components":"V, S, M (a strip of black cloth)","range":"personal","target":"you","duration":"1 minute/level (D); see text","save":"Will negates, see text","sr":"yes","effect":"The spell inhibits the memories of creatures that perceive you. While creatures can perceive you normally, when a creature stops observing you, it must attempt a Will save (spell resistance applies). If it fails, it loses all memory of its awareness of you and your actions while you were under the effects of this spell. The spell’s duration listed above measures how long the out of sight effect lasts on you, but the memory alteration is instantaneous and can be reversed only by magic such as modify memory . The creature is still aware of any other changes to itself or its environment. For instance, a guard will remember running, and may notice a newly unlocked door, but will not remember that he was chasing after you.","source":"Occult Origins pg. 31"},{"n":"Paragon Surge","l":3,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"personal (half-elf only)","target":"you","duration":"1 minute/level","save":"none","sr":"no","effect":"You surge with ancestral power, temporarily embodying all the strengths of both elvenkind and humankind simultaneously, and transforming into a paragon of both races, something greater than elf or human alone. Unlike with most polymorph effects, your basic form does not change, so you keep all extraordinary and supernatural abilities of your half-elven form as well as all of your gear.\nFor the duration of the spell, you receive a +2 enhancement bonus to Dexterity and Intelligence and are treated as if you possessed any one feat for which you meet the prerequisites, chosen when you cast this spell. The first time each day that you cast this spell, you must select a feat and make all the associated choices that come with it. Once that choice is made, it is set for the day and additional castings must make the exact same decisions.","source":"Advanced Race Guide pg. 48"},{"n":"Phantasmal Asphixiation","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (an empty vial)","range":"medium (100 ft. + 10 ft./level)","target":"","duration":"1 round/level (D)","save":"Will disbelief, then Fortitude partial (see text)","sr":"yes","effect":"Your target must succeed at a Will save or believe it can no longer breathe. An affected target must attempt a Fortitude save each round at the beginning of its turn. The first time it fails the Fortitude save, it is staggered until the next time it attempts a save against the spell. If the target fails a second Fortitude save in a row, it falls unconscious for the spell’s remaining duration. The target breathes normally while unconscious, but is shaken for 1 minute upon awakening. If the target succeeds at two Fortitude saves in a row, it shakes off the spell’s effects entirely. Otherwise, the target continues to attempt a save each round until it falls unconscious or the spell ends. This spell has no effect on creatures that don’t need to breathe.","source":"Horror Adventures"},{"n":"Phantasmal Killer","l":3,"school":"illusion (phantasm) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"instantaneous","save":"Will disbelief, then Fortitude partial; see text","sr":"yes","effect":"You create a phantasmal image of the most fearsome creature imaginable to the subject simply by forming the fears of the subject's subconscious mind into something that its conscious mind can visualize: this most horrible beast. Only the spell's subject can see the phantasmal killer. You see only a vague shape. The target first gets a Will save to recognize the image as unreal. If that save fails, the phantasm touches the subject, and the subject must succeed on a Fortitude save or die from fear. Even if the Fortitude save is successful, the subject takes 3d6 points of damage.\n\nIf the subject of a phantasmal killer attack succeeds in disbelieving and possesses telepathy or is wearing a helm of telepathy, the beast can be turned upon you. You must then disbelieve it or become subject to its deadly fear attack.Mythic Phantasmal KillerSource Mythic Adventures pg. 103\nIf the target fails its Will save but succeeds at its Fortitude save, the phantasmal killer persists in the target’s mind, giving it the dazed condition until your next turn. On your next turn, the target must attempt another Fortitude save against the phantasm. Success means it takes 3d6 points of damage; failure means it dies from fear. \n\nAugmented (6th): If you expend two uses of mythic power, the spell can affect a living target that is immune to fear, illusions, or mind-affecting effects.","source":"PRPG Core Rulebook pg. 319"},{"n":"Pierce Disguise","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"You see through magical disguises (whether illusions or polymorph effects) of the same spell level or lower. This allows you to see the true forms of creatures magically disguised by such methods. The true form appears as a ghostly overlay on the creature’s disguised appearance.","source":"Advanced Class Guide pg. 190"},{"n":"Planar Ally, Lesser","l":3,"school":"Conjuration (calling) [see text]","castingTime":"10 minutes","components":"V, S, M (offerings worth 500 gp plus payment, see text), DF","range":"Close (25 ft. + 5 ft./2 levels)","target":"One called outsider of 6 HD or less","duration":"Instantaneous","save":"None","sr":"No","effect":"By casting this spell, you request your deity to send you an outsider (of 6 HD or less) of the deity's choice. If you serve no particular deity, the spell is a general plea answered by a creature sharing your philosophical alignment. If you know an individual creature's name, you may request that individual by speaking the name during the spell (though you might get a different creature anyway).\n\nYou may ask the creature to perform one task in exchange for a payment from you. Tasks might range from the simple to the complex. You must be able to communicate with the creature called in order to bargain for its services.\n\nThe creature called requires a payment for its services. This payment can take a variety of forms, from donating gold or magic items to an allied temple, to a gift given directly to the creature, to some other action on your part that matches the creature's alignment and goals. Regardless, this payment must be made before the creature agrees to perform any services. The bargaining takes at least 1 round, so any actions by the creature begin in the round after it arrives.\n\nA task taking up to 1 minute per caster level requires a payment of 100 gp per HD of the creature called. For a task taking up to 1 hour per caster level, the creature requires a payment of 500 gp per HD. A long-term task, one requiring up to 1 day per caster level, requires a payment of 1,000 gp per HD.\n\nA nonhazardous task requires only half the indicated payment, while an especially hazardous task might require a greater gift. Few if any creatures will accept a task that seems suicidal (remember, a called creature actually dies when it is killed, unlike a summoned creature). However, if the task is strongly aligned with the creature's ethos, it may halve or even waive the payment.\n\nAt the end of its task, or when the duration bargained for expires, the creature returns to its home plane (after reporting back to you, if appropriate and possible).\n\nNote: When you use a calling spell that calls an air, chaotic, earth, evil, fire, good, lawful, or water creature, it is a spell of that type.\n\nDue to cleric spell alignment restrictions, if a cleric with an outsider subdomain wanted to create a calling diagram to improve her chances, she could enlist the aid of another caster to cast the required magic circle spell.","source":"Core Rulebook"},{"n":"Possession","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S, F (a jewel worth at least 500 gp, which the target's spirit can perceive)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 min./level (D)","save":"Will negates","sr":"yes","effect":"Your mind leaves your body to possess the target if it fails a Will save, letting you control its body and use its physical abilities (though not its extraordinary or supernatural abilities) while your own body lies helpless; the possessed creature's mind is imprisoned but aware inside the focus jewel while you're in control.","source":"PRPG Core Rulebook pg. 322"},{"n":"Psychic Leech","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 minute/level (D)","save":"Will partial","sr":"yes","effect":"The target experiences feelings of ennui and lethargy, becoming fatigued for the spell’s duration. While the target is fatigued and is within the spell’s range, you gain a +2 enhancement bonus to Strength and Dexterity. On a successful save, the target is fatigued for only 1d4 rounds and you receive no bonus. This spell has no effect if it targets a creature that is already fatigued.","source":"Occult Origins pg. 29"},{"n":"Rags to Riches","l":3,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a bit of burlap wrapped over a copper coin)","range":"touch","target":"1 weapon, suit or armor, shield, tool, or skill kit touched/5 levels","duration":"10 minutes/level","save":"Fortitude negates (object)","sr":"no","effect":"The target object is enhanced to function as a masterwork item. In addition to any bonuses for the masterwork quality, the object gains other bonuses. Skill kits and other equipment add an additional +1 insight bonus for every 4 caster levels you possess to skill checks made with them that already receive a bonus from the skill kit. Armor and weapons gain temporary hit points equal to your caster level. If the object already has an enhancement bonus, this bonus increases by 1. If the object of the spell has hardness, that hardness increases by 5.","source":"Arcane Anthology pg. 21"},{"n":"Red Hand of the Killer","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a black candle), F (a corpse slain no more than 1 day ago per caster level)","range":"see text","target":"one creature","duration":"1 day/level (D)","save":"Will negates","sr":"yes","effect":"Drawing upon the spiritual link between a corpse and its killer, you reach out across space to brand the killer of the corpse you used as a focus for this spell, creating a physical manifestation of the killer’s guilt.\n\nThe killer’s right hand becomes stained indelibly red, and this stain can’t be removed (although it can be hidden by magical or mundane means, such as disguise self or by wearing gloves). If the killer is not humanoid, or doesn’t have a right hand for some other reason, the spell instead causes a red stain in the shape of a hand to appear elsewhere on the creature’s body (typically on the chest).\n\nThis spell affects only the creature that directly killed the targeted corpse. Other individuals that contributed to the target’s death are unaffected, and if the victim did not die from violence or died indirectly (for instance, if the creature died from suffocating after someone trapped it in a room filling with water), then the spell has no effect. The killer can attempt a Will save to resist the spell’s effects. Distance is not a factor, but the killer must be on the same plane as you at the time you cast the spell, or the spell fails. Once a corpse has acted as the focus for red hand of the killer, it can never act as the focus for another casting of red hand of the killer.","source":"Ultimate Intrigue pg. 223"},{"n":"Remove Curse","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature or object touched","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"Remove curse can remove all curses on an object or a creature. If the target is a creature, you must make a caster level check (1d20 + caster level) against the DC of each curse affecting the target. Success means that the curse is removed. Remove curse does not remove the curse from a cursed shield, weapon, or suit of armor, although a successful caster level check enables the creature afflicted with any such cursed item to remove and get rid of it.\nRemove curse counters and dispels bestow curse.","source":"PRPG Core Rulebook pg. 332"},{"n":"Replay Tracks","l":3,"school":"divination","castingTime":"3 rounds","components":"V, S, F (a track or other sign of a creature's passing found with Perception or Survival)","range":"personal","target":"you","duration":"concentration, up to 1 hour/level","save":"","sr":"","effect":"This spell allows you to reconstruct past events that occurred in your current location based on the tracks and other signs left behind. Replay tracks reveals events that occurred while the tracks that serve as the focus for the spell were being left, revealing events in the order they happened in real time or in reverse, depending on whether you are following the tracks forward or backward, although the image isn’t clear enough to make out details (such as a creature’s exact identity). You can attempt Survival checks to follow tracks as part of concentrating on the spell, but only events connected to the tracks used as the focus of the spell are revealed by the spell. Elements that left no trace detectable by you, such as creatures benefitting from pass without trace, are absent from the events you visualize.","source":"Ultimate Wilderness pg. 233"},{"n":"Retrocognition","l":3,"school":"divination","castingTime":"1 minute","components":"V, S","range":"personal","target":"you","duration":"concentration, up to 1 minute/level","save":"","sr":"","effect":"This spell allows you to gain psychic impressions from past events that occurred in your current location. Retrocognition reveals psychic impressions from events that occurred over the course of the last hour throughout the first minute of the duration, followed by impressions from the next hour back the next minute you concentrate, and so on. If a psychically traumatic or turbulent event happened during that time period, you must succeed at a concentration check (DC = 20, 30, or 40, depending on the severity of the psychic disturbance) or lose concentration on the spell.\n\nAt caster level 13th and higher, you can choose to collect impressions from over the course of a longer interval of time than an hour, beginning at 1 week per minute of concentration (as listed on the table below). The amount of detail you receive diminishes, so this eventually makes it harder to distinguish impressions left by anything but the most major events.\n\nCaster LevelTime Period 13th–15th1 week per minute 16th–18th1 year per minute 19th+1 century per minute","source":"Occult Adventures"},{"n":"Reveal Emotions","l":3,"school":"divination","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"40-ft.-radius spread","duration":"1 hour/level (D)","save":"none","sr":"yes","effect":"You create an area that draws out a creature’s emotion aura ( Pathfinder RPG Occult Adventures 198 ). Creatures within this area constantly glow with colors that represent their current overall emotional state and continue to do so for 1d4 rounds after leaving the area. This glow is clearly visible to any creature that can see the creature. Emotionless creatures or creatures unaffected by this spell glow with a dull purple hue while within the area.","source":"Heroes of the High Court pg. 10"},{"n":"Sand Table","l":3,"school":"divination","castingTime":"10 minutes","components":"V, S, M (handful of sand)","range":"see text","target":"","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"Sand table allows you to create a scale model of the battlefield surrounding your position, showing numbers of troops, their relative positions, and their movement as if you were observing from a great height overhead (1,000 feet up). You cast the spell upon a table or other flat surface and cause the model to appear upon a 5-foot-by-5-foot section of that table or surface. It reflects accurate terrain and topography, though it doesn’t identify fine topographical features or concealed or hidden topography. It also indicates all normally visible Small or larger creatures within the area of effect, but it doesn’t provide identifying characteristics of those creatures; each creature appears as an indistinct speck, under 1 millimeter in each dimension.\n\nThe spell marks obvious war camps and contingents of troops with a symbol of their banner (if they openly carry such a symbol). The spell provides a snapshot of the topography and creature locations when cast; it doesn’t adjust for changes that occur during the duration. The table shows the land surrounding itself up to a 1-mile radius from the surface. The sand table does not reveal invisible or incorporeal creatures, nor does it include creatures that are underground, indoors, submerged below the surface of water, below a tree line or other source of cover from above, or flying above 1,000 feet in the air. Those looking at the table can spot Small and larger creatures that are using Stealth to hide, but they take a –10 penalty on their Perception checks because of the size of the models.\n\nOnce the spell has been cast, if anything moves or shakes the surface upon which it was placed, the spell ends instantly.","source":"Villain Codex pg. 165"},{"n":"Scrying","l":3,"school":"divination (scrying)","castingTime":"1 hour","components":"V, S, M/DF (a pool of water), F (a silver mirror worth 1,000 gp)","range":"see text","target":"magical sensor","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"You can observe a creature at any distance. If the subject succeeds on a Will save, the spell fails. The difficulty of the save depen
