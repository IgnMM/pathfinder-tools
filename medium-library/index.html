of troops with a symbol of their banner (if they openly carry such a symbol). The spell provides a snapshot of the topography and creature locations when cast; it doesn’t adjust for changes that occur during the duration. The table shows the land surrounding itself up to a 1-mile radius from the surface. The sand table does not reveal invisible or incorporeal creatures, nor does it include creatures that are underground, indoors, submerged below the surface of water, below a tree line or other source of cover from above, or flying above 1,000 feet in the air. Those looking at the table can spot Small and larger creatures that are using Stealth to hide, but they take a –10 penalty on their Perception checks because of the size of the models.\n\nOnce the spell has been cast, if anything moves or shakes the surface upon which it was placed, the spell ends instantly.","source":"Villain Codex pg. 165"},{"n":"Scrying","l":3,"school":"divination (scrying)","castingTime":"1 hour","components":"V, S, M/DF (a pool of water), F (a silver mirror worth 1,000 gp)","range":"see text","target":"magical sensor","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"You can observe a creature at any distance. If the subject succeeds on a Will save, the spell fails. The difficulty of the save depends on how well your knowledge of the subject and what sort of physical connection (if any) you have to that creature. Furthermore, if the subject is on another plane, it gets a +5 bonus on its Will save.\n\nKnowledgeWill Save ModifierNone*+10Secondhand (you have heard of the subject)+5Firsthand (you have met the subject)+0Familiar (you know the subject well)-5ConnectionWill Save ModifierLikeness or picture-2Possession or garment-4Body part, lock of hair, bit of nail, etc.-10*You must have some sort of connection (see below) to a creature of which you have no knowledge.\nIf the save fails, you can see and hear the subject and its surroundings (approximately 10 feet in all directions of the subject). If the subject moves, the sensor follows at a speed of up to 150 feet.\n\nAs with all divination (scrying) spells, the sensor has your full visual acuity, including any magical effects. In addition, the following spells have a 5% chance per caster level of operating through the sensor: detect chaos, detect evil, detect good, detect law, detect magic, and message.\n\nIf the save succeeds, you can't attempt to scry on that subject again for at least 24 hours.","source":"PRPG Core Rulebook pg. 337"},{"n":"Seeds of Influence","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"S, M (a rose)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"You leave a magical trace in the mind of a creature with an attitude of at least indifferent toward you. The target takes a cumulative –2 penalty on its Will save to negate the spell for each step by which its attitude is better than indifferent.\n\nThe target takes a –2 penalty on saving throws against divination spells you cast. You can target that creature with mind-affecting spells of a spell level lower than seeds of influence as if those spells were modified by Enlarge Spell (the modified spell doesn’t take longer to cast and doesn’t use a higher-level spell slot). Whenever the target succeeds at a saving throw against a divination or mind-affecting spell you cast, seeds of influence ends for that target. A creature can be subject to only one seeds of influence spell at a time; later castings of seeds of influence remove any previous casting.","source":"Inner Sea Intrigue pg. 62"},{"n":"Sending","l":3,"school":"evocation","castingTime":"10 minutes","components":"V, S, M/DF (fine copper wire)","range":"see text","target":"one creature","duration":"1 round; see text","save":"none","sr":"no","effect":"You contact a particular creature with which you are familiar and send a short message of 25 words or less to the subject. The subject recognizes you if it knows you. It can answer in like manner immediately. A creature with an Intelligence score as low as 1 can understand the sending, though the subject's ability to react is limited as normal by its Intelligence. Even if the sending is received, the subject is not obligated to act upon it in any manner.\nIf the creature in question is not on the same plane of existence as you are, there is a 5% chance that the sending does not arrive. (Local conditions on other planes may worsen this chance considerably.)\nMythic Sending\n##Source## Mythic Adventures pg. 107\nYou can contact a number of additional creatures equal to your tier. Each creature must receive the same message, and can communicate back only to you.\nAugmented (3rd): If you expend two uses of mythic power, you can send the message to unfamiliar creatures (using the same number of creatures as non-augmented mythic sending). You must either describe the intended recipients in general or specific terms (such as “orcs,” “the queen of this country,” or “left-handed half-elven males”) or specify restrictions such as range, creature type, and alignment (such as “all good-aligned humanoids in the castle on the hill”). If a greater number of creatures meet your description than the maximum number you can send to, the closest ones to you receive the message.","source":"PRPG Core Rulebook pg. 339"},{"n":"Share Senses","l":3,"school":"divination (scrying)","castingTime":"1 full round","components":"V, S, M (a hair, scale, or feather from your familiar)","range":"long (400 ft. + 40 ft./level)","target":"your familiar","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"Spending a moment in meditation and conjuring an image of the creature to mind, you reshape your link with your familiar, causing it to functions like a scrying sensor. Upon this spell you can hear, see, or smell (any one, your choice) what your familiar is experiencing. You gain the benefits of any nonmagical special abilities your familiar has tied to the chosen sense (such as low-light vision or scent), but use your own Perception skill. You don't need line of sight or line of effect to your familiar, but you must have an active empathic link. You may change the sense you are sharing as a standard action. Unlike other scrying spells, share senses does not allow magically or supernaturally enhanced senses to work through it, and you are unable to see in magical or natural darkness unless your familiar possesses the ability to see in such conditions.  The sensory link with your familiar can be detected as though it were a scrying sensor.","source":"Advanced Player's Guide pg. 243"},{"n":"Shroud of Innocuity","l":3,"school":"illusion (glamer)","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one willing creature plus one/2 caster levels, no two of which can be more than 30 ft. apart","duration":"1 hour/level (D)","save":"none (harmless); see text","sr":"no","effect":"All affected creatures are veiled with a commonplace appearance. This appearance varies based on the viewer, but is always an ordinary member of that viewer’s race, ethnicity, or nationality. This familiarity grants a +2 bonus on Diplomacy checks attempted by affected targets against those not affected by the spell.\n\nCreatures with an attitude of unfriendly or hostile toward an affected target can attempt a Will save to disbelieve the effect the first time they encounter that target.","source":"Heroes of the High Court pg. 10"},{"n":"Sleepwalking Suggestion","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (two doses of oil of taggit worth 180 gp total)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"24 hours","save":"Will negates or none (see text)","sr":"yes","effect":"You compel the target creature to rise from its sleep as if sleepwalking and perform a course of activity (limited to a sentence or two). The spell takes effect immediately if the target is already asleep, or as soon as the target falls asleep if it is conscious. You can specify that the creature should wait before taking action when you give your instructions if you so choose. A sleeping creature doesn’t get a save against this spell. The suggested activity must not cause the target to directly harm itself or others, but it doesn’t need to be reasonable. For example, you could instruct the target to unlock doors and windows or poison its ally’s rations, but not jump off a roof or perform a coup de grace action against a sleeping ally. Instructions that cause direct harm prompt the target to awaken just prior to performing the action and the target experiences a vague memory of what it was supposed to do.\n\nThe target moves at its speed, but isn’t capable of running or moving at a higher rate of speed. It moves in dark conditions as if it had darkvision and can perform most simple and skillbased actions, but it can’t engage in combat, spellcasting, or actions that require significant cognitive awareness (like making complex decisions, solving puzzles, or using complicated magic items). If the creature takes any damage while sleepwalking, it must attempt a new saving throw. If it succeeds, the spell ends and the creature awakens. When the target completes the suggested course of activity, or when the spell ends or is dismissed, the target remains unconscious and returns to where it was sleeping and must be awoken normally. It retains no memory of what it did while unconscious (with the only exception described above).\n\nUnlike the sleepwalkAPG spell, attempts to use sleepwalking suggestion on a creature that is unconscious for any reason other than sleep automatically fail. A creature affected by sleepwalking suggestion is unaware it has been programmed to act in its sleep (unless awoken because it was about to cause harm).","source":"Horror Adventures pg. 127"},{"n":"Speak with Plane","l":3,"school":"Divination","castingTime":"1 standard action","components":"V, S, F/DF (a small glass bead)","range":"Close (25 ft. + 5 ft./2 levels)","target":"One plane with a sentient structure","duration":"1 minute/level","save":"Will negates (see text)","sr":"Yes","effect":"You tap into the awareness and consciousness of a plane with a sentient structure (Planar Adventures 60), allowing it to answer questions. A tangible manifestation of the plane (such as the ground) must be within the spell's range upon casting. You can ask the sentient plane one question per 2 caster levels. If the plane's alignment is at least one step away from yours, the plane can attempt a Will save to resist the spell. A plane typically has a +20 bonus on Will saves, and a demiplane typically has a +15 bonus on Will saves. A plane's traits can further affect these bonuses: a mildly aligned plane receives a +2 bonus, and a strongly aligned plane or a plane with the wild magic trait receives a +4 bonus on its save.\n\nIf a plane has been subject to this spell within the past week, a new casting of this spell targeting the same plane fails. If speak with plane targets a plane that does not have a sentient structure, the spell fails.","source":"Plane-Hopper's Handbook"},{"n":"Summon Monster 4","l":3,"school":"conjuration (summoning)","castingTime":"1 round","components":"V, S, F/DF (a tiny bag and a small candle)","range":"close (25 ft. + 5 ft./2 levels)","target":"one or more summoned creatures","duration":"1 round/level (D)","save":"none","sr":"no","effect":"Calls either one creature from the 4th-level summon list, 1d3 creatures of the same kind from the 3rd-level list, or 1d4+1 creatures of the same kind from the 1st- or 2nd-level list to fight for you, appearing where you designate and acting immediately on your turn. Creatures with an alignment subtype gain the celestial template if you're good, the fiendish template if you're evil, or your choice if neutral; summoned creatures cannot summon others, teleport, or cast spells with costly material components, and vanish when the duration ends or they are slain.","source":"PRPG Core Rulebook pg. 352"},{"n":"Tail Strike","l":3,"school":"transmutation [draconic]","castingTime":"1 standard action","components":"V, M (a dragon scale)","range":"personal","target":"you","duration":"1 minute/level (see text)","save":"none","sr":"no","effect":"You grow a draconic tail (clothing and armor adjust as necessary), or if you already have a tail, it takes on a draconic appearance. If you have a draconic bloodline, the tail matches the appearance of that dragon type; otherwise, it matches the appearance of a dragon type whose alignment matches your own. You gain a tail slam attack that deals 1d6 points of damage (1d4 if Small, 1d8 if Large) + your Strength modifier. If you already have a tail attack, you instead extend the reach of your tail attack by 5 feet. If you have a tail sweep attack, this spell increases its radius by 10 feet.\nIf used as part of a full-attack action, the tail slam is considered a secondary attack, is made at your full base attack bonus – 5, and adds half your Strength modifier to its damage. You can end this spell before its normal duration by uttering a bestial roar as a swift action. When you do, you can attempt an Intimidate check to demoralize all foes within a 30-foot radius that can hear the roar.\nClerics, inquisitors, oracles, and warpriests who worship dragon deities add tail strike to their class spell lists as a 4th-level spell.","source":"Legacy of Dragons pg. 31"},{"n":"Thaumaturgic Circle","l":3,"school":"Abjuration","castingTime":"1 standard action","components":"V, S, M (a 3-ft.-diameter circle of powdered silver), DF","range":"Touch","target":"10-ft.-radius emanation from touched creature","duration":"10 min./level","save":"Will negates (harmless)","sr":"No","effect":"This spell functions as magic circle against chaos, evil, good, or law, but rather than stipulating an alignment descriptor, you can designate any one non-alignment subtype of outsider, including air, earth, fire, and water, as well as outsider races such as angels and devils.","source":"Occult Adventures"},{"n":"Threefold Face","l":3,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a three-pointed knot)","range":"personal","target":"you","duration":"9 minutes","save":"none","sr":"no","effect":"You grow two additional faces set equidistantly around your head, each embodying a different aspect of your personality that you choose (such as kindliness, joy, or wrath). You gain all-around vision and can't be flanked. Effects that would blind you, deafen you, block your mouth, or otherwise affect your face, including beneficial effects that grant you exceptional vision, only affect a single face (for example, it would take three castings of blindness/ deafness to blind you). You lose all-around vision if even a single face becomes blind. This spell doesn't grant you additional magic item slots or additional heads. When threefold face ends, you gain all the conditions from all three faces, for good or ill.","source":"Legacy of the First World pg. 25"},{"n":"Threefold Sight","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (a three-pointed knot)","range":"personal","target":"you","duration":"3 minutes","save":"","sr":"","effect":"You view several possible futures at once, allowing you to thread a needle around disasters by taking a middle path. For the duration of this spell, whenever you roll for an attack, saving throw, or skill check, roll three d20 and use the middle of the three rolls (or the highest, if more than one die shows the same highest value, or the lowest, if more than one die shows the same lowest value). If another ability would make you roll an attack roll, saving throw, or skill check twice and take the higher result, roll twice and take the lower result, or reroll, that ability has no effect and threefold sight ends immediately.","source":"Legacy of the First World pg. 25"},{"n":"Vampiric Touch","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"touch","target":"living creature touched","duration":"instantaneous/1 hour; see text","save":"none","sr":"yes","effect":"A melee touch attack deals 1d6 damage per 2 caster levels (maximum 10d6), and you gain temporary hit points equal to the damage dealt (capped at the target's current hit points plus its Constitution score). These temporary hit points last up to 1 hour.","source":"PRPG Core Rulebook pg. 364"},{"n":"Vicarious View","l":3,"school":"divination (scrying)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"magical sensor","duration":"1 minute/level (D)","save":"Will negates (object)","sr":"yes (object)","effect":"You plant a scrying sensor on a touched creature, object, or point in space, allowing you to see and hear the creature, object, or point and its surroundings (approximately 10 feet in all directions). If the creature or object on moves, the sensor moves with it. Unlike other scrying spells, vicarious view doesn’t allow magically or supernaturally enhanced senses to work through it.","source":"Ultimate Intrigue pg. 229"},{"n":"Vigilant Rest","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (a handful of crushed glass)","range":"touch","target":"one living creature touched","duration":"8 hours (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"Lets a sleeping subject remain alert to real danger. The target no longer suffers the usual +10 penalty to the DC of Perception checks made while asleep, letting it filter out mundane noise while still noticing genuine threats. It can wake instantly as a free action upon sensing danger, and if it is roused (even into combat) it can fall back asleep seamlessly once the threat passes, without losing the rest of the spell's duration.","source":"Ultimate Wilderness pg. 237"},{"n":"Witness","l":3,"school":"divination (scrying)","castingTime":"1 standard action","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one living creature","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You link your senses to the target, allowing you to see and hear through its eyes and ears. As a move action you can shift your senses from yourself to the target or back again. When using the target’s senses, you are blind and deaf. When perceiving through the target, you use its normal and special senses (such as darkvision), not your own.","source":"Ultimate Magic pg. 249"},{"n":"Adjustable Polymorph","l":4,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, M (a small piece of doppelganger flesh)","range":"personal","target":"you","duration":"1 minute/level (D)","save":"none","sr":"no","effect":"This spell functions as alter self, except you can as a swift action alter the disguise (within the limitations of alter self). For example, you could transform yourself into a halfling, then a lizardfolk, then an elf, and so on. You can change your form a number of times equal to your caster level.","source":"Advanced Class Guide pg. 172"},{"n":"Appearance of Life, Greater","l":4,"school":"Illusion (glamer)","castingTime":"1 round","components":"V, S, M (one Tiny or larger living creature)","range":"Touch","target":"One willing undead creature touched","duration":"1 hour/level","save":"Will disbelief or Will negates (see text)","sr":"No","effect":"This spell functions as appearance of life (Pathfinder RPG Horror Adventures 108), except that you can disguise a single undead creature regardless of its number of Hit Dice, and the illusion also creates relevant smells, sounds, textures, and temperatures to match the appearance. If you disguise the target as a living version of itself, creatures that interact with the target take a -5 penalty on their Will saving throws to disbelieve the illusion, though if the target attacks a creature, the attacked creature no longer takes this penalty.","source":"Villain Codex"},{"n":"Assume Appearance, Greater","l":4,"school":"transmutation (polymorph)","castingTime":"1 minute","components":"V, S, F (corpse or likeness of the deceased creature whose form you plan to assume)","range":"personal","target":"you","duration":"1 day/level (D)","save":"none","sr":"no","effect":"This spell functions similar to assume appearance, except that you can imitate a creature even if you have only a likeness (such as a sketch or painting) that is fairly accurate. If there is an age difference between the likeness and the actual creature, you take on the appearance of the creature near the end of its life. If you have heard the creature whose form you plan to assume speak aloud, you can also copy its voice as vocal alteration (speak with dead can also be used to fulfill this requirement). The spell doesn't grant insight into the dead creature's mannerisms\nAdditionally, if a likeness used as a focus for the spell is kept on your person or within 30 feet at all times, the aura of greater assume appearance is redirected to the likeness instead of to you, similar to a reverse application of the misdirection spell.","source":"Horror Adventures pg. 109"},{"n":"Banishing Blade","l":4,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one melee weapon","duration":"1 round/level or until discharged","save":"none and Will partial","sr":"yes","effect":"Imbues a weapon so that the first time it strikes a creature each round, it makes a free bull rush check (1d20 + your caster level) against that target without you needing to move, pushing it back as normal. Against creatures with spell resistance, the first strike requires a caster level check to affect them. If the bull rush pushes an extraplanar creature with Hit Dice no greater than your caster level 10 feet or more, that creature must succeed on a Will save or be banished to its home plane; either way it becomes staggered for 1 round and the spell ends.","source":"Arcane Anthology pg. 7"},{"n":"Battlemind Link","l":4,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"personal and close (25 ft. + 5 ft./2 levels)","target":"you and 1 ally","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You fuse your thoughts with an ally’s, allowing the two of you to fight in tandem, perfectly coordinated. You and the ally each roll initiative in combat and use the higher die result before adding modifiers. This has three effects.\n\nMelee: If you both make melee attacks against the same creature, you both make attack rolls and both use the higher of the two dice for your attack rolls (plus bonuses).\nRanged: If you both make ranged attacks against the same creature, you both make attack rolls and both use the higher of the two dice for your attack roll (plus bonuses).\nSpell: If you both cast spells and target the same area or same creature, affected creatures take a –2 penalty on their saving throw against the spells.\n\nYou and the target lose these benefits if you cannot see each other or if you or the target is unconscious or helpless.","source":"Ultimate Magic pg. 207"},{"n":"Bestow Planar Infusion II","l":4,"school":"Evocation","castingTime":"1 standard action","components":"V, S","range":"Touch","target":"Creature touched","duration":"1 hour/level","save":"Fortitude negates (harmless)","sr":"Yes","effect":"This functions as bestow planar infusion I, except that the touched creature gains the improved infusion of the current plane.","source":"Planar Adventures"},{"n":"Break Enchantment","l":4,"school":"abjuration","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one creature per level, all within 30 ft. of each other","duration":"instantaneous","save":"see text","sr":"no","effect":"This spell frees victims from enchantments, transmutations, and curses. Break enchantment can reverse even an instantaneous effect. For each such effect, you make a caster level check (1d20 + caster level, maximum +15) against a DC of 11 + caster level of the effect. Success means that the creature is free of the spell, curse, or effect. For a cursed magic item, the DC is equal to the DC of the curse.\n\nIf the spell is one that cannot be dispelled by dispel magic or stone to flesh, break enchantment works only if that spell is 5th level or lower.\n\nIf the effect comes from a permanent magic item, break enchantment does not remove the curse from the item, but it does free the victim from the item's effects.","source":"PRPG Core Rulebook pg. 251"},{"n":"Charon's Dispensation","l":4,"school":"Abjuration","castingTime":"1 standard action","components":"V, S, M (2 silver coins)","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature/level","duration":"1 minute/level","save":"Will negates (harmless)","sr":"Yes (harmless)","effect":"The target of this spell gains immunity to the harmful effects of touching or drinking from the River Styx and a +4 profane bonus on saves against effects that alter or suppress memory (such as modify memory or mindwipe). This does not grant the target the ability to breathe water, nor does it grant any protection against creatures or mundane hazards such as rapids. The spell has no power to restore memory to a creature already suffering from an existing fugue or amnesia state.","source":"Book of the Damned"},{"n":"Command, Greater","l":4,"school":"Enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"Yes","effect":"This spell functions similarly to command but affects multiple creatures per caster level, and compulsions persist beyond the initial round. Affected creatures receive additional Will saves at the start of their turns following the initial casting to potentially break the spell's effects. All targeted creatures must receive the same instruction.","source":"Core Rulebook"},{"n":"Commune with Texts","l":4,"school":"divination","castingTime":"1 minute","components":"V, S, M (incense worth 250 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"a collection of texts","duration":"1 hour/level","save":"","sr":"","effect":"You quickly absorb the knowledge in the target, which can be any assortment of books, scrolls, or other texts. During the spell’s duration, you can search the texts and immediately find the most relevant information regarding any topic the collection holds, potentially including singling out spellbooks or scrolls containing individual or particular types of spells. You can attempt Knowledge checks related to the collection’s topics as if you were trained in those skills, and you know whether the collection contains any information about which you failed a Knowledge check in the past 24 hours. The bonus on Knowledge checks granted by the collection of texts (if any) increases by 2.\n\nAdditionally, you always deplete the maximum number of knowledge points from a library whenever you succeed at a Research check (Pathfinder RPG Ultimate Intrigue 148) using the target texts while this spell is in effect, even if completing the Research check takes longer than this spell lasts. Once during the duration of this spell, for a number of minutes equal to your caster level, you can also speak with the texts about anyone who has read or handled them previously, as per stone tell.","source":"Inner Sea Intrigue pg. 59"},{"n":"Conjuration Foil","l":4,"school":"abjuration","castingTime":"1 immediate action","components":"S","range":"medium (100 ft. + 10 ft./level)","target":"20-foot radius spread","duration":"1 round","save":"Will partial (see text)","sr":"yes (object)","effect":"All creatures in the area gain a +4 bonus on saving throws against teleportation effects. If any creature would enter or depart the area via a summoning or teleportation effect, that creature takes 1d6 points of damage per spell level of the triggering effect (or half the HD of the originating creature if the effect has no spell level) and arrives in a random similar location within the triggering effect’s range, rather than the intended destination.\n\nA successful Will save halves the damage and negates the altered destination.","source":"Ultimate Intrigue pg. 207"},{"n":"Contact Entity IV","l":4,"school":"Evocation","castingTime":"1 minute","components":"V, S, M (see text)","range":"500 miles","target":"up to 20 entities of 24 HD or fewer","duration":"instantaneous","save":"Consultar manual","sr":"Consultar manual","effect":"This spell functions like contact entity III, except that you can contact creatures from the contact entity IV list, and as noted above.","source":"Horror Adventures"},{"n":"Contagious Suggestion","l":4,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 hour/level or until completed (D)","save":"","sr":"","effect":"This spell functions as per suggestion, except the target can pass on the enchantment to other targets. The target is compelled to communicate your suggestion to another creature, forcing the new target to attempt a saving throw as if it were the initial target. If a secondary target successfully saves, the suggestion effect on the initial target isn’t negated. If a secondary target fails, it is placed under the same compulsion as the initial target and can further spread the suggestion. This spell can affect a total number of Hit Dice of creatures equal to your caster level. Creatures that save against this spell cannot be affected by that particular casting of contagious suggestion for 24 hours.","source":"Blood of the Beast pg. 14"},{"n":"Create Armaments","l":4,"school":"conjuration (creation)","castingTime":"1 minute","components":"V, S, M (diamonds worth price of arms to be created)","range":"0 ft.","target":"one nonmagical weapon, shield, or set of armor","duration":"instantaneous","save":"none","sr":"no","effect":"You create one nonmagical weapon, shield, or set of armor. To determine whether the item functions as intended, you must attempt an appropriate Craft check with the DC required to create the item normally. If you fail, the item is created with the broken condition. You can create items made of rare or unusual materials if you include a bit of that material as an additional material component when you cast the spell, but cannot create cold iron items with this spell.","source":"Arcane Anthology pg. 7"},{"n":"Create Mindscape","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one creature","duration":"10 minutes/level","save":"Will disbelief, see text","sr":"yes","effect":"You create an immersive mindscape (see page 235) that the minds of both you and another creature enter together. You choose whether the mindscape is overt or veiled, and whether it’s harmless or harmful. You can choose any shape and size trait, as well as any gravity trait (though you can’t make it so the gravity is so strong it harms creatures within). The mindscape has normal time, no alignment traits, and normal magic.\n\nYou designate where both you and your subject appear. You don’t need line of sight to draw the subject creature into the mindscape, but you must be aware of its presence within range. If you target an area with more than one sentient creature and you have never seen any of the creatures before (for example, if you know a group of soldiers is inside a barracks but you can’t see them through the door), the subject of this spell is selected at random. If you have seen firsthand the creature you wish to target (continuing the example, if you spied the sergeant entering the room moments before), you can select it unerringly from among all the creatures. You must appear somewhere in your mindscape, though it’s relatively easy to shield yourself from the view of any other creatures inside if they don’t realize they’re in a mindscape. You must also create a method of exit from the mindscape when you cast this spell, and that method must be possible to achieve based on the traits of the mindscape, even if it is obscure or difficult. The GM decides whether a method of escape is reasonable. Anything that would be a reasonable method of waking from a dream during deep sleep could allow one to leave a mindscape.\n\nMore creatures than the initial two can enter an existing mindscape, typically through the use of the mindscape door spell. You can create illusory creatures within the mindscape, but you’re able to direct or concentrate on only one at a time. Only this creature is believable; any others largely remain silent or speak generic, repetitive phrases.\n\nAs is normal with mindscapes, you and any other creatures within the mindscape are unable to take actions within the real world, and your bodies lose their Dexterity bonuses to AC.\n\nIf you choose to create a veiled mindscape, the first time another creature interacts with the environment, it can attempt a Will save to disbelieve the effect. Disbelieving a mindscape reveals to that creature that it’s within a mindscape and gives it the knowledge needed to leave the mindscape, but doesn’t free it from the mindscape. For example, if you create a mindscape that takes the form of a parlor inside a stately mansion, and your target creature succeeds at its Will save, it gains the understanding that walking out the front door of the mansion allows it to return to its physical body, but it must actually move through the mental landscape of the mansion to reach the front door and exit in order to flee the mindscape. If the mindscape is overt, the creature automatically knows how to exit if it so chooses.\n\nThis spell ends at any time that you choose to depart the mindscape, freeing the target as well. Any creature that drops below 0 hit points while inside the mindscape returns to its body. If this happens to you, the spell also ends, freeing anyone still inside.\n\nCreate mindscape can be made permanent with a permanency spell by a caster of 12th level or higher at a cost of 10,000 gp. You and other creatures aware of a permanent mindscape can come and go using the mindscape door spell.","source":"Occult Adventures"},{"n":"Darkvision, Greater","l":4,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (either a pinch of dried carrot or an agate)","range":"touch","target":"creature touched","duration":"1 hour/level","save":"will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions as darkvision, except the target’s darkvision has a range of 120 feet.","source":"Ultimate Magic pg. 216"},{"n":"Death Ward","l":4,"school":"necromancy","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"living creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject gains a +4 morale bonus on saves against all death spells and magical death effects. The subject is granted a save to negate such effects even if one is not normally allowed. The subject is immune to energy drain and any negative energy effects, including channeled negative energy.\nThis spell does not remove negative levels that the subject has already gained, but it does remove the penalties from negative levels for the duration of its effect.\nDeath ward does not protect against other sorts of attacks, even if those attacks might be lethal.","source":"PRPG Core Rulebook pg. 264"},{"n":"Deathless","l":4,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"touch","target":"living creature touched","duration":"1 round/level","save":"Fortitude negates (harmless)","sr":"yes (harmless)","effect":"The target’s soul is strongly anchored to its body, preventing death from hit point damage. No matter how low the target’s hit points get, it remains alive (though not necessarily conscious).\nThis spell doesn’t prevent death from sources other than hit point damage—such as Constitution damage or drain, death effects, or energy drain. Spells that cure hit points affect the creature normally.\nMythic Deathless\n##Source## Mythic Adventures pg. 113\nIf you expend one use of mythic power when you cast the spell, you become an anchor for the souls of you and your cohorts. The range increases to 30 feet, and instead of affecting one creature, it affects all allies within a 30-footradius emanation centered on you.\nAugmented (8th): If you expend three uses of mythic power, the range increases to 1 mile, and the area to a 1-mileradius emanation centered on you.","source":"Mythic Adventures pg. 113"},{"n":"Dismissal","l":4,"school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"Close (25 ft. + 5 ft./2 levels)","target":"One extraplanar creature","duration":"Instantaneous","save":"Will negates","sr":"Yes","effect":"The spell forces an extraplanar creature back to its proper plane if it fails a Will save. Upon success, the creature vanishes immediately, though a 20% chance exists of redirecting it to an alternate plane rather than its native one.","source":"Core Rulebook"},{"n":"Dream Council","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"unlimited","target":"one or more living creatures","duration":"see text","save":"Will negates","sr":"yes","effect":"This spell functions as dream, but you and the target of your dream can converse in a limited fashion as long as the recipient is also asleep. You can send or receive a number of dream messages equal to your caster level. Each message can be up to 25 words long or a single vague image that can’t convey fine details such as words. You can send and receive these dream messages with a single target or multiple targets, but each message you send or receive counts against the total number of messages allowed. Sending a message takes 1 round. The spell ends and you wake up when you run out of messages.\n\nIf you use dream council to send a message to a sleeping creature that has dream or dream council prepared (or is able to cast it spontaneously or as a spell-like ability), the recipient can expend one of your allotted messages to cast that spell while remaining asleep. This uses up that creature’s prepared spell, spell per day, or spell-like ability use as normal. Instead of replying to your message, that character is able to enter your dreamscape. If the sleeping recipient has the Lucid Dreamer feat, it can enter your dreamscape without casting either of those spells. While in the original caster’s dreamscape, those involved in the council can interact with one another and that dreamscape for 10 minutes for each message remaining. When that time elapses, the spell ends.","source":"Occult Adventures pg. 165"},{"n":"Dream Scan","l":4,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"unlimited","target":"one living creature","duration":"see text","save":"Will negates","sr":"yes","effect":"This spell functions as dream, but rather than sending a message to a sleeping target, you can instead read the target’s thoughts. The target must be asleep for you to perform a dream scan, though if the target isn’t asleep, you can wait in a trance until your target falls asleep. Once the target is asleep, you can concentrate in order to read its surface thoughts as if using detect thoughts. You can continue concentrating for up to 1 minute per caster level.\n\nInstead of reading surface thoughts, you can choose to scan the target’s dreams and subconscious mind for the answers to questions. For every minute you spend concentrating, you can obtain the answer to one question, though the answers might be brief, cryptic, or repetitive. The target is entitled to a new Will save to end the dream scan each time you ask it a question. Otherwise, the creature can attempt a Bluff check with a DC equal to 11 + your Sense Motive modifier. If it fails its Bluff check, you gain the information you desire. If it succeeds at its check, you gain no information. If it succeeds at its check by 5 or more, you misinterpret the target’s dreams— you draw a false conclusion of the target’s choice and believe that wrong answer to be true.\n\nUnlike with dream, you can’t cast this spell on another creature to have it serve as your messenger.","source":"Occult Adventures pg. 165"},{"n":"Entrap Spirit","l":4,"school":"necromancy","castingTime":"1 standard action","components":"V, S, F (a small silver mirror)","range":"close (25 ft. + 5 ft./2 levels)","target":"incorporeal creature or haunt","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"You trap the target in the mirror used as the spell’s focus. The target cannot be affected by any means while inside the mirror. If the mirror is destroyed, any incorporeal creature within is immediately freed and any haunt within returns to its original location. Creatures that assumed incorporeal form through a spell or other means remain incorporeal while trapped, even if the duration of the effect that rendered them incorporeal expires. If your focus mirror belonged to the target, the target takes a –2 penalty on its saving throw.","source":"Occult Adventures pg. 170"},{"n":"False Vision","l":4,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (crushed jade worth 250 gp)","range":"touch","target":"40-ft.-radius emanation","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"This spell creates a subtle illusion, causing any divination (scrying) spell used to view anything within the area of this spell to instead receive a false image (as the major image spell), as defined by you at the time of casting. As long as the duration lasts, you can concentrate to change the image as desired. While you aren't concentrating, the image remains static.","source":"PRPG Core Rulebook pg. 280"},{"n":"Fear","l":4,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (the heart of a hen or a white feather)","range":"30 ft.","target":"cone-shaped burst","duration":"1 round/level or 1 round; see text","save":"Will partial","sr":"yes","effect":"Fills a cone with unseen terror. Living creatures in the area that fail a Will save become panicked for the duration, and cower if cornered while panicked; a successful save instead leaves the creature shaken for 1 round.","source":"PRPG Core Rulebook pg. 281"},{"n":"Feeblemind","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a handful of clay, crystal, or glass spheres)","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"instantaneous","save":"Will negates; see text","sr":"yes","effect":"Target creature's Intelligence and Charisma scores each drop to 1. The affected creature is unable to use Intelligence- or Charismabased skills, cast spells, understand language, or communicate coherently. Still, it knows who its friends are and can follow them and even protect them. The subject remains in this state until a heal, limited wish, miracle, or wish spell is used to cancel the of the feeblemind. A creature that can cast arcane spells, such as a sorcerer or a wizard, takes a -4 penalty on its saving throw.","source":"PRPG Core Rulebook pg. 281"},{"n":"Flash Forward","l":4,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, F (a single gear or bit of clockwork)","range":"personal","target":"you","duration":"instantaneous","save":"none (harmless)","sr":"no","effect":"You cheat the laws of time and enter into combat before reverting back to your original position. As part of the action to cast the spell, you make a charge attack against an enemy. You make this charge attack normally, accounting for terrain, obstacles, attacks of opportunity, attack rolls, and damage rolls. At the end of your charge action, you instantly teleport back to your original location as a free action. Any damage or conditions dealt by you or to you during this action are real and remain when you return to your original location.","source":"Magic Tactics Toolbox pg. 5"},{"n":"Freedom of Movement","l":4,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (a leather strip bound to the target), DF","range":"personal or touch","target":"you or creature touched","duration":"10 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell enables you or a creature you touch to move and attack normally for the duration of the spell, even under the influence of magic that usually impedes movement, such as paralysis, solid fog, slow, and web. All combat maneuver checks made to grapple the target automatically fail. The subject automatically succeeds on any combat maneuver checks and Escape Artist checks made to escape a grapple or a pin.\nThe spell also allows the subject to move and attack normally while underwater, even with slashing weapons such as axes and swords or with bludgeoning weapons such as flails, hammers, and maces, provided that the weapon is wielded in the hand rather than hurled. The freedom of movement spell does not, however, grant water breathing.","source":"PRPG Core Rulebook pg. 287"},{"n":"Grand Destiny","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one willing creature","duration":"10 minutes/level or until discharged","save":"none (harmless)","sr":"yes (harmless)","effect":"You inspire the target with the power to seize a grand destiny. The target gains a +4 competence bonus that it can choose to apply before rolling any attack roll, caster level check, saving throw, or skill check. The spell ends once the bonus has been applied to two rolls. At 12th level and 15th level, the bonus can be applied an additional time before the spell is discharged. A subject can be under the effect of only one grand destiny spell at a time.","source":"Arcane Anthology pg. 8"},{"n":"Hold Monster","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (one hard metal bar or rod, which can be as small as a three-penny nail)","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round/level (D); see text","save":"Will negates; see text","sr":"yes","effect":"This spell functions like hold person, except that it affects any living creature that fails its Will save.","source":"PRPG Core Rulebook pg. 296"},{"n":"Inflict Pain, Mass","l":4,"school":"enchantment [mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will partial; see text","sr":"yes","effect":"Functions as inflict pain, but affects multiple targets within range instead of one, subject to the same effects and partial-save rules as the single-target version.","source":"Occult Adventures pg. 174"},{"n":"Invoke Deity","l":4,"school":"transmutation [see text]","castingTime":"1 round","components":"V, S, M (incense worth 1,000 gp), F (a bejeweled holy symbol of your patron deity worth 2,500 gp)","range":"personal","target":"you","duration":"10 minutes/level","save":"see text","sr":"see text","effect":"Invoking your deity's name while holding up its holy symbol, you take on an aspect of your deity by choosing one domain it grants; you gain that domain's associated benefits and a physical transformation for the duration. Any saves triggered by the domain's abilities use this spell's save DC, and the spell shares your deity's alignment descriptors. As a full-round action provoking an attack of opportunity, you may spend 1 round concentrating to switch to a different domain your deity offers, which shortens the remaining duration by 10 minutes. You must be a single-deity worshiper to cast this spell, and acting against your deity's edicts ends the spell immediately and stuns you for a number of rounds equal to your Hit Dice. Dozens of domain-specific benefit packages exist, each granting distinct ability bonuses, resistances, or special attacks tied to that domain.","source":"Planar Adventures pg. 41"},{"n":"Legend Lore","l":4,"school":"divination","castingTime":"see text","components":"V, S, M (incense worth 250 gp), F (four pieces of ivory worth 50 gp each)","range":"personal","target":"you","duration":"see text","save":"","sr":"","effect":"Legend lore brings to your mind legends about an important person, place, or thing. If the person or thing is at hand, or if you are in the place in question, the casting time is only 1d4 × 10 minutes. If you have only detailed information on the person, place, or thing, the casting time is 1d10 days, and the resulting lore is less complete and specific (though it often provides enough information to help you find the person, place, or thing, thus allowing a better legend lore result next time). If you know only rumors, the casting time is 2d6 weeks, and the resulting lore is vague and incomplete (though it often directs you to more detailed information, thus allowing a better legend lore result next time).\n\nDuring the casting, you cannot engage in other than routine activities: eating, sleeping, and so forth. When completed, the divination brings legends (if any) about the person, place, or things to your mind. These may be legends that are still current, legends that have been forgotten, or even information that has never been generally known. If the person, place, or thing is not of legendary importance, you gain no information. As a rule of thumb, characters who are 11th level and higher are “legendary,” as are the sorts of creatures they contend with, the major magic items they wield, and the places where they perform their key deeds.","source":"PRPG Core Rulebook pg. 304"},{"n":"Mage's Private Sanctum","l":4,"school":"abjuration","castingTime":"10 minutes","components":"V, S, M (a sheet of lead, a piece of glass, a wad of cotton, and powdered chrysolite)","range":"close (25 ft. + 5 ft./2 levels)","target":"30-ft. cube/level (S)","duration":"24 hours (D)","save":"none","sr":"no","effect":"This spell ensures privacy. Anyone looking into the area from outside sees only a dark, foggy mass. Darkvision cannot penetrate it. No sounds, no matter how loud, can escape the area, so nobody can eavesdrop from outside. Those inside can see out normally.\n\nDivination (scrying) spells cannot perceive anything within the area, and those within are immune to detect thoughts. The ward prevents speech between those inside and those outside (because it blocks sound), but it does not prevent other communication, such as a sending or message spell, or telepathic communication, such as that between a wizard and her familiar.\n\nThe spell does not prevent creatures or objects from moving into and out of the area.\n\nMage's private sanctum can be made permanent with a permanency spell.","source":"PRPG Core Rulebook"},{"n":"Majestic Image","l":4,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a drop of paint and a ball of clay)","range":"200 ft./level","target":"transfer consciousness to an object bearing your likeness","duration":"concentration","save":"Will negates (see text)","sr":"yes","effect":"You cast your consciousness into a single object within range that bears your likeness, as if choosing a specific image with the spell enter imageAPG. In addition to observing your surroundings, speaking, and manipulating the image you inhabit, however, you can converse with nearby creatures and use your normal social skills.\n\nYou gain a +5 bonus on Bluff checks to tell lies and Diplomacy checks to make a request. You gain a +2 bonus on Intimidate checks and use the object’s size to determine whether you gain a bonus or penalty on Intimidate checks for size.","source":"Ultimate Intrigue pg. 219"},{"n":"Mindwipe","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"instantaneous; see text","save":"Will negates","sr":"yes","effect":"You erase a portion of the target’s mind and experiences, inflicting 2 temporary negative levels on the target for 1 day per caster level. If the target is a spellcaster who must choose and prepare spells in advance, each negative level imposed by mindwipe also causes the target to lose one prepared spell from her highest level of spells known for each of her spellcasting classes for which she must prepare spells. These lost spells are no longer considered known by the target until the corresponding negative levels are removed.\n\nIf the target is a spontaneous spellcaster, each negative level inflicted by mindwipe causes her to lose one spell slot of her highest level of spells for each spontaneous spellcasting class in which she has levels and to lose knowledge of one random spell known of that level (or the next lowest level if she has already lost knowledge of all spells known of that level, and so on). The target cannot use the lost spell slots and spells known as long as the corresponding negative levels last. When the target loses a spell known, the spell remains on her class list but she cannot prepare or cast the spell.\n\nIf the negative levels from mindwipe cause the target’s total number of negative levels to equal or exceed her character level, instead of dying, she enters a catatonic state as long as the negative levels from mindwipe continue to cause her total number of negative levels to equal or exceed her character level.","source":"Occult Adventures"},{"n":"Modify Memory","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round; see text","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"You reach into the subject's mind and modify as many as 5 minutes of its memories in one of the following ways.Eliminate all memory of an event the subject actually experienced. This spell cannot negate charm, geas/quest, suggestion, or similar spells.Allow the subject to recall with perfect clarity an event it actually experienced.Change the details of an event the subject actually experienced.Implant a memory of an event the subject never experienced.Casting the spell takes 1 round. If the subject fails to save, you proceed with the spell by spending as much as 5 minutes (a period of time equal to the amount of memory you want to modify) visualizing the memory you wish to modify in the subject. If your concentration is disturbed before the visualization is complete, or if the subject is ever beyond the spell's range during this time, the spell is lost.\n\nA modified memory does not necessarily affect the subject's actions, particularly if it contradicts the creature's natural inclinations. An illogical modified memory is dismissed by the creature as a bad dream, too much wine, or another similar excuse.","source":"PRPG Core Rulebook pg. 315"},{"n":"Nex's Secret Workshop","l":4,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (diamond dust worth 150 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"any number of creatures or objects in range","duration":"1 hour/level","save":"Will negates (harmless, object)","sr":"yes (harmless, object)","effect":"As nondetection, but affects any number of creatures or objects within range simultaneously (you can exclude any of them from the effect as you cast it).","source":"Inner Sea Intrigue pg. 60"},{"n":"Nightmare","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"10 minutes","components":"V, S","range":"unlimited","target":"one living creature","duration":"instantaneous","save":"Will negates; see text","sr":"yes","effect":"You send a hideous and unsettling phantasmal vision to a specific creature that you name or otherwise specifically designate.\nThe nightmare prevents restful sleep and causes 1d10 points of damage. The nightmare leaves the subject fatigued and unable to regain arcane spells for the next 24 hours.\nThe difficulty of the save depends on your knowledge the subject and the physical connection (if any) you have to that creature.\nKnowledgeWill Save Modifier\nNone*+10\nSecondhand (you have heard of the subject)+5\nFirsthand (you have met the subject)+0\nFamiliar (you know the subject well)-5\nConnectionWill Save Modifier\nLikeness or picture-2\nPossession or garment-4\nBody part, lock of hair, bit of nail,etc.-10\n*You must have some sort of connection to a creature of which you have no knowledge.\nDispel evil cast on the subject while you are casting the spell dispels the nightmare and causes you to be stunned for 10 minutes per caster level of the dispel evil.\nIf the recipient is awake when the spell begins, you can choose to cease casting (ending the spell) or to enter a trance until the recipient goes to sleep, whereupon you become alert again and complete the casting. If you are disturbed during the trance, you must succeed on a Concentration check as if you were in the midst of casting a spell or the spell ends.\nIf you choose to enter a trance, you are not aware of your surroundings or the activities around you while in the trance.\nYou are defenseless, both physically and mentally, while in the trance. (You always fail Reflex and Will saving throws, for example.)\nCreatures who don't sleep (such as outsiders) or dream are immune to this spell.\nMythic Nightmare\n##Source## Mythic Adventures pg. 102\nThe spell’s damage increases to 4d6 points of damage, and the target is also shaken for 24 hours.\nAugmented (6th): You can deliver a mind-affecting spell through a mythic nightmare. The maximum level of the delivered spell is equal to half your tier, and you must expend one use of mythic power for each spell level of the imbued spell in addition to the one use needed to cast mythic nightmare. You choose whether the delivered spell affects the creature immediately or when it awakens. The delivered spell affects only the target, even if it normally affects multiple creatures or an area.","source":"PRPG Core Rulebook pg. 316"},{"n":"Object Possession","l":4,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"unattended Large or smaller object (minimum Tiny)","duration":"10 minutes/level (D)","save":"None","sr":"No","effect":"This spell functions as lesser object possession, except as noted above. The possessed animated object has a number of Construction Points appropriate for its size (up to 3 CP for Large objects).  You can return your consciousness to your body as a standard action. On your next turn, you can attempt to possess a different object as a standard action instead of ending the spell.","source":"Occult Adventures pg. 179"},{"n":"Persistent Image","l":4,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10-ft. cubes + one 10-ft. cube/level (S)","duration":"1 min./level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that the figment includes visual, auditory, olfactory, and thermal components, and the figment follows a script determined by you. The figment follows that script without your having to concentrate on it. The illusion can include intelligible speech if you wish.","source":"PRPG Core Rulebook pg. 319"},{"n":"Pessimism","l":4,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a shard of a broken mirror)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"You erode the target’s confidence and instill a sense of despair. This fear of failure manifests as a –2 penalty on attack rolls, saving throws, ability checks, skill checks, and weapon damage rolls. Additionally, the target can’t gain morale bonuses of any kind while the spell remains in effect. No amount of achievement counters the spell’s effects—the target simply explains away positive events with a self-critical perspective.\n\nCertain events can solidify the character’s belief that it is doomed. Whenever the target rolls a natural 1 on an attack roll or saving throw, fails an ability or skill check by more than 5, or takes additional damage as a result of a foe’s confirmed critical hit, the penalty to roll imposed by pessimism becomes –3 for 1 round. This increased penalty doesn’t stack, even if multiple catastrophes occur on the same round.","source":"Horror Adventures pg. 123"},{"n":"Phantasmal Putrefaction","l":4,"school":"illusion (phantasm) [fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level (D)","save":"Will disbelief, then Fortitude partial (see text)","sr":"yes","effect":"You implant within the minds of your targets the illusion that their skin is rotting away, large rents are appearing all over their bodies, and their internal organs are spilling out into a putrid half-liquid mass at their feet. Those who fail to disbelieve phantasmal putrefaction immediately take 1d4 points of Wisdom damage. This damage occurs only once. Each round at the beginning of its turn, an affected target receives another Will save to disbelieve the effect, and targets that fail must succeed at a Fortitude save or faint, falling asleep as per sleep (except that it isn't a magical sleep effect). Waking up doesn't end the spell for a target; it must continue to attempt Will saves to disbelieve and Fortitude saves to avoid fainting each round until the spell ends or the target successfully disbelieves.  Targets of the spell perceive everyone else around them to be rotting away, but other creatures see no visible effect of the spell, so they, in addition to those who disbelieve, can communicate the nature of the illusion to allies, providing those allies with a +4 bonus on the saving throw to disbelieve.  If your campaign uses the sanity system (see page 12), a creature takes 1d8 points of sanity damage instead of Wisdom damage.","source":"Horror Adventures pg. 124"},{"n":"Planar Adaptation","l":4,"school":"transmutation","castingTime":"1 standard action","components":"V","range":"personal","target":"you","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"Planar adaptation grants you immunity to the harmful environmental effects of a particular plane of existence, including such hazards as toxicity, extreme temperatures, and lack of air. Additionally, you gain energy resistance 20 to a single energy type prevalent on that plane (choose one if more than one type is equally prevalent). Planar adaptation has no effect when cast upon your native plane.","source":"Advanced Player's Guide pg. 236"},{"n":"Planar Binding, Lesser","l":4,"school":"conjuration (calling)","castingTime":"10 minutes","components":"V, S, M (a jewel worth at least 500 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"one outsider with 6 HD or less","duration":"instantaneous/1 day per caster level (D)","save":"Will negates","sr":"yes","effect":"Traps a called outsider (6 HD or less) in a magic circle, holding it until it agrees to perform a service (bargained through negotiation, threats, or bribes) in exchange for release; the outsider can attempt to escape via a caster level or Charisma check each day it remains bound.","source":"PRPG Core Rulebook pg. 322"},{"n":"Plane Shift","l":4,"school":"Conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, F (forked metal rod attuned to destination plane)","range":"Touch","target":"One creature or up to eight willing creatures joining hands","duration":"Instantaneous","save":"Will negates","sr":"Yes","effect":"This spell transports you or another creature to an alternate plane of existence. Up to eight willing participants may link hands for collective transport. Arrival location varies significantly; you appear 5 to 500 miles from your intended destination when traveling from the Material Plane. The transported creatures must locate alternative means for return travel, though casting the spell again is possible.","source":"Core Rulebook"},{"n":"Prognostication","l":4,"school":"Divination","castingTime":"8 hours","components":"V, S, M (rare incense and tonics worth 250 gp)","range":"personal","target":"you","duration":"instantaneous","save":"none","sr":"no","effect":"You glimpse the future. Prognostication functions as divination except that the spell can see up to a year and a day into the future. Because of the increased unpredictability of the distant future, prognostication is significantly more cryptic than the already-cryptic divination spell.","source":"Ultimate Intrigue"},{"n":"Purify Body","l":4,"school":"conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"living creature touched","duration":"instantaneous and 1 hour or until discharged","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You align the target’s chakras and soothe any unwanted imperfections found within its physical form, leaving its body pristine and without any pain or weakness.\nYou restore a number of hit points to the creature equal to 3d8 + 1 per caster level (maximum +20). If the healing would cause the target to exceed its maximum hit points, the target immediately gains half the excess healing from this spell as temporary hit points that last for 1 hour. These temporary hit points are lost first when the target takes damage (although some temporary hit points are lost even before these temporary hit points, such as the temporary hit points from the shell of succor oracle mystery or the shell of succor hex granted by the restoration spirit specialization).\nThis spell also ends any painUM effects, removes all physical ability score damage (from Strength, Dexterity, and Constitution), and removes the following conditions: blinded, dazzled, deafened, nauseated, paralyzed, and sickened.","source":"Healer's Handbook pg. 9"},{"n":"Reincarnate","l":4,"school":"transmutation","castingTime":"10 minutes","components":"V, S, DF, M (oils worth 1,000 gp)","range":"touch","target":"dead creature touched","duration":"instantaneous","save":"none, see text","sr":"yes (harmless)","effect":"With this spell, you bring back a dead creature in another body, provided that its death occurred no more than 1 week before the casting of the spell and the subject’s soul is free and willing to return. If the subject’s soul is not willing to return, the spell does not work; therefore, a subject that wants to return receives no saving throw.\n\nSince the dead creature is returning in a new body, all physical ills and afflictions are repaired. The condition of the remains is not a factor. So long as some small portion of the creature’s body still exists, it can be reincarnated, but the portion receiving the spell must have been part of the creature’s body at the time of death. The magic of the spell creates an entirely new young adult body for the soul to inhabit from the natural elements at hand. This process takes 1 hour to complete. When the body is ready, the subject is reincarnated.\n\nA reincarnated creature recalls the majority of its former life and form. It retains any class abilities, feats, or skill ranks it formerly possessed. Its class, base attack bonus, base save bonuses, and hit points are unchanged. Strength, Dexterity, and Constitution scores depend partly on the new body. First eliminate the subject’s racial adjustments (since it is no longer necessarily of his previous race) and then apply the adjustments found below to its remaining ability scores. The subject of the spell gains two permanent negative levels when it is reincarnated. Negative levels equal to or greater than the creature’s Hit Dice are instead applied as Constitution drain (if this would reduce its Con to 0 or less, it can’t be reincarnated). A character who died with spells prepared has a 50% chance of losing any given spell upon being reincarnated. A spellcasting creature that doesn’t prepare spells (such as a sorcerer) has a 50% chance of losing any given unused spell slot as if it had been used to cast a spell.\n\nIt’s possible for the change in the subject’s ability scores to make it difficult for it to pursue its previous character class. If this is the case, the subject is advised to become a multiclass character.\n\nFor a humanoid creature, the new incarnation is determined using the table on the next page. For nonhumanoid creatures, a similar table of creatures of the same type should be created.\n\nA creature that has been turned into an undead creature or killed by a death effect can’t be returned to life by this spell. Constructs, elementals, outsiders, and undead creatures can’t be reincarnated. The spell can bring back a creature that has died of old age. d%IncarnationStrDex Con01Bugbear+4+2+202-13Dwarf+0+0+214-25Elf+0+2-226Gnoll+4+0+227-38Gnome-2+0+239-42Goblin-2+2+043-52Half-elf+0+2+053-62Half-orc+2+0+063-74Halfling-2+2+075-89Human+0+0+290-93Kobold-4+0-294Lizardfolk+2+2+295-98Orc+4+0+099Troglodyte+0-2+4100Other (GM's choice)???\nThe reincarnated creature gains all abilities associated with its new form, including forms of movement and speeds, natural armor, natural attacks, extraordinary abilities, and the like, but it doesn’t automatically speak the language of the new form.\n\nA wish or a miracle spell can restore a reincarnated character to his or her original form.","source":"Core Rulebook pg. 331"},{"n":"Remote Viewing","l":4,"school":"divination ( scrying )","castingTime":"1 hour","components":"V, S, M (incense)","range":"see text","target":"you","duration":"instantaneous","save":"","sr":"","effect":"Your body enters a trance as you send your psychic senses to a distant location and gain psychic impressions of that location. You must specify the distance and direction to the location you desire to view remotely. This spell doesn’t allow you to see the visual appearance of the location’s surface, so it isn’t useful for casting spells like teleport, but it grants you a psychic impression of the location, which could give you deeper information. For example, a forest that is home to a tight-knit community of fey might appear as a city in the trees, or a beautiful palace ruled by an evil king and warded by forbiddance might appear as a dark fortress encased in insubstantial chains. During the 1 hour casting time of remote viewing , your real body is unconscious and helpless, and you are unaware of its surroundings.","source":"Occult Adventures pg. 184"},{"n":"Revenant Armor","l":4,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (one suit of armor)","range":"close (25 ft. + 5 ft./2 levels)","target":"one suit of armor","duration":"1 day/level or 1 hour/level; see text","save":"none","sr":"no","effect":"If the wearer of the enchanted armor drops to below 0 hit points or is knocked unconscious in combat, the armor animates as a Medium animated object with a 20-foot speed and carries the unconscious wearer's body (metal armor also gains the abilities of a metal animated object). It rights itself if knocked prone without provoking attacks of opportunity, prevents the wearer from being treated as helpless, and can be directed by an ally within range; it has Strength equal to your caster level and a CMB of 1 plus your caster level plus the armor's Strength modifier. The spell ends if the wearer dies and crumbles, regains consciousness, or is removed from the armor.","source":"Armor Master's Handbook pg. 23"},{"n":"Scripted Hallucination","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 minute/level (D)","save":"Will disbelief","sr":"yes","effect":"This spell functions as audiovisual hallucination, except that the phantasm includes visual, auditory, olfactory, tactile, and thermal components, and the phantasm follows a complex script. The phantasm follows that script without your concentration and can react to stimuli the targets perceive.","source":"Ultimate Intrigue pg. 224"},{"n":"Seeds of Influence, Greater","l":4,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"S, M (a rose)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level (D)","save":"Will negates","sr":"yes","effect":"This spell functions as seeds of influence, except that if the target is protected by a spell that grants immunity, spell resistance, or a saving throw bonus against a divination or mind-affecting spell you cast on the target, you can attempt caster level checks to dispel each such effect before applying the effects of those protections against the spell. The DC of the caster level check to dispel each effect is equal to 11 + the effect’s caster level. Such spells cast on the target while greater seeds of influence is active grant no protection against greater seeds of influence.","source":"Inner Sea Intrigue pg. 62"},{"n":"Seeming","l":4,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature per two levels, no two of which can be more than 30 ft. apart","duration":"12 hours (D)","save":"Will negates or Will disbelief (if interacted with)","sr":"yes or no; see text","effect":"This spell functions like disguise self, except that you can change the appearance of other people as well. Affected creatures resume their normal appearances if slain. Unwilling targets can negate the spell's effect on them by making Will saves or with spell resistance.","source":"PRPG Core Rulebook pg. 339"},{"n":"Sleet Storm","l":4,"school":"conjuration (creation) [cold]","castingTime":"1 standard action","components":"V, S, M/DF (dust and water)","range":"long (400 ft. + 40 ft./level)","target":"cylinder (40-ft. radius, 20 ft. high)","duration":"1 round/level","save":"none","sr":"no","effect":"Driving sleet blocks all sight (even darkvision) within it and causes the ground in the area to be icy. A creature can walk within or through the area of sleet at half normal speed with a DC 10 Acrobatics check. Failure means it can't move in that round, while failure by 5 or more means it falls (see the Acrobatics skill for details).\n\nThe sleet extinguishes torches and small fires.","source":"PRPG Core Rulebook pg. 344"},{"n":"Soulseeker","l":4,"school":"Divination","castingTime":"1 hour","components":"V, S, M (incense worth 250 gp), F (see text)","range":"unlimited","target":"one soul","duration":"instantaneous or 1 hour/level","save":"Will negates","sr":"no","effect":"You identify the stage of a given soul’s judgment, or determine its fate post-judgment. You must either unambiguously identify the soul you seek or use the skull of the body the soul vacated as a focus. If the subject does not share your alignment, the soul can attempt a Will save to resist this spell’s effects as if it were still alive. If the subject is still alive or its soul has been destroyed, this spell fails without providing any information.\n\nIf the soul has not yet been judged and moved on to its final reward or punishment, soulseeker provides an estimate of its location; in most cases, this is somewhere in the River of Souls or the Boneyard. While this may assist in physically traveling to the soul’s location, especially in cases involving effects such as soul bind or a devourer’s devour soul ability, the spell’s primary purpose is to identify how long the subject has been dead (and what form of life-restoring magic is necessary). If the soul has already been judged, soulseeker instead identifies the plane to which the soul has been sent as a petitioner and the petitioner’s general location on that plane (such as “Elysium, beneath the boughs of the Witchwood”).\n\nIf soulseeker is cast on the same plane on which the soul’s new petitioner form currently exists, it guides you along the shortest, most direct physical route to the petitioner, as described in find the path. In this case, the spell’s duration is 1 hour per level.","source":"Planar Adventures"},{"n":"Speak with Soul","l":4,"school":"necromancy","castingTime":"1 minute","components":"V, S, M (a drop of candle wax)","range":"10 ft.","target":"see text","duration":"1 minute/level (D)","save":"Will negates","sr":"no","effect":"Lets you converse with the soul of a dead creature, either at its place of death or wherever you keep its remains, unlike similar divinations that only permit yes/no answers. The soul retains its knowledge from life (and possibly more, if it has gained awareness since death), and it is neither undead nor compelled to be truthful, so its answers may be unreliable or evasive.","source":"Planar Adventures pg. 45"},{"n":"Spirit-Bound Blade","l":4,"school":"evocation","castingTime":"1 standard action","components":"S","range":"touch","target":"weapon touched","duration":"1 minute/level","save":"Will negates (harmless, object)","sr":"no","effect":"You focus emotional energy and weave it into a shroud of hardened ectoplasm around the weapon you touch, infusing it with a ghostly glow and great power. The weapon becomes a ghost touch weapon, and gains one of the following additional benefits, depending on the type of emotion you infuse into the weapon. If a special ability wouldn’t apply to the chosen weapon (such as vicious on a ranged weapon), the weapon doesn’t gain that benefit. Anger : The weapon also gains the vicious special ability. Dedication : The weapon also gains the returning special ability. Despair : The weapon also gains the cruel UE special ability. Fear : The weapon also gains the menacing UE special ability. Hatred : The weapon also gains the cunning UE special ability. Jealousy : The weapon also gains the mimetic UE special ability. Zeal : The weapon also gains the keen special ability. If you are a spiritualist and the type of emotional energy you choose matches the emotional focus of your phantom, the weapon grants its wielder a +2 bonus on skill checks with both skills you gain Skill Focus in from your phantom’s emotional focus.","source":"Occult Adventures pg. 186"},{"n":"Spiritual Ally","l":4,"school":"Evocation [force]","castingTime":"1 standard action","components":"V, S, DF","ran
