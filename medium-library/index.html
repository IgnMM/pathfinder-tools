 round/level","save":"Will negates","sr":"yes","effect":"The target’s actions and words fail to impress. The target of this spell takes a –10 penalty on any Bluff, Diplomacy, and Intimidate checks as well as any performance combat checks it attempts.","source":"Ultimate Combat pg. 238"},{"n":"Object Reading","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one touched object","duration":"concentration, up to 1 round per level (D)","save":"none","sr":"no","effect":"You read the psychic impressions left upon an object by emotionally or psychically charged events in the item’s history, or the information imprinted by the charge object or implant false reading spells. This spell returns the same information as the psychometry occult skill unlock (see page 196), but gives 1 piece of information when cast and requires 1 round of concentration per additional piece of information instead of 1 minute. You must still attempt an Appraise check to see how much information you gain. You gain a +10 competence bonus on the check.","source":"Occult Adventures pg. 179"},{"n":"Oneiric Horror","l":1,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You cause the subject to believe it is being attacked by a creature out of its nightmares. Each round, the subject makes a full-attack action against the creature. A flying creature can still attempt a Fly check to hover. Each round on its turn after making a full attack against the imaginary creature, the subject can attempt a new saving throw to end the effect. The subject is fatigued for 1 minute after the spell ends.","source":"Occult Adventures pg. 179"},{"n":"Paranoia","l":1,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"The target believes everyone it sees is an enemy. The target becomes hostile to all creatures, treating all creatures as enemies and only itself as an ally. The target must attempt attacks of opportunity whenever any creature provokes them. Finally, whenever the target is adjacent to two or more creatures, its paranoia overwhelms it, and it takes a –2 penalty on attack rolls, weapon damage rolls, ability checks, skill checks, and saving throws.","source":"Occult Adventures pg. 179"},{"n":"Preserve","l":1,"school":"Necromancy","castingTime":"1 standard action","components":"V, S, M/DF (a pinch of salt)","range":"Touch","target":"One or more objects, up to 1 lb./level","duration":"1 week","save":"Will negates (object)","sr":"Yes (object)","effect":"You imbue one or more objects with magic that dramatically slows down natural processes that lead to decay and spoilage. For the duration of the spell, food, water, plants, and other perishable objects affected by the spell remain as fresh as they were when the spell was cast. The spell also protects these objects against spells of the same level or lower that cause spoilage, such as putrefy food and drinkAPG. When the duration of preserve expires, the objects resume aging at their normal rate. The spell also works on severed body parts and the bodies of small creatures as per gentle repose, provided that the weight of the creature or part does not exceed the spell's limit.\n\nPreserve can be made permanent with a permanency spell by a caster of 9th level or higher for 500 gp.","source":"Inner Sea Temples"},{"n":"Protection from Chaos","l":1,"school":"abjuration [lawful]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"creature touched","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"no; see text","effect":"This spell functions like protection from evil, except that the deflection and resistance bonuses apply to attacks made by chaotic creatures. The target receives a new saving throw against control by chaotic creatures and chaotic summoned creatures cannot touch the target.Mythic Protection from ChaosSource Mythic Adventures pg. 104\nAs mythic protection from evil, except against chaotic creatures.","source":"PRPG Core Rulebook pg. 327"},{"n":"Protection from Evil","l":1,"school":"abjuration [good]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"creature touched","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"no; see text","effect":"This spell wards a creature from attacks by evil creatures, from mental control, and from summoned creatures. It creates a magical barrier around the subject at a distance of 1 foot. The barrier moves with the subject and has three major effects.\n\nFirst, the subject gains a +2 deflection bonus to AC and a +2 resistance bonus on saves. Both these bonuses apply against attacks made or effects created by evil creatures.\n\nSecond, the subject immediately receives another saving throw (if one was allowed to begin with) against any spells or effects that possess or exercise mental control over the creature (including enchantment [charm] effects and enchantment [compulsion] effects, such as charm person, command, and dominate person). This saving throw is made with a +2 morale bonus, using the same DC as the original effect. If successful, such effects are suppressed for the duration of this spell. The effects resume when the duration of this spell expires. While under the effects of this spell, the target is immune to any new attempts to possess or exercise mental control over the target. This spell does not expel a controlling life force (such as a ghost or spellcaster using magic jar), but it does prevent them from controlling the target. This second effect only functions against spells and effects created by evil creatures or objects, subject to GM discretion.\n\nThird, the spell prevents bodily contact by evil summoned creatures. This causes the natural weapon attacks of such creatures to fail and the creatures to recoil if such attacks require touching the warded creature. Summoned creatures that are not evil are immune to this effect. The protection against contact by summoned creatures ends if the warded creature makes an attack against or tries to force the barrier against the blocked creature. Spell resistance can allow a creature to overcome this protection and touch the warded creature.Mythic Protection from EvilSource Mythic Adventures pg. 105\nThe bonuses to AC and on saves increase to +4. Any evil creature attempting to possess or exercise mental control over the target must attempt a Will save against this spell. If it fails, the creature takes 1d6 points of damage per 2 caster levels (maximum 5d6) from mental feedback. An evil creature that uses spell resistance to bypass the spell’s protection against contact must successfully save or take this damage once each round it attacks the protected target.","source":"PRPG Core Rulebook pg. 327"},{"n":"Protection from Good","l":1,"school":"abjuration [evil]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"creature touched","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"no; see text","effect":"Wraps the subject in a protective field 1 foot away, granting +2 deflection bonus to AC and +2 resistance bonus on saves, both effective only against good creatures. The subject gets a new save (with +2 morale bonus) against ongoing mental control by good creatures, suppressing such effects for the spell's duration and granting immunity to new attempts of that kind. The barrier also blocks bodily contact from summoned good creatures, causing their natural attacks to fail and forcing them back, though this ends if the subject attacks the blocked creature; spell resistance can bypass the ward.","source":"PRPG Core Rulebook pg. 328"},{"n":"Protection from Law","l":1,"school":"abjuration [chaotic]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"creature touched","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"no; see text","effect":"Wraps the subject in a protective field 1 foot away, granting +2 deflection bonus to AC and +2 resistance bonus on saves, both effective only against lawful creatures. The subject gets a new save (with +2 morale bonus) against ongoing mental control by lawful creatures, suppressing such effects for the spell's duration and granting immunity to new attempts of that kind. The barrier also blocks bodily contact from summoned lawful creatures, causing their natural attacks to fail and forcing them back, though this ends if the subject attacks or is moved into the blocked creature; spell resistance can bypass the ward.","source":"PRPG Core Rulebook pg. 328"},{"n":"Psychic Reading","l":1,"school":"divination","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 round","save":"none","sr":"yes","effect":"You are able to read a person’s surface thoughts and take cues from the person’s appearance, body language, and manner of speech to infer a great deal of information about the person, even if that person is in disguise (including polymorph effects). When casting the spell, attempt a DC 20 Sense Motive check with a bonus equal to your caster level. A successful skill check reveals to you one of the following pieces of information of your choice, plus one additional piece of information for every 5 points by which your check result exceeds 20: age, alignment, class†, feats†, gender, native language, place of origin, race or ethnicity, racial traits†, religion, sexual orientation, or training in a Craft, Perform, or Profession skill. For items marked with a cross (†), if the target has more than one of these features, each one you discover counts as a piece of information.\n\nThere’s a 70% chance that all information you receive is correct. This roll is made secretly. Otherwise, on a roll of 71–80, you receive one false piece of information, on a roll of 81–90 you receive two, and on a roll of 91–100 you receive three. You can’t get more false information than the total number of pieces of information you discover.","source":"Occult Adventures pg. 183"},{"n":"Quintessence","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature or object touched","duration":"10 minutes/level (D)","save":"Will negates (harmless) and Will disbelief, see text","sr":"see text","effect":"You draw forth the idealized image of the target creature or object, masking any flaws or damage. An injured or ill creature appears healthy, and a damaged object or one with the broken condition appears intact. However, a corpse masked by quintessence remains obviously dead, and a completely destroyed object can’t be made to seem whole. This illusion has visual and tactile components. Careful examination of or handling the target grants a saving throw to disbelieve, but casual observation does not. Using a broken object for its intended purpose automatically reveals the deception. Appraise checks to assess the value of an object affected by quintessence estimate the value as an item of its type in perfect condition, unless the appraiser disbelieves the illusion.\n\nUnwilling targets can negate the spell’s effect on them with successful Will saves or with spell resistance. Those who interact with the target can attempt Will saves to see through the glamer, but spell resistance doesn’t apply. Quintessence counters and dispels decrepit disguise.","source":"Occult Adventures pg. 184"},{"n":"Reduce Person","l":1,"school":"transmutation","castingTime":"1 round","components":"V, S, M (a pinch of powdered iron)","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 min./level (D)","save":"Fortitude negates","sr":"yes","effect":"This spell causes instant diminution of a humanoid creature, halving its height, length, and width and dividing its weight by 8. This decrease changes the creature's size category to the next smaller one. The target gains a +2 size bonus to Dexterity, a –2 size penalty to Strength (to a minimum of 1), and a +1 bonus on attack rolls and AC due to its reduced size.\nA Small humanoid creature whose size decreases to Tiny has a space of 2-1/2 feet and a natural reach of 0 feet (meaning that it must enter an opponent's square to attack). A Large humanoid creature whose size decreases to Medium has a space of 5 feet and a natural reach of 5 feet. This spell doesn't change the target's speed.\nAll equipment worn or carried by a creature is similarly reduced by the spell.\nMelee and projectile weapons deal less damage. Other magical properties are not affected by this spell. Any reduced item that leaves the reduced creature's possession (including a projectile or thrown weapon) instantly returns to its normal size. This means that thrown weapons deal their normal damage (projectiles deal damage based on the size of the weapon that fired them).\nMultiple magical effects that reduce size do not stack. Reduce person counters and dispels enlarge person.\nReduce person can be made permanent with a permanency spell.\nMythic Reduce Person\n##Source## Mythic Adventures pg. 105\nYou can decrease the target’s size by up to two categories, to a minimum of Tiny. If the target shrinks two sizes, its weight decreases by a factor of 16 and it gains a +4 size bonus to Dexterity, a –4 size penalty to Strength, and a +2 bonus on attack rolls and to AC because of its decreased size. A Medium or Small humanoid creature whose size decreases to Tiny has a space of 2-1/2 feet and a natural reach of 0 feet.\nMythic reduce person counters and dispels mythic enlarge person.","source":"PRPG Core Rulebook pg. 330"},{"n":"Remove Fear","l":1,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature plus one additional creature per four levels, no two of which can be more than 30 ft. apart","duration":"10 minutes; see text","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You instill courage in the subject, granting it a +4 morale bonus against fear effects for 10 minutes. If the subject is under the influence of a fear effect when receiving the spell, that effect is suppressed for the duration of the spell.\n\nRemove fear counters and dispels cause fear.","source":"PRPG Core Rulebook pg. 332"},{"n":"Restore Corpse","l":1,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"Touch","target":"Corpse touched","duration":"Instantaneous","save":"None","sr":"No","effect":"You grow flesh on a decomposed or skeletonized corpse of a Medium or smaller creature, providing it with sufficient flesh that it can be animated as a zombie rather than a skeleton. The corpse looks as it did when the creature died. The new flesh is somewhat rotted and not fit for eating.","source":"Ultimate Magic"},{"n":"Revealing Light","l":1,"school":"evocation [light]","castingTime":"1 standard action","components":"V, S, M/DF (piece of a mirror)","range":"touch","target":"object touched","duration":"10 minutes/level","save":"none","sr":"no","effect":"The touched object emits a shimmering light (as per light) that causes shadows to shift constantly in a 20-foot radius. Creatures lose any racial bonus on Stealth checks while in the area, and the light suppresses any bonuses on Stealth checks granted by visual camouflage (such as from camouflage nettingUE or the camouflage rogue talentAPG). The unpredictable light patterns also interfere with spells and effects of the pattern subschool, granting all creatures in the area a +2 bonus on saves against such effects.","source":"Monster Hunter's Handbook pg. 31"},{"n":"Rumormonger","l":1,"school":"divination","castingTime":"1 standard action","components":"V","range":"long (400 ft. + 40 ft./level)","target":"1 rumor","duration":"1 day/level (D)","save":"Will negates (see text)","sr":"yes","effect":"You utter a brief anecdote or bit of news as the verbal component of this spell and track its progress through a social gathering or other crowd. When someone who heard the rumor directly from you and repeated the rumor is within your range, they glow silver to your sight, though this glow doesn’t occur if the creature is in disguise (unless it was in the same disguise at the time of casting). You can choose to follow the rumor by selecting any such creature in range, at which point the creatures who heard the rumor from you no longer glow silver, and now the creatures who heard the rumor from your chosen creature glow silver instead. You can follow the rumor’s path until you reach a creature that heard the rumor but didn’t repeat it (or repeated it incorrectly). The glow identifies only creatures who heard the same information you conveyed. Minor cosmetic changes in the rumor don’t interrupt the chain, but when the rumor no longer resembles the information you imparted, the trail stops and the spell ends.\n\nYou can instead use this spell to trace a rumor back to its source once you hear it. In this case, you repeat the rumor as you heard it for the spell’s verbal component. The person who told you the rumor can attempt a Will save to end the effect. Failure indicates the silver glow leads to the individual that told her. This process continues each time you locate the next individual spreading the same information. Each individual attempts the save until one of them succeeds (in which case the spell ends and you can’t attempt to trace this particular rumor again) or you trace the rumor to its original source. As with the other application of the spell, tracing a rumor back fails to cause a creature to glow if it is in disguise, unless it was in the same disguise at the time of speaking the rumor.","source":"Ultimate Intrigue pg. 224"},{"n":"Sense Fear","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (a patch of fur)","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"You sense creatures within 30 feet that are currently under any fear condition (from spooked to horrified), perceiving their approximate direction and fear level; within 5 feet you pinpoint their exact location as if using blindsense.","source":"Horror Adventures pg. 127"},{"n":"Share Glory","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one non-mythic creature/3 levels","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You imbue the targets with a fraction of your mythic nature. They count as mythic creatures for the purpose of path abilities, spells, and other effects that function differently for mythic creatures. This doesn’t grant the targets mythic tiers or any uses of mythic power; it merely gives them a greater advantage when others use abilities that work differently for mythic creatures. You must be at least a 1st-tier mythic character to cast this spell.","source":"Mythic Adventures pg. 114"},{"n":"Share Language","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a page from a dictionary)","range":"touch","target":"creature touched","duration":"24 hours","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You can share your facility for one particular language with another creature. For 24 hours the target can read, understand, and communicate to the best of its ability in any one language which you already know. For every 5 levels you possess, you can grant the use of another language you know, to a maximum of 5 languages at 20th level. The target must have the physical capacity to articulate sounds, make gestures, or engage in whatever other method speakers of the language use to communicate with each other in order to actually converse. If the target lacks the mental capacity to grasp an actual language it still gains enough knowledge to respond to and carry out even extremely complex commands or suggestions coached in the language (whether written or spoken). However, since this spell does not endow the target with greater reasoning capacity, merely a temporarily enhanced vocabulary, the person offering up instructions to non-sentient creatures must take care to remove any ambiguity or guesswork.\n\nSimilarly, this spell does not affect the basic nature of the target, or its disposition toward you or anyone else, so convincing it to actually carry out these instructions could require negotiation, threats, or outright bribery.","source":"Advanced Player's Guide pg. 243"},{"n":"Silent Image","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10-ft. cubes + one 10-ft. cube/level (S)","duration":"concentration","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell creates the visual illusion of an object, creature, or force, as visualized by you. The illusion does not create sound, smell, texture, or temperature. You can move the image within the limits of the size of the effect.","source":"PRPG Core Rulebook pg. 343"},{"n":"Skin Tag","l":1,"school":"necromancy (haunted) [emotion, fear, mind-affecting]","castingTime":"1 minute","components":"V, S, M (beverage or food item, plus special reagents worth 25 gp)","range":"touch (object); 1 mile (remote effects)","target":"1 beverage or piece of food touched","duration":"1 day plus 1 day/level (D)","save":"none (object), Fortitude negates; see text","sr":"no (object), yes (creature)","effect":"You mix a malign spirit into a piece of food, a drink, or some other item to be consumed (including alchemical items, potions, elixirs, or similar items). The skin tag spell discharges when the item is consumed, affecting the creature that used the item unless it succeeds at a Fortitude save. The spirit embeds itself somewhere in the affected creature’s skin, forming a painless set of wrinkles and tags of skin that looks vaguely like a face when the haunt activates. You are considered to have a body part from the affected creature for the purpose of scrying and similar divination spells. Once per day as a standard action, you can remotely cause the spirit to make the affected creature’s skin crawl, causing the creature to become sickened for 1d4 rounds + 1 round per 2 caster levels you have (to a maximum of 5 extra rounds at 10th level) unless it succeeds at a Fortitude save. Alternatively, once per day you can remotely use a hex, a mind-affecting spell, or a necromancy spell that causes disease or possession on the affected creature. Each time you use the remote sickening or spell or hex effect, the spell’s haunt-like manifestation occurs during that round.\n@@Haunt Statistics@@\nNotice Perception DC DC 20 (to taste a hint of rot) or DC 25 (if the affected creature is wearing armor or heavy clothing)\nhp 5 hp; Trigger conditional (using the item or the spell's remote effects; Reset none","source":"Haunted Heroes Handbook pg. 28"},{"n":"Speechreader's Sight","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"If a creature within 100 feet that you can see is speaking a language you understand, you can read its lips with perfect accuracy. Reading lips in this manner gives the exact wording of conversation and does not assist in deciphering any obfuscated ideas such as secret messages or slang. Reading lips requires moderate concentration, and you take a –4 penalty on other Perception checks while doing so.\nSpeechreader’s sight can be made permanent with a permanency spell cast by a caster of 9th level or higher, at a cost of 2,500 gp.","source":"Heroes of the High Court pg. 10"},{"n":"Summon Minor Monster","l":1,"school":"conjuration (summoning)","castingTime":"1 round","components":"V, S, F/DF (a tiny bag and a small candle)","range":"close (25 ft. + 5 ft./2 levels)","target":"1d3 summoned creatures","duration":"1 round/level (D)","save":"none","sr":"no","effect":"Summons 1d3 Tiny or smaller animals of one kind (bats, lizards, monkeys, rats, ravens, toads, or weasels) to fight for you; you may apply an alignment-appropriate creature template matching your alignment to the summoned animals.","source":"Ultimate Magic pg. 241"},{"n":"Summon Monster 1","l":1,"school":"conjuration (summoning)","castingTime":"1 round","components":"V, S, F/DF (a tiny bag and a small candle)","range":"close (25 ft. + 5 ft./2 levels)","target":"one summoned creature","duration":"1 round/level (D)","save":"none","sr":"no","effect":"Calls one extraplanar creature from this spell's 1st-level summon list to fight for you, acting immediately on your turn; you choose the creature at casting. Creatures marked with an asterisk in the list gain the celestial template if you're good or the fiendish template if you're evil (neutral casters choose). Summoned creatures cannot teleport, summon others, or cast spells with costly material components, and vanish when the duration ends or they're slain.","source":"PRPG Core Rulebook pg. 350"},{"n":"Tears to Wine","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a single grape)","range":"10 ft.","target":"1 cu. ft./2 levels of liquid (see text)","duration":"10 minutes/level","save":"Will negates (object)","sr":"yes (object)","effect":"Legend claims runelords used this spell to literally benefit from drinking the tears of their captured foes. This spell turns nonmagic liquids—including spoiled, rotten, diseased, poisonous, or otherwise contaminated drinks, tears, seawater, and similar fluids—into mead or wine of average quality. This spell does not prevent subsequent natural decay or spoilage. Unholy water and similar liquids of significance are spoiled by tears to wine, but the spell has no effect on creatures of any type or on magic potions.\nCreatures that drink the mead or wine created by this spell become sharp-witted and clear-minded, gaining a +2 enhancement bonus on all Intelligence- and Wisdom-based skill checks. This increases to a +5 bonus at caster level 9th, and to +10 (the maximum) at caster level 15th.","source":"Arcane Anthology pg. 22"},{"n":"True Skill","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"none","sr":"no","effect":"When faced with an important situation, you grant yourself a magical edge to ensure your success. When casting this spell, select one skill for which you can attempt a skill check. The next time you attempt a skill check using the selected skill (before the spell’s duration ends), you gain an insight bonus on the check equal to 1/2 your caster level (minimum 1).","source":"Inner Sea Intrigue pg. 63"},{"n":"True Strike","l":1,"school":"divination","castingTime":"1 standard action","components":"V, F (small wooden replica of an archery target)","range":"personal","target":"you","duration":"see text","save":"none","sr":"no","effect":"You gain temporary, intuitive insight into the immediate future during your next attack. Your next single attack roll (if it is made before the end of the next round) gains a +20 insight bonus. Additionally, you are not affected by the miss chance that applies to attackers trying to strike a concealed target.\nMythic True Strike\n##Source## Mythic Adventures pg. 110\nThe affected attack bypasses all damage reduction.\nAugmented (2nd): If you expend two uses of mythic power, you gain a +10 insight bonus on your second attack that round and a +5 insight bonus on your third attack that round. The second and third attacks can be on your turn or on another creature’s turn before your next turn (such as when you attempt an attack of opportunity).","source":"PRPG Core Rulebook pg. 363"},{"n":"Unerring Weapon","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one weapon or 20 projectiles, all of which must be together at the time of casting","duration":"1 round/level","save":"Will negates (harmless, object)","sr":"yes (harmless, object)","effect":"This spell causes a weapon to veer closer to vital areas, improving the result of a critical threat. This transmutation grants a +2 bonus on attack rolls to confirm critical hits plus 1 additional bonus point per four caster levels (maximum total bonus +7). If the spell is cast on projectiles, the effect ends on a specific projectile whenever that projectile is used to make an attack, regardless of whether the attack hits. For this spell, shuriken are considered projectiles.","source":"Ultimate Combat pg. 248"},{"n":"Unprepared Combatant","l":1,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"The target takes a –4 penalty on initiative checks and Reflex saves.","source":"Ultimate Magic pg. 246"},{"n":"Unseen Servant","l":1,"school":"conjuration (creation)","castingTime":"1 standard action","components":"V, S, M (a piece of string and a bit of wood)","range":"close (25 ft. + 5 ft./2 levels)","target":"one invisible, mindless, shapeless servant","duration":"1 hour/level","save":"none","sr":"no","effect":"An unseen servant is an invisible, mindless, shapeless force that performs simple tasks at your command. It can run and fetch things, open unstuck doors, and hold chairs, as well as clean and mend. The servant can perform only one activity at a time, but it repeats the same activity over and over again if told to do so as long as you remain within range. It can open only normal doors, drawers, lids, and the like. It has an effective Strength score of 2 (so it can lift 20 pounds or drag 100 pounds). It can trigger traps and such, but it can exert only 20 pounds of force, which is not enough to activate certain pressure plates and other devices. It can't perform any task that requires a skill check with a DC higher than 10 or that requires a check using a skill that can't be used untrained. This servant cannot fly, climb, or even swim (though it can walk on water). Its base speed is 15 feet.\n\nThe servant cannot attack in any way; it is never allowed an attack roll. It cannot be killed, but it dissipates if it takes 6 points of damage from area attacks. (It gets no saves against attacks.) If you attempt to send it beyond the spell's range (measured from your current position), the servant ceases to exist.","source":"PRPG Core Rulebook pg. 364"},{"n":"Unsettling Presence","l":1,"school":"necromancy (haunted) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one 5-ft. cube/level (S)","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"Those in this spell’s area who fail their Will saving throws harbor a faint sense of paranoia and evoke the same feeling in others for the duration of the spell. Domesticated animals (not including familiars and animal companions) don’t willingly approach affected creatures unless the animal’s master succeeds at a DC 25 Handle Animal, Ride, or wild empathy check. Affected creatures take a –4 penalty on Handle Animal, Ride, and wild empathy checks against familiars, animal companions, animal cohorts, and other permanent companions provided by class abilities for the spell’s duration. Anyone an affected creature interacts with must succeed at a Will save or have its initial attitude automatically worsened by one step for the spell’s duration. Every time an affected creature attempts a Sense Motive check to get a hunch or detect a Bluff from another creature (or vice versa), it must succeed at a Will save or automatically assume the other party is lying or otherwise harbors ill will against it. Each time this spell causes an affected creature (or someone interacting with the affected creature) to attempt a Will saving throw, the spell’s hauntlike manifestation occurs.\n\nHaunt Statistics\nNotice Perception DC DC 20 (to feel a sudden sense of dread, or to hear victims’ names whispered behind their backs)\nhp 2 hp/level; Trigger proximity; Reset none","source":"Haunted Heroes Handbook pg. 29"},{"n":"Ventriloquism","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, F (parchment rolled into cone)","range":"close (25 ft. + 5 ft./2 levels)","target":"intelligible sound, usually speech","duration":"1 min./level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"You can make your voice (or any sound that you can normally make vocally) seem to issue from someplace else. You can speak in any language you know. With respect to such voices and sounds, anyone who hears the sound and rolls a successful save recognizes it as illusory (but still hears it).","source":"PRPG Core Rulebook pg. 365"},{"n":"Vocal Alteration","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 minute/level","save":"Fortitude negates","sr":"yes","effect":"You alter the target’s voice to something else. For example, you could make the target’s voice high-pitched, husky, or nasal, or change its accent to an accent you are familiar with. If this spell is used as part of a disguise, the target gets a +10 bonus on the Disguise check when trying to fool a listener.\nThe target can vary the disguised voice just as it could its normal voice. For example, a halfling female given a male dwarf noble’s voice and accent could speak in falsetto, with a rural halfling accent, and so on.","source":"Ultimate Magic pg. 248"},{"n":"Whispering Lore","l":1,"school":"Divination","castingTime":"1 full-round action","components":"V, S, M/DF (an owl's beak)","range":"Personal","target":"You","duration":"10 minutes/level (D)","save":"Consultar manual","sr":"Consultar manual","effect":"Upon casting this spell, you are able to gain knowledge from the land itself. As you walk through the terrain, it whisper information in a language you understand, though the whispering is so rambling it is hard to distinguish useful information. This whispering grants you a +4 insight bonus on a single Knowledge skill type appropriate to the type of terrain you are in. If you are within a cold, desert, forest, jungle, mountain, plains, swamp, or water environment, you gain the bonus on Knowledge (nature) checks. If you are within an underground environment, you gain the bonus on Knowledge (dungeoneering) checks. If you are within an urban environment, you gain the bonus on Knowledge (local) checks. If you are on a plane other than the Material Plane, you gain the bonus on Knowledge (planes) checks. If you enter a new terrain, you lose the previous terrain's skill bonus and gain the new bonus.","source":"Advanced Race Guide"},{"n":"Wizened Appearance","l":1,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 hour/level","save":"Fortitude negates","sr":"yes","effect":"You polymorph your target to look like an older version of itself. You select how much older (for example, “10 years older” or “as an adult”). You can’t otherwise change the target’s appearance other than those details directly associated with aging (for example, a target’s hair might turn gray or the target might develop liver spots). This spell allows children of creatures that are Medium or smaller when fully grown to grow one size category to the normal, adult size of that type of creature, but otherwise the selected age increase doesn’t alter the creature’s size. A change in size doesn’t alter the target’s ability scores. This spell doesn’t affect or cause any age-based modifications to ability scores or other age-related effects like dragon age categories or natural metamorphoses.\nWizened appearance and youthful appearanceUM counter and dispel each other.","source":"Ultimate Intrigue pg. 229"},{"n":"Youthful Appearance","l":1,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 hour/level","save":"none","sr":"no","effect":"You make your target look like a younger version of itself. You select how much younger it looks (for example, “10 years” or “as a young adult”). You cannot otherwise change details of the target’s appearance other than those directly associated with aging (for example, gray hair returns to its original color). The target cannot appear so much younger that it changes size. This spell does not affect any age-based modifications to ability scores or other age-related effects.","source":"Ultimate Magic pg. 249"},{"n":"Absurdity","l":2,"school":"illusion (phantasm) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"up to one creature/level, no two of which can be more than 30 ft. apart","duration":"1 minute/level (D)","save":"Will negates","sr":"no","effect":"Your targets perceive intimidation and threats as laughably absurd. A character attempting to intimidate your targets is instead perceived as having exaggerated facial features or babbling and awkward speech. Effects that impose fear conditions become objects of ridicule, with the targets making fun of the source of the object as it attempts to scare them.\n\nAbsurdity protects your targets from gaining lesser fear conditions (spooked, shaken, and scared), granting them immunity to spooked and a 50% chance to negate shaken or scared conditions instead of gaining them from any effect, including uses of the Intimidate skill to demoralize. Any other effect related to a spell or ability that generates fear (such as dying from a phantasmal killer) affects them normally, and effects that ignore immunity to fear also ignore absurdity.\n\nHowever, target creatures also have serious difficulty noticing potential threats; they take a –10 penalty on Sense Motive checks to avoid surprise or to notice that a creature is actively threatening or malicious and a –2 penalty on initiative checks. The spell doesn’t prevent spells or effects that provide early warning or a form of danger sense (like anticipate perilUM or find traps) from alerting the affected character to danger.","source":"Horror Adventures pg. 108"},{"n":"Aid","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"living creature touched","duration":"1 min./level","save":"none","sr":"yes (harmless)","effect":"Aid grants the target a +1 morale bonus on attack rolls and saves against fear effects, plus temporary hit points equal to 1d8 + caster level (to a maximum of 1d8+10 temporary hit points at caster level 10th).","source":"PRPG Core Rulebook pg. 239"},{"n":"Alpha Instinct","l":2,"school":"enchantment (charm) [mind-affecting]","castingTime":"10 minutes","components":"V, S, M (a bit of musk from an alpha wolf or another socially dominant animal)","range":"personal","target":"you","duration":"1 hour/level (D)","save":"","sr":"","effect":"Animals perceive you as a social superior. The starting attitude of animals you interact with improves by one step, and you gain a +2 morale bonus on Handle Animal checks. Helpful animals provide simple assistance (such as using the aid another action on skill checks they understand) as long as the spell lasts, but they flee from attacks and do not support you in combat. At one point during the spell’s duration, you can issue a nonverbal command to helpful animals within 60 feet to forage for you; the animal or animals immediately head out into the wilderness to do just that. After 1 hour, the animals return to the location where you issued the command to make you an offering of edible food sufficient for one meal for you and a number of others equal to your caster level.","source":"Ultimate Wilderness pg. 227"},{"n":"Alter Self","l":2,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, M (a piece of the creature whose form you plan to assume)","range":"personal","target":"you","duration":"1 min./level (D)","save":"none","sr":"no","effect":"When you cast this spell, you can assume the form of any Small or Medium creature of the humanoid type. If the form you assume has any of the following abilities, you gain the listed ability: darkvision 60 feet, low-light vision, scent, and swim 30 feet.\nSmall creature: If the form you take is that of a Small humanoid, you gain a +2 size bonus to your Dexterity.\nMedium creature: If the form you take is that of a Medium humanoid, you gain a +2 size bonus to your Strength.","source":"PRPG Core Rulebook pg. 240"},{"n":"Analyze Aura","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object","duration":"concentration, up to 1 round/level","save":"none","sr":"no","effect":"You peer into the aura of one target creature or object, gaining valuable information about its condition and nature. Each round, choose one of the target’s four auras. This spell functions similarly to the read aura occult skill unlock (see page 197), but doesn’t require checks and returns results on all the target’s auras in an instant. Alignment Aura : You study the target’s spiritual nature to determine its alignment. You also learn the type and power of its alignment aura, as detect evil . Emotion Aura : The colors playing within the target’s aura reveal its emotional state, granting valuable insight into its psyche. You learn a general summary of the target’s current disposition, as well as its attitude toward any other creatures within 30 feet of it. For the duration of the spell and for 1 hour afterward, you gain a +2 circumstance bonus on Bluff, Diplomacy, Intimidate, and Sense Motive checks you attempt against the target. Objects do not have emotion auras, except intelligent weapons and similar sentient oddities. Health Aura : The flow of vital force animating the target becomes plainly visible, giving you insight into its physical condition. You know whether the target is unharmed or wounded, whether it is poisoned or diseased, and whether it is under any of the following conditions: confused, disabled, dying, nauseated, panicked, staggered, stunned, or unconscious. Further, your insight into the overall strength of the target’s vital force reveals the total number of points available in its ki pool, grit pool, or similar resource. Objects and most undead creatures don’t have health auras. Magic Aura : You determine the number and power of all magical auras on the target (as detect magic to determine a magic aura’s power), as well as the school of each aura. You can attempt Knowledge (arcana) or Spellcraft skill checks to determine the school or identify properties of a magic item, as normal. If cast on an item, analyze aura cuts through the obfuscation of the magic aura spell.","source":"Occult Adventures pg. 156"},{"n":"Appearance of Life","l":2,"school":"Illusion (glamer) [evil]","castingTime":"1 round","components":"V, S, M (one Tiny or larger living creature)","range":"Long (400 ft. + 40 ft./level)","target":"One or more undead creatures","duration":"10 minutes/level (D)","save":"Will disbelief or Will negates (see text)","sr":"No","effect":"The illusion makes undead creatures of Medium size or smaller appear as if they were living humanoid creatures. You can target a number of undead creatures whose total number of Hit Dice is no greater than twice your caster level. When you create the illusion, you choose the races, genders, and attire for the undead creatures. Additionally, the illusion makes the undead creatures' movements appear lifelike (two shuffling zombies could be made to appear as two strolling lovers). The illusion doesn't create smell, sound, texture, or temperature. Undead with Intelligence scores can attempt a saving throw to negate the effect of the spell, but mindless undead do not. Any creatures interacting with the illusion receive a saving throw to disbelieve the illusion.\n\nThe illusion interferes with detect undead, requiring the caster to succeed at a caster check (DC = 11 + your caster level) for the spell to determine the creatures are undead.\n\nAppearance of life can be made permanent with a permanency spell by a caster of 12th level or higher for the cost of 10,000 gp.","source":"Horror Adventures"},{"n":"Apport Object","l":2,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V","range":"touch","target":"one touched object of up to 1 lb. and 1 cu. ft.","duration":"instantaneous or 1 hour/level","save":"Will negates (object)","sr":"yes (object)","effect":"This spell allows you to instantaneously transport a small nonliving object from one location to another. There are two ways to use the spell: sending allows you to immediately send an object held in your hands to a nearby location, while receiving permits you to cast the spell ahead of time on an object and summon it to your location at a later time.\n\nSending: If you choose to send the object elsewhere, the spell functions like teleport object, except the size of the object is limited and the distance it can travel is equal to only 25 feet + 5 feet per 2 levels. You can’t transport an object to the Ethereal Plane. You can send the held object to any square within range, and you don’t need line of sight to the target location. You can place the object in the open or inside a container, a pocket, or even someone’s hand. If there isn’t room in the space you select (either because the space chosen is too small or because there is already something else there), or if the person doesn’t want or isn’t expecting the object in his hands, it appears on the ground within the target’s square instead. You can transport the object to an elevation above the floor as long as the destination is within the spell’s total distance limit.\n\nReceiving: You can prepare an object ahead of time to apport it to yourself by casting the spell upon it and assigning a mental trigger to complete the spell. You don’t need line of sight to the object to apport it to you, but the object must be within a distance equal to 25 feet + 5 feet per 2 levels. Completing the spell is a swift action that has the same restrictions as a thought spell component. You can apport an object in this way even if someone holding the object is unwilling to let you take it. Once you apport the object, the spell ends.\n\nYou can’t send or receive an object into a space that is protected by an antimagic field, globe of invulnerability, or similar effect that keeps magical effects out; if you attempt to do so, the spell is lost.","source":"Occult Adventures pg. 157"},{"n":"Audiovisual Hallucination","l":2,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration + 3 rounds (D)","save":"Will disbelief","sr":"yes","effect":"This spell functions as auditory hallucination, except that you can include the image of any object, creature, or force you imagine or identify for the targets to imagine. You can move the image while you concentrate. After you cease concentration, you can define simple movements or changes for the phantasm to perform that can be explained in 25 words or fewer.\n\nThe image disappears when struck by an opponent unless you cause the illusion to react appropriately or instruct it to do so. Its AC is equal to 10 + the level of this spell.","source":"Ultimate Intrigue pg. 204"},{"n":"Augury","l":2,"school":"Divination","castingTime":"1 minute","components":"V, S, M (incense worth at least 25 gp), F (a set of marked sticks or bones worth at least 25 gp)","range":"Personal","target":"You","duration":"Instantaneous","save":"Consultar manual","sr":"Consultar manual","effect":"An augury can tell you whether a particular action will bring good or bad results for you in the immediate future.\n\nThe base chance for receiving a meaningful reply is 70% + 1% per caster level, to a maximum of 90%; this roll is made secretly. A question may be so straightforward that a successful result is automatic, or so vague as to have no chance of success. If the augury succeeds, you get one of four results:\n\nWeal (if the action will probably bring good results).Woe (for bad results).Weal and woe (for both).Nothing (for actions that don't have especially good or bad results).If the spell fails, you get the \"nothing\" result. A cleric who gets the \"nothing\" result has no way to tell whether it was the consequence of a failed or successful augury.\n\nThe augury can see into the future only about half an hour, so anything that might happen after that does not affect the result. Thus, the result might not take into account the long-term consequences of a contemplated action. All auguries cast by the same person about the same topic use the same die result as the first casting.","source":"Core Rulebook"},{"n":"Aura of the Unremarkable","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a white feather)","range":"30 ft.","target":"non-allied creatured within a 30-ft. emanation","duration":"1 minute/level (D) and instantaneous","save":"Will negates","sr":"yes","effect":"An invisible sphere of magic surrounds you, clouding the minds of creatures in the area so they regard even the strangest actions as innocuous. For example, if you and your allies are beating a member of the city guard for information, creatures within the area don’t think this is unusual or cause for alarm; if your ally is aiming a crossbow at the queen from a balcony, the affected creatures accept this as normal and unworthy of concern. Any hostile actions by you or your allies against a creature or its allies break the effect of the spell for that creature. When the spell ends (or when the affected creatures move outside of the range of the emanation), observers see things normally but altered perceptions from the earlier events remain. Each mention of the events as noteworthy (such as being questioned about them by an authority figure) allows the target another Will save to break the effect and remember things normally.","source":"Ultimate Intrigue pg. 204, Cheliax, Empire of Devils pg. 22"},{"n":"Bear's Endurance","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a few hairs, or a pinch of dung, from a bear)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes","effect":"The affected creature gains greater vitality and stamina. The spell grants the subject a +4 enhancement bonus to Constitution, which adds the usual benefits to hit points, Fortitude saves, Constitution checks, and so forth. Hit points gained by a temporary increase in Constitution score are not temporary hit points. They go away when the subject's Constitution drops back to normal. They are not lost first as temporary hit points are.","source":"PRPG Core Rulebook pg. 246"},{"n":"Bestow Curse","l":2,"school":"necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"permanent","save":"Will negates","sr":"yes","effect":"Curses the touched creature with one of: a -6 penalty (minimum 1) to one ability score, a -4 penalty on attack rolls, saves, and checks, or a 50% chance each round of either acting normally or taking no action at all; the GM may allow a custom curse of similar power instead. The curse resists dispel magic but can be lifted by break enchantment, limited wish, miracle, remove curse, or wish; this spell opposes and can end an existing remove curse effect on the same target.","source":"PRPG Core Rulebook pg. 247"},{"n":"Bestow Insight","l":2,"school":"enchantment (compulsion)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one creature touched","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"When casting this spell, choose a single skill that you have at least one rank in. The target gains a +2 insight bonus on skill checks with this skill and is considered trained in that skill. The insight bonus increases by 1 for every four levels of the caster (maximum +6). Furthermore, once before the spell’s duration, the target can choose to roll two checks and take the greater result. Doing so ends the spell’s other effects.","source":"Advanced Race Guide pg. 69"},{"n":"Bestow Weapon Proficiency","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (pieces of shaved metal)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You bestow the subject with the ability to use a single type of weapon he is not proficient in as if he were proficient with that weapon. The weapon can be of any type, including an exotic weapon, but the subject of the spell must be holding the weapon.","source":"Ultimate Combat pg. 224"},{"n":"Blood Biography","l":2,"school":"divination","castingTime":"1 minute","components":"V, S, M/DF (a scrap of parchment)","range":"touch","target":"one creature’s blood or one bloodstain","duration":"instantaneous","save":"Will negates (see text)","sr":"no","effect":"You learn the answers to a specific set of questions about a creature so long as you have access to at least one drop of its blood. You can cast this spell on the blood of the living or the dead, but living or undead creatures are entitled to a saving throw to resist the spell. You can cast the spell on dried or fresh blood. Once you cast the spell the answers to the following four questions appear on any flat surface you designate (a wall, a piece of paper, and so on). Who are you? (The name by which the creature is most commonly known) What are you? (Gender, race, profession/role)How was your blood shed? (Brief outline of the events that caused its wound, to the best of the victim’s knowledge)When was your blood shed? These answers always appear in a language you can read even if the creature cannot speak that or any language.","source":"Advanced Player's Guide pg. 206"},{"n":"Blur","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V","range":"touch","target":"creature touched","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject's outline appears blurred, shifting, and wavering. This distortion grants the subject concealment (20% miss chance).\nA see invisibility spell does not counteract the blur effect, but a true seeing spell does.\nOpponents that cannot see the subject ignore the spell's effect (though fighting an unseen opponent carries penalties of its own).","source":"PRPG Core Rulebook pg. 251"},{"n":"Borrow Corruption","l":2,"school":"transmutation [evil]","castingTime":"1 standard action","components":"V, S, M (a dirty scrap of a good priest's raiment)","range":"touch","target":"creature touched","duration":"1 minute/level (D)","save":"none","sr":"no","effect":"You temporarily take on all the corruption stains and gifts currently affecting the touched creature, while it keeps its own; if a gift has limited daily uses, you gain none remaining. You suffer 1d3 points of Wisdom drain from the strain (or, under sanity rules, lose 2 sanity points instead, only 1 of which greater restoration can restore; miracle or wish removes it fully).","source":"Horror Adventures pg. 111"},{"n":"Bull's Strength","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a few hairs, or a pinch of dung, from a bull)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject becomes stronger. The spell grants a +4 enhancement bonus to Strength, adding the usual benefits to melee attack rolls, melee damage rolls, and other uses of the Strength modifier.","source":"PRPG Core Rulebook pg. 251"},{"n":"Cast Out","l":2,"school":"abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"creature touched","duration":"instantaneous","save":"Will partial","sr":"yes","effect":"With a melee touch attack you blast a single creature and disrupt any magic controlling it. The target takes 2d8 points of damage + 1 point per caster level (maximum +15). In addition, you make a dispel check against any magic jar effect (including a ghost’s malevolence ability) or enchantment (compulsion) spells on the target creature, starting with the highest level spells and proceeding to lower level spells. Treat this as a targeted dispel magic spell, except cast out can dispel one such spell for every four caster levels you possess. A successful Will save halves the damage and limits the dispelling to a single spell or effect.","source":"Advanced Player's Guide pg. 210"},{"n":"Cat's Grace","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (pinch of cat fur)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes","effect":"The transmuted creature becomes more graceful, agile, and coordinated. The spell grants a +4 enhancement bonus to Dexterity, adding the usual benefits to AC, Reflex saves, and other uses of the Dexterity modifier.","source":"PRPG Core Rulebook pg. 252"},{"n":"Catatonia","l":2,"school":"necromancy","castingTime":"1 standard action","components":"S","range":"touch","target":"willing creature touched","duration":"1 hour/level (D)","save":"none","sr":"yes","effect":"You touch the target and place it into a deathlike state that persists for the duration. The target appears to be dead, and any creature that interacts with the target must succeed at a DC 20 Heal check to recognize it is actually alive.\nUntil the spell ends, the target counts as if it were dead for the purpose of resolving any effects that target or affect only living creatures, but it doesn’t count as undead. The subject is helpless, and can still be killed normally.\nAny effect that would bring the creature back to life or animate it as an undead fails, but ends the catatonia. The target can be affected by spells that affect only objects, including animate objects (if the creature is Small) and teleport object. However, anything that would cause the body to change form (such as shrink item) fails and ends the catatonia. This doesn’t prevent the effects of spells that simply deal damage or otherwise destroy objects.","source":"Occult Adventures pg. 161"},{"n":"Clairaudience/Clairvoyance","l":2,"school":"divination (scrying)","castingTime":"10 minutes","components":"V, S, F/DF (a small horn or a glass eye)","range":"long (400 ft. + 40 ft./level)","target":"magical sensor","duration":"1 min./level (D)","save":"none","sr":"no","effect":"Clairaudience/clairvoyance creates an invisible magical sensor at a specific location that enables you to hear or see (your choice) almost as if you were there. You don't need line of sight or line of effect, but the locale must be known—a place familiar to you, or an obvious one. Once you have selected the locale, the sensor doesn't move, but you can rotate it in all directions to view the area as desired. Unlike other scrying spells, this spell does not allow magically or supernaturally enhanced senses to work through it. If the chosen locale is magically dark, you see nothing. If it is naturally pitch black, you can see in a 10-foot radius around the center of the spell's effect. Clairaudience/clairvoyance functions only on the plane of existence you are currently occupying.","source":"PRPG Core Rulebook pg. 255"},{"n":"Codespeak","l":2,"school":"transmutation","castingTime":"1 standard actino","components":"V, S, M (a complex rune inscribed on a slip of paper that is then placed under your tongue)","range":"close (25 ft. + 5 ft./2 levels)","target":"you plus one willing creature per 2 levels, no two of which can be more than 30 ft. apart","duration":"10 min./level (D)","save":"none","sr":"no","effect":"Upon casting this spell, all recipients gain the ability to speak a new language. This language sounds like random, babbling syllables to anyone not under the influence of the spell, but the targets understand each other perfectly.\n\nAnyone using codespeak can read and write in this new language as well. Once the spell expires, however, any coded writing suddenly appears as gibberish. If the exact same group of individuals become the targets of a codespeak spell again, cast by the same caster, they can once again read any coded writings. A dedicated codebreaker can crack such writing’s code, deciphering it one page at a time with a series of DC 30 Linguistics checks.\n\nComprehend languages doesn’t enable a caster to understand the language of another’s codespeak spell, but it does reveal that the targets are speaking a magical language. Tongues translates codespeak normally.","source":"Ultimate Intrigue pg. 206, Second Darkness Player's Guide pg. 26, Black Markets pg. 24"},{"n":"Cognitive Block","l":2,"school":"enchantment ( compulsion ) [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You create a mental block in the target’s mind, impeding the flow of his mental spellcasting process and forcing him to incorporate a thought component into any spell or spell-like ability he uses. This is in addition to any other components the spell already requires, and doesn’t replace the verbal component. Spell-like abilities require this thought component, even though they normally don’t need spell components. As usual with thought components, this addition increases the DC of any concentration checks the target attempts by 10 unless the target takes a move action to center his mind and satisfy the spell’s thought component.","source":"Occult Adventures pg. 161"},{"n":"Compassionate Ally","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"At the sight of an injured ally, the target immediately disengages from its current course of action and rushes to provide aid. If the target possesses curative spells or magic items, it utilizes them to help the injured ally. If not, the target provides aid by performing a Heal check. The target remains with the injured ally to assure her safety and refuses to leave the ally’s side until her wounds are fully treated or the spell ends, but can otherwise defend itself and make attacks.","source":"Ultimate Magic pg. 211"},{"n":"Contact Entity II","l":2,"school":"Evocation","castingTime":"1 minute","components":"V, S, M (see text)","range":"200 miles","target":"Up to 20 entities of 12 HD or fewer","duration":"Instantaneous","save":"Consultar manual","sr":"Consultar manual","effect":"This spell functions like contact entity I, except that you can contact creatures from the contact entity II list, and as noted above.","source":"Horror Adventures"},{"n":"Create Treasure Map","l":2,"school":"divination","castingTime":"1 hour","components":"V, S, M (powdered metal and rare inks worth 100 gp)","range":"touch","target":"one dead creature","duration":"instantaneous","save":"none","sr":"no","effect":"You can take a piece from a dead creature’s body and use it to create a map that reveals the locations of any valuables that creature knew about while still alive. You must cut this piece off yourself and the creature cannot have died more than 24 hours prior to the casting of this spell. You cannot cast this spell on a creature without a physical body, and the portion you remove must have a fairly level surface such as a piece of hide, carapace, or skin. The map you create is accurate to the best knowledge the creature had at the time of its death. It reveals the location of one source of treasure for every three caster levels you possess. Any inaccuracies or faulty information held by the creature are represented on the map as well. Similarly, the map cannot account for any changes that occur after the creature’s death. You must choose the scale of the map when creating it, opting between nearby (e.g., one or two dungeon levels), local (e.g., a valley or community), or broad (e.g., a country or larger). The map reveals the locations of what the creature deemed most valuable within its area. Depending on the creature, the map might reveal a source of tasty food, suitable mates, or even your own treasure vault.","source":"Advanced Player's Guide pg. 214"},{"n":"Darkvision","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (either a pinch of dried carrot or an agate)","range":"touch","target":"creature touched","duration":"1 hour/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject gains the ability to see 60 feet even in total darkness. Darkvision is black and white only but otherwise like normal sight.\nDarkvision can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 264"},{"n":"Daze Monster","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a pinch of wool or similar substance)","range":"medium (100 ft. + 10 ft./level)","target":"one living creature of 6 HD or less","duration":"1 round","save":"Will negates","sr":"yes","effect":"This spell functions like daze, but can affect any one living creature of any type. Creatures of 7 or more HD are not affected.","source":"PRPG Core Rulebook pg. 264"},{"n":"Detect Anxieties","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a medallion)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"Will negates (see text)","sr":"no","effect":"Senses the significant anxieties of creatures with Intelligence 1 or higher (conscious or not) in the cone; the second round reveals each mind's Wisdom score and its current degree of fear (from shaken to paralyzed), and if the highest Wisdom present is 26 or higher and beats yours by 10 or more, you're stunned for 1 round and the spell ends. The third round reveals the single most pressing anxiety of any mind present (Will negates this reading). Threatening a creature with a known anxiety grants a +2 bonus on Intimidate checks against it.","source":"Ultimate Intrigue pg. 211"},{"n":"Detect Desires","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a medallion)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"Will negates (see text)","sr":"no","effect":"Senses the significant desires of creatures with Intelligence 1 or higher (conscious or not) in the cone; the second round reveals each mind's Charisma score, and if the highest present is 26 or higher and beats yours by 10 or more, you're stunned for 1 round and the spell ends. The third round reveals the single most pressing desire of any mind present (Will negates this reading). Offering to fulfill a known desire grants a +2 (or greater) circumstance bonus on Diplomacy checks against that creature.","source":"Ultimate Intrigue pg. 211"},{"n":"Detect Magic, Greater","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"none","sr":"no","effect":"This spell functions as detect magic, except that you can glean much more information from the magical auras that you find, and those auras can be found after a much greater length of time. You can detect a lingering aura for up to 1 day per caster level you have, regardless of the aura’s original strength.\n\nAdditionally, when you use a standard action to concentrate on this spell, you can also study a creature within the spell’s area and attempt a Spellcraft check in order to determine the last spell that the creature cast by identifying lingering traces that the spell left in the caster’s aura. The DC to identify the spell is equal to 20 + the creature’s caster level.\n\nFinally, you are able to locate and analyze the signature flourishes in a magical aura that allow you to match a spell to the person who cast it. In order to find these identifiers in a spell’s aura, you must spend 1 round focusing on that spell in particular, and succeed at an opposed Knowledge (arcana) check against the caster (or a Knowledge [arcana] check with a DC equal to 15 + the spell level if the caster wants her work to be identified and emphasizes these unique elements rather than obscuring them). Once you learn a caster’s set of identifiers, you can remember them as easily as a face or a voice. You can recognize this signature if you succeed at a Spellcraft check when later identifying a spell to determine whether or not that spell was cast by the same individual. The spell greater magic aura can obfuscate this information, making it seem that someone else cast the spell. Greater detect magic grants a saving throw against magic aura (but not greater magic aura).","source":"Ultimate Intrigue pg. 212"},{"n":"Detect Mindscape","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"Will negates, see text","sr":"no","effect":"This spell functions similarly to detect thoughts, allowing you to sense when one or more creatures’ consciousnesses are inside a mindscape (see page 234). The amount of information revealed depends on how long you study a particular subject.\n\nFirst Round: You sense the presence or absence of a mindscape. At least one of the creatures inside the mindscape must be within the cone-shaped area for you to detect the mindscape.\n\nSecond Round: You sense the number of consciousnesses inside the mindscape. Not all of the creatures within the mindscape must be standing inside the cone-shaped area of the spell for you to count them; only one is required to get this reading. However, you can’t determine the location of the creatures if you can’t see the creatures themselves. You sense their presence only in an abstract way.\n\nThird Round: You sense an image of what’s taking place inside the mindscape. The creature controlling the mindscape can sense your efforts, and if it does not wish you to view the mindscape, it can prevent this viewing with a successful Will save. Otherwise, you perceive the visuals remotely, as if watching through a window. If a creature has disguised itself, you see only the creature’s mental mask (not its true form).\n\nEach round, you can turn to detect mindscapes in a new area. The spell can penetrate many barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.\n\nIf you are within a mindscape when you cast this spell, you become aware you’re in a mindscape. On the second round, you can still detect how many consciousnesses are inside, but you don’t get the image of the mindscape in the third round.","source":"Occult Adventures"},{"n":"Detect Thoughts","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a copper piece)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 min./level (D)","save":"Will negates; see text","sr":"no","effect":"You detect surface thoughts. The amount of information revealed depends on how long you study a particular area or subject.\n1st Round: Presence or absence of thoughts (from conscious creatures with Intelligence scores of 1 or higher).\n2nd Round: Number of thinking minds and the Intelligence score of each. If the highest Intelligence is 26 or higher (and at least 10 points higher than your own Intelligence score), you are stunned for 1 round and the spell ends. This spell does not let you determine the location of the thinking minds if you can't see the creatures whose thoughts you are detecting.\n3rd Round: Surface thoughts of any mind in the area. A target's Will save prevents you from reading its thoughts, and you must cast detect thoughts again to have another chance. Creatures of animal intelligence (Int 1 or 2) have simple, instinctual thoughts.\nEach round, you can turn to detect thoughts in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"PRPG Core Rulebook pg. 268"},{"n":"Disguise Other","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"10 minute/level (D)","save":"","sr":"","effect":"This spell functions as disguise self, except you can disguise either yourself or another creature.","source":"Ultimate Magic pg. 217"},{"n":"Dream Shield","l":2,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (hollow glass ball or dreamcatcher)","range":"touch","target":"creature touched","duration":"1 hour/level","save":"Will negates (harmless)","sr":"no","effect":"You ward the target’s mind against intrusion and influence while she is unconscious. While sleeping, the target is protected against divinations such as nondetection and gains spell resistance equal to 10 + your caster level against mind-affecting effects. In addition, the subject immediately receives another saving throw (if one was allowed to begin with) against any spell or effect that would possess or exercise direct mental control over her. This functions in all respects like the second property of protection from evil but it applies regardless of the alignment of the creature or object that created the possession or mental influence effect.\nIf the target is awake, instead of the previous effects, the dream shield provides a +4 bonus on saving throws against sleep effects. The spell’s other effects are suppressed while the target is awake. If the target falls asleep or is otherwise rendered unconscious, the other effects of the dream shield resume. Every 10 minutes spent awake consumes 1 hour of the dream shield’s duration.","source":"Occult Origins pg. 28"},{"n":"Eagle's Splendor","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (feathers or droppings from an eagle)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes","effect":"The transmuted creature becomes more poised, articulate, and personally forceful. The spell grants a +4 enhancement bonus to Charisma, adding the usual benefits to Charisma-based skill checks and other uses of the Charisma modifier. Bards, paladins, and sorcerers (and other spellcasters who rely on Charisma) affected by this spell do not gain any additional bonus spells for the increased Charisma, but the save DCs for spells they cast while under this spell's effect do increase.","source":"PRPG Core Rulebook pg. 275"},{"n":"Enchantment Sight","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"Your irises take on a purplish tinge and you can see whether creatures within 60 feet of you are affected by an enchantment effect. To your eyes only, a creature under the effects of an enchantment spell glows with a simple white light around its head. You can immediately discern whether the brightness of the light is faint, moderate, strong, or overwhelming depending on the highest spell level of enchantment currently in effect (as per detect magic). Enchantments of the charm or compulsion subschool glow with a scarlet or emerald hue, respectively.\nIf a creature under an enchantment effect is in your line of sight, you can attempt a Spellcraft check as a move action to determine the highest-level spell or spell effect (DC = 15 + the spell level, or 15 + 1/2 the caster level for a non-spell effect). Effects that block divination magic also block this spell.\nEnchantment sight can be made permanent with a permanency spell cast by a caster of 9th level or higher, at a cost of 2,500 gp.","source":"Heroes of the High Court pg. 10"},{"n":"Enshroud Thoughts","l":2,"school":"abjuration [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You become warded against the mental prying of others, including the effects of divination spells such as detect thoughts and seek thoughtsAPG, as well as enchantment spells such as modify memory and memory lapseAPG. If another creature attempts to target you with a mind-affecting spell that detects or alters your thoughts or memories, the caster must succeed at a caster level check against a DC equal to 11 + your caster level or the spell fails. Only spells that detect or alter your thoughts or memories are blocked by this spell; effects such as clairaudience/clairvoyance, detect evil, and locate creature continue to affect you as normal.","source":"Occult Adventures pg. 169, Blood of the Elements pg. 13"},{"n":"Extreme Buoyancy","l":2,"school":"evocation","castingTime":"1 standard action","components":"V, S, M (a bag of air), DF","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates","sr":"yes","effect":"The target’s buoyancy becomes and stays swiftly rising, regardless of how dense the target and its gear are. Among other effects, the target needs to succeed at a DC 20 Swim check to submerge itself and to stay submerged (see Buoyancy on page 43).","source":"Aquatic Adventures pg. 59"},{"n":"Extreme Flexibility","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"none","sr":"no","effect":"You gain a +1 dodge bonus to AC, a +4 circumstance bonus on Escape Artist checks and combat maneuver checks to escape a grapple, and +4 circumstance bonus to your CMD against grapple attempts.","source":"Advanced Class Guide pg. 181"},{"n":"False Life","l":2,"school":"necromancy","castingTime":"1 standard action","componen
