<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pathfinder Tools</title>
<script>
// This page only exists to hold the three Sanctum-linked scenes (Character Spell
// Sheets, Spell Libraries, Sources) -- there is no supported "browse everything" view
// of it anymore. Loading it without one of those hashes (typing the bare URL, an old
// bookmark, a stray link) bounces straight back to the Sanctum instead of ever
// painting the flat section list.
if(!location.hash) location.replace('./');
</script>
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/class-visuals.css">
<script src="assets/class-visuals.js"></script>
<style>
/* Shown by default (no JS needed) so it's the very first thing painted -- covers the
   raw, all-sections-closed HTML while the deep-link script below opens and focuses the
   right scene, so that state is never visible even for a frame. Removed once the
   correct scene is ready, or the page has already navigated away (bare load, bad
   hash) before this would ever need to disappear on its own. */
#loadVeil{position:fixed;inset:0;z-index:99999;background:#10151d;display:flex;align-items:center;justify-content:center}
#loadVeil .veilMark{font-size:2.2rem;color:var(--gold);animation:veilSpin 1.1s linear infinite}
@keyframes veilSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#loadVeil .veilMark{animation:none}}
:root{--navy:#10151d;--card:#191d27;--border:#343946;--muted:#aeb5c3;--gold:#d6b35f;--blue:#6aa8d9;--green:#72c69c;--purple:#b98aef}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--navy);color:#fff;margin:0;display:flex;justify-content:center;min-height:100vh}
main{width:min(94vw,1400px);padding:32px 0 48px}
h1{margin:0 0 24px}

details.section{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:14px 0;overflow:hidden;border-top:3px solid var(--accent)}
details.section > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:18px 20px;-webkit-tap-highlight-color:transparent}
details.section > summary::-webkit-details-marker{display:none}
details.section > summary::marker{content:""}

.icon{flex:none;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.04);display:grid;place-items:center}
.icon svg{width:34px;height:34px}

.section-title{flex:1;min-width:0}
.section-title .name{font-size:1.15rem;font-weight:700;color:#fff}
.section-title .count{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}

.chevron{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .18s ease}
details.section[open] .chevron{transform:rotate(180deg)}

.links{padding:4px 16px 16px;max-width:640px}
.links a{display:block;padding:14px 16px;margin:8px 0;border:1px solid var(--border);border-radius:12px;color:#fff;text-decoration:none;background:var(--navy);font-size:1rem;font-weight:700}
.links small{color:var(--muted);font-weight:400}
/* Menus with a lot of choices (Spell Libraries, Character Spell Sheets) shouldn't be
   one long single-column scroll -- let them use the page's real width instead. */
#section-spells>.links{
  max-width:none;
  padding:8px 8px 20px;
}

/* Character Spell Sheet: engraved-stone seals (stone-runes/class-assets/seals/*.png)
   floating directly over the background -- no card box, no flat icon. Grid columns are
   pinned per breakpoint (5/3/3) rather than left to auto-fit, to hit those exact
   targets; 1fr tracks still mean no fixed widths and no overflow risk. */
.classGrid{position:relative;padding:44px 28px 48px;display:grid;grid-template-columns:repeat(5,1fr);gap:56px 18px;border-radius:16px;background:#0b0e14 url('assets/stone-runes/arcane-seals-background.png') center/cover no-repeat}
/* Full-bleed background: only meaningful in scene focus (the only time these grids are
   visible at all), since the outer "Spells" card otherwise clips overflow for its own
   rounded corners. The grid content itself stays inset near its old ~1400px width via
   the same calc() as the page's own max-width -- only the photo behind it reaches the
   true screen edges. */
:is(body.sceneFocus, body:has(#section-spells[open] details.subsection[open])) #section-spells{overflow:visible}
@media(min-width:641px){
  :is(body.sceneFocus, body:has(#section-spells[open] details.subsection[open])) .classGrid,
  :is(body.sceneFocus, body:has(#section-spells[open] details.subsection[open])) .library-scroll{
    box-sizing:border-box;
    width:100vw;
    margin-left:calc(50% - 50vw);
    border-radius:0;
    padding-left:max(28px, calc((100vw - 1400px)/2 + 28px));
    padding-right:max(28px, calc((100vw - 1400px)/2 + 28px));
  }
  :is(body.sceneFocus, body:has(#section-spells[open] details.subsection[open])) .library-map{border-radius:0}
}
@media(max-width:1000px){.classGrid{grid-template-columns:repeat(3,1fr);gap:46px 14px;padding:36px 20px 40px}}
@media(max-width:640px){.classGrid{grid-template-columns:repeat(3,minmax(115px,1fr));gap:34px 8px;padding:28px 10px 32px;overflow-x:auto}}
.class-seal{display:flex!important;flex-direction:column;align-items:center;text-align:center;gap:0;text-decoration:none;color:#fff;cursor:pointer;background:none!important;border:0!important;padding:2px!important;margin:0!important;border-radius:10px;transition:transform .2s ease,filter .2s ease}
.class-seal:hover,.class-seal:focus-visible{transform:translateY(-6px) scale(1.03);filter:brightness(1.08) drop-shadow(0 0 12px color-mix(in srgb,var(--ccolor) 45%,transparent))}
.class-seal:focus-visible{outline:2px solid var(--ccolor);outline-offset:5px}
