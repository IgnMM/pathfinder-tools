 AC, and this bonus stacks with any armor worn by the creature. The ironbeard may also be used as a weapon equivalent to cold iron armor spikes. The ironbeard makes it difficult to speak, so any spellcasting with a verbal component has a 20% spell failure chance.","source":"Advanced Race Guide"},{"n":"Keep Watch","l":1,"x":"Lets subjects stand watch all night without ill effect, gaining the restorative benefits of full sleep while remaining awake and alert, though any fighting or vigorous activity ends the effect.","oath":false,"save":"Will negates (harmless)","school":"Enchantment","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: one creature touched/2 levels","duration":"8 hours or less; see text","sr":"yes (harmless)","effect":"This spell allows subjects to maintain watch overnight without fatigue and receive full rest benefits. Subjects gain hit points as if resting, wizards may prepare spells after 8 hours, and similar benefits apply. However, effects requiring actual sleep or dreaming don't function, though sleep-inducing effects like sleep or deep slumber remain effective. Any vigorous activity, including combat, immediately terminates the effect, requiring either recasting or actual sleep to avoid fatigue and secure full rest benefits.","source":"Knights of the Inner Sea"},{"n":"Knight's Calling","l":1,"x":"Compels an enemy to move its full speed directly toward you and do nothing else, letting you make an attack of opportunity if it ends its move adjacent to you.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round","sr":"yes","effect":"You compel an enemy to come and fight you. On its turn, the target moves its speed toward you, avoiding any other dangers along its path (including any movement that would provoke attacks of opportunity). The target may do nothing but move on its turn. If the target ends its move adjacent to you, you can make an attack of opportunity against the target.","source":"Advanced Player's Guide"},{"n":"Know the Enemy","l":1,"x":"Grants a +10 insight bonus on Knowledge checks about one specific creature type you encountered within the last day.","oath":false,"save":"none","school":"Divination","castingTime":"1 minute","components":"S, V, DF","range":"personal","target":"target: you","duration":"instantaneous","sr":"no","effect":"You commune with the divine, reflecting on one type of creature you encountered in the last day. You may make a Knowledge check regarding that creature type with a +10 insight bonus.","source":"Ultimate Magic"},{"n":"Liberating Command","l":1,"x":"Grants the target an immediate-action Escape Artist check against a bind/grapple/restraint with a competence bonus equal to twice your caster level (max +20).","oath":false,"save":"Will negates (harmless)","school":"Transmutation","castingTime":"1 immediate action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"instantaneous","sr":"yes (harmless)","effect":"If the target is bound, grappled, or otherwise restrained, he may make an Escape Artist check to escape as an immediate action. He gains a competence bonus on this check equal to twice your caster level (maximum +20). This spell has no effect if the target could not get free by using the Escape Artist skill (for example, if he were under the effects of a hold person spell or paralyzed by Strength damage).","source":"Ultimate Combat"},{"n":"Linebreaker","l":1,"x":"Grants a +20-foot bonus to speed when charging and a +2 bonus on bull rush and overrun combat maneuver checks for 1 minute per level.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 minute/level","sr":"no","effect":"You gain a +20 foot bonus to your base speed when charging and a +2 bonus on combat maneuver checks made to bull rush or overrun.","source":"Advanced Race Guide"},{"n":"Litany of Sloth","l":1,"x":"The target can no longer take attacks of opportunity or cast spells defensively, and cannot be affected by another 'litany' spell while under this one.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 swift action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round","sr":"yes","effect":"With a litany against the wages of sloth, you slow the target's defenses. The target cannot make attacks of opportunity or cast spells defensively. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Longshot","l":1,"x":"Grants a +10-foot bonus to the range increment of the subject's weapon for 1 minute per caster level.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a piece of fletching)","range":"personal","target":"target: you","duration":"1 minute/level","sr":"no","effect":"This spell reduces the effect of range, granting a +10-foot bonus to the range increment of any weapon used by the subject.","source":"Ultimate Combat"},{"n":"Positive Pulse","l":1,"x":"A burst of positive energy deals 1d6 damage + 1/2 caster levels (max +5) to undead and positive-energy-vulnerable creatures on a failed save, while living creatures gain +2 on saves vs. death effects, energy drain, negative energy, and haunts for 1 round.","oath":false,"save":"Will negates or Will negates (harmless)","school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"area: 5-ft.-radius burst","duration":"instantaneous plus 1 round","sr":"yes","effect":"A wave of positive energy emanates from a designated point, harming undead and protecting living creatures. Undead and haunts in the area must succeed at a Will save or take 1d6 points of damage plus 1 point per 2 caster levels (maximum +5).\n\nLiving creatures healed by positive energy don't take damage. Instead, they gain a +2 bonus on saving throws against death effects, energy drain, negative energy, and effects directly caused by haunts for 1 round.","source":"Planar Adventures"},{"n":"Rally Point","l":1,"x":"Creates a 5-foot favorable zone where entering good-aligned creatures gain a +2 morale bonus on attacks/saves and 2 temporary hit points per caster level for 1 round, once each.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [emotion, good, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"5 ft.","target":"area: one 5-ft. square","duration":"1 minute/level (D)","sr":"yes (harmless)","effect":"You create a spot that has the power to briefly hearten any good creature who comes into contact with it. A good creature who enters this square (even if simply as part of its normal move) gains a +2 morale bonus on attacks, saving throws, and 2 temporary hit points per caster level for 1 round. Nongood creatures gain no benefit from this spell. A creature cannot benefit more than once from the same casting of this spell.","source":"Advanced Player's Guide"},{"n":"Rite of Bodily Purity","l":1,"x":"Grants a +2 resistance bonus on saves against disease, drugs, and poison, with a one-time immediate-action reroll on a failed such save before the spell ends.","oath":false,"save":"none","school":"Abjuration [meditative]","castingTime":"1 hour","components":"V, M (soothing incense worth 100 gp)","range":"personal","target":"target: you","duration":"24 hours or until discharged","sr":"no","effect":"You energize your body's immune system, improving your ability to resist toxins and ailments. You gain a +2 resistance bonus on saving throws to resist diseases, drugs, and poisons. Additionally, at any time during the spell's duration, whenever you fail a saving throw to resist a disease, drug, or poison, you can expend the spell's remaining duration as an immediate action in order to reroll that saving throw. You must take the second result, even if it's worse. The +2 resistance bonus granted by the spell applies to the reroll, but after you make this reroll, the spell ends.","source":"Divine Anthology"},{"n":"Sanctify Corpse","l":1,"x":"Protects a corpse so attempts to raise it as undead automatically fail, postponing any such effect from the slaying creature until the spell ends; renewable daily or made permanent via permanency.","oath":false,"save":"none","school":"Evocation [good]","castingTime":"1 standard action","components":"V, S, DF, M (a pinch of silver dust)","range":"touch","target":"area: corpse touched","duration":"24 hours","sr":"no","effect":"This spell blesses a corpse with positive energy, preventing it from being turned into an undead creature. Attempts to raise the corpse as an undead automatically fail. If the corpse is of a person slain by a creature that creates undead out of its slain foes (such as a shadow, vampire, or wraith), that effect is delayed until the end of this spell. It is possible to protect a corpse for an extended time by casting this spell each day.\n\nThe spell can be made permanent through a permanency spell cast by a 9th-level or higher caster for 500 gp.","source":"Ultimate Magic"},{"n":"Shield of Fortification","l":1,"x":"Gives a 25% chance that a critical hit or sneak attack against the target is negated and its damage rolled normally instead.","oath":false,"save":"Fort negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 minute/level","sr":"yes (harmless)","effect":"You create a magical barrier that protects a target's vital areas. When the target is struck by a critical hit or a sneak attack, there is a 25% chance that the critical hit or sneak attack is negated and damage is instead rolled normally. This benefit does not stack with other effects that can turn critical hits or sneak attacks into normal attacks, such as the fortification armor special ability.","source":"Advanced Class Guide"},{"n":"Shield of Shards","l":1,"x":"Fractures a wielded shield into 2 or more orbiting shards (max 12) that lose the shield's AC bonus but can each be directed to attack an adjacent foe for 1d4+ damage; the shield reforms when the spell ends.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S, F (a shield)","range":"personal","target":"target: one shield you wield","duration":"1 round/level","sr":"no","effect":"This spell transforms a wielded shield into orbiting shards. The shield fractures into two shards, plus one additional shard per 2 caster levels (to a maximum of 12 shards at 20th level). While active, you lose the shield's AC bonus.\n\nOn your turn, you can direct shards to attack an adjacent opponent via a move action. Attack bonus equals your caster level plus the modifier for the ability score that determines your spell save DCs. Shards deal 1d4 points + 1 point per shard beyond the first, slashing and piercing damage, with a 19-20 threat range. They function as magic weapons for the purpose of overcoming damage reduction.\n\nSpecial materials (adamantine, etc.) allow shards to penetrate damage reduction and hardness as if they were weapons made from the same material.\n\nAt the spell's end, the shards reform into the original shield, restoring its bonus if you have a free hand. Otherwise, the shield falls at your feet.","source":"Armor Master's Handbook"},{"n":"Songbird","l":1,"x":"Depending on use, grants +3 to a concurrent Perform check, lets you activate a bardic performance without spending a daily round, or increases the save DC of a sonic-descriptor spell by 1.","oath":false,"save":"none","school":"Conjuration (good)","castingTime":"1 swift action","components":"S","range":"personal","target":"target: you","duration":"1 round","sr":"no","effect":"You conjure uplifting music from the wilds of Elysium, Heaven, or Nirvana to bolster other musical activities. The spell provides three potential benefits depending on what you do that same round: if you attempt a Perform check, the spell grants a +3 bonus to that check; if you activate bardic performance, that round does not count against your daily bardic performance rounds available; if you cast a spell with the sonic descriptor, that spell's save DC increases by 1.","source":"Planar Adventures"},{"n":"Stunning Barrier","l":1,"x":"Grants +1 deflection bonus to AC and +1 resistance bonus on saves; the first creature to hit you with a melee attack must save or be stunned for 1 round, ending the spell.","oath":false,"save":"none and Will negates (see text)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 round/level or until discharged","sr":"no and yes (see text)","effect":"You are closely surrounded by a barely visible magical field. The field provides a +1 deflection bonus to AC and a +1 resistance bonus on saves. Any creature that strikes you with a melee attack is stunned for 1 round (Will negates). Once the field has stunned an opponent, the spell is discharged.","source":"Advanced Class Guide"},{"n":"Swift Girding","l":1,"x":"Instantly and properly equips multiple willing targets in unworn suits of armor of your choosing.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M (the armor to be worn)","range":"close (25 feet + 5 feet/level)","target":"target: one willing creature/level","duration":"instantaneous","sr":"yes (harmless)","effect":"With a sweep of your hand, you select a number of targets and the same number of suits of armor. The targets of this spell are immediately clad in the armor that you choose. The subjects of the spell must be capable of wearing the chosen armor, cannot be wearing other armor, and must be able to properly fit into the chosen armor. The chosen armor must be empty and cannot be currently worn by another creature (thus you cannot move armor from one wearer to another with this spell). Creatures armored with this spell are considered to have donned the armor properly.","source":"Knights of the Inner Sea"},{"n":"Sun Metal","l":1,"x":"A weapon ignites with harmless flame that deals an extra 1d4 fire damage on hits (not multiplied on a critical), ending if submerged and unable to stack with flaming or function on frost weapons.","oath":false,"save":"Fort negates (object)","school":"Transmutation [fire]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: one melee weapon","duration":"1 round/level (see text)","sr":"yes (object)","effect":"The targeted weapon ignites with flame that doesn't harm the weapon or wielder but damages those struck by it. Upon a successful hit, the weapon deals an additional 1d4 points of fire damage. This additional damage doesn't multiply on critical hits. The effect ends immediately if submerged in water. It doesn't stack with flaming, flaming burst, or other fire damage effects. The spell won't function on weapons with frost, icy burst, or other cold damage effects.","source":"Ultimate Combat"},{"n":"Tactical Acumen","l":1,"x":"Grants an extra +1 insight bonus (scaling up to +4 with level) whenever you or allies gain a tactical bonus such as flanking, high ground, or cover.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a small piece of a map)","range":"30 ft.","target":"area: you and all allies within a 30-ft.-radius burst, centered on you","duration":"1 round/level (D)","sr":"yes (harmless)","effect":"This enchantment grants tactical mastery to you and nearby allies. Whenever the recipients gain bonuses to attack rolls or AC from battlefield positioning (flanking, higher ground, cover), they receive an additional +1 insight bonus. This bonus increases by +1 for every five caster levels above 5th possessed by the caster, reaching a maximum of +4.","source":"Ultimate Combat"},{"n":"Touch of Truthtelling","l":1,"x":"Functions like zone of truth on a touched creature, which briefly and visibly takes on the momentary appearance of a lawful outsider (archon or inevitable) while compelled.","oath":false,"save":"Will negates (inferred: functions identically to zone of truth)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 min./level (inferred: functions identically to zone of truth)","sr":"yes (inferred: functions identically to zone of truth)","effect":"This spell functions identically to the spell zone of truth, except as noted above. The target momentarily takes on the semblance of a being of perfect order, like an archon or inevitable, so that all who can see the target know it is affected by the spell. This divine guise flickers over the target for only an instant and does not allow it to pass as a member of a different race.\n\nThis spell is associated with a particular deity and is more common among followers of that deity, though followers of other deities may still cast the spell if they learn it.","source":"Inner Sea Gods"},{"n":"Tracking Mark","l":1,"x":"Lowers Survival DCs to track the target by 5 and grants a +5 bonus on Perception checks to notice it using Stealth or to recognize it in disguise.","oath":false,"save":"Will negates","school":"Evocation","castingTime":"1 standard action","components":"S, DF","range":"long (400 ft. + 40 ft./level)","target":"target: one creature","duration":"10 minutes/level (D)","sr":"yes","effect":"You gain a supernatural ability to detect tracks and other clues left behind by the target. You treat the DCs of all Survival checks made to track the target as if they were 5 lower than normal, and you gain a +5 bonus on Perception checks made to notice the target if it is using Stealth or recognize it if it is using Disguise.","source":"Inner Sea Gods"},{"n":"Unbreakable Heart","l":1,"x":"Grants +4 morale bonus on saves against mind-affecting effects rooted in negative emotion (despair, rage, fear) and suppresses an existing such effect; a charmed target also gets a new save if ordered to harm a true ally.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: 1 creature","duration":"1 round/level","sr":"yes (harmless)","effect":"The target receives a +4 morale bonus on saving throws against mind-affecting effects tied to negative emotions (such as crushing despair, rage, or fear) or those forcing harm to allies (such as confusion). If already affected by such effects, they're suppressed during the spell's duration. Positive emotion effects like good hope remain unaffected. Charmed creatures can still be controlled but gain twice the saving throw rolls when ordered to harm true allies, keeping the better result.\n\nCalm emotions counters and dispels unbreakable heart.","source":"Inner Sea World Guide"},{"n":"Veil of Heaven","l":1,"x":"Grants +2 sacred bonus to AC and saves against evil outsiders; can be dismissed as a swift action to deal 1d8 damage + 1/paladin level (Will half) to all such outsiders within 5 feet.","oath":false,"save":"Will half","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, DF","range":"personal or 5 ft.; see text","target":"target: you or all creatures within 5 ft.; see text","duration":"10 minutes/level (D)","sr":"none","effect":"You surround yourself with a veil of positive energy, making it harder for evil outsiders to harm you. For the duration of this spell, you gain a +2 sacred bonus to AC and on saves. Both of these bonuses apply only against attacks or effects created by outsiders with the evil subtype. You can dismiss this spell as a swift action to deal 1d8 points of damage + 1 point per paladin level to all such outsiders within 5 feet. A Will save halves this damage.","source":"Advanced Race Guide"},{"n":"Veil of Positive Energy","l":1,"x":"Grants +2 sacred bonus to AC and saves against undead; can be dismissed to deal damage equal to your level to all undead within 5 feet.","oath":false,"save":"Consultar manual","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, DF","range":"personal or 5 ft.; see text","target":"target: you or all creatures within 5 ft.; see text","duration":"10 minutes/level (D)","sr":"Consultar manual","effect":"The caster surrounds themselves with positive energy to hinder undead attacks. The spell grants a +2 sacred bonus to AC and a +2 sacred bonus on saves that apply exclusively against undead creatures' attacks and effects.\n\nAdditionally, the caster may dismiss the spell as a swift action to deal a number of points of positive energy damage equal to your level to all undead creatures within 5 feet of you.","source":"Advanced Player's Guide"},{"n":"Wartrain Mount","l":1,"x":"Grants a target animal the combat general purpose training, overriding its previous trained purpose and tricks until the spell ends, when they return.","oath":false,"save":"none","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 minute","components":"V, S, M (a swatch of black cloth)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one indifferent or friendly animal","duration":"1 hour/level","sr":"yes","effect":"You instill the target animal with the combat training general purpose (see Handle Animal). This supersedes the animal's previous trained purpose and any tricks it knows. When the spell ends, it reverts to its previous trained purpose and known tricks.","source":"Ultimate Magic"},{"n":"Weapons Against Evil","l":1,"x":"Causes wielded weapons to glow with pale light (illuminating 5 feet) and bypass damage reduction of 5 or lower (not DR/epic) possessed by evil creatures.","oath":false,"save":"Fort negates (harmless, object)","school":"Transmutation","castingTime":"1 standard action","components":"V, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one weapon/level, no two of which can be more than 20 ft. apart","duration":"1 round/level","sr":"yes (harmless, object)","effect":"Each affected weapon shines with pale illumination covering a 5-foot area. The weapons bypass damage reduction of evil creatures possessing DR 5 or lower, provided the damage reduction is not DR/epic.","source":"Inner Sea Gods"},{"n":"Word of Resolve","l":1,"x":"Lets an ally reroll a failed save against fear or charm with a +4 sacred bonus, but only protects against fear if you have aura of courage, or charm if you have aura of resolve.","oath":false,"save":"Will negate (harmless)","school":"Abjuration","castingTime":"1 immediate action","components":"V, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one ally","duration":"instantaneous","sr":"yes (harmless)","effect":"The caster focuses their aura on a single ally to grant them the ability to reroll a failed saving throw against charm or fear effects, adding a +4 sacred bonus to the new roll. The spell's functionality depends on the caster's class abilities: if the caster lacks the aura of courage ability, the spell provides no benefit against fear effects; if the caster lacks the aura of resolve ability, the spell provides no benefit against charm effects.","source":"Ultimate Magic"},{"n":"Abeyance","l":2,"x":"Suppresses the effects of a single curse afflicting a creature without restoring damage or drain the curse caused; does not work on curses immune to remove curse.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 minute","components":"V, S, M (a flask of holy water worth 25 gp), DF","range":"touch","target":"target: creature touched","duration":"24 hours","sr":"yes (harmless)","effect":"Abeyance suppresses the effects of a single curse on a creature. It does not restore any damage or drain that might have been caused by the curse. Abeyance cannot suppress curses that cannot be removed by remove curse, but it can suppress curses such as lycanthropy that require remove curse along with additional measures. An individual curse can be suppressed only once by abeyance, even if cast by a different caster.\n\nAbeyance does not allow a creature to divest itself of cursed objects, though it can suppress a curse contracted from an object.","source":"Pathfinder #82: Secrets of the Sphinx"},{"n":"Angelic Aspect, Lesser","l":2,"x":"Grants low-light vision, acid resistance 5, cold resistance 5, and the benefits of protection from evil.","oath":false,"save":"none","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 minute/level (D)","sr":"no","effect":"You gain low-light vision, resistance to acid 5, resistance to cold 5, and the benefits of protection from evil.","source":"Champions of Purity"},{"n":"Aquatic Cavalry","l":2,"x":"Summons 1 hippocampus (plus 1 per 3 caster levels, max 6) to serve as combat-trained mounts that avoid combat unless attacked.","oath":false,"save":"none","school":"Conjuration (summoning)","castingTime":"1 round","components":"V, S, DF","range":"medium (100 ft. + 10 ft./level)","target":"effect: 1 hippocampus plus 1 hippocampus/3 caster levels","duration":"1 hour/level (D)","sr":"no","effect":"You summon a school of hippocampi (one plus one per 3 caster levels, to a maximum of six at 15th level) to serve as combat-trained mounts. The hippocampi avoid combat if possible but defend themselves if attacked. If any hippocampus attacks, the remaining duration of the spell changes from 1 hour per level to 1 round per level (so if a full 4 hours remained, the hippocampi last for only 4 more rounds).","source":"Ultimate Wilderness"},{"n":"Arrow of Law","l":2,"x":"Ranged touch attack with an arrow of order dealing 1d8/2 caster levels (max 5d8) to chaotic creatures, or 1d6/level (max 10d6) plus 1-round daze to chaotic outsiders; half damage to neutral creatures, none to lawful.","oath":false,"save":"Will partial (see text)","school":"Evocation [lawful]","castingTime":"1 standard action","components":"V, S, DF (a holy symbol)","range":"close (25 ft. + 5 ft./2 levels)","target":"effect: arrow-shaped projectile of lawful energy","duration":"instantaneous (1 round); see text","sr":"yes","effect":"You fire a shimmering arrow of pure order from your holy symbol at any one target in range as a ranged touch attack. A chaotic creature struck by an arrow of law takes 1d8 points of damage per two caster levels (maximum 5d8). A chaotic outsider instead takes 1d6 points of damage per caster level (maximum 10d6) and is dazed for 1 round. A successful Will save reduces the damage to half and negates the daze effect. This spell deals only half damage to creatures that are neither chaotic nor lawful, and they are not dazed. The arrow has no effect on lawful creatures.","source":"Ultimate Magic"},{"n":"Aura of Greater Courage","l":2,"x":"Makes all allies within your aura of courage immune to fear (magical or otherwise); requires you to possess the aura of courage class feature.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [emotion]","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"area: 10-ft.-radius emanation centered on you","duration":"10 minutes/level","sr":"yes (harmless)","effect":"When cast, this spell enhances a paladin's courage aura. Throughout its duration, all allies within the aura become immune to fear effects (magical or otherwise). The spell only functions if the caster possesses the aura of courage class feature; otherwise it has no effect.","source":"Advanced Player's Guide"},{"n":"Bestow Grace","l":2,"x":"Grants a good creature a sacred bonus on all saving throws equal to its Charisma modifier (if positive) for 1 minute per caster level.","oath":false,"save":"Will (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: one good creature touched","duration":"1 minute/level","sr":"yes (harmless)","effect":"The spell allows a caster to share divine grace with another good creature through touch. The recipient gains a sacred bonus to all saving throws equal to their Charisma modifier (minimum zero). This benefit persists for the spell's duration.","source":"Advanced Player's Guide"},{"n":"Bestow Weapon Proficiency","l":2,"x":"Grants the target proficiency with one weapon (including exotic weapons) for 1 minute per caster level, as long as they're holding it.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (pieces of shaved metal)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 minute/level","sr":"yes (harmless)","effect":"You bestow the subject with the ability to use a single type of weapon he is not proficient in as if he were proficient with that weapon. The weapon can be of any type, including an exotic weapon, but the subject of the spell must be holding the weapon.","source":"Ultimate Combat"},{"n":"Blade Tutor's Spirit","l":2,"x":"Conjures a spirit that reduces attack penalties from voluntary defensive actions or feats like Power Attack by 1 (plus 1 per 5 caster levels).","oath":false,"save":"none","school":"Conjuration (creation)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 minute/level","sr":"no","effect":"You summon an insubstantial spirit of force that resembles a cloudy vapor hovering around your fists or any melee weapons you wield. The spirit compensates for your defensive or reckless melee attacks, nudging your weapons in the proper direction.\n\nWhen you voluntarily use one or more actions or feats that apply penalties to attack rolls with your melee weapons (such as a charge, fighting defensively, or using the Power Attack feat), the spirit reduces the total penalty on affected attacks by 1 (to a minimum penalty of 0). The penalty is reduced by an additional 1 for every 5 caster levels you possess (to a minimum penalty of 0). Only penalties incurred by voluntary use of feats or maneuvers are reduced by this spell.\n\nThe spirit cannot be attacked or harmed by physical attacks, but disintegrate, dispel magic, a rod of cancellation, or a sphere of annihilation can affect it. A protective spirit's AC against touch attacks equals 10 plus your Dexterity modifier.","source":"Melee Tactics Toolbox"},{"n":"Blessing of Courage and Life","l":2,"x":"Grants +2 morale bonus on saves against fear and death effects; can be ended as a swift action to heal 1d8 damage +1/caster level (max +10).","oath":false,"save":"Will negates (harmless)","school":"Conjuration (healing) [emotion]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one living creature","duration":"1 minute/level (see below)","sr":"yes (harmless)","effect":"With this prayer you provide long-lasting succor to a wounded creature. For as long as the effect lasts, the target receives a +2 morale bonus on saving throws against fear and death effects. At any time while the spell is in effect, the target can choose to end the spell as a swift action for a burst of healing energy. The target loses the saving throw bonus, but is healed of 1d8 points of damage +1 point per caster level (maximum +10).","source":"Advanced Player's Guide"},{"n":"Blessings of Luck and Resolve","l":2,"x":"Grants +2 morale bonus on saves against fear (or immunity if already fearless); on a failed fear save, lets you reroll once as an immediate action with a +4 morale bonus, accepting the new result.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: one living creature touched","duration":"1 minute/level (D), special see below","sr":"yes (harmless)","effect":"A favored blessing of halfling clerics, this spell grants its target a +2 morale bonus on saving throws against fear effects. If the target has the fearless racial trait, it is immune to fear instead. If the target fails a saving throw against fear, it can end the spell as an immediate action to reroll the save with a +4 morale bonus, and must take the new result, even if it is worse.","source":"Advanced Race Guide"},{"n":"Blinding Ray","l":2,"x":"Fires 1 (plus more at higher levels, max 3) ray(s) of sunlight as ranged touch attacks that blind the target for 1 round (or 1d4 rounds plus 1d4 damage/2 levels if light-vulnerable).","oath":false,"save":"Fort negates","school":"Evocation [good, light]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"effect: one or more rays of light","duration":"instantaneous (see text)","sr":"yes","effect":"You blast enemies with blinding rays of sunlight. You may fire one ray, plus one additional ray for every four levels beyond 3rd (maximum three rays at 11th level). Each ray requires a ranged touch attack to hit. If a ray hits, it explodes into powerful motes of light, and the target must save or be blinded for 1 round. If the target has light blindness, light sensitivity, or is otherwise vulnerable to bright light, it instead must save or be blinded for 1d4 rounds and take 1d4 points of damage per two caster levels (maximum 5d4). Any creature blinded by a ray sheds light as a sunrod for the duration of its blindness. The rays may be fired at the same or different targets, but all rays must be aimed at targets within 30 feet of each other and fired simultaneously.","source":"Advanced Race Guide"},{"n":"Bullet Ward","l":2,"x":"Summons hovering adamantine bullets (half caster level, max 4) that can be expended as an immediate action to grant +10 AC against one firearm attack, destroying the bullet regardless of outcome.","oath":false,"save":"none","school":"Abjuration","castingTime":"1 standard action","components":"V, S, F (one to four adamantine bullets, each worth 61 gp)","range":"personal","target":"target: you","duration":"10 minutes/level or until discharged","sr":"no","effect":"The caster tosses adamantine bullets into the air where they hover protectively. The quantity equals half the caster level, maximum 4 bullets. When a firearm attack targets the caster, they may use an immediate action to designate one hovering bullet to block the attack, granting +10 AC against that specific attack. Using a bullet destroys it regardless of whether the attack connects. The spell ends once all bullets are destroyed or removed. Each bullet has AC 24, 20 hit points, and hardness 20.","source":"Advanced Class Guide"},{"n":"Carry Companion","l":2,"x":"Transforms a willing animal or magical beast into an inert, petrification-like stone figurine that can be restored to normal form by touching it and speaking a command word.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M (a pinch of sand or limestone dust)","range":"touch","target":"target: one willing creature touched","duration":"permanent; see text","sr":"yes (harmless)","effect":"You touch an animal or magical beast that has a helpful attitude toward you, instantly transforming the creature into a miniature figurine of stone, small enough to fit into the palm of your hand. Creatures with an attitude of less than helpful will not tolerate this spell, and it automatically fails to work on them.\n\nAn intelligent animal or magical beast must be a willing subject in order for this spell to take effect. Any items that the creature wears (such as a harness or saddle) or carries (such as those stowed in saddlebags) are transformed along with the creature.\n\nWhile miniaturized, the creature is under an effect similar to that of a flesh to stone spell: It is mindless and inert, and does not seem alive when viewed with spells like deathwatch. However, you may return the creature to its normal form at any time simply by placing the figurine on the ground, touching it, and uttering a word of command. Otherwise, the creature remains in miniature form unless the spell is broken, such as by dispel magic or stronger magic. Unlike a flesh to stone spell, a creature affected by carry companion is unaffected by stone to flesh. If the miniature figurine is broken or damaged, the creature (if returned to its original state) has similar damage or deformities.","source":"Knights of the Inner Sea"},{"n":"Corruption Resistance","l":2,"x":"Grants the touched creature and its gear damage reduction of 5 (10 at CL 7, 15 at CL 11) against magical effects of a chosen alignment (chaos, evil, good, or law).","oath":false,"save":"Fortitude negates (harmless)","school":"Abjuration [chaotic, evil, good, or lawful]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"10 minutes/level","sr":"yes (harmless)","effect":"The caster grants the touched creature limited protection from magical effects that inflict damage based on the target creature's alignment, such as holy smite, order's wrath, a paladin's smite evil attack, or an unholy weapon. The caster chooses one alignment type: chaos, evil, good, or law. The subject takes 5 less points of damage from effects that specifically harm creatures of that alignment. The value of the protection increases to 10 points at 7th level and 15 points at 11th level. The spell protects the recipient's equipment as well.\n\nCorruption resistance protects against spells, spell-like abilities, and special abilities, not physical attacks. Corruption resistance only protects against damage. The subject can still suffer side effects from such attacks. When you use this spell to protect an alignment, it gains the descriptor of that alignment.","source":"Advanced Player's Guide"},{"n":"Delay Disease","l":2,"x":"Grants 1 day of immunity to new diseases, or suspends an existing disease if the caster beats its DC with a caster level check; doesn't heal existing disease damage.","oath":false,"save":"Fort negates (harmless)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 day","sr":"yes (harmless)","effect":"The target becomes temporarily immune to disease. Any disease encountered during the spell's duration does not affect the target until the spell expires. If the target is currently infected with a disease, the caster must make a caster level check against the disease's DC to suspend it for the spell's duration; otherwise, that disease affects the target normally. Delay disease does not cure any damage a disease may have already done.","source":"Advanced Race Guide"},{"n":"Divine Arrow","l":2,"x":"Imbues a projectile with holy energy dealing bonus damage to undead equal to your lay on hands die (not multiplied on a crit); requires an available lay on hands use without expending it.","oath":false,"save":"none","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: one projectile","duration":"1 round/level or until discharged","sr":"no","effect":"You imbue a projectile, such as an arrow or shuriken, with holy energy so that it deals extra damage to undead equal to that dealt by your lay on hands feature. This extra damage is not multiplied on a critical hit. Although this spell does not expend a daily use of your lay on hands class feature, you must have at least one daily use available to cast this spell. If the projectile hits a target or is destroyed before the duration ends, the spell is discharged.","source":"Ultimate Combat"},{"n":"Divine Illumination","l":2,"x":"Creates a 10-ft spread of light that illuminates undead, imposing a -20 Stealth penalty and negating invisibility-based location concealment; first exposure forces a Will save or the undead loses channel resistance and takes -2 on saves vs. positive energy.","oath":false,"save":"Will partial","school":"Conjuration [good, light]","castingTime":"1 minute","components":"V, S, DF","range":"medium (100 ft. + 5 ft./level)","target":"target: all undead in a 10-foot-radius spread","duration":"1 minute/level","sr":"yes","effect":"The caster generates shafts of blue light that illuminate all undead creatures within the area. Affected undead suffer a -20 penalty on Stealth checks. Invisible undead remain unseen but the light reveals their exact squares (retaining the 50% miss chance from invisibility). The spell increases light levels by one step in a 5-foot radius around each affected undead, persisting as long as they remain within the spell's range.\n\nAffected undead must make a Will saving throw when first illuminated. Those who fail lose all channel resistance benefits and incur a -2 penalty on all saving throws against positive energy effects.","source":"Inner Sea Magic"},{"n":"Effortless Armor","l":2,"x":"Removes speed reduction from worn armor and reduces its armor check penalty by 1 (plus 1 per 5 caster levels, max 5).","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 minute/level","sr":"no","effect":"The spell causes armor worn by the caster to no longer reduce movement speed. Additionally, it reduces the armor's check penalty by an amount equal to 1 plus an additional 1 for every five caster levels, with a maximum reduction of 5.","source":"Ultimate Combat"},{"n":"Endure Elements, Communal","l":2,"x":"Functions like endure elements, except the duration is divided in 1-hour intervals among the creatures touched.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creatures touched","duration":"24 hours","sr":"yes (harmless)","effect":"This spell functions like endure elements, except you divide the duration in 1-hour increments among the creatures touched.","source":"Core Rulebook"},{"n":"Fairness","l":2,"x":"Compels affected humanoids to conduct trades fairly according to their knowledge of value and prevents them from cheating in exchanges.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one humanoid creature per level","duration":"1 minute/level","sr":"yes","effect":"Affected humanoid creatures must engage in fair trading practices according to their knowledge. They cannot participate in exchanges they know would unfairly benefit one party, and must actively prevent such inequitable transactions from occurring while the spell remains active.\n\nThis spell is associated with a particular deity. The caster must worship the associated deity. The symbol of the associated deity appears above the heads of those affected by this spell, making those affected and unaffected by the spell immediately apparent.","source":"Inner Sea Gods"},{"n":"Fire of Entanglement","l":2,"x":"Wraps the target in flames that leave it entangled for the duration, or unable to move at all if it starts its turn adjacent to the caster; a successful save limits the effect to 1 round.","oath":false,"save":"Reflex partial","school":"Evocation","castingTime":"1 swift action","components":"V, S","range":"special; see text","target":"target: one creature","duration":"1 round/level","sr":"yes","effect":"The next creature you attack using your smite evil class ability is wreathed in flames that impede its movement. Until the end of the spell's duration, the target is entangled. If the target starts its turn in a square adjacent to you, it is considered to be entangled to an immobile object (you) and cannot move. A target that saves against this spell is affected for only 1 round.","source":"Advanced Player's Guide"},{"n":"Holy Javelin","l":2,"x":"Conjures a javelin of holy energy that deals 1d6 damage to an evil target on a ranged touch hit (dissipating harmlessly against other alignments), then continues dealing 1d6/round while lodged, glowing to reveal the target's location and imposing -2 on attacks/skill checks.","oath":false,"save":"none","school":"Conjuration (creation) [good]","castingTime":"1 standard action","components":"V, S, DF","range":"medium (100 ft. + 10 ft./level)","target":"effect: javelin of divine energy","duration":"1 round + 1 round/4 levels","sr":"yes","effect":"You conjure a shimmering javelin of holy energy to hurl as a ranged touch attack. The javelin inflicts 1d6 damage to evil creatures; it harmlessly dissipates against all other alignments. Each round a creature begins while impaled, it sustains an additional 1d6 damage. For every four caster levels, the javelin persists an extra round (maximum 5 rounds at 18th level). An impaled creature suffers -2 penalties on attack rolls and skill checks.\n\nAs a move action, the impaled creature or an adjacent ally may attempt a DC 12 Strength check to extract the javelin, causing immediate disappearance. The javelin glows like a torch, revealing the impaled creature's location even when invisible. Darkness spells suppress this glow regardless of spell level, as it stems from the conjured object rather than magical illumination.","source":"Horror Adventures"},{"n":"Holy Shield","l":2,"x":"Lets you project your shield's AC bonus onto an ally within 30 feet as a swift action (losing it yourself), redirectable each turn or reverting if the target moves out of range.","oath":false,"save":"none","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"10 minutes/level","sr":"no","effect":"You gain the ability to magically project your shield's defense to protect another creature at a distance. As a swift action, you designate one target within 30 feet. That target gains your shield's shield bonus and enhancement bonus to Armor Class until your next turn; you gain no benefit from the shield's shield bonus or enhancement bonus while using this spell and cannot use any of the shield's other properties or abilities (such as magical abilities, making a shield bash, or providing cover with a tower shield). As a swift action, you may move the protection to another target (including yourself); if you move the protection to yourself, you may use any of the shield's properties or abilities as normal. If the shielded creature exceeds the 30-foot range, your shield's protection automatically reverts to you. Any circumstance that would make you lose your shield bonus (such as an enemy breaking the shield, you dropping the shield, or you becoming helpless or unconscious) means the protected creature loses the shield's benefit.","source":"Ultimate Magic"},{"n":"Instant Armor","l":2,"x":"Creates a suit of force armor (type scaling with caster level, up to full plate) replacing worn garments, or a lesser armor type with a magical enhancement bonus instead.","oath":false,"save":"none","school":"Conjuration (creation) [force]","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 minute/level (D)","sr":"no","effect":"You instantly wrap your body in a suit of armor made from opaque force. At your option, the armor can be decorated with your religion's holy symbol in a prominent place, such as upon the breastplate or helm. While it exists, this armor replaces any garments or other sort of armor worn, magical as well as mundane. You lose access to, and all benefits from, armor replaced by this spell until the spell ends and the instant armor disappears.\n\nInstant armor acts in all ways as armor typical of its type (armor bonus, maximum Dexterity bonus, arcane spell failure chance, and so on). Since instant armor is made of force, incorporeal creatures can't bypass it the way they do normal armor. The sort of armor you can create with this spell depends on your caster level.\n\nAt caster level 5th or lower: chainmail; 6th-8th: banded mail; 9th-11th: half-plate; 12th or higher: full plate.\n\nIf you choose lesser armor than your level allows, you gain a +1 magical enhancement bonus to the armor for every armor type passed over (e.g., +3 chainmail, +2 banded mail, or +1 half-plate if capable of full plate). These bonuses cannot be replaced with armor special properties.","source":"Advanced Player's Guide"},{"n":"Ironskin","l":2,"x":"Hardens your skin for a +4 enhancement bonus to natural armor (plus 1 per 4 caster levels above 4th), and can be dismissed to negate a confirmed critical hit or sneak attack from a physical weapon.","oath":false,"save":"none","school":"Transmutation [earth]","castingTime":"1 standard action","components":"V, S, DF/M (a pinch of forge soot)","range":"personal","target":"target: you","duration":"1 minute/level (D; see text)","sr":"no","effect":"Your skin hardens and takes on the color and texture of rough iron. You gain a +4 enhancement bonus to your existing natural armor bonus (if you do not have a natural armor bonus, you are considered to have an effective natural armor bonus of +0).\n\nThis enhancement bonus increases by 1 for every 4 caster levels above 4th, to a maximum of +7 at 15th level.\n\nWhile you're under the effects of this spell, if an opponent confirms a critical hit or sneak attack against you with a physical weapon (not a spell or magical effect), you can dismiss this spell to negate the critical hit or sneak attack and treat it as a normal hit. Dismissing the spell in this way is not an action, but you must be conscious and aware of the attack to do so.","source":"Monster Codex"},{"n":"Life Shield","l":2,"x":"Surrounds you with a positive energy field that deals half the damage back to any undead that hits you in melee, until it has dealt 5 points per caster level (max 50) or the duration ends.","oath":false,"save":"none","school":"Conjuration (healing)","castingTime":"1 standard action","components":"S, DF","range":"personal","target":"target: you","duration":"1 minute/level or until discharged","sr":"no","effect":"The caster creates a protective aura of positive energy. When undead creatures strike the caster in melee combat, they sustain positive energy damage equal to half the harm they inflicted. This damage calculation occurs after the caster's damage reduction and other defensive measures have been applied. The spell persists until it has dealt a cumulative total of 5 damage per caster level (capped at 50 points), at which point the effect ends.","source":"Undead Slayer's Handbook"},{"n":"Light Lance","l":2,"x":"Conjures a +1 holy lance of radiance usable as a weapon for the duration, or as a bright 90-ft beacon visible up to 2 additional miles at night.","oath":false,"save":"none","school":"Evocation [good, light]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"effect: lance of light","duration":"1 round + 1 round/level (D)","sr":"no","effect":"You conjure a radiant beam functioning as a +1 holy lance sized appropriately for you. The caster must have one hand free during casting and cannot transfer or drop the weapon without terminating the spell prematurely.\n\nAs a standard action while wielding it, you may forgo attacking to raise the lance skyward, producing bright illumination extending 90 feet outward. Continuing this action for multiple rounds generates an ascending beam of light. During nighttime conditions without obstruction, visibility extends an additional 2 miles per round of sustained positioning.","source":"Advanced Player's Guide"},{"n":"Litany of Defense","l":2,"x":"Doubles any enhancement bonus from your armor and grants immunity to fear; you cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"no","school":"Transmutation","castingTime":"1 swift action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 round","sr":"yes","effect":"Invoking this litany strengthens your defenses. Any enhancement bonus your armor has is doubled and you are immune to fear. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Litany of Eloquence","l":2,"x":"Fascinates the target with a compelling diatribe, causing it to do nothing but listen (subject to normal fascination rules); it cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"no","school":"Enchantment (charm) [language-dependent, mind-affecting]","castingTime":"1 swift action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round","sr":"yes","effect":"Your litany is a fascinating diatribe of grace, causing your target to do nothing but listen. The target is fascinated. As usual, obvious danger prevents fascination and potential danger grants a save. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Litany of Entanglement","l":2,"x":"Conjures chains of energy that entangle the target (no effect on flying or airborne creatures); it cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"Will negates","school":"Conjuration (calling) [language-dependent]","castingTime":"1 swift action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round","sr":"yes","effect":"Your litany conjures chains of energy that lash upward from the ground and hamper the target's movement. The target is entangled. This spell has no effect on flying creatures, or creatures not standing upon solid ground. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Litany of Righteousness","l":2,"x":"Doubles damage dealt to an evil target by creatures with a good aura, and dazzles evil-subtype targets for 1d4 rounds on a hit.","oath":false,"save":"Will negates","school":"Evocation [good, language-dependent]","castingTime":"1 swift action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round","sr":"yes","effect":"This invocation makes evil targets more vulnerable to good-aligned attackers. An evil target takes double damage from creatures with a good aura. If the target also has the evil subtype, it becomes dazzled for 1d4 rounds when struck by good-aligned attacks. The spell has no effect on non-evil creatures. While under this spell's influence, the target cannot be affected by other spells with 'litany' in their titles.","source":"Ultimate Combat"},{"n":"Litany of Warding","l":2,"x":"Grants two bonus attacks of opportunity this round plus a +2 sacred bonus to AC against them; cannot be stacked with other 'litany' spells.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 swift action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 round","sr":"no","effect":"When cast, this litany enhances your combat awareness. You can make two additional attacks of opportunity this round. Furthermore, you gain a +2 sacred bonus to AC against attacks of opportunity. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Magic Siege Engine","l":2,"x":"Grants +1 to attack and damage rolls for an indirect-fire siege engine, or functions as magic weapon on a direct-fire siege engine, for 1 minute per caster level.","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: one siege engine touched","duration":"1 minute/level","sr":"yes (harmless, object)","effect":"The spell enables an indirect-fire siege weapon to strike targets with improved precision and destructive capability. The affected siege weapon gains a +1 enhancement bonus on targeting rolls and damage rolls. When applied to direct-fire siege weapons instead, the spell functions identically to the magic weapon spell.","source":"Ultimate Combat"},{"n":"Martyr's Bargain","l":2,"x":"Cast as an immediate action to delay incoming spell damage by a number of rounds equal to your caster level, at which point it hits maximized as though affected by Maximize Spell; only one instance can affect you at a time.","oath":false,"save":"none","school":"Transmutation (good)","castingTime":"1 immediate action","components":"V","range":"personal","target":"target: you","duration":"1 round/level","sr":"no","effect":"This spell allows you to cast it as an immediate action when subjected to damaging spell or spell-like ability effects. After rolls are made but before damage is determined, the damage becomes delayed for a number of rounds equal to your caster level. When the delay expires (or if dispelled), the damage takes effect as maximized. Already-maximized spells gain no additional benefit. Nothing can prevent this delayed damage. Only one instance of this spell can affect you at a time; casting it again ends the previous effect and triggers that delayed damage immediately.","source":"Inner Sea Magic"},{"n":"Paladin's Sacrifice","l":2,"x":"Lets you take on the damage and effects of an attack or failed save that would otherwise hit a nearby creature, as if you had been the target instead.","oath":false,"save":"Fortitude negates (harmless)","school":"Abjuration","castingTime":"1 immediate action","components":"V, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"instantaneous","sr":"yes (harmless)","effect":"The caster opens a divine conduit to redirect incoming harm. When a nearby ally is hit by an attack or fails a saving throw, the paladin can activate this spell to transfer the damage and adverse effects to themselves instead. The paladin suffers the full consequences as if they were the original target, including all damage and effects. Their own resistances and immunities apply normally, but they cannot otherwise mitigate the damage.\n\nIf the original effect would have also affected the paladin, they experience the consequences twice, once for themselves and once for the spared ally.","source":"Advanced Player's Guide"},{"n":"Protection from Chaos, Communal","l":2,"x":"Functions like protection from chaos, except the duration is divided in 1-minute intervals among the creatures touched.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [lawful]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"target: creatures touched","duration":"1 min./level (D)","sr":"no","effect":"This spell functions like protection from chaos, except you divide the duration in 1-minute intervals among the creatures touched.","source":"Core Rulebook"},{"n":"Protection from Evil, Communal","l":2,"x":"Functions like protection from evil, except the duration is divided in 1-minute intervals among the creatures touched.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"target: creatures touched","duration":"1 min./level (D)","sr":"no","effect":"This spell functions like protection from evil, except you divide the duration in 1-minute intervals among the creatures touched.","source":"Core Rulebook"},{"n":"Protection From Outsiders","l":2,"x":"Grants +4 deflection bonus to AC and +4 resistance on saves against a chosen outsider subtype, a new save with +4 morale bonus against that subtype's mental control, and blocks bodily contact from summoned creatures of that subtype.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [see text]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 minute/level (D)","sr":"no; see text","effect":"This spell wards creatures from attacks by outsiders with specific racial subtypes, mental control from those creatures, and summoned creatures of that type. Only racial subtypes (angel, azata, demon, oni, psychopomp, protean, and similar) qualify; alignment or general subtypes cannot be selected.\n\nThe spell creates a magical barrier providing three effects: First, recipients gain +4 deflection bonus to AC and a +4 resistance bonus on saves against chosen subtypes. Second, subjects receive another saving throw against possession or mental control effects from selected outsiders, gaining a +4 morale bonus. Third, the spell prevents bodily contact by summoned creatures of the chosen subtype, functioning like protection from evil.\n\nThe spell's descriptor changes based on the selected outsider race, gaining alignment descriptors opposite to that race's alignment.","source":"Demon Hunter's Handbook"},{"n":"Righteous Vigor","l":2,"x":"Each successful melee hit grants a cumulative +1 morale bonus to attack rolls (max +4) and 1d8 temporary hit points (max 20); a miss resets the attack bonus but keeps accrued temporary hp.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 round/level","sr":"yes (harmless)","effect":"This divine enchantment infuses the recipient with furious energy that rewards successive hits. Each time the subject successfully strikes an opponent with a successful melee attack, the subject gains a cumulative +1 morale bonus on attack rolls (maximum +4 bonus) and gains 1d8 temporary hit points (to a maximum of 20 temporary hit points). If an attack misses, the attack bonus resets to +0 but any accumulated temporary hit points remain. The temporary hit points disappear at the end of the spell's duration.","source":"Advanced Player's Guide"},{"n":"Righteous Blood","l":2,"x":"When an evil creature damages the good-aligned target with a slashing or piercing melee weapon, it takes 1d6 divine damage (2d6 if the target has the good subtype or aura).","oath":false,"save":"Will negates (harmless)","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: one creature of good alignment","duration":"10 minutes/level (D)","sr":"yes (harmless)","effect":"The target's innate goodness infuses its body with holy energy. This sacred power doesn't directly enhance the caster, but harms evil manifestations. When attackers damage the target using slashing or piercing melee weapons, they're sprayed by the target's sanctified blood. Attackers with the evil subtype take 1d6 divine damage per successful hit. If the target possesses the good subtype or an ability granting a good aura (such as paladins or certain clerics), the blood instead deals 2d6 damage.\n\nCreatures lacking the evil subtype or wielding reach weapons avoid this damage effect.","source":"Demon Hunter's Handbook"},{"n":"Sacred Bond","l":2,"x":"Lets you and a touched creature deliver touch-range conjuration (healing) spells to each other at close range while both wear a pair of golden bracelets; removing a bracelet ends the spell.","oath":false,"save":"Will negates (harmless)","school":"Conjuration (healing)","castingTime":"1 round","components":"V, S, F (a pair of golden bracelets worth 100 gp each worn by both you and the target)","range":"touch; see text","target":"target: creature touched","duration":"10 minutes/level (D)","sr":"yes (harmless)","effect":"To use this spell, you first touch the intended recipient, creating a sympathetic field of healing energies between you. Once the spell has been cast, you and the target may cast conjuration (healing) spells with a range of touch upon each other so long as you are within close range (25 ft. + 5 ft./2 levels). Should either you or the target remove your bracelet, the spell immediately ends.","source":"Advanced Player's Guide"},{"n":"Sacred Space","l":2,"x":"Sanctifies an area, adding +2 to DCs of good spells/channeled energy against evil outsiders there, imposing -1 on evil outsiders' attacks/damage/saves, and blocking their summoning into the area.","oath":false,"save":"none","school":"Evocation [good]","castingTime":"1 standard action","components":"V, S, M (a vial of ambrosia)","range":"close (25 ft. + 5 ft./2 levels)","target":"area: 20-ft.-radius emanation","duration":"2 hours/level","sr":"no","effect":"This evocation sanctifies an area with heavenly power. The DC to resist spells or spell-like abilities with the good descriptor or channeled energy that damages evil outsiders increases by +2. In addition, evil outsiders take a -1 penalty on attack rolls, damage rolls, and saving throws, and they cannot be called or summoned into a sacred space. If the sacred space contains an altar, shrine, or other permanent fixture dedicated to your deity, pantheon, or good-aligned higher power, the modifiers given above are doubled. You cannot cast sacred space in an area with a permanent fixture dedicated to a deity other than yours.","source":"Advanced Race Guide"},{"n":"Saddle Surge","l":2,"x":"Grants you and your mount a +1 competence bonus on Ride checks per 5 feet moved that round, and a +1 morale bonus on weapon/natural attack damage for one round, both capped at your caster level.","oath":false,"save":"Consultar manual","school":"Transmutation","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"target: you and your mount","duration":"1 round/level (D); see text","sr":"Consultar manual","effect":"The spell grants bonuses based on mount movement distance. For every 5 feet traveled per round, the caster gains a +1 competence bonus on Ride checks and both caster and mount gain a +1 morale bonus on damage rolls with weapons or natural attacks for one round. A mount traveling 40 feet grants a +8 bonus to both, capped at the caster's level. The caster must remain mounted to benefit; dismounting or separation immediately ends the spell.","source":"Advanced Player's Guide"},{"n":"Sea Steed","l":2,"x":"Grants a mounted creature the aquatic subtype, the amphibious quality, and a swim speed equal to its base speed, at the cost of 10 feet of ground speed (minimum 10 ft).","oath":false,"save":"Will negates (harmless)","school":"Transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: a creature you are mounted upon","duration":"10 minutes/level (D)","sr":"yes (harmless)","effect":"The target adapts to life in the water, gaining piscine scales that cover its body and growing fins in place of feet. It gains the aquatic subtype, the amphibious quality, and a swim speed equal to its base speed before it came under the effect of this spell. While under the effects of this spell, the target's base speed is reduced by 10 feet (minimum 10 feet).","source":"Ultimate Wilderness"},{"n":"Sense Madness","l":2,"x":"Detects whether nearby creatures suffer from madness, addiction, sanity damage, or magical compulsion, revealing specifics and aiding dispelling with continued concentration.","oath":false,"save":"none","school":"Divination","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: creatures in range (see text)","duration":"concentration, up to 1 round/level (D)","sr":"no","effect":"The caster detects mental disturbance within range, focusing on one creature per round. Detection of madness, addiction, sanity damage meeting the sanity edge threshold, or detectable magical compulsions occurs on the first concentration round.\n\nConcentrating an additional round reveals sanity damage status and allows a Sense Motive check (DC: 10 + target's madness/addiction save DC) to identify the exact disturbance nature. The caster may also attempt Spellcraft checks (DC: 11 + compulsion caster level) to identify specific compulsion spells, with a +4 bonus for confusion, insanity, or related madness effects.\n\nSuccessfully identifying such effects grants a +1 circumstance bonus on subsequent caster level checks within one minute for countering, dispelling, or removing that specific effect. After attempting identification checks against a creature, no further identification attempts against that same creature are possible.","source":"Horror Adventures"},{"n":"Stave Off Corruption","l":2,"x":"Grants a +2 circumstance bonus on saves against the advancement of an existing corruption; doesn't stack with itself or with morale/profane/sacred bonuses.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, M (see text)","range":"touch","target":"target: one creature","duration":"1 day/2 caster levels","sr":"yes (harmless)","effect":"You ward the target to slow the advancement of its corruption. The target receives a +2 circumstance bonus on saving throws against the advancement of its corruption, as described in the catalyst section of each corruption. Multiple applications of this spell do not stack, nor does the bonus stack with morale, profane, or sacred bonuses on saving throws against the advancement of the target's corruption.\n\nThe material components vary by corruption type. Examples include garlic for vampirism and wolfsbane for lycanthropy, with the GM determining appropriate components costing at least 25 gp.","source":"Horror Adventures"},{"n":"Shield Companion","l":1,"x":"Functions as shield other, but affects only the caster's animal companion, familiar, or fiendish servant.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, F (a pair of platinum rings worth 50 gp each, one worn by you, the other by the subject)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: your animal companion, familiar, or fiendish servant","duration":"1 hour/level (D)","sr":"yes (harmless)","effect":"This spell functions as shield other, but affects only the caster's animal companion, familiar, or fiendish servant. Spellcasters from classes that do not normally gain an animal companion, familiar, or fiendish servant but who gain one through an alternate class feature, archetype, or prestige class can prepare and cast this spell as a 1st-level spell if they are capable of casting spells.","source":"Animal Archive"},{"n":"Soothing Word","l":2,"x":"Reduces the severity of one qualifying condition by a step (e.g. nauseated to sickened, stunned to dazed, paralyzed to staggered) without shortening its duration.","oath":false,"save":"Will negates (harmless)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: 1 creature","duration":"instantaneous","sr":"yes (harmless)","effect":"This spell reduces the severity of several debilitating conditions by one step. Nauseated creatures become sickened instead. Stunned targets shift to dazed status. Exhaustion reduces to fatigue. Frightened conditions lessen to shaken. Paralyzed victims become staggered. The original duration remains unchanged, only the condition's intensity decreases. This spell has no effect on conditions not listed above.","source":"GameMastery Condition Cards"},{"n":"Spiritual Squire","l":2,"x":"Creates an indestructible-to-physical-attacks force construct that can fetch/carry items (up to 10 lb/caster level), aid another using your BAB + Wisdom modifier, or help allies don armor faster.","oath":false,"save":"none","school":"Evocation [force]","castingTime":"1 standard action","components":"V, S, DF","range":"medium (100 ft. + 10 ft./level)","target":"effect: one spiritual squire","duration":"1 minute/level (D)","sr":"no","effect":"This spell summons an ally composed of pure force appearing as a servant of your deity or ancestor. The spiritual squire occupies a 5-foot square, allowing allies to move through it. Though it appears armed and armored, it cannot attack or threaten spaces.\n\nEach turn, the spiritual squire can perform one action: retrieve a stowed item, carry objects up to 10 pounds per caster level, hand you an object, perform aid another for you or allies, or help someone don armor in half the normal time. When using aid another in combat, its attack bonus equals your base attack bonus plus Wisdom modifier.\n\nAs a swift action each round after the first, you can order movement at 30 feet per round. Being force-based, it resists physical damage but falls to disintegrate, dispel magic, rod of cancellation, or sphere of annihilation. Touch AC is 10.","source":"Armor Master's Handbook"},{"n":"Suppress Charms and Compulsions","l":2,"x":"Grants +4 morale bonus on saves against charm/compulsion effects for 10 minutes, or lets you actively suppress an existing charm/compulsion (and block new ones) while concentrating, up to 1 round per caster level.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature plus one additional creature per 4 levels, no two of which can be more than 30 ft. apart","duration":"10 minutes or concentration (up to 1 round/level); see text","sr":"yes (harmless)","effect":"This spell fortifies the subject's willpower and self-confidence. When casting, you select one of two effects.\n\nSaving Throw Bonus: Grant affected creatures a +4 morale bonus on saving throws against charm and compulsion effects for 10 minutes.\n\nSuppress Active Effects: The spell requires concentration with maximum duration of 1 round per level. While concentrating, it suppresses all existing charm and compulsion effects on targets, regardless of whether beneficial or harmful. New charm or compulsion effects targeting protected creatures are automatically suppressed during concentration. Ceasing concentration ends the spell immediately, allowing suppressed effects to resume their remaining durations normally.","source":"Adventurer's Guide"},{"n":"Vestment of the Champion","l":2,"x":"Functions as magic vestment, but affects only armor or a shield worn/carried by you, losing effect if someone else takes it and resuming when you have it again.","oath":false,"save":"none","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: armor or shield touched","duration":"1 minute/level","sr":"no","effect":"This spell functions similarly to magic vestment, with a key restriction: it only affects armor or a shield the caster personally wears or carries. If the armor or shield is worn or carried by anyone other than you, the spell has no effect, but resumes its effect when you are wearing or carrying it again.","source":"Ultimate Magic"},{"n":"Wake of Light","l":2,"x":"You and a mount leave a glowing mist that treats difficult terrain as normal for good creatures and normal terrain as difficult for evil creatures, with no effect on neutral ones.","oath":false,"save":"none","school":"Evocation [good]","castingTime":"1 standard action","components":"V, S, DF","range":"120 ft.","target":"effect: a 10-ft.-wide path in a straight line, up to 120 ft. long","duration":"1 round/level","sr":"yes","effect":"The caster and mounted companion create a luminous, heavenly mist trail during movement that benefits good creatures while hindering evil ones. This glowing path forms behind the mount in a straight line from casting location to the mount's final position, measuring 10 feet wide and up to 120 feet long, floating approximately one foot above ground. The mist persists for the full duration.\n\nGood creatures traverse the mist as solid terrain, converting difficult terrain into normal movement. Evil creatures experience the opposite effect, where normal terrain becomes difficult. Neutral creatures pass through unaffected. The mist doesn't obscure vision, provide concealment, or affect impassable terrain or obstacles.\n\nMounts generally adopt their rider's alignment for this spell's purposes. The caster must remain mounted to benefit; dismounting, falling off, or separating from the mount immediately terminates the spell, though the mist lingers. The wake cannot form across water, underwater terrain, or through air when the mount flies, swims, or walks on water.","source":"Advanced Player's Guide"},{"n":"Weapon of Awe","l":2,"x":"Grants a weapon a +2 sacred bonus to damage rolls, and automatically shakes the target for 1 round on a confirmed critical hit.","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation [emotion]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: weapon touched","duration":"1 minute/level","sr":"yes (harmless, object)","effect":"You transform a single weapon into an awe-inspiring instrument. The weapon gains a +2 sacred bonus on damage rolls, and if the weapon scores a critical hit, the target of that critical hit becomes shaken for 1 round with no Saving Throw. This is a mind-affecting fear effect. A ranged weapon affected by this spell applies these effects to its ammunition. You can't cast this spell on a natural weapon, but you can cast it on an unarmed strike.","source":"Advanced Player's Guide"},{"n":"Widen Auras","l":2,"x":"Doubles the range of your paladin or antipaladin auras (e.g. aura of courage extends from 10 feet to 20 feet).","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V","range":"personal","target":"target: you","duration":"1 minute/level (D)","sr":"no","effect":"The spell causes your paladin or antipaladin auras to extend twice their normal distance. For instance, a paladin's courage aura would protect allies within 20 feet rather than the standard 10-foot radius.","source":"Advanced Class Guide"},{"n":"Winged Sword","l":2,"x":"Grows small feathered wings on a weapon, granting it the throwing special weapon ability for the spell's duration.","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one melee weapon","duration":"10 minutes/level","sr":"yes (harmless, object)","effect":"The weapon targeted by this spell grows small feathered wings. For the duration of the spell, the weapon acts as if it had the throwing weapon special ability. This spell can be used in place of magic stone as a prerequisite for the throwing weapon special ability.","source":"Arcane Anthology"},{"n":"Accept Affliction","l":3,"x":"Transfers a curse, disease, poison, or condition (blindness, deafness, fatigue, nausea, shaken, sickened) from a touched creature onto yourself.","oath":false,"save":"Fort negates (harmless)","school":"Conjuration (healing) [good]","castingTime":"1 standard action","components":"V, S, M/DF
