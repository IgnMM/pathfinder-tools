:root{--bg:#0f1117;--panel:#181c24;--panel2:#202633;--text:#eef2f7;--muted:#9ba7b7;--gold:#d5ad55;--gold2:#f1d78b;--red:#d66b6b;--border:#313949}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;background:#0f1117;color:var(--text)}header,main{max-width:1180px;margin:auto;padding:12px 16px}header{border-bottom:1px solid var(--border)}h1{margin:0;font-size:1.35rem}.sub{color:var(--muted);font-size:.78rem;margin:2px 0 8px}.controls{display:grid;grid-template-columns:90px 90px 1fr;gap:8px}label{font-size:.68rem;color:var(--muted);display:block;margin-bottom:2px}select,input{width:100%;background:#121721;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px}.oathval{width:100%;box-sizing:border-box;padding:7px 0;color:var(--text);font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px}.stat b{color:var(--gold2);font-size:1rem}.stat span{display:block;color:var(--muted);font-size:.62rem}.levels{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;cursor:pointer}button.active,button.primary{background:#5a4318;border-color:#816427;color:#fff1c2}.toolbar{display:grid;grid-template-columns:1fr 160px auto auto;gap:6px;margin-bottom:8px}.slotbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;position:sticky;top:0;z-index:5;background:#0f1117;padding:6px 0;box-shadow:0 4px 6px -4px rgba(0,0,0,.4)}.slot{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px}.slot small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}section{margin:8px 0 14px}h2{font-size:.95rem;color:var(--gold2);margin:6px 0}.dc{font-size:.68rem;color:var(--muted);font-weight:400;margin-left:6px}.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px}.card.oath{border-color:#816427}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:750}.badge{font-size:.58rem;color:var(--gold2)}.savebadge{font-size:.58rem;color:var(--muted);margin-top:2px}.sourcebadge{font-size:.56rem;color:#7d8aa3;margin-top:2px;font-style:italic}.reasontag{font-size:.58rem;color:#e0a05a;margin-top:2px}.ineligibleToggle{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);cursor:pointer;white-space:nowrap}.ineligibleToggle input{width:auto}.ineligibleSep{grid-column:1/-1;font-size:.68rem;color:var(--muted);border-top:1px solid var(--border);padding-top:6px;margin-top:4px}.card.ineligible{opacity:.42}.forbidbtn{background:none;border:none;font-size:1rem;line-height:1;cursor:pointer;padding:0 4px;color:var(--muted);opacity:.5}.forbidbtn.active{color:#e07a7a;opacity:1}.desc{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.25}.desc summary{cursor:pointer;color:var(--gold2);font-size:.68rem;list-style:none}.desc summary::-webkit-details-marker{display:none}.desc summary:before{content:"▸ ";display:inline-block}.desc[open] summary:before{content:"▾ "}.desc[open] summary{margin-bottom:3px}.stat-block{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:5px 7px;margin-bottom:5px}.stat-row{font-size:.68rem;line-height:1.5}.stat-row b{color:var(--gold2);font-weight:700;margin-right:4px}.effect-text p{margin:0 0 6px}.effect-text p:last-child{margin-bottom:0}.prep{display:flex;align-items:center;gap:4px}.count{min-width:22px;text-align:center;color:var(--gold2);font-weight:700}.disabled{opacity:.45}.warn{color:#ffd27c;font-size:.68rem;margin-top:5px}.pips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;cursor:pointer}.pipdots{display:flex;gap:4px;flex-wrap:wrap}.pip{width:14px;height:14px;border-radius:50%;border:1px solid #6b7688;background:#222a37}.pip.used{background:#7a3036;border-color:#c25c66}.pipcount{font-size:.62rem;color:var(--muted)}.rulenote{margin-top:5px}.rulenote summary{cursor:pointer;color:var(--muted);font-size:.62rem;list-style:none;display:inline-block}.sourcesbox{position:relative}.sourcesbox summary{cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.78rem;list-style:none;white-space:nowrap}.sourcesbox summary::-webkit-details-marker{display:none}.sourcesbox[open] summary{border-color:var(--gold)}.sourcesPanel{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px;z-index:20;max-height:260px;overflow-y:auto;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.sourcesPanel label{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text);padding:3px 0;cursor:pointer}.sourcesPanel input{width:auto}.sourcesPanel .srcActions{display:flex;gap:6px;margin-bottom:6px}.sourcesPanel .srcActions button{font-size:.65rem;padding:4px 7px}.rulenote summary::-webkit-details-marker{display:none}.rulenote #ruleNote{color:#ffd27c;font-size:.68rem;margin-top:4px}.favbtn{background:none;border:none;font-size:1.05rem;line-height:1;cursor:pointer;padding:0 4px;color:var(--muted)}.favbtn.active{color:var(--gold2)}

<header><h1>Kenneth — Paladin Spellbook</h1><div style="display:flex;gap:8px;align-items:center;margin:6px 0"><details class="sourcesbox"><summary>Sync</summary><div class="sourcesPanel" style="min-width:220px"><div style="font-size:.72rem;color:var(--muted);margin-bottom:6px">Locked to account <b style="color:var(--text)">KOS</b>.</div><div style="display:flex;gap:6px;margin-bottom:6px"><button id="cloudSave" type="button" class="primary">Save to cloud</button><button id="cloudLoad" type="button">Load from cloud</button></div><div id="syncStatus" style="font-size:.7rem;color:var(--muted);margin-top:2px"></div></div></details></div><div class="sub">Pathfinder 1e Core Rulebook paladin spells + oath spells</div><div class="controls"><div><label>Paladin Level</label><select id="level"></select></div><div><label>Charisma</label><select id="cha"></select></div><div><label>Paladin Oath</label><div class="oathval">Oath of the Crusade + Oath Against Fiends</div></div></div><div class="stats"><div class="stat"><b id="cl">0</b><span>Caster level</span></div><div class="stat"><b id="daily">0</b><span>Total spell slots/day</span></div><div class="stat"><b id="prepared">0</b><span>Prepared in normal slots</span></div><div class="stat"><b id="oathprep">0</b><span>Oath slots prepared</span></div></div><div id="levelButtons" class="levels"></div><div id="ctButtons" class="levels"></div><details class="rulenote"><summary>ⓘ oath slots</summary><div id="ruleNote"></div></details></header><main><div id="slots" class="slotbar"></div><div class="toolbar"><div class="searchWrap"><svg class="searchIcon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="search" placeholder="Search spell name or description..."><button id="searchClear" type="button" title="Clear search" aria-label="Clear search">&times;</button></div><style>.searchWrap{position:relative}.searchWrap input{padding-left:26px;padding-right:24px}.searchIcon{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.searchWrap button{position:absolute;right:1px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;padding:4px 7px}.searchWrap button:hover{color:var(--text)}</style><select id="filter"><option value="all">All spells</option><option value="prepared">Prepared only</option><option value="unprepared">Unprepared only</option><option value="oath">Oath spells only</option><option value="favorites">Favorites only</option></select><label class="ineligibleToggle"><input type="checkbox" id="showIneligible"> Show ineligible</label><details class="sourcesbox"><summary>Sources</summary><div class="sourcesPanel"><div class="srcActions"><button id="srcAll" type="button">All</button><button id="srcNone" type="button">None</button><button id="srcResetGlobal" type="button" title="Follow the site-wide Valid Sources selection again">Reset to global</button></div><div id="sourcesNote" style="font-size:.62rem;color:var(--muted);margin-bottom:4px"></div><div id="sourceList"></div></div></details><button class="primary" id="newDay">New Day</button><button id="clear">Clear</button></div><div id="list"></div></main><script src="../assets/valid-sources.js"></script><script src="../assets/casting-time.js"></script>

const SPELLS=[{"n":"Bless","l":1,"x":"Allies gain +1 morale on attack rolls and saves against fear.","oath":false,"save":"none","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"50 ft.","target":"area: the caster and all allies within a 50-ft. burst, centered on the caster","duration":"1 min./level","sr":"yes (harmless)","effect":"Bless fills your allies with courage. Each ally gains a +1 morale bonus on attack rolls and on saving throws against fear effects. Bless counters and dispels bane.","source":"Core Rulebook"},{"n":"Bless Water","l":1,"x":"Makes holy water.","oath":false,"save":"Will negates (object)","school":"Transmutation [good]","castingTime":"1 minute","components":"V, S, M (5 pounds of powdered silver worth 25 gp)","range":"touch","target":"target: flask of water touched","duration":"instantaneous","sr":"yes (object)","effect":"This transmutation imbues a flask (1 pint) of water with positive energy, turning it into holy water.","source":"Core Rulebook"},{"n":"Bless Weapon","l":1,"x":"Weapon strikes true against evil foes.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: weapon touched","duration":"1 min./level","sr":"no","effect":"This spell makes a weapon strike true against evil adversaries. The weapon gains a +1 enhancement bonus for bypassing damage reduction of evil creatures or striking evil incorporeal beings (without granting an actual bonus). It becomes good-aligned, allowing it to bypass certain creatures' DR, overriding any other alignment the weapon possessed.\n\nIndividual arrows or bolts can be affected, but projectile weapons don't grant benefits to their ammunition.\n\nAdditionally, all critical hit rolls against evil foes are automatically successful, so every threat is a critical hit. This effect doesn't apply to weapons already possessing magical critical-hit properties, such as keen weapons or vorpal swords.","source":"Core Rulebook"},{"n":"Create Water","l":1,"x":"Creates 2 gallons/level of pure water.","oath":false,"save":"none","school":"Conjuration (creation) [water]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"effect: up to 2 gallons of water/level","duration":"instantaneous","sr":"no","effect":"This spell generates wholesome, drinkable water, just like clean rain water. Water can be created in an area as small as will actually contain the liquid, or in an area three times as large, possibly creating a downpour or filling many small receptacles. This water disappears after 1 day if not consumed.\n\nConjuration spells can't create substances or objects within a creature. Water weighs about 8 pounds per gallon. One cubic foot of water contains roughly 8 gallons and weighs about 60 pounds.","source":"Core Rulebook"},{"n":"Cure Light Wounds","l":1,"x":"Cures 1d8 damage + 1/level (max +5).","oath":false,"save":"Will half (harmless); see text","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes (harmless); see text","effect":"When laying your hand upon a living creature, you channel positive energy that cures 1d8 points of damage +1 point per caster level (maximum +5). Since undead are powered by negative energy, this spell deals damage to them instead of curing their wounds. An undead creature can apply Spell Resistance, and can attempt a Will save to take half damage.","source":"Core Rulebook"},{"n":"Detect Poison","l":1,"x":"Detects poison in one creature or small object.","oath":false,"save":"none","school":"Divination","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target or area: one creature, one object, or a 5-ft. cube","duration":"instantaneous","sr":"no","effect":"You determine whether a creature, object, or area has been poisoned or is poisonous. You can determine the exact type of poison with a DC 20 Wisdom check. A character with the Craft (alchemy) skill may try a DC 20 Craft (alchemy) check if the Wisdom check fails, or may try the Craft (alchemy) check prior to the Wisdom check. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"Core Rulebook"},{"n":"Detect Undead","l":1,"x":"Reveals undead within 60 ft.","oath":false,"save":"none","school":"Divination","castingTime":"1 standard action","components":"V, S, M/DF (earth from a grave)","range":"60 ft.","target":"area: cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","sr":"no","effect":"You can detect the aura that surrounds undead creatures. The amount of information revealed depends on how long you study a particular area.\n\n1st Round: Presence or absence of undead auras.\n\n2nd Round: Number of undead auras in the area and the strength of the strongest undead aura present. If you are of good alignment, and the strongest undead aura's strength is overwhelming, and the creature has HD of at least twice your character level, you are stunned for 1 round and the spell ends.\n\n3rd Round: The strength and location of each undead aura. If an aura is outside your line of sight, then you discern its direction but not its exact location.\n\nAn undead aura lingers after its original source is destroyed, at a dim strength level whose duration depends on the original aura's power.\n\nEach round, you can turn to detect undead in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"Core Rulebook"},{"n":"Divine Favor","l":1,"x":"Gain +1 per three caster levels on attack and weapon damage rolls.","oath":false,"save":"none","school":"Evocation","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"target: you (or touch/living creature touched if cast on another willing creature)","duration":"1 minute","sr":"no","effect":"Calling upon the strength and wisdom of a deity, you gain a +1 luck bonus on attack and weapon damage rolls for every three caster levels you have (at least +1, maximum +3). The bonus doesn't apply to spell damage. This spell may alternatively be cast on another willing creature by touch.","source":"Core Rulebook"},{"n":"Endure Elements","l":1,"x":"Exist comfortably in hot or cold environments.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature touched","duration":"24 hours","sr":"yes (harmless)","effect":"A creature protected by endure elements suffers no harm from being in a hot or cold environment. It can exist comfortably in conditions between -50 and 140 degrees Fahrenheit (-45 and 60 degrees Celsius) without having to make Fortitude saves. The creature's equipment is likewise protected.\n\nEndure elements doesn't provide any protection from fire or cold damage, nor does it protect against other environmental hazards such as smoke, lack of air, and so forth.","source":"Core Rulebook"},{"n":"Magic Weapon","l":1,"x":"Weapon gains +1 enhancement bonus.","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: weapon touched","duration":"1 min./level","sr":"yes (harmless, object)","effect":"Magic weapon gives a weapon a +1 enhancement bonus on attack and damage rolls. An enhancement bonus does not stack with a masterwork weapon's +1 bonus on attack rolls.\n\nThe spell cannot be cast on natural weapons like unarmed strikes; instead, casters should reference the magic fang spell for that purpose. However, a monk's unarmed strike qualifies as a weapon and can be enhanced by this spell.","source":"Core Rulebook"},{"n":"Protection from Chaos","l":1,"x":"+2 AC and saves, plus protection against chaotic mental control and summoned creatures.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [lawful]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"target: creature touched","duration":"1 min./level (D)","sr":"no; see text","effect":"This spell operates identically to protection from evil, except its deflection and resistance bonuses defend against attacks by chaotic-aligned creatures. The protected creature gains an additional saving throw versus control effects from chaotic entities, and creatures summoned by chaos magic cannot make physical contact with the target.","source":"Core Rulebook"},{"n":"Protection from Evil","l":1,"x":"+2 AC and saves, plus protection against evil mental control and summoned creatures.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, M/DF","range":"touch","target":"target: creature touched","duration":"1 min./level (D)","sr":"no; see text","effect":"This protective magic creates a magical barrier around the subject at a distance of 1 foot that moves with them and provides three benefits.\n\nFirst Effect: The subject gains +2 deflection bonus to AC and a +2 resistance bonus on saves. Both these bonuses apply against attacks made or effects created by evil creatures.\n\nSecond Effect: The target receives another saving throw against possession and mental control effects like charm and compulsion spells, with a +2 morale bonus applied. If successful, such effects are suppressed during the spell's duration. While protected, the target gains immunity to new possession or mental control attempts from evil sources.\n\nThird Effect: The spell prevents bodily contact by evil summoned creatures. This causes the natural weapon attacks of such creatures to fail and the creatures to recoil.","source":"Core Rulebook"},{"n":"Read Magic","l":1,"x":"Read magical inscriptions.","oath":false,"save":"none","school":"Divination","castingTime":"1 standard action","components":"V, S, F (a clear crystal or mineral prism)","range":"personal","target":"target: you","duration":"10 min./level","sr":"no","effect":"The caster deciphers magical inscriptions on various objects without typically invoking contained magic, though cursed or trapped scrolls may activate. Once read, the caster can read that specific writing permanently without recasting. Reading speed is one page (250 words) per minute. The spell enables identifying glyphs and symbols with appropriate Spellcraft checks (DC 13 for glyph of warding, DC 16 for greater glyph, DC 10 + spell level for symbol spells). This spell can be made permanent via permanency magic.","source":"Core Rulebook"},{"n":"Resistance","l":1,"x":"Subject gains +1 resistance bonus on saving throws.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, M/DF (a miniature cloak)","range":"touch","target":"target: creature touched","duration":"1 minute","sr":"yes (harmless)","effect":"You imbue the subject with magical energy that protects it from harm, granting it a +1 resistance bonus on saves. Resistance can be made permanent with a permanency spell.","source":"Core Rulebook"},{"n":"Lesser Restoration","l":1,"x":"Dispels magical ability penalties or cures 1d4 temporary ability damage; also helps fatigue/exhaustion.","oath":false,"save":"Will negates (harmless)","school":"Conjuration (healing)","castingTime":"3 rounds","components":"V, S","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes (harmless)","effect":"This spell dispels any magical effects reducing one of the subject's ability scores or cures 1d4 points of temporary ability damage to one of the subject's ability scores. It also eliminates fatigue and improves exhaustion to the fatigued condition. It does not restore permanent ability drain.","source":"Core Rulebook"},{"n":"Virtue","l":1,"x":"Subject gains 1 temporary hit point.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 minute","sr":"yes (harmless)","effect":"With a touch, you infuse a creature with a tiny surge of life, granting the subject 1 temporary hit point.","source":"Core Rulebook"},{"n":"Bull's Strength","l":2,"x":"Subject gains +4 enhancement bonus to Strength.","oath":false,"save":"Will negates (harmless)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a few hairs, or a pinch of dung, from a bull)","range":"touch","target":"target: creature touched","duration":"1 min./level","sr":"yes (harmless)","effect":"The subject becomes stronger. The spell grants a +4 enhancement bonus to Strength, adding the usual benefits to melee attack rolls, melee damage rolls, and other uses of the Strength modifier.","source":"Core Rulebook"},{"n":"Delay Poison","l":2,"x":"Stops poison from harming subject for 1 hour/level.","oath":false,"save":"Fortitude negates (harmless)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 hour/level","sr":"yes (harmless)","effect":"The subject becomes temporarily immune to poison. Any poison in its system or any poison to which it is exposed during the spell's duration does not affect the subject until the spell's duration has expired. Delay poison does not cure any damage that poison may have already done.","source":"Core Rulebook"},{"n":"Eagle's Splendor","l":2,"x":"Subject gains +4 enhancement bonus to Charisma.","oath":false,"save":"Will negates (harmless)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (feathers or droppings from an eagle)","range":"touch","target":"target: creature touched","duration":"1 min./level","sr":"yes","effect":"The transmuted creature gains enhanced poise, articulation, and personal force. It receives a +4 enhancement bonus to Charisma, which applies to Charisma-based skill checks and other uses of the Charisma modifier. Bards, paladins, and sorcerers do not gain additional bonus spells from this increased Charisma, though save DCs for their spells increase while affected.","source":"Core Rulebook"},{"n":"Owl's Wisdom","l":2,"x":"Subject gains +4 enhancement bonus to Wisdom.","oath":false,"save":"Will negates (harmless)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (feathers or droppings from an owl)","range":"touch","target":"target: creature touched","duration":"1 min./level","sr":"yes","effect":"The transmuted creature becomes wiser. The spell grants a +4 enhancement bonus to Wisdom, adding the usual benefit to Wisdom-related skills. Clerics, druids, and rangers (and other Wisdom-based spellcasters) who receive this spell do not gain any additional bonus spells for the increased Wisdom, but the save DCs for their spells increase.","source":"Core Rulebook"},{"n":"Remove Paralysis","l":2,"x":"Frees one or more creatures from paralysis or related effects.","oath":false,"save":"Will negates (harmless)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: up to four creatures, no two of which can be more than 30 ft. apart","duration":"instantaneous","sr":"yes (harmless)","effect":"The spell frees affected creatures from temporary paralysis or related magic, including effects causing the staggered condition. When targeting a single creature, paralysis is completely negated. With two targets, each gets another Will save with a +4 resistance bonus against their affliction. With three or four targets, each receives another Will save with a +2 resistance bonus.\n\nThe spell notably does not restore ability scores reduced through penalties, damage, or drain effects.","source":"Core Rulebook"},{"n":"Resist Energy","l":2,"x":"Grants resist energy 10 (20 at CL 7, 30 at CL 11) against one chosen energy type, protecting the subject's gear as well. Note: this is the same spell whether prepared as the normal 2nd-level version or as the Oath Against Fiends/Oath of the Crusade 1st-level oath spell; the saving throw is identical either way.","oath":false,"save":"Fortitude negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"10 min./level","sr":"yes (harmless)","effect":"This abjuration grants a creature limited protection from damage of whichever one of five energy types you select: acid, cold, electricity, fire, or sonic. The subject gains resist energy 10 against the energy type chosen, meaning that each time the creature is subjected to such damage (whether from a natural or magical source), that damage is reduced by 10 points before being applied to the creature's hit points. The value of the energy resistance granted increases to 20 points at 7th level and to a maximum of 30 points at 11th level. The spell protects the recipient's equipment as well.\n\nResist energy absorbs only damage. The subject could still suffer unfortunate side effects.\n\nResist energy overlaps (and does not stack with) protection from energy. If a character is warded by protection from energy and resist energy, the protection spell absorbs damage until its power is exhausted.","source":"Core Rulebook"},{"n":"Shield Other","l":2,"x":"You take half of the subject’s hit point damage while the spell lasts.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, F (a pair of platinum rings worth 50 gp worn by both you and the target)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 hour/level (D)","sr":"yes (harmless)","effect":"This spell creates a mystical bond providing defensive benefits. The subject gains +1 deflection bonus to AC and a +1 resistance bonus on saves. Crucially, the subject takes only half damage from all wounds and attacks (including those dealt by special abilities) that deal hit point damage. The amount of damage not taken by the warded creature is taken by you.\n\nHarm types excluding hit point damage, such as charm effects, ability damage, level drain, and death effects, remain unshared. Damage from reduced Constitution doesn't transfer. When the spell expires, damage division ceases but prior damage stays assigned. If you and the subject of the spell move out of range of each other, the spell ends.","source":"Core Rulebook"},{"n":"Undetectable Alignment","l":2,"x":"Conceals alignment from magical detection for 24 hours.","oath":false,"save":"Will negates (object)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature or object","duration":"24 hours","sr":"yes (object)","effect":"This abjuration conceals the alignment of an object or creature from all forms of divination.","source":"Core Rulebook"},{"n":"Zone of Truth","l":2,"x":"Creatures in the area that fail their save cannot deliberately lie.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"area: 20-ft.-radius emanation","duration":"1 min./level","sr":"yes","effect":"Creatures within the emanation area (or those who enter it) cannot speak deliberate and intentional lies. Each potentially affected creature is allowed a save to avoid the effects when the spell is cast or when the creature first enters the emanation area. Affected creatures are aware of this enchantment. Therefore, they may avoid answering questions to which they would normally respond with a lie, or they may be evasive as long as they remain within the boundaries of the truth. Creatures who leave the area are free to speak as they choose.","source":"Core Rulebook"},{"n":"Cure Moderate Wounds","l":3,"x":"Cures 2d8 damage + 1/level (max +10).","oath":false,"save":"Will half (harmless); see text","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes (harmless); see text","effect":"This spell functions like cure light wounds, except that it cures 2d8 points of damage + 1 point per caster level (maximum +10).","source":"Core Rulebook"},{"n":"Daylight","l":3,"x":"Object sheds bright light in a 60-foot radius.","oath":false,"save":"none","school":"Evocation [light]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: object touched","duration":"10 min./level (D)","sr":"no","effect":"You touch an object when you cast this spell, causing the object to shed bright light in a 60-foot radius. This illumination increases the light level for an additional 60 feet by one step (darkness becomes dim light, dim light becomes normal light, and normal light becomes bright light).\n\nCreatures that take penalties in bright light take them while within the 60-foot radius of this magical light. Despite its name, this spell is not the equivalent of daylight for the purposes of creatures that are damaged or destroyed by such light.\n\nIf daylight is cast on a small object that is then placed inside or under a light-proof covering, the spell's effects are blocked until the covering is removed.\n\nDaylight brought into an area of magical darkness (or vice versa) is temporarily negated, so that the otherwise prevailing light conditions exist in the overlapping areas of effect.\n\nDaylight counters or dispels any darkness spell of equal or lower level, such as darkness.","source":"Core Rulebook"},{"n":"Discern Lies","l":3,"x":"Reveals deliberate falsehoods while you concentrate.","oath":false,"save":"Will negates","school":"Divination","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration, up to 1 round/level","sr":"no","effect":"Each round, you concentrate on one target within range. The spell allows you to identify when a target deliberately and knowingly speaks a lie by detecting disturbances in its aura. It does not reveal the truth, expose unintentional inaccuracies, or necessarily uncover evasions. Each round, you may shift concentration to a different target.","source":"Core Rulebook"},{"n":"Dispel Magic","l":3,"x":"Cancels a spell or magical effect.","oath":false,"save":"none","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"target or area: one spellcaster, creature, or object","duration":"instantaneous","sr":"no","effect":"You can use dispel magic to end one ongoing spell cast on a creature or object, temporarily suppress a magic item's abilities, or counter another spellcaster's spell. A dispelled spell ends as if its duration expired. Some spells cannot be defeated by dispel magic. Dispel magic can dispel spell-like effects similarly to spells. Spells with instantaneous duration cannot be dispelled since the effect concludes before dispel magic takes effect.\n\nTwo usage methods exist: Targeted Dispel and Counterspell. For targeted dispels, make a check (1d20 + caster level) against the highest-level spell affecting the target (DC = 11 + spell's caster level), proceeding to lower-level spells until one dispels or all fail. You may target specific spells by name. Against magic items, suppress all magical properties for 1d4 rounds if successful. You automatically succeed against spells you cast.\n\nFor Counterspell usage, dispel magic targets a spellcaster and functions as a counterspell, though requiring a successful dispel check rather than automatic prevention.","source":"Core Rulebook"},{"n":"Heal Mount","l":3,"x":"Heals and removes many adverse conditions from your special mount.","oath":false,"save":"Will negates (harmless)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: your mount touched","duration":"instantaneous","sr":"yes (harmless)","effect":"This spell functions like heal, but it affects only the paladin's special mount (typically a horse).","source":"Core Rulebook"},{"n":"Magic Circle against Chaos","l":3,"x":"As protection from chaos, but in a 10-foot-radius emanation.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [lawful]","castingTime":"1 standard action","components":"V, S, M/DF (a 3-ft.-diameter circle of powdered silver)","range":"touch","target":"area: 10-ft.-radius emanation from touched creature","duration":"10 min./level","sr":"no; see text","effect":"This spell functions like magic circle against evil, except that it is similar to protection from chaos instead of protection from evil, and it can imprison a non-lawful called creature.","source":"Core Rulebook"},{"n":"Magic Circle against Evil","l":3,"x":"As protection from evil, but in a 10-foot-radius emanation.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, M/DF (a 3-ft.-diameter circle of powdered silver)","range":"touch","target":"area: 10-ft.-radius emanation from touched creature","duration":"10 min./level","sr":"no; see text","effect":"The spell grants all creatures in the affected radius the protections of a protection from evil effect. Evil summoned entities cannot penetrate the area. Creatures attempting to suppress controlling effects get a single attempt; successful suppression persists only while remaining inside the circle.\n\nThe caster may alternatively focus the magic inward to bind non-good called creatures for up to 24 hours per caster level, preventing their crossing the circle's boundary. The circle can be disrupted if the powdered silver is disturbed. Creatures with dimensional travel abilities may escape unless a dimensional anchor spell has been cast beforehand.\n\nA caster can enhance the circle with a special diagram (requiring 10 minutes and a DC 20 Spellcraft check) to prevent Spell Resistance and block all creature attacks/abilities from crossing. This spell doesn't stack with protection from evil.","source":"Core Rulebook"},{"n":"Greater Magic Weapon","l":3,"x":"Weapon gains +1 enhancement bonus per four caster levels (max +5).","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (powdered lime and carbon)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one weapon or 50 projectiles (all of which must be together at the time of casting)","duration":"1 hour/level","sr":"yes (harmless, object)","effect":"This spell functions like magic weapon, except that it gives a weapon an enhancement bonus on attack and damage rolls of +1 per four caster levels (maximum +5). This bonus does not allow a weapon to bypass damage reduction aside from magic.\n\nAlternatively, you can affect as many as 50 arrows, bolts, or bullets. The projectiles must be of the same kind, and they have to be together (in the same quiver or other container). Projectiles, but not thrown weapons, lose their transmutation after they are used. Treat shuriken as projectiles, rather than as thrown weapons, for the purpose of this spell.","source":"Core Rulebook"},{"n":"Prayer","l":3,"x":"Allies gain +1 luck bonus on many rolls; foes take –1.","oath":false,"save":"none","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"40 ft.","target":"area: all allies and foes within a 40-ft.-radius burst centered on you","duration":"1 round/level","sr":"yes","effect":"You bring special favor upon yourself and your allies while bringing disfavor to your enemies. You and each of your allies gain a +1 luck bonus on attack rolls, weapon damage rolls, saves, and skill checks, while each of your foes takes a -1 penalty on such rolls.","source":"Core Rulebook"},{"n":"Remove Blindness/Deafness","l":3,"x":"Cures normal or magical blindness or deafness.","oath":false,"save":"Fortitude negates (harmless)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes (harmless)","effect":"The spell cures blindness or deafness (caster's choice), whether magical or natural in origin. The spell does not restore ears or eyes that have been lost, but it repairs them if they are damaged.\n\nThe spell counters and dispels blindness/deafness.","source":"Core Rulebook"},{"n":"Remove Curse","l":3,"x":"Frees a creature or object from curses, subject to caster-level checks where required.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature or object touched","duration":"instantaneous","sr":"yes (harmless)","effect":"The spell can eliminate all curses affecting a creature or object. When targeting a creature, the caster makes a level check (1d20 + caster level) versus each curse's DC to succeed in removing it.\n\nThe spell does not remove curses from cursed armor, weapons, or shields directly, but a successful caster level check allows an afflicted creature to discard such items.\n\nThis spell counters and dispels bestow curse.","source":"Core Rulebook"},{"n":"Break Enchantment","l":4,"x":"Frees subjects from enchantments, transmutations, and curses.","oath":false,"save":"see text","school":"Abjuration","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: up to one creature per level, all within 30 ft. of each other","duration":"instantaneous","sr":"no","effect":"This spell frees victims from enchantments, transmutations, and curses. Break enchantment can reverse even an instantaneous effect. The caster makes a check (1d20 + caster level, maximum +15) against DC 11 + the effect's caster level. Success frees the creature from the spell, curse, or effect. For cursed magic items, the DC equals the curse's DC.\n\nIf the spell is one that cannot be dispelled by dispel magic, break enchantment works only if that spell is 5th level or lower.\n\nIf the effect comes from a permanent magic item, break enchantment does not remove the curse from the item, but it does free the victim from the item's effects.","source":"Core Rulebook"},{"n":"Cure Serious Wounds","l":4,"x":"Cures 3d8 damage + 1/level (max +15).","oath":false,"save":"Will half (harmless); see text","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes (harmless); see text","effect":"This spell functions like cure light wounds, except that it cures 3d8 points of damage + 1 point per caster level (maximum +15).","source":"Core Rulebook"},{"n":"Death Ward","l":4,"x":"Protects against death effects, energy drain, and negative energy.","oath":false,"save":"Will negates (harmless)","school":"Necromancy","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: living creature touched","duration":"1 min./level","sr":"yes (harmless)","effect":"The subject gains a +4 morale bonus on saves against all death spells and magical death effects. The subject is granted a save to negate such effects even if one is not normally allowed. The subject is immune to energy drain and any negative energy effects, including channeled negative energy.\n\nThis spell does not remove negative levels that the subject has already gained, but it does remove the penalties from negative levels for the duration of its effect.\n\nDeath ward does not protect against other sorts of attacks, even if those attacks might be lethal.","source":"Core Rulebook"},{"n":"Dispel Chaos","l":4,"x":"Protects against chaotic creatures and can banish or dispel certain chaotic effects.","oath":false,"save":"see text","school":"Abjuration [lawful]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: you and a touched chaotic creature from another plane, or you and an enchantment or chaotic spell on a touched creature or object","duration":"1 round/level or until discharged, whichever comes first","sr":"see text","effect":"This spell functions like dispel evil, except that you are surrounded by constant, blue lawful energy, and the spell affects chaotic creatures and spells rather than evil ones.","source":"Core Rulebook"},{"n":"Dispel Evil","l":4,"x":"Protects against evil creatures and can banish or dispel certain evil effects.","oath":false,"save":"see text","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: you and a touched evil creature from another plane, or you and an enchantment or evil spell on a touched creature or object","duration":"1 round/level or until discharged, whichever comes first","sr":"see text","effect":"Shimmering, white holy energy surrounds you. This energy has three effects.\n\nFirst, you gain a +4 deflection bonus to AC against attacks by evil creatures.\n\nSecond, on making a successful melee touch attack against an evil creature from another plane, you can choose to drive that creature back to its home plane. The creature can negate the effects with a successful Will save (Spell Resistance applies). This use discharges and ends the spell.\n\nThird, with a touch you can automatically dispel any one enchantment spell cast by an evil creature or any one evil spell. Spells that cannot be dispelled by dispel magic also cannot be dispelled by this spell. Saving throws and Spell Resistance do not apply to this effect. This use discharges and ends the spell.","source":"Core Rulebook"},{"n":"Holy Sword","l":4,"x":"Melee weapon functions as a +5 holy weapon and projects magic circle against evil.","oath":false,"save":"none","school":"Evocation [good]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: melee weapon touched","duration":"1 round/level","sr":"no","effect":"This incantation channels holy power into a melee weapon, granting it +5 holy weapon properties, meaning +5 enhancement bonuses to both attack and damage rolls, plus an additional 2d6 damage versus evil opponents. The weapon simultaneously generates a magic circle against evil effect identical to that spell. Should the circle dispel, the weapon creates a replacement on the caster's following turn at no action cost. The spell terminates one round after the weapon leaves the caster's grasp. Only one active holy sword enchantment per caster is permitted at any time.\n\nWhen applied to existing magical weapons, this spell's properties supersede the weapon's normal enhancements, deactivating them temporarily. It cannot stack with bless weapon or similar weapon-modifying spells, nor does it function on artifact weapons.","source":"Core Rulebook"},{"n":"Mark of Justice","l":4,"x":"Places a conditional curse on a willing or restrained subject.","oath":false,"save":"none","school":"Necromancy [curse]","castingTime":"10 minutes","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"permanent; see text","sr":"yes","effect":"You inscribe a mark upon a willing or restrained subject and specify a behavioral trigger. When the designated action occurs, the mark activates and curses the target with effects identical to bestow curse.\n\nThe spell requires 10 minutes to cast and involves physically writing on the target, restricting its use to willing or helpless creatures. Like bestow curse, this curse cannot be dispelled but may be removed through break enchantment, limited wish, miracle, remove curse, or wish. Note that remove curse only functions if cast at a caster level equal to or exceeding the original mark of justice caster level, regardless of activation status.","source":"Core Rulebook"},{"n":"Neutralize Poison","l":4,"x":"Neutralizes poison in a creature or object.","oath":false,"save":"Will negates (harmless, object)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S, M/DF (charcoal)","range":"touch","target":"target: creature or object of up to 1 cu. ft./level touched","duration":"instantaneous or 10 min./level; see text","sr":"yes (harmless, object)","effect":"You detoxify any sort of venom in the creature or object touched. If the target is a creature, you must make a caster level check (1d20 + caster level) against the DC of each poison affecting the target. Success means that the poison is neutralized. A cured creature suffers no additional effects from the poison, and any temporary effects are ended, but the spell does not reverse instantaneous effects, such as hit point damage, temporary ability damage, or effects that don't go away on their own.\n\nThis spell can instead neutralize the poison in a poisonous creature or object for 10 minutes per level, at the caster's option. If cast on a creature, the creature receives a Will save to negate the effect.","source":"Core Rulebook"},{"n":"Restoration","l":4,"x":"Restores ability damage/drain and negative levels as described by the spell.","oath":false,"save":"Will negates (harmless)","school":"Conjuration (healing)","castingTime":"3 rounds","components":"V, S, M (diamond dust worth 100 gp or 1,000 gp)","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes (harmless)","effect":"This spell functions like lesser restoration but also dispels temporary negative levels or one permanent negative level. It cures all temporary ability damage, and it restores all points permanently drained from a single ability score, plus eliminates fatigue and exhaustion.","source":"Core Rulebook"},{"n":"Resist Energy","l":1,"x":"Grants resist energy 10 (20 at CL 7, 30 at CL 11) against one chosen energy type, protecting the subject's gear as well. Note: this is the same spell whether prepared as the normal 2nd-level version or as the Oath Against Fiends/Oath of the Crusade 1st-level oath spell; the saving throw is identical either way.","oath":true,"save":"Fortitude negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"10 min./level","sr":"yes (harmless)","effect":"This abjuration grants a creature limited protection from damage of whichever one of five energy types you select: acid, cold, electricity, fire, or sonic. The subject gains resist energy 10 against the energy type chosen, meaning that each time the creature is subjected to such damage (whether from a natural or magical source), that damage is reduced by 10 points before being applied to the creature's hit points. The value of the energy resistance granted increases to 20 points at 7th level and to a maximum of 30 points at 11th level. The spell protects the recipient's equipment as well.\n\nResist energy absorbs only damage. The subject could still suffer unfortunate side effects.\n\nResist energy overlaps (and does not stack with) protection from energy. If a character is warded by protection from energy and resist energy, the protection spell absorbs damage until its power is exhausted.","source":"Core Rulebook"},{"n":"Detect Thoughts","l":2,"x":"Over 3 rounds of concentration, detects the presence of conscious minds, then their number and Intelligence scores, then lets you read their surface thoughts (resistable with a Will save).","oath":true,"save":"Will negates; see text","school":"Divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a copper piece)","range":"60 ft.","target":"area: cone-shaped emanation","duration":"concentration, up to 1 min./level (D)","sr":"no","effect":"You detect surface thoughts. Information revealed depends on study duration.\n\n1st Round: Presence or absence of thoughts (from conscious creatures with Intelligence scores of 1 or higher).\n\n2nd Round: Number of thinking minds and the Intelligence score of each. If the highest Intelligence is 26 or higher (and at least 10 points higher than your own Intelligence score), you are stunned for 1 round and the spell ends.\n\n3rd Round: Surface thoughts of any mind in the area. A target's Will save prevents you from reading its thoughts, and you must cast detect thoughts again to have another chance. Creatures of animal intelligence (Int 1 or 2) have simple, instinctual thoughts.\n\nThe spell penetrates barriers except stone (1 ft.), common metal (1 in.), lead sheets, or wood/dirt (3 ft.).","source":"Core Rulebook"},{"n":"Invisibility Purge","l":3,"x":"Creates a spherical field (5 ft radius per caster level) that negates all forms of invisibility within it.","oath":true,"save":"none","school":"Evocation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 min./level (D)","sr":"no","effect":"You surround yourself with a sphere of power with a radius of 5 feet per caster level that negates all forms of invisibility. Anything invisible becomes visible while in the area.","source":"Core Rulebook"},{"n":"Plane Shift","l":4,"x":"Moves yourself or another creature (up to 8 linked-hand willing creatures at once) to another plane of existence, typically arriving 5-500 miles off target.","oath":true,"save":"Will negates","school":"Conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, F (a forked metal rod attuned to the plane of travel)","range":"touch","target":"target: creature touched, or up to eight willing creatures joining hands","duration":"instantaneous","sr":"yes","effect":"You relocate yourself or another creature to a different plane of existence or alternate dimension. When multiple willing individuals join hands in a circle, up to eight can travel together via this spell. Arrival location precision proves nearly impossible; when departing the Material Plane for another, you materialize 5 to 500 miles (5d%) from your intended destination. The spell transports creatures instantly then concludes. The creatures need to find other means if they are to travel back (including casting plane shift again).","source":"Core Rulebook"},{"n":"Animal Purpose Training","l":1,"x":"Overrides an animal's general purpose training (e.g. combat, guard, riding) with a new one for the duration; original training and tricks return when the spell ends.","oath":false,"save":"none","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 minute","components":"V, S, M (a swatch of black cloth)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one indifferent or friendly animal","duration":"1 hour/level","sr":"yes","effect":"The spell imbues a target animal with a specific purpose drawn from the Handle Animal skill options (fighting, guarding, heavy labor, hunting, performance, or riding, but not combat training). This newly instilled purpose overrides any previously trained purpose or existing tricks. Upon the spell's conclusion, the animal returns to its original trained purpose and known tricks.","source":"Advanced Class Guide"},{"n":"Aspect of the Nightingale","l":1,"x":"Grants a clear, pleasant voice for bonuses to Perform and Diplomacy checks, and lets you reroll once per minute a saving throw against a charm effect that allows one.","oath":false,"save":"none","school":"Transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 minute/level","sr":"no","effect":"You take on an aspect of a nightingale. Your voice becomes clear and pleasant. You gain a +2 competence bonus on Perform (sing) checks and a +2 competence bonus on Diplomacy checks. Once per minute, if you are subject to a charm effect that allows a saving throw, you may roll twice and take the more favorable result.","source":"Inner Sea Gods"},{"n":"Bed of Iron","l":1,"x":"Lets the touched creature sleep comfortably in medium or heavy armor without suffering fatigue the next day.","oath":false,"save":"Fort negates (harmless)","school":"Necromancy","castingTime":"1 standard action","components":"V, S, M (a feather or swatch of soft fabric)","range":"touch","target":"target: one creature touched/level","duration":"8 hours","sr":"yes (harmless)","effect":"This spell makes even the clunkiest armor feel soft as silk to the wearer. The subjects of this spell are able to sleep comfortably in medium or heavy armor without suffering from fatigue the following day.","source":"Knights of the Inner Sea"},{"n":"Blessed Fist","l":1,"x":"Target's unarmed strikes count as armed (no attacks of opportunity) and deal lethal or nonlethal damage at will; if already unarmed-capable, they instead gain +1 enhancement and count as good-aligned weapons.","oath":false,"save":"none","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature touched","duration":"1 minute/level","sr":"yes","effect":"The target is considered armed when unarmed and doesn't provoke attacks of opportunity for attacking with unarmed strikes. It may choose whether its unarmed strikes deal lethal or nonlethal damage.\n\nIf the target already possesses the ability to deal damage with unarmed strikes without provoking attacks of opportunity (such as a monk or a creature with Improved Unarmed Strike), its unarmed strikes instead gain a +1 enhancement bonus on attack and damage rolls, and count as good-aligned weapons for the purpose of overcoming damage reduction.","source":"Advanced Class Guide"},{"n":"Blessing of the Watch","l":1,"x":"Functions like bless but only within the caster's home city or areas patrolled by its watch, displaying the worshiped deity's symbol above affected allies.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"50 ft.","target":"area: you and all allies within a 50-ft. burst, centered on you","duration":"1 hour/level","sr":"yes","effect":"This spell functions like bless, except as noted. It works only in the caster's home city, and in areas under the jurisdiction of the city watch. For example, if the watch patrols a shantytown outside the city walls but not the ruined subterranean tunnels that lie beneath the city, the spell works in the former area but not the latter.\n\nThis spell is associated with a particular deity. The caster must worship the associated deity. The symbol of the associated deity appears above the heads of those affected by this spell, making those affected and unaffected by the spell immediately apparent.","source":"Inner Sea Gods"},{"n":"Bowstaff","l":1,"x":"A touched bow becomes rigid enough to be wielded as a melee weapon (shortbow as club, longbow as quarterstaff) while keeping its hit points, hardness, and enhancement bonuses.","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation","castingTime":"1 swift action","components":"V","range":"personal","target":"target: one weapon (bow)","duration":"1 round/level (D)","sr":"yes (harmless, object)","effect":"The bow gains the rigidity and toughness of forged steel, becoming usable as a melee weapon. A shortbow functions as a club; a longbow functions as a quarterstaff. The bow retains its normal hit points and hardness values. Any enhancement bonus applies to melee attack and damage rolls. Weapon special qualities compatible with melee weapons also apply to melee attacks made with the enchanted bow.","source":"Ultimate Combat"},{"n":"Build Trust","l":1,"x":"Grants a +2 circumstance bonus on Charisma checks and Charisma-based skill checks with the target, and lets you reroll a failed one as an immediate action.","oath":false,"save":"Will negates","school":"Divination","castingTime":"1 standard action","components":"V, S, M (a gold piece)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 day/level; see text","sr":"yes","effect":"You perceive the optimal approach for interacting with the target to foster positive regard. You gain a +2 circumstance bonus on all Charisma checks and Charisma-based skill checks when engaging with the target. Additionally, when you fail a Charisma check or skill check with the target, you may reroll it as an immediate action.\n\nAttempting a reroll grants the target a new saving throw to end the spell. The target won't become hostile when the spell ends but loses its newfound trust. Attacking or taking hostile action automatically terminates the spell.","source":"Ultimate Intrigue"},{"n":"Challenge Evil","l":1,"x":"Grants +2 sacred bonus on melee attacks against the target; the target becomes sickened if it hasn't attacked you by the end of its turn, and the spell ends if you move away.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one evil creature","duration":"1 minute/level (D)","sr":"yes","effect":"The caster challenges an evil creature to direct combat, imposing penalties for noncompliance. You gain a +2 sacred bonus on all melee attacks against the subject of the spell. At the end of its turn, if the target has not made at least one attack on you, it becomes sickened. If you move away from the target, the spell ends.","source":"Advanced Player's Guide"},{"n":"Compel Hostility","l":1,"x":"Forces creatures threatening you in melee to attack you instead of your allies if they fail a Will save (or lack SR); a summoner may instead target their own eidolon.","oath":false,"save":"see text","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a drop of your blood)","range":"personal","target":"target: you","duration":"1 round/level","sr":"see text","effect":"Whenever a creature you can see that threatens you makes an attack against one of your allies, as an immediate action, you can compel that creature to attack you instead. When you compel a creature to attack you, you must first overcome that creature's spell resistance, and the creature can attempt a Will saving throw to ignore the compulsion. A summoner casting this spell can choose his eidolon as the target of the spell.","source":"Ultimate Combat"},{"n":"Conditional Favor","l":1,"x":"Cast immediately before another spell on a willing creature; if that creature later violates an attached oath or prohibition, the paired spell (and any healing/conditions it removed) is undone.","oath":false,"save":"none (see below)","school":"Abjuration","castingTime":"1 swift action","components":"V","range":"Consultar manual","target":"target: 1 creature","duration":"1 day/level (D)","sr":"yes","effect":"You must cast this spell immediately before casting another spell on the same creature, eliciting a promise or warning against a behavior and binding the target to the paired spell. If you don't cast a paired spell, conditional favor has no effect. The paired spell must be from the abjuration, conjuration (healing), enchantment, or transmutation school or subschool, and must be cast on a willing creature. If the spell's recipient violates the oath or prohibition while conditional favor remains in effect, the paired spell is undone as if never cast. If the spell was a healing spell, the hit point damage or condition you removed returns immediately, even if the subject has enjoyed subsequent rest or healing. Poisons, diseases, curses, restored ability damage, and negative levels removed by the paired spell return as well.\n\nConditional favor recognizes the spirit of your condition and doesn't trigger a violation due to unintended consequences or circumstances that the subject could not predict with her current knowledge of the situation. For instance, if the prohibition prevented the subject from laying a finger on royalty, touching a disguised prince would not count as a violation if the subject did not recognize the prince, nor would touching a member of royalty while dominated.\n\nThe subject of the spell intuitively knows beforehand whether an action will cause it to lose the paired spell's benefit.","source":"Ultimate Intrigue"},{"n":"Deadeye's Arrow","l":1,"x":"A conjured electricity arrow that either makes a ranged touch attack for 1d6 damage +1/level (max +5), or bursts harmlessly at maximum range as a bright thunderous signal.","oath":false,"save":"none","school":"Evocation (electricity)","castingTime":"1 standard action","components":"V, S, M (one arrow)","range":"medium (100 ft. + 10 ft./level)","target":"effect: arrow of electricity","duration":"instantaneous or 1 round (see text)","sr":"yes","effect":"You create an arrow made of crackling electricity, which you may use for one of two effects.\n\nAttack: You may throw the arrow up to Medium range or fire it from a bow up to the bow's maximum range. Either use is a ranged touch attack. The arrow deals 1d6 points of electricity damage + 1 point per level (maximum +5).\n\nBeacon: You throw or fire the arrow straight up. When it reaches maximum range or a solid surface (such as the roof of a cave) it explodes in a peal of thunder and forms a forked bolt of electricity resembling Erastil's holy symbol, which lingers for 1 round. The thunder and lightning are as loud and bright as natural thunder and lightning, but they do not harm any nearby creatures.","source":"Inner Sea Gods"},{"n":"Detect Charm","l":1,"x":"Functions like detect magic but specifically reveals charm, compulsion, and possession auras within a 60-foot cone, with increasing detail over 3 rounds of concentration.","oath":false,"save":"none","school":"Divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"area: cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","sr":"no","effect":"This divination functions similarly to detect magic but specifically identifies charm, compulsion, and possession effects. The caster immediately perceives the strength and location of each such aura affecting all creatures in the cone. Attempting to identify aura properties requires a Spellcraft check.\n\nAdditionally, the caster may recognize when creatures in range are projecting these effects onto others by succeeding at a Sense Motive check as a standard action (DC = 20 + caster level). Upon success, the caster attempts a Spellcraft check to determine what magic the creature employs, even if the target is not in the area.","source":"Adventurer's Guide"},{"n":"Detect Demon","l":1,"x":"Reveals the presence, then number and power, then exact location of demons and Abyssal-corrupted creatures/taint over 3 rounds of concentration.","oath":false,"save":"none (see text)","school":"Divination","castingTime":"1 standard action","components":"V, S, DF","range":"60 ft.","target":"area: cone-shaped emanation","duration":"concentration, up to 10 minutes/level (D)","sr":"no","effect":"The caster senses the presence of a specific kind of evil: demons, their servants, and the Abyss. Information revealed depends on study duration.\n\n1st Round: Presence or absence of demon-subtyped creatures, demon-possessed creatures, creatures affected by demon spells/abilities, or demon-tainted creatures (including tieflings with demonic heritage, abyssal-bloodline sorcerers, succubus gift recipients, creatures with demonic implants, or those with the Demonic Obedience feat). Does not detect chaotic evil non-demons. Also detects portals/passages leading to the Abyss.\n\n2nd Round: Number of evil auras from demon-subtyped creatures and the strongest aura's power. Good-aligned casters become stunned for 1 round if the strongest aura has overwhelming strength (creature HD at least twice the caster's level).\n\n3rd Round: Power and location of each aura, plus demon lord affiliations. Direction is revealed for out-of-sight auras. Demons receive Will saves to resist revealing their affiliations.","source":"Demon Hunter's Handbook"},{"n":"Detect the Faithful","l":1,"x":"Detects worshipers of your deity within a 60-foot cone, revealing presence, then count, then exact location over 3 rounds of concentration.","oath":false,"save":"none","school":"Divination","castingTime":"1 standard action","components":"V, S, DF","range":"60 ft.","target":"area: cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","sr":"no","effect":"This divination allows you to detect worshipers of your deity, including mortal followers and outsider servants. Information revealed depends on concentration duration.\n\n1st Round: Presence or absence of the faithful.\n\n2nd Round: Number of individual faithful in the area.\n\n3rd Round: The exact location of each worshiper. If a fellow worshiper is outside your line of sight, then you discern his direction but not his exact location.\n\nThe spell penetrates most barriers but is blocked by a sheet of lead, 1 foot of stone, 1 inch of common metal, or 3 feet of wood or dirt. Personal faith interpretation determines eligibility, so heretics and splinter cultists still register. Those actively pretending to share your faith also appear as members, making the spell useful for locating potential hidden adherents but unable to independently verify sincerity.","source":"Ultimate Intrigue"},{"n":"Diagnose Disease","l":1,"x":"Reveals whether a creature, object, or area carries a disease/infestation and identifies it, granting +4 on Heal checks to treat a diagnosed creature.","oath":false,"save":"none","school":"Divination","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target or area: one creature, one object, or a 5-ft. cube","duration":"instantaneous","sr":"no","effect":"You determine whether a creature, object, or area carries any sort of disease or infestation (including molds, slimes, and similar hazards), or any exceptional or supernatural effects causing the sickened or nauseated conditions. If there is disease present, you know what disease it is and its effects. If the target is a creature, you gain a +4 bonus on Heal checks to treat the creature's disease. The spell can penetrate many barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"Ultimate Magic"},{"n":"Emblazon Crest","l":1,"x":"Any tabard, tunic, or shield the subject wears or carries displays the subject's chosen coat of arms, regardless of the item's actual appearance.","oath":false,"save":"Will negates (harmless)","school":"Transmutation","castingTime":"1 standard action","components":"S, F (an example of the crest or coat of arms)","range":"touch","target":"target: creature touched","duration":"1 hour/level","sr":"yes (harmless)","effect":"This spell ensures the subject touched is always able to display her proper crest and coat of arms. Any tabard or tunic worn and any shield carried by the subject while this spell is active can be made to display a coat of arms when the spell is cast. For example, even if the subject picks up a different shield, it still displays the subject's crest, regardless of the shield's normal appearance.","source":"Knights of the Inner Sea"},{"n":"Empower Holy Water","l":1,"x":"Empowers 1-3 vials of holy water (scaling with caster level) to deal bonus damage equal to caster level (max +10) to undead on a direct hit, half that on a splash hit.","oath":false,"save":"none (object)","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: one or more vials of holy water","duration":"1 minute/level","sr":"no","effect":"This spell empowers holy water to inflict additional damage against undead foes. The caster can affect one vial at 4th level, two at 8th level, and three at 12th level. When thrown at undead, an empowered vial deals bonus damage equal to caster level (maximum +10) on direct hits, and half that amount (maximum +5) to creatures caught in the splash area. The additional damage is positive energy and does not affect living creatures.","source":"Undead Slayer's Handbook"},{"n":"Enhance Water","l":1,"x":"Transforms water into a middling alcoholic beverage while purging poisons, disease, minerals, and toxins from it.","oath":false,"save":"Fort negates (harmless, object)","school":"Transmutation","castingTime":"1 round","components":"V, S","range":"touch","target":"target: 1 pint of water/level","duration":"instantaneous","sr":"yes (harmless, object)","effect":"This transmutation converts water into drinkable alcoholic beverages like ale, beer, mead, or wine of moderate quality. The spell simultaneously purifies the liquid by eliminating poisons, diseases, minerals, and toxins. The amount of contaminants present correlates to the beverage's color and body - darker ale or fuller-bodied wine indicates greater impurities - though alcohol content remains constant regardless. The spell cannot affect unholy water, potions, or other magically-imbued liquids.","source":"Inner Sea Gods"},{"n":"Firebelly","l":1,"x":"Grants fire resistance 5 and lets you breathe a 15-foot cone of flame for 1d4 fire damage as a standard action, each use shortening the spell's remaining duration by 1 minute.","oath":false,"save":"Reflex half; see text","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 minute/level","sr":"yes; see text","effect":"A magical fire warms your belly, granting you fire resistance 5 and making your gut hot to the touch (but not enough to damage you or anything else). As a standard action, you can breathe a 15-foot cone of flame that deals 1d4 points of fire damage (Reflex half, SR applies). Each time you use this breath weapon, reduce the remaining duration of the spell by 1 minute.","source":"Inner Sea Gods"},{"n":"Ghostbane Dirge","l":1,"x":"Makes an incorporeal target semi-physical, so it takes half damage from nonmagical attacks but full damage from magic weapons and effects.","oath":false,"save":"Will negates","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (an old reed from a wind instrument)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one incorporeal creature","duration":"1 round/level","sr":"yes","effect":"The target coalesces into a semi-physical form for a short period of time. While subject to the spell, the incorporeal creature takes half damage (50%) from nonmagical attack forms, and full damage from magic weapons, spells, spell-like effects, and supernatural effects.","source":"Advanced Player's Guide"},{"n":"Grace","l":1,"x":"Your movement provokes no attacks of opportunity until the end of your turn.","oath":false,"save":"none","school":"Abjuration","castingTime":"1 swift action","components":"V","range":"personal","target":"target: you","duration":"see text","sr":"no","effect":"Until the end of your turn, your movement does not provoke attacks of opportunity.","source":"Advanced Player's Guide"},{"n":"Guardian Armor","l":1,"x":"Teleports your worn armor onto a same-size, same-shape ally within range, instantly equipping them with its benefits; their prior armor falls harmlessly aside.","oath":false,"save":"none","school":"Conjuration (teleportation)","castingTime":"1 immediate action","components":"V, S, F (armor worn)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one willing creature; see below","duration":"instantaneous","sr":"yes","effect":"This spell teleports the suit of armor you are wearing off of your body and onto an ally within range; the target must be the same size and general shape as you. This armor appears on the target's body fully formed and properly donned, granting the creature the immediate benefit of its protection. If the target of guardian armor was already wearing armor, the armor it was wearing is removed from the target's body and falls undamaged into an adjacent square.","source":"Armor Master's Handbook"},{"n":"Haze of Dreams","l":1,"x":"Fills the target's mind with waking dreams, halving its speed for the duration; doesn't stack with itself or with slow.","oath":false,"save":"Will negates","school":"Enchantment (charm) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, M (pinch of sand)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round/level","sr":"yes","effect":"The caster fills an enemy's mind with waking dreams, reminding them of pleasures, delights, and terrors from the dream world. While affected, the target moves at half its normal speed (rounded down to the next 5-foot increment), which affects jumping distance as normal for decreased speed. Multiple applications of this spell do not stack with each other, nor does this spell stack with the slow spell.","source":"Inner Sea Gods"},{"n":"Hedging Weapons","l":1,"x":"Summons floating force weapons granting +1 deflection bonus to AC per weapon (max +5); each can be thrown as a ranged attack for 2d6 force damage, reducing the AC bonus and disappearing.","oath":false,"save":"none","school":"Abjuration [force]","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 minute/level (D)","sr":"no","effect":"A manifestation of divine force takes weapon form and hovers nearby. The weapon resembles your deity's preferred armament (or a simple weapon of personal significance if you lack a deity). You initially gain one weapon, gaining additional weapons at 6th caster level and every four levels thereafter, to a maximum of five weapons at 18th level.\n\nThese hovering weapons provide a +1 deflection bonus to AC for each weapon summoned (maximum +5 at 18th level). As a standard action, you may seize and hurl any weapon at visible targets within 30 feet. Successful strikes inflict 2d6 points of force damage. The weapons maintain standard threat ranges and critical multipliers for their type but possess no additional special properties. Force damage bypasses damage reduction entirely.\n\nEach thrown weapon reduces your AC deflection bonus by one point and vanishes after striking. The spell ends once all weapons have been expended.","source":"Horror Adventures"},{"n":"Hero's Defiance","l":1,"x":"The instant before you'd drop to 0 or fewer hit points, lets you expend a lay on hands use to heal yourself (plus 1d6 extra) and remain conscious if it brings you above 0 hp.","oath":false,"save":"none","school":"Conjuration [healing]","castingTime":"1 immediate action","components":"V","range":"personal","target":"target: you","duration":"instantaneous","sr":"no","effect":"The instant before you are reduced to 0 or fewer hit points, you can expend a use of your lay on hands ability to heal yourself as if you had used lay on hands, plus an additional 1d6 hit points. If this healing brings your hit point total above 0 hit points, you do not fall, and may continue to act. If you have no more uses of lay on hands, this spell has no effect.","source":"Advanced Player's Guide"},{"n":"Honeyed Tongue","l":1,"x":"Lets you roll twice and keep the higher result on Diplomacy checks to shift attitude, or gain a +5 competence bonus on Diplomacy checks to gather information.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, M/DF (a drop of honey)","range":"personal","target":"target: you","duration":"10 minutes/level","sr":"no","effect":"The spell enhances diplomatic abilities. While active, you roll twice for any Diplomacy check made to alter a creature's attitude and use the higher result. If the roll is low enough to reduce attitude by a step, the creature perceives magical manipulation. Alternatively, you can cast this spell before making a Diplomacy check to gather information, receiving a +5 competence bonus on the check.","source":"Advanced Player's Guide"},{"n":"Horn of Pursuit","l":1,"x":"Creates the sound of a large hunting horn audible up to 2 miles, letting you send simple coded messages via short or long notes.","oath":false,"save":"none","school":"Evocation [sonic]","castingTime":"1 standard action","components":"S","range":"personal","target":"effect: 3 peals of a horn","duration":"1 round","sr":"no","effect":"You create the sound of a large hunting horn, blowing up to three notes as loud as a roaring dragon. These notes can be heard up to 2 miles away in typical outdoor conditions. You can make these sounds at any point during the spell's duration as a free action, and each sounding can be short or long, allowing you to send very simple coded messages.","source":"Ultimate Magic"},{"n":"Ironbeard","l":1,"x":"Grows a stiff iron beard granting +1 armor bonus to AC (stacking with worn armor) that counts as cold iron, but imposes a 20% arcane spell failure chance.","oath":false,"save":"Fort negates (harmless)","school":"Transmutation","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: creature touched","duration":"1 minute/level","sr":"yes (harmless)","effect":"This spell causes a brushy beard of stiff iron to erupt from the face of a willing target. The ironbeard grants a +1 armor bonus to
