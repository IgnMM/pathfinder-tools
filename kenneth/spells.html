(a dove's heart)","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes (harmless)","effect":"The caster transfers afflictions like curses, diseases, and poisons from a touched creature to themselves. This includes the blinded, deafened, fatigued, nauseated, shaken, and sickened conditions. All transferred affliction aspects (save DCs, duration, removal conditions) remain unchanged but now affect the caster instead. Once transferred, the caster may cure the affliction through any available means.","source":"Champions of Purity"},{"n":"Angelic Aspect","l":3,"x":"Grants darkvision 60 ft, acid and cold resistance 10, DR 5/evil, white feathered wings for 30-ft flight, and good-aligned weapons for overcoming DR.","oath":false,"save":"none","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 minute/level (D)","sr":"no","effect":"Functions as lesser angelic aspect, except you instead gain low-light vision, darkvision 60 feet, resistance to acid and cold 10, and DR 5/evil, plus white feathered wings enabling 30-foot flight with average maneuverability. Your natural weapons and any weapons you wield are considered good-aligned for the purpose of overcoming damage reduction.","source":"Champions of Purity"},{"n":"Archon's Aura","l":3,"x":"Grants an aura like an archon's aura of menace; hostile creatures within 20 feet take -2 on attacks, saves, and AC until they hit you or succeed on a Will save, and cannot be affected again by that casting.","oath":false,"save":"Will negates","school":"Evocation [good, lawful]","castingTime":"1 standard action","components":"V, S","range":"20 ft.","target":"area: 20-ft. radius centered on you","duration":"1 minute/level","sr":"yes","effect":"The caster gains a powerful aura resembling an archon's aura of menace. Any hostile creature within the 20-foot radius must succeed at a Will save or suffer a -2 penalty on attack rolls, saving throws, and Armor Class for the spell's duration. This penalty ends when the affected creature successfully hits the caster with an attack. Once a creature resists or breaks the effect, it cannot be affected by that specific casting again.","source":"Ultimate Magic"},{"n":"Aura of Inviolate Ownership","l":3,"x":"Increases the DC to steal or palm the target's attended items by 20 and grants +20 to CMD against disarm and steal maneuvers.","oath":false,"save":"Fort negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","sr":"yes (harmless)","effect":"This magic enhances protection for items a creature carries. The DC of Sleight of Hand checks to remove items warded by the spell is increased by 20, and affected creatures gain a +20 bonus to their CMDs against disarm and steal combat maneuvers.","source":"Melee Tactics Toolbox"},{"n":"Bestow Auras","l":3,"x":"Transfers one or more of your paladin/antipaladin auras to another creature as their center point, while you keep the aura's personal benefit.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 minute/level (D)","sr":"yes","effect":"The caster transfers one or more of their paladin or antipaladin auras to another creature. The caster retains personal aura benefits but the target becomes the aura's center. For instance, transferring aura of courage means the caster stays fear-immune while the target gains the +4 morale bonus on fear saves. Transferred auras function only when their recipient is conscious if that's an original requirement. If an aura requires expending ability uses, the target must possess and expend that ability. Auras affecting only the caster cannot be transferred.","source":"Advanced Class Guide"},{"n":"Blade of Bright Victory","l":3,"x":"Grants your divine bond weapon the ghost touch property, lets you change its damage type as a swift action, and adds a sacred bonus (half caster level) to CMD against disarm and sunder.","oath":false,"save":"Will negates (harmless)","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: your paladin bonded weapon","duration":"1 minute/level","sr":"no","effect":"The caster strengthens their divine bond weapon, granting it the ghost touch property. The weapon's damage type (bludgeoning, piercing, or slashing) can be changed as a swift action. Additionally, the caster gains a sacred bonus to their Combat Maneuver Defense against disarm and sunder attacks targeting the bonded weapon, with the bonus equaling half the caster level.","source":"Ultimate Magic"},{"n":"Blessing of the Mole","l":3,"x":"Grants the targets darkvision 30 feet and a +2 competence bonus on Stealth checks.","oath":false,"save":"none (harmless)","school":"Transmutation","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"area: 1 creature/level","duration":"1 minute/level","sr":"yes (harmless)","effect":"The spell grants recipients two benefits: first, they obtain darkvision extending to 30 feet, enabling sight in darkness. Second, they receive a +2 competence bonus applied to Stealth checks, making them more adept at moving undetected.","source":"Ultimate Magic"},{"n":"Burst of Speed","l":3,"x":"Grants +20 feet to speed (+10 in medium/heavy armor) until the end of your turn, with movement that provokes no attacks of opportunity and can pass through larger creatures' spaces.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 swift action","components":"V","range":"personal","target":"target: you","duration":"see text","sr":"no","effect":"Until the end of your turn, you gain a +20-foot bonus to speed (or +10-foot bonus if you are wearing Medium or Heavy armor), your movement does not provoke attacks of opportunity, and you can move through the space of creatures that are larger than you are, but you cannot end your movement this round in a space occupied by a creature.","source":"Ultimate Combat"},{"n":"Damnation","l":3,"x":"Deals holy damage in a 30-ft burst based on the highest-level evil spell known or affecting each enemy present.","oath":false,"save":"Will half","school":"Evocation [good]","castingTime":"1 standard action","components":"V, S, M/DF (a drop of holy water)","range":"0 ft. (self-centered burst; no separate range line)","target":"area: 30-ft.-radius burst centered on you","duration":"instantaneous","sr":"yes","effect":"Casters pass judgment on enemies' intentions and inflict holy damage. Each creature in the area takes 1d8 points of damage per spell level, determined by the most powerful effect with the evil descriptor either affecting that creature or in its spell repertoire. Prepared spellcasters take damage based on their highest-level prepared evil spell that day, even if already cast. Spontaneous casters take damage based on the highest-level evil spell known, regardless of remaining slots. Creatures with evil spell-like abilities take damage based on their highest-level evil ability. Non-casting creatures benefiting from evil spells take damage based on the highest-level evil spell currently affecting them. Creatures subject to harmful evil spell effects are unaffected unless they voluntarily accepted those effects.","source":"Horror Adventures"},{"n":"Daybreak Arrow","l":3,"x":"Enchants ammunition so struck creatures suffer bright-light penalties for 1 round (plus 1d6 extra damage to undead/light-vulnerable creatures), and the projectile glows like a sunrod for 1 round after firing.","oath":false,"save":"Fort negates (harmless, object)","school":"Evocation [light]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: up to 50 pieces of ammunition, all of which must be together at the time of casting","duration":"10 minutes/level","sr":"yes (harmless, object)","effect":"The caster infuses ammunition with radiant energy. Creatures penalized in bright light suffer those penalties for 1 round after being struck. Undead and sunlight-harmed creatures take an extra 1d6 damage. This extra damage and half of any other damage dealt bypasses damage resistance. Each projectile sheds light as a sunrod for 1 round after being fired or thrown.","source":"Ultimate Combat"},{"n":"Deadly Juggernaut","l":3,"x":"Grants a stacking +1 luck bonus (max +5) on melee attack/damage rolls, Strength checks, and DR 2/- (max 10/-) for each qualifying foe (HD within 4 of yours) you kill in melee.","oath":false,"save":"none","school":"Necromancy [death]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 minute/level","sr":"no","effect":"With every enemy life you take, you become increasingly dangerous and difficult to stop. During the duration of the spell, you gain a cumulative +1 luck bonus on melee attack rolls, melee weapon damage rolls, Strength checks, and Strength-based skill checks as well as DR 2/- each time you reduce a qualifying opponent to 0 or fewer hit points (maximum +5 bonus and DR 10/-) with a melee attack. A qualifying opponent has a number of Hit Dice equal to or greater than your Hit Dice minus 4.","source":"Ultimate Combat"},{"n":"Delay Poison, Communal","l":3,"x":"Functions like delay poison, except the duration is divided in 1-hour intervals among the creatures touched.","oath":false,"save":"Fortitude negates (harmless)","school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creatures touched","duration":"1 hour/level","sr":"yes (harmless)","effect":"This spell functions like delay poison, except you divide the duration in 1-hour intervals among the creatures touched.","source":"Core Rulebook"},{"n":"Detect Anxieties","l":3,"x":"Functions like detect thoughts but reveals creatures' anxieties, Wisdom scores, and fear conditions over 3 rounds, granting a bonus to Intimidate a creature with its own anxiety.","oath":false,"save":"Will negates (see text)","school":"Divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a medallion)","range":"60 ft.","target":"area: cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","sr":"no","effect":"This divination operates similarly to detect thoughts but targets anxiety instead. The caster senses significant anxieties from creatures with Intelligence 1 or higher, whether conscious or not.\n\nIn the second round of concentration, the caster learns each mind's Wisdom score and fear condition (shaken, frightened, panicked, cowering, or paralyzed with fear). If the highest Wisdom score is 26+ and at least 10 points higher than the caster's own, the caster becomes stunned for 1 round and the spell ends.\n\nThe third concentration round reveals each creature's most pressing current anxiety (allowing a Will save). Knowledge of a creature's anxiety grants the caster a +2 bonus (or higher, at the GM's discretion) on checks to Intimidate that creature.","source":"Core Rulebook"},{"n":"Detect Desires","l":3,"x":"Functions like detect thoughts but reveals creatures' Charisma scores and most pressing desires over several rounds of concentration.","oath":false,"save":"Will negates (see text)","school":"Divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a medallion)","range":"60 ft.","target":"area: cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","sr":"no","effect":"This divination functions similarly to detect thoughts, but perceives significant desires of any creature with an Intelligence score of 1 or higher, whether conscious or not.\n\nRound two of concentration reveals each mind's Charisma score. Should the highest Charisma score be 26+ (and at least 10 points higher than the caster's), the caster becomes stunned for one round and the spell terminates.\n\nRound three of concentration reveals the most pressing current desire of any mind in the area (Will negates).\n\nWhen presented an opportunity to fulfill a significant desire, the caster gains a +2 circumstance bonus (or higher, at the GM's discretion) on Diplomacy checks to influence that creature.","source":"Core Rulebook"},{"n":"Divine Transfer","l":3,"x":"Heals the touched target up to your Constitution score in hit points (not exceeding its max) and grants it DR against evil equal to your Charisma bonus for the duration.","oath":false,"save":"Fortitude negates (harmless)","school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: living creature touched","duration":"1 round/level","sr":"yes (harmless)","effect":"With a touch, you transfer life essence to a subject, providing hit points and resolve. You may transfer up to a number of hit points equal to your Constitution score to the target. These hit points heal the subject but cannot exceed its normal hit point maximum. Additionally, the subject gains damage reduction/evil equal to your Charisma bonus (if any) throughout the spell's duration.","source":"Advanced Player's Guide"},{"n":"Draconic Malice","l":3,"x":"Creates a 10-ft aura that strips fear/mind-affecting immunity from creatures within it when targeted by your fear effects or Intimidate checks; doubles the antipaladin aura of cowardice penalty if you have it.","oath":false,"save":"Will negates (harmless)","school":"Enchantment [draconic]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you; effect: 10-foot aura centered on you","duration":"1 minute/level","sr":"no","effect":"You surround yourself with a palpable aura of draconic fear and dread. Living creatures within this aura that are normally immune to fear or mind-affecting abilities lose those immunities against your spells, spell-like abilities, and supernatural abilities that create fear effects, as well as any Intimidate checks you attempt to demoralize foes. If you have the antipaladin aura of cowardice class feature, this spell instead changes the penalty imposed by aura of cowardice to -6 for its duration.","source":"Legacy of Dragons"},{"n":"Fire of Judgment","l":3,"x":"Your next smite evil engulfs the target in positive-energy flames dealing 1d6 (1d10 vs. evil outsiders/dragons/undead) each turn, plus an extra 1d6/1d10 if it attacks someone other than you, unless it saves to limit the effect to 1 round.","oath":false,"save":"Will partial","school":"Evocation","castingTime":"1 swift action","components":"V, S","range":"special; see text","target":"target: one creature","duration":"1 round/level","sr":"yes","effect":"After casting this spell, the next creature you attack using your smite evil class ability becomes engulfed in flames of positive energy. At the start of its turn, the target takes 1d6 points of damage, and takes an additional 1d6 points of damage each time it attacks a creature other than you.\n\nFor outsiders with the evil subtype, evil-aligned dragons, or undead creatures, this damage increases to 1d10. A successful Will save limits the spell's duration to only 1 round. The damage is divine in nature and bypasses any damage reduction the creature possesses.","source":"Advanced Player's Guide"},{"n":"Ghostbane Dirge, Mass","l":3,"x":"Functions as ghostbane dirge, except it affects one incorporeal creature per level, no two of which can be more than 30 feet apart.","oath":false,"save":"Will negates","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (an old reed from a wind instrument)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one incorporeal creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","sr":"yes","effect":"This spell functions as ghostbane dirge, except that it affects multiple targets. (Ghostbane dirge: the target coalesces into a semi-physical form for a short period of time. While subject to the spell, the incorporeal creature takes half damage (50%) from nonmagical attack forms, and full damage from magic weapons, spells, spell-like effects, and supernatural effects.)","source":"Advanced Player's Guide"},{"n":"Firewalker's Meditation","l":3,"x":"Grants DR 5/magic, fire resistance 10, and +4 on saves against pain effects, expendable as an immediate action to boost to DR 10/magic, fire resistance 30, and pain immunity for 3 rounds.","oath":false,"save":"none","school":"Abjuration [meditative]","castingTime":"1 hour","components":"V, M (soothing incense worth 400 gp)","range":"personal","target":"target: you","duration":"24 hours or until discharged","sr":"no","effect":"You focus your mind on blocking out pain, allowing your body to endure punishments that would be otherwise unbearable. While under the effects of this spell, you continue to register pain; you simply don't suffer the deleterious effects such sensations bring.\n\nThe spell grants DR 5/magic, resist fire 10, and a +4 bonus on saving throws against pain effects. It prevents 10 points of damage per caster level (max 100). As an immediate action when taking affected damage, you can expend remaining duration for DR 10/magic, resist fire 30, and immunity to pain effects lasting 3 rounds, after which the spell ends.","source":"Divine Anthology"},{"n":"Guardian Monument, Lesser","l":3,"x":"Grants DR 2/magic to humans within 40 feet (60 if the touched object is a monument to human achievement), retained even if they leave and return.","oath":false,"save":"Will negates (harmless)","school":"Abjuration","castingTime":"1 full round","components":"V, S, F (an unattended, non-magical object)","range":"touch","target":"area: 40-ft. radius from touched object or 60-ft. radius from touched object; see text","duration":"1 hour/level","sr":"yes","effect":"You touch an unattended, non-magical object to create a touchstone for humans defending the area. Such human defenders are protected by a shimmering aura as long as they are in the area.\n\nThe spell grants each subject damage reduction 2/magic. Humans who leave the area and reenter regain the damage reduction.\n\nThe spell is suppressed if the object is moved from its place, but resumes if the object is put back. Its duration continues to elapse while it is suppressed this way.\n\nNormally, the area of effect is 40 feet from the touched object.\n\nIf the touched object is a monument to human achievement, the area increases to a 60-foot radius.","source":"Arcane Anthology"},{"n":"Heroic Fortune","l":3,"x":"Grants the target one hero point, usable before any it already has, lost if unspent when the spell ends.","oath":false,"save":"Will negates (harmless)","school":"Evocation","castingTime":"1 standard action","components":"V, S, DF, M (diamond dust worth 100 gp)","range":"touch","target":"target: creature touched","duration":"1 round/level","sr":"no","effect":"This spell grants 1 hero point to the target. This hero point must be spent before the duration expires, or it is lost. The bonus hero point is spent before any other hero points the target might possess.","source":"Advanced Player's Guide"},{"n":"Holy Whisper","l":3,"x":"Sickens evil creatures in a cone unless they save (evil outsiders, evil dragons, and undead also take 2d8 damage on a failure); good creatures in the area get +2 sacred bonus on attack and damage for 1 round.","oath":false,"save":"Fortitude negates; see text","school":"Evocation [good]","castingTime":"1 standard action","components":"V, S","range":"30 ft.","target":"area: cone-shaped burst","duration":"instantaneous","sr":"yes","effect":"You whisper a primordial word of good that harms evil beings and strengthens good ones. Evil creatures in the burst must make a Fortitude save or become sickened for 1 round per caster level. Evil outsiders with the evil subtype, evil-aligned dragons, and undead additionally take 2d8 damage if they fail saves. Good-aligned creatures gain a +2 sacred bonus to attack and damage rolls for 1 round.","source":"Advanced Player's Guide"},{"n":"Litany of Escape","l":3,"x":"Extracts an ally from a grapple, removing the grappled/pinned conditions and teleporting them 10 feet away (fails if no space is available).","oath":false,"save":"no","school":"Conjuration (teleportation) [language-dependent]","castingTime":"1 swift action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one willing creature that is grappled","duration":"instantaneous","sr":"yes","effect":"With a powerful prayer, you call upon the servants of your god to whisk a friend out of a grapple. The target loses the grappled and pinned conditions and is teleported 10 feet. If there is no available space for the target to teleport to, the spell fails.","source":"Ultimate Combat"},{"n":"Litany of Sight","l":3,"x":"Lets you perceive invisible creatures and objects within 30 feet; the target cannot be affected by another 'litany' spell while active.","oath":false,"save":"no","school":"Divination","castingTime":"1 swift action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 round","sr":"yes","effect":"This divination spell allows you to perceive hidden creatures. You can see invisible creatures and objects within 30 feet. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Mantle of Calm","l":3,"x":"Surrounds you with calming energy giving enemies +2 on saves against your spells (and you -2 on attack rolls); raging creatures that strike you must save or have their rage end.","oath":false,"save":"none and Will negates (see text)","school":"Enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"personal","target":"target: you","duration":"1 round/level (D)","sr":"no and yes (see text)","effect":"You surround yourself with a mantle of calm serenity. You take a -2 penalty on attack rolls, and opponents gain a +2 bonus on saving throws against spells you cast. Any creature affected by a rage effect (barbarian's rage, bloodrager's bloodrage, blood rage monster ability, rage spell, skald's inspired rage raging song, and so on) that strikes you with a melee attack must attempt a Will saving throw, without the rage effect's bonus to Will; failure means the rage effect ends (as if it were dispelled or the creature voluntarily ended it, as appropriate).\n\nIf you become affected by a rage effect while this spell is active, this spell immediately ends. If your rage effect comes from a skald's raging song, then it ends only for you, and you cannot re-accept the effects of the song.","source":"Advanced Class Guide"},{"n":"Marks of Forbiddance","l":3,"x":"Brands one enemy and one ally; either must succeed at a Will save to attack the other (including targeted spells), wasting the action on failure, though area effects bypass the restriction.","oath":false,"save":"Will negates; see text","school":"Abjuration [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one enemy and one ally","duration":"1 round/level","sr":"yes","effect":"The caster magically brands two creatures to prevent violence between them. Upon casting, one enemy and one ally within range become marked with a forbiddance sigil. Throughout the spell's duration, any attempt by either target to attack the other, including targeted spells, requires a Will save. A successful save allows the attack to proceed normally, while a failed save prevents the attack and wastes the action. The spell does not restrict area of effect attacks between the two branded creatures.","source":"Advanced Player's Guide"},{"n":"Positive Pulse, Greater","l":3,"x":"Functions like positive pulse, but deals 3d6 + caster level damage to undead/haunts and grants living creatures a +8 bonus against the relevant effects for 1 round.","oath":false,"save":"Will negates or Will negates (harmless); see text","school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"area: 15-ft.-radius burst","duration":"instantaneous plus 1 round (see text)","sr":"yes","effect":"This spell functions like positive pulse, except that the damage dealt increases to 3d6 plus your caster level, and the bonus on saving throws increases to +8.","source":"Planar Adventures"},{"n":"Resilient Reservoir","l":3,"x":"Stores 1 point per melee/touch-spell hit you take (up to caster level) that can be spent as an immediate action for an insight bonus on a check/attack/damage/CMB roll; if you drop to negative hp while charged, it releases as a 15-ft blast dealing 1d6 per 2 points (max 10d6).","oath":false,"save":"none (see below)","school":"Transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"area: special, see text","duration":"1 round/level","sr":"yes","effect":"This spell creates a magical reservoir that stores damage from melee and touch attacks. Each hit transfers 1 damage point into the pool (capped at caster level, maximum 20). The caster can use an immediate action to spend points before the duration ends, gaining an insight bonus equal to points spent on one skill check, attack roll, damage roll, or combat maneuver check. This can be used once per 5 caster levels (up to four times at 15th level).\n\nIf reduced to negative hit points while affected, the spell automatically releases remaining energy as a concussive blast dealing 1d6 force damage per 2 points remaining (maximum 10d6) in a 15-foot radius. A successful Reflex save halves this damage, and spell resistance applies to this effect.","source":"Advanced Race Guide"},{"n":"Resist Energy, Communal","l":3,"x":"Functions like resist energy, except the duration is divided in 10-minute intervals among the creatures touched.","oath":false,"save":"Fortitude negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creatures touched","duration":"10 min./level","sr":"yes (harmless)","effect":"This spell functions like resist energy, except you divide the duration in 10-minute intervals among the creatures touched.","source":"Core Rulebook"},{"n":"Revenant Armor","l":3,"x":"If the wearer is knocked unconscious or killed, the armor animates as a Medium animated object carrying the body, preventing helplessness and gaining abilities from its material.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 standard action","components":"V, S, F (one suit of armor)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one suit of armor","duration":"1 day/level or 1 hour/level; see below","sr":"no","effect":"When the wearer falls unconscious or dies during combat, the armor animates as a Medium animated object containing the wearer's body. It moves at 20 feet per round with a shambling gait and gains average hit points. Metal armor gains metal animated object abilities. The armor remains standing, grants the wearer non-helpless status, and can be directed by allies to move (though refuses actions requiring skill checks). When grappled, it can attempt escape with Strength equal to caster level and CMB of 1 + caster level + armor's Strength modifier. The spell ends if the wearer is reduced to dust, becomes conscious, or is removed from the armor.","source":"Armor Master's Handbook"},{"n":"Sanctify Armor","l":3,"x":"Grants armor a +1 enhancement bonus per 4 caster levels (max +5), and grants DR 5/evil while using judgment or smite.","oath":false,"save":"Will negates (harmless, object)","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"target: armor touched","duration":"1 minute/level","sr":"yes (harmless, object)","effect":"The spell imbues armor with a righteous aura granting a +1 enhancement bonus per four caster levels, reaching a maximum +5 at 20th level. When the caster uses their judgment or smite ability, they gain DR 5/evil. Regular clothing qualifies as armor for this spell's purposes, despite providing no AC bonus.","source":"Advanced Player's Guide"},{"n":"Sanctify Weapons","l":3,"x":"Lets manufactured weapons in the area bypass the damage reduction of a chosen evil outsider subtype without becoming aligned or changing composition.","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"area: 20-ft.-radius spread","duration":"1 round/level","sr":"yes (harmless, object)","effect":"This spell originated among the armies of Heaven. Choose a specific subtype of evil outsider when you cast this spell, such as daemon, demon, devil, or div. All manufactured weapons in the area of effect bypass the DR of that type of outsider. The weapons do not become aligned or change composition.","source":"Chronicle of the Righteous"},{"n":"Scales of Deflection","l":3,"x":"Surrounds you with draconic imagery so touch attacks against you resolve against your normal AC instead of touch AC; ends after one such attack resolves, at the latest by the end of your next turn.","oath":false,"save":"none","school":"Abjuration [draconic]","castingTime":"1 standard action","components":"V, M (a dragon scale)","range":"personal","target":"target: you","duration":"1 minute/level (see text)","sr":"no","effect":"Brilliant draconic iconography matching your draconic heritage (or a kind of dragon whose alignment matches your own) surrounds you. Any touch attack attempted against you resolves against your normal AC. Once such an attack has been resolved, this spell is dismissed at the end of your next turn.","source":"Legacy of Dragons"},{"n":"Shield of Fortification, Greater","l":3,"x":"Functions as shield of fortification, except the chance to negate a critical hit or sneak attack (rolling damage normally instead) increases to 50%.","oath":false,"save":"Fortitude negates (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"1 minute/level","sr":"yes (harmless)","effect":"This spell functions as shield of fortification, except there is a 50% chance that the critical hit or sneak attack is negated and damage is instead rolled normally, rather than 25%.","source":"Advanced Class Guide"},{"n":"Sky Steed","l":3,"x":"Sprouts angelic wings on the target, granting flight equal to its base speed with average maneuverability plus a Fly check bonus equal to caster level.","oath":false,"save":"Will negates (harmless)","school":"Transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: a creature you are mounted upon","duration":"1 minute/level (D)","sr":"yes (harmless)","effect":"The target sprouts angelic wings and gains a fly speed equal to its base speed with average maneuverability. It also gains a bonus on Fly checks equal to your caster level.","source":"Ultimate Wilderness"},{"n":"Spotlight","l":3,"x":"Creates a mobile bright light on the target that suppresses other light sources within 20 feet, imposing -20 on Stealth and denying darkness-based concealment; a successful save keeps the light stationary instead.","oath":false,"save":"Reflex partial","school":"Evocation [darkness, light]","castingTime":"1 standard action","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"target: one creature","duration":"1 minute/level (D)","sr":"yes","effect":"The caster generates a mobile bright light zone centered on one target while suppressing nearby light sources. The target's space becomes bright light, imposing standard bright light penalties. All mundane light sources and magic light effects of 3rd level or lower within 20 feet are extinguished.\n\nThe spotlight follows the target, imposing a -20 penalty to Stealth checks and negating darkness-based concealment benefits. If the target makes a successful Reflex save, the light remains stationary in the target's original square and only penalizes Stealth checks for creatures occupying that space.","source":"Blood of Shadows"},{"n":"Stunning Barrier, Greater","l":3,"x":"Functions as stunning barrier, except it isn't discharged until it has stunned a number of creatures equal to your caster level.","oath":false,"save":"none and Will negates (see text)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 round/level or until discharged","sr":"no and yes (see text)","effect":"This spell functions as stunning barrier, except as noted above, and it provides a +2 bonus to AC and on saving throws. It is not discharged until it has stunned a number of creatures equal to your caster level.","source":"Advanced Class Guide"},{"n":"Tail Strike","l":3,"x":"Grows (or extends the reach of) a draconic tail granting a tail slam secondary attack for 1d6 damage plus Strength modifier (scaling by size).","oath":false,"save":"none","school":"Transmutation [draconic]","castingTime":"1 standard action","components":"V, M (a dragon scale)","range":"personal","target":"target: you","duration":"1 minute/level (see text)","sr":"no","effect":"The caster develops a draconic tail matching either their bloodline dragon type or alignment. They gain a tail slam attack dealing 1d6 damage (1d4 if Small, 1d8 if Large) plus Strength modifier. If already possessing a tail attack, reach extends 5 feet instead; tail sweep radius increases by 10 feet.\n\nAs a full-attack secondary action, the tail slam is made at base attack bonus -5 with half Strength modifier added to damage. The caster can terminate the spell early using a swift action bestial roar, then attempt an Intimidate check to demoralize foes within 30 feet.","source":"Legacy of Dragons"},{"n":"They Know","l":3,"x":"Convinces the target that another creature knows its darkest secret, compelling it to investigate; if it cannot, it becomes shaken for the duration.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [emotion, fear]","castingTime":"1 standard action","components":"V, S, F/DF, M (a drop of black ink)","range":"medium (100 ft. + 10 ft./level)","target":"target: one intelligent creature","duration":"1 minute/level (D)","sr":"yes","effect":"You instill a target with the fear that the nearest other intelligent creature knows her darkest secret. If she is in the midst of another situation as vital as protecting her darkest secret, such as combat, this doesn't cause her to cease participating, but otherwise, she becomes compelled to use her abilities and skills to determine exactly how much the other individual knows.\n\nEven if she isn't around other creatures or otherwise avoids confronting her paranoia for a time, the nagging fear causes the target to become shaken for the duration of the spell (though this doesn't stack with other fear effects to make the target frightened or panicked).\n\nThe subject's paranoia increases over time, forcing her to take additional steps to protect herself from the other creature. Depending on her personality (or subject to the GM's discretion), she might confess, publicly demand to know what the other creature knows, attack the other creature to silence it, or offer the other creature a bribe.\n\nThe spell fails if the target truly feels she has nothing to hide.","source":"Ultimate Intrigue"},{"n":"Trial By Fire","l":3,"x":"Exposes a touched creature to divine fire dealing 1d6 damage per 2 caster levels (max 5d6, half fire/half divine) if it isn't within one alignment step of your deity; also lets you attempt an Intimidate check against directly opposed targets.","oath":false,"save":"None","school":"Evocation [fire]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: creature touched","duration":"instantaneous","sr":"yes","effect":"The caster exposes a target to divine flames, testing their alignment purity. If the target's alignment differs by more than one step from the caster's deity's alignment, the spell inflicts 1d6 damage per 2 caster levels (maximum 5d6). Half this damage is fire-based, while the other half derives from divine power and cannot be reduced by fire resistance. Additionally, if the target's alignment directly opposes the caster's in any axis (chaos vs. law, or evil vs. good), the caster may attempt an Intimidate check to demoralize the target as a free action.","source":"Spymaster's Handbook"},{"n":"Vigilant Rest","l":3,"x":"Lets a sleeping target retain partial perception, ignoring the usual +10 Perception penalty while asleep and waking as a free action upon detecting a threat.","oath":false,"save":"Will (harmless)","school":"Abjuration","castingTime":"1 standard action","components":"V, S, M (a handful of crushed glass)","range":"touch","target":"target: 1 living creature touched","duration":"8 hours (D)","sr":"yes (harmless)","effect":"While sleeping, the spell's recipient maintains partial awareness of surroundings. She filters out harmless ambient sounds but doesn't receive the typical +10 modifier penalty to Perception checks made while asleep. Upon detecting a genuine threat or unexplained noise, she awakens immediately and stands up as a free action. If she returns to sleep during the spell's duration after being roused, she falls asleep instantly without counting the interruption toward breaking sleep, regardless of any combat that occurred while conscious.","source":"Ultimate Wilderness"},{"n":"Wrathful Mantle","l":3,"x":"Grants a resistance bonus of +1 per 4 caster levels (max +5) on all saves, dismissible as a swift action to deal 2d8 force damage to creatures within 5 feet.","oath":false,"save":"Will negates (harmless)","school":"Evocation [force, light]","castingTime":"1 standard action","components":"V, S, DF","range":"touch or 5 ft.; see text","target":"target: creature touched or all creatures within 5 ft.; see text","duration":"1 minute/level","sr":"yes (harmless)","effect":"A shimmering mantle of light shrouds the subject, light like a torch. The subject of the spell gains a +1 resistance bonus on all saving throws per four caster levels (maximum +5 at 20th level). The subject can end the wrathful mantle at any time as a swift action to deal 2d8 points of force damage to all creatures within 5 feet.","source":"Advanced Player's Guide"},{"n":"Absolution","l":4,"x":"Removes charm and compulsion effects from the target and prevents forced actions from those effects costing it class abilities; cannot reverse alignment changes or restore abilities lost to willing misdeeds.","oath":false,"save":"None","school":"Abjuration","castingTime":"1 round","components":"V, S, M (a vial of holy water), DF","range":"touch","target":"target: living creature touched","duration":"instantaneous","sr":"no","effect":"The spell purges unwanted mental influences and grants the recipient relief through divine forgiveness. It terminates all charm or compulsion effects on the target, including beneficial compulsions like heroism, functioning as break enchantment.\n\nCritically, if charm or compulsion forced actions contrary to the target's alignment, monastic vows, paladin oaths, or similar codes, those forced actions don't result in losing class abilities or divine spellcasting access.\n\nUnlike atonement, this spell cannot reverse alignment shifts, affect willing transgressions, change alignment, or restore lost class abilities from past misdeeds. Success depends on alignment compatibility: automatic if caster and target share alignment or patron deity; 5% per caster level if alignments differ by one step; automatic failure otherwise.","source":"Ultimate Intrigue"},{"n":"Angelic Aspect, Greater","l":4,"x":"Grants darkvision 60 ft, DR 10/evil, immunity to acid/cold/petrification, electricity and fire resistance 10, +4 on poison saves, a protective aura within 20 feet, truespeech, and 60-ft flight wings.","oath":false,"save":"none","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 minute/level (D)","sr":"no","effect":"Functions as angelic aspect, except you instead gain low-light vision, darkvision 60 feet, DR 10/evil, immunity to acid, cold, and petrification, resistance to electricity and fire 10, and a +4 racial bonus on saves against poison. You also gain a protective aura and truespeech as supernatural abilities, and your wings grant 60-foot flight with good maneuverability.","source":"Champions of Purity"},{"n":"Archon's Trumpet","l":4,"x":"All creatures in the area of the burst are paralyzed for 1d4 rounds.","oath":false,"save":"Fort negates","school":"Evocation [good, sonic]","castingTime":"1 standard action","components":"V, S","range":"30 ft.","target":"area: cone-shaped burst","duration":"instantaneous","sr":"yes","effect":"Upon hearing a booming report, as if from a trumpet archon's mighty horn, all creatures in the area of the burst are paralyzed for 1d4 rounds.","source":"Champions of Purity"},{"n":"Ban Corruption","l":4,"x":"Strips all creatures in the emanation of abilities granted by corruptions, which cease to function as if dispelled.","oath":false,"save":"Will negates","school":"Abjuration [good]","castingTime":"1 standard action","components":"V, S, F (a ceremonial dagger)","range":"0 ft. (self-centered burst; no separate range line)","target":"area: 30-ft.-radius emanation centered on you","duration":"concentration plus 1 round/level, up to 1 hour/level","sr":"yes","effect":"You strip all creatures within the emanation of any gifts associated with corruptions. Abilities associated with corruptions cease to function, as if they were magically dispelled.\n\nThe corruption stains still fully affect creatures. A creature that enters the emanation and fails its saving throw loses its gifts until the spell's duration ends, even if it leaves the emanation, but a successful saving throw renders a creature immune to the spell, even if it enters and exits the emanation several times.","source":"Horror Adventures"},{"n":"Banishing Blade","l":4,"x":"Imbues a weapon so its first strike each round triggers a free bull rush (1d20 + caster level); extraplanar creatures with HD up to your caster level pushed back 10+ feet must save or be banished to their home plane.","oath":false,"save":"none and Will partial (see text)","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"effect: one melee weapon","duration":"1 round/level or until discharged","sr":"yes (see text)","effect":"The spell imbues a weapon with pushing force. Each round, the first hit on a creature triggers a free bull rush maneuver check (1d20 + caster level) without provoking attacks of opportunity. The caster need not move to push targets beyond 5 feet. Creatures with spell resistance require a caster level check on first strike; failure makes them immune to this casting.\n\nFor extraplanar creatures whose Hit Dice don't exceed the caster's level, being pushed back 10+ feet forces a Will save. Failure sends the creature home; success or failure staggers it for one round and ends the spell.","source":"Arcane Anthology"},{"n":"Bestow Grace of the Champion","l":4,"x":"Grants the target paladin-like abilities: at-will detect evil, immunity to disease and fear, one use of lay on hands, one smite evil, a Charisma bonus on saves, and the ability to use spellcasting-restricted magic items.","oath":false,"save":"yes (harmless)","school":"Transmutation [good, law]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"target: lawful good creature touched","duration":"1 round/level (see text)","sr":"yes (harmless)","effect":"The caster channels powers of good and law into the recipient, granting temporary paladin-like abilities. The target gains the power to use detect evil at will as a spell-like ability, becomes immune to disease (suppressing current afflictions), and gains immunity to fear (ending current fear effects). The target can use lay on hands once on itself as a paladin of half the caster's level, and can smite evil once as a paladin of half the caster's level. Additionally, the recipient adds its Charisma bonus to all saving throws and can use spell completion, spell trigger, or other magic items requiring spell-casting ability as a paladin would. Any unused abilities disappear when the spell expires. The spell has no effect if cast on an actual paladin.","source":"Ultimate Magic"},{"n":"Blaze of Glory","l":4,"x":"You fall unconscious and unleash a 30-ft burst that heals good creatures (and damages evil creatures) 1d6 per 2 caster levels, while all affected creatures gain the benefits of prayer for 1 round per caster level.","oath":false,"save":"Will partial","school":"Conjuration (healing) [good, mind-affecting]","castingTime":"1 standard action or immediate action; see text","components":"V","range":"0 ft. (self-centered burst; no separate range line)","target":"area: 30-ft.-radius burst centered on you","duration":"instantaneous and 1 round/level; see text","sr":"yes","effect":"The caster falls unconscious while unleashing holy energy affecting all nearby creatures. It may be cast as a standard action (reducing the caster to -1 HP but stable) or as an immediate action when dropped below 0 HP.\n\nGood creatures within range receive healing of 1d6 points of damage per two caster levels. Evil creatures take equivalent damage instead, with successful Will saves reducing this to half. Additionally, all allies and enemies within range are affected as if by the prayer spell for 1 round per caster level.","source":"Advanced Player's Guide"},{"n":"Blessings of Luck and Resolve, Mass","l":4,"x":"Functions like blessings of luck and resolve, except it affects one creature per level, no two of which can be more than 30 feet apart.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature/level, no two of which can be more than 30 ft. apart","duration":"1 minute/level (D), special see below","sr":"yes (harmless)","effect":"This spell works identically to the single-target version but impacts multiple recipients. It grants each affected creature a +2 morale bonus on saving throws against fear effects. Targets with the fearless racial trait become immune to fear instead. When a recipient fails a fear saving throw, they may spend an immediate action to attempt the save again with a +4 morale bonus, accepting the result regardless of outcome.","source":"Advanced Race Guide"},{"n":"Bloodsworn Retribution","l":4,"x":"You cut yourself and swear an oath, taking up to 25 unhealable damage while active, gaining a morale bonus (damage taken / 5) on actions performed to fulfill that oath.","oath":false,"save":"none","school":"Necromancy","castingTime":"1 round","components":"V, S, M (your blood)","range":"personal","target":"target: you","duration":"special (see text)","sr":"no","effect":"When you cast this spell, you cut yourself and swear an oath of retribution on your own blood. You decide how much damage you want to take from this attack, up to 25 points. This damage cannot be healed for as long as the spell is in effect. Anytime you perform an attack, save, or check that is directly related to the oath and brings you closer to the fulfillment of that oath, you gain a morale bonus to that roll equal to the number of hit points of damage you took from the oath divided by 5. The GM is the final arbiter over whether or not an action qualifies for this bonus. When you fulfill the oath (or choose to forsake it), the spell ends, and the lost hit points can be healed as normal.","source":"Dwarves of Golarion"},{"n":"Burst of Glory","l":4,"x":"Allies within a 10-ft radius of you gain +1 sacred bonus on attacks and fear saves plus temporary hit points equal to your level (max 20); you also shed torchlight, dismissible as a free action.","oath":false,"save":"Will negates (harmless)","school":"Enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"0 ft. (self-centered burst; no separate range line)","target":"area: 10-ft.-radius burst, centered on you","duration":"1 round/level (D; see text)","sr":"yes (harmless)","effect":"Allies in the area of this spell at the time of casting gain a +1 sacred bonus on attack rolls and saves against fear effects, plus 1 temporary hit point per caster level (maximum 20). You shine with a white or golden radiance equal to a torch for the spell's duration, though you can dismiss the glow effect as a free action.","source":"Inner Sea Gods"},{"n":"Burst With Light","l":4,"x":"Fills the target with magical light for 2d6 damage (2d8 to undead), making it shed bright light in a 30-ft radius; adjacent creatures that fail a save take half damage and are blinded for 1 round.","oath":false,"save":"see text","school":"Evocation [light]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round/4 levels","sr":"yes","effect":"The target becomes filled with intense magical light, taking 2d6 points of damage as the light bursts from its wounds and orifices (if the target is an undead creature, it instead takes 2d8 points of damage). In addition, the creature radiates bright light in a 30-foot radius and increases the light level by one step for an additional 30 feet beyond that area, darkness becomes dim light, dim light becomes normal light, and normal light becomes bright light.\n\nCreatures that take penalties in bright light take them while within the 30-foot radius of this magical light. A successful Will save halves the damage and negates the light effect.\n\nFor every 4 character levels you possess, the light continues to fill the creature for another round (to a maximum of 5 rounds at 20th level), though the target may make a Will save each round to halve the damage and end the effect. Any creature adjacent to the target that fails its save and takes damage takes half as much damage and is blinded for 1 round. A successful Reflex save halves this damage (to a total of one-quarter the damage taken by the target) and negates the blindness effect.","source":"Demon Hunter's Handbook"},{"n":"Chains of Light","l":4,"x":"Binds a creature in glowing chains of light, paralyzing it (new save each round to break free) and blocking extradimensional travel abilities while bound.","oath":false,"save":"Reflex negates","school":"Conjuration (creation) [good]","castingTime":"1 standard action","components":"V, S, F (a length of fine golden chain)","range":"short (25 ft. + 5 ft./level)","target":"target: one creature","duration":"1 round/level (D)","sr":"no","effect":"A creature targeted by this spell is held immobile by glowing golden chains composed of pure light. The creature is paralyzed and held in place, but may attempt a new saving throw each round to end the effect. While held by the golden chains, a creature cannot use any sort of extradimensional travel, such as astral projection, blink, dimension door, ethereal jaunt, etherealness, gate, maze, plane shift, shadow walk, teleport, and similar spells and spell-like abilities. The spell does not affect creatures that are already in ethereal or astral form when the spell is cast.","source":"Champions of Purity"},{"n":"Companion Transposition","l":4,"x":"Swaps your position with your animal companion, familiar, or spirit animal via teleportation; you're unable to act until your next turn and the companion is staggered until the end of its next turn.","oath":false,"save":"none (harmless)","school":"Conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, F (a feather, tuft of fur, or similar memento from your target)","range":"long (400 ft. + 40 ft./level)","target":"target: yourself and one animal companion, familiar, or spirit animal within range","duration":"instantaneous","sr":"no","effect":"You exchange positions with the other target through teleportation similar to dimension door. Both participants arrive in squares previously occupied by the other, adjusted for size differences if needed. Like dimension door, you cannot act further until your next turn, and the other target becomes staggered until the end of its next turn due to the transposition.","source":"Ultimate Wilderness"},{"n":"Crusader's Edge","l":4,"x":"Grants a melee weapon the bane quality against evil outsiders; a critical hit against one nauseates it for 1d3 rounds (reducible to sickened 1 round with a Fortitude save).","oath":false,"save":"Fort negates","school":"Transmutation [good]","castingTime":"1 standard action","components":"V, S, M (dried blood from an evil outsider, sprinkled on the weapon)","range":"touch","target":"target: melee weapon touched","duration":"1 minute/level","sr":"no","effect":"The spell imbues a melee weapon with holy energy, granting it the bane weapon quality against evil outsiders. When you score a critical hit against an evil outsider, you deal normal critical damage and also nauseate the creature for 1d3 rounds. The outsider can make a Fortitude save to reduce the nauseated condition to sickened for 1 round instead.","source":"Inner Sea Magic"},{"n":"Dimensional Blade","l":4,"x":"Turns a wielded melee weapon flat and two-dimensional, making its attacks melee touch attacks that ignore armor (but not force effects); bludgeoning weapons deal half damage and count as slashing; ends if it leaves your hand.","oath":false,"save":"none","school":"Transmutation","castingTime":"1 swift action","components":"V, S","range":"personal","target":"target: you","duration":"1 round","sr":"no","effect":"This transmutation flattens a melee weapon you hold into a two-dimensional form while remaining wieldy. The resulting blade becomes a touch attack that bypasses standard armor but remains subject to force-based defenses like mage armor. Bludgeoning weapons suffer half damage and gain slashing properties under this effect. Should you release the weapon, the spell immediately terminates.","source":"Melee Tactics Toolbox"},{"n":"Eaglesoul","l":4,"x":"Infuses you with a good outsider's power, granting Perception/initiative bonuses and constant detect evil, plus an activatable surge granting AC/Strength bonuses, energy resistance, fast healing, and automatic critical confirmation against evil foes.","oath":false,"save":"none","school":"Conjuration (summoning) [good]","castingTime":"1 standard action","components":"V, S, M (vellum inscribed with good outsider's name)","range":"personal","target":"target: you","duration":"1 hour/level (see below)","sr":"no","effect":"The caster calls upon a good-aligned outsider for assistance against evil forces. The outsider grants the caster +2 morale bonus on all Perception checks made against evil creatures, a +2 bonus on Initiative checks, and detect evil as a constant spell-like ability.\n\nOnce per duration, the caster can activate a holy power surge (swift action) when fighting evil, converting remaining hours to rounds. This surge provides: +2 sacred bonus to AC, +4 sacred bonus to Strength, resistance 5 to acid and fire, +5 sacred bonus on all Intimidate checks made against evil creatures, fast healing 2, and automatic critical threat confirmations against evil with wielded weapons.\n\nThe surge activates automatically when attacking evil outsiders. Non-good casters suffer penalties: neutral casters become sickened for the spell's duration; evil casters become staggered for the spell's duration.","source":"Inner Sea Magic"},{"n":"Fire of Vengeance","l":4,"x":"Engulfs the next target of your smite evil in holy flames; if it attacks anyone but you during the smite, it takes 3d8 fire damage, and the spell ends once triggered or the smite expires.","oath":false,"save":"none","school":"Evocation [fire]","castingTime":"1 swift action","components":"V, S","range":"special; see text","target":"target: one creature","duration":"see text","sr":"no","effect":"After casting this spell, the next creature you attack using your smite evil class ability is engulfed in holy flames that flare up when the target attacks someone other than you. If at any time during the duration of your smite evil effect the target makes an attack that does not include you, it takes 3d8 points of fire damage. Once triggered in this manner, or when your smite evil ability expires, the spell ends.","source":"Advanced Player's Guide"},{"n":"Flash Forward","l":4,"x":"Lets you make a charge attack against an enemy as part of casting, then instantly teleport back to your original position as a free action, keeping any damage/conditions dealt.","oath":false,"save":"none (harmless)","school":"Conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, F (a single gear or bit of clockwork)","range":"personal","target":"target: you","duration":"instantaneous","sr":"no","effect":"You cheat the laws of time and enter into combat before reverting back to your original position. As part of the action to cast the spell, you make a charge attack against an enemy. You make this charge attack normally, accounting for terrain, obstacles, attacks of opportunity, attack rolls, and damage rolls. At the end of your charge action, you instantly teleport back to your original location as a free action. Any damage or conditions dealt by you or to you during this action are real and remain when you return to your original location.","source":"Magic Tactics Toolbox"},{"n":"Forced Repentance","l":4,"x":"Overwhelms an evil creature (without the evil subtype) with remorse, causing it to fall prone and confess its sins aloud for the duration, ending if you break line of sight or it's attacked.","oath":false,"save":"Will negates","school":"Enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one evil creature without the evil subtype","duration":"1 round/level","sr":"yes","effect":"You force an evil creature that does not have the evil subtype to momentarily reflect on its past actions and be overcome by grief and conscience. The target immediately drops prone and begins to loudly confess all of its sins and transgressions to the caster for the duration of the spell. The spell immediately ends if you move out of line of sight or if the target is attacked.","source":"Advanced Player's Guide"},{"n":"Forceful Strike","l":4,"x":"Cast during a melee attack to add 1d4 force damage per caster level (max 10d4) to the hit, potentially bull rushing the target back on a failed Fortitude save.","oath":false,"save":"Fortitude partial","school":"Evocation [force]","castingTime":"1 swift action","components":"V, S","range":"touch or reach of melee weapon","target":"target: 1 creature","duration":"instantaneous","sr":"yes","effect":"When you cast this spell during a melee attack, you deal normal weapon damage from the blow, but also deal an additional amount of force damage equal to 1d4 points per caster level (maximum of 10d4). The spell also grants a combat maneuver check using your caster level as a bonus to attempt a bull rush against the target. Success can push the target backward if it fails its CMD check. A successful Fortitude save halves the force damage and negates the bull rush effect.","source":"Inner Sea Magic"},{"n":"Guardian of Faith","l":4,"x":"Grants the target shield of faith plus a chosen protection from chaos/evil/good/law effect; the target can transfer the spell to a touched ally as a move action.","oath":false,"save":"Will negates (harmless)","school":"Abjuration [see text]","castingTime":"1 standard action","components":"V, S, M (parchment with a holy text written on it)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one ally","duration":"1 minute/level","sr":"no","effect":"The target gains the benefit of shield of faith and your choice of protection from chaos, evil, good, or law. As a move action, the target can transfer this spell to a touched ally, who becomes the new target of the spell. The alignment descriptor of this spell matches the alignment descriptor of the protection spell you chose when casting it. For example, granting the target protection from evil gives this spell the good descriptor.","source":"Advanced Class Guide"},{"n":"Invoke Deity","l":4,"x":"Assumes an aspect of your deity, letting you choose one domain to gain its granted powers (which can be swapped by concentrating, at a 10-minute duration cost); individual domain effects use this spell's save DC where applicable.","oath":false,"save":"see text","school":"Transmutation [see text]","castingTime":"1 round","components":"V, S, M (incense worth 1,000 gp), F (a bejeweled holy symbol of your patron deity worth 2,500 gp)","range":"personal","target":"target: you","duration":"10 minutes/level","sr":"see text","effect":"By invoking your deity's name while holding their holy symbol, you assume an aspect of that divinity. Select one domain your deity offers to gain its benefits and associated physical changes. You may change domains during the spell by concentrating for 1 round (provokes attacks of opportunity, reduces duration by 10 minutes). Changing domains ends previous domain effects.\n\nYou must worship a single deity to cast this spell. Violating your deity's precepts immediately ends the spell, stunning you for rounds equal to your Hit Dice.\n\nThe spell shares your deity's alignment descriptors. If an ability duplicates a spell, it functions as that spell heightened to a level equal to Invoke Deity's spell level.\n\nThe full spell text provides detailed benefits for over 37 domains (Air, Animal, Artifice, Chaos, Charm, Community, Darkness, Death, Destruction, Earth, Evil, Fire, Glory, Good, Healing, Knowledge, Law, Liberation, Luck, Madness, Magic, Nobility, Plant, Protection, Repose, Rune, Scalykind, Strength, Sun, Travel, Trickery, Void, War, Water, and Weather); individual domain benefits that allow saves use this spell's DC.","source":"Planar Adventures"},{"n":"King's Castle","l":4,"x":"Teleports you into an ally's space while that ally teleports into your former space, swapping their positions.","oath":false,"save":"Will negates (harmless)","school":"Conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"instantaneous","sr":"yes (harmless)","effect":"This spell allows you to switch places with an ally. When you cast this spell, choose a single ally within range. You teleport to your ally's space while your ally teleports to your former space.","source":"Advanced Player's Guide"},{"n":"Litany of Thunder","l":4,"x":"Permanently deafens the target and leaves it confused for 1 round; it cannot be targeted by another 'litany' spell while affected.","oath":false,"save":"Fort negates","school":"Evocation [language-dependent, sonic]","castingTime":"1 swift action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round","sr":"yes","effect":"You call down a thunderous boom upon your enemy. The target becomes deafened until the condition is removed, and is confused for 1 round. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Litany of Vengeance","l":4,"x":"Grants any creature that hits the target a +5 sacred or profane bonus (matching your alignment) to that attack's damage; the target cannot be affected by another 'litany' spell while under it.","oath":false,"save":"no","school":"Transmutation [language-dependent]","castingTime":"1 swift action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature","duration":"1 round","sr":"yes","effect":"The spell causes the target to experience heightened pain from attacks. Anyone who hits the target with an attack gains a +5 sacred or profane bonus (depending on the alignment of the caster) to that attack's damage. While subject to this spell, the target cannot be the target of another spell that has the word 'litany' in the title.","source":"Ultimate Combat"},{"n":"Magic Siege Engine, Greater","l":4,"x":"Grants an indirect-fire siege engine +1 per 4 caster levels (max +5) on targeting and damage rolls, or functions as greater magic weapon on a direct-fire siege engine.","oath":false,"save":"Will negates (harmless, object)","school":"Transmutation","castingTime":"1 standard action","components":"V, S, M/DF (black powder)","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one siege engine touched","duration":"1 hour/level","sr":"yes (harmless, object)","effect":"This spell works similarly to magic siege engine but delivers enhanced benefits. For indirect fire siege engines, it grants an enhancement bonus on targeting and damage rolls of +1 per four caster levels (maximum +5). When applied to direct-fire siege weapons, the spell functions as greater magic weapon instead.","source":"Ultimate Combat"},{"n":"Oath of Peace","l":4,"x":"Grants +5 sacred bonus to AC and saves plus DR 10/evil, but ends immediately if you make any attack or act with hostility toward any creature.","oath":false,"save":"none","school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"target: you","duration":"1 round/level","sr":"no","effect":"Entreating your deity for aid, you make a temporary oath of peace, granting you superior defenses but means you can't attack for the duration of the oath. For as long as you are subject to this spell, you gain a +5 sacred bonus to AC and on saving throws, as well as DR 10/evil. If you make a direct or indirect attack or any show any hostility toward any creature, the spell immediately ends.","source":"Advanced Player's Guide"},{"n":"Paragon Surge","l":4,"x":"Temporarily grants +2 enhancement to Dexterity and Intelligence and the benefit of one qualifying feat of your choice, while keeping your form and extraordinary/supernatural abilities.","oath":false,"save":"none","school":"Transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"personal (half-elf only)","target":"target: you","duration":"1 minute/level","sr":"no","effect":"You surge with ancestral power, temporarily embodying all the strengths of both elvenkind and humankind simultaneously, and transforming into a paragon of both races, something greater than elf or human alone. Unlike with most polymorph effects, your basic form does not change, so you keep all extraordinary and supernatural abilities of your half-elven form as well as all of your gear.\n\nFor the duration of the spell, you receive a +2 enhancement bonus to Dexterity and Intelligence and are treated as if you possessed any one feat for which you meet the prerequisites, chosen when you cast this spell.\n\nThe first time each day that you cast this spell, you must select a feat and make all the associated choices that come with it. Once that choice is made, it is set for the day and additional castings must make the exact same decisions.","source":"Advanced Race Guide"},{"n":"Planeslayer's Call","l":4,"x":"After choosing an alignment subtype, grants allies +2 on caster level checks to beat the spell resistance of matching outsiders and lets their spells ignore the first 10 points of that subtype's energy resistance.","oath":false,"save":"none","school":"Enchantment (compulsion) [mind-affecting, see text]","castingTime":"1 standard action","components":"V, S, DF","range":"20 ft.","target":"target: allies within a 20-ft.-radius burst centered on you","duration":"1 round/level","sr":"yes","effect":"The magic of your allies in the area becomes more potent against certain outsiders. Choose one alignment subtype (chaotic, evil, good, or lawful). Against outsiders with that alignment component or subtype, your allies in the area gain a +2 bonus on caster level checks to overcome spell resistance, and their spells ignore the first 10 points of energy resistance (but not energy immunity).\n\nThis spell gains the alignment descriptor that is opposite the outsider alignment chosen. For example, if you choose for the spell to affect evil outsiders, then this spell has the good descriptor.","source":"Advanced Class Guide"},{"n":"Raise Animal Companion","l":4,"x":"Functions like raise dead, but can only restore life to an animal companion, familiar, or paladin's bonded mount.","oath":false,"save":"none, see text","school":"Conjuration (healing)","castingTime":"1 minute","components":"V, S, M (a diamond worth 1,000 gp)","range":"touch","target":"target: dead animal companion or bonded mount","duration":"instantaneous","sr":"yes (harmless)","effect":"This spell functions as raise dead, but it only affects an animal companion, familiar, or paladin's bonded mount.","source":"Ultimate Magic"},{"n":"Red Hand of the Killer","l":4,"x":"Permanently and indelibly stains the right hand of whoever directly killed the corpse used as a focus, though it can be hidden by magic or covering.","oath":false,"save":"Will negates","school":"Necromancy","castingTime":"1 standard action","components":"V, S, M (a black candle), F (a corpse slain no more than 1 day ago per caster level)","range":"see text","target":"target: one creature","duration":"1 day/level (D)","sr":"yes","effect":"Drawing upon the spiritual link between a corpse and its killer, this spell brands the direct killer with an indelible red stain on their right hand. The mark cannot be removed through normal means, though magical disguise or physical concealment can hide it. Non-humanoid creatures or those lacking a right hand receive the mark elsewhere on their body, typically the chest.\n\nThe spell only affects the creature that directly caused death through violence. It fails if the victim died indirectly or non-violently. The killer may attempt a Will save to resist. Distance poses no obstacle, though the killer must occupy the same plane as the caster when cast. Each corpse functions as a focus only once for this spell.","source":"Ultimate Intrigue"},{"n":"Reprobation","l":4,"x":"Casts the target out from their faith, marking them visibly to the faith's members, making them immune to (and treated as an enemy by) the faithful's helpful spells, and stripping faith-based class abilities.","oath":false,"save":"none","school":"Transmutation [curse, see text]","castingTime":"1 minute","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one creature of your faith","duration":"permanent","sr":"yes","effect":"The spell casts out the target from their faith as punishment. It produces three effects: First, a magical symbol marks the target, visible only to faithful members, indicating transgression. Second, the marked creature receives no benefit from helpful spells cast by the caster's faith and counts as an enemy for spell purposes. Third, divine spellcasters or prestige class members lose faith-based abilities until they join another religion (though the mark persists).\n\nThe spell backlashes if the target committed no actual violations against the faith, affecting the caster instead. This safeguard discourages corrupt misuse. Members of the caster's faith may remove the curse using atonement (requiring a caster level check) or remove curse (also requiring a caster level check and same-faith caster).","source":"Ultimate Magic"},{"n":"Resounding Blow","l":4,"x":"A melee hit deals 1d6 sonic damage and staggers the target for 1 round if delivered via judgment/smite; a critical hit instead stuns it 1 round and deafens it 1d6 rounds; ends if the weapon leaves your hand.","oath":false,"save":"Fortitude partial; see text","school":"Evocation [sonic]","castingTime":"1 swift action","components":"V","range":"personal","target":"target: you","duration":"1 round/level","sr":"no","effect":"You must have a melee weapon in hand to cast this spell.\n\nOn a successful melee attack, your weapon resounds with a thunderous clash. The target takes 1d6 points of sonic damage. Your weapon is not harmed by this attack.\n\nIf you are using your judgment ability or smite ability against the target, it is staggered for 1 round on a successful attack. A successful Fortitude save negates the staggering effect.\n\nOn a successful critical hit, the target is stunned for 1 round and deafened for 1d6 rounds. A successful Fortitude save negates the stunning and deafening effects. If you are also using judgment or smite, your foe makes only a single save against all effects.\n\nThis spell immediately ends if your weapon leaves your hand. Resounding blow stacks with the thundering weapon property.","source":"Advanced Player's Guide"},{"n":"Sacred Nimbus","l":4,"x":"Surrounds you in golden light that deals 1d6 + 1/caster level (max +15) damage to evil creatures that strike you, while you take half damage from evil-descriptor magical attacks (none on a successful Reflex save).","oath":false,"save":"none","school":"Evocation [good]","castin   // into local, never pushing). Nothing happens automatically except one safe

    try{
      if(!(await ensureConnected())){ busy=false; return; }
      const snap=await fsApi.getDoc(docRef);
      const remote=snap.exists() ? snap.data()[APP_FIELD] : null;
      const merged=mergeState(state, remote);
      applyState(merged);
      await fsApi.setDoc(docRef, {[APP_FIELD]: JSON.parse(JSON.stringify(merged)), updatedAt: Date.now(), writerId: WRITER_ID}, {mergeFields:[APP_FIELD,'updatedAt','writerId']});
      setStatus('Saved ✓');
    }catch(e){ setStatus('Save error: '+e.message); }
    busy=false;
  }
  window.__cloudSave=manualSave; window.__cloudLoad=()=>manualLoad(false);
  if($('cloudSave')) $('cloudSave').onclick=manualSave;
  if($('cloudLoad')) $('cloudLoad').onclick=()=>manualLoad(false);
  // Kenneth is a single, fixed character sheet — always syncs to the KOS account,
  // no gate, no manual account switching.
  const FIXED_USER='KOS', FIXED_PIN='5';
  localStorage.setItem(SYNC_USER_KEY, FIXED_USER);
  localStorage.setItem(SYNC_PIN_KEY, FIXED_PIN);
  manualLoad(true);
})();
</script></body></html>
