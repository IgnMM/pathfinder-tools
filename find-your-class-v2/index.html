<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><title>Classfinder</title><link rel="icon" href="../assets/find-your-class/arcane-compass-icon.png"><link rel="apple-touch-icon" href="../assets/find-your-class/arcane-compass-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#10151d">
<style>
:root{--bg:#0f1117;--panel:#181c24;--panel2:#202633;--text:#eef2f7;--muted:#9ba7b7;--gold:#d5ad55;--gold2:#f1d78b;--border:#313949;--accent:#5a4318;--arcane-blue:#4a7ba6;--arcane-blue2:#6fa3cf;--absent-red:#6b4646;--absent-red2:#8a6262}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:1180px;margin:auto;padding:64px 16px 40px}
.fycStage{max-width:720px;margin:0 auto}
.fycStage--wide{max-width:none}
h1{font-family:'Cinzel Decorative',serif;font-size:1.5rem;margin:0 0 8px;color:var(--gold2);text-wrap:balance}
h2{font-family:'Cinzel Decorative',serif;font-size:1.05rem;margin:0 0 6px;color:var(--gold2)}
.fycEyebrow{color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.fycSupport{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0 0 18px}
.fycActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.fycPrimary{background:var(--accent);border:1px solid #816427;color:#fff1c2;border-radius:8px;padding:10px 18px;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-block}
.fycSecondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:.9rem;cursor:pointer}
.fycQuiet{background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;text-decoration:underline;padding:10px 4px}
.fycError{color:#f0a0a0;font-size:.85rem}
.fycCards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.fycCard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.fycCardHead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fycCardLabel{font-weight:700}
.fycCardSource{color:var(--muted);font-size:.78rem}
.fycModes{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.fycModeBtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:16px;padding:4px 12px;font-size:.78rem;cursor:pointer}
.fycModeBtn.active{background:var(--accent);border-color:#816427;color:#fff1c2}
.fycValues{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;margin:6px 0}
.fycImportance{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.fycImpBtn{width:26px;height:26px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:.75rem;cursor:pointer}
.fycImpBtn.active{background:var(--gold);border-color:var(--gold2);color:#1a1406}
.fycGroup{margin:0 0 20px}
.fycGroup h3{margin:0 0 8px;font-family:'Cinzel',Georgia,serif;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:6px}
.fycResults{display:flex;flex-direction:column;gap:16px}
.fycResultCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.fycResultRole{color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
.fycResultType{color:var(--muted);font-size:.8rem;margin:0 0 6px}
.fycResultCard h2{margin:0 0 8px;font-size:1.15rem}
.fycResultSummary{color:var(--text);font-size:.9rem;line-height:1.5}
.fycProvisional{background:#241a12;border:1px solid #6b4a1f;border-radius:8px;padding:8px 10px;font-size:.82rem;color:var(--gold2)}
.fycWhy,.fycWatch,.fycRequirements{margin-top:10px}
.fycWhy h3,.fycWatch h3,.fycRequirements h3{margin:0 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fycWhy ul,.fycWatch ul,.fycRequirements ul{margin:0;padding-left:18px;font-size:.85rem;line-height:1.5}
.fycResultActions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.fycPrestigeTip{margin-top:20px;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:16px;box-shadow:0 0 0 1px rgba(213,173,85,.15) inset}
.fycPrestigeTipLabel{color:var(--gold2);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px;font-weight:700}
@media(max-width:560px){main{padding-left:16px;padding-right:16px}.fycImpBtn{width:24px;height:24px}}
.fycTextarea{width:100%;min-height:100px;padding:12px;font-family:inherit;font-size:.95rem;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);line-height:1.5;resize:vertical}

/* Choice screen */
.fycChoiceGrid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:24px}
.fycChoiceOr{align-self:center;color:var(--muted);font-size:.85rem;text-transform:lowercase}
.fycChoiceCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px 20px;cursor:pointer;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.fycChoiceCard:hover{border-color:var(--gold);transform:translateY(-2px)}
.fycChoiceTitle{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--gold2)}
.fycChoiceDesc{color:var(--muted);font-size:.85rem;line-height:1.4}
@media(max-width:640px){.fycChoiceGrid{grid-template-columns:1fr}.fycChoiceOr{padding:2px 0}}

/* Narrative Question mode ("Classfinder") */
.fycNarrativeStory{font-style:italic;color:var(--gold2);line-height:1.7;font-size:.95rem;margin:0 0 22px;padding:14px 16px;background:var(--panel);border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.fycNarrativePrompt{font-family:'Cinzel Decorative',serif;font-size:1.05rem;color:var(--text);line-height:1.5;margin:0 0 18px;text-wrap:balance}
.fycNarrativeOptions{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:10px}
.fycNarrativeOption{width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-size:.92rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.fycNarrativeOption:hover{border-color:var(--gold);background:var(--panel2);transform:translateX(2px)}
.fycNarrativeOption--skip{border-style:dashed;color:var(--muted);font-style:italic}
.fycNarrativeOption--skip:hover{border-color:var(--arcane-blue2)}

/* Manual profile builder */
.fycManualGroups{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.fycManualGroup{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.fycManualGroupHead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:none;color:var(--text);padding:12px 14px;cursor:pointer;text-align:left}
.fycManualGroupTitle{font-family:'Cinzel',Georgia,serif;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold)}
.fycManualGroupSummary{color:var(--muted);font-size:.78rem}
.fycManualCards{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:8px}
.fycManualCard{border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.fycManualCard--absent{border-color:var(--absent-red2)}
.fycManualCard--available{border-color:var(--arcane-blue)}
.fycManualCard--core{border-color:var(--gold)}
.fycManualHead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fycManualLabel{flex:1;text-align:left;background:none;border:none;color:var(--text);font-size:.88rem;padding:10px 12px;cursor:pointer}
.fycManualLabel:hover{color:var(--gold2)}
.fycManualChip{border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:14px;padding:4px 10px;font-size:.72rem;cursor:pointer;margin-right:8px;white-space:nowrap}
.fycManualChip--absent{background:var(--absent-red);border-color:var(--absent-red2);color:#f0d9d9}
.fycManualChip--available{background:var(--arcane-blue);border-color:var(--arcane-blue2);color:#eaf3fb}
.fycManualChip--core{background:var(--gold);border-color:var(--gold2);color:#1a1406;font-weight:700}
.fycManualBody{padding:0 12px 12px}
.fycManualDesc{color:var(--muted);font-size:.82rem;line-height:1.4;margin:0 0 8px}
.fycManualOptions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fycManualOptBtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:5px 12px;font-size:.78rem;cursor:pointer}
.fycManualOptBtn--absent.active{background:var(--absent-red);border-color:var(--absent-red2);color:#f0d9d9}
.fycManualOptBtn--available.active{background:var(--arcane-blue);border-color:var(--arcane-blue2);color:#eaf3fb}
.fycManualOptBtn--core.active{background:var(--gold);border-color:var(--gold2);color:#1a1406;font-weight:700}
.fycManualBoundary{color:var(--muted);font-size:.78rem}
.fycManualBoundary summary{cursor:pointer;color:var(--arcane-blue2)}
.fycManualBoundary p{margin:6px 0 0}
.fycManualSummary{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:.85rem;line-height:1.6;margin-bottom:8px}
.fycManualSummary p{margin:0 0 4px}
.fycManualSummary strong{color:var(--gold2)}
.fycPrimary[disabled]{opacity:.45;cursor:not-allowed}

/* Search bar (named, multiple saved searches -- same pattern as Calc's character bar) */
.fycSearchBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.fycSearchBarLabel{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.fycSearchBarLabel select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:.82rem;min-width:140px}
.fycSearchBarActions{display:flex;gap:6px;flex-wrap:wrap}
.fycSearchBarActions button{font-size:.72rem;padding:5px 10px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer}
.fycSearchBarActions button[disabled]{opacity:.4;cursor:not-allowed}

/* Sources panel (padlock pattern, shared with the spellbook pages) */
.fycSourcesBox{margin:0 0 16px;position:relative}
.fycSourcesBox summary{cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:.8rem;list-style:none;display:inline-block}
.fycSourcesBox summary::-webkit-details-marker{display:none}
.fycSourcesBox[open] summary{border-color:var(--gold)}
.fycSourcesPanel{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px;margin-top:6px;max-height:280px;overflow-y:auto;max-width:480px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fycSourcesNote{font-size:.72rem;color:var(--muted);margin:0 0 8px}
.fycSourcesActions{display:flex;gap:6px;margin-bottom:8px}
.fycSourcesActions button{font-size:.72rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer}
.fycSourcesActions button[disabled]{opacity:.4;cursor:not-allowed}
.fycSourcesList{display:flex;flex-direction:column;gap:2px}
.fycSourcesList label{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text);padding:2px 0;cursor:pointer}
.fycSourcesList input{width:auto}
</style>

<div class="arc-topbar" id="arcTopbar">

</div>
<script>if(window.self!==window.top)document.getElementById('arcTopbar').style.display='none';</script>
<main>
<div id="app" role="main" aria-live="polite">
  <p class="fycSupport">Loading the Arcane Compass&hellip;</p>
</div>
</main>
<script src="../assets/valid-sources.js"></script>
<script src="../assets/find-your-class/v2/loader.js"></script>
<script src="../assets/find-your-class/v2/matcher.js"></script>
<script src="../assets/find-your-class/v2/narrative.js"></script>
<script src="../assets/find-your-class/v2/app.js"></script>
<script>
(async function () {
  const base = '../assets/find-your-class/v2/';
  async function getJson(name) {
    const res = await fetch(base + name);
    if (!res.ok) throw new Error('Failed to load ' + name);
    return res.json();
  }
  const container = document.getElementById('app');
  try {
    const [criteriaDoc, model, narrativeDoc, batch1, batch2, batch3, batch4, batch5, batch6, pilot1, pilot2, pilot3, pilot4, pilot5, pilot6, pilot7, pilot8, pilot9, pilot10, slayerArchetypes, unchainedSummonerArchetypes, alchemistArchetypes, antipaladinArchetypes, arcanistArchetypes, barbarianArchetypes, bardArchetypes, bloodragerArchetypes, brawlerArchetypes, cavalierArchetypes, clericArchetypes, druidArchetypes, fighterArchetypes, gunslingerArchetypes, hunterArchetypes, inquisitorArchetypes, investigatorArchetypes, kineticistArchetypes, magusArchetypes, mediumArchetypes, mesmeristArchetypes, monkArchetypes, unchainedMonkArchetypes, ninjaArchetypes, occultistArchetypes, oracleArchetypes, paladinArchetypes, psychicArchetypes, rangerArchetypes, rogueArchetypes, samuraiArchetypes, shamanArchetypes, shifterArchetypes, skaldArchetypes, sorcererArchetypes, spiritualistArchetypes, summonerArchetypes, swashbucklerArchetypes, vigilanteArchetypes, warpriestArchetypes, witchArchetypes, wizardArchetypes, prestigeProfiles] = await Promise.all([
      getJson('criteria.json'),
      getJson('classification-model.json'),
      getJson('narrative-questions.json'),
      getJson('class-profiles-batch-01.json'),
      getJson('class-profiles-batch-02.json'),
      getJson('class-profiles-batch-03.json'),
      getJson('class-profiles-batch-04.json'),
      getJson('class-profiles-batch-05.json'),
      getJson('class-profiles-batch-06.json'),
      getJson('archetype-profiles-pilot-01.json'),
      getJson('archetype-profiles-pilot-02.json'),
      getJson('archetype-profiles-pilot-03.json'),
      getJson('archetype-profiles-pilot-04.json'),
      getJson('archetype-profiles-pilot-05.json'),
      getJson('archetype-profiles-pilot-06.json'),
      getJson('archetype-profiles-pilot-07.json'),
      getJson('archetype-profiles-pilot-08.json'),
      getJson('archetype-profiles-pilot-09.json'),
      getJson('archetype-profiles-pilot-10.json'),
      getJson('archetype-profiles-slayer.json'),
      getJson('archetype-profiles-summoner-unchained.json'),
      getJson('archetype-profiles-alchemist.json'),
      getJson('archetype-profiles-antipaladin.json'),
      getJson('archetype-profiles-arcanist.json'),
      getJson('archetype-profiles-barbarian.json'),
      getJson('archetype-profiles-bard.json'),
      getJson('archetype-profiles-bloodrager.json'),
      getJson('archetype-profiles-brawler.json'),
      getJson('archetype-profiles-cavalier.json'),
      getJson('archetype-profiles-cleric.json'),
      getJson('archetype-profiles-druid.json'),
      getJson('archetype-profiles-fighter.json'),
      getJson('archetype-profiles-gunslinger.json'),getJson('archetype-profiles-hunter.json'),getJson('archetype-profiles-inquisitor.json'),getJson('archetype-profiles-investigator.json'),
      getJson('archetype-profiles-kineticist.json'),getJson('archetype-profiles-magus.json'),getJson('archetype-profiles-medium.json'),getJson('archetype-profiles-mesmerist.json'),getJson('archetype-profiles-monk.json'),
      getJson('archetype-profiles-monk-unchained.json'),getJson('archetype-profiles-ninja.json'),getJson('archetype-profiles-occultist.json'),getJson('archetype-profiles-oracle.json'),getJson('archetype-profiles-paladin.json'),
      getJson('archetype-profiles-psychic.json'),getJson('archetype-profiles-ranger.json'),getJson('archetype-profiles-rogue.json'),
      getJson('archetype-profiles-samurai.json'),getJson('archetype-profiles-shaman.json'),
      getJson('archetype-profiles-shifter.json'),getJson('archetype-profiles-skald.json'),
      getJson('archetype-profiles-sorcerer.json'),getJson('archetype-profiles-spiritualist.json'),
      getJson('archetype-profiles-summoner.json'),getJson('archetype-profiles-swashbuckler.json'),
      getJson('archetype-profiles-vigilante.json'),getJson('archetype-profiles-warpriest.json'),
      getJson('archetype-profiles-witch.json'),
      getJson('archetype-profiles-wizard.json'),
      getJson('prestige-profiles.json'),
    ]);
    const classProfiles = [batch1, batch2, batch3, batch4, batch5, batch6].flatMap(b => b.profiles);
    const pilotArchetypes = [pilot1, pilot2, pilot3, pilot4, pilot5, pilot6, pilot7, pilot8, pilot9, pilot10]
      .flatMap(b => b.profiles).filter(profile => !['alchemist','antipaladin','arcanist','barbarian','bard','bloodrager','brawler','cavalier','cleric','druid','fighter','gunslinger','hunter','inquisitor','investigator','kineticist','magus','medium','mesmerist','monk','monk-unchained','ninja','occultist','oracle','paladin','psychic','ranger','rogue','samurai','shaman','shifter','skald','sorcerer','spiritualist','summoner','swashbuckler','vigilante','warpriest','witch','wizard'].includes(profile.parentClassId));
    const archetypeOverrides = pilotArchetypes.concat(slayerArchetypes.profiles, unchainedSummonerArchetypes.profiles, alchemistArchetypes.profiles, antipaladinArchetypes.profiles, arcanistArchetypes.profiles, barbarianArchetypes.profiles, bardArchetypes.profiles, bloodragerArchetypes.profiles, brawlerArchetypes.profiles, cavalierArchetypes.profiles, clericArchetypes.profiles, druidArchetypes.profiles, fighterArchetypes.profiles, gunslingerArchetypes.profiles, hunterArchetypes.profiles, inquisitorArchetypes.profiles, investigatorArchetypes.profiles, kineticistArchetypes.profiles, magusArchetypes.profiles, mediumArchetypes.profiles, mesmeristArchetypes.profiles, monkArchetypes.profiles, unchainedMonkArchetypes.profiles, ninjaArchetypes.profiles, occultistArchetypes.profiles, oracleArchetypes.profiles, paladinArchetypes.profiles, psychicArchetypes.profiles, rangerArchetypes.profiles, rogueArchetypes.profiles, samuraiArchetypes.profiles, shamanArchetypes.profiles, shifterArchetypes.profiles, skaldArchetypes.profiles, sorcererArchetypes.profiles, spiritualistArchetypes.profiles, summonerArchetypes.profiles, swashbucklerArchetypes.profiles, vigilanteArchetypes.profiles, warpriestArchetypes.profiles, witchArchetypes.profiles, wizardArchetypes.profiles);
    const profiles = window.PFFindYourClassV2.resolveAllProfiles(classProfiles, archetypeOverrides, prestigeProfiles.profiles);
    window.PFFindYourClassAppV2.mount(container, { criteriaDoc: criteriaDoc, model: model, profiles: profiles, narrativeDoc: narrativeDoc });
  } catch (e) {
    container.innerHTML = '<p class="fycError" role="alert">The Arcane Compass could not load its data. Please try again shortly.</p>';
    if (window.console) console.error(e);
  }
}());
</script>
