<style>
  :root{
    --ink:#0a0906;
    --ink-2:#120e09;
    --parchment:#d8cdb9;
    --parchment-dim:#9a8f7c;
    --gold:#c9a227;
    --gold-bright:#f1d78b;
    --ember:#c73e1d;
    --ember-glow:#ff7a3d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:'EB Garamond',Georgia,serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(12px,2.5vw,32px) 16px 64px;
  }

  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0,0,0,.55) 100%);
    z-index:5;
  }

  .crest{
    text-align:center;
    margin:4px 0 clamp(12px,2vw,22px);
    position:relative;
    z-index:2;
  }
  .crest .eyebrow{
    font-family:'Cinzel',Georgia,serif;
    font-size:.7rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.75;
    margin:0 0 6px;
  }
  .crest h1{
    font-family:'Cinzel Decorative',Georgia,serif;
    font-weight:700;
    font-size:clamp(1.5rem,3.6vw,2.5rem);
    margin:0;
    letter-spacing:.03em;
    text-wrap:balance;
    background:linear-gradient(180deg,var(--gold-bright) 0%,var(--gold) 55%,#8a6a1c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 34px rgba(201,162,39,.35);
  }
  .crest .sub{
    font-family:'Cinzel',Georgia,serif;
    font-size:.82rem;
    letter-spacing:.09em;
    color:var(--parchment-dim);
    margin:6px auto 0;
    max-width:46ch;
  }

  .circle-wrap{
    position:relative;
    width:min(88vw,760px);
    aspect-ratio:1/1;
    margin:0 auto;
    z-index:2;
  }
  .circle-wrap img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    filter:saturate(1.05);
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ filter:saturate(1.05) brightness(1); }
    50%{ filter:saturate(1.1) brightness(1.06); }
  }

  .node{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    width:clamp(96px,17vw,180px);
    text-decoration:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .node .ring{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:50%;
    display:grid;
    place-items:center;
    transition:transform .45s cubic-bezier(.2,.9,.25,1);
  }
  .node .ring::before{
    content:"";
    position:absolute;
    inset:-14%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(241,215,139,.0) 0%, rgba(241,215,139,.0) 55%, rgba(241,215,139,.0) 100%);
    opacity:0;
    transition:opacity .45s ease, background .45s ease;
    pointer-events:none;
  }
  .node img.icon{
    position:relative;
    width:88%;
    height:88%;
    object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.75)) brightness(.82) saturate(.85);
    transition:filter .45s ease, transform .45s ease;
  }
  .node .label{
    margin-top:10px;
    font-family:'Cinzel',Georgia,serif;
    font-weight:600;
    font-size:clamp(.66rem,1.15vw,.85rem);
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--parchment);
    text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.7);
    text-align:center;
    text-wrap:balance;
    transition:color .4s ease, text-shadow .4s ease;
  }
  .node .rune{
    display:block;
    font-family:'Cinzel Decorative',Georgia,serif;
    font-size:clamp(.5rem,.85vw,.68rem);
    letter-spacing:.05em;
    color:var(--ember-glow);
    opacity:.92;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
    margin-top:2px;
    font-weight:700;
    transition:opacity .4s ease, color .4s ease;
  }

  .node:hover .ring,
  .node:focus-visible .ring{
    transform:scale(1.1);
  }
  .node:hover .ring::before,
  .node:focus-visible .ring::before{
    opacity:1;
    background:radial-gradient(circle, rgba(241,215,139,.38) 0%, rgba(199,62,29,.22) 45%, rgba(241,215,139,0) 72%);
    animation:pulse-glow 1.6s ease-in-out infinite;
  }
  .node:hover img.icon,
  .node:focus-visible img.icon{
    filter:drop-shadow(0 0 26px rgba(241,215,139,.85)) drop-shadow(0 0 46px rgba(199,62,29,.5)) brightness(1.18) saturate(1.15);
    transform:scale(1.04);
  }
  .node:hover .label,
  .node:focus-visible .label{
    color:var(--gold-bright);
    text-shadow:0 0 14px rgba(241,215,139,.6);
  }
  .node:hover .rune,
  .node:focus-visible .rune{
    opacity:1;
    color:var(--ember-glow);
  }
  @keyframes pulse-glow{
    0%,100%{ opacity:.75; }
    50%{ opacity:1; }
  }
  .node:focus-visible .ring{ outline:2px solid var(--gold-bright); outline-offset:6px; border-radius:50%; }

  /* five vertices of the pentacle, tuned to the art */
  .node[data-pos="top"]{ left:50%; top:20%; }
  .node[data-pos="upper-left"]{ left:26.5%; top:38%; }
  .node[data-pos="upper-right"]{ left:73.5%; top:38%; }
  .node[data-pos="lower-left"]{ left:33.5%; top:70%; }
  .node[data-pos="lower-right"]{ left:66.5%; top:70%; }

  @media (max-width:560px){
    .circle-wrap{ width:94vw; }
    .node[data-pos="top"]{ top:19%; }
    .node[data-pos="upper-left"]{ left:25%; top:37%; }
    .node[data-pos="upper-right"]{ left:75%; top:37%; }
    .node[data-pos="lower-left"]{ left:32%; top:71%; }
    .node[data-pos="lower-right"]{ left:68%; top:71%; }
  }

  @media (prefers-reduced-motion: reduce){
    .circle-wrap img.bg{ animation:none; }
    .node .ring, .node img.icon, .node .label, .node .rune{ transition:none; }
    .node:hover .ring::before{ animation:none; }
  }
</style>
</head>

<div id="syncGate" style="display:none;position:fixed;inset:0;z-index:9999;
  background-image:linear-gradient(to bottom, rgba(6,4,3,.1) 0%, rgba(6,4,3,.15) 50%, rgba(6,4,3,.94) 100%), url('assets/gate-bg.jpg');
  background-size:cover;background-position:center;
  align-items:flex-end;justify-content:center;padding:0 16px 26px">
  <div style="max-width:380px;width:100%;background:rgba(12,9,6,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(233,200,116,.35);border-radius:12px;padding:18px 20px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.55)">

    <p style="color:#d8cdb9;font-size:.78rem;margin:0 0 12px;line-height:1.4;font-family:'Cinzel',Georgia,serif">Speak a name and PIN — the same words on any device bring your characters with you.</p>

      <input id="gatePin" type="text" aria-label="PIN" spellcheck="false" autocorrect="off" placeholder="PIN" style="width:78px;text-transform:uppercase;padding:10px;border-radius:8px;border:1px solid rgba(233,200,116,.35);background:#0c0906;color:#e9c874;font-size:.95rem;text-align:center;box-sizing:border-box;font-family:'Cinzel',Georgia,serif;letter-spacing:.06em">
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="gateNew" style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(233,200,116,.4);background:rgba(233,200,116,.08);color:#e9c874;font-weight:700;cursor:pointer;font-size:.82rem;font-family:'Cinzel',Georgia,serif;letter-spacing:.03em">New User</button>
      <button id="gateLogin" style="flex:1;padding:10px;border-radius:8px;border:1px solid #f1d78b;background:linear-gradient(180deg,#e9c874,#b0863c);color:#241708;font-weight:700;cursor:pointer;font-size:.82rem;font-family:'Cinzel',Georgia,serif;letter-spacing:.03em">Log In</button>
    </div>
  </div>
</div>
