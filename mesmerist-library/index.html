:root{--bg:#0f1117;--panel:#181c24;--panel2:#202633;--text:#eef2f7;--muted:#9ba7b7;--gold:#d5ad55;--gold2:#f1d78b;--border:#313949}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;background:#0f1117;color:var(--text)}header,main{max-width:1180px;margin:auto;padding:12px 16px}header{border-bottom:1px solid var(--border)}h1{margin:0;font-size:1.35rem}.sub{color:var(--muted);font-size:.78rem;margin:2px 0 8px}label{font-size:.68rem;color:var(--muted);display:block;margin-bottom:2px}select,input{width:100%;background:#121721;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px}.levels{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;cursor:pointer}button.active,button.primary{background:#5a4318;border-color:#816427;color:#fff1c2}.toolbar{display:grid;grid-template-columns:1fr 160px auto;gap:6px;margin-bottom:8px}.count{color:var(--muted);font-size:.78rem;margin:4px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}section{margin:8px 0 14px}h2{font-size:.95rem;color:var(--gold2);margin:6px 0}.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:750}.savebadge{font-size:.58rem;color:var(--muted);margin-top:2px}.sourcebadge{font-size:.56rem;color:#7d8aa3;margin-top:2px;font-style:italic}.desc{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.25}.desc summary{cursor:pointer;color:var(--gold2);font-size:.68rem;list-style:none}.desc summary::-webkit-details-marker{display:none}.desc summary:before{content:"▸ ";display:inline-block}.desc[open] summary:before{content:"▾ "}.desc[open] summary{margin-bottom:3px}.stat-block{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:5px 7px;margin-bottom:5px}.stat-row{font-size:.68rem;line-height:1.5}.stat-row b{color:var(--gold2);font-weight:700;margin-right:4px}.effect-text p{margin:0 0 6px}.effect-text p:last-child{margin-bottom:0}.favbtn{background:none;border:none;font-size:1.1rem;line-height:1;cursor:pointer;padding:0 4px;color:var(--muted)}.favbtn.active{color:var(--gold2)}.sourcesbox{position:relative}.sourcesbox summary{cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.78rem;list-style:none;white-space:nowrap}.sourcesbox summary::-webkit-details-marker{display:none}.sourcesbox[open] summary{border-color:var(--gold)}.sourcesPanel{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px;z-index:20;max-height:300px;overflow-y:auto;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.sourcesPanel label{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text);padding:3px 0;cursor:pointer}.sourcesPanel input{width:auto}.sourcesPanel .srcActions{display:flex;gap:6px;margin-bottom:6px}.sourcesPanel .srcActions button{font-size:.65rem;padding:4px 7px}
@media(max-width:780px){header,main{padding:6px 8px}.toolbar{grid-template-columns:1fr;gap:4px}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px}.card{padding:6px}.name{font-size:.8rem}.desc{font-size:.62rem}}
</style>

<header><h1>Mesmerist Spell Library</h1><div class="sub">Pathfinder 1e — full Mesmerist spell list (its own distinct list). A reference tool for browsing, searching, and shortlisting spells — not a session play-tool: no character level, no caster stats, no daily preparation tracking.</div>
<div class="levels" id="levelButtons"></div>
<div class="levels" id="ctButtons"></div>
</header><main>
<div class="toolbar"><div class="searchWrap"><svg class="searchIcon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="search" placeholder="Search spell name or description..."><button id="searchClear" type="button" title="Clear search" aria-label="Clear search">&times;</button></div><style>.searchWrap{position:relative}.searchWrap input{padding-left:26px;padding-right:24px}.searchIcon{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.searchWrap button{position:absolute;right:1px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;padding:4px 7px}.searchWrap button:hover{color:var(--text)}</style><select id="filter"><option value="all">All spells</option><option value="favorites">Favorites only</option></select><details class="sourcesbox"><summary>Sources</summary><div class="sourcesPanel"><div class="srcActions"><button id="srcAll" type="button">All</button><button id="srcNone" type="button">None</button><button id="srcResetGlobal" type="button" title="Follow the site-wide Valid Sources selection again">Reset to global</button></div><div id="sourcesNote" style="font-size:.62rem;color:var(--muted);margin-bottom:4px"></div><div id="sourceList"></div></div></details></div>
<div class="count" id="resultCount"></div>
<div id="list"></div>
</main>
<script src="../assets/valid-sources.js"></script>
<script src="../assets/casting-time.js"></script>
<script src="../assets/spell-crossref.js"></script>
<script>
const STORE_KEY='mesmeristSpellLibraryPF1V1';
const $=id=>document.getElementById(id);
function statRow(label,val){return val?`<div class="stat-row"><b>${label}</b> ${val}</div>`:''}
function loadStore(){
  let raw=localStorage.getItem(STORE_KEY);
  if(raw){try{let s=JSON.parse(raw);if(s)return s}catch(e){}}
  return {fav:{},excludedSources:{},show:[0,1,2,3,4,5,6],sourcesCustomized:false};
}
let store=loadStore();
if(store.sourcesCustomized===undefined) store.sourcesCustomized=Object.keys(store.excludedSources||{}).length>0;
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(store));}
function applyGlobalSources(){
  if(store.sourcesCustomized) return;
  let allSrc=[...new Set(SPELLS.map(s=>s.source||'Unknown'))];
  store.excludedSources=PFSources.computeExcludedSources(allSrc, PFSources.loadGlobalExcludedLocal());
}
let PRESENT_CT=[];
function renderCtButtons(){
  let b=$('ctButtons'); if(!b) return;
  if(PRESENT_CT.length<2){ b.style.display='none'; b.innerHTML=''; return; }
  b.style.display=''; b.innerHTML='';
  let shown=store.ctShow||PRESENT_CT;
  let all=document.createElement('button');all.textContent='All';all.className=shown.length===PRESENT_CT.length?'active':'';
  all.onclick=()=>{store.ctShow=null;save();renderList();renderCtButtons()};
  b.appendChild(all);
  PRESENT_CT.forEach(c=>{
    let x=document.createElement('button');x.textContent=PFCastingTime.CT_LABELS[c];
    x.className=(shown.length<PRESENT_CT.length&&shown.includes(c))?'active':'';
    x.onclick=()=>{
      let cur=store.ctShow||PRESENT_CT.slice();
      if(cur.length===PRESENT_CT.length){store.ctShow=[c]}
      else if(cur.includes(c)){let next=cur.filter(v=>v!==c);store.ctShow=next.length?next:null}
      else{store.ctShow=[...cur,c]}
      save();renderList();renderCtButtons()
    };
    b.appendChild(x)
  });
}

function renderButtons(){
  let b=$('levelButtons');b.innerHTML='';
  let all=document.createElement('button');all.textContent='All';all.className=store.show.length===7?'active':'';
  all.onclick=()=>{store.show=[0,1,2,3,4,5,6];save();renderList()};b.appendChild(all);
  for(let l=0;l<=6;l++){
    let x=document.createElement('button');x.textContent=l===0?'Orisons':'L'+l;
    x.className=(store.show.length<7&&store.show.includes(l))?'active':'';
    x.onclick=()=>{
      if(store.show.length===7){store.show=[l]}
      else if(store.show.includes(l)){let next=store.show.filter(v=>v!==l);store.show=next.length?next:[0,1,2,3,4,5,6]}
      else{store.show=[...store.show,l].sort((a,b)=>a-b)}
      save();renderList()
    };
    b.appendChild(x)
  }
}
function buildCard(s){
  let key=s.l+'|'+s.n;
  let fav=!!store.fav[key];
  let card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="head"><div><div class="name">${s.n} <span style="color:var(--muted);font-weight:400;font-size:.72rem">L${s.l}</span></div>${s.save?`<div class="savebadge">Save: ${s.save}</div>`:''}${s.source?`<div class="sourcebadge">${s.source}</div>`:''}</div><button class="favbtn${fav?' active':''}" title="Favorite" aria-label="Favorite">${fav?'★':'☆'}</button></div><details class="desc"><summary>Description</summary><div class="stat-block">${statRow('School',s.school)}${statRow('Casting Time',s.castingTime)}${statRow('Components',s.components)}${statRow('Range',s.range)}${statRow('Target/Area',s.target)}${statRow('Duration',s.duration)}${statRow('Saving Throw',s.save)}${statRow('Spell Resistance',s.sr)}</div><div class="effect-text">${(s.effect||'').split('\n\n').map(p=>`<p>${PFSpellRefs.linkify(p,s.n)}</p>`).join('')}</div></details>`;
  card.querySelector('.favbtn').onclick=()=>{if(fav)delete store.fav[key];else store.fav[key]=true;save();renderList()};
  return card;
}
function renderList(){
  let q=$('search').value.toLowerCase(),f=$('filter').value,out=$('list');out.innerHTML='';
  let total=0;
  for(let l of store.show){
    let ctShown=store.ctShow||PRESENT_CT;
    let arr=SPELLS.filter(s=>s.l===l&&(s.n+' '+(s.effect||'')).toLowerCase().includes(q)&&!store.excludedSources[s.source||'Unknown']&&(()=>{let cats=PFCastingTime.ctCategory(s.castingTime);return cats.length===0||cats.some(c=>ctShown.includes(c))})());
    if(f==='favorites')arr=arr.filter(s=>!!store.fav[l+'|'+s.n]);
    if(!arr.length)continue;
    total+=arr.length;
    let sec=document.createElement('section');
    sec.innerHTML=`<h2>${l===0?'Orisons (0-level)':'Level '+l}</h2><div class="grid"></div>`;
    let g=sec.querySelector('.grid');
    arr.sort((a,b)=>a.n.localeCompare(b.n)).forEach(s=>g.appendChild(buildCard(s)));
    out.appendChild(sec);
  }
  $('resultCount').textContent=total+' spell'+(total===1?'':'s')+' shown';
}
function renderSources(){
  let box=$('sourceList');box.innerHTML='';
  let all=[...new Set(SPELLS.map(s=>s.source||'Unknown'))].sort();
  all.forEach(src=>{
    let lbl=document.createElement('label');
    let cb=document.createElement('input');cb.type='checkbox';cb.checked=!store.excludedSources[src];
    cb.onchange=()=>{store.sourcesCustomized=true;if(cb.checked)delete store.excludedSources[src];else store.excludedSources[src]=true;save();renderList();renderSourcesNote()};
    lbl.appendChild(cb);lbl.appendChild(document.createTextNode(src));box.appendChild(lbl);
  });
  renderSourcesNote();
}
function renderSourcesNote(){
  let el=$('sourcesNote');if(!el)return;
  el.textContent=store.sourcesCustomized?'Customized for this page':'Following the site\'s global Valid Sources';
}
$('search').oninput=renderList;$('searchClear').onclick=()=>{$('search').value='';renderList();$('search').focus()};
$('filter').onchange=renderList;
$('srcAll').onclick=()=>{store.sourcesCustomized=true;store.excludedSources={};save();renderSources();renderList()};
$('srcNone').onclick=()=>{store.sourcesCustomized=true;[...new Set(SPELLS.map(s=>s.source||'Unknown'))].forEach(src=>store.excludedSources[src]=true);save();renderSources();renderList()};
$('srcResetGlobal').onclick=()=>{store.sourcesCustomized=false;applyGlobalSources();save();renderSources();renderList()};

// Full Mesmerist spell list, derived from this site's own spell-master-index.json.
// with its own distinct spell list (real overlap with Sorcerer/Wizard's list, but not
// identical), levels 0-6 only, confirmed against the class's own "Spells Known" table.
const SPELLS=[{"n":"Bleed","l":0,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One living creature","duration":"Instantaneous","save":"Will negates","sr":"Yes","effect":"You cause a living creature that is below 0 hit points but stabilized to resume dying. Upon casting this spell, you target a living creature that has –1 or fewer hit points. That creature begins dying, taking 1 point of damage per round. The creature can be stabilized later normally. This spell causes a creature that is dying to take 1 point of damage.","source":"Core Rulebook"},{"n":"Dancing Lights","l":0,"school":"evocation [light]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"up to four lights, all within a 10-ft.-radius area","duration":"1 minute (D)","save":"none","sr":"no","effect":"Depending on the version selected, you create up to four lights that resemble lanterns or torches (and cast that amount of light), or up to four glowing spheres of light (which look like will-o'-wisps), or one faintly glowing, vaguely humanoid shape. The dancing lights must stay within a 10-foot-radius area in relation to each other but otherwise move as you desire (no concentration required): forward or back, up or down, straight or turning corners, or the like. The lights can move up to 100 feet per round. A light winks out if the distance between you and it exceeds the spell's range.\n\nYou can only have one dancing lights spell active at any one time. If you cast this spell while another casting is still in effect, the previous casting is dispelled. If you make this spell permanent, it does not count against this limit.\n\nDancing lights can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 263"},{"n":"Daze","l":0,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a pinch of wool or similar substance)","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature of 4 HD or less","duration":"1 round","save":"Will negates","sr":"yes","effect":"This spell clouds the mind of a humanoid creature with 4 or fewer Hit Dice so that it takes no actions. Humanoids of 5 or more HD are not affected. A dazed subject is not stunned, so attackers get no special advantage against it. After a creature has been dazed by this spell, it is immune to the effects of this spell for 1 minute.","source":"PRPG Core Rulebook pg. 264"},{"n":"Detect Magic","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 min./level (D)","save":"none","sr":"no","effect":"You detect magical auras. The amount of information revealed depends on how long you study a particular area or subject.\n\n1st Round: Presence or absence of magical auras.\n\n2nd Round: Number of different magical auras and the power of the most potent aura.\n\n3rd Round: The strength and location of each aura. If the items or creatures bearing the auras are in line of sight, you can make Knowledge (arcana) skill checks to determine the school of magic involved in each. (Make one check per aura: DC 15 + spell level, or 15 + 1/2 caster level for a nonspell effect.) If the aura eminates from a magic item, you can attempt to identify its properties (see Spellcraft).\n\nMagical areas, multiple types of magic, or strong local magical emanations may distort or conceal weaker auras.\n\nAura Strength: An aura's power depends on a spell's functioning spell level or an item's caster level; see the accompanying table. If an aura falls into more than one category, detect magic indicates the stronger of the two.\n\nLingering Aura: A magical aura lingers after its original source dissipates (in the case of a spell) or is destroyed (in the case of a magic item). If detect magic is cast and directed at such a location, the spell indicates an aura strength of dim (even weaker than a faint aura). How long the aura lingers at this dim level depends on its original power:\n\nOriginal StrengthDuration of Lingering AuraFaint1d6 roundsModerate1d6 minutesStrong1d6 x 10 minutesOverwhelming1d6 days\nOutsiders and elementals are not magical in themselves, but if they are summoned, the conjuration spell registers. Each round, you can turn to detect magic in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.\n\nDetect magic can be made permanent with a permanency spell.\n\nSpell or ObjectAura PowerFaintModerateStrongOverwhelmingFunctioning spell (spell level)3rd or lower4th-6th7th-9th10th+ (deity-level)Magic item (caster level)5th or lower6th-11th12th-20th21st+ (artifact)","source":"PRPG Core Rulebook pg. 267"},{"n":"Detect Poison","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature, one object, or a 5-ft. cube","duration":"instantaneous","save":"none","sr":"no","effect":"Detects whether the target creature, object, or area contains poison, or whether a creature is itself poisonous. A DC 20 Wisdom check (or a DC 20 Craft [alchemy] check as a substitute) identifies the specific poison. The effect is blocked by 1 foot of stone, 1 inch of metal, a thin lead sheet, or 3 feet of wood or dirt.","source":"PRPG Core Rulebook pg. 268"},{"n":"Detect Psychic Significance","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"40 ft.","target":"40-ft.-radius burst, centered on you","duration":"instantaneous","save":"none","sr":"no","effect":"You detect the presence of psychically significant items in your vicinity. Such items are those that might have significant psychic imprints or histories that can be read by the psychometry occult skill unlock (see page 196), or items under the effects of the charge object or implant false reading spells. Items within range that contain significant psychic energy spark a recognition in your mind’s eye, but no other information is imparted. This spell doesn’t automatically detect magic items or strongly aligned items, though such items often have storied histories and might have had previous owners who possessed psychic abilities.","source":"Occult Adventures pg. 164"},{"n":"Flare","l":0,"school":"evocation [light]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"burst of light","duration":"instantaneous","save":"Fortitude negates","sr":"yes","effect":"This cantrip creates a burst of light. If you cause the light to burst in front of a single creature, that creature is dazzled for 1 minute unless it makes a successful Fortitude save. Sightless creatures, as well as creatures already dazzled, are not affected by flare.","source":"PRPG Core Rulebook pg. 284"},{"n":"Ghost Sound","l":0,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, M (a bit of wool or a small lump of wax)","range":"close (25 ft. + 5 ft./2 levels)","target":"illusory sounds","duration":"1 round/level (D)","save":"Will disbelief","sr":"no","effect":"Ghost sound allows you to create a volume of sound that rises, recedes, approaches, or remains at a fixed place. You choose what type of sound ghost sound creates when casting it and cannot thereafter change the sound's basic character.\n\nThe volume of sound created depends on your level. You can produce as much noise as four normal humans per caster level (maximum 40 humans). Thus, talking, singing, shouting, walking, marching, or running sounds can be created. The noise a ghost sound spell produces can be virtually any type of sound within the volume limit. A horde of rats running and squeaking is about the same volume as eight humans running and shouting. A roaring lion is equal to the noise from 16 humans, while a roaring dragon is equal to the noise from 32 humans. Anyone who hears a ghost sound receives a Will save to disbelieve.\n\nGhost sound can enhance the effectiveness of a silent image spell.\n\nGhost sound can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 289"},{"n":"Haunted Fey Aspect","l":0,"school":"illusion (glamer)","castingTime":"1 standard action","components":"S","range":"Personal","target":"You","duration":"1 round/level (D)","save":"","sr":"","effect":"You surround yourself with disturbing illusions, making you look and sound like a bizarre, insane fey creature. You gain DR 1/cold iron against a single opponent until the end of the spell, or until you take damage.","source":"Ultimate Combat pg. 230"},{"n":"Light","l":0,"school":"evocation [light]","castingTime":"1 standard action","components":"V, M/DF (a firefly)","range":"touch","target":"object touched","duration":"10 min./level","save":"none","sr":"no","effect":"This spell causes a touched object to glow like a torch, shedding normal light in a 20-foot radius, and increasing the light level for an additional 20 feet by one step, up to normal light (darkness becomes dim light, and dim light becomes normal light). In an area of normal or bright light, this spell has no effect. The effect is immobile, but it can be cast on a movable object.\n\nYou can only have one light spell active at any one time. If you cast this spell while another casting is still in effect, the previous casting is dispelled. If you make this spell permanent (through permanency or a similar effect), it does not count against this limit. Light can be used to counter or dispel any darkness spell of equal or lower spell level.","source":"PRPG Core Rulebook pg. 304"},{"n":"Lullaby","l":0,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"living creatures within a 10-ft.-radius burst","duration":"concentration + 1 round/level (D)","save":"Will negates","sr":"yes","effect":"Any creature within the area that fails a Will save becomes drowsy and inattentive, taking a –5 penalty on Perception checks and a –2 penalty on Will saves against sleep effects while the lullaby is in effect. Lullaby lasts for as long as the caster concentrates, plus up to 1 round per caster level thereafter.","source":"PRPG Core Rulebook pg. 305"},{"n":"Mage Hand","l":0,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one nonmagical, unattended object weighing up to 5 lbs.","duration":"concentration","save":"none","sr":"no","effect":"You point your finger at an object and can lift it and move it at will from a distance. As a move action, you can propel the object as far as 15 feet in any direction, though the spell ends if the distance between you and the object ever exceeds the spell's range.","source":"PRPG Core Rulebook pg. 306"},{"n":"Message","l":0,"school":"transmutation [language-dependent]","castingTime":"1 standard action","components":"V, S, F (a piece of copper wire)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level","duration":"10 min./level","save":"none","sr":"no","effect":"You can whisper messages and receive whispered replies. Those nearby can hear these messages with a DC 25 Perception check. You point your finger at each creature you want to receive the message. When you whisper, the whispered message is audible to all targeted creatures within range. Magical silence, 1 foot of stone, 1 inch of common metal (or a thin sheet of lead), or 3 feet of wood or dirt blocks the spell. The message does not have to travel in a straight line. It can circumvent a barrier if there is an open path between you and the subject, and the path's entire length lies within the spell's range. The creatures that receive the message can whisper a reply that you hear. The spell transmits sound, not meaning; it doesn't transcend language barriers. To speak a message, you must mouth the words and whisper.","source":"PRPG Core Rulebook pg. 313"},{"n":"Open/Close","l":0,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (a brass key)","range":"close (25 ft. + 5 ft./2 levels)","target":"object weighing up to 30 lbs. or portal that can be opened or closed","duration":"instantaneous","save":"Will negates (object)","sr":"yes (object)","effect":"You can open or close (your choice) a door, chest, box, window, bag, pouch, bottle, barrel, or other container. If anything resists this activity (such as a bar on a door or a lock on a chest), the spell fails. In addition, the spell can only open and close things weighing 30 pounds or less. Thus, doors, chests, and similar objects sized for enormous creatures may be beyond this spell's ability to affect.","source":"PRPG Core Rulebook pg. 317"},{"n":"Prestidigitation","l":0,"school":"universal","castingTime":"1 standard action","components":"V, S","range":"10 ft. Target, Effect, or Area see text","target":"","duration":"1 hour","save":"see text","sr":"no","effect":"Prestidigitations are minor tricks that novice spellcasters use for practice. Once cast, a prestidigitation spell enables you to perform simple magical effects for 1 hour. The effects are minor and have severe limitations. A prestidigitation can slowly lift 1 pound of material. It can color, clean, or soil items in a 1-foot cube each round. It can chill, warm, or flavor 1 pound of nonliving material. It cannot deal damage or affect the concentration of spellcasters. Prestidigitation can create small objects, but they look crude and artificial. The materials created by a prestidigitation spell are extremely fragile, and they cannot be used as tools, weapons, or spell components. Finally, prestidigitation lacks the power to duplicate any other spell effects. Any actual change to an object (beyond just moving, cleaning, or soiling it) persists only 1 hour.","source":"PRPG Core Rulebook pg. 325"},{"n":"Read Magic","l":0,"school":"divination","castingTime":"1 standard action","components":"V, S, F (a clear crystal or mineral prism)","range":"personal","target":"you","duration":"10 min./level","save":"none","sr":"no","effect":"Lets you decipher magical writing on an object at 250 words per minute; once read this way, you can reread that specific text without recasting. Also lets you identify a glyph of warding (DC 13 Spellcraft), a greater glyph of warding (DC 16 Spellcraft), or any symbol spell (DC 10 + spell level). Can be made permanent with permanency.","source":"PRPG Core Rulebook pg. 330"},{"n":"Touch of Fatigue","l":0,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a drop of sweat)","range":"touch","target":"creature touched","duration":"1 round/level","save":"Fortitude negates","sr":"yes","effect":"You channel negative energy through your touch, fatiguing the target. You must succeed on a touch attack to strike a target. The subject is immediately fatigued for the spell's duration. This spell has no effect on a creature that is already fatigued. Unlike with normal fatigue, the effect ends as soon as the spell's duration expires.","source":"PRPG Core Rulebook pg. 360"},{"n":"Unwitting Ally","l":0,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"You befuddle the target’s mind. The target has difficulty telling friend from foe for a short period of time. The subject is considered your ally and not your enemies’ ally while determining flanking. The subject takes no other hostile action against your enemies due to this spell’s effect.","source":"Advanced Player's Guide pg. 253"},{"n":"Adoration","l":1,"school":"enchantment [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes","effect":"The target of this spell is the subject of adoration by those whom it tries to affect with Diplomacy or during performance combat. If the target is out of combat, it receives a +2 morale bonus on all Diplomacy checks it makes to influence creatures. If the creature is engaged in performance combat (see page 153), the target gains a +2 morale bonus on all performance combat checks.","source":"Ultimate Combat pg. 222"},{"n":"Animate Rope","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one rope-like object, length up to 50 ft. + 5 ft./level; see text","duration":"1 round/level","save":"none","sr":"no","effect":"You can animate a nonliving rope-like object. The maximum length assumes a rope with a 1-inch diameter. Reduce the maximum length by 50% for every additional inch of thickness, and increase it by 50% for each reduction of the rope's diameter by half.\n\nThe possible commands are “coil” (form a neat, coiled stack), “coil and knot,” “loop,” “loop and knot,” “tie and knot,” and the opposites of all of the above (“uncoil,” and so forth). You can give one command each round as a move action, as if directing an active spell.\n\nThe rope can enwrap only a creature or an object within 1 foot of it—it does not snake outward—so it must be thrown near the intended target. Doing so requires a successful ranged touch attack roll (range increment 10 feet). A typical 1-inch-diameter hemp rope has 2 hit points, AC 10, and requires a DC 23 Strength check to burst it. The rope does not deal damage, but it can be used as a trip line or to cause a single opponent that fails a Reflex saving throw to become entangled. A creature capable of spellcasting that is bound by this spell must make a concentration check with a DC of 15 + the spell's level to cast a spell. An entangled creature can slip free with a DC 20 Escape Artist check.\n\nThe rope itself and any knots tied in it are not magical.\n\nThe spell cannot affect objects carried or worn by a creature.","source":"PRPG Core Rulebook pg. 242"},{"n":"Anticipate Peril","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 minute/level or until activated","save":"Will negates","sr":"yes","effect":"A creature affected by anticipate peril gains a preternatural sense of danger. The first time during this spell’s duration that the target has to make an initiative check, the creature adds an insight bonus on that initiative check equal to the spell’s caster level (maximum +5). Once this bonus applies, the effects of the spell end.\nMythic Anticipate Peril\n##Source## Mythic Adventures pg. 84\nAdd your tier to the spell’s initiative bonus and the maximum initiative bonus the spell can grant.","source":"Ultimate Magic pg. 206"},{"n":"Aphasia","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates (see text)","sr":"yes","effect":"You render the target unable to understand any language, including spoken language, written language, sign language, gestures attempting to mimic a crude language, or even truespeech and telepathy. The affected creature is unable to communicate, use command words, cast spells with verbal components, or use any other abilities that requires language. At the end of each of its turns, the subject can attempt a new saving throw to end the effect.\n\nTongues counters and dispels aphasia, and a creature with the tongues spell active is immune to aphasia. Oracles with the Tongues curse ignore aphasia in combat.","source":"Ultimate Intrigue pg. 204"},{"n":"Assumed Likeness","l":1,"school":"illusion (phantasm) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"10 minutes/level (D)","save":"Will disbelief","sr":"yes","effect":"You draw upon the memories of the targets to create a visual disguise for yourself that only they can see. When you cast the spell, you choose an emotion from the table below. Each target perceives you as a creature it feels that way toward. If it doesn’t feel that way toward anyone, it instead perceives you as a stranger with features likely to evoke that emotion (e.g., if you choose respect, a guard who was taught to respect her elders but who currently knows no elders might see you as an elderly version of yourself). Since you don’t know how you will appear to each target, you must match your actions and statements to fit with the illusion as best you can. While the spell grants a +10 bonus on Disguise checks like disguise self does, you also take a –5 penalty on Disguise checks until you can get a sense of who the target thinks you are. Each target who fails to disbelieve the phantasm and is fooled by your Disguise check takes a –2 penalty on Sense Motive checks to notice your lies, and each emotion choice grants you an additional benefit against such targets, as listed in the table below. EmotionEffect Fear+4 bonus on Intimidate checks Hate+2 bonus on attack rolls, -2 penalty to AC Lust+4 bonus on Sleight of Hands checks Respect+4 bonus on Diplomacy checks Trust+4 bonus on Bluff checks","source":"Inner Sea Intrigue pg. 58"},{"n":"Auditory Hallucination","l":1,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration","save":"Will disbelief","sr":"yes","effect":"You cause the targets to believe they hear any sound you imagine. The sound can include intelligible speech. Instead of precisely imagining a sound, you can identify a sound the subjects know and they imagine it doing what you describe as you cast the spell. For example, you could cast this spell on orc warriors and have them imagine the sound of their chieftain calling for help, even if you’ve never heard their chieftain and even if the chieftain speaks in a language you don’t understand. All targets hear the same hallucination. You can change the sound as part of concentrating on the spell.","source":"Ultimate Intrigue pg. 204"},{"n":"Bane","l":1,"school":"enchantment (compulsion) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"50 ft.","target":"50-ft.-radius burst centered on caster","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"Fills enemies in the burst with fear and doubt, imposing a -1 penalty on attack rolls and a -1 penalty on saving throws against fear effects. Counters and dispels bless.","source":"PRPG Core Rulebook pg. 246"},{"n":"Beguiling Gift","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F (the object to be offered)","range":"5 ft.","target":"one creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"You offer an object to an adjacent creature, and entice it into using or consuming the proffered item. If the target fails its Will save, it immediately takes the offered object, dropping an already held object if necessary. On its next turn, it consumes or dons the object, as appropriate for the item in question. For example, an apple would be eaten, a potion consumed, a ring put on a finger, and a sword wielded in a free hand. If the target is physically unable to accept the object, the spell fails. The subject is under no obligation to continue consuming or using the item once the spell’s duration has expired, although it may find a cursed item difficult to be rid of.","source":"Advanced Player's Guide pg. 205"},{"n":"Blend","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"S","range":"personal","target":"you","duration":"10 minutes/level","save":"none","sr":"no","effect":"You draw upon your elven link to the wilderness to change the coloration of yourself and your equipment to match that of your surroundings. This grants you a +4 circumstance bonus on Stealth checks and allows you to make Stealth checks without cover or concealment, but only while you move no more than half your base speed or less. If you move more than half your base speed on your turn, you gain no benefit from this spell until the start of your next turn. If you make an attack, this spell ends (as invisibility).","source":"Advanced Race Guide pg. 29"},{"n":"Blurred Movement","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level (D)","save":"none","sr":"no","effect":"This spell functions as blur, except that the blurring occurs only when you move at least 10 feet on your turn and ceases at the end of your movement. It is therefore mainly used to protect against attacks on your turn, such as attacks of opportunity. If you move at least twice your speed on your turn, the blurring lasts until the start of your next turn.","source":"Advanced Class Guide pg. 176"},{"n":"Bungle","l":1,"school":"enchantment (compulsion)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid","duration":"concentration + 2 rounds or until triggered","save":"Will negates","sr":"yes","effect":"The target takes a -20 penalty on its next attack roll or check that requires a d20 roll. The action must be one deliberately taken by the target on its turn. Creatures with more than 10 HD are unaffected by this spell.","source":"Ultimate Magic pg. 209"},{"n":"Burst of Adrenaline","l":1,"school":"transmutation","castingTime":"1 immediate action","components":"V, S","range":"personal","target":"you","duration":"instantaneous","save":"none","sr":"no","effect":"You draw upon your body’s inner reserves of strength, leaving you winded. When you are about to make a d20 roll based on Strength, Dexterity, or Constitution, you can cast this spell to gain a +8 enhancement bonus to Strength, Dexterity, or Constitution for that roll, but you are fatigued for 1 round afterward.","source":"Occult Adventures pg. 160"},{"n":"Burst of Insight","l":1,"school":"transmutation","castingTime":"1 immediate action","components":"V, S","range":"personal","target":"you","duration":"instantaneous","save":"none","sr":"no","effect":"You plumb the depths of your mind for insight, leaving you momentarily frazzled. When you are about to make a d20 roll based on Intelligence, Wisdom, or Charisma, you can cast this spell to gain a +8 enhancement bonus to Intelligence, Wisdom, or Charisma for that roll, but you are dazed for 1 round afterward.","source":"Occult Adventures pg. 160"},{"n":"Call Animal","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"see description","target":"one animal whose CR is equal or less than your caster level","duration":"1 hour/level (D)","save":"none","sr":"none","effect":"This spell calls the nearest wild animal of a particular type you designate (provided the animal’s CR is equal to or less than your caster level) to seek you out. The animal moves toward you under its own power, so the time it takes to arrive depends on how close an animal of the desired type is when you cast the spell. If there is no animal of that type capable of reaching you within the spell’s duration, you are aware of this fact, but the spell is wasted. Knowledge of the local fauna makes this spell more effective, and the GM may permit a Knowledge (nature) skill check (DC 15) to know what animals can be found in an area.\n\nWhen the called animal arrives, it approaches to within 5 feet of you and remains nearby for the duration of the spell. Its starting attitude is indifferent, modified by circumstances and interaction. Other than starting attitude, this spell gives you no special influence or ability to communicate with the called animal, although you may use other spells or abilities to do so.\n\nOnce the spell’s duration expires, the animal acts in accordance with its attitude. Most animals will likely wander off, but a hostile predatory animal may attack, especially if it is hungry or provoked.\n\nDomesticated animals or animals trained by someone else, including such creatures as familiars or animal companions, are unaffected by call animals.","source":"Advanced Player's Guide pg. 209"},{"n":"Cause Fear","l":1,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature with 5 HD or fewer","duration":"1d4 rounds (or 1 round; see text)","save":"Will partial","sr":"yes","effect":"Target becomes frightened; a successful save reduces this to shaken for 1 round instead. Creatures with 6 or more HD are unaffected. Counters and dispels remove fear.","source":"PRPG Core Rulebook pg. 252"},{"n":"Charge Object","l":1,"school":"transmutation","castingTime":"10 minutes","components":"V, S","range":"touch","target":"object touched","duration":"permanent","save":"none, see text","sr":"no","effect":"You charge an item with minor psychic energy. The item can be detected by the detect psychic significance spell. If you wish, you can imprint the item with your ownership history. Spells such as object reading and uses of the psychometry occult skill unlock (see page 196) can reveal any information about yourself you impart into the object, including your name, alignment, profession, and a summary of your experiences with the item. You can’t impart false information into the object, but you can omit any details you’d prefer not to divulge. If the target object is already psychically charged, you can add more information to it, but you can’t use charge object to erase existing psychic information.","source":"Occult Adventures pg. 161"},{"n":"Charm Person","l":1,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"This charm makes a humanoid creature regard you as its trusted friend and ally (treat the target's attitude as friendly). If the creature is currently being threatened or attacked by you or your allies, however, it receives a +5 bonus on its saving throw.\n\nThe spell does not enable you to control the charmed person as if it were an automaton, but it perceives your words and actions in the most favorable way. You can try to give the subject orders, but you must win an opposed Charisma check to convince it to do anything it wouldn't ordinarily do. (Retries are not allowed.) An affected creature never obeys suicidal or obviously harmful orders, but it might be convinced that something very dangerous is worth doing. Any act by you or your apparent allies that threatens the charmed person breaks the spell. You must speak the person's language to communicate your commands, or else be good at pantomiming.","source":"PRPG Core Rulebook pg. 254"},{"n":"Color Spray","l":1,"school":"illusion (pattern) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (red, yellow, and blue powder or colored sand)","range":"15 ft.","target":"cone-shaped burst","duration":"instantaneous; see text","save":"Will negates","sr":"yes","effect":"A vivid cone of clashing colors springs forth from your hand, causing creatures to become stunned, perhaps also blinded, and possibly knocking them unconscious. Each creature within the cone is affected according to its HD.\n\n2 HD or less: The creature is unconscious, blinded, and stunned for 2d4 rounds, then blinded and stunned for 1d4 rounds, and then stunned for 1 round. (Only living creatures are knocked unconscious.)\n\n3 or 4 HD: The creature is blinded and stunned for 1d4 rounds, then stunned for 1 round.\n\n5 or more HD: The creature is stunned for 1 round.\n\nSightless creatures are not affected by color spray.Mythic Color SpraySource Mythic Adventures pg. 88\nThe range increases to 30 feet. Add half your tier to the spell’s Hit Dice categories to determine its effects on creatures. (At 3rd tier a creature with 3 or fewer HD is unconscious, blinded, and stunned; one with 4 or 5 HD is blinded and stunned, and one with 6 or more HD is stunned.) Creatures that succeed at their saves are dazzled for 1 minute.","source":"PRPG Core Rulebook pg. 256"},{"n":"Command","l":1,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"Issues a single-word command the target must obey on its next turn: Approach, Drop, Fall, Flee, or Halt. Approach/Flee force movement (provoking attacks of opportunity); Drop forces release of held items; Fall forces prone; Halt forces the target to stand motionless (taking no actions). A target unable to obey is unaffected.","source":"PRPG Core Rulebook pg. 256"},{"n":"Compel Hostility","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a drop of your blood)","range":"personal","target":"you","duration":"1 round/level","save":"see text","sr":"see text","effect":"Whenever a creature you can see that threatens you makes an attack against one of your allies, as an immediate action, you can compel that creature to attack you instead. When you compel a creature to attack you, you must first overcome that creature’s spell resistance, and the creature can attempt a Will saving throw to ignore the compulsion.\n\nA summoner casting this spell can choose his eidolon as the target of the spell.","source":"Ultimate Combat pg. 226"},{"n":"Comprehend Languages","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (pinch of soot and salt)","range":"personal","target":"you","duration":"10 min./level","save":"none","sr":"no","effect":"You can understand the spoken words of creatures or read otherwise incomprehensible written messages. The ability to read does not necessarily impart insight into the material, merely its literal meaning. The spell enables you to understand or read an unknown language, not speak or write it.\nWritten material can be read at the rate of one page (250 words) per minute. Magical writing cannot be read, though the spell reveals that it is magical. This spell can be foiled by certain warding magic (such as the secret page and illusory script spells). It does not decipher codes or reveal messages concealed in otherwise normal text.\nComprehend languages can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 258"},{"n":"Compulsive Liar","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"The target becomes unable to speak the truth. Lies the target speaks don’t need to be convincing, nor do they even need to be consistent, but they can’t be true as far as the target is aware. This extends to non-verbal communication, such as hand signs or written notes. The spell allows talking in metaphors and talking about fictional figures.\n\nThe spell doesn’t affect the target’s ability to say things that are neither true nor false, such as questions, commands, or verbal spell components. If the target of this spell is simultaneously compelled to tell the truth (for instance, by being within a zone of truth), the target is only able to say things that are neither true nor false.","source":"Ultimate Intrigue pg. 206"},{"n":"Confusion, Lesser","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"This spell causes a single creature to become confused for 1 round.","source":"PRPG Core Rulebook pg. 258"},{"n":"Coward's Cowl","l":1,"school":"enchantment [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level","save":"Will negates (harmless)","sr":"no","effect":"You imbue the target with a compulsion to avoid threats, enhancing its defensive instincts. So long as the affected creature does not move closer to enemies during its turn, or moves at least 5 feet away from adjacent enemies, it gains a +1 morale bonus to its AC, and a +1 morale bonus on saves and on attack rolls made as readied actions and attacks of opportunity. Alternatively, if the affected creature does not close with its enemies, it can increase the DC of all spells it casts as part of a readied action by 1. If the subject of the spell willingly moves toward a threatening creature, the spell immediately ends.\nWhile affected by coward’s cowl, a creature takes a –2 penalty on all saving throws against fear effects.","source":"Agents of Evil pg. 30"},{"n":"Crime of Opportunity","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a silt purse)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"Compels the target to immediately commit a single criminal act, mirroring the type of behavior forced by crime wave, but for only one round.","source":"Ultimate Intrigue pg. 208"},{"n":"Decrepit Disguise","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one object of no more than 10 cu. ft./level","duration":"1 day/level","save":"none (object) or Will disbelief (if interacted with)","sr":"no","effect":"You make an object seem like a worthless version of itself. A masterwork or magic sword could seem to be a useless, rusting, discarded blade, and a luxurious throne could appear to be a decrepit wooden chair. If used against an attended object, the wielder can immediately attempt a Will save to disbelieve the effect. Decrepit disguise counters and dispels quintessence.\n\nDecrepit disguise can be made permanent with a permanency spell by a caster of 9th level or higher for the cost of 500 gp.","source":"Occult Adventures pg. 163"},{"n":"Deja Vu","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"2 rounds","save":"none","sr":"yes","effect":"You reach into the target’s mind and put its thought processes into a temporary loop. Whatever full-round, standard, or move actions the creature takes on its first turn after you cast this spell, it must repeat on the turn after that. The creature must take the same type of actions in the same order (for example, making a full attack, casting a specific spell, withdrawing, attempting a bull rush combat maneuver, or activating a magic item) and must act against the same target or targets, but doesn’t have to make exactly the same choices (such as using Power Attack when attacking, moving exactly 15 feet, or choosing “drop” for the command spell). If the circumstances would prevent the target from repeating an action, such as if the target of its attack is dead or the target cannot cast the same spell again, the target instead becomes confused until the spell ends. A creature currently affected by deja vu can’t be targeted with another deja vu spell. A creature affected by deja vu can’t delay, and if it readies an action on its first turn, it must ready the same action on its second turn.","source":"Occult Adventures pg. 163"},{"n":"Delusional Pride","l":1,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute","save":"Will negates","sr":"yes","effect":"The target becomes so distracted by an overblown sense of its worth that it takes a –2 penalty on attacks and skill checks. However, this feeling also gives the target a +2 morale bonus on saves against charm and compulsion effects.","source":"Ultimate Magic pg. 216"},{"n":"Demand Offering","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"5 ft.","target":"one creature","duration":"instantaneous or 1 round","save":"Will negates","sr":"yes","effect":"Forces the target, on a failed save, to surrender one item it holds or wields to you as an immediate action, or as a move action on its next turn if it has no immediate action available; if it holds multiple items, one is chosen at random. The spell fails outright if you are not adjacent when the transfer would occur or if the target is holding nothing.","source":"Occult Adventures pg. 164"},{"n":"Detect Charm","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"none","sr":"no","effect":"This spell functions as per detect magic, except that it detects only charm, compulsion, and possession effects. You immediately detect the strength and location of each such aura on all creatures in the area. You can attempt to identify the properties of each aura (see Spellcraft on page 106 the Pathfinder RPG Core Rulebook). In addition to noticing the targets of these effects, you can recognize when creatures in the area are using these effects on others by attempting a Sense Motive check as a standard action (DC = 20 + caster level). If you succeed, you can attempt a Spellcraft check to identify what magic it is using (even if the target is not in the area).","source":"Adventurer's Guide pg. 77, Andoran, Spirit of Liberty pg. 27"},{"n":"Detect Secret Doors","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 min./level (D)","save":"none","sr":"no","effect":"You can detect secret doors, compartments, caches, and so forth. Only passages, doors, or openings that have been specifically constructed to escape detection are detected by this spell. The amount of information revealed depends on how long you study a particular area or subject.\n1st Round: Presence or absence of secret doors.\n2nd Round: Number of secret doors and the location of each. If an aura is outside your line of sight, then you discern its direction but not its exact location.\nEach Additional Round: The mechanism or trigger for one particular secret portal closely examined by you. Each round, you can turn to detect secret doors in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"PRPG Core Rulebook pg. 268"},{"n":"Detect Undead","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (earth from a grave)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 min./level","save":"none","sr":"no","effect":"You can detect the aura that surrounds undead creatures. The amount of information revealed depends on how long you study a particular area.\n1st Round: Presence or absence of undead auras.\n2nd Round: Number of undead auras in the area and the strength of the strongest undead aura present. If you are of good alignment, and the strongest undead aura's strength is overwhelming (see below), and the creature has HD of at least twice your character level, you are stunned for 1 round and the spell ends.\n3rd Round: The strength and location of each undead aura. If an aura is outside your line of sight, then you discern its direction but not its exact location.\nAura Strength: The strength of an undead aura is determined by the HD of the undead creature, as given on the table below.\nLingering Aura: An undead aura lingers after its original source is destroyed. If detect undead is cast and directed at such a location, the spell indicates an aura strength of dim (even weaker than a faint aura). How long the aura lingers at this dim level depends on its original power, as given on the table below.\nHDStrengthLingering Aura Duration\n1 or lowerFaint1d6 rounds\n2-4Moderate1d6 minutes\n5-10Strong1d6 x 10 minutes\n11 or higherOverwhelming1d6 days\nEach round, you can turn to detect undead in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"PRPG Core Rulebook pg. 269"},{"n":"Diagnose Disease","l":1,"school":"Divination","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"Consultar manual","duration":"Instantaneous","save":"None","sr":"No","effect":"You determine whether a creature, object, or area carries any sort of disease or infestation (including molds, slimes, and similar hazards), or any exceptional or supernatural effects causing the sickened or nauseated effects. If there is disease present, you know what disease it is and its effects. If the target is a creature, you gain a +4 bonus on Heal checks to treat the creature's disease. The spell can penetrate many barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"Ultimate Magic"},{"n":"Discern Next of Kin","l":1,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F (a copper piece)","range":"60 ft.","target":"one creature","duration":"concentration, up to 1 minute/level (D)","save":"Will negates (see text)","sr":"yes","effect":"You can scan the thoughts of one individual and learn the names and locations of the target’s living relatives, as well as the attitude of the target toward those relatives (and vice versa). You learn about one relative per round you concentrate on the target. For example, you might learn that the target’s father’s name is Jarn, the father lives on a nearby farm, and the target and his father don’t get along. Since this spell reads the target’s mind, you can learn only what the target knows or believes.","source":"Advanced Class Guide pg. 179"},{"n":"Disguise Self","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 min./level (D)","save":"none","sr":"no","effect":"You make yourself—including clothing, armor, weapons, and equipment—look different. You can seem 1 foot shorter or taller, thin, fat, or in between. You cannot change your creature type (although you can appear as another subtype). Otherwise, the extent of the apparent change is up to you. You could add or obscure a minor feature or look like an entirely different person or gender.\nThe spell does not provide the abilities or mannerisms of the chosen form, nor does it alter the perceived tactile (touch) or audible (sound) properties of you or your equipment. If you use this spell to create a disguise, you get a +10 bonus on the Disguise check. A creature that interacts with the glamer gets a Will save to recognize it as an illusion.","source":"PRPG Core Rulebook pg. 271"},{"n":"Disguise Weapon","l":1,"school":"illusion (glamer)","castingTime":"1 round","components":"V, S","range":"touch","target":"manufactured weapon touched","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"You make one manufactured weapon look like a different manufactured weapon of the same size and relative encumbrance (light, one-handed, or two-handed). For example, you could make a Small greatsword look like a Small quarterstaff, a Medium club, or a Large dagger. Even the appearance of an improvised weapon is possible. The extent of the apparent change is up to you. You could add or obscure a minor feature or make the item look like it is composed of different materials (stone, wood, adamantine, and so on). The spell does not provide any of the abilities of the chosen form, nor does it alter the perceived tactile or audible properties of the item or how it is wielded. A creature that interacts with the glamer may attempt a Will save to recognize it as an illusion.","source":"Advanced Class Guide pg. 180"},{"n":"Doom","l":1,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"Fills the target with dread, rendering it shaken for the duration.","source":"PRPG Core Rulebook pg. 274"},{"n":"Echo","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"S, F (a conch shell)","range":"close (25 ft. + 5 ft./2 levels) or long (400 ft. + 40 ft./level); see text","target":"one 10--ft. cube/level (S)","duration":"1 round/level (D)","save":"Will disbelief (if interacted with)","sr":"yes","effect":"You cause a sound heard in the target area up to 1 round ago and lasting up to 1 round in duration to repeat at a regular interval. The original sound need not have come from the area, but it echoes from the target area at its original full volume. Any special effects of the sound are not duplicated by this spell. If the area is naturally prone to echoes, such as a space surrounded on at least two sides by cliffs or high river banks, the spell’s range is long. Otherwise, the spell’s range is close.\n\nYou can concentrate as a standard action to alter the echo. You can change it to be any sound audible in the area within the last 1 round, move the apparent source of the sound within the area, or attempt a Bluff check to create a distraction to hide with a bonus equal to your caster level.","source":"Ultimate Wilderness pg. 229"},{"n":"Egorian Diplomacy","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a bent coin)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"instant; see text","save":"Will negates","sr":"yes","effect":"As part of casting this spell, you can attempt a single Intimidate skill check to make a target act friendly toward you. If you succeed, the target assists you normally, but Egorian diplomacy clouds the memory of any threats or pressure you applied. The target remembers assisting you, but can’t remember why, and its attitude toward you doesn’t worsen as a result of being intimidated.\n\nWhether a creature fails or succeeds at its saving throw, it becomes immune to further castings of Egorian diplomacy for 24 hours.","source":"Spymaster's Handbook pg. 28"},{"n":"Expeditious Retreat","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 min./level (D)","save":"none","sr":"no","effect":"This spell increases your base land speed by 30 feet. This adjustment is treated as an enhancement bonus. There is no effect on other modes of movement, such as burrow, climb, fly, or swim. As with any effect that increases your speed, this spell affects your jumping distance (see the Acrobatics skill).\nMythic Expeditious Retreat\n##Source## Mythic Adventures pg. 93\nThe speed bonus from the spell increases to 40 feet. Add your tier to Acrobatics checks to avoid attacks of opportunity from movement, and when your movement provokes an attack of opportunity, add your tier to your AC against that attack.","source":"PRPG Core Rulebook pg. 279"},{"n":"Faerie Fire","l":1,"school":"evocation [light]","castingTime":"1 standard action","components":"V, S, DF","range":"long (400 ft. + 40 ft./level)","target":"creatures and objects within a 5-ft.-radius burst","duration":"1 min./level (D)","save":"none","sr":"yes","effect":"A pale glow surrounds and outlines the subjects. Outlined subjects shed light as candles. Creatures outlined by faerie fire take a –20 penalty on all Stealth checks. Outlined creatures do not benefit from the concealment normally provided by darkness (though a 2nd-level or higher magical darkness effect functions normally), blur, displacement, invisibility, or similar effects. The light is too dim to have any special effect on undead or dark-dwelling creatures vulnerable to light. The faerie fire can be blue, green, or violet, according to your choice at the time of casting. The faerie fire does not cause any harm to the objects or creatures thus outlined.","source":"Core Rulebook pg. 280"},{"n":"False Face","l":1,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, M (a folded-paper mask)","range":"personal","target":"you","duration":"1 hour/level","save":"none","sr":"no","effect":"This spell alters details of your appearance so that you are no longer recognizable as yourself. Your new appearance is within the norms for your race, ethnicity, and gender. You lack control over the details of your appearance; however, when casting false face, you can choose an appearance you previously used, allowing you to maintain specific identities.","source":"Heroes of the High Court pg. 25"},{"n":"Fastidiousness","l":1,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"24 hours","save":"","sr":"","effect":"While protected by fastidiousness, your person and your equipment stay clean and dry. Dust and moisture slough off immediately; even when you are completely soiled, your appearance reverts to a pristine state over the course of 1 minute. While this spell offers no protection against most attacks, staying constantly sanitary grants you a +2 circumstance bonus on Fortitude saving throws against inhaled and ingested diseases.\n\nMembers of the Prophet of Kalistrade prestige class can cast this spell, even though it is not a divination or enchantment.","source":"Disciple's Doctrine pg. 13"},{"n":"Fool's Gold (AA)","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (a lump of gold worth 5 gp)","range":"touch","target":"1 gold piece/level touched","duration":"10 minutes/level","save":"Fortitude negates (object, see text)","sr":"yes","effect":"You cast this spell on one or more gold pieces, which make those who have them more vulnerable to your magics. A creature with one or more of these gold pieces in its possession must attempt a Will save (at this spell’s save DC) the first time the creature is forced to attempt a saving throw against a spell, spell-like ability, or supernatural ability you create. If the creature fails, it takes a –2 penalty on all saving throws against your magic effects as long as the gold piece is in its possession. Additionally, if it fails a saving throw against a magic ability of yours that is not harmless and has a duration, the duration is doubled for that creature.","source":"Arcane Anthology pg. 20"},{"n":"Fool's Gold (VC)","l":1,"school":"illusion","castingTime":"1 standard action","components":"V, S, M (a copper piece or silver piece)","range":"touch","target":"objects touched","duration":"1 hour/level","save":"none or Will disbelief (see text)","sr":"no","effect":"You can temporarily make copper or silver seem to be an equivalent amount of gold. The spell affects 1 gp/level worth of material (thus, at 3rd level, the spell affects up to 300 copper pieces, 30 silver pieces, or a copper or silver item worth no more than 3 gp). Coins increase in value as normal for the new type of coinage. For items other than coins, some of the value of the item comes from its craftsmanship, regardless of the metal used, so the value of the item seems to be 5 times (for silver items) or 50 times (for copper items) its true value. Thus, a copper candlestick originally worth 5 cp transformed by this spell appears to be worth 250 cp, or 2 gp and 5 sp. A successful DC 25 Appraise check automatically detects the true nature of the coins or items. Creatures inspecting or interacting with the coins or items can attempt a saving throw to disbelieve the illusion.","source":"Villain Codex pg. 117"},{"n":"Forbid Action","l":1,"school":"Enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature","duration":"1 round","save":"Will negates","sr":"Yes","effect":"You forbid the target a single course of action, which it avoids to the best of its ability. You may demand the target not take actions that fall into one of the following options.\n\nAttack: The target cannot take any action that involves an attack roll, or uses a spell or ability that targets a foe or an area that includes a foe.\nCast: Target cannot cast spells or use spell-like abilities.\nCommunicate: The target cannot take any actions that allow it to communicate with anyone. This includes such acts as speaking, Bluff checks to pass secret messages, writing, and using telepathy. It does not prevent verbalizations made for purposes other than communication, such as command words or the verbal component of spellcasting.\nDraw: Target cannot ready or prepare any item, weapon, component, or equipment.\nMove: The target can take no act that would cause it to end up in a different location. The target does not resist being moved by others (and thus can be picked up or dragged, or can float along on a raft), but does not consciously attempt to move (including not directing a mount to move).\n\nThe target is free to take any actions not forbidden by the caster. For example, a target affected by this spell's demand to not move is still free to cast spells, make attacks, or shout for help.","source":"Ultimate Magic"},{"n":"Forced Quiet","l":1,"school":"transmutation [sonic]","castingTime":"1 standard action","components":"S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"With a gesture, you muffle sound around the target, making it unable to yell or otherwise make loud noises. This does not affect spellcasting by the target. The target can still use sonic effects, but the DC of these effects decreases by 2. The target gains a +2 bonus on saving throws against sonic effects. The target gains a +4 circumstance bonus on Stealth checks.","source":"Ultimate Magic pg. 221"},{"n":"Fumblestep","l":1,"school":"conjuration","castingTime":"1 standard action","components":"V, S, M (a sharp pebble)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level or until discharged (see text)","save":"none (see text)","sr":"yes","effect":"Fumblestep coats a target's feet in slick ectoplasm that retains some psychic connection to your mind. While the spell remains in effect, the target creature takes a -1 penalty on Reflex saving throws and Acrobatics checks.  At any point during the spell's duration while the target remains in range, you can discharge the spell as a standard action, mentally tugging at the ectoplasm to perform a trip combat maneuver, using your caster level instead of your base attack bonus, and using your Charisma, Intelligence, or Wisdom modifier, whichever is highest, instead of your Strength modifier. This trip attempt does not provoke an attack of opportunity and cannot be affected by feats or other means of altering a trip combat maneuver's effects.","source":"Blood of the Beast pg. 27"},{"n":"Fumbletongue","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1d4 rounds","save":"Will negates","sr":"yes","effect":"This enchantment causes a creature to be unable to speak intelligibly. Any effort the target makes to talk, in any language, comes out as a useless mix of unconnected words and noises. Even magic words are affected to some extent; the target has a 20% spell failure chance for any spell it attempts to cast with verbal components, and a 20% chance to incorrectly use a command word to activate a magic item. This spell has no effect on telepathic communication, or the vocalizations of creatures that lack a spoken language.","source":"Ultimate Magic pg. 221"},{"n":"Grease","l":1,"school":"conjuration (creation)","castingTime":"1 standard action","components":"V, S, M (butter)","range":"close (25 ft. + 5 ft./2 levels)","target":"one object or 10-ft. square","duration":"1 min./level (D)","save":"see text","sr":"no","effect":"A grease spell covers a solid surface with a layer of slippery grease. Any creature in the area when the spell is cast must make a successful Reflex save or fall. A creature can walk within or through the area of grease at half normal speed with a DC 10 Acrobatics check. Failure means it can't move that round (and must then make a Reflex save or fall), while failure by 5 or more means it falls (see the Acrobatics skill for details). Creatures that do not move on their turn do not need to make this check and are not considered flat-footed.\n\nThe spell can also be used to create a greasy coating on an item. Material objects not in use are always affected by this spell, while an object wielded or employed by a creature requires its bearer to make a Reflex saving throw to avoid the effect. If the initial saving throw fails, the creature immediately drops the item. A saving throw must be made in each round that the creature attempts to pick up or use the greased item. A creature wearing greased armor or clothing gains a +10 circumstance bonus on Escape Artist checks and combat maneuver checks made to escape a grapple, and to their CMD to avoid being grappled.","source":"PRPG Core Rulebook pg. 291"},{"n":"Healing Thief","l":1,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a bit of sponge, damp with tears)","range":"touch","target":"creature touched","duration":"1 round/level or until discharged","save":"none","sr":"yes","effect":"With this spell you can steal the healing of the target creature. You must succeed at a melee touch attack to strike the target. If you do, until the effect ends, whenever your target is subject to a healing spell or a supernatural effect that heals hit points, the target only receives half the healing (rounded down) and you receive the other half (also rounded down). You must remain within 25 feet (plus 5 feet per two caster levels) of the target to gain this benefit. If you move outside that range, the spell is discharged. Once you steal 5 hit points per your caster level (maximum 50 hit points) of healing from this spell's effect, the spell is discharged.","source":"Ultimate Combat pg. 231"},{"n":"Heightened Awareness","l":1,"school":"divination","castingTime":"1 standard action","components":"V, M/DF (a coffee bean)","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"You enter a heightened state of awareness that allows you to notice more about your surroundings and recall information effortlessly. You gain a +2 competence bonus on Perception checks and on all Knowledge checks that you are trained in.\nIf this spell is active when you have to make an initiative check, you can instantly dismiss this spell and gain a +4 bonus on that check.","source":"Advanced Class Guide pg. 183"},{"n":"Hermean Potential","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F (a gold dragon scale)","range":"touch","target":"creature touched","duration":"1 minute/level","save":"Will negates (harmless)","sr":"no","effect":"You gift the target with the ability to perfect its actions via mental clarity. On the next attack roll, saving throw, ability check, or skill check the target attempts, it rolls twice and takes the more favorable result. For every 5 caster levels you have, the target can roll twice on an additional attack roll, saving throw, ability check, or skill check (to a maximum of 5 rolls at 20th level).  Hermean potential is countered and dispelled by ill omenAPG, but does not itself counter or dispel ill omen.","source":"Legacy of Dragons pg. 31"},{"n":"Hide Bruises","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (a drop of blood)","range":"touch","target":"one creature touched","duration":"10 minutes/level (D)","save":"none and Will disbelief; see text","sr":"yes (harmless)","effect":"Visually conceals injuries on the target, imposing a -10 penalty on Heal checks made to gauge the severity of its wounds; a creature that physically touches the glamered area may attempt a Will save to see through the illusion.","source":"Villain Codex pg. 20"},{"n":"Hideous Laughter","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (tiny fruit tarts and a feather)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature; see text","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"This spell afflicts the subject with uncontrollable laughter. It collapses into gales of manic laughter, falling prone. The subject can take no actions while laughing, but is not considered helpless. After the spell ends, it can act normally. On the creature's next turn, it may attempt a new saving throw to end the effect. This is a full round action that does not provoke attacks of opportunity. If this save is successful, the effect ends. If not, the creature continues laughing for the entire duration.\n\nA creature with an Intelligence score of 2 or lower is not affected. A creature whose type is different from the caster's receives a +4 bonus on its saving throw, because humor doesn't “translate” well.","source":"PRPG Core Rulebook pg. 296"},{"n":"Hobble","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a drop of glue)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 20 feet apart","duration":"1 round/level","save":"Fortitude negates","sr":"yes","effect":"This spell disrupts the method a target uses for movement. Creatures under the effects of this spell move at half their base speed (rounded down to the nearest 5-foot increment) but can still take 5-foot steps as normal. Incorporeal creatures and creatures flying with perfect maneuverability are immune to the effects of this spell. Each round, a target receives another save to end the effect.","source":"Villain Codex pg. 200"},{"n":"Hypnotism","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"several living creatures, no two of which may be more than 30 ft. apart","duration":"2d4 rounds (D)","save":"Will negates","sr":"yes","effect":"Your gestures and droning incantation fascinate nearby creatures, causing them to stop and stare blankly at you. In addition, you can use their rapt attention to make your suggestions and requests seem more plausible. Roll
