t your mantle of doubt is affected for 1d4+1 rounds, during which time it is shaken, cannot flank, and no longer threatens creatures within its reach. In addition, it takes a –2 penalty on saves against mind-affecting effects, which stacks with the penalties for being shaken. If your mantle of doubt affects a creature that is already shaken, that creature’s fear level doesn’t increase. Instead, mounting doubts stagger the creature for 1 round and deal 1d4 points of Wisdom and Charisma damage to it. Spell resistance applies against assaults from a mantle of doubt , and immunity to fear or mind-affecting effects negates the spell’s effects. If you are immune to fear or mind-affecting effects, you can still cast mantle of doubt on yourself.","source":"Occult Origins pg. 30"},{"n":"Night Terrors","l":6,"school":"illusion (phantasm) [emotion, evil, mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a drop of black ink)","range":"touch","target":"intelligent creature touched","duration":"1 day/level (D)","save":"Will negates","sr":"yes","effect":"The target of this spell gains no benefit from normal or magical sleep, writhing in a series of nightmares that torture its psyche and diminish its ability to perform strenuous tasks. The target doesn’t heal ability or hit point damage naturally and can’t prepare spells or regain spell slots. After one night of poor sleep, the target is fatigued (or exhausted if it was fatigued before trying to rest). A creature affected by this spell doesn’t recover from the fatigued or exhausted condition inflicted by this spell after resting, nor do spells such as lesser restoration provide any respite. Each restless night, the target takes 1d4 points of Wisdom damage, which also can’t be recovered by magic while night terrors is active.\n\nThe images from previous nightmares continue to haunt the target’s mind while awake. If the target has rested at least once while affected by night terrors and then becomes subjected to a fear condition, the target experiences the next higher level of fear than it would normally. However, per the alternate rules for fear (see page 10), this spell cannot cause a lesser state of fear to become a greater one. If the effect causing the fear condition doesn’t usually stack with other fear effects, the target’s level of fear does not increase. This aspect of the spell is a fear effect.\n\nThe affected creature can attempt a new saving throw once per day to end night terrors, but multiple attempts to rest in a given day do not afford the target multiple saves. A creature that successfully saves against night terrors ends the spell and rests normally that night but gains the benefits of only that night’s rest, not any benefits missed on previous nights.\n\nIf your campaign uses the sanity system (see page 12), the target takes 1d8 points of sanity damage instead of Wisdom damage.","source":"Horror Adventures pg. 123"},{"n":"Overwhelming Presence","l":6,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a swan feather)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates, see text","sr":"yes","effect":"Your presence inspires incredible awe in those nearby. A creature that fails a save against this spell falls to the ground and prostrates itself before you, believing it bows before a divine presence. A flying creature incapable of hovering must land immediately in order to prostrate itself. These creatures are considered to be helpless for the duration of the spell. Each round on its turn, a target of this spell may attempt a new saving throw to end the effect; this is a full-round action that does not provoke attacks of opportunity. A creature that recovers from this spell early after being affected by it for at least 1 round takes 1d6 points of Wisdom drain and is staggered for 1d4 rounds. A creature that makes the initial save to resist this spell is merely staggered for 1 round.","source":"Ultimate Magic pg. 230"},{"n":"Permanent Image","l":6,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"figment that cannot extend beyond a 20-ft. cube + one 10-ft. cube/level (S)","duration":"permanent (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that the figment includes visual, auditory, olfactory, and thermal elements, and the spell is permanent. By concentrating, you can move the image within the limits of the range, but it is static while you are not concentrating.","source":"PRPG Core Rulebook pg. 319"},{"n":"Phantasmal Revenge","l":6,"school":"illusion (phantasm) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch and unlimited; see text","target":"dead body touched","duration":"instantaneous","save":"Will disbelief then Fortitude partial, see text","sr":"yes","effect":"When you cast this eerie spell upon a recently slain creature, you cause a ghastly, spectral image of it to rise up from its corpse, shrieking for vengeance before it vanishes in a burst of unnatural light. This phantom then unerringly seeks out the creature that killed it, as long as that creature is on the same plane, and tries to slay its killer in turn.\n\nOnly the corpse’s killer can see the phantasmal image created by this spell. You and any others who witness the spell’s casting or its ultimate effects see only a vague shape. The target first gets a Will save to disbelieve the illusion. If that save fails, the target must succeed on Fortitude saving throw or take 10 points of damage per caster level from the phantasmal image. Even if the Fortitude save is successful, the target takes 5d6 points of damage + 1 point of damage per caster level. You know immediately if the spell succeeded or failed to kill its target but gain no other information, including the identity of the target of the spell. \n\nThe creature providing the corpse must have died no more than 1 day per caster level prior to the casting of this spell. If the creature that provided the corpse was not, in fact, killed by another, or if the killer is dead or no longer on the same plane, the spell fails. Phantasmal revenge makes no moral judgments; it targets winners of fair fights just as easily as murderers. Any given body can only be targeted by a phantasmal revenge spell once.","source":"Advanced Player's Guide"},{"n":"Power Word Blind","l":6,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature with 200 hp or less","duration":"see text","save":"none","sr":"yes","effect":"You utter a single word of power that causes a creature to become blinded, whether the creature can hear the word or not. The duration of the spell depends on the target's current hit point total. Any creature that currently has 201 or more hit points is unaffected.Hit PointsDuration50 or lessPermanent51-1001d4+1 minutes101-2001d4+1 rounds","source":"PRPG Core Rulebook pg. 324"},{"n":"Programmed Image","l":6,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, M (fleece and jade dust worth 25 gp)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond a 20-ft. cube + one 10-ft. cube/level (S)","duration":"permanent until triggered, then 1 round/level","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that this spell's figment activates when a specific condition occurs. The figment includes visual, auditory, olfactory, and thermal elements, including intelligible speech.\n\nYou set the triggering condition (which may be a special word) when casting the spell. The event that triggers the illusion can be as general or as specific and detailed as desired but must be based on an audible, tactile, olfactory, or visual trigger. The trigger cannot be based on some quality not normally obvious to the senses, such as alignment. See magic mouth for more details about such triggers.","source":"PRPG Core Rulebook pg. 327"},{"n":"Project Image","l":6,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S, M (a small replica of you worth 5 gp)","range":"medium (100 ft. + 10 ft./level)","target":"one shadow duplicate","duration":"1 round/level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"You tap energy from the Plane of Shadow to create a quasi-real, illusory version of yourself. The projected image looks, sounds, and smells like you but is intangible. The projected image mimics your actions (including speech) unless you direct it to act differently (which is a move action).\n\nYou can see through its eyes and hear through its ears as if you were standing where it is, and during your turn you can switch from using its senses to using your own, or back again, as a free action. While you are using its senses, your body is considered blinded and deafened.\n\nIf you desire, any spell you cast whose range is touch or greater can originate from the projected image instead of from you. The projected image can't cast any spells on itself except for illusion spells. The spells affect other targets normally, despite originating from the projected image.\n\nObjects are affected by the projected image as if they had succeeded on their Will save. You must maintain line of effect to the projected image at all times. If your line of effect is obstructed, the spell ends. If you use dimension door, teleport, plane shift, or a similar spell that breaks your line of effect, even momentarily, the spell ends.","source":"PRPG Core Rulebook pg. 327"},{"n":"Scrying, Greater","l":6,"school":"divination (scrying)","castingTime":"1 standard action","components":"V, S","range":"see text","target":"magical sensor","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"This spell functions like scrying, except as noted above. Additionally, all of the following spells function reliably through the sensor: detect chaos, detect evil, detect good, detect law, detect magic, message, read magic, and tongues.","source":"PRPG Core Rulebook pg. 337"},{"n":"Shadow Enchantment, Greater","l":6,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S","range":"see text","target":"see text","duration":"see text","save":"Will disbelief, see text","sr":"yes","effect":"This spell functions like shadow enchantment, except that it enables you to create partially real, illusory versions of psychic, sorcerer, or wizard enchantment spells of 5th level or lower. If the spell is recognized as a greater shadow enchantment, it’s only three-fifths (60%) as effective.","source":"Occult Realms pg. 17"},{"n":"Song of Discord, Greater","l":6,"school":"enchantment (compulsion) [mind-affecting, sonic]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"creatures within a 20-ft. radius spread","duration":"1 round/level","save":"Will partial","sr":"yes","effect":"This spell functions as song of discord except that affected creatures automatically attack the nearest target each round. In addition, all affected creatures gain a +4 morale bonus to Strength for the duration of the spell. A creature that succeeds at the Will save reduces the effect’s duration to 1 round.","source":"Chronicle of Legends pg. 14"},{"n":"Symbol of Distraction","l":6,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"10 minutes","components":"V, S, M (mercuty and phosphorus, plus powdered diamond and opal worth a total of 5,000 gp)","range":"0 feet; see text","target":"one symbol","duration":"see text","save":"Will negates","sr":"yes","effect":"This spell functions like symbol of death, except that all creatures within the radius of a symbol of distraction instead become fascinated by the symbol for 10 minutes per caster level. Unlike symbol of death, symbol of distraction has no hit point limit; once triggered, a symbol of distraction simply remains active for a duration of 10 minutes × your caster level. All fascinated creatures move toward the symbol of distraction, trying to remain within the symbol’s area of effect. If the symbol leads affected creatures into a dangerous area, each fascinated creature can attempt an additional Will saving throw, with success indicating it is no longer fascinated. If a creature’s view of the symbol is completely blocked, it is immediately freed of the symbol’s effect.","source":"Magic Tactics Toolbox pg. 26"},{"n":"Symbol of Persuasion","l":6,"school":"Enchantment (charm) [mind-affecting]","castingTime":"10 minutes","components":"V, S, M (mercury and phosphorus, plus powdered diamond and opal worth a total of 5,000 gp)","range":"0 ft.; see text","target":"one symbol","duration":"see text","save":"Will negates","sr":"yes","effect":"This spell functions like symbol of death, except that all creatures within the radius of a symbol of persuasion instead become charmed by the caster (as the charm monster spell) for 1 hour per caster level.\n\nUnlike symbol of death, symbol of persuasion has no hit point limit; once triggered, a symbol of persuasion simply remains active for 10 minutes per caster level.\n\nNote: Magic traps such as symbol of persuasion are hard to detect and disable. A rogue (only) can use the Perception skill to find a symbol of persuasion and Disable Device to thwart it. The DC in each case is 25 + spell level, or 31 for symbol of persuasion.","source":"Core Rulebook"},{"n":"Triggered Hallucination","l":6,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (jade dust worth 25 gp)","range":"long (400 ft. + 40 ft./level)","target":"one creature","duration":"permanent until triggered, then 1 minute/level","save":"Will disbelief","sr":"yes","effect":"This spell functions as audiovisual hallucination, except that this spell’s phantasm has no apparent effect until a specific condition occurs. You must overcome the target’s spell resistance to plant the triggered hallucination, but the target doesn’t attempt a Will save to disbelieve the illusion until the condition occurs (at which point it receives an automatic Will save, as with audiovisual hallucination). The phantasm can include auditory, olfactory, visual, tactile, and thermal elements, including intelligible speech.\n\nYou set the triggering condition (such as hearing a certain word or seeing a type of creature) when casting the spell. The event that triggers the illusion can be as general or detailed as desired but must be based on an audible, tactile, olfactory, or visual trigger. The trigger can’t be based on any quality not normally obvious to the senses, such as alignment. Triggered hallucination uses the target’s senses to notice triggers.","source":"Ultimate Intrigue pg. 227"},{"n":"True Seeing","l":6,"school":"divination","castingTime":"1 standard action","components":"V, S, M (an eye ointment that costs 250 gp)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You confer on the subject the ability to see all things as they actually are. The subject sees through normal and magical darkness, notices secret doors hidden by magic, sees the exact locations of creatures or objects under blur or displacement effects, sees invisible creatures or objects normally, sees through illusions, and sees the true form of polymorphed, changed, or transmuted things. Further, the subject can focus its vision to see into the Ethereal Plane (but not into extradimensional spaces). The range of true seeing conferred is 120 feet.\nTrue seeing, however, does not penetrate solid objects. It in no way confers X-ray vision or its equivalent. It does not negate concealment, including that caused by fog and the like. True seeing does not help the viewer see through mundane disguises, spot creatures who are simply hiding, or notice secret doors hidden by mundane means. In addition, the spell effects cannot be further enhanced with known magic, so one cannot use true seeing through a crystal ball or in conjunction with clairaudience/clairvoyance.","source":"PRPG Core Rulebook pg. 363"},{"n":"Uncanny Reminder","l":6,"school":"conjuration","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"Conjures an animated duplicate of the target drawn from its own subconscious (using clockwork angel statistics, but with Intelligence 10, no clockwork trait, no enhance weapon ability, and no electrical vulnerability), which attacks the target autonomously; the target must roll on a d% behavior table to see how it reacts to seeing itself, ranging from unaffected to nauseated, with some results allowing a save against this spell's DC. The duplicate (and any equipment copy) vanishes if destroyed.","source":"Chronicle of Legends pg. 14"},{"n":"Veil","l":6,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one or more creatures, no two of which can be more than 30 ft. apart","duration":"concentration + 1 hour/level (D)","save":"Will negates; see text","sr":"yes; see text","effect":"You instantly change the appearance of the subjects and then maintain that appearance for the spell's duration. You can make the subjects appear to be anything you wish. The subjects look, feel, and smell just like the creatures the spell makes them resemble. Affected creatures resume their normal appearances if slain. You must succeed on a Disguise check to duplicate the appearance of a specific individual. This spell gives you a +10 bonus on the check.\n\nUnwilling targets can negate the spell's effect on them by making Will saves or with spell resistance. Those who interact with the subjects can attempt Will disbelief saves to see through the glamer, but spell resistance doesn't help.","source":"PRPG Core Rulebook pg. 364"},{"n":"Waves of Ecstasy","l":6,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"30 ft.","target":"cone-shaped burst","duration":"1 round/level; see text","save":"Will partial (see text)","sr":"yes","effect":"You emanate waves of intense pleasure that cause all targets within range to falter. Affected creatures are stunned for 1 round and are staggered for the remainder of the spell. A creature that makes its save is staggered for the first round and can act normally thereafter.","source":"Ultimate Magic pg. 249"},{"n":"Waves of Exhaustion","l":6,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped burst","duration":"instantaneous","save":"no","sr":"yes","effect":"Waves of negative energy cause all living creatures in the spell's area to become exhausted. This spell has no effect on a creature that is already exhausted.","source":"PRPG Core Rulebook pg. 368"},{"n":"What Grows Within","l":6,"school":"necromancy [evil]","castingTime":"1 swift action","components":"V","range":"personal","target":"you","duration":"1 round/level","save":"see text","sr":"no","effect":"By speaking the name “Xhamen-Dor,” you infuse yourself with the essence of the Inmost Blot and gain a +3 profane bonus on Will saving throws for the spell’s duration. When you prepare what grows within for the first time, or the first time you use it via a spell-completion or spell-trigger item, you can thereafter be targeted by Xhamen-Dor’s infected dreams ability (see page 86). As long as you are under the effects of what grows within, your mind-affecting spells carry this supernatural taint within them and can infect those who succumb to those effects. Whenever you successfully affect a creature with one of your mind-affecting spells (this requires the target to fail its saving throw against the spell if the spell allows a save, but automatically affects a target if the spell does not allow a saving throw), that target must also succeed at a Fortitude saving throw against what grows within or it immediately becomes afflicted by a lesser version of Xhamen-Dor’s seeded infestation. This infestation does not expose the victim to Xhamen-Dor’s infectious dreams, but it can ultimately result in that creature’s transformation into one of the seeded. Each time you affect a creature with what grows within in this manner, the remaining duration of what grows within is reduced by 1 round. If you affect multiple creatures in a round, you choose the order in which they must save against the effects of what grows within, and reduce the spell’s remaining duration by 1 round each time one of them is affected by the infestation.\n\nLesser Seeded Infestation—save Fortitude DC = spell’s save DC; onset immediate; frequency 1/day; effect 1d4 Constitution drain; cure none. This infestation can be cured by magic alone. A creature whose Constitution is reduced to 0 by this infestation dies and rises from death in 1d4 rounds as a seeded creature (see page 90). This is an infestation effect.","source":"Pathfinder #113: What Grows Within pg. 66"}];
