, or skill check. The spell ends once the bonus has been applied to two rolls. At 12th level and 15th level, the bonus can be applied an additional time before the spell is discharged. A subject can be under the effect of only one grand destiny spell at a time.","source":"Arcane Anthology pg. 8"},{"n":"Inflict Pain, Mass","l":5,"school":"enchantment [mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will partial; see text","sr":"yes","effect":"Functions as inflict pain, but affects multiple targets within range instead of one, subject to the same effects and partial-save rules as the single-target version.","source":"Occult Adventures pg. 174"},{"n":"Inveigle Monster","l":5,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V, M (a drop of alcohol)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"This spell functions as inveigle person except as noted above.","source":"Inner Sea Intrigue pg. 60"},{"n":"Joyful Rapture","l":5,"school":"conjuration (healing) [emotion]","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"all allies and opponents within a 60-ft.-radius burst centered on you","duration":"instantaneous","save":"no","sr":"yes","effect":"Your inspired words overwhelm others with transcendental bliss. All allies within the area of effect are freed from any harmful emotion effects. The spell also cures 1d4 points of Intelligence, Wisdom, or Charisma damage (your choice) to all allies in the area","source":"Ultimate Magic pg. 225"},{"n":"Mage's Decree","l":5,"school":"evocation","castingTime":"1 standard action","components":"V, S, F (a brass cone or trumpet)","range":"up to 1 mile/level, see text","target":"see text","duration":"instantaneous","save":"none","sr":"no","effect":"You speak a short message (up to 25 words), and it is immediately transmitted to each target, who hear it as clearly as if you were standing next to them. By default, the spell targets every creature with an Intelligence score of 3 or greater that is within the spell’s range, but at your discretion, you can choose to restrict the spell to certain creatures, causing it to either only deliver its message to creatures meeting a certain criteria, or to deliver it to all creatures except those meeting that criteria. The criteria must be something objective and observable. For example, you could cause the mage’s decree to reach only creatures of a certain race. You can’t choose recipients that rely on unobservable information, such as creatures of a certain alignment or of a particular class.\n\nYou can’t pick and choose individual creatures to target or exclude. While the spell’s range defaults to 1 mile per caster level, you can choose to reduce it to a smaller radius, although the spell’s area can’t be shaped.\n\nThe nature of the spell prevents the message it carries from having any magical power; the message can’t be used to transmit spells or abilities that are conveyed via speech. The message is transmitted in your voice in whatever language you use to speak it, and is not automatically translated. Any steps you take to disguise your voice are just as effective for messages delivered via this spell as they are for your normal speech. Mage’s decree isn’t a language-dependent spell; all targeted creatures receive the message, but might not understand it if they don’t understand the language in which you spoke the message.","source":"Ultimate Intrigue pg. 218"},{"n":"Mage's Private Sanctum","l":5,"school":"abjuration","castingTime":"10 minutes","components":"V, S, M (a sheet of lead, a piece of glass, a wad of cotton, and powdered chrysolite)","range":"close (25 ft. + 5 ft./2 levels)","target":"30-ft. cube/level (S)","duration":"24 hours (D)","save":"none","sr":"no","effect":"This spell ensures privacy. Anyone looking into the area from outside sees only a dark, foggy mass. Darkvision cannot penetrate it. No sounds, no matter how loud, can escape the area, so nobody can eavesdrop from outside. Those inside can see out normally.\n\nDivination (scrying) spells cannot perceive anything within the area, and those within are immune to detect thoughts. The ward prevents speech between those inside and those outside (because it blocks sound), but it does not prevent other communication, such as a sending or message spell, or telepathic communication, such as that between a wizard and her familiar.\n\nThe spell does not prevent creatures or objects from moving into and out of the area.\n\nMage's private sanctum can be made permanent with a permanency spell.","source":"PRPG Core Rulebook"},{"n":"Major Phantom Object","l":5,"school":"illusion (shadow) [shadow]","castingTime":"10 minutes","components":"V, S, M (a tiny piece of matter of the same sort of item you plan to create with major phantom object)","range":"close (25 ft. + 5 ft./2 levels)","target":"illusory, unattended, nonmagical object, up to 1 cu. ft./level","duration":"10 minutes/level (D)","save":"","sr":"","effect":"This spell functions as the major creation spell, except as noted above and the object created is a semi-real illusion. Any creature that interacts with the object may make a Will save, with success causing the object to cease to exist. A gnome casting this spell may make a Spellcraft check in place of any Craft check required to make a complex item.","source":"Advanced Race Guide"},{"n":"Mind Fog","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"fog spreads in 20-ft. radius, 20 ft. high","duration":"30 minutes and 2d6 rounds; see text","save":"Will negates","sr":"yes","effect":"Mind fog produces a bank of thin mist that weakens the mental resistance of those caught in it. Creatures in the mind fog take a –10 penalty on Wisdom checks and Will saves. (A creature that successfully saves against the fog is not affected and need not make further saves even if it remains in the fog.) Affected creatures take the penalty as long as they remain in the fog and for 2d6 rounds thereafter. The fog is stationary and lasts for 30 minutes (or until dispersed by wind).\n\nA moderate wind (11+ mph) disperses the fog in 4 rounds; a strong wind (21+ mph) disperses the fog in 1 round.\n\nThe fog is thin and does not significantly hamper vision.","source":"PRPG Core Rulebook pg. 313"},{"n":"Mind Swap","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"As possession, but both minds fully swap bodies and take control of their new forms, functioning as though each creature had cast possession on the other simultaneously.","source":"Occult Adventures pg. 176"},{"n":"Mirage Arcana","l":5,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one 20-ft. cube/level (S)","duration":"concentration +1 hour/level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like hallucinatory terrain, except that it enables you to make any area appear to be something other than it is. The illusion includes audible, visual, tactile, and olfactory elements. Unlike hallucinatory terrain, the spell can alter the appearance of structures (or add them where none are present). Still, it can't disguise, conceal, or add creatures (though creatures within the area might hide themselves within the illusion just as they can hide themselves within a real location).","source":"PRPG Core Rulebook pg. 314"},{"n":"Mislead","l":5,"school":"illusion (figment, glamer)","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels) Target/Effect you/one illusory double","target":"","duration":"1 round/level (D) and concentration + 3 rounds; see text","save":"none or Will disbelief (if interacted with); see text","sr":"no","effect":"You become invisible (as greater invisibility, a glamer), and at the same time, an illusory double of you (as major image, a figment) appears. You are then free to go elsewhere while your double moves away. The double appears within range but thereafter moves as you direct it (which requires concentration beginning on the first round after the casting). You can make the figment appear superimposed perfectly over your own body so that observers don't notice an image appearing and you turning invisible. You and the figment can then move in different directions. The double moves at your speed and can talk and gesture as if it were real, but it cannot attack or cast spells, though it can pretend to do so.\nThe illusory double lasts as long as you concentrate upon it, plus 3 additional rounds. After you cease concentration, the illusory double continues to carry out the same activity until the duration expires. The greater invisibility lasts for 1 round per level, regardless of concentration.\nMythic Mislead\n##Source## Mythic Adventures pg. 101\nYou create one illusory double per 5 caster levels, each of which appears in your square or in an unoccupied square adjacent to yours. When you cast the spell, you can give each of these doubles a simple programmed task as a telepathic command, such a “walk south,” “beg for mercy,” or “follow that troll.”\nYou can change or modify a single illusory double’s programmed task by spending a swift, move, or standard action; this requires concentration.\nAugmented (4th): If you expend two uses of mythic power, this spell also grants you the benefits of augmented mythic invisibility instead of greater invisibility.","source":"PRPG Core Rulebook pg. 315"},{"n":"Mydriatic Spontaneity, Mass","l":5,"school":"evocation [darkness, light]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one or more living creatures, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"This spell functions as mydriatic spontaneity, except it can affect multiple creatures.","source":"Blood of Shadows pg. 29"},{"n":"Nex's Secret Workshop","l":5,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (diamond dust worth 150 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"any number of creatures or objects in range","duration":"1 hour/level","save":"Will negates (harmless, object)","sr":"yes (harmless, object)","effect":"As nondetection, but affects any number of creatures or objects within range simultaneously (you can exclude any of them from the effect as you cast it).","source":"Inner Sea Intrigue pg. 60"},{"n":"Nightmare","l":5,"school":"illusion (phantasm) [mind-affecting]","castingTime":"10 minutes","components":"V, S","range":"unlimited","target":"one living creature","duration":"instantaneous","save":"Will negates; see text","sr":"yes","effect":"You send a hideous and unsettling phantasmal vision to a specific creature that you name or otherwise specifically designate.\nThe nightmare prevents restful sleep and causes 1d10 points of damage. The nightmare leaves the subject fatigued and unable to regain arcane spells for the next 24 hours.\nThe difficulty of the save depends on your knowledge the subject and the physical connection (if any) you have to that creature.\nKnowledgeWill Save Modifier\nNone*+10\nSecondhand (you have heard of the subject)+5\nFirsthand (you have met the subject)+0\nFamiliar (you know the subject well)-5\nConnectionWill Save Modifier\nLikeness or picture-2\nPossession or garment-4\nBody part, lock of hair, bit of nail,etc.-10\n*You must have some sort of connection to a creature of which you have no knowledge.\nDispel evil cast on the subject while you are casting the spell dispels the nightmare and causes you to be stunned for 10 minutes per caster level of the dispel evil.\nIf the recipient is awake when the spell begins, you can choose to cease casting (ending the spell) or to enter a trance until the recipient goes to sleep, whereupon you become alert again and complete the casting. If you are disturbed during the trance, you must succeed on a Concentration check as if you were in the midst of casting a spell or the spell ends.\nIf you choose to enter a trance, you are not aware of your surroundings or the activities around you while in the trance.\nYou are defenseless, both physically and mentally, while in the trance. (You always fail Reflex and Will saving throws, for example.)\nCreatures who don't sleep (such as outsiders) or dream are immune to this spell.\nMythic Nightmare\n##Source## Mythic Adventures pg. 102\nThe spell’s damage increases to 4d6 points of damage, and the target is also shaken for 24 hours.\nAugmented (6th): You can deliver a mind-affecting spell through a mythic nightmare. The maximum level of the delivered spell is equal to half your tier, and you must expend one use of mythic power for each spell level of the imbued spell in addition to the one use needed to cast mythic nightmare. You choose whether the delivered spell affects the creature immediately or when it awakens. The delivered spell affects only the target, even if it normally affects multiple creatures or an area.","source":"PRPG Core Rulebook pg. 316"},{"n":"Object Possession","l":5,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"unattended Large or smaller object (minimum Tiny)","duration":"10 minutes/level (D)","save":"None","sr":"No","effect":"This spell functions as lesser object possession, except as noted above. The possessed animated object has a number of Construction Points appropriate for its size (up to 3 CP for Large objects).  You can return your consciousness to your body as a standard action. On your next turn, you can attempt to possess a different object as a standard action instead of ending the spell.","source":"Occult Adventures pg. 179"},{"n":"Passwall","l":5,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (sesame seeds)","range":"touch","target":"5-ft.-by-8-ft. opening, 10 ft. deep plus 5 ft. deep per three additional levels","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"You create a passage through wooden, plaster, or stone walls, but not through metal or other harder materials. The passage is 10 feet deep plus an additional 5 feet deep per three caster levels above 9th (15 feet at 12th, 20 feet at 15th, and a maximum of 25 feet deep at 18th level). If the wall's thickness is more than the depth of the passage created, then a single passwall simply makes a niche or short tunnel. Several passwall spells can then form a continuing passage to breach very thick walls. When passwall ends, creatures within the passage are ejected out the nearest exit. If someone dispels the passwall or you dismiss it, creatures in the passage are ejected out the far exit, if there is one, or out the sole exit if there is only one.","source":"PRPG Core Rulebook"},{"n":"Persistent Image","l":5,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10-ft. cubes + one 10-ft. cube/level (S)","duration":"1 min./level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that the figment includes visual, auditory, olfactory, and thermal components, and the figment follows a script determined by you. The figment follows that script without your having to concentrate on it. The illusion can include intelligible speech if you wish.","source":"PRPG Core Rulebook pg. 319"},{"n":"Phantasmal Putrefaction","l":5,"school":"illusion (phantasm) [fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level (D)","save":"Will disbelief, then Fortitude partial (see text)","sr":"yes","effect":"You implant within the minds of your targets the illusion that their skin is rotting away, large rents are appearing all over their bodies, and their internal organs are spilling out into a putrid half-liquid mass at their feet. Those who fail to disbelieve phantasmal putrefaction immediately take 1d4 points of Wisdom damage. This damage occurs only once. Each round at the beginning of its turn, an affected target receives another Will save to disbelieve the effect, and targets that fail must succeed at a Fortitude save or faint, falling asleep as per sleep (except that it isn't a magical sleep effect). Waking up doesn't end the spell for a target; it must continue to attempt Will saves to disbelieve and Fortitude saves to avoid fainting each round until the spell ends or the target successfully disbelieves.  Targets of the spell perceive everyone else around them to be rotting away, but other creatures see no visible effect of the spell, so they, in addition to those who disbelieve, can communicate the nature of the illusion to allies, providing those allies with a +4 bonus on the saving throw to disbelieve.  If your campaign uses the sanity system (see page 12), a creature takes 1d8 points of sanity damage instead of Wisdom damage.","source":"Horror Adventures pg. 124"},{"n":"Phantasmal Web","l":5,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which may be more than 30 ft. apart","duration":"1 round/level (D)","save":"Will disbelief, then Fortitude partial, see text","sr":"yes","effect":"You implant within the minds of your targets the illusion that they are engulfed in tangled webs teeming with swarms of tiny spiders. Those who fail to disbelieve the phantasmal web are treated as if in a web spell, but must also make a Fortitude save at the beginning of each turn or become nauseated for that round by the phantasmal spiders.\n\nAs the phantasmal web exists only in the minds of the targets, it cannot be burned or destroyed, and it provides no cover (though it does provide concealment) against attacks made by the targets. Targets cannot escape the phantasmal web by moving, even by teleportation. Freedom of movement allows unobstructed movement but does not negate the concealment or nausea effects.\n\nTargets of the spell perceive everyone else around them to be engulfed in webs and swarming spiders, but the spell has no visible effect to other creatures (who may assist allies to disbelieve the effect).","source":"Advanced Player's Guide pg. 235"},{"n":"Phobia","l":5,"school":"enchantment (compulsion) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a single white hair)","range":"close (25 ft. + 5 ft./2 levels)","target":"one intelligent creature","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"You instill the target with an intense, instinctual fear of a condition or circumstance, more powerful than the phobia lesser madness (see page 182). You can name an energy type (acid, cold, electricity, fire, or sonic), a hazard (such as an avalanche or earthquake), or a single creature of the animal type or all vermin (applying when the target sees a swarm or a single Small or larger creature). Alternatively, you can name the following specific environments: darkness (darker than dim light, and you can’t apply this phobia to a creature with natural racial darkvision, see in darkness, blindsight, or similar senses), enclosed spaces (places that require the creature to squeeze),heights (10 times the target’s height, and you can’t apply this phobia to creatures with a natural fly speed), or water (you can’t apply this phobia to aquatic creatures or creatures with a natural swim speed).\n\nWhen the target takes damage of the energy type (for an energy type phobia), or perceives the presence of the creature, environment, or hazard, it must attempt a DC 20 Will save. If it fails, it becomes panicked, but even if it succeeds, it becomes shaken and feels intensely uncomfortable; a creature shaken in this way does not need to roll further saving throws against its phobia until its shaken condition ends, even if it continues to be exposed to its phobia.\n\nA creature panicked by phobia can begin to act normally 1 minute after it ceases being able to perceive its phobia or after taking the energy damage if the phobia is an energy type, though the shaken condition ends immediately after the creature can no longer perceive its phobia. Break enchantment, heal, limited wish, miracle, or wish can remove a phobia spell.","source":"Horror Adventures pg. 124"},{"n":"Possession","l":5,"school":"necromancy","castingTime":"1 standard action","components":"V, S, F (a jewel worth at least 500 gp, which the target's spirit can perceive)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 min./level (D)","save":"Will negates","sr":"yes","effect":"Your mind leaves your body to possess the target if it fails a Will save, letting you control its body and use its physical abilities (though not its extraordinary or supernatural abilities) while your own body lies helpless; the possessed creature's mind is imprisoned but aware inside the focus jewel while you're in control.","source":"PRPG Core Rulebook pg. 322"},{"n":"Pox of Rumors","l":5,"school":"enchantment (compulsion) [curse, mind-affecting]","castingTime":"8 hours","components":"V, S, M (a physical connection to the target; see text)","range":"see text","target":"one creature","duration":"1 day/level","save":"Will negates, then Will partial (see text)","sr":"yes","effect":"You curse the target to attract negative assumptions and rumors of a sort you specify when you cast the spell. If the target fails the initial save to negate the curse, every day that it spends in a settlement, it must attempt a Will save. If it fails, it accidentally says or does something that makes others assume the rumor you specified is true in some way that is unflattering or incriminating. If the creature is not aware of the nature of the rumors, it takes a –4 penalty on these secondary saves. After the first failed save, the attitude each resident in the settlement has regarding the target is worsened by one step. For each additional failure, the target becomes the victim of focused harassment. A group of residents taunts or attacks the creature, potentially sending the authorities to investigate if the rumor indicates criminal guilt.\n\nThe spell can be cast at any distance. The difficulty of the save depends on your knowledge of the subject and what sort of physical connection you have to that creature. The target gains the same bonuses and penalties on its Will save to resist this spell as the bonuses and penalties that apply to the scrying spell (including a +5 bonus if the target is on another plane), except that you can’t cast pox of rumors without at least a possession or garment to use as the material component, and the target takes no penalty when you use a possession or garment and only a –5 penalty when you use a piece of the target’s body. Pox of rumors is a curse, and until its duration expires, it can be removed only by remove curse or similar magic.","source":"Ultimate Intrigue pg. 222"},{"n":"Primal Regression","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/2 levels, no two of which can be more than 30 feet apart","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"This spell sequesters the targets’ ability for higher reasoning, allowing their darker impulses to come to the fore. An affected target becomes a ravening monster—savage, bloodthirsty, and brutish. Until the spell ends, the targets have all of the following benefits and drawbacks. Targets’ Intelligence and Charisma scores drop to 3 (if the scores were higher), and they are unable to use Intelligenceor Charisma-based skills, cast spells, understand language, or communicate coherently.Targets take a –4 penalty on Will saves.Targets gain a +6 enhancement bonus to Strength, a +2 natural armor bonus to AC, and 2d8 temporary hit points. These temporary hit points disappear at the end of the spell’s duration. When the spell ends, each affected creature must succeed at a Will saving throw or take 1d4 points of Intelligence drain and 1d4 points of Charisma damage.","source":"Occult Adventures pg. 181"},{"n":"Prying Eyes","l":5,"school":"divination","castingTime":"1 minute","components":"V, S, M (a handful of crystal marbles)","range":"1 mile","target":"10 or more levitating eyes","duration":"1 hour/level; see text","save":"none","sr":"no","effect":"You create a number of semitangible, visible magical orbs (called \"eyes\") equal to 1d4 + your caster level. These eyes move out, scout around, and return as you direct them when casting the spell. Each eye can see 120 feet (normal vision only) in all directions.  While the individual eyes are quite fragile, they're small and difficult to spot. Each eye is a Fine construct, about the size of a small apple, that has 1 hit point, AC 18 (+8 bonus for its size), flies at a speed of 30 feet with a +20 bonus on Fly skill checks and a +16 bonus on Stealth skill checks. It has a Perception modifier equal to your caster level (maximum +15) and is subject to illusions, darkness, fog, and any other factors that affect your ability to receive visual information about your surroundings. An eye traveling in darkness must find its way by touch.  When you create the eyes, you specify instructions you want them to follow in a command of no more than 25 words. Any knowledge you possess is known by the eyes as well.  In order to report their findings, the eyes must return to your hand. Each replays in your mind all it has seen during its existence.  It takes an eye 1 round to replay 1 hour of recorded images. After relaying its findings, an eye disappears.  If an eye ever gets more than 1 mile away from you, it instantly ceases to exist. However, your link with the eye is such that you won't know if the eye was destroyed because it wandered out of range or because of some other event.  The eyes exist for up to 1 hour per caster level or until they return to you. Dispel magic can destroy eyes. Roll separately for each eye caught in an area dispel. Of course, if an eye is sent into darkness, it could hit a wall or similar obstacle and destroy itself.","source":"PRPG Core Rulebook pg. 326"},{"n":"Psychic Asylum","l":5,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 swift action","components":"V, S","range":"personal","target":"you","duration":"instantaneous; see text","save":"none","sr":"no","effect":"You retreat into a mindscape (see page 234) of your own making that allows you to perform a lengthy mental task in an instant. You create a mental landscape that provides succor and calm for you, such as a library, sitting room, garden, or childhood tree house. You can spend up to 15 minutes in your psychic asylum. While you are within, no time passes for your body, and when you emerge you can continue with your turn. The mindscape is overt, finite, and has a rapid passage of time.\n\nWhile within the mindscape, you can consult any text, recall any conversation, or remember any image that you have been exposed to with perfect clarity and recollection, as if you had an eidetic memory. You must have seen or heard the material within a time frame of 1 week per level. For example, you might wish to reexamine a passage of text from an ancient manuscript you rapidly scanned in a library 2 weeks prior. While in the psychic asylum, you can perfectly recall the precise layout of the text within the ancient manuscript and read it word for word. Once you emerge from the psychic asylum, you can recall the details of what you had just studied as clearly as if you had just looked at it, but you no longer have total recall of the material.\n\nIf you’re able to prepare spells, you can use the time to prepare a single spell. For example, if you were poisoned, you could use your swift action to cast psychic asylum, pray and meditate for the full 15 minutes to gain neutralize poison, then emerge from the mindscape and immediately cast the spell upon yourself as your standard action.\n\nAny mind-affecting spell that was affecting you before you cast the spell continues to expend its duration on you while you are within the psychic asylum, so you can use this spell to wait out the effects of such a condition. Effects that are currently affecting your body do not expend additional duration while you are in the psychic asylum, but you also don’t experience their effects during the time spent there.","source":"Occult Adventures"},{"n":"Psychic Surgery","l":5,"school":"enchantment [ mind-affecting ]","castingTime":"10 minutes","components":"V, M (diamond dust worth 250 gp)","range":"touch","target":"one willing and living creature","duration":"instantaneous","save":"none","sr":"no","effect":"Psychic surgery cures the target of all Intelligence, Wisdom, and Charisma damage and restores all points permanently drained from the target’s Intelligence, Wisdom, and Charisma scores. It also eliminates all ongoing insanity, confusion, and fear effects. Psychic surgery can also remove other mental afflictions, including enchantment spells and abilities, and even instantaneous effects, but in this case, if dispel magic couldn’t remove the effect, psychic surgery works only if the spell level or equivalent spell level of the effect was 6th level or lower. Psychic surgery removes all effects magically altering the target’s memory, even instantaneous effects, and it can restore a memory to perfect clarity like the second use of modify memory .","source":"Occult Adventures pg. 183"},{"n":"Repress Memory","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"personal","target":"you","duration":"instantaneous","save":"","sr":"","effect":"This spell allows you to safeguard important knowledge, even from yourself. When casting this spell, you recount one piece of knowledge you possess (up to a maximum of 50 words). This knowledge disappears utterly from your mind, and you might not realize you forgot something. The magic of the spell patches omissions in your memory with indistinct haze. Repress memory protects against detect thoughts, discern lies, zone of truth, and similar spells, though careful questioning may reveal the gaps in your memory, or that your memory has been affected by the spell.\n\nA repressed memory can be restored only by break enchantment, psychic surgery, limited wish, miracle, or wish. If you use this spell to negate the memory of a magical compulsion, it doesn’t remove the compulsion, nor does it remove procedural memories that might affect your skills or class abilities.\n\nAt the GM’s discretion, multiple castings of this spell might erase memories of a lengthier event or all memory of a place or individual from your memory.","source":"Occult Adventures pg. 184"},{"n":"Scripted Hallucination","l":5,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 minute/level (D)","save":"Will disbelief","sr":"yes","effect":"This spell functions as audiovisual hallucination, except that the phantasm includes visual, auditory, olfactory, tactile, and thermal components, and the phantasm follows a complex script. The phantasm follows that script without your concentration and can react to stimuli the targets perceive.","source":"Ultimate Intrigue pg. 224"},{"n":"Secret Chest","l":5,"school":"conjuration (summoning)","castingTime":"10 minutes","components":"V, S, F (the chest and its replica)","range":"see text","target":"one chest and up to 1 cu. ft. of goods/caster level","duration":"60 days or until discharged","save":"none","sr":"no","effect":"You hide a chest on the Ethereal Plane for as long as 60 days and can retrieve it at will. The chest can contain up to 1 cubic foot of material per caster level (regardless of the chest's actual size, which is about 3 feet by 2 feet by 2 feet). If any living creatures are in the chest, there is a 75% chance that the spell simply fails.  Once the chest is hidden, you can retrieve it by concentrating (a standard action), and it appears next to you.  The chest must be exceptionally well crafted and expensive, constructed for you by master crafters. The cost of such a chest is never less than 5,000 gp. Once it is constructed, you must make a tiny replica (of the same materials and perfect in every detail) so that the miniature of the chest appears to be a perfect copy. (The replica costs 50 gp.) The chests are nonmagical and can be fitted with locks, wards, and so on, just as any normal chest can be.  To hide the chest, you cast the spell while touching both the chest and the replica. The chest vanishes into the Ethereal Plane.  You need the replica to recall the chest. After 60 days, there is a cumulative chance of 5% per day that the chest is irretrievably lost.  If the miniature of the chest is lost or destroyed, there is no way, even with a wish spell, that the large chest can be summoned back, although an extraplanar expedition might be mounted to find it.  Living things in the chest eat, sleep, and age normally, and they die if they run out of food, air, water, or whatever they need to survive.","source":"PRPG Core Rulebook pg. 338"},{"n":"Seeds of Influence, Greater","l":5,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"S, M (a rose)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level (D)","save":"Will negates","sr":"yes","effect":"This spell functions as seeds of influence, except that if the target is protected by a spell that grants immunity, spell resistance, or a saving throw bonus against a divination or mind-affecting spell you cast on the target, you can attempt caster level checks to dispel each such effect before applying the effects of those protections against the spell. The DC of the caster level check to dispel each effect is equal to 11 + the effect’s caster level. Such spells cast on the target while greater seeds of influence is active grant no protection against greater seeds of influence.","source":"Inner Sea Intrigue pg. 62"},{"n":"Seeming","l":5,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature per two levels, no two of which can be more than 30 ft. apart","duration":"12 hours (D)","save":"Will negates or Will disbelief (if interacted with)","sr":"yes or no; see text","effect":"This spell functions like disguise self, except that you can change the appearance of other people as well. Affected creatures resume their normal appearances if slain. Unwilling targets can negate the spell's effect on them by making Will saves or with spell resistance.","source":"PRPG Core Rulebook pg. 339"},{"n":"Shadow Endurance","l":5,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S, M (a fetchling’s tooth)","range":"personal","target":"","duration":"1 hour/level until discharged, then 1 minute/level; see text","save":"Will disbelief (if interacted with), varies, see text","sr":"see text","effect":"You conjure protective wisps of darkness made from shadow. If you are reduced below 0 hit points or rendered unconscious, shadow endurance immediately discharges, shunting your injured body into a hidden alcove on the Shadow Plane. You immediately stabilize, but cannot awaken or take any further actions until the second duration expires.\n\nAs you vanish, a quasi-real duplicate of you made from shadow substance appears where you fell, as if created by shadow conjuration. The duplicate acts on your initiative and is under your control. Your duplicate is 1/4 as real as you and appears with 25% of your full hit point total, and any creature that fails a Will saving throw believes it to be you. The duplicate has the same equipment-based bonuses as you, but deals only 1/4 of your normal damage against enemies. It can cast any spells you can, drawing on your reserve of magic, but the duplicate’s caster level is 1/4 your actual level. Regardless of your alignment, your shadow duplicate is neutral evil, though it will not harm your friends and allies.\n\nWhen the second duration of the spell expires, your duplicate disappears and your body reappears in the location from which you vanished. If the image is destroyed, the spell immediately expires and your body reappears.","source":"Agents of Evil pg. 31"},{"n":"Shadow Evocation","l":5,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S","range":"see text","target":"see text","duration":"see text","save":"Will disbelief (if interacted with)","sr":"yes","effect":"You tap energy from the Plane of Shadow to cast a quasi-real, illusory version of a sorcerer or wizard evocation spell of 4th level or lower. Spells that deal damage have normal effects unless an affected creature succeeds on a Will save. Each disbelieving creature takes only one-fifth damage from the attack. If the disbelieved attack has a special effect other than damage, that effect is one-fifth as strong (if applicable) or only 20% likely to occur. If recognized as a shadow evocation, a damaging spell deals only one-fifth (20%) damage. Regardless of the result of the save to disbelieve, an affected creature is also allowed any save (or spell resistance) that the spell being simulated allows, but the save DC is set according to shadow evocation's level (5th) rather than the spell's normal level.\n\nNondamaging effects have normal effects except against those who disbelieve them. Against disbelievers, they have no effect.\n\nObjects automatically succeed on their Will saves against this spell.","source":"PRPG Core Rulebook pg. 340"},{"n":"Shadow Walk","l":5,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"up to one touched creature/level","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"To use the shadow walk spell, you must be in an area of dim light. You and any creature you touch are then transported along a coiling path of shadowstuff to the edge of the Material Plane where it borders the Plane of Shadow. The effect is largely illusory, but the path is quasi-real. You can take more than one creature along with you (subject to your level limit), but all must be touching each other.\nIn the region of shadow, you move at a rate of 50 miles per hour, moving normally on the borders of the Plane of Shadow but much more rapidly relative to the Material Plane. Thus, you can use this spell to travel rapidly by stepping onto the Plane of Shadow, moving the desired distance, and then stepping back onto the Material Plane.\nBecause of the blurring of reality between the Plane of Shadow and the Material Plane, you can't make out details of the terrain or areas you pass over during transit, nor can you predict perfectly where your travel will end. It's impossible to judge distances accurately, making the spell virtually useless for scouting or spying. Furthermore, when the spell effect ends, you are shunted 1d10 × 100 feet in a random horizontal direction from your desired endpoint. If this would place you within a solid object, you are shunted 1d10 × 1,000 feet in the same direction. If this would still place you within a solid object, you (and any creatures with you) are shunted to the nearest empty space available, but the strain of this activity renders each creature fatigued (no save).\nShadow walk can also be used to travel to other planes that border on the Plane of Shadow, but this usage requires the transit of the Plane of Shadow to arrive at a border with another plane of reality. The transit of the Plane of Shadow requires 1d4 hours.\nAny creatures touched by you when shadow walk is cast also make the transition to the borders of the Plane of Shadow.\nThey may opt to follow you, wander off through the plane, or stumble back into the Material Plane (50% chance for either of the latter results if they are lost or abandoned by you). Creatures unwilling to accompany you into the Plane of Shadow receive a Will saving throw, negating the effect if successful.","source":"PRPG Core Rulebook pg. 341"},{"n":"Subjective Reality","l":5,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"personal","target":"you","duration":"1 round/level (D)","save":"none","sr":"none","effect":"Choose one object, creature, or force you can see within long range (400 ft. + 40 ft./level). You alter your perceptions to become convinced the target is an illusion. For you, the target becomes transparent and does not create sound or smell. Until the spell ends, you can move through the target unimpeded and the target can move through you. The target’s nonmagical attacks cannot harm you, and the target’s magical attacks deal half damage to you. The target’s non-damaging magical abilities have a 50% chance not to affect you, and you are immune to all its sonic, language-dependent, and scentbased attacks. However, your attacks deal no damage to the target, and your magical abilities do not affect the target at all. You or the target can affect each other normally through intermediaries. For instance, while the target would be immune to the direct effects of your earthquake spell, if the spell caused a room’s ceiling to collapse, the target would not be immune to the effects of the collapse.","source":"Occult Origins pg. 29"},{"n":"Suggestion, Mass","l":5,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, M (a snake's tongue and a honeycomb)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 hour/level or until completed","save":"Will negates","sr":"yes","effect":"This spell functions like suggestion, except that it can affect more creatures. The same suggestion applies to all these creatures.","source":"PRPG Core Rulebook pg. 350"},{"n":"Symbol of Pain","l":5,"school":"Necromancy [evil, pain]","castingTime":"10 minutes","components":"V, S, M (mercury and phosphorus, plus powdered diamond and opal worth a total of 1,000 gp)","range":"0 ft.; see text","target":"One symbol","duration":"See text","save":"Fortitude negates","sr":"Yes","effect":"This spell functions similarly to symbol of death, except affected creatures suffer wracking pains that impose a -4 penalty on attack rolls, skill checks, and ability checks. These penalties persist for 1 hour after moving beyond 60 feet from the symbol.\n\nUnlike symbol of death, this version lacks hit point limits. Once activated, a symbol of pain simply remains active for 10 minutes per caster level.\n\nDetection & Disabling: Only rogues may use Perception (DC 30) to locate the symbol or Disable Device (DC 30) to neutralize it.","source":"Core Rulebook"},{"n":"Symbol of Sleep","l":5,"school":"Enchantment (compulsion) [mind-affecting]","castingTime":"10 minutes","components":"V, S, M (mercury and phosphorus, plus powdered diamond and opal worth a total of 1,000 gp)","range":"0 ft.; see text","target":"One symbol","duration":"See text","save":"Will negates","sr":"Yes","effect":"This spell functions like symbol of death, except that all creatures of 10 HD or less within 60 feet of the symbol of sleep instead fall into a catatonic slumber for 3d6 × 10 minutes. Unlike with the sleep spell, sleeping creatures cannot be awakened by nonmagical means before this time expires.\n\nUnlike symbol of death, symbol of sleep has no hit point limit; once triggered, a symbol of sleep simply remains active for 10 minutes per caster level.\n\nNote: Magic traps such as symbol of sleep are hard to detect and disable. A rogue (only) can use the Perception skill to find a symbol of sleep and Disable Device to thwart it. The DC in each case is 25 + spell level, or 30 for symbol of sleep.","source":"Core Rulebook"},{"n":"Synesthesia, Mass","l":5,"school":"illusion ( phantasm ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one or more living creatures, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"This spell functions like synesthesia , except as noted above.","source":"Occult Adventures pg. 188"},{"n":"Unwilling Shield","l":5,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (ruby dust worth 250 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"Like shield other, unwilling shield creates a mystic connection between you and the target, but unlike shield other, the target shares the wounds that you receive. In addition, the link draws upon the target’s life force to supplement your own defenses. You gain a +1 luck bonus to AC and on saving throws. You take only half damage from all wounds and attacks (including those dealt by special abilities) that deal hit point damage. The amount of damage not taken by you is taken by the target. Forms of harm that do not involve hit points, such as charm effects, ability damage, level draining, and death effects are not affected. If you take a reduction in hit points from a lowered Constitution score, the reduction is not split with the target because it is not hit point damage. When the spell ends, subsequent damage is no longer divided between you and the subject, but damage already split is not assigned to you.\n\nIf you and the target of the spell move out of range of each other, the spell remains active, but damage is no longer shared until you are once again within range of each other.","source":"Advanced Player's Guide pg. 253"},{"n":"Vengeful Outrage","l":5,"school":"enchantment (compulsion) [emotion, language-dependent, mind-affecting]","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"You place a magical command upon a creature to seek out and destroy a single enemy that has inflicted some perceived or actual harm to the target. You designate the enemy at the time of casting, which must be known by the target (such as “your brother’s murderer”) or can easily identify by sight (such as “the hill giant king”). The target is under the effect of a geas to find and capture or kill this enemy, and the target takes the penalties of that spell as long as it is not actively trying to reach the enemy. When the target enters combat with the enemy, it gains a +6 morale bonus to Strength and Constitution, a +3 morale bonus on Will saves, and is immune to the shaken and frightened conditions.\n\nIf you designate one of the target’s friends or loved ones as the enemy, the target gains another saving throw to overcome the spell as soon as it enters combat with the enemy.","source":"Ultimate Magic pg. 246"},{"n":"Village Veil","l":5,"school":"illusion (figment) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one 10-ft. cube per level","duration":"1 day/level","save":"Will disbelief","sr":"no","effect":"You throw an illusion over an area to make creatures that view or interact with it believe it has suffered some great catastrophe or calamity that renders it utterly worthless for their needs. You must set a few general guidelines when casting the spell as to the nature of this disaster (fire, tornado, bandit raid, plague, etc.), after which the illusion fills in the remaining details to make it seem realistic. When casting the spell, you can grant creatures with particular, clearly identifiable physical traits (race, gender, age category, etc.) immunity to this spell. This allows all such eligible creatures to perceive the true nature of the affected area instead of its illusory appearance. Creatures without this immunity that fail their saving throws always perceive the affected area as having absolutely nothing of interest or worth to them. Unless they have reason for suspicion, they always move on without closely investigating the area. Creatures with sufficient reasons for suspicion who do choose to investigate the area gain another saving throw, this one with a +2 bonus, as they enter the village and directly interact with the illusion.\n\nYou can expand the area of this spell by casting it multiple times. Each time you do, you must effectively \"attach\" the spell to the existing area by using the same disaster and granting the same sorts of creatures immunity to its effects. If you fail to do this, the entire illusion, no matter how large, disappears.","source":"Advanced Race Guide pg. 68"},{"n":"Waves of Fatigue","l":5,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"30 ft.","target":"cone-shaped burst","duration":"instantaneous","save":"none","sr":"yes","effect":"Waves of negative energy render all living creatures in the spell's area fatigued. This spell has no effect on a creature that is already fatigued.","source":"PRPG Core Rulebook pg. 368"},{"n":"Charm Monster, Mass","l":6,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one or more creatures, no two of which can be more than 30 ft. apart","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"This spell functions like charm monster, except that mass charm monster affects a number of creatures whose combined HD do not exceed twice your level, or at least one creature regardless of HD. If there are more potential targets than you can affect, you choose them one at a time until you must choose a creature with too many HD to affect.","source":"PRPG Core Rulebook pg. 254"},{"n":"Create Mindscape, Greater","l":6,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one creature","duration":"10 minutes/level","save":"Will disbelief, see text","sr":"yes","effect":"You create an immersive mindscape (see page 235) that the minds of both you and another creature enter together. You choose whether the mindscape is overt or veiled, and whether it’s harmless or harmful. You can choose any shape and size trait, as well as any gravity trait (though you can’t make it so the gravity is so strong it harms creatures within). The mindscape has normal time, no alignment traits, and normal magic.\n\nYou designate where both you and your subject appear. You don’t need line of sight to draw the subject creature into the mindscape, but you must be aware of its presence within range. If you target an area with more than one sentient creature and you have never seen any of the creatures before (for example, if you know a group of soldiers is inside a barracks but you can’t see them through the door), the subject of this spell is selected at random. If you have seen firsthand the creature you wish to target (continuing the example, if you spied the sergeant entering the room moments before), you can select it unerringly from among all the creatures. You must appear somewhere in your mindscape, though it’s relatively easy to shield yourself from the view of any other creatures inside if they don’t realize they’re in a mindscape. You must also create a method of exit from the mindscape when you cast this spell, and that method must be possible to achieve based on the traits of the mindscape, even if it is obscure or difficult. The GM decides whether a method of escape is reasonable. Anything that would be a reasonable method of waking from a dream during deep sleep could allow one to leave a mindscape.\n\nMore creatures than the initial two can enter an existing mindscape, typically through the use of the mindscape door spell. You can create illusory creatures within the mindscape, but you’re able to direct or concentrate on only one at a time. Only this creature is believable; any others largely remain silent or speak generic, repetitive phrases.\n\nAs is normal with mindscapes, you and any other creatures within the mindscape are unable to take actions within the real world, and your bodies lose their Dexterity bonuses to AC.\n\nIf you choose to create a veiled mindscape, the first time another creature interacts with the environment, it can attempt a Will save to disbelieve the effect. Disbelieving a mindscape reveals to that creature that it’s within a mindscape and gives it the knowledge needed to leave the mindscape, but doesn’t free it from the mindscape. For example, if you create a mindscape that takes the form of a parlor inside a stately mansion, and your target creature succeeds at its Will save, it gains the understanding that walking out the front door of the mansion allows it to return to its physical body, but it must actually move through the mental landscape of the mansion to reach the front door and exit in order to flee the mindscape. If the mindscape is overt, the creature automatically knows how to exit if it so chooses.\n\nThis spell ends at any time that you choose to depart the mindscape, freeing the target as well. Any creature that drops below 0 hit points while inside the mindscape returns to its body. If this happens to you, the spell also ends, freeing anyone still inside.\n\nCreate mindscape can be made permanent with a permanency spell by a caster of 12th level or higher at a cost of 10,000 gp. You and other creatures aware of a permanent mindscape can come and go using the mindscape door spell.","source":"Occult Adventures"},{"n":"Demand","l":6,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"10 minutes","components":"V, S, M/DF (fine copper wire)","range":"see text","target":"one creature","duration":"1 round; see text","save":"Will partial","sr":"yes","effect":"This spell functions like sending, but the message can also contain a suggestion (see the suggestion spell), which the subject does its best to carry out. A successful Will save negates the suggestion effect but not the contact itself. The demand, if received, is understood even if the subject's Intelligence score is as low as 1. If the message is impossible or meaningless according to the circumstances that exist for the subject at the time the demand is issued, the message is understood but the suggestion is ineffective.The demand's message to the creature must be 25 words or less, including the suggestion. The creature can also give a short reply immediately.","source":"PRPG Core Rulebook pg. 265"},{"n":"Demanding Message, Mass","l":6,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, S, F (a piece of copper wire)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level","duration":"10 minutes/level, then 1 hour/level or until completed (D); see text","save":"Will negates (see text)","sr":"yes; see text","effect":"This spell functions as demanding message, except that you can issue one suggestion to each of the spell’s targets instead of just one. Each time you do so, it takes a standard action. You can issue a different suggestion to each target.","source":"Ultimate Intrigue pg. 210"},{"n":"Dream Travel","l":6,"school":"conjuration ( teleportation ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"you and one creature/level","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"You and the other targets of the spell are physically drawn from the Material Plane into the Dimension of Dreams on a voyage into the dreams of a creature you designate. In the Dimension of Dreams, you move through a swirling sea of thoughts, desires, and emotions created by the minds of dreamers everywhere to reach your destination dreamscape. Reaching the destination dreamscape takes 1 hour. At any point before the spell’s duration ends, you can dismiss the spell to return to where you started on the Material Plane. The connection between dreams and reality is inherently tenuous, and your ability to arrive precisely where you mean to is dependent on your familiarity with the dreamer you’re trying to find. To determine how accurate your arrival is at the end of your dream travel, roll d% on the following table. Familiarity On Target Off Target Other Dreamscape Mishap Very familiar 1–97 98–99 100 — Somewhat familiar 1–94 95–97 98–99 100 Known creature 1–88 89–94 95–98 99–100 Not well known 1–76 77–88 89–96 97–100 False identity — — 81–92 93–100 Familiarity : “Very familiar” means that you have had contact using dream , dream council , dream scan , or a similar spell within the past 24 hours with the creature whose dreamscape you are trying to locate. “Somewhat familiar” means that you have had contact with the dreaming character using one of those spells at least once in the past. “Known creature” means that while you know the creature whose dreamscape you’re trying to locate, you have not connected to its dreams with those spells. “Not well known” is a creature you have heard of, know by name and true identity, but have never met. “False identity” means that whether or not you have met the creature, you know it only through a false identity. When trying to locate the dreamscape of a creature known to you through a false identity, roll 1d20 + 80 on the table to obtain your results (instead of rolling d%), since there is no way for you to pinpoint the correct dreamscape. On Target : You travel to the correct creature’s current dreamscape. Off Target : You travel to an area near the target dreamscape on the Ethereal Plane. Other Dreamscape : You travel to a similar creature’s dreamscape on the Dimension of Dreams. Mishap : You and anyone else traveling with you experience a mishap during travel; each character takes 1d10 points of damage and must reroll on the table to see where it ends up. For these rerolls, roll 1d20 + 80. Each time “Mishap” comes up, the travelers take more damage and must reroll to see where they end up. Regardless of the accuracy of your dream travel , you and your companions all arrive at the same location (except in the case of a mishap). Mindless creatures can’t use dream travel , nor can creatures that can’t dream. You might be able to exit the dream near the creature on its home plane. If you and the other creatures are still in a dream when the dreamer wakes up, the dreamer can decide to bring you out onto its plane within 1d10 miles of itself. If it chooses not to, you and the other travelers are pushed into another dreamscape or onto the Ethereal Plane. The spell ends when the creature wakes up, so you no longer have the option to dismiss the spell and return home. However, you do get enough warning that a spell is about to end that you can dismiss it before the dreamer awakens and decides whether to allow you to arrive at its location. You can use dream travel to travel to the dream of a creature on another plane, but this requires trekking through the dreams of outsiders. It takes 1d4+1 hours of uninterrupted travel to reach the destination dream, and each traveler must succeed at a Will save each hour spent traveling in this fashion. The DC of this save is 10 for the first hour, and increases by 5 for each hour thereafter. If a creature fails this saving throw, it becomes shaken for the remainder of the dream travel and for a number of hours thereafter equal to the amount of time spent using dream travel to reach the destination plane. After the first time a creature fails the saving throw, one of the following effects occurs (determined randomly by the GM). These effects are considered emotion effects, in addition to any other descriptors that apply. d6 Result 1 Creature contracts cackle fever or mindfire (equal chance of either; see page 557 of the Pathfinder RPG Core Rulebook). 2 Creature is cursed, as bestow curse; if the creature is a spellcaster, it instead acquires a random minor spellblight (Pathfinder RPG Ultimate Magic 94). 3 Creature is attacked by a phantasmal killer, and is treated as having failed the initial saving throw to disbelieve it. The Fortitude save DC is equal to the Will save DC that the creature failed. 4 Creature is possessed as possession (see page 181) by an outsider (50% chance to be a creature from the destination plane; otherwise, it is a random hostile outsider). 5 Creature is affected as feeblemind. 6 Creature is affected as insanity. Traveling to a different planar destination decreases the accuracy of your dream transit. If you exit a creature’s dream onto a plane different from the plane you started on, you end up in a random location on the destination plane. If the target of your dream travel isn’t dreaming, you and the other travelers can wait on the Dimension of Dreams until that creature begins sleeping. For each hour that passes during this wait, each dream traveler must attempt a Will save as if it were traveling to reach another plane.","source":"Occult Adventures pg. 166"},{"n":"Euphoric Tranquility","l":6,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a poppy flower)","range":"touch","target":"creature touched","duration":"1 round/level","save":"none and Will partial (see below)","sr":"yes","effect":"A creature under the effect of this enchantment enters a state of euphoria. The target treats all creatures as dear friends and abhors violence, but may rise up to protect itself if violence is perpetrated against it. Until the end of the spell’s duration, the creature’s speed is halved, and it cannot make attacks or cast spells. If the creature is attacked, it gets a Will saving throw. If the saving throw succeeds, the creature can make act normally for 1 round. If the saving throw fails, the creature moves half its speed away from the attacker as its next action.\n\nFurthermore, if the creature is interacted with, or questioned while under the effects of this spell, it is considered to have an attitude of Helpful (see the Diplomacy skill, Core Rulebook 94), though any advice or answers it gives may be disjointed or stream of consciousness due to its euphoric state.","source":"Advanced Player's Guide pg. 219"},{"n":"Eyebite","l":6,"school":"necromancy [emotion, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"target: one living creature; effect: 10 or moreSickened 5-9Panicked, sickened 4 or lessComatose, panicked, sickened The effects are cumulative and concurrent. Sickened: Sudden pain and fever sweeps over the subject's body. A creature affected by this spell remains sickened for 10 minutes per caster level. The effects cannot be negated by a remove disease or heal spell, but a remove curse is effective. Panicked: The subject becomes panicked for 1d4 rounds. Even after the panic ends, the creature remains shaken for 10 minutes per caster level, and it automatically becomes panicked again if it comes within sight of you during that time. This is a fear effect. Comatose: The subject falls into a catatonic coma for 10 minutes per caster level. During this time, it cannot be awakened by any means short of dispelling the effect. This is not a sleep effect, and thus elves are not immune to it. You must spend a swift action each round after the first to target a foe.","duration":"1 round/level","save":"Fortitude negates","sr":"yes","effect":"Each round, you can target a single living creature, striking it with waves of power. Depending on the target's HD, this attack has as many as three effects.\nHD\n##Effect##\n10 or moreSickened\n5-9Panicked, sickened\n4 or lessComatose, panicked, sickened\nThe effects are cumulative and concurrent.\nSickened: Sudden pain and fever sweeps over the subject's body. A creature affected by this spell remains sickened for 10 minutes per caster level. The effects cannot be negated by a remove disease or heal spell, but a remove curse is effective.\nPanicked: The subject becomes panicked for 1d4 rounds. Even after the panic ends, the creature remains shaken for 10 minutes per caster level, and it automatically becomes panicked again if it comes within sight of you during that time. This is a fear effect.\nComatose: The subject falls into a catatonic coma for 10 minutes per caster level. During this time, it cannot be awakened by any means short of dispelling the effect. This is not a sleep effect, and thus elves are not immune to it.\nYou must spend a swift action each round after the first to target a foe.","source":"PRPG Core Rulebook pg. 280"},{"n":"False Vision, Greater","l":6,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (a jade sphere worth 500 gp)","range":"see text","target":"one creature","duration":"1 hour/level (D)","save":"Will negates","sr":"no","effect":"This functions similarly to false vision, but instead of placing the illusion on a nearby area, you can tie it to a specific individual, and can do so from great distances. The spell can be cast at any distance. The difficulty of the save depends on your knowledge of the subject and what sort of physical connection (if any) you have to that creature. The target gains the same bonuses and penalties on its Will save to resist this spell as the bonuses and penalties that apply to the scrying spell (including a +5 bonus if the target is on another plane).\n\nThe illusion created by the spell moves with the target, and is not stationary. The image can affect the way the target is perceived, the way the target’s surroundings are perceived, and the way that specific creatures or objects around the target are perceived. For the target, and any other specific creatures or objects you specify, you can cause them to appear as other creatures or objects that you designate, not to appear at all, or to have their appearance unaltered. For the target’s surroundings, you can choose to make the target appear to be somewhere else, either a specific location with which you are familiar, or a generic location conjured from your imagination. You can change the way that the spell affects the appearance of any of these things by concentrating on the spell. You can also cause creatures or objects to appear in the illusion that are not really there, or to make a creature or object seem to act in a way other than it is actually acting. In this case, you must concentrate on the spell, or these aspects of the illusion simply remain static. The spell can provide visual, auditory, olfactory, tactile, and thermal sensations as needed.\n\nThe illusion applies to only those who observe the target via a divination (scrying) spell, and has no effect on viewers who are there in person.","source":"Ultimate Intrigue pg. 214"},{"n":"Geas/Quest","l":6,"school":"enchantment (compulsion) [curse, language-dependent, mind-affecting]","castingTime":"10 minutes","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 day/level or until discharged (D)","save":"none","sr":"yes","effect":"This spell functions similarly to lesser geas, except that it affects a creature of any HD and allows no saving throw.\n\nIf the subject is prevented from obeying the geas/quest for 24 hours, it takes a –3 penalty to each of its ability scores. Each day, another –3 penalty accumulates, up to a total of –12. No ability score can be reduced to less than 1 by this effect. The ability score penalties are removed 24 hours after the subject resumes obeying the geas/quest.\n\nA remove curse spell ends a geas/quest spell only if its caster level is at least two higher than your caster level. Break enchantment does not end a geas/quest, but limited wish, miracle, and wish do.\n\nBards, sorcerers, and wizards usually refer to this spell as geas, while clerics call the same spell quest.","source":"PRPG Core Rulebook pg. 288"},{"n":"Getaway","l":6,"school":"conjuration (teleportation)","castingTime":"1 minute","components":"V, S, M (a brass doorknob)","range":"unlimited","target":"you and one willing creature/2 levels, all of which must be within 30 feet of you","duration":"1 hour/level","save":"none","sr":"no","effect":"Getaway teleports you and allies you designate at the time of casting to a predetermined location. You must initially cast the spell at that location—all creatures affected by the spell must be present at that time and within 30 feet of you. At any time before the spell’s duration expires, you may trigger the spell as a swift action. At this time, all affected creatures (or their remains and gear) within 30 feet of you are teleported to the location where you first cast the spell. Creatures more than 30 feet away from you are left behind. Selected creatures within 30 feet of you who do not wish to travel with you at that time can simply choose not to go. You can be transported any distance within a plane but cannot travel between planes.","source":"Advanced Player's Guide pg. 225"},{"n":"Heretic's Tongue","l":6,"school":"Enchantment [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"Living creature","duration":"1 round/level","save":"Will negates","sr":"Yes","effect":"You fill your target's mind with blasphemous knowledge. If the target fails its saving throw, it cannot cast spells or use spell-like abilities for the duration of the spell. Divine spellcasters whose power derives from the worship of a single deity (most clerics, paladins, and warpriests) have the potential to suffer worse. When targeting a divine spellcaster, you can designate an alignment. If the named alignment coincides with either the spellcaster's alignment or that of her deity, the divine spellcaster loses access to all supernatural and spell-like class abilities granted by the associated class for the spell's duration-blessings, domain powers, channel energy, smite evil, etc.\n\nThose affected by this spell can end the effect early by choosing to release the blasphemies in a litany of screamed curses and heretical decadences. The creature is effectively paralyzed for half the spell's duration, and each ally within 50 feet must succeed at a Will saving throw (equal to this spell's save DC) or be shaken until the litany ends. If the creature chooses to do this, it cannot end the litany of blasphemies early. A creature that succeeds at its saving throw to avoid being shaken by its ally's blasphemous litany is immune to the litany's effects and need not attempt additional saves on subsequent rounds.","source":"Pathfinder #107: Scourge of the Godclaw"},{"n":"Hold Person, Mass","l":6,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a small, straight piece of iron)","range":"medium (100 ft. + 10 ft./level)","target":"one or more humanoid creatures, no two of which can be more than 30 ft. apart","duration":"1 round/level (D); see text","save":"Will negates; see text","sr":"yes","effect":"This spell functions like hold person, except as noted above.","source":"PRPG Core Rulebook pg. 296"},{"n":"Hostile Juxtaposition, Greater","l":6,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, M (a coin)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/4 levels","duration":"1 round/level or until discharged","save":"Will negates","sr":"yes","effect":"As hostile juxtaposition, but links you to multiple creatures (one per 4 caster levels) or a single larger creature, and you may swap positions with each linked target once before the spell is fully discharged.","source":"Ultimate Combat pg. 231"},{"n":"Impenetrable Veil","l":6,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (dust from the Dimension of Dreams worth 1,250 gp)","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You enchant the target so it is nearly impossible to detect by both magical and mundane means, granting it the following benefits. The target gains a bonus on Stealth checks equal to half your caster level, and can use Stealth to hide from all creatures attempting to perceive it, even when it lacks concealment or cover. It can attempt a Stealth check to avoid detection from creatures using blindsight, blindsense, or any ability that functions as either (such as lifesense or tremorsense). Furthermore, the target leaves no trail and cannot be tracked unless it chooses to leave a trail. If a creature attempts to discern the target’s presence or location using divination magic (including magic items with a divination aura such as a crystal ball), that creature must succeed at a caster level check with a DC equal to the target’s Stealth bonus to discern any information about the target, and on a failed check cannot do so for the spell’s duration.","source":"Magic Tactics Toolbox pg. 25"},{"n":"Insanity","l":6,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"The affected creature suffers from a continuous confusion effect, as the spell.Remove curse does not remove insanity. Greater restoration, heal, limited wish, miracle, or wish can restore the creature.","source":"PRPG Core Rulebook pg. 301"},{"n":"Invisibility Bubble, Mass","l":6,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (needle from a sea urchin)","range":"touch","target":"touched creature's space, up to one 5-foot-cube","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"A glamered bubble surrounds the target’s space, rendering her completely invisible underwater by hiding both the target and any water she displaces. Because of the bubble’s size limit, this spell works only on Medium or smaller targets. Other objects and creatures within the bubble’s space are also invisible while they stay in the space, which could reveal the spell’s existence to a canny observer who notices fish disappearing into the bubble and reappearing on the other side. Creatures inside the bubble can see each other, which allows foes who can pinpoint the bubble’s location (such as dragons) to stick their heads into the bubble in order to see the target. Any creature on the inside of the bubble that takes any action that would break invisibility pops the bubble and ends the spell early. On land, the bubble is clearly visible, acting much as invisibility does in the water. Unlike with invisibility, the inside of the bubble blocks light from escaping the bubble, meaning that light sources inside the bubble don’t illuminate past its edges, but also don’t reveal a telltale glow.","source":"Aquatic Adventures"},{"n":"Invisibility, Mass","l":6,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M/DF (an eyelash encased in gum arabic)","range":"long (400 ft. + 40 ft./level)","target":"any number of creatures, no two of which can be more than 180 ft. apart","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"As invisibility, but affects any number of creatures within range (as long as they're grouped closely enough) and, unlike normal invisibility, does not end for a creature that attacks.","source":"PRPG Core Rulebook pg. 295"},{"n":"Irresistible Dance","l":6,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"touch","target":"living creature touched","duration":"1d4+1 rounds","save":"Will partial","sr":"yes","effect":"The subject feels an undeniable urge to dance and begins doing so, complete with foot shuffling and tapping. The spell effect makes it impossible for the subject to do anything other than caper and prance in place. The effect imposes a –4 penalty to Armor Class and a –10 penalty on Reflex saves, and it negates any AC bonus granted by a shield the target holds. The dancing subject provokes attacks of opportunity each round on its turn. A successful Will save reduces the duration of this effect to 1 round.","source":"PRPG Core Rulebook pg. 303"},{"n":"Knock, Mass","l":6,"school":"Transmutation","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one means of closure/level, no two of which can be more than 30 feet apart","duration":"instantaneous","save":"none","sr":"no","effect":"Also known as “unshackle,” this spell functions as knock, but works on multiple means of closure at once.","source":"Inner Sea Temples"},{"n":"Life of Crime","l":6,"school":"enchantment (compulsion) [curse, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (black mask)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"Curses the target to put its own interests above all else: it can no longer benefit from teamwork feats, aid another actions, or beneficial magic cast by others, and it instinctively favors stealth and deceit to further its own agenda. While conscious, the target must attempt a Will save once per hour (or once per round in combat) or act for 1 round as though under a crime wave effect. Removing the curse requires remove curse cast at a higher caster level, or limited wish, wish, or miracle.","source":"Ultimate Intrigue pg. 218"},{"n":"Mantle of Doubt","l":6,"school":"illusion ( phantasm ) [ emotion , fear , mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 round/level (D)","save":"","sr":"","effect":"You wrap your mind in phantasms of crippling doubt that assail any who dare harm you. When a creature within the mantle’s radius attacks you or attempts to affect you with a harmful effect, it must succeed at a Will save as these spectres of uncertainty force themselves into its mind. Ongoing effects trigger the mantle only if the creature consciously directs them against you. A given creature need only roll a saving throw against your mantle of doubt at most once per round. If the creature’s attack or effect against you was a psychic spell or spell-like ability, that creature’s save takes a –4 penalty. A creatures that fails its save agains
