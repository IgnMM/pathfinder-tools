castingTime":"1 immediate action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"You can cast this spell immediately after attacking a creature, causing that creature to believe that a different creature that threatens it was responsible for the attack rather than you. You can instead cast this spell immediately after a failed Bluff, Diplomacy, or Intimidate check, causing the target of that check to believe that a different creature you designate within spell range was responsible for the content of that failed check. Using the spell in these ways doesn’t compel the target to undertake a specific action in response to its belief of where the blame lies.","source":"Ultimate Intrigue pg. 210"},{"n":"Delay Disease","l":2,"school":"conjuration (healing)","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"creature touched","duration":"1 day","save":"Fortitude negates (harmless)","sr":"yes (harmless)","effect":"The target becomes temporarily immune to disease. Any disease to which it is exposed during the spell’s duration does not affect the target until the spell’s duration has expired. If the target is currently infected with a disease, you must make a caster level check against the disease’s DC to suspend it for the duration of the spell; otherwise, that disease affects the target normally. Delay disease does not cure any damage a disease may have already done.","source":"Advanced Race Guide pg. 155"},{"n":"Delay Pain","l":2,"school":"enchantment [emotion]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"You override the target’s ability to feel pain. Pain effects (such as pain strike and symbol of pain) do not affect the target until this spell’s duration has expired. This does not negate any physical damage, ability damage, or ability drain that a pain effect has already done, but it does negate ongoing penalties from pain while the spell lasts.","source":"Ultimate Magic pg. 216"},{"n":"Delay Poison","l":2,"school":"conjuration (healing)","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"creature touched","duration":"1 hour/level","save":"Fortitude negates (harmless)","sr":"yes (harmless)","effect":"The subject becomes temporarily immune to poison. Any poison in its system or any poison to which it is exposed during the spell's duration does not affect the subject until the spell's duration has expired. Delay poison does not cure any damage that poison may have already done.","source":"PRPG Core Rulebook pg. 265"},{"n":"Detect Anxieties","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a medallion)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"Will negates (see text)","sr":"no","effect":"Senses the significant anxieties of creatures with Intelligence 1 or higher (conscious or not) in the cone; the second round reveals each mind's Wisdom score and its current degree of fear (from shaken to paralyzed), and if the highest Wisdom present is 26 or higher and beats yours by 10 or more, you're stunned for 1 round and the spell ends. The third round reveals the single most pressing anxiety of any mind present (Will negates this reading). Threatening a creature with a known anxiety grants a +2 bonus on Intimidate checks against it.","source":"Ultimate Intrigue pg. 211"},{"n":"Detect Magic, Greater","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"none","sr":"no","effect":"This spell functions as detect magic, except that you can glean much more information from the magical auras that you find, and those auras can be found after a much greater length of time. You can detect a lingering aura for up to 1 day per caster level you have, regardless of the aura’s original strength.\n\nAdditionally, when you use a standard action to concentrate on this spell, you can also study a creature within the spell’s area and attempt a Spellcraft check in order to determine the last spell that the creature cast by identifying lingering traces that the spell left in the caster’s aura. The DC to identify the spell is equal to 20 + the creature’s caster level.\n\nFinally, you are able to locate and analyze the signature flourishes in a magical aura that allow you to match a spell to the person who cast it. In order to find these identifiers in a spell’s aura, you must spend 1 round focusing on that spell in particular, and succeed at an opposed Knowledge (arcana) check against the caster (or a Knowledge [arcana] check with a DC equal to 15 + the spell level if the caster wants her work to be identified and emphasizes these unique elements rather than obscuring them). Once you learn a caster’s set of identifiers, you can remember them as easily as a face or a voice. You can recognize this signature if you succeed at a Spellcraft check when later identifying a spell to determine whether or not that spell was cast by the same individual. The spell greater magic aura can obfuscate this information, making it seem that someone else cast the spell. Greater detect magic grants a saving throw against magic aura (but not greater magic aura).","source":"Ultimate Intrigue pg. 212"},{"n":"Detect Mindscape","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"Will negates, see text","sr":"no","effect":"This spell functions similarly to detect thoughts, allowing you to sense when one or more creatures’ consciousnesses are inside a mindscape (see page 234). The amount of information revealed depends on how long you study a particular subject.\n\nFirst Round: You sense the presence or absence of a mindscape. At least one of the creatures inside the mindscape must be within the cone-shaped area for you to detect the mindscape.\n\nSecond Round: You sense the number of consciousnesses inside the mindscape. Not all of the creatures within the mindscape must be standing inside the cone-shaped area of the spell for you to count them; only one is required to get this reading. However, you can’t determine the location of the creatures if you can’t see the creatures themselves. You sense their presence only in an abstract way.\n\nThird Round: You sense an image of what’s taking place inside the mindscape. The creature controlling the mindscape can sense your efforts, and if it does not wish you to view the mindscape, it can prevent this viewing with a successful Will save. Otherwise, you perceive the visuals remotely, as if watching through a window. If a creature has disguised itself, you see only the creature’s mental mask (not its true form).\n\nEach round, you can turn to detect mindscapes in a new area. The spell can penetrate many barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.\n\nIf you are within a mindscape when you cast this spell, you become aware you’re in a mindscape. On the second round, you can still detect how many consciousnesses are inside, but you don’t get the image of the mindscape in the third round.","source":"Occult Adventures"},{"n":"Detect Thoughts","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a copper piece)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 min./level (D)","save":"Will negates; see text","sr":"no","effect":"You detect surface thoughts. The amount of information revealed depends on how long you study a particular area or subject.\n1st Round: Presence or absence of thoughts (from conscious creatures with Intelligence scores of 1 or higher).\n2nd Round: Number of thinking minds and the Intelligence score of each. If the highest Intelligence is 26 or higher (and at least 10 points higher than your own Intelligence score), you are stunned for 1 round and the spell ends. This spell does not let you determine the location of the thinking minds if you can't see the creatures whose thoughts you are detecting.\n3rd Round: Surface thoughts of any mind in the area. A target's Will save prevents you from reading its thoughts, and you must cast detect thoughts again to have another chance. Creatures of animal intelligence (Int 1 or 2) have simple, instinctual thoughts.\nEach round, you can turn to detect thoughts in a new area. The spell can penetrate barriers, but 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt blocks it.","source":"PRPG Core Rulebook pg. 268"},{"n":"Diminish Resistance","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a pinch of coarse sand)","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 round/level (D)","save":"Fortitude negates","sr":"yes","effect":"You weaken a creature’s resistance against one energy type you select: acid, cold, electricity, fire, or sonic. The creature’s resistance to that energy type decreases by 5 (minimum 0), plus an additional 5 for every 5 caster levels beyond 3rd (to a maximum of 20 at 18th level).","source":"Planar Adventures pg. 40, Monster Hunter's Handbook pg. 30"},{"n":"Disfiguring Touch","l":2,"school":"transmutation [curse]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"With a touch, you cause the victim of this spell to suffer a painful curse that causes it to grow hideously disfigured. The physical appearance of the deformity is subject to the caster’s whim (most demon worshipers choose deformities that reflect their Abyssal patron’s shape or form). The target takes one of the following penalties.  –2 decrease to an ability score (minimum 1). –2 penalty on attack rolls or saving throws. Land speed reduced by 5 feet.  You may also invent other effects, but they should be no more powerful than those described above.Mythic Disfiguring TouchSource Mythic Adventures pg. 91\nThe target takes two different penalties (chosen from the same list) instead of one. \n\nAugmented: If you expend two uses of mythic power, the target also gains the fatigued condition because of its painful disfigurement. If this fatigue is negated without removing the curse, it returns after 1 hour.","source":"Ultimate Magic pg. 217, Book of the Damned - Volume 2: Lords of Chaos pg. 48"},{"n":"Dream Shield","l":2,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (hollow glass ball or dreamcatcher)","range":"touch","target":"creature touched","duration":"1 hour/level","save":"Will negates (harmless)","sr":"no","effect":"You ward the target’s mind against intrusion and influence while she is unconscious. While sleeping, the target is protected against divinations such as nondetection and gains spell resistance equal to 10 + your caster level against mind-affecting effects. In addition, the subject immediately receives another saving throw (if one was allowed to begin with) against any spell or effect that would possess or exercise direct mental control over her. This functions in all respects like the second property of protection from evil but it applies regardless of the alignment of the creature or object that created the possession or mental influence effect.\nIf the target is awake, instead of the previous effects, the dream shield provides a +4 bonus on saving throws against sleep effects. The spell’s other effects are suppressed while the target is awake. If the target falls asleep or is otherwise rendered unconscious, the other effects of the dream shield resume. Every 10 minutes spent awake consumes 1 hour of the dream shield’s duration.","source":"Occult Origins pg. 28"},{"n":"Eagle's Splendor","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (feathers or droppings from an eagle)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes","effect":"The transmuted creature becomes more poised, articulate, and personally forceful. The spell grants a +4 enhancement bonus to Charisma, adding the usual benefits to Charisma-based skill checks and other uses of the Charisma modifier. Bards, paladins, and sorcerers (and other spellcasters who rely on Charisma) affected by this spell do not gain any additional bonus spells for the increased Charisma, but the save DCs for spells they cast while under this spell's effect do increase.","source":"PRPG Core Rulebook pg. 275"},{"n":"Emotive Block","l":2,"school":"enchantment ( compulsion ) [ mind-affecting ]","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You create an emotional block in the target’s mind, adding an emotion component to each spell or spell-like ability he uses. This is in addition to any other components the spell already requires, and doesn’t replace the somatic component. The target’s spelllike abilities require this emotion component, even though they normally don’t need spell components. As usual with emotion components, the target can’t cast spells (or use spell-like abilities, in this case) while affected by a non-harmless emotion or fear effect.","source":"Occult Adventures pg. 169"},{"n":"Enchantment Sight","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"Your irises take on a purplish tinge and you can see whether creatures within 60 feet of you are affected by an enchantment effect. To your eyes only, a creature under the effects of an enchantment spell glows with a simple white light around its head. You can immediately discern whether the brightness of the light is faint, moderate, strong, or overwhelming depending on the highest spell level of enchantment currently in effect (as per detect magic). Enchantments of the charm or compulsion subschool glow with a scarlet or emerald hue, respectively.\nIf a creature under an enchantment effect is in your line of sight, you can attempt a Spellcraft check as a move action to determine the highest-level spell or spell effect (DC = 15 + the spell level, or 15 + 1/2 the caster level for a non-spell effect). Effects that block divination magic also block this spell.\nEnchantment sight can be made permanent with a permanency spell cast by a caster of 9th level or higher, at a cost of 2,500 gp.","source":"Heroes of the High Court pg. 10"},{"n":"Enshroud Thoughts","l":2,"school":"abjuration [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You become warded against the mental prying of others, including the effects of divination spells such as detect thoughts and seek thoughtsAPG, as well as enchantment spells such as modify memory and memory lapseAPG. If another creature attempts to target you with a mind-affecting spell that detects or alters your thoughts or memories, the caster must succeed at a caster level check against a DC equal to 11 + your caster level or the spell fails. Only spells that detect or alter your thoughts or memories are blocked by this spell; effects such as clairaudience/clairvoyance, detect evil, and locate creature continue to affect you as normal.","source":"Occult Adventures pg. 169, Blood of the Elements pg. 13"},{"n":"Enter Image","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M/DF (a drop of paint and a ball of clay)","range":"50 ft./level","target":"transfer consciousness to any object bearing your likeness","duration":"concentration","save":"none","sr":"no","effect":"You gain a dim impression of the activities around any object bearing your face or form and can also project your consciousness into one such object at a time, allowing you to observe or even interact with nearby creatures. This spell allows you to leave your body and subconsciously monitor the immediate area around any depiction of your image whether one, hundreds, or even thousands. Each such image has the full range of your normal senses (sight, hearing, smell, etc.) and you can make a Perception check to notice anything occurring nearby. The DC of this check is always 10 greater than what it would be if you were actually present at that location, so even if you would normally notice something automatically (such as talking, normally a DC of 0), you would need to make a DC 10 Perception check to notice it.\n\nYou may, at any time, choose to fill one specific image within range with your consciousness. While inside an image you lose the ability to monitor any other images within range but remain fully aware of your own body’s surroundings. Your body is defenseless and helpless (always failing any saving throw) while your consciousness is filling an image, but you can return to it at any time as an immediate action.\n\nWhen you fill an image with your consciousness it gains a limited form of animation. Statues and similar three-dimensional representations can move their heads, make gestures, and talk, but cannot attack or leave their square without assistance. Portraits or similar two-dimensional representations bearing your likeness can also talk and your image can move anywhere within the picture or even temporarily alter it (such as by picking a flower in the painting). You cannot use any spells or other abilities while within an image.\n\nYou may leave the image at any time, returning you to your body. Once your consciousness departs from an object bearing your likeness, it immediately reverts to the appearance it had before you entered it. If someone destroys or damages the image you return to your body unharmed. The spell lasts until you cease concentrating, or until it is terminated by some outside means, such as a dispel magic cast upon either the image or your body, or if your body is killed.","source":"Advanced Player's Guide pg. 219"},{"n":"Enthrall","l":2,"school":"enchantment (charm) [language-dependent, mind-affecting, sonic]","castingTime":"1 round","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"any number of creatures","duration":"1 hour or less","save":"Will negates; see text","sr":"yes","effect":"If you have the attention of a group of creatures, you can use this spell to hold them enthralled. To cast the spell, you must speak or sing without interruption for 1 full round. Thereafter, those affected give you their undivided attention, ignoring their surroundings. They are considered to have an attitude of friendly while under the effect of the spell. Any potentially affected creature of a race or religion unfriendly to yours gets a +4 bonus on the saving throw.\n\nA target with 4 or more HD or with a Wisdom score of 16 or higher remains aware of its surroundings and has an attitude of indifferent. It gains a new saving throw if it witnesses actions that it opposes.\n\nThe effect lasts as long as you speak or sing, to a maximum of 1 hour. Those enthralled by your words take no action while you speak or sing and for 1d3 rounds thereafter while they discuss the topic or performance. Those entering the area during the performance must also successfully save or become enthralled. The speech ends (but the 1d3-round delay still applies) if you lose concentration or do anything other than speak or sing.\n\nIf those not enthralled have unfriendly or hostile attitudes toward you, they can collectively make a Charisma check to try to end the spell by jeering and heckling. For this check, use the Charisma bonus of the creature with the highest Charisma in the group; others may make Charisma checks to assist. The heckling ends the spell if this check result beats your Charisma check result. Only one such challenge is allowed per use of the spell.\n\nIf any member of the audience is attacked or subjected to some other overtly hostile act, the spell ends and the previously enthralled members become immediately unfriendly toward you. Each creature with 4 or more HD or with a Wisdom score of 16 or higher becomes hostile.","source":"PRPG Core Rulebook pg. 278"},{"n":"Euphoric Cloud","l":2,"school":"conjuration (creation) [poison]","castingTime":"1 standard action","components":"V, S, M (rare mushrooms worth 5 gp)","range":"medium (100 ft. + 10 ft./level)","target":"fog spreads in 20-ft. radius, 20 ft. high","duration":"1 round/level","save":"Fortitude negates (see text)","sr":"no","effect":"You create a bank of fog similar to that created by fog cloud except its vapors are intoxicating. Living creatures in the cloud become fascinated. This condition lasts as long as a creature is in the cloud and for 1d4+1 rounds after it leaves. Any creature that succeeds at its save but remains in the cloud must continue to save each round on your turn.","source":"Advanced Class Guide pg. 181"},{"n":"False Belief","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"10 minutes, plus length of memory to be altered","components":"V, S, M (lemon juice and a scrap of parchment)","range":"touch","target":"willing creature touched","duration":"1 hour/level","save":"none","sr":"yes","effect":"You temporarily alter the target’s memory (similar to modify memory) to eliminate, change, or implant a memory of up to 1 hour in length. When the duration of this expires, the target’s real memory returns, and the false memory fades to little more than a vague outline, like a dream. This false memory seems true to the target, so effects that detect lies or force the target to speak the truth (as the subject understands it) don’t detect the falsehood.","source":"Ultimate Intrigue pg. 214"},{"n":"False Life","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a drop of blood)","range":"personal","target":"you","duration":"1 hour/level or until discharged; see text","save":"none","sr":"no","effect":"You harness the power of unlife to grant yourself a limited ability to avoid death. While this spell is in effect, you gain temporary hit points equal to 1d10 + 1 per caster level (maximum +10).\nMythic False Life\n##Source## Mythic Adventures pg. 93\nThe temporary hit points gained increase to 2d8 + 2 per caster level (maximum +20). As an immediate action, you can dismiss the remaining duration of the spell to prevent 1 point of Strength, Dexterity, or Constitution damage per 10 temporary hit points remaining from the spell. This takes effect after the attack hits you and the damage is rolled, but before you take the damage. For example, if you have 22 temporary hit points from mythic false life and a wyvern stings you for 3 points of Constitution damage, you can dismiss the spell to prevent 2 points of Constitution damage from that attack.","source":"PRPG Core Rulebook pg. 280"},{"n":"Focused Scrutiny","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"You gain heightened sensitivity to the mannerisms, reactions, and body language of one creature you can perceive, allowing you to sense its state of mind and easily influence it. You gain a +10 bonus on Perception, Sense Motive, and Survival checks attempted against the target creature, as well as a +5 bonus on Diplomacy and Intimidate checks attempted against it.","source":"Advanced Class Guide pg. 182"},{"n":"Garrulous Grin","l":2,"school":"necromancy [fear, mind-affecting]","castingTime":"1 round","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"Plants a seed of supernatural self-doubt in the target's mind, making it evasive and uncertain; it takes a -4 penalty on Bluff and Diplomacy checks made to persuade others, as well as on Diplomacy and Intimidate checks made to shift others' attitudes.","source":"Spymaster's Handbook pg. 28"},{"n":"Ghostly Disguise","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minute/level (D)","save":"none","sr":"no","effect":"You make yourself—including clothing, armor, weapons, and equipment—appear translucent like a ghost. Any mundane or magical disguise on you is affected by this illusion as well; for example, if you are disguised as the king or a sahuagin, you look like a ghostly version of the king or a sahuagin. Your ghostly form may have a pale green, blue, or violet coloration, or a muted version of your normal appearance.\nThe spell does not actually make you ghostly or provide any incorporeal abilities. If you choose, the illusion can make you appear to float slightly above the ground, though you are actually still on the ground. A creature that interacts with the glamer gets a Will save to recognize it as an illusion.","source":"Ultimate Magic pg. 222"},{"n":"Glitterdust","l":2,"school":"conjuration (creation)","castingTime":"1 standard action","components":"V, S, M (ground mica)","range":"medium (100 ft. + 10 ft./level)","target":"creatures and objects within 10-ft.-radius spread","duration":"1 round/level","save":"Will negates (blinding only)","sr":"no","effect":"A cloud of golden particles covers everyone and everything in the area, causing creatures to become blinded and visibly outlining invisible things for the duration of the spell. All within the area are covered by the dust, which cannot be removed and continues to sparkle until it fades. Each round at the end of their turn blinded creatures may attempt new saving throws to end the blindness effect.\n\nAny creature covered by the dust takes a –40 penalty on Stealth checks.","source":"PRPG Core Rulebook pg. 290"},{"n":"Haunting Mists","l":2,"school":"illusion (figment) [fear, shadow]","castingTime":"1 standard action","components":"V, S","range":"20 ft.","target":"cloud spreads in 20-ft. radius, 20 ft. high","duration":"1 minute/level (D)","save":"Will partial (see text)","sr":"no","effect":"An illusion of misty vapor inhabited by shadowy shapes arises around you. It is stationary. The illusory mist obscures all sight, including darkvision, beyond 5 feet. A creature 5 feet away has concealment (attacks have a 20% miss chance). Creatures farther away have total concealment (50% miss chance, and the attacker cannot use sight to locate the target). All creatures within the mist must save or take 1d2 points of Wisdom damage and gain the shaken condition. The shaken condition lasts as long as the creature remains in the mist.","source":"Ultimate Magic pg. 222"},{"n":"Haunting Reminder","l":2,"school":"enchantment [fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"12 hours + 2 hours/level or until triggered, then 1 day/level","save":"Will negates","sr":"yes","effect":"Following a successful Intimidate check on the target, this spell binds a lingering fear of retribution into it. If the target later reports the coercion, attacks you, or acts against your interests, the spell triggers: the target becomes shaken for 1 day per caster level and takes a -2 penalty on saves against your other fear-descriptor spells during that period.","source":"Adventurer's Guide pg. 37"},{"n":"Heckle","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a tomato)","range":"medium (100 ft. + 10 ft./level)","target":"1 creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"You badger and nitpick the subject of your spell until its mood sours. The target’s attitude shifts one category toward hostile regarding you and everyone within 30 feet of the target at the time the spell is cast. The target also takes a –2 penalty on attack rolls, on saving throws, and on ability and skill checks that rely on Intelligence, Wisdom, or Charisma.","source":"Arcane Anthology pg. 26"},{"n":"Hidden Knowledge","l":2,"school":"transmutation","castingTime":"1 round","components":"V, S, M (a drop of ink)","range":"personal","target":"you","duration":"up to 1 day/level (see text)","save":"","sr":"","effect":"This subtle but useful spell allows you to safeguard important knowledge—even from yourself. While casting this spell, you recite one piece of knowledge (up to a maximum of 50 words). Upon completion of the spell’s casting, you transfer the knowledge from your mind to your skin in the form of an intricate, runic tattoo placed anywhere you choose on your body. The knowledge disappears utterly from your mind, and you might not realize you forgot something. The magic of the spell patches over gaps in your memory with recollections from the past. Until the spell’s duration ends, the knowledge is lost to you. When you cast this spell, you decide how long you wish the spell’s duration to be, up to a maximum duration of 1 day per level.\n\nMany Cyphermages commission nonmagical tattoos to disguise the effects of this spell. A detect magic spell or a successful Linguistics or Spellcraft check (DC 20 + your Intelligence modifier) reveals an enchanted tattoo, but not its contents. The effects of hidden knowledge can be dispelled normally, in which case the knowledge is completely lost.","source":"Adventurer's Guide pg. 60, Second Darkness Player's Guide pg. 26"},{"n":"Hidden Presence","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (eye drops made with extract of poppy)","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one creature per 3 caster levels","duration":"1 minute/level (D)","save":"Will negates","sr":"yes","effect":"You prevent the targets from having conscious awareness of your presence. You make yourself completely undetectable to the subjects by erasing all awareness of your presence from their minds. The targets can’t see, hear, smell, feel, or taste you, including with extraordinary or supernatural senses such as blindsense, blindsight, scent, or tremorsense. They can’t pinpoint your location by any means, including detect spells.\n\nThe targets remain unaware of your actions, provided you don’t make any attacks or cause any obvious or directly threatening changes in the targets’ environment. If you attack any of the target creatures, the effect ends. If you take an action that creates a sustained and obvious change in the target’s environment—for example, attacking a creature other than a target or moving a sizeable or attended object the target can see—the target immediately receives a new saving throw.","source":"Ultimate Intrigue pg. 216"},{"n":"Hidden Speech","l":2,"school":"transmutation [language-dependent]","castingTime":"1 standard action","components":"V, S, M/DF (a cipher written on a piece of parchment)","range":"close (25 ft. + 5 ft./2 levels)","target":"you plus one creature/level, no two of which can be more than 30 ft. apart","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes","effect":"You greatly enhance the ability of the subjects to communicate hidden messages to each other. Each target gains a +10 competence bonus on Bluff checks to send secret message to other recipients. Others using opposed Sense Motive checks to decipher these messages receive a –5 penalty. All subjects affected by the spell must share a language to be able to pass messages.","source":"Advanced Player's Guide pg. 227"},{"n":"Hold Animal","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one animal","duration":"1 round/level (D); see text","save":"Will negates; see text","sr":"yes","effect":"This spell functions like hold person, except that it affects an animal instead of a humanoid.","source":"Core Rulebook pg. 296"},{"n":"Hold Person","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a small, straight piece of iron)","range":"medium (100 ft. + 10 ft./level)","target":"one humanoid creature","duration":"1 round/level (D); see text","save":"Will negates; see text","sr":"yes","effect":"Paralyzes the target, who remains conscious and breathing but can take no actions, including speech, for the duration; each round it may attempt a new save as a full-round action (without provoking attacks of opportunity) to break free. A winged creature that fails cannot flap and falls, and a swimmer that fails cannot swim and may drown.","source":"PRPG Core Rulebook pg. 296"},{"n":"Honeyed Tongue","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, M/DF (a drop of honey)","range":"personal","target":"you","duration":"10 minutes/level","save":"","sr":"","effect":"This spell augments your diplomacies. While under the effects of spell, you roll two dice each time you make a Diplomacy check to change a creature’s attitude, taking the highest roll. If this results in a roll low enough to reduce the creature’s attitude by a step, that creature gets some clue that you are manipulating it with a spell. Alternatively you can cast this spell before making a Diplomacy check to gather information, gaining a +5 competence bonus on the check.","source":"Advanced Player's Guide pg. 228"},{"n":"Hoodwink","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (small piece of black cloth)","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one creature/level, no two of which can be more than 30 ft. apart","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"You befuddle the targets’ senses, preventing the targets from clearly perceiving their surroundings. Instead, hoodwinked creatures see only the roughest shapes and details and hear only muffled noises. However, targets can clearly hear verbal communication from the spell’s caster. This spell does not impart understanding of the caster’s language if the creature can’t already understand it. Other than to hear the caster speak, targets automatically fail Perception checks with DCs greater than 5, and they are too disoriented by the spell to accurately remember the path they took while under its effects.\n\nWhile under the effects of this spell, targets without the help of a guide move at half speed, and any attacks they make are treated as though the creature they are attacking had concealment.\n\nMoving faster than half speed requires targets to succeed at a DC 10 Acrobatics check. Those that fail this check fall prone. If the target is attacked or physically harmed by any creature other than another target of hoodwink, the spell’s effect ends immediately for that target only.","source":"Villain Codex pg. 212"},{"n":"Howling Agony","l":2,"school":"necromancy [death, pain]","castingTime":"1 standard action","components":"V, S, M (a needle and a dried eyeball)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Fortitude negates","sr":"yes","effect":"You send wracking pains through the targets’ bodies. Because of the pain, affected creatures take a –2 penalty to AC, attacks, melee damage rolls, and Reflex saving throws, and must succeed at a concentration check (DC equal to the DC of this spell) to cast spells. However, if an affected creature spends a move action screaming as loudly as possible, it can act without any other penalties for the remainder of its turn. “Screaming,” for the purposes of this spell, includes any vocalization of pain or its telepathic equivalent; creatures that cannot scream (such as creatures without the natural ability to communicate or vocalize) suffer the full effect of the spell.","source":"Ultimate Magic pg. 223"},{"n":"Hypnotic Pattern","l":2,"school":"illusion (pattern) [mind-affecting]","castingTime":"1 standard action","components":"V (bard only), S, M (a stick of incense or a crystal rod); see text","range":"medium (100 ft. + 10 ft./level)","target":"colorful lights in a 10-ft.-radius spread","duration":"concentration + 2 rounds","save":"Will negates","sr":"yes","effect":"A twisting pattern of subtle, shifting colors weaves through the air, fascinating creatures within it. Roll 2d4 and add your caster level (maximum 10) to determine the total number of HD of creatures affected. Creatures with the fewest HD are affected first; and, among creatures with equal HD, those who are closest to the spell's point of origin are affected first. HD that are not sufficient to affect a creature are wasted. Affected creatures become fascinated by the pattern of colors. Sightless creatures are not affected.\n\nA wizard or sorcerer need not utter a sound to cast this spell, but a bard must perform as a verbal component.","source":"PRPG Core Rulebook pg. 298"},{"n":"Implant False Reading","l":2,"school":"illusion ( glamer )","castingTime":"1 minute","components":"V, S","range":"touch","target":"object touched","duration":"1 day/level","save":"none, see text","sr":"no","effect":"You implant a false psychometric reading into an object, imbuing the item with misleading information that might be learned from the object reading spell or through the psychometry occult skill unlock (see page 196). This information might fool enemies, create a false history, or pass on secret messages through objects to psychically attuned allies. You can implant any information you wish that could be implanted by the charge object spell, as well as up to one piece of information per 3 levels that could be attained using psychometry or the object reading spell. You can detail this information in any way you see fit, either making up a previous owner and circumstances involving the object from whole cloth, or attempting to emulate the biographical information and fictional accounts of a specific individual’s experience with the object. During the spell’s duration, creatures reading the object through the object reading spell or the psychometry occult skill unlock receive this false information in place of an item’s true history if they fail a Will saving throw. Creatures that succeed at their saves still detect and receive the false information, but recognize it for what is and are able to discern the fictitious information from the item’s true history without difficulty. This spell masks its own magical aura, causing the target to not register as magical to detect spells and similar effects. This masking doesn’t conceal any other magical auras on the object, and can be overcome in the same ways as magic aura .","source":"Occult Adventures pg. 173"},{"n":"Inflict Pain","l":2,"school":"enchantment [mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will partial; successful save reduces duration to 1 round","sr":"yes","effect":"Wracks the target with mental and physical distress, imposing a -4 penalty on attack rolls, skill checks, and ability checks for the duration.","source":"Occult Adventures pg. 174"},{"n":"Influence Wild Magic","l":2,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"Target: you; Effect: 20-foot-radius burst of stabilizing magic centered on you","duration":"10 minutes/level","save":"none (harmless)","sr":"no (harmless)","effect":"This spell creates an area of stabilizing magical energy that emanates from you. Any creature within this area that fails a concentration check to cast a spell normally in an area of wild magic rolls twice to determine the wild magic effect and choose its preferred result.","source":"People of the Wastes pg. 29"},{"n":"Instigate Psychic Duel","l":2,"school":"illusion ( phantasm ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"You begin a psychic duel (see page 202) with a creature. This psychic duel takes place on a binary mindscape (see page 235) that includes only two minds: yours and the target’s. This spell ends and both minds return to their respective bodies if one of you drops below 0 hit points or if both of you agree to end the psychic duel (a free action that you can perform even if it isn’t your turn). Even if you cast the spell, you must succeed at a Will save to escape your own psychic duel if your opponent doesn’t want to allow you to leave. Spells like mindscape door can also free you from the mindscape (and mindscape door is one of the few spells you can cast in a binary mindscape). A binary mindscape is clearly illusory, and disbelieving the illusion doesn’t alter how the mindscape works.","source":"Occult Adventures pg. 174"},{"n":"Investigative Mind","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level or until discharged","save":"none","sr":"no","effect":"Your mind is able to correlate information effectively. When attempting an Appraise, Knowledge, Linguistics, or Spellcraft check, you can roll twice and take the higher result. If you have an ability that allows you to roll twice, you cannot use that ability and this benefit on the same roll.\nThe spell is discharged once you have used its benefit a number of times equal to your caster level.","source":"Advanced Class Guide pg. 185"},{"n":"Invisibility","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M/DF (an eyelash encased in gum arabic)","range":"personal or touch","target":"you or a creature or object weighing no more than 100 lbs./level","duration":"1 min./level (D)","save":"Will negates (harmless) or Will negates (harmless, object)","sr":"yes (harmless) or yes (harmless, object)","effect":"The creature or object touched becomes invisible. If the recipient is a creature carrying gear, that vanishes, too. If you cast the spell on someone else, neither you nor your allies can see the subject, unless you can normally see invisible things or you employ magic to do so.\nItems dropped or put down by an invisible creature become visible; items picked up disappear if tucked into the clothing or pouches worn by the creature. Light, however, never becomes invisible, although a source of light can become so (thus, the effect is that of a light with no visible source). Any part of an item that the subject carries but that extends more than 10 feet from it becomes visible.\nOf course, the subject is not magically silenced, and certain other conditions can render the recipient detectable (such as swimming in water or stepping in a puddle). If a check is required, a stationary invisible creature has a +40 bonus on its Stealth checks. This bonus is reduced to +20 if the creature is moving. The spell ends if the subject attacks any creature. For purposes of this spell, an attack includes any spell targeting a foe or whose area or effect includes a foe. Exactly who is a foe depends on the invisible character's perceptions. Actions directed at unattended objects do not break the spell. Causing harm indirectly is not an attack. Thus, an invisible being can open doors, talk, eat, climb stairs, summon monsters and have them attack, cut the ropes holding a rope bridge while enemies are on the bridge, remotely trigger traps, open a portcullis to release attack dogs, and so forth. If the subject attacks directly, however, it immediately becomes visible along with all its gear. Spells such as bless that specifically affect allies but not foes are not attacks for this purpose, even when they include foes in their area.\nInvisibility can be made permanent (on objects only) with a permanency spell.\nMythic Invisibility\n##Source## Mythic Adventures pg. 99\nThe invisible target can’t be detected with detect magic or other spells that detect magic auras. The invisibility can’t be penetrated, revealed, or dispelled by spells of 2nd level or lower (such as see invisibility or glitterdust), though true seeing and dust of appearance can reveal the invisible target’s presence.\nAugmented (3rd): If you expend two uses of mythic power, the invisible target is undetectable by blindsense, blindsight, scent, and tremorsense.","source":"PRPG Core Rulebook pg. 301"},{"n":"Invisibility Bubble","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (needle from a sea urchin)","range":"touch","target":"touched creature's space, up to one 5-foot-cube","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"A glamered bubble surrounds the target’s space, rendering her completely invisible underwater by hiding both the target and any water she displaces. Because of the bubble’s size limit, this spell works only on Medium or smaller targets. Other objects and creatures within the bubble’s space are also invisible while they stay in the space, which could reveal the spell’s existence to a canny observer who notices fish disappearing into the bubble and reappearing on the other side. Creatures inside the bubble can see each other, which allows foes who can pinpoint the bubble’s location (such as dragons) to stick their heads into the bubble in order to see the target. Any creature on the inside of the bubble that takes any action that would break invisibility pops the bubble and ends the spell early. On land, the bubble is clearly visible, acting much as invisibility does in the water. Unlike with invisibility, the inside of the bubble blocks light from escaping the bubble, meaning that light sources inside the bubble don’t illuminate past its edges, but also don’t reveal a telltale glow.","source":"Aquatic Adventures pg. 60"},{"n":"Jealous Rage","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 minute/level (D)","save":"Will negates","sr":"no","effect":"Fills the target with entitled self-importance; whenever an ally receives a beneficial effect the target itself doesn't share in, the target flies into a murderous rage and must attack either the source of that effect or the nearest beneficiary (whichever is closer) on its next turn. The compulsion ends once the target deals lethal damage to whoever it's jealous of.","source":"Occult Origins pg. 28"},{"n":"Knock","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V","range":"medium (100 ft. + 10 ft./level)","target":"one door, box, or chest with an area of up to 10 sq. ft./level","duration":"instantaneous; see text","save":"none","sr":"no","effect":"Knock opens stuck, barred, or locked doors, as well as those subject to hold portal or arcane lock. When you complete the casting of this spell, make a caster level check against the DC of the lock with a +10 bonus. If successful, knock opens up to two means of closure. This spell opens secret doors, as well as locked or trick-opening boxes or chests. It also loosens welds, shackles, or chains (provided they serve to hold something shut). If used to open an arcane locked door, the spell does not remove the arcane lock but simply suspends its functioning for 10 minutes. In all other cases, the door does not relock itself or become stuck again on its own. Knock does not raise barred gates or similar impediments (such as a portcullis), nor does it affect ropes, vines, and the like. The effect is limited by the area. Each casting can undo as many as two means of preventing access.","source":"PRPG Core Rulebook pg. 303"},{"n":"Know Peerage","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (thread from a tabard of livery)","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You impart your knowledge of nobility and peerage to the target, allowing her to recognize members of noble households, differentiate one set of heraldry from another, and otherwise identify who’s who at a royal gala or other noteworthy social event. The target is able to identify noble individuals, noble family names, and noble crests, signets, heraldry, and other symbols. The target treats her number of ranks in Knowledge (nobility) as though it were equal to your number of ranks in Knowledge (nobility), to a maximum of 5 ranks and a minimum of 0. If the target’s number of ranks is greater than yours, she uses her own number of ranks instead. In addition, if the target’s new total skill bonus on Knowledge (nobility) checks is at least +0, she automatically succeeds on all Knowledge (nobility) checks with a DC of 10 or lower.","source":"Ultimate Intrigue pg. 218"},{"n":"Levitate","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, F (a leather loop or golden wire bent into a cup shape)","range":"personal or close (25 ft. + 5 ft./2 levels)","target":"you or one willing creature or one object (total weight up to 100 lbs./level)","duration":"1 min./level (D)","save":"none","sr":"no","effect":"Levitate allows you to move yourself, another creature, or an object up and down as you wish. A creature must be willing to be levitated, and an object must be unattended or possessed by a willing creature. You can mentally direct the recipient to move up or down as much as 20 feet each round; doing so is a move action. You cannot move the recipient horizontally, but the recipient could clamber along the face of a cliff, for example, or push against a ceiling to move laterally (generally at half its base land speed).\nA levitating creature that attacks with a melee or ranged weapon finds itself increasingly unstable; the first attack has a –1 penalty on attack rolls, the second –2, and so on, to a maximum penalty of –5. A full round spent stabilizing allows the creature to begin again at –1.\nMythic Levitate\n##Source## Mythic Adventures pg. 99\nInstead of affecting one creature, you can affect a number of targets up to your caster level, but the total weight supported can be no more than 100 pounds per caster level. You can spend a move action to mentally direct all targets, but you must move all of them identically.\nAugmented (8th): If you expend 10 uses of mythic power, you permanently levitate a 5-foot cube of rock, which you can move 20 feet vertically or horizontally as a move action.\nIf you have created multiple cubes and they are physically touching each other, you can direct them all as a single move action (as if they were one object), even if some of them are out of range. Each levitating cube can support approximately 1,000 pounds of weight, allowing you to use it as a portion of the foundation for a bridge, floating castle, or similar construction project.","source":"PRPG Core Rulebook pg. 304"},{"n":"Locate Object","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S, F/DF (a forked twig)","range":"long (400 ft. + 40 ft./level)","target":"circle, centered on you, with a radius of 400 ft. + 40 ft./level","duration":"1 min./level","save":"none","sr":"no","effect":"You sense the direction of a well-known or clearly visualized object. You can search for general items, in which case you locate the nearest of its kind if more than one is within range. Attempting to find a certain item requires a specific and accurate mental image; if the image is not close enough to the actual object, the spell fails. You cannot specify a unique item unless you have observed that particular item firsthand (not through divination).\n\nThe spell is blocked by even a thin sheet of lead. Creatures cannot be found by this spell. Polymorph any object and nondetection fool it.","source":"PRPG Core Rulebook pg. 305"},{"n":"Mad Hallucination","l":2,"school":"illusion (phantasm)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"5 minute/level (maximum 1 hour)","save":"Will negates","sr":"yes","effect":"This spell induces a hallucinogenic reality in the mind of your target. Surfaces seem to swim, and movement constantly distracts the eye. The target takes a –2 penalty on Will saving throws, caster level checks, Intelligence-based skill checks, and Wisdom-based skill checks.","source":"Ultimate Magic pg. 227"},{"n":"Mantle of Calm","l":2,"school":"Enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"Personal","target":"You","duration":"1 round/level (D)","save":"None and Will negates (see text)","sr":"No and yes (see text)","effect":"You surround yourself with a mantle of calm serenity. You take a -2 penalty on attack rolls, and opponents gain a +2 bonus on saving throws against spells you cast. Any creature affected by a rage effect (barbarian's rage, bloodrager's bloodrage, blood rage monster ability, rage spell, skald's inspired rage raging song, and so on) that strikes you with a melee attack must attempt at a Will saving throw, without the rage effect's bonus to Will; failure means the rage effect ends (as if it were dispelled or the creature voluntarily ended it, as appropriate).\n\nIf you become affected by a rage effect while this spell is active, this spell immediately ends. If your rage effect comes from a skald's raging song, then it ends only for you, and you cannot re-accept the effects of the song.","source":"Advanced Class Guide"},{"n":"Mark of Spite","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a drop of blood)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round/level","save":"Fortitude negates","sr":"yes","effect":"Half-drow take substantial pains to ensure their enemies’ defeat. You must succeed at a ranged touch attack to place your mark on the victim. While the mark remains, you may injure yourself as a standard action, dealing a number of points of damage equal to 1d8 plus your Strength modifier. The recipient of the mark automatically takes twice the amount of damage that you deal to yourself, bypassing any damage reduction, immunities, or resistances.","source":"Heroes from the Fringe"},{"n":"Matchmaker","l":2,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"S, M (a rose petal)","range":"medium (100 ft. + 10 ft./level)","target":"two living creatures","duration":"1 hour/level","save":"Will partial, see text","sr":"yes","effect":"You entice the target creatures to become romantically interested in one another. Each creature saves and applies spell resistance separately. Both must be affected for the spell to have an effect. If either creatures has a prior unfriendly or hostile attitude toward the other, it receives a +4 bonus on its saving throw.\n\nThis spell doesn’t override the targets’ normal sexual preferences or other limitations. If romantic feelings are incompatible for this reason, the creature instead feels an intimate platonic bond with the other.","source":"Ultimate Intrigue pg. 220"},{"n":"Mind Over Matter","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one creature","duration":"instantaneous","save":"Fort negates","sr":"yes","effect":"You blur the lines between mind and body, reassigning ability damage or drain your target has taken to a corresponding ability score, as per the following table. Physical Ability Score Mental Ability Score Strength Intelligence Dexterity Wisdom Constitution Charisma The transfer of damage can go either way—you can convert Intelligence damage to Strength damage and vice versa. You can transfer any number of points of damage or drain in a single casting, though only from one ability score to the corresponding ability score. You cannot transfer enough ability damage or drain to reduce an ability score to 0.","source":"Occult Origins pg. 30"},{"n":"Mindlocked Messenger","l":2,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"10 minutes","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one willing living creature","duration":"permanent until discharged (see text)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You speak a short message (up to 10 words per caster level), implanting both it and the identity of the message’s intended recipient in the mind of a willing creature. The creature is aware of the message and who the recipient is. Any attempt to speak, write, or otherwise communicate the message to anyone other than its intended recipient causes the target to forget the message for 1d6 minutes. Attempts to read the target’s mind (such as with detect thoughts) or to force the target to reveal the message (such as with torture or magical compulsion) likewise cause temporary amnesia regarding the message.\n\nThe target can communicate the message only to someone it believes is the intended recipient, which means that disguises, illusions, and polymorph effects might fool the target into delivering the message. Once the target communicates the message, the message is permanently erased from the target’s memory.","source":"Advanced Class Guide pg. 187"},{"n":"Minor Image","l":2,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10 ft. cubes + one 10 ft. cube/level (S)","duration":"concentration + 2 rounds","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that minor image includes some minor sounds but not understandable speech.","source":"PRPG Core Rulebook pg. 314"},{"n":"Mirror Image","l":2,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 min./level","save":"","sr":"","effect":"This spell creates a number of illusory doubles of you that inhabit your square. These doubles make it difficult for enemies to precisely locate and attack you.\n\nWhen mirror image is cast, 1d4 images plus one image per three caster levels (maximum eight images total) are created. These images remain in your space and move with you, mimicking your movements, sounds, and actions exactly. Whenever you are attacked or are the target of a spell that requires an attack roll, there is a possibility that the attack targets one of your images instead. If the attack is a hit, roll randomly to see whether the selected target is real or a figment. If it is a figment, the figment is destroyed. If the attack misses by 5 or less, one of your figments is destroyed by the near miss. Area spells affect you normally and do not destroy any of your figments. Spells and effects that do not require an attack roll affect you normally and do not destroy any of your figments. Spells that require a touch attack are harmlessly discharged if used to destroy a figment.\n\nAn attacker must be able to see the figments to be fooled. If you are invisible or the attacker is blind, the spell has no effect (although the normal miss chances still apply).","source":"PRPG Core Rulebook pg. 314"},{"n":"Misdirection","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object, up to a 10-ft. cube in size","duration":"1 hour/level","save":"none or Will negates; see text","sr":"no","effect":"By means of this spell, you misdirect the information from divination spells that reveal auras (detect evil, detect magic, discern lies, and the like). On casting the spell, you choose another object within range. For the duration of the spell, the subject of misdirection is detected as if it were the other object. Neither the subject nor the other object gets a saving throw against this effect. Detection spells provide information based on the second object rather than on the actual target of the detection unless the caster of the detection succeeds on a Will save. For instance, you could make yourself detect as a tree if one were within range at casting: not evil, not lying, not magical, neutral in alignment, and so forth. This spell does not affect other types of divination magic (augury, detect thoughts, clairaudience/clairvoyance, and the like).","source":"PRPG Core Rulebook pg. 314"},{"n":"Miserable Pity","l":2,"school":"abjuration [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 round/level and 1 minute; see text","save":"Will negates (see text)","sr":"yes","effect":"This spell functions as sanctuary, except creatures attempting to attack the target who fail their saves also feel a strong sense of pity toward the target, as if it were weak, pathetic, and not a threat. If the target breaks the spell by attacking, any creature that failed its save against the spell gains a +2 morale bonus on attack rolls against the target for 1 minute.","source":"Ultimate Magic pg. 229"},{"n":"Mortal Terror","l":2,"school":"enchantment [fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will partial","sr":"yes","effect":"Confronts the target with an exaggerated sense of its own mortality, leaving it shaken; each round it takes damage thereafter, it must make another Will save or its fear worsens by one step (shaken to frightened to panicked), and failing again while panicked renders it helpless for the remaining duration. A successful initial save limits the shaken condition to just 1 round and prevents escalation that round.","source":"Legacy of the First World pg. 13"},{"n":"Muffle Sound","l":2,"school":"illusion (glamer)","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"1 ally/level","duration":"1 minute/level (D)","save":"","sr":"","effect":"You suppress sounds made by the targets, granting them a +4 bonus on Stealth checks. The targets have a 20% chance of spell failure when casting spells with verbal components or using abilities that have audible components (such as some bardic performances). This spell does not hamper the targets’ ability to hear other sounds and provides no protection against language-dependent or sonic spells and effects.","source":"Advanced Class Guide pg. 188"},{"n":"Object Reading","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one touched object","duration":"concentration, up to 1 round per level (D)","save":"none","sr":"no","effect":"You read the psychic impressions left upon an object by emotionally or psychically charged events in the item’s history, or the information imprinted by the charge object or implant false reading spells. This spell returns the same information as the psychometry occult skill unlock (see page 196), but gives 1 piece of information when cast and requires 1 round of concentration per additional piece of information instead of 1 minute. You must still attempt an Appraise check to see how much information you gain. You gain a +10 competence bonus on the check.","source":"Occult Adventures pg. 179"},{"n":"Obscured Script","l":2,"school":"illusion (phantasm)","castingTime":"1 standard action","components":"V, S, M (a scrap of paper bearing a simple sentence written in at least five languages)","range":"touch","target":"one touched page, scroll, inscription, book, or other document no more than 3 feet in any dimension","duration":"24 hours (D)","save":"none; see text","sr":"no","effect":"You create a latent illusion that clouds the judgment and reading ability of any creature that examines a targeted text. While casting the spell, you can designate up to one creature other than yourself per level to be immune to the effects. All other creatures that read the text must succeed at a Will save or find it difficult to properly parse and decipher the contents. This increases the DC of Linguistics checks to decipher the text by an amount equal to your caster level (maximum +10), and it increases the DC of the Wisdom check to avoid drawing a false conclusion by an equal amount. Unaffected creatures gain a circumstance bonus equal to your caster level (maximum +10) on Bluff checks to deceive affected creatures about the text’s contents. The spell obscures any magical glyphs, runes, or symbols within the text, increasing the Perception DC to find such traps by an amount equal to half your caster level (maximum +5). Obscured script can be made permanent with a permanency spell by a caster of 10th level or higher for the cost of 5,000 gp.","source":"Adventurer's Guide pg. 37"},{"n":"Oneiric Horror","l":2,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You cause the subject to believe it is being attacked by a creature out of its nightmares. Each round, the subject makes a full-attack action against the creature. A flying creature can still attempt a Fly check to hover. Each round on its turn after making a full attack against the imaginary creature, the subject can attempt a new saving throw to end the effect. The subject is fatigued for 1 minute after the spell ends.","source":"Occult Adventures pg. 179"},{"n":"Open Book","l":2,"school":"divination [curse]","castingTime":"1 standard action","components":"V, S, M (a page torn from a book)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"Curses the target with a -2 penalty on saves against divination spells, while granting anyone using Diplomacy to gather information about it a bonus equal to half your caster level (maximum +10).","source":"Ultimate Intrigue pg. 220"},{"n":"Oppressive Boredom","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level or until broken (see text)","save":"Will negates (see text)","sr":"yes","effect":"You fill your target with boredom. The target loses all interest in its current task and must make a Will save against the spell’s effect in order to perform its next action. If the target fails, it takes no action that round. The boredom lasts until the duration expires or the target breaks the spell’s effect with a successful Will save.","source":"Ultimate Magic pg. 230"},{"n":"Painful Revelation","l":2,"school":"abjuration [mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one ongoing illusion effect","duration":"1 hour/level or until discharged","save":"Will partial","sr":"no","effect":"Empowers an illusion you've cast so that any creature who disbelieves it and sees through it suffers 1d6 points of nonlethal damage per 2 caster levels (maximum 10d6) and is staggered for 1d4 rounds; a successful Will save halves the damage and negates the staggered condition. Creatures that automatically see through illusions (such as with true seeing) are unaffected. The spell is used up once it triggers.","source":"Inner Sea Temples pg. 63"},{"n":"Passing Fancy","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"4d4 rounds (D)","save":"Will negates","sr":"yes","effect":"Taldor’s infamous Lion Blades imported this spell from the ninja clans of Minkai, and both groups use it to great effect when maneuvering among the shallow upper classes. When you cast the spell, you dictate one specific topic or recent event and instill a magical obsession with that subject within the target. An affected creature becomes fascinated by the topic, and becomes completely focused on discussing the event with anyone nearby, possibly wandering off or distracting unaffected creatures. Passing fancy has no effect on a creature with an Intelligence of 2 or less.\n\nBecause the target talks and interacts with its usual cadence, onlookers take a –10 penalty on Sense Motive checks to notice that anything is amiss with the target’s behavior.","source":"Spymaster's Handbook pg. 29"},{"n":"Perceive Cues","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a drop of water)","range":"personal","target":"you","duration":"10 minutes/level","save":"none","sr":"no","effect":"Your senses become preternaturally keen, and you gain insight into subtle behavioral cues. For the duration of the spell, you receive a +5 competence bonus on Perception and Sense Motive checks.","source":"Advanced Player's Guide pg. 235"},{"n":"Phantasmal Affliction","l":2,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a drop of cod liver oil)","range":"close (25 ft. + 5 ft./2 levels)","target":"living creature","duration":"see text","save":"Will disbelief, then Fortitude or Will negates (see text)","sr":"yes","effect":"You cause the creature to believe she has a debilitating affliction. The target can attempt a Will save to recognize the affliction as unreal. If that save fails, the creature suffers an imaginary affliction of your choice.  Curse: The target believes she has been cursed. She takes a permanent -4 penalty on attack rolls, saves, ability checks, and skill checks for 1 hour per caster level. After her save to disbelieve, the target attempts a second Will save to negate this effect.  Poison: The target believes she has been poisoned. Choose a physical ability score. Each round for 6 rounds, plus 1 round per 5  caster levels, the target takes 1d3 points of damage to the chosen ability score. Each turn, the creature can attempt a Fortitude save to negate the damage and end the ongoing damage.  Wasting: The target believes she has contracted a wasting disease. Each day, the creature takes 1d4 points of Constitution damage and becomes fatigued. A successful Fortitude save prevents this damage. Two consecutive successful saves end the effect.  Since the affliction exists entirely in the creature's mind, phantasmal affliction is not affected by normal cures like neutralize poison or remove disease, or other effects like delay poison or the Heal skill. Ordinary immunities do not apply in this case (though a creature immune to the affliction receives a +4 bonus on the Will save to disbelieve the illusion). Constitution damage from the affliction can't kill the target. Instead, it causes the target to fall unconscious like other forms of ability damage. Phantasmal affliction is a spell effect and can be dispelled normally.  Placebo effectOA counters and dispels phantasmal affliction.","source":"Ultimate Intrigue pg. 221"},{"n":"Phantom Trap","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (special dust worth 50 gp)","range":"touch","target":"object touched","duration":"permanent (D)","save":"none","sr":"no","effect":"This spell makes a lock or other small mechanism seem to be trapped to anyone who can detect traps. You place the spell upon any small mechanism or device, such as a lock, hinge, hasp, cork, cap, or ratchet. Any character able to detect traps, or who uses any spell or device enabling trap detection, is certain a real trap exists. Of course, the effect is illusory and nothing happens if the trap is “sprung”; its primary purpose is to frighten away thieves or make them waste precious time.\n\nIf another phantom trap is active within 50 feet when the spell is cast, the casting fails.","source":"PRPG Core Rulebook"},{"n":"Pilfering Hand","l":2,"school":"evocation [force]","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one object","duration":"see text","save":"none","sr":"yes (object)","effect":"You create and control an invisible telekinetic force, manipulating it with either startling abruptness or careful deliberateness, allowing you to seize an object from an opponent or remotely manipulate an object. You can utilize this force to one of two ends.\n\nAbrupt Maneuver: You instantaneously attempt a disarm or steal combat maneuver against a target within range. Use your caster level as your Combat Maneuver Bonus, adding your Charisma modifier (bard, oracle, sorcerer), Intelligence modifier (magus, wizard), or Wisdom modifier (cleric) in place of your Strength or Dexterity modifier. This combat maneuver attempt does not provoke an attack of opportunity from its target, but casting this spell might. If you are successful, you pull the target object to you, and if you have enough hands free, you can catch it. Otherwise, the object lands in your square as if you dropped it.\n\nCareful Maneuver: You attempt a Disable Device check or a Sleight of Hand check to pick-pocket a target within range. This spell lasts as long as you need to accomplish the task, requiring your full concentration for that duration. Once you resolve the skill check, the spell ends. If you are successful on your Sleight of Hand check, you pull the target object to you as with an abrupt maneuver. The target gains a +2 bonus on its Perception check to notice the successful attempt.","source":"Ultimate Combat pg. 239"},{"n":"Placebo Effect","l":2,"school":"illusion ( phantasm ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, M (a sugar cube)","range":"touch","target":"creature touched","duration":"1 minute/level","save":"Will disbelief (harmless)","sr":"yes (harmless)","effect":"The subject temporarily ceases to feel the ill effects of a single ongoing affliction or condition from the following list: blinded, cursed, dazed, deafened, diseased, fatigued, frightened, nauseated, panicked, paralyzed, poisoned, shaken, sickened, staggered, or stunned. If that affliction or condition has a duration, it is suspended until this spell expires. If the subject has multiple instances of the same type of affliction (such as multiple diseases), a single casting of this spell can suspend only one of them. Placebo effect doesn’t remove or temporarily negate any damage that the affliction may have already caused, nor does it provide protection against receiving such conditions again.","source":"Occult Adventures pg. 180"},{"n":"Psychic Leech","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 minute/level (D)","save":"Will partial","sr":"yes","effect":"The target experiences feelings of ennui and lethargy, becoming fatigued for the spell’s duration. While the target is fatigued and is within the spell’s range, you gain a +2 enhancement bonus to Strength and Dexterity. On a successful save, the target is fatigued for only 1d4 rounds and you receive no bonus. This spell has no effect if it targets a creature that is already fatigued.","source":"Occult Origins pg. 29"},{"n":"Pyrotechnics","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (one fire source)","range":"long (400 ft. + 40 ft./level)","target":"one fire source, up to a 20-ft. cube","duration":"1d4+1 rounds, or 1d4+1 rounds after creatures leave the smoke cloud; see text","save":"Will negates or Fortitude negates; see text","sr":"yes or no; see text","effect":"Pyrotechnics turns a fire into a burst of blinding fireworks or a thick cloud of choking smoke, depending on your choice. The spell uses one fire source, which is immediately extinguished. A fire so large that it exceeds a 20-foot cube is only partly extinguished. Magical fires are not extinguished, although a fire-based creature used as a source takes 1 point of damage per caster level.\n\nFireworks: The fireworks are a flashing, fiery, momentary burst of glowing, colored aerial lights. This effect causes creatures within 120 feet of the fire source to become blinded for 1d4+1 rounds (Will negates). These creatures must have line of sight to the fire to be affected. Spell resistance can prevent blindness.\n\nSmoke Cloud: A stream of smoke billows out from the fire, forming a choking cloud that spreads 20 feet in all directions and lasts for 1 round per caster level. All sight, even darkvision, is ineffective in or through the cloud. All within the cloud take –4 penalties to Strength and Dexterity (Fortitude negates). These effects last for 1d4+1 rounds after the cloud dissipates or after the creature leaves the area of the cloud. Spell resistance does not apply.","source":"PRPG Core Rulebook pg. 328"},{"n":"Qualm","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level or until discharged","save":"Will negates","sr":"yes","effect":"The target is suddenly beset with unexplainable doubts about the effectiveness of its actions and the righteousness of its cause. The creature takes a –10 penalty on its ability checks, skill checks, and concentration checks, until the duration ends, or until it spends its entire turn doing absolutely nothing (it spends a full-round action gaining focus). Spending an entire turn doing nothing discharges the spell.","source":"Ultimate Combat pg. 241"},{"n":"Quick Change","l":2,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 hour/level","save":"none","sr":"no","effect":"If you have the change shape special quality, you can revert to your true form as a swift action. If a creature is not aware of your true form, when you use this spell to revert to your true form and attack that creature in the same round, the creature is denied its Dexterity bonus to AC against your first attack.","source":"Horror Adventures pg. 125"},{"n":"Rage","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one willing living creature per three levels, no two of which may be more than 30 ft. apart","duration":"concentration + 1 round/level (D)","save":"none","sr":"yes","effect":"Each affected creature gains
