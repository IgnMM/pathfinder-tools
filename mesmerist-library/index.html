a +2 morale bonus to Strength and Constitution, a +1 morale bonus on Will saves, and a –2 penalty to AC. The effect is otherwise identical with a barbarian's rage except that the subjects aren't fatigued at the end of the rage.","source":"PRPG Core Rulebook pg. 329"},{"n":"Reckless Infatuation","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"You fill your target with feelings of intense infatuation for a specific individual known to the target. At the time of the casting, you designate a single creature as the focus of the target’s desire. Thereafter, the target does all it can to remain within 30 feet of the object of its desire. If the target moves outside this range, it gains the staggered condition until it is again near the focus of its desire. If remaining within 30 feet of the focus of its affection would place the target in obvious physical danger, the target can attempt a second save to break the spell’s effect.\n\nReckless infatuation counters unadulterated loathing.","source":"Ultimate Magic pg. 234"},{"n":"Restoration, Lesser","l":2,"school":"conjuration (healing)","castingTime":"3 rounds","components":"V, S","range":"touch","target":"creature touched","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"Lesser restoration dispels any magical effects reducing one of the subject's ability scores or cures 1d4 points of temporary ability damage to one of the subject's ability scores. It also eliminates any fatigue suffered by the character, and improves an exhausted condition to fatigued. It does not restore permanent ability drain.","source":"PRPG Core Rulebook pg. 334"},{"n":"Rumormonger","l":2,"school":"divination","castingTime":"1 standard action","components":"V","range":"long (400 ft. + 40 ft./level)","target":"1 rumor","duration":"1 day/level (D)","save":"Will negates (see text)","sr":"yes","effect":"You utter a brief anecdote or bit of news as the verbal component of this spell and track its progress through a social gathering or other crowd. When someone who heard the rumor directly from you and repeated the rumor is within your range, they glow silver to your sight, though this glow doesn’t occur if the creature is in disguise (unless it was in the same disguise at the time of casting). You can choose to follow the rumor by selecting any such creature in range, at which point the creatures who heard the rumor from you no longer glow silver, and now the creatures who heard the rumor from your chosen creature glow silver instead. You can follow the rumor’s path until you reach a creature that heard the rumor but didn’t repeat it (or repeated it incorrectly). The glow identifies only creatures who heard the same information you conveyed. Minor cosmetic changes in the rumor don’t interrupt the chain, but when the rumor no longer resembles the information you imparted, the trail stops and the spell ends.\n\nYou can instead use this spell to trace a rumor back to its source once you hear it. In this case, you repeat the rumor as you heard it for the spell’s verbal component. The person who told you the rumor can attempt a Will save to end the effect. Failure indicates the silver glow leads to the individual that told her. This process continues each time you locate the next individual spreading the same information. Each individual attempts the save until one of them succeeds (in which case the spell ends and you can’t attempt to trace this particular rumor again) or you trace the rumor to its original source. As with the other application of the spell, tracing a rumor back fails to cause a creature to glow if it is in disguise, unless it was in the same disguise at the time of speaking the rumor.","source":"Ultimate Intrigue pg. 224"},{"n":"Scare","l":2,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a bone from an undead creature)","range":"medium (100 ft. + 10 ft./level)","target":"one living creature per three levels, no two of which can be more than 30 ft. apart","duration":"1 round/level (or 1 round on a successful save)","save":"Will partial","sr":"yes","effect":"Functions like cause fear, except that it can affect multiple creatures with fewer than 6 Hit Dice at once, rendering each frightened on a failed save (or shaken for 1 round on a success).","source":"PRPG Core Rulebook pg. 336"},{"n":"Sense Fear","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S, M/DF (a patch of fur)","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"You sense creatures within 30 feet that are currently under any fear condition (from spooked to horrified), perceiving their approximate direction and fear level; within 5 feet you pinpoint their exact location as if using blindsense.","source":"Horror Adventures pg. 127"},{"n":"Shadow Anchor","l":2,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"S","range":"touch","target":"Target: creature touched; Effect: a shadowy shadow tether","duration":"1 round/level (D); see text","save":"Will negates","sr":"yes","effect":"The target’s shadow becomes a flexible tether to its current square. The creature can move up to 5 feet from that square without penalty. Moving farther than 5 feet from the tether point requires the target to make a bull rush combat maneuver check against a CMB of 10 + 1/2 your caster level + your Intelligence modifier (if a witch or wizard) or Charisma modifier (if a bard or sorcerer). The target takes a –1 penalty for every 5 feet of distance between it and its tethered square. Failing this check means the target’s move is wasted and it cannot move farther away. If it fails this check by 10 or more, it is pulled 5 feet toward the tether square and is knocked prone. If it beats the check by 10 or more, the spell ends. This spell does not work on creatures that do not cast shadows or reflections. If the target uses a teleportation effect or leaves the current plane, the spell ends.","source":"Advanced Race Guide pg. 211"},{"n":"Shamefully Overdressed","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"creature touched","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"The target sees its own attire as hopelessly out of fashion, ostentatious, and embarrassing, and is filled with a compulsion to strip off all clothing. Each round, the target must spend a move action to remove a worn item that can be removed with a move action, dropping the item once it is removed. The target doesn’t distinguish between magical and nonmagical items when removing them. Each round it removes an item as determined randomly from the following slots: belt, body, chest, eyes, feet, hands, head, headband, shoulders, or wrists. When determining randomly, don’t include any slots if the character has no item of that sort, and don’t include items that take more than one move action to remove. Though creatures can’t have more than one magic item in any of those slots, they can have multiple mundane items that fit each slot, in which case randomly decide which one they remove. If a target is wearing clothing that doesn’t fit in any of those slots, such as breeches or a quiver, add it to the list of possibilities at the GM’s discretion.\n\nThe target regards the discarded items with revulsion, and if forced to touch such an item (such as with a melee or ranged touch attack using the item as an improvised weapon), the target becomes sickened for 1d3 rounds. Other than the move action to remove items, the character can take whatever actions it chooses.","source":"Ultimate Intrigue pg. 225"},{"n":"Share Language, Communal","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a page from a dictionary)","range":"touch","target":"creatures touched","duration":"24 hours","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions like share language, except you divide the duration in 1-hour increments among the creatures touched.","source":"Ultimate Combat pg. 243"},{"n":"Share Memory","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"touch","target":"you and one creature touched","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"You momentarily link your mind with the target and share a single memory of no longer than 1 minute. You can show the target one of your memories, show the target one of its own memories, or view one of the target’s memories.","source":"Ultimate Magic pg. 238"},{"n":"Shifted Steps","l":2,"school":"illusion (glamer) [sonic]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object up to 10 feet across","duration":"concentration + 1 round/level (D)","save":"Will negates (harmless) and Will disbelief (if interacted with); see text","sr":"no","effect":"You cause the target to sound as if it is elsewhere within range, including its movements, speech, and all other sounds. As long as you concentrate, you can cause the sound’s apparent location to change as you see fit within range from your current location. Once you cease concentrating, the sound moves so that it remains the same relative distance and direction from the target. This spell can fool any sound-based blindsense or blindsight (including echolocation), but it can’t fool other forms of detection such as other forms of blindsense or blindsight, lifesense, normal vision, and tremorsense. The target receives a saving throw against the effect if it doesn’t wish for you to shift its sound, and any creature that interacts with the illusion receives a Will save to disbelieve the glamer.","source":"Ultimate Intrigue pg. 225"},{"n":"Silence","l":2,"school":"illusion (glamer)","castingTime":"1 round","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"20-ft.-radius emanation centered on a creature, object, or point in space","duration":"1 round/level (D)","save":"Will negates; see text, or none (object)","sr":"yes; see text, or no (object)","effect":"Suppresses all sound within the emanation, blocking spellcasting that requires verbal components and rendering creatures inside immune to sonic and language-dependent effects; can be centered on a moving creature (which gets a save) or on a fixed point or object.","source":"PRPG Core Rulebook pg. 343"},{"n":"Silent Table","l":2,"school":"illusion (glamer)","castingTime":"1 round","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"5-ft.-diameter emanation centered on an object or a point in space","duration":"1 minute/level (D)","save":"none (object)","sr":"no (object)","effect":"You protect an area against casual eavesdropping. Sounds and sonic effects that originate inside the area are muffled for anyone outside the area; Perception DCs to hear or understand sounds leaving the area increase by 20, and any saving throw DCs of these effects decrease by 2. The spell does not affect sounds that enter the area or the Perception checks of creatures inside it.","source":"Advanced Class Guide pg. 192"},{"n":"Slave to Sin","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a scrap of paper inscribed with the Sihedron rune)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round/level","save":"Will negates (see below)","sr":"yes","effect":"This spell allows you to reach into an evil creature’s mind to expose and exploit its susceptibility to whichever of the seven so-called “deadly sins” it is most susceptible to. The targeted creature must succeed at a Will save or it is overwhelmed with an inability to repress urges to indulge in whatever sin most closely mirrors its personality, and a glowing rune appears upon the creature’s body (usually the brow), identifying the sin. (The GM adjudicates which rune manifests on the creature’s body, as appropriate.)\n\nEach round, at the start of its turn, the target must attempt a new Will saving throw against the spell’s DC to resist the sin’s enslavement. If the target succeeds at this saving throw, it is sickened for that round by the distractions of its sin. If it fails, it is sickened and staggered as it spends part of its action wallowing in its targeted sin (a wrathful victim might waste time spouting threats and profanity, while a slothful victim might merely be slow and hesitant, and a lustful victim could well spend precious moments ogling or fawning over something of beauty).","source":"Adventurer's Guide pg. 61"},{"n":"Steal Breath","l":2,"school":"transmutation [air]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round (see text)","save":"Fortitude negates, see text","sr":"yes","effect":"You pull the breath from a creature’s lungs, dealing damage and leaving it unable to speak, use breath weapons, or cast spells with verbal components. If the target fails its saving throw, it takes 2d6 points of damage, and it cannot speak, use breath weapons, or anything else requiring breathing, and a visible line of swirling air leaves the target’s mouth and enters your mouth.\n\nIf, during the duration, the target moves out of range or line of effect to you, the spell immediately ends. This spell has no effect on creatures that do not need to breathe air.","source":"Advanced Race Guide pg. 95"},{"n":"Steal Voice","l":2,"school":"necromancy","castingTime":"1 standard action","components":"V","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"permanent (D)","save":"Fortitude negates","sr":"yes","effect":"The target’s throat constricts, giving it the caster croak spellblight (see Ultimate Magic).","source":"Ultimate Magic pg. 240"},{"n":"Stricken Heart","l":2,"school":"necromancy [death]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"instantaneous","save":"none","sr":"yes","effect":"This spell covers your hand with a writhing black aura. As part of casting the spell, you can make a melee touch attack that deals 2d6 points of negative energy damage and causes the target to be staggered for 1 round. If the attack is a critical hit, the target is staggered for 1 minute instead. Creatures immune to precision damage are immune to the staggered effect.","source":"Advanced Class Guide pg. 194"},{"n":"Suggestion","l":2,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, M (a snake's tongue and a honeycomb)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 hour/level or until completed","save":"Will negates","sr":"yes","effect":"You influence the actions of the target creature by suggesting a course of activity (limited to a sentence or two). The suggestion must be worded in such a manner as to make the activity sound reasonable. Asking the creature to do some obviously harmful act automatically negates the effect of the spell.\n\nThe suggested course of activity can continue for the entire duration. If the suggested activity can be completed in a shorter time, the spell ends when the subject finishes what it was asked to do. You can instead specify conditions that will trigger a special activity during the duration. If the condition is not met before the spell duration expires, the activity is not performed.\n\nA very reasonable suggestion causes the save to be made with a penalty (such as –1 or –2).","source":"PRPG Core Rulebook pg. 350"},{"n":"Suppress Charms and Compulsions","l":2,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature plus one additional creature per 4 levels, no two of which can be more than 30 ft. apart","duration":"10 minutes or concentration (up to 1 round/level); see text","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You bolster the subject’s sense of willpower and self-worth when you cast this spell. As you cast it, you must decide if you want to grant a bonus to saving throws against charms and compulsions or suppress charms and compulsions.\n\nIf you grant a bonus to saving throws, you grant all affected creatures a +4 morale bonus on saving throws against charm and compulsion effects for 10 minutes.\n\nIf instead you suppress charms and compulsions, the spell’s duration drops to concentration, to a maximum duration of 1 round per level. As long as you continue to concentrate, the spell suppresses all existing charm and compulsion effects affecting the targets, regardless of whether the effect is beneficial or harmful. New charm or compulsion effects that successfully target such a protected creature are automatically suppressed as long as you continue concentrating. If you cease concentrating, the spell effect immediately ends, and remaining charm or compulsion effects resume for the rest of their remaining durations as normal.","source":"Adventurer's Guide pg. 77, Andoran, Spirit of Liberty pg. 27"},{"n":"Symbol of Mirroring","l":2,"school":"illusion (figment)","castingTime":"10 minutes","components":"V, S, M (mercury and phosphorous, plus powdered diamond and opal worth a total of 100 gp)","range":"0 ft.; see text","target":"one symbol","duration":"see text","save":"Will partial (harmless)","sr":"yes","effect":"This spell functions as symbol of death, except it instead creates one illusory duplicate of each creature within 60 feet of the symbol. These duplicates function as mirror image, moving with the original creatures and mimicking their movements, sounds, and actions exactly. If an illusory double is destroyed, a new one appears on the creature's turn. The images last for as long as a creature remains within 60 feet of the symbol, and for 1 round/level thereafter. Once triggered, the symbol remains active for 10 minutes per caster level.  Symbol of mirroring can be made permanent with a permanency spell by a caster of 10th level or higher for the cost of 5,000 gp.","source":"Ultimate Magic pg. 241"},{"n":"Sympathetic Aura","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, F (a small square of silk that must be passed over the object that recieves the aura)","range":"touch","target":"one touched object weighing up to 5 lbs./level","duration":"1 day/level (D)","save":"none (see text)","sr":"no","effect":"This spell functions like magic aura, except it extends its altered aura to similar items in a 5-foot radius. For this purpose, similar items must be alike in approximate shape, composition, and function, so a potion of cure light wounds targeted by this spell to appear nonmagical would also obscure the auras of nearby potions, elixirs, and oils, as well as flasks. Items other than the targeted item retain their altered aura for 1 round per caster level after being removed from the spell’s area.","source":"Adventurer's Guide pg. 37"},{"n":"Tongues","l":2,"school":"divination","castingTime":"1 standard action","components":"V, M/DF (a clay model of a ziggurat)","range":"touch","target":"creature touched","duration":"10 min./level","save":"Will negates (harmless)","sr":"no","effect":"This spell grants the creature touched the ability to speak and understand the language of any intelligent creature, whether it is a racial tongue or a regional dialect. The subject can speak only one language at a time, although it may be able to understand several languages. Tongues does not enable the subject to speak with creatures who don't speak. The subject can make itself understood as far as its voice carries. This spell does not predispose any creature addressed toward the subject in any way.\nTongues can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 360"},{"n":"Touch of Idiocy","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"living creature touched","duration":"10 min./level","save":"no","sr":"yes","effect":"With a touch, you reduce the target's mental faculties. Your successful melee touch attack applies a 1d6 penalty to the target's Intelligence, Wisdom, and Charisma scores. This penalty can't reduce any of these scores below 1.\n\nThis spell's effect may make it impossible for the target to cast some or all of its spells, if the requisite ability score drops below the minimum required to cast spells of that level.","source":"PRPG Core Rulebook pg. 360"},{"n":"Twilight Haze","l":2,"school":"illusion (shadow) [darkness, shadow]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"fog spreads in 20-ft. radius","duration":"1 round/level","save":"none","sr":"no","effect":"You create a gray haze that obscures sight (as fog cloud) and causes the illumination level within it to dim by one step (as per darkness). Since this spell produces an illusion rather than a true physical fog, it is unaffected by wind and can be cast underwater.","source":"Advanced Class Guide pg. 197"},{"n":"Unadulterated Loathing","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"Designates a creature as an object of revulsion for the target; the target must stay at least 60 feet from that creature or become nauseated. If maintaining that distance would expose the target to obvious physical danger, it may attempt another save to end the spell early.","source":"Ultimate Magic pg. 244"},{"n":"Unliving Rage","l":2,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"Medium (100 ft. + 10 ft./level)","target":"One willing undead creature per 3 levels, no two of which can be more than 30 ft. apart","duration":"Concentration + 1 round/level (D)","save":"None","sr":"Yes","effect":"This spell functions as rage, except it affects only undead creatures and bolsters them with necromantic energy rather than emotion. Each affected creature gains a +2 profane bonus to Strength and Charisma, a +1 profane bonus on Will saves, and a -2 penalty to AC. The effect is otherwise identical to a barbarian's rage.","source":"Advanced Class Guide"},{"n":"Unsettling Presence","l":2,"school":"necromancy (haunted) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one 5-ft. cube/level (S)","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"Those in this spell’s area who fail their Will saving throws harbor a faint sense of paranoia and evoke the same feeling in others for the duration of the spell. Domesticated animals (not including familiars and animal companions) don’t willingly approach affected creatures unless the animal’s master succeeds at a DC 25 Handle Animal, Ride, or wild empathy check. Affected creatures take a –4 penalty on Handle Animal, Ride, and wild empathy checks against familiars, animal companions, animal cohorts, and other permanent companions provided by class abilities for the spell’s duration. Anyone an affected creature interacts with must succeed at a Will save or have its initial attitude automatically worsened by one step for the spell’s duration. Every time an affected creature attempts a Sense Motive check to get a hunch or detect a Bluff from another creature (or vice versa), it must succeed at a Will save or automatically assume the other party is lying or otherwise harbors ill will against it. Each time this spell causes an affected creature (or someone interacting with the affected creature) to attempt a Will saving throw, the spell’s hauntlike manifestation occurs.\n\nHaunt Statistics\nNotice Perception DC DC 20 (to feel a sudden sense of dread, or to hear victims’ names whispered behind their backs)\nhp 2 hp/level; Trigger proximity; Reset none","source":"Haunted Heroes Handbook pg. 29"},{"n":"Violent Accident","l":2,"school":"Transmutation [curse]","castingTime":"1 standard action","components":"V, S","range":"Long (400 ft. + 40 ft./level)","target":"One creature","duration":"1 day or until discharged","save":"Reflex half; see text","sr":"Yes","effect":"You curse the target to suffer a violent accident within the next 24 hours. You have no control over the form the accident takes or when it strikes. The target can avoid being cursed with spell resistance when you cast the spell, but otherwise receives no saving throw. Regardless of the accident's nature, it is magically empowered to deal an amount of damage equal to 1d8 × your caster level (maximum 5d8 points of damage), and the damage is of a type appropriate to the source of damage (such as fire for an explosion or bludgeoning for a falling object). When the accident occurs, the target can attempt a Reflex saving throw to reduce the damage by half. Although others might be surprised or inconvenienced by the accident, it damages only the target.","source":"Inner Sea Intrigue"},{"n":"Voluminous Vocabulary","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a quill)","range":"touch","target":"creature touched","duration":"8 hours (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You choose any language (except for secret languages, such as Druidic). The target gains the ability to speak, understand, read, and write that language. When you cast this spell, you can attempt a DC 15 Linguistics check. If you succeed, choose an additional language, plus one more language for every 10 by which your check result exceeded the DC.\nWritten material can be read at the rate of one page (250 words) per minute. As with comprehend languages, this spell doesn’t impart insight into material the target read, just the literal meaning, and it doesn’t allow the target to read magical writing or decipher codes.\nIf the target lacks the mental capacity to grasp a language, it still gains enough knowledge to respond to and carry out even extremely complex commands or suggestions coached in the language (whether written or spoken). However, since this spell endows the target merely with a temporarily enhanced vocabulary, the person offering instructions to nonsentient creatures must take care to avoid metaphors or any other ambiguity.","source":"Ultimate Intrigue pg. 229"},{"n":"Wartrain Mount","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 minute","components":"V, S, M (a swatch of black cloth)","range":"close (25 ft. + 5 ft./2 levels)","target":"one indifferent or friendly animal","duration":"1 hour/level","save":"none","sr":"yes","effect":"Grants the target animal combat training as its general purpose, overriding its previous trained purpose and known tricks; when the spell ends, the animal reverts to its former purpose and tricks.","source":"Ultimate Magic pg. 248"},{"n":"Whispering Wind","l":2,"school":"transmutation [air]","castingTime":"1 standard action","components":"V, S","range":"1 mile/level","target":"10-ft.-radius spread","duration":"no more than 1 hour/level or until discharged (destination is reached)","save":"none","sr":"no","effect":"You send a message or sound on the wind to a designated spot. The whispering wind travels to a specific location within range that is familiar to you, provided that it can find a way to the location. A whispering wind is as gentle and unnoticed as a zephyr until it reaches the location. It then delivers its whisper-quiet message or other sound. Note that the message is delivered regardless of whether anyone is present to hear it. The wind then dissipates.\n\nYou can prepare the spell to bear a message of no more than 25 words, cause the spell to deliver other sounds for 1 round, or merely have the whispering wind seem to be a faint stirring of the air. You can likewise cause the whispering wind to move as slowly as 1 mile per hour or as quickly as 1 mile per 10 minutes.\n\nWhen the spell reaches its objective, it swirls and remains in place until the message is delivered. As with magic mouth, whispering wind cannot speak verbal components, use command words, or activate magical effects.","source":"PRPG Core Rulebook pg. 369"},{"n":"Adjustable Disguise","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"This spell functions as disguise self, except as a swift action you can alter the disguise (within the limitations of disguise self). For example, you could make yourself look like a young human city guard, then an old elven wizard of the opposite gender, then a halfling thief, and so on. You can change the disguise a number of times equal to your caster level.","source":"Advanced Class Guide pg. 172"},{"n":"Agonizing Rebuke","l":3,"school":"illusion (phantasm) [emotion, mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"The target grows apprehensive about harming you; whenever it attacks you, targets you with a harmful spell, or otherwise takes an action meant to harm you, it suffers 2d6 points of nonlethal damage.","source":"Advanced Race Guide pg. 126"},{"n":"Analyze Aura","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object","duration":"concentration, up to 1 round/level","save":"none","sr":"no","effect":"You peer into the aura of one target creature or object, gaining valuable information about its condition and nature. Each round, choose one of the target’s four auras. This spell functions similarly to the read aura occult skill unlock (see page 197), but doesn’t require checks and returns results on all the target’s auras in an instant. Alignment Aura : You study the target’s spiritual nature to determine its alignment. You also learn the type and power of its alignment aura, as detect evil . Emotion Aura : The colors playing within the target’s aura reveal its emotional state, granting valuable insight into its psyche. You learn a general summary of the target’s current disposition, as well as its attitude toward any other creatures within 30 feet of it. For the duration of the spell and for 1 hour afterward, you gain a +2 circumstance bonus on Bluff, Diplomacy, Intimidate, and Sense Motive checks you attempt against the target. Objects do not have emotion auras, except intelligent weapons and similar sentient oddities. Health Aura : The flow of vital force animating the target becomes plainly visible, giving you insight into its physical condition. You know whether the target is unharmed or wounded, whether it is poisoned or diseased, and whether it is under any of the following conditions: confused, disabled, dying, nauseated, panicked, staggered, stunned, or unconscious. Further, your insight into the overall strength of the target’s vital force reveals the total number of points available in its ki pool, grit pool, or similar resource. Objects and most undead creatures don’t have health auras. Magic Aura : You determine the number and power of all magical auras on the target (as detect magic to determine a magic aura’s power), as well as the school of each aura. You can attempt Knowledge (arcana) or Spellcraft skill checks to determine the school or identify properties of a magic item, as normal. If cast on an item, analyze aura cuts through the obfuscation of the magic aura spell.","source":"Occult Adventures pg. 156"},{"n":"Appearance of Life","l":3,"school":"Illusion (glamer) [evil]","castingTime":"1 round","components":"V, S, M (one Tiny or larger living creature)","range":"Long (400 ft. + 40 ft./level)","target":"One or more undead creatures","duration":"10 minutes/level (D)","save":"Will disbelief or Will negates (see text)","sr":"No","effect":"The illusion makes undead creatures of Medium size or smaller appear as if they were living humanoid creatures. You can target a number of undead creatures whose total number of Hit Dice is no greater than twice your caster level. When you create the illusion, you choose the races, genders, and attire for the undead creatures. Additionally, the illusion makes the undead creatures' movements appear lifelike (two shuffling zombies could be made to appear as two strolling lovers). The illusion doesn't create smell, sound, texture, or temperature. Undead with Intelligence scores can attempt a saving throw to negate the effect of the spell, but mindless undead do not. Any creatures interacting with the illusion receive a saving throw to disbelieve the illusion.\n\nThe illusion interferes with detect undead, requiring the caster to succeed at a caster check (DC = 11 + your caster level) for the spell to determine the creatures are undead.\n\nAppearance of life can be made permanent with a permanency spell by a caster of 12th level or higher for the cost of 10,000 gp.","source":"Horror Adventures"},{"n":"Apport Animal","l":3,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V","range":"touch","target":"one touched animal of Tiny or smaller size","duration":"instantaneous or 1 hour/level","save":"Will negates (object)","sr":"yes (object)","effect":"This spell functions like apport object except the target is an animal. Only normal, nonmagical creatures of the animal type can be teleported.","source":"Occult Adventures pg. 157"},{"n":"Assume Appearance","l":3,"school":"transmutation (polymorph)","castingTime":"1 minute","components":"V, S, F (corpse of the deceased creature whose form you plan to assume)","range":"personal","target":"you","duration":"1 day/level (D)","save":"none","sr":"no","effect":"This spell functions similarly to alter self, except for the following differences. You assume the exact form of a deceased Small or Medium creature of the humanoid type. Your voice changes to match that of the form you assume. The creature whose form you assume must be dead and you must have access to its fresh corpse (either dead less than 24 hours, or preserved via gentle repose or similar effect). Any attempt to copy the form of a living creature causes the spell to fail. You do not have access to the assumed form’s abilities, memories, mannerisms, or speech patterns. The spell grants a +10 bonus on Disguise checks to appear as the imitated creature.\nIf the assumed creature is returned to life while this spell is active, assume appearance immediately ends.","source":"Horror Adventures pg. 108"},{"n":"Audiovisual Hallucination","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration + 3 rounds (D)","save":"Will disbelief","sr":"yes","effect":"This spell functions as auditory hallucination, except that you can include the image of any object, creature, or force you imagine or identify for the targets to imagine. You can move the image while you concentrate. After you cease concentration, you can define simple movements or changes for the phantasm to perform that can be explained in 25 words or fewer.\n\nThe image disappears when struck by an opponent unless you cause the illusion to react appropriately or instruct it to do so. Its AC is equal to 10 + the level of this spell.","source":"Ultimate Intrigue pg. 204"},{"n":"Aura Alteration","l":3,"school":"illusion","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one object or willing creature","duration":"1 day/level (D)","save":"Will negates (harmless, object)","sr":"yes","effect":"You mask and manipulate the target creature’s or object’s aura, confounding those who would attempt to discern helpful information from it using the read aura occult skill unlock (see page 197) or the analyze aura spell. You can change each of the following four auras with one casting of aura alteration . Alignment Aura : You can change the target’s apparent alignment to thwart spells that detect alignment, such as detect evil . You can alter the alignment by up to one step on each alignment axis, but can’t make the creature appear to have a diametrically opposed alignment. For instance, you couldn’t make a lawful evil character appear to be chaotic or good. You can also adjust the power of the alignment aura up or down in level by a number of steps equal to 1/2 your level or fewer. Emotion Aura : Your manipulations mask the true emotions of the target, instead depicting any combination of colors on the emotional spectrum that you wish. Creatures attempting Bluff, Diplomacy, Intimidate, or Sense Motive checks against the target receive no bonuses on their checks based on information gleaned from the target’s aura. Health Aura : You adulterate the target’s aura to mask the condition of its physical body, revealing instead a wounded status, poison or disease status, and conditions of your choice. You likewise mask the target’s available ki points or similar resources, manipulating its aura to suggest any number within the range normally available to the target. Magic Aura : You alter a creature or item’s magic aura so that it registers to detect magic (and spells with similar capabilities, like analyze aura ) as though it were nonmagical, a magic item of a kind you specify, or the subject of a spell you specify. A single casting of aura alteration is sufficient to mask all of the magic auras on the target. If an object bearing aura alteration has identify cast on it or is similarly examined, the examiner recognizes the aura is false and detects the object’s actual qualities if he succeeds at a Will save. If a targeted item’s own aura is overwhelming, aura alteration can’t alter it.","source":"Occult Adventures pg. 157"},{"n":"Aura of the Unremarkable","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a white feather)","range":"30 ft.","target":"non-allied creatured within a 30-ft. emanation","duration":"1 minute/level (D) and instantaneous","save":"Will negates","sr":"yes","effect":"An invisible sphere of magic surrounds you, clouding the minds of creatures in the area so they regard even the strangest actions as innocuous. For example, if you and your allies are beating a member of the city guard for information, creatures within the area don’t think this is unusual or cause for alarm; if your ally is aiming a crossbow at the queen from a balcony, the affected creatures accept this as normal and unworthy of concern. Any hostile actions by you or your allies against a creature or its allies break the effect of the spell for that creature. When the spell ends (or when the affected creatures move outside of the range of the emanation), observers see things normally but altered perceptions from the earlier events remain. Each mention of the events as noteworthy (such as being questioned about them by an authority figure) allows the target another Will save to break the effect and remember things normally.","source":"Ultimate Intrigue pg. 204, Cheliax, Empire of Devils pg. 22"},{"n":"Aura Sight","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level (D)","save":"none","sr":"no","effect":"This spell makes your eyes glow and allows you to see alignment auras within 120 feet of you. The effect is similar to that of a detect chaos/evil/good/law spell, but aura sight does not require concentration, and it discerns an aura’s location and power more quickly.\nYou know the location and power of all chaotic, evil, good, and lawful auras within your sight. An aura’s power depends on a creature’s Hit Dice or an item’s caster level, as noted in the description of the detect evil spell. If an item or a creature bearing an aura is in line of sight, you can attempt a Knowledge (religion) check to determine the aura’s strength (one check per aura; DC 15 + spell level, or 15 + 1/2 caster level for a non-spell effect).\nAura sight can be made permanent with a permanency spell by a caster of 11th level or higher at a cost of 7,500 gp.","source":"Advanced Class Guide pg. 174"},{"n":"Bereave","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a broken chain link)","range":"medium (100 ft. + 10 ft./level)","target":"all creatures in a 15-ft.-radius burst","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"An overwhelming feeling of loss overcomes the targets, and their allies’ words sound bleak and hollow. Regardless of actual allegiances, affected creatures no longer count as allies for other creatures and always count as enemies for the purposes of abilities, effects, and spells that differentiate between allies and enemies, such as flanking or spells such as bane or bless. Allies of an affected creature must succeed at a melee touch attack to affect the subject with touch spells, and an affected creature cannot voluntarily fail a saving throw even if the effect is harmless (such as cure light wounds). An affected creature still counts as her own ally and can target herself with abilities, effects, and spells normally.","source":"Inner Sea Temples pg. 13"},{"n":"Bestow Curse","l":3,"school":"necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"permanent","save":"Will negates","sr":"yes","effect":"Curses the touched creature with one of: a -6 penalty (minimum 1) to one ability score, a -4 penalty on attack rolls, saves, and checks, or a 50% chance each round of either acting normally or taking no action at all; the GM may allow a custom curse of similar power instead. The curse resists dispel magic but can be lifted by break enchantment, limited wish, miracle, remove curse, or wish; this spell opposes and can end an existing remove curse effect on the same target.","source":"PRPG Core Rulebook pg. 247"},{"n":"Bleed Glory","l":3,"school":"Necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One mythic creature","duration":"1 minute/level","save":"Will negates","sr":"Yes","effect":"The mythic power cost for all path abilities, feats, spells, and other effects used by the target increases by 1.","source":"Mythic Adventures"},{"n":"Calamitous Flailing","l":3,"school":"necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level (D)","save":"Will negates","sr":"yes","effect":"You cause the victim’s attacks to careen wildly, endangering itself and those around it. Your target gains a 25% miss chance on all attack rolls. If an attack misses due to this magical effect, the victim instead targets an ally, or else itself if there are no allies within range of the original attack. Apply the attack roll for the original attack to the new target’s Armor Class to determine if this attack hits. This is a curse effect.","source":"Blood of the Coven pg. 20"},{"n":"Charm Monster","l":3,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"This spell functions like charm person, except that the effect is not restricted by creature type or size.","source":"PRPG Core Rulebook pg. 254"},{"n":"Clairaudience/Clairvoyance","l":3,"school":"divination (scrying)","castingTime":"10 minutes","components":"V, S, F/DF (a small horn or a glass eye)","range":"long (400 ft. + 40 ft./level)","target":"magical sensor","duration":"1 min./level (D)","save":"none","sr":"no","effect":"Clairaudience/clairvoyance creates an invisible magical sensor at a specific location that enables you to hear or see (your choice) almost as if you were there. You don't need line of sight or line of effect, but the locale must be known—a place familiar to you, or an obvious one. Once you have selected the locale, the sensor doesn't move, but you can rotate it in all directions to view the area as desired. Unlike other scrying spells, this spell does not allow magically or supernaturally enhanced senses to work through it. If the chosen locale is magically dark, you see nothing. If it is naturally pitch black, you can see in a 10-foot radius around the center of the spell's effect. Clairaudience/clairvoyance functions only on the plane of existence you are currently occupying.","source":"PRPG Core Rulebook pg. 255"},{"n":"Conditional Curse","l":3,"school":"necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"permanent; see text","save":"Will negates","sr":"yes","effect":"Functions as bestow curse, but you must specify a condition (achievable within a year and a day without requiring self-harm, statable in 25 words or fewer) under which the curse automatically ends; the target instantly understands the condition regardless of language. The curse is harder to lift than a normal bestow curse: the DC to remove it with break enchantment or remove curse is increased by 5.","source":"Ultimate Intrigue pg. 206"},{"n":"Confusion","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (three nutshells)","range":"medium (100 ft. + 10 ft./level)","target":"all creatures in a 15-ft.-radius burst","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"This spell causes confusion in the targets, making them unable to determine their actions. Roll on the following table at the start of each subject's turn each round to see what it does in that round.\n\nd%Behavior01-25Act normally26-50Do nothing but babble incoherently51-75Deal 1d8 points of damage + Str modifier to self with item in hand76-100Attack nearest creature (for this purpose, a familiar counts as part of the subject's self)\nA confused character who can't carry out the indicated action does nothing but babble incoherently. Attackers are not at any special advantage when attacking a confused character. Any confused character who is attacked automatically attacks its attackers on its next turn, as long as it is still confused when its turn comes. Note that a confused character will not make attacks of opportunity against any creature that it is not already devoted to attacking (either because of its most recent action or because it has just been attacked).","source":"PRPG Core Rulebook pg. 258"},{"n":"Control Summoned Creature","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one summoned creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You seize control of a summoned creature by disrupting the bond between it and the caster who summoned it. If the creature fails its save, you may command it as if you had summoned it. The original caster can attempt to regain control of the creature as a standard action by making an opposed Spellcraft check against you. When your spell ends, control reverts to the original summoner. If the summoning spell ends before this spell ends, the remaining duration of this spell is lost.","source":"Ultimate Magic pg. 212"},{"n":"Crushing Despair","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M","range":"30 ft.","target":"cone-shaped burst","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"An invisible cone of despair causes great sadness in the subjects. Each affected creature takes a –2 penalty on attack rolls, saving throws, ability checks, skill checks, and weapon damage rolls.\n\nCrushing despair counters and dispels good hope.","source":"PRPG Core Rulebook pg. 262"},{"n":"Cup of Dust","l":3,"school":"transmutation [curse]","castingTime":"1 standard action","components":"V, S, M (a pinch of dust)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level (D)","save":"Fortitude negates","sr":"yes","effect":"You curse the target with a thirst no drink can quench. On a failed saving throw, the target begins to dehydrate. The effects of this spell cannot inflict more nonlethal damage than the target has hit points. No amount of drinking can counter this effect, although the target still experiences the other normal effects of any liquid imbibed (such as poisons or potions). Cup of dust can be removed with a break enchantment, limited wish, miracle, remove curse, or wish spell, but effects suffered as a result of dehydration must be healed by normal means.","source":"Advanced Player's Guide pg. 214"},{"n":"Curse of Disgust","l":3,"school":"enchantment (compulsion) [curse, emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"You place a curse upon a creature, causing it to avoid the sight of a specific trigger, which is a kind of creature, object, or condition designated by you. When the target is within 30 feet of a trigger and is aware of the trigger, it gains the sickened condition and feels an urge to leave. A successful Will save negates the urge to leave, but the sickened condition persists as long as the target is within 30 feet of a trigger and aware of it. Example triggers include beggars, filthy clothing, diseased creatures, the king, blood, spiders, rats, corpses, and sewage.","source":"Ultimate Magic pg. 215"},{"n":"Curse of Magic Negation","l":3,"school":"Abjuration [curse]","castingTime":"1 round","components":"V, S, M (powdered lead and platinum worth 250 gp)","range":"Medium (100 ft. + 10 ft./level)","target":"One creature","duration":"10 minute/level","save":"Will negates","sr":"No","effect":"You disrupt the target creature's ability to draw upon magical energies. For the duration of the spell, it gains the negated spellblight (see page 97). Dispel checks to remove the spellblight take a -5 penalty due to this spell's interference with magical energies.","source":"Ultimate Magic"},{"n":"Deep Slumber","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S, M (fine sand, rose petals, or a live cricket)","range":"close (25 ft. + 5 ft./2 levels)","target":"one or more living creatures within a 10-ft.-radius burst","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"This spell functions like sleep, except that it affects 10 HD of targets.","source":"PRPG Core Rulebook pg. 265"},{"n":"Demanding Message","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, F (a piece of copper wire)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level","duration":"10 minutes/level, then 1 hour/level or until completed (D); see text","save":"Will negates (see text)","sr":"yes; see text","effect":"This spell initially functions as message (allowing no save or spell resistance). Once during the message effect, you can concentrate as a standard action to issue a suggestion to one target as part of delivering a message. Spell resistance and a Will save apply to the suggestion, and it lasts for 1 hour per level or until completed.","source":"Ultimate Intrigue pg. 210"},{"n":"Detect Desires","l":3,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, F/DF (a medallion)","range":"60 ft.","target":"cone-shaped emanation","duration":"concentration, up to 1 minute/level (D)","save":"Will negates (see text)","sr":"no","effect":"Senses the significant desires of creatures with Intelligence 1 or higher (conscious or not) in the cone; the second round reveals each mind's Charisma score, and if the highest present is 26 or higher and beats yours by 10 or more, you're stunned for 1 round and the spell ends. The third round reveals the single most pressing desire of any mind present (Will negates this reading). Offering to fulfill a known desire grants a +2 (or greater) circumstance bonus on Diplomacy checks against that creature.","source":"Ultimate Intrigue pg. 211"},{"n":"Dispel Magic","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one spellcaster, creature, or object","duration":"instantaneous","save":"none","sr":"no","effect":"Ends one ongoing magical effect on the target by making a dispel check (1d20 + your caster level) against DC 11 + the target spell's caster level, attempting the highest-level effect first unless you specify otherwise; can also suppress a magic item's properties for 1d4 rounds, or be used as a counterspell requiring a dispel check against the opposing caster. Instantaneous-duration effects and certain protected effects cannot be dispelled.","source":"PRPG Core Rulebook pg. 272"},{"n":"Displacement","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, M (a small loop of leather)","range":"touch","target":"creature touched","duration":"1 round/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject of this spell appears to be about 2 feet away from its true location. The creature benefits from a 50% miss chance as if it had total concealment. Unlike actual total concealment, displacement does not prevent enemies from targeting the creature normally. True seeing reveals its true location and negates the miss chance.","source":"PRPG Core Rulebook pg. 273"},{"n":"Dominate Animal","l":3,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one animal","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"This spell allows you to enchant the targeted animal and direct it with simple commands such as “Attack,” “Run,” and “Fetch.” Suicidal or self-destructive commands (including an order to attack a creature two or more size categories larger than the dominated animal) are simply ignored.\n\nDominate animal establishes a mental link between you and the subject creature. The animal can be directed by silent mental command as long as it remains in range. You need not see the creature to control it. You do not receive direct sensory input from the creature, but you know what it is experiencing. Because you are directing the animal with your own intelligence, it may be able to undertake actions normally beyond its own comprehension. You need not concentrate exclusively on controlling the creature unless you are trying to direct it to do something it normally couldn't do. Changing your instructions or giving a dominated creature a new command is the equivalent of redirecting a spell, so it is a move action.","source":"Core Rulebook pg. 273"},{"n":"Draconic Malice","l":3,"school":"enchantment [draconic]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"Will negates (harmless)","sr":"no","effect":"Surrounds you with a 10-foot aura of draconic dread; creatures within lose any immunity to fear and mind-affecting effects when confronted by fear effects from your spells, spell-like abilities, and supernatural abilities, as well as your Intimidate checks to demoralize. If you possess an antipaladin's aura of cowardice, this spell strengthens its penalty to -6 instead of the normal amount.","source":"Legacy of Dragons pg. 29"},{"n":"Dreadscape","l":3,"school":"illusion (phantasm) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a pinch of black sand)","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one creature/level, no two of which can be more than 30 feet apart","duration":"10 minutes/level","save":"Will negates","sr":"yes","effect":"Your targets see their surroundings as a nightmarish reflection of the world around them. Buildings and furnishings take on a dirty, ruined appearance. Even allies appear foreign and hostile, with friendly speech turning into garbled mockery and threats. Each target gains the scared condition and has a hostile attitude toward any new creature it encounters (though not toward creatures that were already present at the time of the casting). Being hostile doesn’t necessarily mean the target will attack, and creatures can attempt Diplomacy checks to gain a target’s trust at the normal DC. If a creature becomes frightened or panicked while under the influence of dreadscape, that creature takes 1d6 points of Wisdom damage, though only once per casting of dreadscape.\n\nIf your campaign uses the sanity system (see page 12), creatures that become frightened or panicked take 2d6 sanity damage instead of Wisdom damage.","source":"Horror Adventures pg. 116"},{"n":"Dream Dalliance","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"instantaneous","save":"Will disbelief, then Will partial (see text)","sr":"yes","effect":"You create a comforting phantasm, which leeches onto the psyche of a nearby target. The creature can attempt a Will saving throw to prevent the phantasm from entering its psyche, but otherwise it takes up permanent residence in the creature’s mind. The phantasm fills its target’s dreams with happy visions, comforting manifestations of loved ones, and incredible vistas, feeding the target a perfect fantasy life it never wishes to leave. After the target’s next night’s sleep, the target must succeed at a Will saving throw to wake up; otherwise, it remains asleep for the rest of the day and following night. Each night it must succeed at a new saving throw or remain asleep for days or weeks on end as it slowly starves to death (presuming it normally needs to eat to survive). Loud noises, jostling, and even pain won’t rouse the slumbering target. Dealing 1 point of damage per the target’s Hit Die awakens the target, but it awakens fatigued and takes a –2 penalty on all saving throws against spells and effects that may put it back to sleep until the phantasm has been banished.\n\nThe phantasm remains in its host’s mind indefinitely, requiring a new Will saving throw to wake up every time the target rests, until it is removed via break enchantment, greater restoration, or miracle. Alternatively, the phantasm can be confronted in its host’s mindscape (Pathfinder RPG Occult Adventures 202), where it manifests as a slothful duplicate of its host with identical abilities, skills, and attributes.","source":"Agents of Evil"},{"n":"Elemental Speech","l":3,"school":"divination [air, earth, fire, or water]","castingTime":"1 standard action","components":"V, S, M (iron filings)","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"This spell enables you to converse with creatures associated with a chosen element, including but not limited to true elemental creatures. This spell gains the elemental subtype based on the version of the spell you cast. Elemental speech does not guarantee a friendly reaction; it merely enables communication. You may converse with all creatures of the selected type with an Intelligence score of 1 or greater, even if they do not understand one another.\n\nWhen cast as an air spell, you can converse in Auran and with any creature that has the air subtype or a fly speed.\n\nWhen cast as an earth spell, you can converse in Terran and with any creature that has the earth subtype or a burrow speed.\n\nWhen cast as a fire spell, you can converse in Ignan and with any creature that has the fire subtype.\n\nWhen cast as a water spell, you can converse in Aquan and with any creature that has the water subtype or a swim speed.","source":"Advanced Player's Guide pg. 218"},{"n":"Enchantment Foil","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 hour/level (see text)","save":"none","sr":"no","effect":"You gain a +4 bonus on saving throws against enchantment effects. If you succeed at a save against an enchantment effect, you identify the effect as if you had succeeded at a Spellcraft check to do so. Furthermore, you can choose to act as if you had failed your saving throw. If you do so, you gain a +20 bonus on Bluff checks to convince others that you failed your save and are under the enchantment’s effects. A creature that attempts to use magic to detect this ruse or to make you speak truthfully about it must succeed at a caster level check (DC 15 + your caster level) to do so.","source":"Advanced Class Guide pg. 180"},{"n":"False Future","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (crushed jade worth 100 gp)","range":"touch","target":"creature or object touched","duration":"1 hour/level (D)","save":"Will negates or Will disbelief (see text)","sr":"yes","effect":"You interfere with attempts to predict the target’s future by preventing divinations from revealing what the target will do and what will befall the target while under the spell’s effects. Instead of the target’s true actions or experiences, divinations resolve as if the target will experience some different future you describe as you cast false future. The target creature can attempt a Will save to avoid the initial effect, and creatures using divinations get a Will save to disbelieve the illusion. This spell doesn’t prevent divinations cast after the duration’s end from determining what the subject actually did during the time you obscured using false future.\n\nFalse future can’t be detected by detect magic or identify, but greater detect magic can detect it.","source":"Ultimate Intrigue pg. 214"},{"n":"False Life, Greater","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a drop of blood)","range":"personal","target":"you","duration":"1 hour/level or until discharged; see text","save":"none","sr":"no","effect":"This spell functions as false life, except you gain temporary hit points equal to 2d10 + 1 point per caster level (maximum +20). The effects of this spell do not stack with those of false life.","source":"Ultimate Magic pg. 219"},{"n":"Fear","l":3,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (the heart of a hen or a white feather)","range":"30 ft.","target":"cone-shaped burst","duration":"1 round/level or 1 round; see text","save":"Will partial","sr":"yes","effect":"Fills a cone with unseen terror. Living creatures in the area that fail a Will save become panicked for the duration, and cower if cornered while panicked; a successful save instead leaves the creature shaken for 1 round.","source":"PRPG Core Rulebook pg. 281"},{"n":"Fearsome Duplicate","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"monstrously distorted duplicate of you","duration":"1 minute/level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"You create a larger and far more menacing version of yourself that you can send forth, manipulate like a puppet, and use to interact with others. You can make the duplicate up to two size categories larger than you are and determine a theme as to how it alters your original appearance. However, this duplicate always retains some vestiges of your actual appearance. Creatures who already know you gain a +2 bonus on saving throws made to disbelieve this spell. Your duplicate has no actual substance, and you cannot use it to alter its surroundings or to attack or otherwise harm creatures it encounters. You can use the duplicate to speak, and interact verbally with creatures using the Bluff, Diplomacy, and Intimidate skills, and you gain a +2 competence bonus on Intimidate checks when using that skill through the duplicate.\n\nYou can see, hear, taste, and smell your duplicate’s surroundings as if you are actually present using your Perception skill. While you also remain aware of your own immediate surroundings when controlling your duplicate, controlling it does take a toll on your senses. You take a –4 penalty on Perception checks while you control your duplicate.\n\nThe duplicate moves under your mental command, and while you need not act out its movements, you must take a standard action to control your duplicate for 1 round (concentrating on the spell) or it winks out of existence. You can maintain control of your duplicate even if you have no line of sight or line of effect to it.\n\nThe duplicate immediately winks out of existence if it is hit by an attack or in the area of a damaging effect, or if it moves beyond the maximum range of the spell.","source":"Advanced Race Guide pg. 68"},{"n":"Fiendish Wrath","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one willing living creature per 3 levels, no two of which can be more than 30 ft. apart","duration":"concentration + 1 round/level (D)","save":"none","sr":"yes","effect":"Each affected creature flies into a combat frenzy. The target gains a +2 morale bonus to Strength and Constitution, and a +1 morale bonus on Will saves. If an affected creature strikes an enemy with two claw attacks or two unarmed strikes while in this frenzy, it can use the rend ability, dealing an additional amount of damage equal to its claw or unarmed strike damage plus 1-1/2 times its Strength bonus.","source":"Plane-Hopper's Handbook pg. 13"},{"n":"Fool's Teleport","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V","range":"personal and touch","target":"you and other touched willing creatures","duration":"1 minute/level","save":"Will negates (harmless), see text","sr":"no","effect":"This spell instantly renders you unseen as per invisibility, but creates a visual and auditory display that makes it appear as if you had teleported away. You can affect one additional Medium or smaller creature or its equivalent per 3 caster levels (a Large creature counts as two Medium creatures, a Huge creature counts as four Medium creatures, and so forth). All creatures to be affected must be in contact with one another, and at least one of those creatures must be in contact with you.\n\nIf a viewer identifies the spell with a successful Spellcraft check, she can attempt an immediate Will saving throw as if interacting with an illusion. With a successful Will save, the observer can correctly identify fool’s teleport for what it is; otherwise, she perceives the spell to be dimension door, teleport, or similar conjuration magic. A successful Will save doesn’t negate the invisibility.","source":"Occult Origins"},{"n":"Free Swim","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (a strip of kelp bound to the target), DF","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The target can move and attack underwater normally without the usual penalties involved with underwater combat, as if under the effects of freedom of movement. However, the target doesn’t gain any protections against grapple, paralysis, and magical effects that impede movement (such as solid fog, slow, and web).","source":"Aquatic Adventures pg. 59"},{"n":"Geas, Lesser","l":3,"school":"enchantment (compulsion) [curse, language-dependent, mind-affecting]","castingTime":"1 round","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature with 7 HD or less","duration":"1 day/level or until discharged (D)","save":"Will negates","sr":"yes","effect":"A lesser geas places a magical command on a creature to carry out some service or to refrain from some action or course of activity, as desired by you. The creature must have 7 or fewer HD and be able to understand you. While a geas cannot compel a creature to kill itself or perform acts that would result in certain death, it can cause almost any other course of activity.\n\nThe geased creature must follow the given instructions until the geas is completed, no matter how long it takes.\n\nIf the instructions involve some open-ended task that the recipient cannot complete through his own actions, the spell remains in effect for a maximum of 1 day per caster level. A clever recipient can subvert some instructions.\n\nIf the subject is prevented from obeying the lesser geas for 24 hours, it takes a –2 penalty to each of its ability scores. Each day, another –2 penalty accumulates, up to a total of –8. No ability score can be reduced to less than 1 by this effect. The ability score penalties are removed 24 hours after the subject resumes obeying the lesser geas.\n\nA lesser geas (and all ability score penalties) can be ended by break enchantment, limited wish, remove curse, miracle, or wish. Dispel magic does not affect a lesser geas.","source":"PRPG Core Rulebook pg. 288"},{"n":"Glibness","l":3,"school":"transmutation","castingTime":"1 standard action","components":"S","range":"personal","target":"you","duration":"10 min./level (D)","save":"","sr":"","effect":"Your speech becomes fluent and more believable, causing those who hear you to believe every word you say. You gain a +20 bonus on Bluff checks made to convince another of the truth of your words. This bonus doesn't apply to other uses of the Bluff skill, such as feinting in combat, creating a diversion to hide, or communicating a hidden message via innuendo.\n\nIf a magical effect is used against you that would detect your lies or force you to speak the truth, the user of the effect must succeed on a caster level check (1d20 + caster level) against a DC of 15 + your caster level to succeed. Failure means the effect does not detect your lies or force you to speak only the truth.","source":"PRPG Core Rulebook pg. 290"},{"n":"Gullibility","l":3,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"10 minutes/level (D)","save":"Will negates","sr":"yes","effect":"The target takes a -10 penalty on Sense Motive checks, and creatures attempting to deceive it gain a +10 bonus on Bluff checks; lies told to it shift one category more believable (impossible becomes far-fetched, far-fetched becomes unlikely, unlikely becomes believable). Glibness grants no additional benefit when used against a target already affected by this spell.","source":"Blood of the Beast pg. 14"},{"n":"Hallucinatory Decor","l":3,"school":"illusion (glamer)","castingTime":"1 minute","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one 10-ft. cube/level (S)","duration":"1 hour/level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"You transform the decor of a courtyard, structure, or other edifice to meet your highest standards and personal tastes. Objects and architectural elements remain in the same configuration—a chair remains a chair—but can look, sound, and smell like a different physical material and artistic style. You cannot change the appearance of natural terrain, but landscaped areas such as a garden or orchard can be affected. This spell functions in all other ways as hallucinatory terrain.\n\nMembers of the Prophet of Kalistrade prestige class can cast this spell, even though it is not a divination or enchantment.","source":"Disciple's Doctrine pg. 19"},{"n":"Haunting Choir","l":3,"school":"necromancy [mind-affecting, pain]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"30-ft.-radius emanation","duration":"concentration + 2 rounds","save":"Will negates","sr":"yes","effect":"You create a spectral choir and conduct its tortured, ghostly moans, deluding listeners into believing they are suffering the torments of the dead. The transparent singers occupy a 10-foot cube, but they are intangible and do not interfere with creatures in any physical way, nor can they be attacked. Creatures within 30 feet of the choir experience wracking pain that causes them to take a –2 penalty on attack rolls, skill checks, and ability checks. Individuals who exit the area of effect take these penalties for an additional 2 rounds before the delusion wears off.","source":"Ultimate Magic pg. 222"},{"n":"Horrific Doubles","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"You create several illusory doubles of yourself, where you and each image all seem slightly off or wrong in appearance. Treat this spell as mirror image, except as noted.\n\nEach creature that can see the doubles must succeed at a Will save or become shaken for as long as it can see any of the doubles. A successful saving throw negates the shaken condition and renders the creature immune to the further effects of this spell (beyond the usual effects of mirror image). In addition, the first time a creature that failed its initial saving throw destroys one of the images, it must succeed at a Will save or its perception of the double shifts at the last second. The double takes on the face of the attacker, the face of a loved one, or some other equally disturbing image, causing the attacker to become frightened for 1 round and take 1d3 points of Wisdom damage from the traumatic shock. Both additional effects are mind-affecting fear effects, and spell resistance applies against them.\n\nIf your campaign uses the sanity system (see page 12), a creature takes 1d8 points of sanity damage instead of Wisdom damage.","source":"Horror Adventures pg. 120"},{"n":"Hostile Levitation","l":3,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a leather loop studded with lodestones)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You levitate the target a few inches off the ground, removing solid footing and halving the target’s speed. The target also takes a –4 penalty to CMD against bull rush, drag, and reposition attempts. A targeted creature that attacks with a melee or ranged weapon finds itself increasingly unstable; the first attack has a –1 penalty on attack rolls, the second –2, and so on, to a maximum penalty of –5. A full-round action spent stabilizing allows the creature to begin again at –1. \n\nThis spell fails if cast on a flying creature.","source":"Ultimate Combat pg. 231"},{"n":"Illusion of Treachery","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"S, F (a tiny marionette)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will disbelief","sr":"yes","effect":"Creates an illusory double that occupies the target's space and mirrors its movements; whenever you cast a spell or throw a weapon, the illusion briefly stops mimicking so onlookers can't be certain whether the real target or the illusion acted, and these apparent actions don't provoke attacks of opportunity against the target. Any creature directly targeted by such an action gets a save to see through the ruse.","source":"Ultimate Intrigue pg. 216"},{"n":"Illusory Script","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 minute per page","components":"V, S, M (lead-based ink worth 50 gp)","range":"touch","target":"one touched object weighing no more than 10 lbs.","duration":"one day/level (D)","save":"Will negates; see text","sr":"yes","effect":"You write instructions or other information on parchment, paper, or any suitable writing material. The illusory script appears to be some form of foreign or magical writing. Only the person (or people) designated by you at the time of the casting can read the writing; it's unintelligible to any other character.\n\nAny unauthorized creature attempting to read the script triggers a potent illusory effect and must make a saving throw. A successful saving throw means the creature can look away with only a mild sense of disorientation. Failure means the creature is subject to a suggestion implanted in the script by you at the time the illusory script spell was cast. The suggestion lasts only 30 minutes. Typical suggestions include “Close the book and leave,” “Forget the existence of this note,” and so forth. If successfully dispelled by dispel magic, the illusory script and its secret message disappear. The hidden message can be read by a combination of the true seeing spell with the read magic or comprehend languages spell.","source":"PRPG Core Rulebook pg. 299"},{"n":"Implanted Projection","l":3,"school":"enchantment ( compulsion ) [ emotion , mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 day/level","save":"Will negates","sr":"Yes","effect":"This spell functions as telempathic projection OA , except its mood-altering effects remain dormant in the target’s mind. Upon casting this spell, the caster designates a command word or phrase, of which the target retains no memory. The next creature to speak the command word or phrase to the target triggers the implanted telempathic projection , treating the speaker as the original spellcaster.","source":"Occult Origins pg. 13"},{"n":"Instant Fake","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, M (a piece of costume jewlery)","range":"1 object touched","target":"one object weighting no more than 1 lb./level","duration":"1 minute/level","save":"Will disbelief (if interacted with)","sr":"no","effect":"You create an illusory duplicate of the target item. If you hold the charge on this spell, you can deliver it while touching an object you steal with Sleight of Hand or a stealAPG combat maneuver; in this case, the illusion phases into existence exactly as you remove the genuine article, allowing you to instantaneously replace a protected or guarded item with no change in appearance, weight, or other factors.\n\nThe illusion appears to be a perfect replica. Actively examining the fake with an Appraise or Perception check grants a creature a Will save, but on a failed saving throw, it concludes that the fake is the genuine article
