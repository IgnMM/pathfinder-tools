nge, you may suppress or resume this effect as a standard action.","source":"Ultimate Intrigue pg. 210"},{"n":"Denounce","l":4,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"30-ft.-radius burst","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"You speak out against a single creature within line of sight and turn possible allies against it by drawing upon the power of your voice and conviction. Creatures in the area who can see the denounced creature must make a Will saving throw or have their starting attitude toward the denounced creature worsened by two levels. For example, creatures previously indifferent to the subject turn unfriendly. Diplomacy checks made to reverse the effects of denounce are made at a –10 penalty.","source":"Advanced Player's Guide pg. 215"},{"n":"Detect Scrying","l":4,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a piece of mirror and a miniature brass hearing trumpet)","range":"40 ft.","target":"40-ft.-radius emanation centered on you","duration":"24 hours","save":"none","sr":"no","effect":"You immediately become aware of any attempt to observe you by means of a divination (scrying) spell or effect. The spell's area radiates from you and moves as you move. You know the location of every magical sensor within the spell's area.\n\nIf the scrying attempt originates within the area, you also know its location; otherwise, you and the scrier immediately make opposed caster level checks (1d20 + caster level). If you at least match the scrier's result, you get a visual image of the scrier and an accurate sense of his direction and distance from you.","source":"PRPG Core Rulebook pg. 268"},{"n":"Dimension Door","l":4,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V","range":"long (400 ft. + 40 ft./level)","target":"you and touched objects or other touched willing creatures","duration":"instantaneous","save":"none and Will negates (object)","sr":"no and yes (object)","effect":"You instantly transfer yourself from your current location to any other spot within range. You always arrive at exactly the spot desired—whether by simply visualizing the area or by stating direction. After using this spell, you can't take any other actions until your next turn. You can bring along objects as long as their weight doesn't exceed your maximum load. You may also bring one additional willing Medium or smaller creature (carrying gear or objects up to its maximum load) or its equivalent per three caster levels. A Large creature counts as two Medium creatures, a Huge creature counts as two Large creatures, and so forth. All creatures to be transported must be in contact with one another, and at least one of those creatures must be in contact with you.\n\nIf you arrive in a place that is already occupied by a solid body, you and each creature traveling with you take 1d6 points of damage and are shunted to a random open space on a suitable surface within 100 feet of the intended location.\n\nIf there is no free space within 100 feet, you and each creature traveling with you take an additional 2d6 points of damage and are shunted to a free space within 1,000 feet. If there is no free space within 1,000 feet, you and each creature travelling with you take an additional 4d6 points of damage and the spell simply fails.","source":"PRPG Core Rulebook pg. 269"},{"n":"Dominate Person","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"You can control the actions of any humanoid creature through a telepathic link that you establish with the subject's mind.\n\nIf you and the subject have a common language, you can generally force the subject to perform as you desire, within the limits of its abilities. If no common language exists, you can communicate only basic commands, such as “Come here,” “Go there,” “Fight,” and “Stand still.” You know what the subject is experiencing, but you do not receive direct sensory input from it, nor can it communicate with you telepathically.\n\nOnce you have given a dominated creature a command, it continues to attempt to carry out that command to the exclusion of all other activities except those necessary for day-to-day survival (such as sleeping, eating, and so forth). Because of this limited range of activity, a Sense Motive check against DC 15 (rather than DC 25) can determine that the subject's behavior is being influenced by an enchantment effect (see the Sense Motive skill description).\n\nChanging your orders or giving a dominated creature a new command is a move action.\n\nBy concentrating fully on the spell (a standard action), you can receive full sensory input as interpreted by the mind of the subject, though it still can't communicate with you. You can't actually see through the subject's eyes, so it's not as good as being there yourself, but you still get a good idea of what's going on.\n\nSubjects resist this control, and any subject forced to take actions against its nature receives a new saving throw with a +2 bonus. Obviously self-destructive orders are not carried out. Once control is established, the range at which it can be exercised is unlimited, as long as you and the subject are on the same plane. You need not see the subject to control it.\n\nIf you don't spend at least 1 round concentrating on the spell each day, the subject receives a new saving throw to throw off the domination.\n\nProtection from evil or a similar spell can prevent you from exercising control or using the telepathic link while the subject is so warded, but such an effect does not automatically dispel it.","source":"PRPG Core Rulebook pg. 274"},{"n":"Dream","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 minute","components":"V, S","range":"unlimited","target":"one living creature touched","duration":"see text","save":"none","sr":"yes","effect":"You, or a messenger you touch, send a message to others in the form of a dream. At the beginning of the spell, you must name the recipient or identify him or her by some title that leaves no doubt as to identity. The messenger then enters a trance, appears in the intended recipient's dream, and delivers the message. The message can be of any length, and the recipient remembers it perfectly upon waking. The communication is one-way. The recipient cannot ask questions or offer information, nor can the messenger gain any information by observing the dreams of the recipient.\nOnce the message is delivered, the messenger's mind returns instantly to its body. The duration of the spell is the time required for the messenger to enter the recipient's dream and deliver the message.\nIf the recipient is awake when the spell begins, the messenger can choose to wake up (ending the spell) or remain in the trance. The messenger can remain in the trance until the recipient goes to sleep, then enter the recipient's dream and deliver the message as normal. A messenger that is disturbed during the trance comes awake, ending the spell.\nCreatures who don't sleep or don't dream cannot be contacted by this spell.\nThe messenger is unaware of its own surroundings or of the activities around it while in the trance. It is defenseless both physically and mentally (always failing any saving throw) while in the trance.\nMythic Dream\n##Source## Mythic Adventures pg. 92\nYou or the messenger may gain information from the dreamer you contact by asking questions as if using speak with dead to speak with a corpse. An unwilling dreamer can attempt to resist this probing with a Will save (as speak with dead, using the DC dream would have if it allowed a saving throw). Answers to these questions are still generally brief and cryptic.","source":"PRPG Core Rulebook pg. 274"},{"n":"Enervation","l":4,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"ray of negative energy","duration":"instantaneous","save":"none","sr":"yes","effect":"You point your finger and fire a black ray of negative energy that suppresses the life force of any living creature it strikes. You must make a ranged touch attack to hit. If you hit, the subject gains 1d4 temporary negative levels (see Special Abilities). Negative levels stack.\n\nAssuming the subject survives, it regains lost levels after a number of hours equal to your caster level (maximum 15 hours). Usually, negative levels have a chance of becoming permanent, but the negative levels from enervation don't last long enough to do so.\n\nAn undead creature struck by the ray gains 1d4 × 5 temporary hit points for 1 hour.Mythic EnervationSource Mythic Adventures pg. 93\nThe number of negative levels inflicted increases to 1d6, and the target is sickened for 24 hours. An undead creature struck by the ray gains 1d6 × 5 temporary hit points for a number of hours equal to your caster level. \n\nAugmented (3rd): If you expend two uses of mythic power, any creature attempting to remove the target’s negative levels must succeed at a caster level check (DC 10 + your caster level + your tier).","source":"PRPG Core Rulebook pg. 277"},{"n":"Envious Urge","l":4,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You fill creatures with feelings of seething envy. Affected targets turn upon the nearest creature (whether an ally or enemy) and attempt to disarm it of a valuable weapon, steal something it is holding, or grapple it and strip it of something it prizes (your choice). Affected targets can attempt a new Will save each round as a free action to end this effect.","source":"Ultimate Magic pg. 218"},{"n":"Erase Impressions","l":4,"school":"abjuration","castingTime":"1 round","components":"V, S","range":"touch","target":"object touched","duration":"instantaneous","save":"Will negates (object)","sr":"yes (object)","effect":"You banish psychic impressions from the object touched, rendering it devoid of recent history. You choose how much time to erase, up to a maximum of 1 day per caster level. You must erase impressions from the present time back; you cannot choose to leave recent events untouched. Impressions erased in this manner cannot be recovered via object reading , legend lore , or similar measures. Casting erase impressions on a corpse removes recent psychic impressions from when the creature was alive as well, making those memories unavailable to speak with dead . For example, a 5th-level caster casting the spell on a 2-day-old corpse could erase the past 2 days of psychic impressions from the corpse and 3 additional days of information from just before the creature died.","source":"Occult Adventures pg. 170"},{"n":"Feast on Fear","l":4,"school":"necromancy [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one or more living creatures (see text)","duration":"1 round/level","save":"Fortitude negates","sr":"yes","effect":"Each round, as a standard action, you can target a single living creature of up to 9 HD and strike it with terrifying waves of power. If the target fails its saving throw, it becomes panicked for 1d4 rounds, and you gain 5 temporary hit points (which disappear after 1 hour). After the panic ends, the creature remains shaken for 10 minutes per caster level, and it automatically becomes panicked again if it comes within sight of you during that time.\n\nThese temporary hit points stack if they are from different creatures.","source":"Advanced Class Guide pg. 181"},{"n":"Forbid Action, Greater","l":4,"school":"Enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"Yes","effect":"This spell functions as forbid action, except up to one creature per level may be affected. Each creature must receive the same forbidden action.","source":"Ultimate Magic"},{"n":"Forgetful Slumber","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S, M (a few drops of river water)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"This spell acts as the deeper slumber spell, but only affects one creature of 10 Hit Dice or fewer. In addition, a creature affected by this spell awakens with no knowledge of the events that led to the spell’s casting. The target loses all memory from the 5 minutes prior to falling asleep. No effect short of a miracle or wish can restore memories lost by this spell.","source":"Advanced Race Guide pg. 48"},{"n":"Freedom of Movement","l":4,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (a leather strip bound to the target), DF","range":"personal or touch","target":"you or creature touched","duration":"10 min./level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell enables you or a creature you touch to move and attack normally for the duration of the spell, even under the influence of magic that usually impedes movement, such as paralysis, solid fog, slow, and web. All combat maneuver checks made to grapple the target automatically fail. The subject automatically succeeds on any combat maneuver checks and Escape Artist checks made to escape a grapple or a pin.\nThe spell also allows the subject to move and attack normally while underwater, even with slashing weapons such as axes and swords or with bludgeoning weapons such as flails, hammers, and maces, provided that the weapon is wielded in the hand rather than hurled. The freedom of movement spell does not, however, grant water breathing.","source":"PRPG Core Rulebook pg. 287"},{"n":"Hallucinatory Terrain","l":4,"school":"illusion (glamer)","castingTime":"10 minutes","components":"V, S, M (a stone, a twig, and a green leaf)","range":"long (400 ft. + 40 ft./level)","target":"one 30-ft. cube/level (S)","duration":"2 hours/level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"You make natural terrain look, sound, and smell like some other sort of natural terrain. Structures, equipment, and creatures within the area are not hidden or changed in appearance.","source":"PRPG Core Rulebook pg. 293"},{"n":"Harvest Knowledge","l":4,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a piece of lodestone)","range":"touch (see text)","target":"one creature or object; see text","duration":"concentration, up to 1 minute/level","save":"Will negates; see text","sr":"no","effect":"You touch a creature and temporarily absorb its knowledge for yourself. If the target fails its saving throw, you can sort through its lore and memories. You can retrieve one answer to a specific question per minute, as through sifting through the creature’s surface thoughts with detect thoughts. Alternatively, you can tap into the target’s learned experiences and attempt one Knowledge check in a skill in which the target has at least 1 rank, using the target’s total skill modifier. Each Knowledge check requires 1 minute and allows the target another Will save to resist the effect. If the target successfully resists, the spell does not end, but you are unable to attempt another Knowledge check for that skill using this spell. You can also use this spell against targets trapped in magic items or spells that hold their bodies or souls, such as an iron flask or the spell trap the soul, by touching the associated receptacle.","source":"Inner Sea Temples pg. 62"},{"n":"Hold Monster","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (one hard metal bar or rod, which can be as small as a three-penny nail)","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round/level (D); see text","save":"Will negates; see text","sr":"yes","effect":"This spell functions like hold person, except that it affects any living creature that fails its Will save.","source":"PRPG Core Rulebook pg. 296"},{"n":"Hostile Juxtaposition","l":4,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, M (a coin)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature of your size or smaller","duration":"1 round/level or until discharged","save":"Will negates","sr":"yes","effect":"Links you to a target creature; when you take damage from an attack or spell, you can spend an immediate action to swap positions with it, making it the target of that attack instead. Fails if the target lacks room, is unconscious or dead, or if you can't escape the effect's area yourself. Discharges after one successful swap.","source":"Ultimate Combat pg. 231"},{"n":"Hypnotism, Greater","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"","duration":"2d4 rounds (D)","save":"","sr":"","effect":"This functions as hypnotism, except it affects 2 Hit Die of creatures per caster level you have. You can make up to five requests (instead of a single request) to each creature affected by the spell, and the requests can be as long and as complicated as you desire (though they still must be reasonable).","source":"Blood of the Beast pg. 19"},{"n":"Illusion of Treachery, Greater","l":4,"school":"illusion (glamer)","castingTime":"1 standard action","components":"S, F (tiny marionette)","range":"close (25 ft. + 5 ft./2 levels)","target":"you and one creature","duration":"1 round/level (D)","save":"Will disbelief","sr":"yes","effect":"Improves illusion of treachery: in addition to redirecting the apparent source of your spells and ranged attacks, it also conceals your own actions (as illusion of calm) and hides all spell effects and ranged attacks you make until they reach their target. The target still perceives incoming attacks normally so it isn't caught flat-footed by them, but may attempt a Will save to disbelieve the illusion covering your actions.","source":"Ultimate Intrigue pg. 217"},{"n":"Illusory Wall","l":4,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"image 1 ft. by 10 ft. by 10 ft.","duration":"permanent","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell creates the illusion of a wall, floor, ceiling, or similar surface. It appears absolutely real when viewed, but physical objects can pass through it without difficulty. When the spell is used to hide pits, traps, or normal doors, any detection abilities that do not require sight work normally. Touch or a probing search reveals the true nature of the surface, though such measures do not cause the illusion to disappear. Although the caster can see through his illusory wall, other creatures cannot, even if they succeed at their will save (but they do learn that it is not real).","source":"PRPG Core Rulebook"},{"n":"Impossible Angles","l":4,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, M (a melted prism)","range":"medium (100 ft. + 10 ft./level)","target":"contiguous area up to one 5-foot cube/caster level (S)","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"You cause the surrounding area to appear to distort. The angles and corners of the area subtly twist and contort, creating unnatural and impossible shapes. Any creature entering the area must succeed at a Will save or become disoriented. Disoriented characters treat the area as difficult terrain and are sickened. In addition, whenever a disoriented creature uses an action to move (including taking a 5-foot step if it can do so in difficult terrain), roll 1d8 to see which direction it moves, in a similar manner to determining where a splash weapon lands on a miss (Pathfinder RPG Core Rulebook 202). On a 1, the creature moves in its intended direction, with 2 through 8 rotating around the creature’s starting square in a clockwise direction. Only the creature’s first 5 feet of movement each round are affected in this way—it can move normally for any remaining movement, either from the same action or from later actions, as the creature acclimatizes to the distortion. An affected creature can attempt a new Will save each round to end the disoriented effect. A creature that leaves the area and re-enters must attempt the saving throw again, even if it succeeded at its initial save.","source":"Horror Adventures"},{"n":"Invisibility, Greater","l":4,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal or touch","target":"you or creature touched","duration":"1 round/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions like invisibility, except that it doesn't end if the subject attacks.","source":"PRPG Core Rulebook pg. 302"},{"n":"Locate Creature","l":4,"school":"divination","castingTime":"1 standard action","components":"V, S, M (fur from a bloodhound)","range":"long (400 ft. + 40 ft./level)","target":"circle, centered on you, with a radius of 400 ft. + 40 ft./level","duration":"10 min./level","save":"none","sr":"no","effect":"This spell functions like locate object, except this spell locates a known creature. You slowly turn and sense when you are facing in the direction of the creature to be located, provided it is within range. You also know in which direction the creature is moving, if any.\n\nThe spell can locate a creature of a specific kind or a specific creature known to you. It cannot find a creature of a certain type. To find a kind of creature, you must have seen such a creature up close (within 30 feet) at least once.\n\nRunning water blocks the spell. It cannot detect objects. It can be fooled by mislead, nondetection, and polymorph spells.","source":"PRPG Core Rulebook pg. 305"},{"n":"Mad Sultan's Melody","l":4,"school":"enchantment (compulsion) [mind-affecting, sonic]","castingTime":"1 standard action","components":"V, S, F (masterwork flute, pipe, or string instrument)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/2 levels, no two of which can be more than 30 ft. apart (see text)","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You imitate the mad cacophony created by the awful beings associated with the Outer God, Azathoth. This spell targets only creatures with the ooze type, creatures with the amorphous special ability, and non-bipedal creatures with a special association with the Outer Gods. This music draws the targets’ attention to the caster, as per the fascinate bardic performance. It affects mindless creatures despite the mindless quality typically granting immunity to mind-affecting effects, though it doesn’t ignore any other immunity to mind-affecting effects the creature might have. The caster doesn’t have to maintain the effect each round—the music continues for the duration of the spell. Creatures fascinated by mad sultan’s melody become immune to any other casting of the spell for 24 hours after the spell ends, and the spell ends if the fascination breaks on any of its targets for any reason (such as an attack).\n\nIf you have the bardic performance class feature and the fascinate bardic performance, you can choose to use the spell’s saving throw DC or a DC equal to 10 + 1/2 your levels in the class that grants you bardic performance + your Charisma modifier, whichever is higher. If you choose to use the latter DC, each round of the melody costs 1 round of bardic performance and it counts as an active performance for determining how many performances you can have active.\n\nThis spell takes a toll on the caster. Each time you cast it, you take 1d4 points of Wisdom damage. If your campaign uses the sanity system (see page 12), you instead take 2d6 points of sanity damage.","source":"Horror Adventures pg. 122"},{"n":"Majestic Image","l":4,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (a drop of paint and a ball of clay)","range":"200 ft./level","target":"transfer consciousness to an object bearing your likeness","duration":"concentration","save":"Will negates (see text)","sr":"yes","effect":"You cast your consciousness into a single object within range that bears your likeness, as if choosing a specific image with the spell enter imageAPG. In addition to observing your surroundings, speaking, and manipulating the image you inhabit, however, you can converse with nearby creatures and use your normal social skills.\n\nYou gain a +5 bonus on Bluff checks to tell lies and Diplomacy checks to make a request. You gain a +2 bonus on Intimidate checks and use the object’s size to determine whether you gain a bonus or penalty on Intimidate checks for size.","source":"Ultimate Intrigue pg. 219"},{"n":"Mind Probe","l":4,"school":"divination [mind-affecting]","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You gain access to the subject’s memories and knowledge. You can attempt to learn the answer to one question per round. A successful Will save ends the spell. Otherwise, the creature can attempt a Bluff check with a DC equal to 11 + your Sense Motive modifier. If it fails its Bluff check, you gain the answer you desire. If it succeeds at its check, you gain no information. If it succeeds by 5 or more, it answers whatever it chooses, and you believe that wrong answer to be true. Your questions are purely telepathic inquiries, and the answers to those questions are imparted directly to your mind. You and the target don’t need to speak the same language, though less intelligent creatures may yield up only appropriate sensory images in answer to your questions.","source":"Occult Adventures"},{"n":"Mindwipe","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"instantaneous; see text","save":"Will negates","sr":"yes","effect":"You erase a portion of the target’s mind and experiences, inflicting 2 temporary negative levels on the target for 1 day per caster level. If the target is a spellcaster who must choose and prepare spells in advance, each negative level imposed by mindwipe also causes the target to lose one prepared spell from her highest level of spells known for each of her spellcasting classes for which she must prepare spells. These lost spells are no longer considered known by the target until the corresponding negative levels are removed.\n\nIf the target is a spontaneous spellcaster, each negative level inflicted by mindwipe causes her to lose one spell slot of her highest level of spells for each spontaneous spellcasting class in which she has levels and to lose knowledge of one random spell known of that level (or the next lowest level if she has already lost knowledge of all spells known of that level, and so on). The target cannot use the lost spell slots and spells known as long as the corresponding negative levels last. When the target loses a spell known, the spell remains on her class list but she cannot prepare or cast the spell.\n\nIf the negative levels from mindwipe cause the target’s total number of negative levels to equal or exceed her character level, instead of dying, she enters a catatonic state as long as the negative levels from mindwipe continue to cause her total number of negative levels to equal or exceed her character level.","source":"Occult Adventures"},{"n":"Minor Phantom Object","l":4,"school":"illusion (shadow) [shadow]","castingTime":"1 minute","components":"V, S","range":"0 ft.","target":"illusory, unattended, nonmagical object of nonliving plant matter, up to 1 cu. ft./level","duration":"10 minutes/level (D)","save":"","sr":"","effect":"This spell functions as the minor creation spell, except the object created is a semi-real illusion. Any creature that interacts with the object may make a Will save, with success causing the object to cease to exist. A gnome casting this spell may make a Spellcraft check in place of any Craft check required to make a complex item.","source":"Advanced Race Guide"},{"n":"Modify Memory","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round; see text","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"You reach into the subject's mind and modify as many as 5 minutes of its memories in one of the following ways.Eliminate all memory of an event the subject actually experienced. This spell cannot negate charm, geas/quest, suggestion, or similar spells.Allow the subject to recall with perfect clarity an event it actually experienced.Change the details of an event the subject actually experienced.Implant a memory of an event the subject never experienced.Casting the spell takes 1 round. If the subject fails to save, you proceed with the spell by spending as much as 5 minutes (a period of time equal to the amount of memory you want to modify) visualizing the memory you wish to modify in the subject. If your concentration is disturbed before the visualization is complete, or if the subject is ever beyond the spell's range during this time, the spell is lost.\n\nA modified memory does not necessarily affect the subject's actions, particularly if it contradicts the creature's natural inclinations. An illogical modified memory is dismissed by the creature as a bad dream, too much wine, or another similar excuse.","source":"PRPG Core Rulebook pg. 315"},{"n":"Nondetection, Communal","l":4,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (diamond dust worth 25 gp per target)","range":"touch","target":"creatures or objects touched","duration":"1 hour/level","save":"Will negates (harmless, object)","sr":"yes (harmless, object)","effect":"Functions as nondetection, but you divide the total duration into 1-hour increments and distribute them among multiple creatures or objects you touch, rather than granting the full duration to a single subject.","source":"Ultimate Combat pg. 238"},{"n":"Old Salt's Curse","l":4,"school":"necromancy [curse]","castingTime":"1 standard action","components":"V, S, M (a flask of seawater)","range":"touch","target":"one creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"You inflict a curse of the roiling sea upon the target, making it permanently sickened. Anytime the target is on or in the water more than a mile from shore, it also becomes staggered with seasickness. This curse cannot be dispelled, though remove curse or break enchantment can negate it.","source":"Advanced Race Guide pg. 69"},{"n":"Passing Fancy, Mass","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature/level, no two of which can be more thatn 30 ft. apart","duration":"4d4 rounds (D)","save":"","sr":"","effect":"This spell functions as per passing fancy except as noted above.","source":"Spymaster's Handbook pg. 29"},{"n":"Pessimism","l":4,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M/DF (a shard of a broken mirror)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"You erode the target’s confidence and instill a sense of despair. This fear of failure manifests as a –2 penalty on attack rolls, saving throws, ability checks, skill checks, and weapon damage rolls. Additionally, the target can’t gain morale bonuses of any kind while the spell remains in effect. No amount of achievement counters the spell’s effects—the target simply explains away positive events with a self-critical perspective.\n\nCertain events can solidify the character’s belief that it is doomed. Whenever the target rolls a natural 1 on an attack roll or saving throw, fails an ability or skill check by more than 5, or takes additional damage as a result of a foe’s confirmed critical hit, the penalty to roll imposed by pessimism becomes –3 for 1 round. This increased penalty doesn’t stack, even if multiple catastrophes occur on the same round.","source":"Horror Adventures pg. 123"},{"n":"Phantasmal Asphixiation","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (an empty vial)","range":"medium (100 ft. + 10 ft./level)","target":"","duration":"1 round/level (D)","save":"Will disbelief, then Fortitude partial (see text)","sr":"yes","effect":"Your target must succeed at a Will save or believe it can no longer breathe. An affected target must attempt a Fortitude save each round at the beginning of its turn. The first time it fails the Fortitude save, it is staggered until the next time it attempts a save against the spell. If the target fails a second Fortitude save in a row, it falls unconscious for the spell’s remaining duration. The target breathes normally while unconscious, but is shaken for 1 minute upon awakening. If the target succeeds at two Fortitude saves in a row, it shakes off the spell’s effects entirely. Otherwise, the target continues to attempt a save each round until it falls unconscious or the spell ends. This spell has no effect on creatures that don’t need to breathe.","source":"Horror Adventures"},{"n":"Phantasmal Killer","l":4,"school":"illusion (phantasm) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"instantaneous","save":"Will disbelief, then Fortitude partial; see text","sr":"yes","effect":"You create a phantasmal image of the most fearsome creature imaginable to the subject simply by forming the fears of the subject's subconscious mind into something that its conscious mind can visualize: this most horrible beast. Only the spell's subject can see the phantasmal killer. You see only a vague shape. The target first gets a Will save to recognize the image as unreal. If that save fails, the phantasm touches the subject, and the subject must succeed on a Fortitude save or die from fear. Even if the Fortitude save is successful, the subject takes 3d6 points of damage.\n\nIf the subject of a phantasmal killer attack succeeds in disbelieving and possesses telepathy or is wearing a helm of telepathy, the beast can be turned upon you. You must then disbelieve it or become subject to its deadly fear attack.Mythic Phantasmal KillerSource Mythic Adventures pg. 103\nIf the target fails its Will save but succeeds at its Fortitude save, the phantasmal killer persists in the target’s mind, giving it the dazed condition until your next turn. On your next turn, the target must attempt another Fortitude save against the phantasm. Success means it takes 3d6 points of damage; failure means it dies from fear. \n\nAugmented (6th): If you expend two uses of mythic power, the spell can affect a living target that is immune to fear, illusions, or mind-affecting effects.","source":"PRPG Core Rulebook pg. 319"},{"n":"Poison","l":4,"school":"necromancy [poison]","castingTime":"1 standard action","components":"V, S, DF","range":"touch","target":"living creature touched","duration":"instantaneous; see text","save":"Fortitude negates; see text","sr":"yes","effect":"A melee touch attack infects the target with magical venom that deals 1d3 Constitution damage per round for 6 rounds; the target may attempt a new Fortitude save each round to end the affliction and negate further damage.","source":"PRPG Core Rulebook pg. 323"},{"n":"Primal Scream","l":4,"school":"abjuration [mind-affecting, sonic]","castingTime":"1 standard action","components":"V","range":"personal","target":"you","duration":"1 round/level","save":"","sr":"","effect":"You voice a mighty yell from the depths of your soul, invigorating yourself and dispelling enchantment and paralysis effects. This functions as break enchantment, except it only affects you and only frees you from enchantment and paralysis effects. If the caster level check to break the hostile effect succeeds, you give voice to your scream and the spell takes effect normally; if not, this spell fails without further effect. You can cast this spell even when paralyzed or unable to speak because of an enchantment effect, but not in an area of silence , if you are unable to speak for reasons other than enchantments or paralysis (for example, if you are gagged), or if cast in an environment where speaking is not possible.","source":"Ultimate Magic pg. 232"},{"n":"Restoration","l":4,"school":"conjuration (healing)","castingTime":"3 rounds","components":"V, S, M (diamond dust worth 100 gp or 1,000 gp, see text)","range":"touch","target":"creature touched","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions like lesser restoration, except that it also dispels temporary negative levels or one permanent negative level. If this spell is used to dispel a permanent negative level, it has a material component of diamond dust worth 1,000 gp. This spell cannot be used to dispel more than one permanent negative level possessed by a target in a 1-week period.\nRestoration cures all temporary ability damage, and it restores all points permanently drained from a single ability score (your choice if more than one is drained). It also eliminates any fatigue or exhaustion suffered by the target.","source":"PRPG Core Rulebook pg. 334"},{"n":"Reveal Emotions","l":4,"school":"divination","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"40-ft.-radius spread","duration":"1 hour/level (D)","save":"none","sr":"yes","effect":"You create an area that draws out a creature’s emotion aura ( Pathfinder RPG Occult Adventures 198 ). Creatures within this area constantly glow with colors that represent their current overall emotional state and continue to do so for 1d4 rounds after leaving the area. This glow is clearly visible to any creature that can see the creature. Emotionless creatures or creatures unaffected by this spell glow with a dull purple hue while within the area.","source":"Heroes of the High Court pg. 10"},{"n":"Riding Possession","l":4,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 hour/level (D); see effect","save":"Will negates","sr":"yes","effect":"Projects your soul into the target's body as a hidden passenger who does not take control; the host retains full control and normally has no idea it's possessed. You cannot speak directly, but can cast mind-affecting spells that only affect the host; if the host makes its save against such a spell it becomes aware of the possession and gets a new save against this spell. Protection from evil (or similar) stops you from casting further spells on the host but doesn't expel you.","source":"Occult Adventures pg. 185"},{"n":"Seek Shelter","l":4,"school":"enchantment (compulsion) [fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"all non-hostile creatures with 4 or fewer HD in a 30-ft.-radius spread","duration":"1 hour/level (D)","save":"Will negates (harmless)","sr":"yes","effect":"You send an empathic urge to seek safety both as fast as possible and in an orderly fashion, and to remain in such secure locations for the duration of the spell. Targets with 5 or more Hit Dice are unaffected. When you cast the spell, you can designate a fortified location—either general (such as “indoors”) or specific (such as “the local garrison”)—for the targets to attempt to reach. If you do not specify a location for the targets to retreat to, they attempt to find safety to the best of their ability. Affected creatures defend themselves normally but attack only if provoked.","source":"Inner Sea Intrigue pg. 62"},{"n":"Serenity","l":4,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You fill the targets’ minds with feelings of tranquility. Those attempting to commit violence become stricken with wracking pain and take 3d6 points of nonlethal damage each round they attempt to harm another creature. If attacked, affected individuals can defend themselves and may participate in combat by using Combat Expertise, fighting defensively, or taking the total defense action without triggering the spell’s nonlethal damage.","source":"Ultimate Magic pg. 236"},{"n":"Shadow Conjuration","l":4,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S","range":"see text","target":"see text","duration":"see text","save":"Will disbelief (if interacted with); varies; see text","sr":"yes; see text","effect":"You use material from the Plane of Shadow to shape quasi-real illusions of one or more creatures, objects, or forces. Shadow conjuration can mimic any sorcerer or wizard conjuration (summoning) or conjuration (creation) spell of 3rd level or lower.\n\nShadow conjurations are only one-fifth (20%) as strong as the real things, though creatures who believe the shadow conjurations to be real are affected by them at full strength. Any creature that interacts with the spell can make a Will save to recognize its true nature.\n\nSpells that deal damage have normal effects unless the affected creature succeeds on a Will save. Each disbelieving creature takes only one-fifth (20%) damage from the attack. If the disbelieved attack has a special effect other than damage, that effect is only 20% likely to occur. Regardless of the result of the save to disbelieve, an affected creature is also allowed any save that the spell being simulated allows, but the save DC is set according to shadow conjuration's level (4th) rather than the spell's normal level. In addition, any effect created by shadow conjuration allows spell resistance, even if the spell it is simulating does not. Shadow objects or substances have normal effects except against those who disbelieve them. Against disbelievers, they are 20% likely to work.\n\nA shadow creature has one-fifth the hit points of a normal creature of its kind (regardless of whether it's recognized as shadowy). It deals normal damage and has all normal abilities and weaknesses. Against a creature that recognizes it as a shadow creature, however, the shadow creature's damage is one-fifth (20%) normal, and all special abilities that do not deal lethal damage are only 20% likely to work. (Roll for each use and each affected character separately.) Furthermore, the shadow creature's AC bonuses are just one-fifth as large.\n\nA creature that succeeds on its save sees the shadow conjurations as transparent images superimposed on vague, shadowy forms. Objects automatically succeed on their Will saves against this spell.","source":"PRPG Core Rulebook pg. 340"},{"n":"Shadowform","l":4,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 round/level (D)","save":"Will negates; see text","sr":"yes","effect":"Transforms the target's body into quasi-real shadowstuff from the Shadow Plane. Whenever an attacker targets it, that attacker must succeed on a Will save or the attack deals only one-fifth normal damage and any special effects apply at only 20% potency or likelihood. A successful save lets the attack function normally and grants the attacker immunity to this reduction against the target for 1 round. Inanimate objects automatically succeed on this save.","source":"Blood of Shadows pg. 31"},{"n":"Shocking Image","l":4,"school":"illusion (figment) [electricity]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"none","sr":"see text","effect":"This spell works like mirror image, except the illusory doubles it creates discharge an electric shock when destroyed. An opponent that uses a melee attack to destroy one of your images takes 2d6 points of electricity damage. You must overcome a target’s spell resistance the first time you deal this electricity damage to it. Failure renders the target immune to damage from this spell.","source":"Ultimate Combat pg. 243"},{"n":"Shroud of Darkness","l":4,"school":"evocation [darkness]","castingTime":"1 standard action","components":"V, S, M/DF (a pinch of black sand)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/3 levels, no two of which can be more than 30 ft. apart","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"Lowers the light level around each affected creature by two steps: bright light becomes dim, normal light becomes darkness, and areas already dim or dark become an unnatural darkness that defeats even darkvision.","source":"Inner Sea Temples pg. 13"},{"n":"Sleepwalk","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S, M (a sprig of belladonna worth 100 gp)","range":"touch","target":"unconscious creature touched","duration":"1 hour/level (D)","save":"Will negates, see text","sr":"yes","effect":"You compel an unconscious or sleeping creature to rise and move in a half-awake state. The target creature staggers about if led or guided, but remains helpless for all other purposes. The subject moves at half speed and is limited to a single move action each round. It is not capable of moving at a higher rate of speed or taking actions other than movement except by magical assistance, and automatically fails any Dexterity- or Strength-based skill checks. If the creature takes any damage while sleepwalking it must make a new saving throw or the spell ends and the creature awakes (if it has more than 0 hit points). When the spell ends or is dismissed, the target remains unconscious and must be awoken normally. While sleepwalk allows an unconscious creature to move, it does not awaken the creature, nor does it stabilize or otherwise heal them. A disabled creature that moves about while under the effects of this spell does not start dying again as a result of this movement.","source":"Advanced Player's Guide pg. 244"},{"n":"Sleepwalking Suggestion","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (two doses of oil of taggit worth 180 gp total)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"24 hours","save":"Will negates or none (see text)","sr":"yes","effect":"You compel the target creature to rise from its sleep as if sleepwalking and perform a course of activity (limited to a sentence or two). The spell takes effect immediately if the target is already asleep, or as soon as the target falls asleep if it is conscious. You can specify that the creature should wait before taking action when you give your instructions if you so choose. A sleeping creature doesn’t get a save against this spell. The suggested activity must not cause the target to directly harm itself or others, but it doesn’t need to be reasonable. For example, you could instruct the target to unlock doors and windows or poison its ally’s rations, but not jump off a roof or perform a coup de grace action against a sleeping ally. Instructions that cause direct harm prompt the target to awaken just prior to performing the action and the target experiences a vague memory of what it was supposed to do.\n\nThe target moves at its speed, but isn’t capable of running or moving at a higher rate of speed. It moves in dark conditions as if it had darkvision and can perform most simple and skillbased actions, but it can’t engage in combat, spellcasting, or actions that require significant cognitive awareness (like making complex decisions, solving puzzles, or using complicated magic items). If the creature takes any damage while sleepwalking, it must attempt a new saving throw. If it succeeds, the spell ends and the creature awakens. When the target completes the suggested course of activity, or when the spell ends or is dismissed, the target remains unconscious and returns to where it was sleeping and must be awoken normally. It retains no memory of what it did while unconscious (with the only exception described above).\n\nUnlike the sleepwalkAPG spell, attempts to use sleepwalking suggestion on a creature that is unconscious for any reason other than sleep automatically fail. A creature affected by sleepwalking suggestion is unaware it has been programmed to act in its sleep (unless awoken because it was about to cause harm).","source":"Horror Adventures pg. 127"},{"n":"Solid Fog","l":4,"school":"conjuration (creation)","castingTime":"1 standard action","components":"V, S, M (powdered peas and an animal hoof)","range":"medium (100 ft. + 10 ft./level)","target":"fog spreads in 20-ft. radius","duration":"1 min./level","save":"none","sr":"no","effect":"This spell functions like fog cloud, but in addition to obscuring sight, the solid fog is so thick that it impedes movement. Creatures moving through a solid fog move at half their normal speed and take a –2 penalty on all melee attack and melee damage rolls. The vapors prevent effective ranged weapon attacks (except for magic rays and the like). A creature or object that falls into solid fog is slowed so that each 10 feet of vapor that it passes through reduces the falling damage by 1d6. A creature cannot take a 5-foot-step while in solid fog. Solid fog, and effects that work like solid fog, do not stack with each other in terms of slowed movement and attack penalties.\n\nUnlike normal fog, only a severe wind (31+ mph) disperses these vapors, and it does so in 1 round.\n\nSolid fog can be made permanent with a permanency spell. A permanent solid fog dispersed by wind reforms in 10 minutes.","source":"PRPG Core Rulebook pg. 345"},{"n":"Steal Power","l":4,"school":"Necromancy","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One mythic creature","duration":"Instantaneous","save":"Will negates","sr":"Yes","effect":"You sap the power from a mythic creature, using it to restore your own. The target loses 1d4 uses of mythic power. If you have the ability to expend mythic power, you regain one use for each use the target loses.","source":"Mythic Adventures"},{"n":"Synapse Overload","l":4,"school":"divination [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"touch","target":"living creature touched","duration":"instantaneous","save":"Fortitude partial (see text)","sr":"yes","effect":"You cause the target’s mind to unleash a vast overflowing torrent of information throughout the target’s body, causing the target’s synapses to violently trigger. The target takes 1d6 points of electrical damage per caster level (maximum 15d6) and is staggered for 1 minute. A successful Fortitude saving throw doesn’t reduce the damage, but it negates the staggered effect.","source":"Occult Adventures pg. 187"},{"n":"Synaptic Pulse, Greater","l":4,"school":"enchantment ( compulsion ) [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"30 ft.","target":"30-ft.-radius spread centered on you","duration":"1d4 rounds; see text","save":"Will negates","sr":"yes","effect":"You emit a pulsating mental blast that stuns all creatures in range of your psychic shriek for 1d4 rounds. On a successful save, a creature is instead sickened for 1 round.","source":"Occult Adventures pg. 187"},{"n":"Telepathic Bond","l":4,"school":"divination","castingTime":"1 standard action","components":"V, S, M (two eggshells from two different creatures)","range":"close (25 ft. + 5 ft./2 levels)","target":"you plus one willing creature per three levels, no two of which can be more than 30 ft. apart","duration":"10 min./level (D)","save":"none","sr":"no","effect":"You forge a telepathic bond among yourself and a number of willing creatures, each of which must have an Intelligence score of 3 or higher. Each creature included in the link is linked to all the others. The creatures can communicate telepathically through the bond regardless of language. No special power or influence is established as a result of the bond. Once the bond is formed, it works over any distance (although not from one plane to another).\n\nIf desired, you may leave yourself out of the telepathic bond forged. This decision must be made at the time of casting.\n\nTelepathic bond can be made permanent with a permanency spell, though it only bonds two creatures per casting of permanency.","source":"PRPG Core Rulebook pg. 358"},{"n":"Telepathic Silence","l":4,"school":"illusion ( glamer )","castingTime":"1 round","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"60-ft.-radius emanation centered on a point in space","duration":"1 round/level (D)","save":"none","sr":"no","effect":"Creatures within the area cannot send or receive telepathic messages, and anyone in the area casting a spell with a thought component must succeed at a concentration check (DC = 20 + twice the spell’s level; this includes the increased concentration DC for casting spells with a thought component) or lose the spell. Furthermore, the thoughts of creatures within the area cannot be detected, located, or read with thoughtsense, detect thoughts, or similar effects. Telepathic silence does not hinder spells that target a creature’s mind or that do not rely on communication, such as mind thrustOA .","source":"Monster Hunter's Handbook pg. 31"},{"n":"Telepathy","l":4,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"You can mentally communicate with any other creature within 100 feet that has a language. It is possible to address multiple creatures at once telepathically, although maintaining a telepathic conversation with more than one creature at a time is just as difficult as speaking and listening to multiple people simultaneously.","source":"Occult Adventures"},{"n":"Thoughtsense","l":4,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, M (a bit of dried brain tissue)","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"You automatically detect and locate conscious creatures within 60 feet, as if you possessed the blindsight ability. Nondetection, mind blank, and similar effects can block this effect. Thoughtsense can distinguish between sentient (Intelligence 3 or greater) and non-sentient (Intelligence 1–2) creatures, but otherwise provides no information about the creatures it detects.","source":"Occult Adventures"},{"n":"Tough Crowd","l":4,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"1 creature/level","duration":"10 minutes/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You fortify your allies against attempts to control or mislead them. Each ally in the spell’s range gains a +4 insight bonus on the saving throw to resist the next enchantment or illusion spell cast on it. In addition, the DC of any Bluff, Diplomacy, Disguise, or Intimidate check to influence an affected character increases by 4 for the duration of the spell.","source":"Arcane Anthology pg. 27"},{"n":"Truespeak","l":4,"school":"divination","castingTime":"1 standard action","components":"V","range":"personal","target":"you","duration":"1 minute/level","save":"","sr":"","effect":"You can communicate with any creature that is not mindless. As long as you can be heard, your speech is understandable to all creatures, each of which hears you as though you were conversing in its language or other natural mode of communication, and you hear their responses as though in your own native language. You may ask questions and receive answers, though this spell does not make creatures more friendly or cooperative than normal, and non-sentient creatures may give limited responses. While using truespeak, your language-dependent effects can affect any creature that is not mindless.","source":"Advanced Race Guide pg. 89"},{"n":"Untold Wonder","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You fill the target’s mind with childlike wonder, allowing that creature to marvel at things that would be debilitating to others. Penalties that the target would take as a result of an emotion effect are instead treated as morale bonuses equal to half the penalty’s value (for example, if the target were affected by a crushing despair spell, she would gain a +1 morale bonus on attack rolls, saving throws, ability checks, skill checks, and weapon damage rolls, instead of the spell’s normal effect). Furthermore, morale bonuses she gains from other sources are increased by 1. Finally, the target gains a +2 bonus on saving throws to resist spells of the pattern subschool, as her childlike wonder allows her to marvel at the beauty of such effects without being overwhelmed by them.","source":"Heroes from the Fringe pg. 19"},{"n":"Utter Contempt","l":4,"school":"enchantment [emotion]","castingTime":"1 standard action","components":"V, S, M (spittle)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"Fills the target with contempt for every other creature, worsening its attitude toward all creatures besides itself by two steps.","source":"Ultimate Magic pg. 246"},{"n":"Vicarious View","l":4,"school":"divination (scrying)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"magical sensor","duration":"1 minute/level (D)","save":"Will negates (object)","sr":"yes (object)","effect":"You plant a scrying sensor on a touched creature, object, or point in space, allowing you to see and hear the creature, object, or point and its surroundings (approximately 10 feet in all directions). If the creature or object on moves, the sensor moves with it. Unlike other scrying spells, vicarious view doesn’t allow magically or supernaturally enhanced senses to work through it.","source":"Ultimate Intrigue pg. 229"},{"n":"Vigilant Rest","l":4,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (a handful of crushed glass)","range":"touch","target":"one living creature touched","duration":"8 hours (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"Lets a sleeping subject remain alert to real danger. The target no longer suffers the usual +10 penalty to the DC of Perception checks made while asleep, letting it filter out mundane noise while still noticing genuine threats. It can wake instantly as a free action upon sensing danger, and if it is roused (even into combat) it can fall back asleep seamlessly once the threat passes, without losing the rest of the spell's duration.","source":"Ultimate Wilderness pg. 237"},{"n":"Zone of Silence","l":4,"school":"illusion (glamer)","castingTime":"1 round","components":"V, S","range":"personal","target":"5-ft.-radius emanation centered on you","duration":"1 hour/level (D)","save":"","sr":"","effect":"By casting zone of silence, you manipulate sound waves in your immediate vicinity so that you and those within the spell's area can converse normally, yet no one outside can hear your voices or any other noises from within, including language-dependent or sonic spell effects. This effect is centered on you and moves with you. Anyone who enters the zone immediately becomes subject to its effects, but those who leave are no longer affected. Note, however, that a successful DC 20 Linguistics check to read lips can still reveal what's said inside a zone of silence.","source":"PRPG Core Rulebook pg. 371"},{"n":"Appearance of Life, Greater","l":5,"school":"Illusion (glamer)","castingTime":"1 round","components":"V, S, M (one Tiny or larger living creature)","range":"Touch","target":"One willing undead creature touched","duration":"1 hour/level","save":"Will disbelief or Will negates (see text)","sr":"No","effect":"This spell functions as appearance of life (Pathfinder RPG Horror Adventures 108), except that you can disguise a single undead creature regardless of its number of Hit Dice, and the illusion also creates relevant smells, sounds, textures, and temperatures to match the appearance. If you disguise the target as a living version of itself, creatures that interact with the target take a -5 penalty on their Will saving throws to disbelieve the illusion, though if the target attacks a creature, the attacked creature no longer takes this penalty.","source":"Villain Codex"},{"n":"Befuddled Combatant","l":5,"school":"enchantment (compulsion) [curse, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (cooked noodles)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"As a way to befuddle your target, you fill its mind with all manner of swirling images as well as baffling and incoherent thoughts, making the target an ineffective combatant and rendering its spellcasting and other such abilities much more feeble.\n\nFor the spell’s duration, the DCs of all of the target’s spells, spell-like abilities, supernatural abilities, and extraordinary abilities are reduced by 4. Any of its attacks that would deal hit point damage, including its melee and ranged physical attacks, deal minimum damage for the duration of this spell.\n\nThis curse applies only to effects created by the creature while this spell is actively affecting the target; applying or removing this curse doesn’t alter the ongoing damage of effects previously created by the target (such as an incendiary cloud spell that was cast before the target became affected by this spell).","source":"Healer's Handbook pg. 17"},{"n":"Castigate, Mass","l":5,"school":"enchantment (compulsion) [emotion, fear, language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level or 1 round; see text","save":"Will partial","sr":"yes","effect":"This spell functions as castigate, except it affects many creatures.","source":"Advanced Player's Guide pg. 210"},{"n":"Charnel House","l":5,"school":"illusion (shadow) [evil, shadow]","castingTime":"10 minutes","components":"V, S, M (one Tiny or larger living creature)","range":"close (25 ft. + 5 ft./2 levels)","target":"20-ft. cube","duration":"10 minutes/level","save":"Will partial","sr":"no","effect":"You sacrifice a living creature to conjure a semi-real scene of horrific carnage over the area; creatures entering must succeed on a Will save or become sickened for 1d6 rounds (this is a mind-affecting effect), while a successful save reveals the scene's semi-real nature and grants a +5 bonus on Acrobatics checks made within it. Moving through the gore-slick ground requires a DC 10 Acrobatics check to move at half speed; failure means no movement that round, and failure by 5 or more knocks the creature prone. Creatures that remain stationary need not check.","source":"Horror Adventures pg. 111"},{"n":"Cloak of Dreams","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S, M (a rose petal and a drop of perfume)","range":"5 ft.","target":"5-ft.-radius emanation centered on you","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You are surrounded by a soporific aroma that causes living creatures that begin their turn or end their movement within 5 feet of you to fall asleep for 1 minute. Creatures must save each time they begin their turn or end their movement within the cloak of dreams, even if they have previously saved against the effect. Sleeping creatures are helpless but can be awakened with a standard action or after being wounded. Creatures with the scent special quality have a –4 penalty on their saves.","source":"Advanced Player's Guide pg. 211"},{"n":"Cloak of Shadows","l":5,"school":"illusion (shadow) [evil, shadow]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"none","sr":"no","effect":"Wraps you in semi-real shadow, granting 20% concealment, a +5 competence bonus on Stealth checks, DR 5 against good-aligned damage, and immunity to sunlight-related vulnerabilities. While in dim light or darkness, this improves to 50% concealment and a +10 competence bonus on Stealth against creatures lacking darkvision or similar senses.","source":"Villain Codex pg. 80"},{"n":"Compelling Rant","l":5,"school":"enchantment (charm)","castingTime":"1 minute","components":"V, S, M/DF (a handwritten sheet of notes)","range":"medium (100 ft. + 10 ft./level)","target":"any number of creatures","duration":"conecentration plus 1 round/level, up to 1 hour/level","save":"Will negates (see text)","sr":"no","effect":"You deliver a confusing but fascinating monologue, relaying conspiracies or metaphysical revelations that confound your audience, throughout the spell's casting time and as long as you concentrate. You take 1d4 points of Wisdom drain when you begin the speech and can't reduce or prevent this damage in any way. Each intelligent creature in the spell's area takes 1d6 points of Wisdom damage as their perceptions of reality realign with yours for the spell's duration. Listeners with at least 5 HD can attempt a Will save to negate the effects. Your targets view you with a friendly attitude and respond to criticism of you with irritation. Bluff, Diplomacy, or Intimidate checks to create doubt about your purpose in those affected by the spell take a –4 penalty. The attitude of your targets regarding any creature that criticizes you or your vision automatically changes one step toward hostile; a Diplomacy check that fails by 5 or more reduces their attitude further. Your targets retain the same alignment and their prior beliefs, in addition to the ones you force on them. You can't force beliefs on a target if such beliefs would be necessarily against the nature of its alignment and prior beliefs, but targets are otherwise able to hold contradictory beliefs.\n\nIf your campaign uses the sanity system (see page 12), your sanity score decreases by 2 (and thus your sanity edge decreases by 1) instead of taking Wisdom drain each time you cast this spell. Only greater restoration, miracle, or wish can remove this decrease. A single casting of greater restoration removes one decrease of sanity from casting borrow corruption, while a casting of miracle or wish removes them all. Affected targets take sanity damage equal to half your caster level (maximum 10) instead of Wisdom damage. The targets might actually change alignment and beliefs if their loss of sanity afflicts them with an appropriate madness, in which case those effects last even after the spell's duration has ended.","source":"Horror Adventures pg. 111"},{"n":"Crime Wave","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a tarnished coin)","range":"medium (100 ft. + 10 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"Compels each failed-save target to roll percentile dice every round to determine its compulsion: 01-25 acts suspiciously, 26-50 steals something nearby, 51-75 vandalizes something, 76-100 attacks a nearby creature. If a target has no valid option for its rolled result, it instead tries to hide or turn invisible.","source":"Ultimate Intrigue pg. 208"},{"n":"Dahak's Release","l":5,"school":"enchantment ( compulsion ) [ draconic , mind-affecting ]","castingTime":"1 standard action","components":"V, S, M (a dried drop of blood)","range":"touch","target":"creature touched","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You unleash all the target’s anger and destructive urges, causing it to fly into a violent bloodlust. The target attacks creatures as determined by the following table. If a creature is killed or the target is for some reason unable to effectively attack it, roll on the table again to select a new action for the target. d% Behavior 01-25 Target attacks the creature nearest to it. 26-75 Target attacks its nearest ally. 76-100 Target always attacks the last creature to attack it. Beginning on its next turn, the target attacks the subject determined by the chart with a melee weapon, natural weapon, or supernatural ability that deals damage. If necessary, it moves to or charges to the subject in order to make this attack. If it is unable to reach its subject on its next turn, the target uses its turn to get as close as possible to the subject of its bloodlust. The target gains a +2 morale bonus on attack and damage rolls, and cannot use any Charisma-, Dexterity-, or Intelligence-based skills (except Acrobatics, Fly, Intimidate, and Ride) or any abilities that require patience or concentration. This spell is otherwise treated as confusion and rage—any creature immune to confusion or rage is immune to this spell, and any ability or effect that ends confusion or rage (such as calm emotions ) can end this spell. Antipaladins, bloodragers, clerics, and inquisitors who worship Dahak add Dahak’s release to their spell lists as a 4th-level spell.","source":"Legacy of Dragons pg. 28"},{"n":"Deceptive Redundancy","l":5,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes/level or until triggered, then 1 round/level","save":"none","sr":"no","effect":"You create a contingent ward that defies those who would dispel your magic, convincing them that their spell worked. When a spell such as dispel magic would end one of your spells that’s affecting you, you can dismiss deceptive redundancy as an immediate action to attempt an opposed caster level check against the spellcaster. If you succeed, the dispelling effect fails to end your spell, and your spell’s aura becomes difficult to detect for 1 round per caster level. Any divination attempted during this time fails to perceive the spell’s aura unless the caster succeeds at a caster level check (DC = 15 + your caster level). Deceptive redundancy is most effective when hiding auras for spells that don’t have easily perceived effects, rather than visually obvious spells such as enlarge person or fire shield.","source":"Adventurer's Guide pg. 37"},{"n":"Dream Council","l":5,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"unlimited","target":"one or more living creatures","duration":"see text","save":"Will negates","sr":"yes","effect":"This spell functions as dream, but you and the target of your dream can converse in a limited fashion as long as the recipient is also asleep. You can send or receive a number of dream messages equal to your caster level. Each message can be up to 25 words long or a single vague image that can’t convey fine details such as words. You can send and receive these dream messages with a single target or multiple targets, but each message you send or receive counts against the total number of messages allowed. Sending a message takes 1 round. The spell ends and you wake up when you run out of messages.\n\nIf you use dream council to send a message to a sleeping creature that has dream or dream council prepared (or is able to cast it spontaneously or as a spell-like ability), the recipient can expend one of your allotted messages to cast that spell while remaining asleep. This uses up that creature’s prepared spell, spell per day, or spell-like ability use as normal. Instead of replying to your message, that character is able to enter your dreamscape. If the sleeping recipient has the Lucid Dreamer feat, it can enter your dreamscape without casting either of those spells. While in the original caster’s dreamscape, those involved in the council can interact with one another and that dreamscape for 10 minutes for each message remaining. When that time elapses, the spell ends.","source":"Occult Adventures pg. 165"},{"n":"Dream Reality","l":5,"school":"illusion (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level (D)","save":"Will disbelief","sr":"yes","effect":"You cause the target to perceive the world as if in a dream. When the spell ends, the target forgets all identifying details of events that transpired while the spell lasted. The memories were not taken from it; rather, its mind never recorded the memories as real in the first place. If modify memory is cast upon it before the spell ends, the target remembers these events. A target under the effect of lullaby before this spell is cast applies its penalty to the saving throw against this spell.","source":"Inner Sea Intrigue pg. 60"},{"n":"Dream Scan","l":5,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"unlimited","target":"one living creature","duration":"see text","save":"Will negates","sr":"yes","effect":"This spell functions as dream, but rather than sending a message to a sleeping target, you can instead read the target’s thoughts. The target must be asleep for you to perform a dream scan, though if the target isn’t asleep, you can wait in a trance until your target falls asleep. Once the target is asleep, you can concentrate in order to read its surface thoughts as if using detect thoughts. You can continue concentrating for up to 1 minute per caster level.\n\nInstead of reading surface thoughts, you can choose to scan the target’s dreams and subconscious mind for the answers to questions. For every minute you spend concentrating, you can obtain the answer to one question, though the answers might be brief, cryptic, or repetitive. The target is entitled to a new Will save to end the dream scan each time you ask it a question. Otherwise, the creature can attempt a Bluff check with a DC equal to 11 + your Sense Motive modifier. If it fails its Bluff check, you gain the information you desire. If it succeeds at its check, you gain no information. If it succeeds at its check by 5 or more, you misinterpret the target’s dreams— you draw a false conclusion of the target’s choice and believe that wrong answer to be true.\n\nUnlike with dream, you can’t cast this spell on another creature to have it serve as your messenger.","source":"Occult Adventures pg. 165"},{"n":"False Vision","l":5,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (crushed jade worth 250 gp)","range":"touch","target":"40-ft.-radius emanation","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"This spell creates a subtle illusion, causing any divination (scrying) spell used to view anything within the area of this spell to instead receive a false image (as the major image spell), as defined by you at the time of casting. As long as the duration lasts, you can concentrate to change the image as desired. While you aren't concentrating, the image remains static.","source":"PRPG Core Rulebook pg. 280"},{"n":"Feeblemind","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a handful of clay, crystal, or glass spheres)","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"instantaneous","save":"Will negates; see text","sr":"yes","effect":"Target creature's Intelligence and Charisma scores each drop to 1. The affected creature is unable to use Intelligence- or Charismabased skills, cast spells, understand language, or communicate coherently. Still, it knows who its friends are and can follow them and even protect them. The subject remains in this state until a heal, limited wish, miracle, or wish spell is used to cancel the of the feeblemind. A creature that can cast arcane spells, such as a sorcerer or a wizard, takes a -4 penalty on its saving throw.","source":"PRPG Core Rulebook pg. 281"},{"n":"Foe to Friend","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 immediate action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"Cast this spell when an enemy is about to make an attack against an ally. The creature makes the attack against a valid target of your choice instead or the attack is negated. In addition, the target is considered an ally for determining flanking for 1 round.","source":"Advanced Player's Guide pg. 224"},{"n":"Foster Hatred","l":5,"school":"enchantment (compulsion) [emotion]","castingTime":"1 standard action","components":"S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"any number of living creatures, no two of which can be more than 30 ft. apart","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"Deepens existing prejudice toward a creature type you choose (or subtype, for humanoid or outsider). Creatures with a wholly positive view of that type automatically succeed on their save, while creatures with existing racial hatred of it take a -4 penalty. Those who fail become hostile toward every member of the chosen type and interpret that type's actions as maliciously as possible for the duration. You can narrow the target category further, such as worshipers of one deity.","source":"Occult Adventures pg. 172"},{"n":"Grand Destiny","l":5,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one willing creature","duration":"10 minutes/level or until discharged","save":"none (harmless)","sr":"yes (harmless)","effect":"You inspire the target with the power to seize a grand destiny. The target gains a +4 competence bonus that it can choose to apply before rolling any attack roll, caster level check, saving throw
