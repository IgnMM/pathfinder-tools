 2d4 to see how many total HD of creatures you affect. Creatures with fewer HD are affected before creatures with more HD. Only creatures that can see or hear you are affected, but they do not need to understand you to be fascinated.\n\nIf you use this spell in combat, each target gains a +2 bonus on its saving throw. If the spell affects only a single creature not in combat at the time, the saving throw has a penalty of –2.\n\nWhile the subject is fascinated by this spell, it reacts as though it were two steps more friendly in attitude. This allows you to make a single request of the affected creature (provided you can communicate with it). The request must be brief and reasonable. Even after the spell ends, the creature retains its new attitude toward you, but only with respect to that particular request.\n\nA creature that fails its saving throw does not remember that you enspelled it.","source":"PRPG Core Rulebook pg. 298"},{"n":"Ill Omen","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (hair from a black cat)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level or until discharged","save":"none","sr":"yes","effect":"You afflict the target with bad luck. On the next d20 roll the target makes, it must roll twice and take the less favorable result. For every five caster levels you have, the target must roll twice on an additional d20 roll (to a maximum of five rolls at 20th level).  A target who can speak and has at least one free hand and who is aware of the spell and its effects (such as from a Spellcraft check to identify the spell as it is cast) can negate one reroll by spending a move action to utter a brief prayer or good luck charm to appease the spirits of ill fortune.","source":"Advanced Player's Guide pg. 229"},{"n":"Illusion of Calm","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level","save":"Will disbelieve (on hit, see below)","sr":"no","effect":"When casting this spell, you create an illusory double that takes the same space of you. That double makes it look like you are standing still, even when you are not. While under the effects of this spell, you do not provoke attacks of opportunity when you cast a spell, make a ranged attack with a thrown weapon, or move out of your first square during a move action. It does not hide ranged attacks made with any type of projectile weapon.\nWhen a creature hits you with an attack of any type, it gains a saving throw to disbelieve the figment. On a successful saving throw, it successfully disbelieves and the spell’s effect ends for that creature.","source":"Ultimate Combat pg. 231"},{"n":"Implant Urge","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level","save":"Will partial","sr":"yes","effect":"You make the target unconsciously desire a goal you define when you cast this spell. The DC of any Diplomacy check to ask the target to act in a way that it believes will lead it toward that goal decreases by 5. The target takes a –2 penalty on saving throws against mind-affecting effects that compel it to act in a way that it believes will lead it toward that goal. Spells that reveal the target’s goals or thoughts reveal the implanted urge as the target’s most important goal and the target does not register as thinking of anything else as long as it is presented with the focus of its urge or a way to move toward its goal. Anyone studying the target’s thoughts can notice the implanted nature of this urge with a successful caster level check.","source":"Inner Sea Intrigue pg. 60"},{"n":"Innocence","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 minute/level (D)","save":"","sr":"","effect":"You surround yourself with an aura of innocence and trustworthiness. You gain a +10 competence bonus on Bluff skill checks to convince others of your innocence. They find it difficult to believe you capable of any wrongdoing. This bonus does not apply to other uses of the Bluff skill, such as feinting in combat, creating a diversion to hide, or communicating secret messages via innuendo, nor does it apply to any use of the skill to convince anyone of anything other than your complete innocence and blamelessness.","source":"Advanced Player's Guide pg. 229"},{"n":"Instant Portrait","l":1,"school":"conjuration (creation)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"a monochromatic illustration up to 1 square foot in area","duration":"instantaneous","save":"none","sr":"no","effect":"You touch a surface and produce a painted portrait of either yourself or a creature you can see without needing to attempt a Craft (painting) check. The surface to be affected must be relatively flat, such as a piece of paper or a wall. The image can be any color of your choice, but is monochromatic. While it is of too poor a quality to sell, it is otherwise accurate enough to recognize the subject or to serve as a target for the enter image spell. The portrait reflects your perception of the creature depicted, including any disguises, magical or mundane, that the subject is wearing at the time of the painting’s creation. The portrait is only as durable as normal paint and can be removed by mundane means.","source":"Adventurer's Guide pg. 176"},{"n":"Intensify Psyche","l":1,"school":"enchantment [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"A sense of euphoria suffuses the target, amplifying all sensations, good or bad. The target creature gains a +2 competence bonus on Diplomacy, Handle Animal, Perform, and Sense Motive checks. In addition, the DC for any spells or effects with the emotion or pain descriptors cast or caused by the target increases by 1 while the target is under the effects of the spell. However, increased sensitivity causes the target to take a –2 penalty on saving throws against spells and effects with the emotion or pain descriptor.","source":"Heroes of the Darklands pg. 20"},{"n":"Interrogation","l":1,"school":"necromancy [evil, pain]","castingTime":"1 round","components":"V, S","range":"touch","target":"living creature touched","duration":"1 minute/level","save":"Fortitude negates","sr":"yes","effect":"You question the target, backed up by the threat of magical pain. You may ask one question per two caster levels. The target can either answer the question or take 1d4 points of damage plus your Wisdom bonus. The target is not compelled to answer truthfully, but the threat of pain gives it a –4 penalty on Bluff checks to convince you when it is lying.","source":"Ultimate Magic pg. 225"},{"n":"Invigorate","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"V","range":"touch","target":"creature touched","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell banishes feelings of weariness. For the duration, the subject takes no penalties from the fatigued or exhausted conditions. The effect of invigorate is merely an illusion, however, not a substitute for actual rest or respite. When the spell ends, the subject takes 1d6 points of nonlethal damage, along with the return of the original condition(s). A creature can be under the effects of only one invigorate spell at a time; if it is cast a second time on that creature, the first effect immediately ends.","source":"Advanced Player's Guide pg. 230"},{"n":"Jitterbugs","l":1,"school":"illusion (figment) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"short (25 ft. +5 ft. 2/levels)","target":"one creature","duration":"1 round/level","save":"","sr":"","effect":"You cause the target to perceive itself as being covered in creeping, crawling, stinging bugs. This causes the target to become jittery and unable to stay still, forcing it to constantly move and twitch. The target takes a –4 penalty on all Dexterity checks and Dexterity-based skill checks, and cannot take the delay, ready, or total defense actions.","source":"Advanced Race Guide pg. 39"},{"n":"Linked Legacy","l":1,"school":"divination","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"two willing creatures plus another creature per 6 levels, no two of which can be more than 30 feet apart","duration":"10 minutes/level","save":"none","sr":"yes","effect":"This spell helps build community and ensure a shared vision for the future. When any of the affected creatures succeeds at a Knowledge check to answer a question within its field of study or identify a monster and its special powers or vulnerabilities, as a free action the affected creature can share any information gained automatically with all targets of the spell. If any of the targets move out of the spell’s range, the spell ceases to function for all of them until they are all within close range of you again.","source":"Arcane Anthology pg. 9"},{"n":"Lock Gaze","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You compel the target to look at you and only you for the spell’s duration or until the spell is discharged. While staring at you, the target is considered to be averting its eyes from every creature but you, granting creatures other than you concealment against the target’s attacks. If the target willingly leaves your line of sight, it is blinded for 1 round and the spell ends. If you willingly leave the target’s line of sight or become unconscious or dead, the spell creature suffers no ill effects. Blind creatures and creatures immune to gaze attacks are immune to this spell.","source":"Ultimate Combat pg. 236"},{"n":"Magic Aura","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, F (a small square of silk that must be passed over the object that receives the aura)","range":"touch","target":"one touched object weighing up to 5 lbs./level","duration":"1 day/level (D)","save":"none; see text","sr":"no","effect":"You alter an item's aura so that it registers to detect spells (and spells with similar capabilities) as though it were nonmagical, or a magic item of a kind you specify, or the subject of a spell you specify. If the object bearing magic aura has identify cast on it or is similarly examined, the examiner recognizes that the aura is false and detects the object's actual qualities if he succeeds on a Will save. Otherwise, he believes the aura and no amount of testing reveals what the true magic is.\n\nIf the targeted item's own aura is exceptionally powerful (if it is an artifact, for instance), magic aura doesn't work.\n\nNote: A magic weapon, shield, or suit of armor must be a masterwork item, so a sword of average make, for example, looks suspicious if it has a magical aura.","source":"PRPG Core Rulebook pg. 307"},{"n":"Magic Mouth","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (a small bit of honeycomb and jade dust worth 10 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object","duration":"permanent until discharged","save":"Will negates (object)","sr":"yes (object)","effect":"This spell imbues the chosen object or creature with an enchanted mouth that suddenly appears and speaks its message the next time a specified event occurs. The message, which must be 25 or fewer words long, can be in any language known by you and can be delivered over a period of 10 minutes. The mouth cannot utter verbal components, use command words, or activate magical effects. It does, however, move according to the words articulated; if it were placed upon a statue, the mouth of the statue would move and appear to speak. Magic mouth can also be placed upon a tree, rock, or any other object or creature.\n\nThe spell functions when specific conditions are fulfilled according to your command as set in the spell. Commands can be as general or as detailed as desired, although only visual and audible triggers can be used. Triggers react to what appears to be the case. Disguises and illusions can fool them. Normal darkness does not defeat a visual trigger, but magical darkness or invisibility does. Silent movement or magical silence defeats audible triggers. Audible triggers can be keyed to general types of noises or to a specific noise or spoken word. Actions can serve as triggers if they are visible or audible. A magic mouth cannot distinguish alignment, level, Hit Dice, or class except by external garb.\n\nThe range limit of a trigger is 15 feet per caster level, so a 6th-level caster can command a magic mouth to respond to triggers as far as 90 feet away. Regardless of range, the mouth can respond only to visible or audible triggers and actions in line of sight or within hearing distance.\n\nMagic mouth can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 310"},{"n":"Memorize Page","l":1,"school":"enchantment [mind-affecting]","castingTime":"10 minutes","components":"V, S, F (the page to be memorized)","range":"touch","target":"one living creature","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The target gains a perfect memory of the page you used as a focus component. The target can visualize this page as easily as looking at it in person, including minute details visible to close scrutiny by the naked eye. The memory of the page includes text and images, such as a drawing or a map. Someone unfamiliar with the language on the page (or even an illiterate person) could relay what is written simply by copying the shapes of the letters so another person can read them.\n\nThe maximum number of pages that a particular target can memorize through repeated castings of this spell is equal to the target’s Intelligence modifier (minimum 1); any attempts beyond this limit have no effect, although the target’s memory of a page could be erased (using modify memory or a similar effect) to effectively make room for a different one.\n\nA creature that memorizes magical writing (such as a scroll or a page from a spellbook) cannot borrow, duplicate, or retain any of the magic in the writing. However, this would allow a wizard to copy a spell into his spellbook so he could prepare the spell from his book (assuming the spell takes up only one page in a spellbook).","source":"Advanced Class Guide pg. 187"},{"n":"Memory Lapse","l":1,"school":"enchantment [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"You cause the target to forget what happened from the casting of the spell back to the beginning of its last turn. This may allow a retry on a Diplomacy, Intimidate, or opposed skill check, though only with respect to the target, not other creatures that may be present.","source":"Advanced Player's Guide pg. 232"},{"n":"Mental Block","l":1,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You lock access to the target’s procedural memories, preventing it from drawing upon its experience and expertise. The target loses all skill ranks, spells known, and spells prepared, as well as activated feat, extraordinary, supernatural, and spell-like abilities. Each round at the end of the target’s turn, the target can attempt another Will save to end this effect.","source":"Occult Adventures pg. 176"},{"n":"Mindlink","l":1,"school":"divination [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"touch","target":"creature touched","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes","effect":"You link your mind to that of a touched creature to swiftly communicate a large amount of complex information in an instant. You decide what the target learns, limited to any amount of information that otherwise could be communicated in 10 minutes. This information comes in a series of visual images and emotional sensations, and isn’t language-dependent.","source":"Occult Adventures pg. 177"},{"n":"Mirror Mantis","l":1,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S, F (a hand mirror stained with a dried drop of blood)","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"Whenever the target of this spell looks into a mirror or other reflective surface where it can see its own visage clearly, it sees a Red Mantis assassin (in full armor, face hidden by a mantis mask) looking back at it. The reflection is harmless and mimics the target’s motions perfectly; no one else can see this illusion. The first time the target sees the Red Mantis reflection, it must succeed at a Will save be or shaken and take a –2 penalty on saves against fear effects for as long as it can see the altered image and for 3 rounds thereafter. A new save must be attempted each time the creature views its reflection during the spell’s duration. Once a creature successfully saves, it becomes immune to being shaken by the caster’s mirror mantis spell for 24 hours, though it will still see the Red Mantis reflection until the spell ends.","source":"Adventurer's Guide pg. 160"},{"n":"Murderous Command","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"Compels the target to immediately attack its nearest ally with melee or natural weapons, moving or charging as needed to reach it; if that ally is currently unreachable, the target instead spends its turn moving toward it.","source":"Ultimate Magic pg. 230"},{"n":"Obscure Object","l":1,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M/DF (chameleon skin)","range":"touch","target":"one object touched of up to 100 lbs./level","duration":"8 hours (D)","save":"Will negates (object)","sr":"yes (object)","effect":"This spell hides an object from location by divination (scrying) effects, such as the scrying spell or a crystal ball. Such an attempt automatically fails (if the divination is targeted on the object) or fails to perceive the object (if the divination is targeted on a nearby location, object, or person).","source":"PRPG Core Rulebook pg. 317"},{"n":"Obscure Poison","l":1,"school":"abjuration","castingTime":"1 standard action","components":"S, M (herbs used in antitoxin worth 10 gp)","range":"touch","target":"one dose of poison or one venomous creature touched","duration":"1 hour/level","save":"none","sr":"no","effect":"You make the touched poison difficult to detect or identify. Detect poison and similar effects detect an obscured poison only with a successful caster level check against a DC equal to 15 + your caster level (rolled secretly by the GM). Even if the poison is detected, the DC of Craft (alchemy) or Wisdom checks to identify the poison is increased by 10.\nIf cast upon a venomous creature, obscure poison disguises all of the creature’s natural poisons in the same way.","source":"Ultimate Intrigue pg. 220"},{"n":"Obscuring Mist","l":1,"school":"Conjuration (creation)","castingTime":"1 standard action","components":"V, S","range":"20 feet","target":"Cloud spreads in 20-ft. radius from you, 20 ft. high","duration":"1 minute per level (dismissible)","save":"None","sr":"No","effect":"This conjured vapor creates an obscuring effect centered on the caster. The mist impairs vision up to 5 feet away (providing 20% concealment), while obscuring vision completely beyond that range (providing 50% total concealment). The spell's effectiveness can be countered by moderate or strong winds, or dispersed by fire-based spells like fireball or wall of fire. This spell does not function underwater.","source":"Core Rulebook"},{"n":"Opportunistic Loyalty","l":1,"school":"enchantment (compulsion)","castingTime":"1 immediate action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"When a nearby creature casts a beneficial spell that affects allies, you may cast this to count yourself as one of that spell's allies without needing to be manually chosen as a target. This does not increase the number of creatures the triggering spell can affect; if adding you would exceed that spell's normal limit, this spell simply fails.","source":"Pathfinder #115: Trail of the Hunted pg. 75"},{"n":"Paranoia","l":1,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"The target believes everyone it sees is an enemy. The target becomes hostile to all creatures, treating all creatures as enemies and only itself as an ally. The target must attempt attacks of opportunity whenever any creature provokes them. Finally, whenever the target is adjacent to two or more creatures, its paranoia overwhelms it, and it takes a –2 penalty on attack rolls, weapon damage rolls, ability checks, skill checks, and saving throws.","source":"Occult Adventures pg. 179"},{"n":"Polypurpose Panacea","l":1,"school":"transmutation","castingTime":"1 standard action","components":"S","range":"personal","target":"you","duration":"see below","save":"none","sr":"no","effect":"This creates one of several cantrip-level effects relating to your health, well-being, and entertainment. The panacea has no side effects (for example, the intoxication panacea does not cause a hangover). When you use polypurpose panacea, choose one of the following effects.\nAnalgesic: You do not feel minor aches and pains, such as from arthritis, a cold, or a hangover, for 1 hour. For the duration, you gain a +2 resistance bonus against pain-related spells.\nClarity: You get a +1 competence bonus on a single attack roll, saving throw, or skill check within 1 minute. You must choose to use the bonus before making the roll to which it applies.\nHallucination: You have pleasant hallucinations for 1 hour, such as wandering lights, music, playful surreal animals, and so on. You can tell these are not real, but they are distracting, and you take a –2 penalty on Perception checks for the duration.\nIntoxication: You feel comfortably intoxicated for 1 hour, as if you had a few alcoholic beverages.\nLucid Dream: If you take this panacea within 1 hour of going to sleep, you have a lucid dream that is under your control and lasts for an hour.\nResistance: You gain a +1 resistance bonus on saves for 1 minute.\nSleep: You enter a pleasant and restful sleep for at least 1 hour unless wakened. If you would normally begin sleeping at this time, when the panacea ends you continue sleeping normally.\nSobriety: You become completely sober for 1 hour, negating any penalties to your actions for being drunk (GameMastery Guide 237). Magical and alchemical methods (such as detect poison) still detect you as inebriated. Time spent under the effect of this panacea do not count toward the time necessary to sober up (it merely delays your intoxication).\nTenacity: You gain 1 temporary hit point for 1 minute.\nWakefulness: You remain awake for 2 hours without feeling sleepy, and without side effects such as jitteriness. You gain a +5 resistance bonus against sleep-related spells such as lullaby and sleep. This use of the panacea merely delays your need for sleep and does not count as rest or sleep. You can use it multiple times in succession, but as each effect wears off, you are as tired as you would be had you not used the panacea.","source":"Ultimate Magic pg. 232"},{"n":"Psychic Reading","l":1,"school":"divination","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 round","save":"none","sr":"yes","effect":"You are able to read a person’s surface thoughts and take cues from the person’s appearance, body language, and manner of speech to infer a great deal of information about the person, even if that person is in disguise (including polymorph effects). When casting the spell, attempt a DC 20 Sense Motive check with a bonus equal to your caster level. A successful skill check reveals to you one of the following pieces of information of your choice, plus one additional piece of information for every 5 points by which your check result exceeds 20: age, alignment, class†, feats†, gender, native language, place of origin, race or ethnicity, racial traits†, religion, sexual orientation, or training in a Craft, Perform, or Profession skill. For items marked with a cross (†), if the target has more than one of these features, each one you discover counts as a piece of information.\n\nThere’s a 70% chance that all information you receive is correct. This roll is made secretly. Otherwise, on a roll of 71–80, you receive one false piece of information, on a roll of 81–90 you receive two, and on a roll of 91–100 you receive three. You can’t get more false information than the total number of pieces of information you discover.","source":"Occult Adventures pg. 183"},{"n":"Quintessence","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature or object touched","duration":"10 minutes/level (D)","save":"Will negates (harmless) and Will disbelief, see text","sr":"see text","effect":"You draw forth the idealized image of the target creature or object, masking any flaws or damage. An injured or ill creature appears healthy, and a damaged object or one with the broken condition appears intact. However, a corpse masked by quintessence remains obviously dead, and a completely destroyed object can’t be made to seem whole. This illusion has visual and tactile components. Careful examination of or handling the target grants a saving throw to disbelieve, but casual observation does not. Using a broken object for its intended purpose automatically reveals the deception. Appraise checks to assess the value of an object affected by quintessence estimate the value as an item of its type in perfect condition, unless the appraiser disbelieves the illusion.\n\nUnwilling targets can negate the spell’s effect on them with successful Will saves or with spell resistance. Those who interact with the target can attempt Will saves to see through the glamer, but spell resistance doesn’t apply. Quintessence counters and dispels decrepit disguise.","source":"Occult Adventures pg. 184"},{"n":"Ray of Enfeeblement","l":1,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"ray","duration":"1 round/level","save":"Fortitude half","sr":"yes","effect":"A coruscating ray springs from your hand. You must succeed on a ranged touch attack to strike a target. The subject takes a penalty to Strength equal to 1d6+1 per two caster levels (maximum 1d6+5). The subject's Strength score cannot drop below 1. A successful Fortitude save reduces this penalty by half. This penalty does not stack with itself. Apply the highest penalty instead.Mythic Ray of EnfeeblementSource Mythic Adventures pg. 105\nThe Strength penalty increases to 1d8 + 1 per 2 caster levels (maximum +10). If the target fails its save, it’s fatigued.","source":"PRPG Core Rulebook pg. 329"},{"n":"Ray of Sickening","l":1,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a drop of sweat)","range":"close (25 ft. + 5 ft./2 levels)","target":"ray","duration":"1 min./level","save":"Fortitude partial, see text","sr":"yes","effect":"This spell functions as ray of exhaustion, except the target is sickened if it fails its save and unaffected if it makes its save.","source":"Ultimate Magic pg. 234, Dark Markets - A Guide to Katapesh pg. 57"},{"n":"Recharge Innate Magic","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"instantaneous","save":"none","sr":"no","effect":"You channel magic energy into your own aura, recharging your innate magic abilities. You regain one use of all 0-level and 1st-level spell-like abilities you can use as a result of a racial trait.","source":"Advanced Race Guide pg. 39"},{"n":"Remove Fear","l":1,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature plus one additional creature per four levels, no two of which can be more than 30 ft. apart","duration":"10 minutes; see text","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You instill courage in the subject, granting it a +4 morale bonus against fear effects for 10 minutes. If the subject is under the influence of a fear effect when receiving the spell, that effect is suppressed for the duration of the spell.\n\nRemove fear counters and dispels cause fear.","source":"PRPG Core Rulebook pg. 332"},{"n":"Remove Sickness","l":1,"school":"Conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature","duration":"10 minutes/level; see text","save":"Fortitude negates (harmless)","sr":"Yes (harmless)","effect":"You quell feelings of illness and nausea in the target, giving it a +4 morale bonus on saving throws against disease, nausea, and sickened effects. If the subject is already under the influence of one of these effects when receiving the spell, that effect is suppressed for the duration of the spell.","source":"Ultimate Magic"},{"n":"Reveal Secrets","l":1,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a drop of alcoholic liquid)","range":"touch","target":"creature touched","duration":"1 round","save":"Will negates","sr":"yes","effect":"When you cast this spell, you ask the target whether it has a secret about a specific topic that can be described in 10 words or fewer. This can concern a person, place, or thing (such as a town’s mayor, the ring worn by a traveling merchant, or the bridge spanning a nearby river) or an easily distinguished event (such as a historic battle or a recent rash of disappearances). If the target knows a secret about the topic (information it believes isn’t common knowledge and which it would not normally tell you), it states it has a secret. The target doesn’t mention anything about the secret and doesn’t remember telling you it has a secret. If the target succeeds at its saving throw, it isn’t compelled to reveal whether it knows a secret and is aware that you asked.","source":"Inner Sea Temples pg. 63"},{"n":"Shadow Trap","l":1,"school":"illusion (shadow)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"Pins the target's shadow to the ground, leaving it entangled and unable to move more than 5 feet from where the spell was cast; it may attempt a new save each round as a full-round action to break free. A flying target so bound can only hover or descend. The spell fails against creatures that cast no shadow and dissolves in total darkness.","source":"Blood of Shadows pg. 31"},{"n":"Shadowfade","l":1,"school":"illusion (shadow)","castingTime":"1 standard action","components":"V, S, M (a blindfold)","range":"touch","target":"creature touched","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"In areas of darkness, the target of shadowfade is invisible to creatures using darkvision to see. In areas of dim light, the target gains concealment against creatures using darkvision. This spell has no effect in areas of normal light or brighter, and is automatically dispelled if the target enters an area of bright light or takes a hostile action.","source":"Heroes of the Darklands pg. 9"},{"n":"Share Language","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a page from a dictionary)","range":"touch","target":"creature touched","duration":"24 hours","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You can share your facility for one particular language with another creature. For 24 hours the target can read, understand, and communicate to the best of its ability in any one language which you already know. For every 5 levels you possess, you can grant the use of another language you know, to a maximum of 5 languages at 20th level. The target must have the physical capacity to articulate sounds, make gestures, or engage in whatever other method speakers of the language use to communicate with each other in order to actually converse. If the target lacks the mental capacity to grasp an actual language it still gains enough knowledge to respond to and carry out even extremely complex commands or suggestions coached in the language (whether written or spoken). However, since this spell does not endow the target with greater reasoning capacity, merely a temporarily enhanced vocabulary, the person offering up instructions to non-sentient creatures must take care to remove any ambiguity or guesswork.\n\nSimilarly, this spell does not affect the basic nature of the target, or its disposition toward you or anyone else, so convincing it to actually carry out these instructions could require negotiation, threats, or outright bribery.","source":"Advanced Player's Guide pg. 243"},{"n":"Silent Image","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10-ft. cubes + one 10-ft. cube/level (S)","duration":"concentration","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell creates the visual illusion of an object, creature, or force, as visualized by you. The illusion does not create sound, smell, texture, or temperature. You can move the image within the limits of the size of the effect.","source":"PRPG Core Rulebook pg. 343"},{"n":"Sleep","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S, M (fine sand, rose petals, or a live cricket)","range":"medium (100 ft. + 10 ft./level)","target":"one or more living creatures within a 10-ft.-radius burst","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"A sleep spell causes a magical slumber to come upon 4 HD of creatures. Creatures with the fewest HD are affected first. Among creatures with equal HD, those who are closest to the spell's point of origin are affected first. HD that are not sufficient to affect a creature are wasted. Sleeping creatures are helpless. Slapping or wounding awakens an affected creature, but normal noise does not. Awakening a creature is a standard action (an application of the aid another action). Sleep does not target unconscious creatures, constructs, or undead creatures.","source":"PRPG Core Rulebook pg. 344"},{"n":"Songbird","l":1,"school":"conjuration [good]","castingTime":"1 swift action","components":"S","range":"personal","target":"you","duration":"1 round","save":"","sr":"","effect":"You conjure uplifting music from the wilds of Elysium, Heaven, or Nirvana to bolster other musical activities.\n\nIf you cast songbird during the same round in which you attempt a Perform check, songbird acts as accompaniment and grants a +3 bonus on that Perform check.\n\nIf you cast songbird in the same round in which you activate a bardic performance, that round of bardic performance does not count against your total rounds of bardic performance available for the day.\n\nIf you cast songbird in the same round in which you cast a spell with the sonic descriptor, that spell’s save DC increases by 1.","source":"Planar Adventures pg. 44"},{"n":"Sow Thought","l":1,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"You plant an idea, concept, or suspicion in the mind of the subject. The target genuinely believes that the idea is his own, but is not required to act upon it. If the idea is contrary to the target’s normal thoughts (such as making a paladin think, \"I should murder my friends\") the target may suspect mind-altering magic is at play. The idea must be fairly clear, enough so that it can be conveyed in one or two sentences. You do not need to share a common language for the spell to succeed, but without a common language you can only sow the most basic rudimentary ideas.","source":"Advanced Race Guide pg. 185"},{"n":"Speechreader's Sight","l":1,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"1 hour/level (D)","save":"none","sr":"no","effect":"If a creature within 100 feet that you can see is speaking a language you understand, you can read its lips with perfect accuracy. Reading lips in this manner gives the exact wording of conversation and does not assist in deciphering any obfuscated ideas such as secret messages or slang. Reading lips requires moderate concentration, and you take a –4 penalty on other Perception checks while doing so.\nSpeechreader’s sight can be made permanent with a permanency spell cast by a caster of 9th level or higher, at a cost of 2,500 gp.","source":"Heroes of the High Court pg. 10"},{"n":"Telempathic Projection","l":1,"school":"enchantment ( compulsion ) [ emotion , mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 minute/level","save":"Will negates (see text)","sr":"yes","effect":"You alter the target’s mood, adjusting its attitude toward you or another creature you designate by one step either positively or negatively (see the Diplomacy skill on page 94 of the Pathfinder RPG Core Rulebook ). You can instead use this spell to assist your own or an ally’s Bluff, Diplomacy, Intimidate, Perform, or Sense Motive check, granting that check a +5 insight bonus against the target of your telempathic projection with no save. In this case, the spell’s duration expires immediately when the skill check is complete.","source":"Occult Adventures pg. 188"},{"n":"Theft Ward","l":1,"school":"Abjuration","castingTime":"1 standard action","components":"V, S","range":"Touch","target":"One object","duration":"1 day","save":"Will negates (harmless, object)","sr":"Yes (harmless, object)","effect":"You ward a single object in your possession against theft. You gain a +10 bonus on Perception checks to notice someone trying to take the object from you.","source":"Advanced Race Guide"},{"n":"Thought Echo","l":1,"school":"illusion ( glamer )","castingTime":"1 round","components":"V","range":"touch","target":"living creature touched","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"When you cast this spell, you establish a mental echo of up to 25 words. Any attempt to read the surface thoughts of the target creature reads only this mental echo unless the caster succeeds at a caster level check (DC = 11 + your caster level). If you cast thought echo on yourself, the DC is instead equal to 15 + your caster level. In addition, when casting this spell upon yourself, you can change the echoed thoughts by taking a standard action and concentrating. Each time you change the words echoed by the spell in this way, you reduce the spell’s remaining duration by 1 minute. Thought echo does not interfere with telepathy or mind reading effects that are capable of reaching thoughts deeper than surface thoughts.","source":"Occult Adventures pg. 189"},{"n":"Touch of Gracelessness","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 round/level","save":"Fortitude partial","sr":"yes","effect":"With a single touch, you reduce a creature to a fumbling clown. The target takes a penalty to its Dexterity equal to 1d6+1 per two caster levels (maximum 1d6+5). This penalty cannot drop the target’s Dexterity score below 1.\n\nIn addition, if the subject moves more than half its speed, it falls prone. If the subject flies, its maneuverability is reduced by one step (perfect maneuverability becomes good, good becomes average, and so on).\n\nA successful Fortitude save halves the penalty to Dexterity and negates the possibility of falling prone or the reduction to fly maneuverabilities.","source":"Advanced Player's Guide pg. 249"},{"n":"Undetectable Alignment","l":1,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature or object","duration":"24 hours","save":"Will negates (object)","sr":"yes (object)","effect":"An undetectable alignment spell conceals the alignment of an object or a creature from all forms of divination.","source":"PRPG Core Rulebook pg. 363"},{"n":"Unnatural Lust","l":1,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round","save":"Will negates","sr":"yes","effect":"Your target is filled with lust and desire for a single creature or object as designated by you at the time of casting. That creature or object must be within the spell’s range and perceivable by the target of the spell. The target is filled with the compulsion to rush to the subject of its lust and passionately kiss or caress that subject on its next turn, taking no other actions. If the target would not normally have lustful feelings toward the designated creature or object, it receives a +4 bonus on its saving throw.","source":"Ultimate Magic pg. 245"},{"n":"Unprepared Combatant","l":1,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"The target takes a –4 penalty on initiative checks and Reflex saves.","source":"Ultimate Magic pg. 246"},{"n":"Unseen Servant","l":1,"school":"conjuration (creation)","castingTime":"1 standard action","components":"V, S, M (a piece of string and a bit of wood)","range":"close (25 ft. + 5 ft./2 levels)","target":"one invisible, mindless, shapeless servant","duration":"1 hour/level","save":"none","sr":"no","effect":"An unseen servant is an invisible, mindless, shapeless force that performs simple tasks at your command. It can run and fetch things, open unstuck doors, and hold chairs, as well as clean and mend. The servant can perform only one activity at a time, but it repeats the same activity over and over again if told to do so as long as you remain within range. It can open only normal doors, drawers, lids, and the like. It has an effective Strength score of 2 (so it can lift 20 pounds or drag 100 pounds). It can trigger traps and such, but it can exert only 20 pounds of force, which is not enough to activate certain pressure plates and other devices. It can't perform any task that requires a skill check with a DC higher than 10 or that requires a check using a skill that can't be used untrained. This servant cannot fly, climb, or even swim (though it can walk on water). Its base speed is 15 feet.\n\nThe servant cannot attack in any way; it is never allowed an attack roll. It cannot be killed, but it dissipates if it takes 6 points of damage from area attacks. (It gets no saves against attacks.) If you attempt to send it beyond the spell's range (measured from your current position), the servant ceases to exist.","source":"PRPG Core Rulebook pg. 364"},{"n":"Vanish","l":1,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 round/level (up to 5 rounds) (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions like invisibility, except the effect only lasts for 1 round per caster level (maximum of 5 rounds). Like invisibility, the spell immediately ends if the subject attacks any creature.","source":"Advanced Player's Guide pg. 253"},{"n":"Ventriloquism","l":1,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, F (parchment rolled into cone)","range":"close (25 ft. + 5 ft./2 levels)","target":"intelligible sound, usually speech","duration":"1 min./level (D)","save":"Will disbelief (if interacted with)","sr":"no","effect":"You can make your voice (or any sound that you can normally make vocally) seem to issue from someplace else. You can speak in any language you know. With respect to such voices and sounds, anyone who hears the sound and rolls a successful save recognizes it as illusory (but still hears it).","source":"PRPG Core Rulebook pg. 365"},{"n":"Vocal Alteration","l":1,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 minute/level","save":"Fortitude negates","sr":"yes","effect":"You alter the target’s voice to something else. For example, you could make the target’s voice high-pitched, husky, or nasal, or change its accent to an accent you are familiar with. If this spell is used as part of a disguise, the target gets a +10 bonus on the Disguise check when trying to fool a listener.\nThe target can vary the disguised voice just as it could its normal voice. For example, a halfling female given a male dwarf noble’s voice and accent could speak in falsetto, with a rural halfling accent, and so on.","source":"Ultimate Magic pg. 248"},{"n":"Wizened Appearance","l":1,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 hour/level","save":"Fortitude negates","sr":"yes","effect":"You polymorph your target to look like an older version of itself. You select how much older (for example, “10 years older” or “as an adult”). You can’t otherwise change the target’s appearance other than those details directly associated with aging (for example, a target’s hair might turn gray or the target might develop liver spots). This spell allows children of creatures that are Medium or smaller when fully grown to grow one size category to the normal, adult size of that type of creature, but otherwise the selected age increase doesn’t alter the creature’s size. A change in size doesn’t alter the target’s ability scores. This spell doesn’t affect or cause any age-based modifications to ability scores or other age-related effects like dragon age categories or natural metamorphoses.\nWizened appearance and youthful appearanceUM counter and dispel each other.","source":"Ultimate Intrigue pg. 229"},{"n":"Absurdity","l":2,"school":"illusion (phantasm) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"up to one creature/level, no two of which can be more than 30 ft. apart","duration":"1 minute/level (D)","save":"Will negates","sr":"no","effect":"Your targets perceive intimidation and threats as laughably absurd. A character attempting to intimidate your targets is instead perceived as having exaggerated facial features or babbling and awkward speech. Effects that impose fear conditions become objects of ridicule, with the targets making fun of the source of the object as it attempts to scare them.\n\nAbsurdity protects your targets from gaining lesser fear conditions (spooked, shaken, and scared), granting them immunity to spooked and a 50% chance to negate shaken or scared conditions instead of gaining them from any effect, including uses of the Intimidate skill to demoralize. Any other effect related to a spell or ability that generates fear (such as dying from a phantasmal killer) affects them normally, and effects that ignore immunity to fear also ignore absurdity.\n\nHowever, target creatures also have serious difficulty noticing potential threats; they take a –10 penalty on Sense Motive checks to avoid surprise or to notice that a creature is actively threatening or malicious and a –2 penalty on initiative checks. The spell doesn’t prevent spells or effects that provide early warning or a form of danger sense (like anticipate perilUM or find traps) from alerting the affected character to danger.","source":"Horror Adventures pg. 108"},{"n":"Alpha Instinct","l":2,"school":"enchantment (charm) [mind-affecting]","castingTime":"10 minutes","components":"V, S, M (a bit of musk from an alpha wolf or another socially dominant animal)","range":"personal","target":"you","duration":"1 hour/level (D)","save":"","sr":"","effect":"Animals perceive you as a social superior. The starting attitude of animals you interact with improves by one step, and you gain a +2 morale bonus on Handle Animal checks. Helpful animals provide simple assistance (such as using the aid another action on skill checks they understand) as long as the spell lasts, but they flee from attacks and do not support you in combat. At one point during the spell’s duration, you can issue a nonverbal command to helpful animals within 60 feet to forage for you; the animal or animals immediately head out into the wilderness to do just that. After 1 hour, the animals return to the location where you issued the command to make you an offering of edible food sufficient for one meal for you and a number of others equal to your caster level.","source":"Ultimate Wilderness pg. 227"},{"n":"Alter Self","l":2,"school":"transmutation (polymorph)","castingTime":"1 standard action","components":"V, S, M (a piece of the creature whose form you plan to assume)","range":"personal","target":"you","duration":"1 min./level (D)","save":"none","sr":"no","effect":"When you cast this spell, you can assume the form of any Small or Medium creature of the humanoid type. If the form you assume has any of the following abilities, you gain the listed ability: darkvision 60 feet, low-light vision, scent, and swim 30 feet.\nSmall creature: If the form you take is that of a Small humanoid, you gain a +2 size bonus to your Dexterity.\nMedium creature: If the form you take is that of a Medium humanoid, you gain a +2 size bonus to your Strength.","source":"PRPG Core Rulebook pg. 240"},{"n":"Animal Messenger","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 minute","components":"V, S, M (a morsel of food the animal likes)","range":"close (25 ft. + 5 ft./2 levels)","target":"one tiny animal","duration":"1 day/level","save":"none; see text","sr":"yes","effect":"You compel a Tiny animal to go to a spot you designate. The most common use for this spell is to get an animal to carry a message to your allies. The animal cannot be one tamed or trained by someone else, including such creatures as familiars and animal companions.\n\nUsing some type of food desirable to the animal as a lure, you call the animal to you. It advances and awaits your bidding. You can mentally impress on the animal a certain place well known to you or an obvious landmark. The directions must be simple, because the animal depends on your knowledge and can't find a destination on its own. You can attach a small item or note to the messenger. The animal then goes to the designated location and waits there until the duration of the spell expires, whereupon it resumes its normal activities.\n\nDuring this period of waiting, the messenger allows others to approach it and remove any scroll or token it carries. The intended recipient gains no special ability to communicate with the animal or read any attached message (if it's written in a language he doesn't know, for example).","source":"PRPG Core Rulebook pg. 241"},{"n":"Animal Trance","l":2,"school":"enchantment (compulsion) [mind-affecting, sonic]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"animals or magical beasts with Intelligence 1 or 2","duration":"concentration","save":"Will negates","sr":"yes","effect":"Your swaying motions and music (or singing, or chanting) compel animals and magical beasts to do nothing but watch you. Only a creature with an Intelligence score of 1 or 2 can be fascinated by this spell. Roll 2d6 to determine the total number of HD worth of creatures that you fascinate. The closest targets are selected first until no more targets within range can be affected.","source":"PRPG Core Rulebook pg. 241"},{"n":"Animus Mine","l":2,"school":"abjuration [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"","duration":"1 hour/level or until discharged","save":"Will negates (harmless)","sr":"no","effect":"You implant a mental mine within your psyche that triggers against anyone attempting to manipulate your thoughts. Any creature that uses a mind-affecting effect against you triggers the mine, causing psychic backlash against the offending creature. This backlash deals 1d6 points of damage per caster level (maximum 10d6) and staggers the target for 1d4 rounds. If the target succeeds at a Will saving throw, it takes only half damage and negates the staggered effect. The mine does not disrupt the mind-affecting effect that triggered the spell. You can use a swift action to suppress the trigger of your mine for 1 round to allow someone to use a mind-affecting effect on you. You can have only one mental mine active at a time.","source":"Heroes of the Darklands pg. 20"},{"n":"Anonymous Interaction","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"permanent (see text)","save":"Will negates","sr":"yes","effect":"You cause the targets to forget all but the most general information about you. If they saw you or interacted with you, they still remember your presence and your general shape (such as humanoid), as well as the gist of your interactions with them (such as “She was asking about the queen”), but they don’t remember specifically what you said, details of your appearance, or any identifying information about you. This spell targets any memories of you in the minute preceding its casting, but is otherwise permanent.","source":"Advanced Class Guide pg. 174"},{"n":"Anticipate Thoughts","l":2,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will partial","sr":"yes","effect":"This spell taps into the target’s mind so you get an impression of the actions it will take. You gain a +2 insight bonus to AC against the target’s attacks. If the target fails its Will save, you also see how the target will react to your attacks, and the bonus applies on your attack rolls and damage rolls against the target. These bonuses apply only while the target is within range of the spell, though if it goes out of range, the bonuses return once it’s back in range. Whenever the target misses you with an attack, the spell’s bonuses increase by 1 until the spell ends (to a maximum of +5).","source":"Occult Adventures pg. 157"},{"n":"Apport Object","l":2,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V","range":"touch","target":"one touched object of up to 1 lb. and 1 cu. ft.","duration":"instantaneous or 1 hour/level","save":"Will negates (object)","sr":"yes (object)","effect":"This spell allows you to instantaneously transport a small nonliving object from one location to another. There are two ways to use the spell: sending allows you to immediately send an object held in your hands to a nearby location, while receiving permits you to cast the spell ahead of time on an object and summon it to your location at a later time.\n\nSending: If you choose to send the object elsewhere, the spell functions like teleport object, except the size of the object is limited and the distance it can travel is equal to only 25 feet + 5 feet per 2 levels. You can’t transport an object to the Ethereal Plane. You can send the held object to any square within range, and you don’t need line of sight to the target location. You can place the object in the open or inside a container, a pocket, or even someone’s hand. If there isn’t room in the space you select (either because the space chosen is too small or because there is already something else there), or if the person doesn’t want or isn’t expecting the object in his hands, it appears on the ground within the target’s square instead. You can transport the object to an elevation above the floor as long as the destination is within the spell’s total distance limit.\n\nReceiving: You can prepare an object ahead of time to apport it to yourself by casting the spell upon it and assigning a mental trigger to complete the spell. You don’t need line of sight to the object to apport it to you, but the object must be within a distance equal to 25 feet + 5 feet per 2 levels. Completing the spell is a swift action that has the same restrictions as a thought spell component. You can apport an object in this way even if someone holding the object is unwilling to let you take it. Once you apport the object, the spell ends.\n\nYou can’t send or receive an object into a space that is protected by an antimagic field, globe of invulnerability, or similar effect that keeps magical effects out; if you attempt to do so, the spell is lost.","source":"Occult Adventures pg. 157"},{"n":"Aversion","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level","save":"Will partial","sr":"yes","effect":"You plant a revulsion in the mind of the subject, causing her to avoid an object or location. You must choose a specific object or place. A location chosen in this way can be no larger than a cube measuring 50 feet on a side. The aversion is entirely in the target’s mind, so the chosen object or location itself isn’t subject to any magical effect. If the target fails her saving throw, she can’t come within 60 feet of the chosen object or place. She makes every reasonable effort to avoid the object of the aversion, but will not put herself in danger in order to maintain the aversion. For example, if the object of the aversion is a bridge but a forest fire is closing in and will likely kill the target, she ignores the aversion and crosses the bridge to save herself. If the target must ignore the conditions of the aversion, she is nauseated until she is no longer violating the aversion.\n\nIf the target succeeds at her saving throw, she is instead sickened while within 60 feet of the object or place, but isn’t compelled to stay away from it.","source":"Occult Adventures pg. 158"},{"n":"Babble","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature; see text","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"This spell causes the target to break into a fit of bizarre, uncontrollable babbling. The target also becomes nauseated. If the target succeeds at its save, the effects end. If not, the creature continues babbling and is nauseated for the entire duration.\n\nCreatures within 30 feet of the subject that can hear the target’s babbling must succeed at a Will save or become fascinated for as long as the babbling persists. Once a creature’s fascination ends, it can’t become fascinated by the same instance of babble again.\n\nCreatures with an Intelligence score of 2 or lower aren’t affected by this spell.","source":"Occult Adventures pg. 158"},{"n":"Bestow Insight","l":2,"school":"enchantment (compulsion)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one creature touched","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"When casting this spell, choose a single skill that you have at least one rank in. The target gains a +2 insight bonus on skill checks with this skill and is considered trained in that skill. The insight bonus increases by 1 for every four levels of the caster (maximum +6). Furthermore, once before the spell’s duration, the target can choose to roll two checks and take the greater result. Doing so ends the spell’s other effects.","source":"Advanced Race Guide pg. 69"},{"n":"Blindness/Deafness","l":2,"school":"necromancy [curse]","castingTime":"1 standard action","components":"V","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"permanent (D)","save":"Fortitude negates","sr":"yes","effect":"Inflicts either blindness or deafness (your choice at casting) on the target with a failed save.","source":"PRPG Core Rulebook pg. 250"},{"n":"Blistering Invective","l":2,"school":"evocation [fire, language-dependent]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"30-ft. radius","duration":"instantaneous","save":"Reflex partial, see text","sr":"special, see below","effect":"You unleash an insulting tirade so vicious and spiteful that enemies who hear it are physically scorched by your fury. When you cast this spell, make an Intimidate check to demoralize each enemy within 30 feet of you. Enemies that are demoralized this way take 1d10 points of fire damage and must succeed at a Reflex save or catch fire. Spell resistance can negate the fire damage caused by this spell, but does not protect the creature from the demoralizing effect.\nMythic Blistering Invective\n##Source## Mythic Adventures pg. 86\nEnemies that are demoralized by your Intimidate check take 2d8 points of fire damage and catch fire (no saving throw). Any Reflex save attempted to extinguish the flames automatically fails as long as the creature remains demoralized by your Intimidate check.\nAugmented (5th): If you expend two uses of mythic power, the spell doesn’t have the language-dependent descriptor and you don’t take a penalty on your Intimidate check to demoralize creatures that are larger than you.","source":"Ultimate Combat pg. 224"},{"n":"Blood in the Water","l":2,"school":"Necromancy [emotion]","castingTime":"1 standard action","components":"V, S, DF","range":"20 ft.","target":"20-ft.-radius emanation centered on you","duration":"1 round/level","save":"Will negates (harmless)","sr":"Yes (harmless)","effect":"As part of the casting of this spell, you must deal 1 point of piercing or slashing damage to yourself to release your blood. This causes you to take 1 point of bleed damage. While the spell is in effect, all sharks, feeders in the depths, and creatures with the blood frenzy ability in the area gain a +2 bonus to Strength and Constitution and take a -2 penalty to AC. This is treated as blood frenzy for the purposes of other feats and effects, and doesn't stack with the effects of actual blood frenzy. If you cease bleeding, the spell immediately ends.","source":"Monster Codex"},{"n":"Blur","l":2,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V","range":"touch","target":"creature touched","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"The subject's outline appears blurred, shifting, and wavering. This distortion grants the subject concealment (20% miss chance).\nA see invisibility spell does not counteract the blur effect, but a true seeing spell does.\nOpponents that cannot see the subject ignore the spell's effect (though fighting an unseen opponent carries penalties of its own).","source":"PRPG Core Rulebook pg. 251"},{"n":"Build Trust","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S, M (a gold piece)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level; see text","save":"Will negates","sr":"yes","effect":"You get a sense of the best way to interact with the target in order to encourage positive regard and fellowship toward you. You gain a +2 circumstance bonus on all Charisma checks and Charisma-based skill checks you attempt when interacting with the target. In addition, whenever you fail a Charisma check or Charisma-based skill check when interacting with the target, you can reroll the check as an immediate action. Attempting this reroll grants the target a new saving throw to end the spell. The target doesn’t become hostile to you when the spell ends, but it does become disillusioned of its new trust in you. Attacking the target or taking an obvious hostile action against it automatically ends the spell.\n\nIf you are using the contacts rules (Ultimate Campaign 148), your trust score with the target increases by 1 for the duration of the spell. If you’re using the individual influence system (see pages 102–109), if the target fails its initial saving throw you learn one of its influence skills, strengths, or weaknesses as though you had succeeded at a discovery check.","source":"Ultimate Intrigue pg. 205"},{"n":"Burning Gaze","l":2,"school":"evocation [fire]","castingTime":"1 standard action","components":"V, S, M/DF (eye of a mundane salamander)","range":"personal","target":"you","duration":"1 round/level","save":"Fortitude negates (see text)","sr":"yes","effect":"Your eyes burn like hot coals, allowing you to set objects or foes alight with a glance.\n\nAs a standard action as long as this spell’s effects persist, you may direct your burning gaze against a single creature or object within 30 feet of your location. Targeted creatures must succeed at a Fortitude save or take 1d6 points of fire damage. Unattended objects do not get a save. Creatures damaged by the spell must make a Reflex save or catch fire. Each round, burning creatures may attempt a Reflex save to quench the flames; failure results in another 1d6 points of fire damage. Flammable items worn by a creature must also save or take the same damage as the creature. If a creature or object is already on fire, it suffers no additional effects from burning gaze.\n\nNote that this spell does not grant an actual gaze attack—foes and allies are not in danger of catching on fire simply by meeting your gaze.Mythic Burning GazeSource Mythic Adventures pg. 87\nYou may focus your burning gaze on a creature or object as a move action instead of as a standard action. The target takes 1d8 points of fire damage for failing its save and for each round it’s on fire.\n\nAugmented: If you expend two uses of mythic power, once during the spell’s duration you can, as a full-round action, direct your burning gaze at up to one creature per caster level.","source":"Advanced Player's Guide pg. 208"},{"n":"Calm Emotions","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"medium (100 ft. + 10 ft./level)","target":"creatures in a 20-ft.-radius spread","duration":"concentration, up to 1 round/level (D)","save":"Will negates","sr":"yes","effect":"This spell calms agitated creatures. You have no control over the affected creatures, but calm emotions can stop raging creatures from fighting or joyous ones from reveling. Creatures so affected cannot take violent actions (although they can defend themselves) or do anything destructive. Any aggressive action against or damage dealt to a calmed creature immediately breaks the spell on all calmed creatures.\n\nThis spell automatically suppresses (but does not dispel) any morale bonuses granted by spells such as bless, good hope, and rage, and also negates a bard's ability to inspire courage or a barbarian's rage ability. It also suppresses any fear effects and removes the confused condition from all targets. While the spell lasts, a suppressed spell, condition, or effect has no effect. When the calm emotions spell ends, the original spell or effect takes hold of the creature again, provided that its duration has not expired in the meantime.","source":"PRPG Core Rulebook pg. 252"},{"n":"Castigate","l":2,"school":"enchantment (compulsion) [emotion, fear, language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round/level or 1 round; see text","save":"Will partial","sr":"yes","effect":"You compel the target to beg for forgiveness. On a failed save, the target cowers with fear. On a successful save, it is shaken for 1 round. Each round on its turn, a cowering subject may attempt a new save to end the effect. A creature who worships the same god as you takes a –2 penalty on its saving throw.","source":"Advanced Player's Guide pg. 210"},{"n":"Cat's Grace","l":2,"school":"transmutation","castingTime":"1 standard action","components":"V, S, M (pinch of cat fur)","range":"touch","target":"creature touched","duration":"1 min./level","save":"Will negates (harmless)","sr":"yes","effect":"The transmuted creature becomes more graceful, agile, and coordinated. The spell grants a +4 enhancement bonus to Dexterity, adding the usual benefits to AC, Reflex saves, and other uses of the Dexterity modifier.","source":"PRPG Core Rulebook pg. 252"},{"n":"Catatonia","l":2,"school":"necromancy","castingTime":"1 standard action","components":"S","range":"touch","target":"willing creature touched","duration":"1 hour/level (D)","save":"none","sr":"yes","effect":"You touch the target and place it into a deathlike state that persists for the duration. The target appears to be dead, and any creature that interacts with the target must succeed at a DC 20 Heal check to recognize it is actually alive.\nUntil the spell ends, the target counts as if it were dead for the purpose of resolving any effects that target or affect only living creatures, but it doesn’t count as undead. The subject is helpless, and can still be killed normally.\nAny effect that would bring the creature back to life or animate it as an undead fails, but ends the catatonia. The target can be affected by spells that affect only objects, including animate objects (if the creature is Small) and teleport object. However, anything that would cause the body to change form (such as shrink item) fails and ends the catatonia. This doesn’t prevent the effects of spells that simply deal damage or otherwise destroy objects.","source":"Occult Adventures pg. 161"},{"n":"Codespeak","l":2,"school":"transmutation","castingTime":"1 standard actino","components":"V, S, M (a complex rune inscribed on a slip of paper that is then placed under your tongue)","range":"close (25 ft. + 5 ft./2 levels)","target":"you plus one willing creature per 2 levels, no two of which can be more than 30 ft. apart","duration":"10 min./level (D)","save":"none","sr":"no","effect":"Upon casting this spell, all recipients gain the ability to speak a new language. This language sounds like random, babbling syllables to anyone not under the influence of the spell, but the targets understand each other perfectly.\n\nAnyone using codespeak can read and write in this new language as well. Once the spell expires, however, any coded writing suddenly appears as gibberish. If the exact same group of individuals become the targets of a codespeak spell again, cast by the same caster, they can once again read any coded writings. A dedicated codebreaker can crack such writing’s code, deciphering it one page at a time with a series of DC 30 Linguistics checks.\n\nComprehend languages doesn’t enable a caster to understand the language of another’s codespeak spell, but it does reveal that the targets are speaking a magical language. Tongues translates codespeak normally.","source":"Ultimate Intrigue pg. 206, Second Darkness Player's Guide pg. 26, Black Markets pg. 24"},{"n":"Cognitive Block","l":2,"school":"enchantment ( compulsion ) [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You create a mental block in the target’s mind, impeding the flow of his mental spellcasting process and forcing him to incorporate a thought component into any spell or spell-like ability he uses. This is in addition to any other components the spell already requires, and doesn’t replace the verbal component. Spell-like abilities require this thought component, even though they normally don’t need spell components. As usual with thought components, this addition increases the DC of any concentration checks the target attempts by 10 unless the target takes a move action to center his mind and satisfy the spell’s thought component.","source":"Occult Adventures pg. 161"},{"n":"Commune with Birds","l":2,"school":"divination","castingTime":"1 standard action","components":"V, S","range":"personal","target":"you","duration":"10 minutes; see text","save":"","sr":"","effect":"You utter a question in the form of a low-pitched bird call that can be heard up to a mile away, and can understand the responses given by birds in the area. Over the next 10 minutes, the birds reply as if you had asked them the question using speak with animals, giving you a general consensus answer to the question based on their knowledge. For example, you could ask if there is drinkable water in the area, the location of predators or other creatures, directions to a mountaintop or other natural feature, and so on, and the local bird communities would answer to the best of their ability.\n\nIf there are no birds in range, the spell has no effect and you do not get a response. Any creature using speak with animals (or a similar ability) who hears this bird call can understand your question, though it may not be able to reply in a way you can hear.","source":"Advanced Race Guide pg. 167"},{"n":"Compassionate Ally","l":2,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"At the sight of an injured ally, the target immediately disengages from its current course of action and rushes to provide aid. If the target possesses curative spells or magic items, it utilizes them to help the injured ally. If not, the target provides aid by performing a Heal check. The target remains with the injured ally to assure her safety and refuses to leave the ally’s side until her wounds are fully treated or the spell ends, but can otherwise defend itself and make attacks.","source":"Ultimate Magic pg. 211"},{"n":"Conditional Favor","l":2,"school":"abjuration","castingTime":"1 swift action","components":"V","range":"touch","target":"one creature","duration":"1 day/level (D)","save":"none; see text","sr":"yes","effect":"Cast immediately before an abjuration, conjuration (healing), enchantment, or transmutation spell on the same willing target, binding that spell's benefit to an oath or prohibition you set. If the target knowingly violates the condition, the paired spell's effect is undone (restoring any damage healed, conditions cured, or ability scores restored, as applicable). The spell judges intent, so accidents or unforeseeable circumstances do not trigger the reversal, and the subject intuitively senses when an action would break the condition.","source":"Ultimate Intrigue pg. 206"},{"n":"Confess","l":2,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, S, DF","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round","save":"Will partial, see text","sr":"yes","effect":"You ask the target creature a single question. On the subject’s next action, it must answer truthfully in the same language as the question or take 1d6 points of damage per two caster levels (maximum 5d6) and be sickened for 2d4 rounds. A successful Will save negates the sickening effect and halves the damage. A creature that is unable to answer still takes damage.","source":"Advanced Player's Guide pg. 212"},{"n":"Crafter's Nightmare","l":2,"school":"necromancy (haunted) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a broken tool)","range":"close (25 ft. + 5 ft./2 levels)","target":"one 5-ft. cube/level (S)","duration":"1 day/level (D)","save":"Will negates","sr":"yes","effect":"You concentrate feelings of competitiveness, envy, and ill will into a poltergeist-like haunt that wreaks havoc on its victim’s long-term endeavors. Every time a creature in the affected area attempts a Craft or Profession check to generate income, create an item, or earn capital (Pathfinder RPG Ultimate Campaign 85), any skill check required for crafting or repairing a magic item, or any skill check required for an occult ritual (Pathfinder RPG Occult Adventures 208), the haunt imposes a –5 penalty on the check. If the creature fails its check by 5 or more, the haunt’s mischief deals 1d6 points of damage to the creature in addition to any other negative effects from such a failure. If the creature attempts to cast a spell with a casting time of 1 minute or longer, the haunt becomes similarly disruptive, requiring the caster to succeed at a concentration check (DC = 15 + spell level) or lose the spell and take 1d6 points of damage from the mischief. Each time the haunt is disruptive, the spell’s haunt-like manifestation occurs during that round.\n\nHaunt StatisticsNotice Perception DC 20 (to hear faint, sinister laughter)\nhp 2 hp/level; Trigger skill check or spell; Reset none","source":"Haunted Heroes Handbook pg. 27"},{"n":"Daze Monster","l":2,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a pinch of wool or similar substance)","range":"medium (100 ft. + 10 ft./level)","target":"one living creature of 6 HD or less","duration":"1 round","save":"Will negates","sr":"yes","effect":"This spell functions like daze, but can affect any one living creature of any type. Creatures of 7 or more HD are not affected.","source":"PRPG Core Rulebook pg. 264"},{"n":"Deflect Blame","l":2,"school":"enchantment (compulsion) [mind-affecting]","
