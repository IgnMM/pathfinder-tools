. The illusion isn’t a functional item, nor does it have any magical properties of the original. For example, an instant fake of a set of thieves’ tools can’t be used to pick a lock, a false warhammer can’t harm a person or break an object, a suit of unreal chainmail offers no actual protection, and an illusory potion of cure light wounds doesn’t heal any hit points when imbibed.","source":"Ultimate Intrigue pg. 217"},{"n":"Inveigle Person","l":3,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V, M (a drop of alcohol)","range":"close (25 ft. + 5 ft./2 levels)","target":"one humanoid creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"You cause the target to become extremely amiable. The target treats all other living creatures as if it were friendly toward them. Any overtly hostile or harmful act toward the target by any living creature ends the spell.\n\nAn inveigled creature attempts to fulfill multiple requests in the same manner as it would favors for its true friends. If such requests conflict, it usually chooses the more reasonable option—overriding this preference requires succeeding at an opposed Charisma check, as if under multiple forms of mental control (Pathfinder RPG Core Rulebook 209).","source":"Inner Sea Intrigue pg. 60"},{"n":"Invigorate, Mass","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V","range":"touch","target":"creatures touched, up to one/level","duration":"10 minutes/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell works as invigorate, except that it affects multiple creatures.","source":"Advanced Player's Guide pg. 230"},{"n":"Invisibility Bubble, Giant","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M (needle from a sea urchin)","range":"touch","target":"10-ft..-radius emanation centered on the touched creature's space","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This functions as per invisibility bubble, but the bubble is larger, which allows you to target a creature of up to size Gargantuan, or allows more creatures into the bubble.","source":"Aquatic Adventures pg. 60"},{"n":"Invisibility Sphere","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, M","range":"personal or touch","target":"10-ft.-radius emanation around the creature","duration":"1 min./level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"This spell functions like invisibility, except that this spell confers invisibility upon all creatures within 10 feet of the recipient at the time the spell is cast. The center of the effect is mobile with the recipient.\n\nThose affected by this spell can see each other and themselves as if unaffected by the spell. Any affected creature moving out of the area becomes visible, but creatures moving into the area after the spell is cast do not become invisible. Affected creatures (other than the recipient) who attack negate the invisibility only for themselves. If the spell recipient attacks, the invisibility sphere ends.","source":"PRPG Core Rulebook pg. 302"},{"n":"Irregular Size","l":3,"school":"transmutation [curse]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"permanent","save":"Fortitude negates","sr":"yes","effect":"Curses a creature so that one set of limbs (arms, legs, or wings, your choice) shrivels. Shriveled arms make the creature treated as one size smaller for wielding weapons and reduce natural arm attack damage; shriveled legs reduce base speed by 10 feet (minimum 5) and its Strength score counts as 4 lower for carrying capacity; shriveled wings reduce fly speed by 10 feet (minimum 5), reduce wing attack damage, and worsen fly maneuverability by one step (minimum clumsy).","source":"Magic Tactics Toolbox pg. 21"},{"n":"Isolate","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"1 round/level (D)","save":"Will partial","sr":"yes","effect":"Renders the target invisible and silent, but only as far as its allies are concerned; enemies and indifferent creatures perceive it normally. The target can still see and hear itself, cast spells with verbal components, and use command words, but any effect requiring an ally to see or hear it fails. A successful save limits the duration to 1 round.","source":"Monster Codex pg. 21"},{"n":"Jester's Jaunt","l":3,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"one living creature","duration":"instantiations","save":"Will negates","sr":"yes","effect":"You teleport the target to a space you can see within 30 feet of the target. The destination must be on solid ground, and the teleportation cannot end in a space that is by nature hazardous to the creature you are teleporting.","source":"Advanced Player's Guide pg. 230"},{"n":"Loathsome Veil","l":3,"school":"illusion (pattern) [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a tangle of multicolored threads)","range":"close (25 ft. + 5 ft./2 levels)","target":"transparent pattern 40 ft. long, 20 ft. high","duration":"concentration + 1 round/level (D)","save":"Will negates","sr":"yes","effect":"This spell creates a transparent veil of shifting, multicolored strands of light that form into endlessly varied and alien patterns. One side of the veil, chosen by you at the time of casting, is harmless. The other side twists and turns into impossible shapes, affecting any creature with 60 feet who views the veil. The veil affects a maximum of 24 Hit Dice of creatures. Creatures with the fewest HD are affected first.  Among creatures with equal HD, those who are closest to the spell are affected first. The effect is according to the creature's HD.  4 HD or fewer: The creature is nauseated while it can see the veil, nauseated for 1d4 rounds after it last saw the veil, then sickened for 2d4 rounds after it last saw the veil.  8 HD or fewer: The creature is nauseated for 1d4 rounds, sickened while it can see the veil, then sickened for 1d4 rounds after it last saw the veil.  9 or more HD: The creature is sickened while it can see the veil.  A successful saving throw ignores all effects of the veil.  Sightless creatures are not affected by loathsome veil.  Affected creatures can avert or close their eyes to avoid seeing the veil, similar to avoiding a gaze attack.  Loathsome veil can be made permanent with the permanency spell by a caster of 10th level or higher for the cost of 7,500 gp.","source":"Ultimate Magic pg. 227"},{"n":"Magic Aura, Greater","l":3,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S, F (a woolen handkerchief)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature, or one object weighting up to 20 lbs./level","duration":"1 day/level (D)","save":"none (see text)","sr":"no","effect":"If cast on an object, this spell functions as magic aura, except that if you have identified the unique spellcasting signatures of a specific individual with greater detect magic or a similar spell, you can make the magic aura appear to have been created by that individual. Alternatively, you can simply obscure all identifiers, making it more difficult to determine who cast the spell. In either case, if the object is the subject of a greater detect magic spell, any Spellcraft check made to identify the unique spellcasting identifiers of the aura automatically produce the result you chose unless the observer disbelieves the spell with a successful Will save (as with magic aura, however, detect spells don’t grant a save to disbelieve).\n\nIf cast on a creature, you can make that creature register to detect spells (and spells with similar capabilities) as though it were the subject of any number of spells that you specify, when the spell is cast. Alternatively, you can make the creature register as nonmagical, hiding all spell effects that he is currently affected by from such scrutiny. If you choose to make the creature register as being the subject of one or more spells, you can also alter the unique spellcasting identifiers of those spell auras, in the same fashion as described for objects.\n\nIf the target is a creature, you can also alter how the creature registers to arcane sight, making the creature appear to have or not have spellcasting or spell-like abilities, whether those abilities are arcane, divine, or psychic in nature, and the strength of the most powerful spell or spell-like ability they currently have available for use. Similarly, you can alter the way the target appears when viewed with greater detect magic, causing the last spell that he cast to seem to be any spell of your choice.","source":"Ultimate Intrigue pg. 219"},{"n":"Major Image","l":3,"school":"illusion (figment)","castingTime":"1 standard action","components":"V, S, F (a bit of fleece)","range":"long (400 ft. + 40 ft./level)","target":"visual figment that cannot extend beyond four 10-ft. cubes + one 10-ft. cube/level (S)","duration":"concentration + 3 rounds","save":"Will disbelief (if interacted with)","sr":"no","effect":"This spell functions like silent image, except that sound, smell, and thermal illusions are included in the spell effect. While concentrating, you can move the image within the range.\n\nThe image disappears when struck by an opponent unless you cause the illusion to react appropriately.","source":"PRPG Core Rulebook pg. 311"},{"n":"Malicious Spite","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (powdered turquoise worth 150 gp)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 day/level","save":"Will negates","sr":"yes","effect":"You invoke feelings of a driving malicious intent. The target’s malice is directed at a second individual as designated by you at the time of casting. Thereafter, the target attempts to slander, abuse, and even plot murder against the target of its spite. This loathing is not overt, and the target’s actions against the object of its spite remain subtle and indirect. The enchanted target remains within its financial and ethical means when acting against the second individual, though the malice toward this other person pushes the target to the limit of what it would do to a hated individual.\n\nEach day, the target takes 2 points of Wisdom damage as the all-encompassing spite dominates its thoughts. The target can only alleviate the ability damage by acting upon the emotion and performing a spiteful act. Examples of spiteful acts are spiking the target’s drink to make it an easier target for thugs, damaging the target’s property, starting foul rumors about the target, framing the target for a crime, paying lepers or beggars to accost the target, extorting or blackmailing the target, or arranging for others to physically harm the target.\n\nWhen the spell ends, the target remembers the spiteful behavior, but not the motivation for it.","source":"Ultimate Magic pg. 228"},{"n":"Marionette Possession","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S, F (a piece of paper with the target’s name)","range":"medium (100 ft. + 10 ft./level)","target":"one willing creature","duration":"10 minutes/level or until you return to your body","save":"Will negates (see text)","sr":"yes","effect":"You project your soul out of your body and into the body of a willing creature. This possession is blocked by protection from evil or a similar ward. The target’s soul shares its body with you; it is helpless but can still use its senses. You and the target’s soul can communicate telepathically as if using a common language.\nYou keep your Intelligence, Wisdom, Charisma, level, class, base attack bonus, base save bonuses, alignment, and mental abilities. The body retains its Strength, Dexterity, Constitution, hit points, natural abilities, and natural attacks (such as a bite or sting). A body with extra limbs does not allow you to make more attacks (or more advantageous two-weapon attacks) than normal. You can’t choose to activate the body’s extraordinary, spell-like, or supernatural abilities.\nAs a standard action, you can return to your own body, ending the spell. While your soul is possessing the target, your body is helpless. If the host body is slain, you return to your own body if it is within range, and the life force of the host departs (it is slain). If the host body is slain beyond the range of the spell, both you and the host die. Any life force with nowhere to go is treated as slain.","source":"Ultimate Magic pg. 228"},{"n":"Mindscape Door","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one illusory portal","duration":"10 minutes/level","save":"Will negates (see text)","sr":"no","effect":"You or other creatures enter into or escape from a mindscape (see page 234) through an imaginary doorway. This doorway takes on any form of your choosing, but can be no larger than a 5-foot cube. This spell has different effects depending on whether you are inside a mindscape when you cast it.\n\nWhen you cast this spell outside a mindscape, the doorway connects to one mindscape inhabited by a creature of your choice within close range (25 feet + 5 feet per 2 levels) of the door. That creature becomes the door’s conduit, but can attempt a Will save to deny access to the mindscape. You must be aware of the mindscape to connect a mindscape door to it. If you connect to the mindscape, you designate any number of creatures to be able to see and pass through the door as though it were a normal doorway. You can name specific creatures or categories of creatures, or allow all creatures access. Creatures other than those you designate can’t perceive or use the door, nor can mindless creatures or those immune to mind-affecting effects. Once anyone enters the mindscape through the door, a duplicate of the door appears inside the mindscape next to the creature you used as a conduit. Anyone inside a mindscape is able to perceive and use a mindscape door within that mindscape. Anyone who enters is subject to all rules of the mindscape, but is aware she is in a mindscape if you informed her where the portal leads.\n\nWhen you cast this spell inside a mindscape, a duplicate of the door appears next to your body in the real world. The creator of the mindscape can attempt a Will saving throw to prevent you from creating the door if she is within the mindscape. The two doors operate as if you’d cast the spell outside a mindscape. You still designate who can use the door from the real world to get into the mindscape, but you can’t prevent creatures within the mindscape from exiting to the real world.\n\nTypically, a mindscape door operates in both directions, but you can create it as a one-way door if you so choose. Unlike with other spells, you can cast this spell as a full-round action while engaged in a psychic duel. This spell can be used to exit a binary mindscape, but not to enter one. If you successfully cast mindscape door within a veiled mindscape, you learn that you are in a mindscape, but other creatures observing the door don’t automatically realize they are.","source":"Occult Adventures"},{"n":"Minor Dream","l":3,"school":"illusion (figment) [mind-affecting]","castingTime":"1 minute","components":"V, S","range":"unlimited","target":"you or one gnome touched","duration":"see text","save":"none","sr":"no","effect":"This spell functions as the dream spell, except as follows. The messenger must be yourself or a gnome touched. The message can be no longer than 20 words. If the recipient of the message is not asleep when the spell is cast, the spell automatically fails.","source":"Advanced Race Guide pg. 39"},{"n":"Mirage","l":3,"school":"illusion (figment)","castingTime":"10 minutes","components":"V, S, M (a pinch of sand and a drop of water)","range":"long (400 ft. + 40 ft./level)","target":"one 40-ft.-cube/level (S)","duration":"2 hours/level (D)","save":"Will disbelief (see below)","sr":"yes","effect":"You create an image of a pool of water, a group of standing stones, a cove, an island, or another simple land formation over a stretch of flat land or water. The image is purely visual, and structures, equipment, and creatures within the area are not hidden or changed in appearance.\n\nAnyone interacting with the illusion can attempt to disbelieve it, and a creature trained in Survival can make a special attempt to disbelieve the illusion. The creature must be within 120 feet of the illusion’s area and can attempt a Survival check instead of a Will saving throw. If the result is equal to or greater than the spell’s save DC, the creature realizes the mirage is an illusion as if it disbelieved the spell.","source":"Ultimate Wilderness pg. 232"},{"n":"Motes of Dusk and Dawn","l":3,"school":"evocation [darkness, light]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"Up to four motes, all within a 10-ft.-radius area","duration":"1 minute (D)","save":"none","sr":"no","effect":"When you cast this spell, you create up to four motes that shed light or darkness in a 20-foot-radius, increasing or decreasing the illumination level by up to two categories. You decide whether each individual mote sheds light or darkness when the spell is cast.\n\nThe motes of dusk and dawn must stay within a 10-foot-radius area of one another but otherwise move as you desire (no concentration required): forward or back, up or down, straight or turning corners, or the like. The motes can move up to 100 feet per round. A mote winks out if the distance between you and it exceeds the spell’s range.","source":"Blood of Shadows pg. 28"},{"n":"Mydriatic Spontaneity","l":3,"school":"evocation [darkness, light]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You overstimulate the target with alternating flashes of light and shadow within its eyes, causing its pupils to rapidly dilate and contract. While under the effects of this spell, the target is racked by splitting headaches and unable to see clearly, becoming nauseated for the spell’s duration. Each round, the target’s pupils randomly become dilated or contracted for 1 round. During any round that its eyes are dilated, the target is blinded if exposed to bright light or dazzled if exposed to normal light. During any round its eyes are contracted, the target is blinded if exposed to darkness or dazzled if exposed to dim light. In addition, any creature can attempt a Stealth check to avoid detection from the target, even if the creature lacks cover or concealment.","source":"Blood of Shadows pg. 28"},{"n":"Mythic Severance","l":3,"school":"Necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature","duration":"Permanent","save":"Will negates","sr":"Yes","effect":"You restrict the target's access to its mythic power. Each time the target attempts to cast a mythic spell, expend mythic power to activate a path ability, or use any other effect that requires expending uses of mythic power, it must attempt a Will saving throw against the DC of this spell. If it fails this saving throw, the creature loses its action and the ability it was attempting to use has no effect.\n\nThis spell has no effect on mythic abilities that don't require the target to expend mythic power.","source":"Mythic Adventures"},{"n":"Nixie's Lure","l":3,"school":"enchantment (charm) [mind-affecting, sonic]","castingTime":"1 standard action","components":"V, S","range":"300 ft.","target":"all creatures within a 300-ft.-radius burst centered on you","duration":"concentration + 1 round/level (D)","save":"Will negates","sr":"yes","effect":"This spell creates an unearthly and infectious song that seductively summons all who hear it. Nixie’s lure affects a maximum of 24 Hit Dice of creatures. Creatures in the area who fail their saves are lured by the song and move toward you using the most direct means available. If the path leads them into a dangerous area such as through fire or off a cliff, the creatures each receive a second saving throw to end the effect before moving into peril. Creatures lured by the spell’s song can take no actions other than to defend themselves. A victim within 5 feet of you simply stands still and for the duration of the spell remains fascinated.","source":"Advanced Race Guide pg. 179"},{"n":"Node of Blasting","l":3,"school":"abjuration [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"touch","target":"one touched object weighing no more than 10 lbs.","duration":"permanent until discharged (D)","save":"Will partial, see text","sr":"no","effect":"You imbue an object with psychic energy. The node of blasting unleashes a mental blast when a creature with a mind touches the object, dealing 6d6 points of damage to the creature touching the object and causing the creature to be staggered for 1 minute. A successful saving throw halves the damage and negates the staggered condition. Magic traps such as node of blasting are hard to detect and disable. A character with the trapfinding class feature can use Disable Device to thwart node of blasting . The DCs to find a node of blasting using Perception and to disable it using Disable Device are both equal to 25 + the spell’s level. Additionally, a creature with the read aura occult skill unlock (see page 197) can attempt the same Perception check to notice a node of blasting .","source":"Occult Adventures pg. 178"},{"n":"Nondetection","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S, M (diamond dust worth 50 gp)","range":"touch","target":"creature or object touched","duration":"1 hour/level","save":"Will negates (harmless, object)","sr":"yes (harmless, object)","effect":"The warded creature or object becomes difficult to detect by divination spells such as clairaudience/clairvoyance, locate object, and detect spells. Nondetection also prevents location by such magic items as crystal balls. If a divination is attempted against the warded creature or item, the caster of the divination must succeed on a caster level check (1d20 + caster level) against a DC of 11 + the caster level of the spellcaster who cast nondetection. If you cast nondetection on yourself or on an item currently in your possession, the DC is 15 + your caster level.\nIf cast on a creature, nondetection wards the creature's gear as well as the creature itself.","source":"PRPG Core Rulebook pg. 317"},{"n":"Object Possession, Lesser","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"touch","target":"unattended Tiny or Small object","duration":"1 minute/level (D)","save":"None","sr":"No","effect":"This spell functions as possession, except you possess an object instead of a creature.  A possessed object becomes capable of animation, gaining the statistics of an animated object of its size (including 1 CP worth of abilities; Pathfinder RPG Bestiary 14). You can't use any spells or other abilities while possessing an object.  A spiritual tether connects your body to the possessed object, in a manner similar to a silver cord (see page 244). If the possessed object and your body are ever farther than close range (25 ft. + 5 ft./2 levels) from one another, this tether breaks, returning your consciousness to your body.","source":"Occult Adventures pg. 179"},{"n":"Oneiric Horror, Greater","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round/level (D)","save":"Will negates, Fortitude negates, see text","sr":"yes","effect":"This spell functions as oneiric horror except each round the subject fails its Will save, it takes 1 point of Strength damage, and after the spell ends, the subject must succeed at a Fortitude save or be fatigued for a number of minutes equal to the number of rounds spent under the spell’s effect.","source":"Occult Adventures pg. 179"},{"n":"Out of Sight","l":3,"school":"enchantment [ mind-affecting ]","castingTime":"1 standard action","components":"V, S, M (a strip of black cloth)","range":"personal","target":"you","duration":"1 minute/level (D); see text","save":"Will negates, see text","sr":"yes","effect":"The spell inhibits the memories of creatures that perceive you. While creatures can perceive you normally, when a creature stops observing you, it must attempt a Will save (spell resistance applies). If it fails, it loses all memory of its awareness of you and your actions while you were under the effects of this spell. The spell’s duration listed above measures how long the out of sight effect lasts on you, but the memory alteration is instantaneous and can be reversed only by magic such as modify memory . The creature is still aware of any other changes to itself or its environment. For instance, a guard will remember running, and may notice a newly unlocked door, but will not remember that he was chasing after you.","source":"Occult Origins pg. 31"},{"n":"Overwhelming Grief","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 round/level","save":"Will negates (see text)","sr":"yes","effect":"You cause a single opponent to become profoundly stricken with intense grief. He can take no actions, takes a –2 penalty to Armor Class, and loses his Dexterity bonus (if any). He can attempt a new save each round to break the spell’s effect.","source":"Ultimate Magic pg. 230"},{"n":"Penumbral Disguise","l":3,"school":"conjuration [shadow]","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"10 minutes/level (D)","save":"none","sr":"no","effect":"You mask your features with shadowy illumination, gaining a competence bonus equal to your caster level on Disguise checks and Stealth checks attempted while in normal light, dim light, or darkness. In addition, creatures that see you while you are in dim light or darkness are unable to discern any but the most general information about your appearance or actions. For example, they can determine your general shape (such as humanoid), as well as the gist of your actions (such as, “She was trying to break into the store”), but cannot determine your precise actions, your appearance, or any identifying information about you. In bright light, your normal appearance is revealed.","source":"Blood of Shadows pg. 29"},{"n":"Phantasmal Reminder","l":3,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one living creature","duration":"1 round; see text","save":"Will disbelief, then Fortitude partial","sr":"yes","effect":"Forces a creature that has taken damage since your last turn to relive a successful attack against it in vivid, agonizing detail. The target attempts a Will save to recognize the memory as false; if it fails, it must then succeed on a Fortitude save or take 1d6 points of damage per caster level (maximum 10d6), which cannot be reduced by resistances. If the target succeeds on the Will save and has natural telepathy or wears a helm of telepathy, the phantasmal pain rebounds onto you instead, requiring your own Will save or you take half the damage.","source":"Magic Tactics Toolbox pg. 26"},{"n":"Pillow Talk","l":3,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"10 minutes","components":"S","range":"touch","target":"sleeping, living creature touched","duration":"1 minute/level","save":"Will negates; see text","sr":"yes","effect":"This spell can be cast only on a sleeping creature, which must be present for the full duration of the casting time. You grant the semblance of wakefulness to the target, allowing it to answer questions. You can ask one question per 2 caster levels. The target’s knowledge is limited to what it normally knows, including the languages it speaks. Answers are brief, cryptic, or repetitive, especially if the creature would have opposed you when awake. If the target succeeds at a Will save, it awakens (unless some force is preventing it from being awake, such as magic or drugs), and it remains aware of the first question you asked. If the target has been subject to pillow talk within the past week, the new spell fails. While your questions don’t otherwise wake the target, this spell does nothing to prevent other sounds or stimulus from waking the target. A target who sleeps through the spellcasting and duration of the spell has no memory of it taking place, but a target who awakens before the spell ends remembers every question asked and what answers it gave.","source":"Inner Sea Temples pg. 63"},{"n":"Ray of Exhaustion","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S, M (a drop of sweat)","range":"close (25 ft. + 5 ft./2 levels)","target":"ray","duration":"1 min./level","save":"Fortitude partial; see text","sr":"yes","effect":"A black ray projects from your pointing finger. You must succeed on a ranged touch attack with the ray to strike a target.\n\nThe subject is immediately exhausted for the spell's duration. A successful Fortitude save means the creature is only fatigued.\n\nA character that is already fatigued instead becomes exhausted.\n\nThis spell has no effect on a creature that is already exhausted. Unlike normal exhaustion or fatigue, the effect ends as soon as the spell's duration expires.","source":"PRPG Core Rulebook pg. 330"},{"n":"Remove Blindness/Deafness","l":3,"school":"conjuration (healing)","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature touched","duration":"instantaneous","save":"Fortitude negates (harmless)","sr":"yes (harmless)","effect":"Remove blindness/deafness cures blindness or deafness (your choice), whether the effect is normal or magical in nature. The spell does not restore ears or eyes that have been lost, but it repairs them if they are damaged.\nRemove blindness/deafness counters and dispels blindness/deafness.","source":"PRPG Core Rulebook pg. 332"},{"n":"Remove Curse","l":3,"school":"abjuration","castingTime":"1 standard action","components":"V, S","range":"touch","target":"creature or object touched","duration":"instantaneous","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"Remove curse can remove all curses on an object or a creature. If the target is a creature, you must make a caster level check (1d20 + caster level) against the DC of each curse affecting the target. Success means that the curse is removed. Remove curse does not remove the curse from a cursed shield, weapon, or suit of armor, although a successful caster level check enables the creature afflicted with any such cursed item to remove and get rid of it.\nRemove curse counters and dispels bestow curse.","source":"PRPG Core Rulebook pg. 332"},{"n":"Repugnant Taste","l":3,"school":"transmutation [poison]","castingTime":"1 standard action","components":"V, S, M/DF (mustard seed)","range":"touch","target":"creature touched","duration":"10 minutes/level","save":"Fortitude negates (harmless)","sr":"yes (harmless)","effect":"The target creature begins sweating a foul liquid that makes it repugnant to most living creatures. When a creature deals damage to the affected creature with a bite attack or the swallow whole ability, it must succeed at a Fortitude saving throw or become nauseated until the end of its next turn. After a creature has become nauseated by this spell, each subsequent failed saving throw against the spell instead gives it the sickened condition until the end of its next turn.","source":"Monster Hunter's Handbook pg. 30"},{"n":"Resilient Reservoir","l":3,"school":"transmutation","castingTime":"1 standard action","components":"V, S","range":"personal","target":"special, see text","duration":"1 round/level","save":"none (see below)","sr":"yes","effect":"Upon casting this spell, damage from melee attacks and touch spells gets transferred into a special pool that you then redirect before the spell's duration expires.\n\nEach time you are struck by a melee attack or touch spell that deals hit point damage, 1 point of damage is negated and transferred into the reservoir created by this spell. The total number of points in the reservoir cannot exceed your caster level (to a maximum of 20 points at 20th level). As an immediate action, anytime before the spell's duration expires, you can expend a number of points of energy from the reservoir, granting yourself an insight bonus on one skill check, attack roll, damage roll, or combat maneuver check, but you must do so before the roll is made. This bonus is equal to the number of points spent. For every five caster levels, you may call upon the reservoir one additional time (maximum of four times at 15th level).\n\nIf you are reduced to negative hit points while you are under the effect of this spell, the spell automatically release the remaining magic of the reservoir in a concussive blast of force. All creatures within a 15-foot radius take 1d6 points of force damage per 2 points remaining in the reserve (maximum of 10d6). A successful Reflex save halves this damage, and spell resistance applies to this effect.","source":"Advanced Race Guide pg. 49"},{"n":"Scrying","l":3,"school":"divination (scrying)","castingTime":"1 hour","components":"V, S, M/DF (a pool of water), F (a silver mirror worth 1,000 gp)","range":"see text","target":"magical sensor","duration":"1 min./level","save":"Will negates","sr":"yes","effect":"You can observe a creature at any distance. If the subject succeeds on a Will save, the spell fails. The difficulty of the save depends on how well your knowledge of the subject and what sort of physical connection (if any) you have to that creature. Furthermore, if the subject is on another plane, it gets a +5 bonus on its Will save.\n\nKnowledgeWill Save ModifierNone*+10Secondhand (you have heard of the subject)+5Firsthand (you have met the subject)+0Familiar (you know the subject well)-5ConnectionWill Save ModifierLikeness or picture-2Possession or garment-4Body part, lock of hair, bit of nail, etc.-10*You must have some sort of connection (see below) to a creature of which you have no knowledge.\nIf the save fails, you can see and hear the subject and its surroundings (approximately 10 feet in all directions of the subject). If the subject moves, the sensor follows at a speed of up to 150 feet.\n\nAs with all divination (scrying) spells, the sensor has your full visual acuity, including any magical effects. In addition, the following spells have a 5% chance per caster level of operating through the sensor: detect chaos, detect evil, detect good, detect law, detect magic, and message.\n\nIf the save succeeds, you can't attempt to scry on that subject again for at least 24 hours.","source":"PRPG Core Rulebook pg. 337"},{"n":"Secret Page","l":3,"school":"transmutation","castingTime":"10 minutes","components":"V, S, M (powdered herring scales and a vial of will-o'-wisp essence)","range":"touch","target":"page touched, up to 3 sq. ft. in size","duration":"permanent","save":"none","sr":"no","effect":"Secret page alters the contents of a page so that it appears to be something entirely different. The text of a spell can be changed to show another spell of equal or lower level known by the caster. This spell cannot be used to change a spell contained on a scroll, but it can be used to hide a scroll. Explosive runes or sepia snake sigil can be cast upon the secret page.\n\nA comprehend languages spell alone cannot reveal a secret page's contents. You are able to reveal the original contents by speaking a special word. You can then peruse the actual page and return it to its secret page form at will. You can also remove the spell by double repetition of the special word. A detect magic spell reveals dim magic on the page in question but does not reveal its true contents. True seeing reveals the presence of the hidden material but does not reveal the contents unless cast in combination with comprehend languages. A secret page spell can be dispelled, and the hidden writings can be destroyed by means of an erase spell.","source":"PRPG Core Rulebook pg. 338"},{"n":"See Invisibility","l":3,"school":"divination","castingTime":"1 standard action","components":"V, S, M (talc and powdered silver)","range":"personal","target":"you","duration":"10 min./level (D)","save":"none","sr":"no","effect":"You can see any objects or beings that are invisible within your range of vision, as well as any that are ethereal, as if they were normally visible. Such creatures are visible to you as translucent shapes, allowing you easily to discern the difference between visible, invisible, and ethereal creatures.\nThe spell does not reveal the method used to obtain invisibility. It does not reveal illusions or enable you to see through opaque objects. It does not reveal creatures who are simply hiding, concealed, or otherwise hard to see.\nSee invisibility can be made permanent with a permanency spell.","source":"PRPG Core Rulebook pg. 339"},{"n":"Seeds of Influence","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"S, M (a rose)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"1 hour/level (D)","save":"Will negates","sr":"yes","effect":"You leave a magical trace in the mind of a creature with an attitude of at least indifferent toward you. The target takes a cumulative –2 penalty on its Will save to negate the spell for each step by which its attitude is better than indifferent.\n\nThe target takes a –2 penalty on saving throws against divination spells you cast. You can target that creature with mind-affecting spells of a spell level lower than seeds of influence as if those spells were modified by Enlarge Spell (the modified spell doesn’t take longer to cast and doesn’t use a higher-level spell slot). Whenever the target succeeds at a saving throw against a divination or mind-affecting spell you cast, seeds of influence ends for that target. A creature can be subject to only one seeds of influence spell at a time; later castings of seeds of influence remove any previous casting.","source":"Inner Sea Intrigue pg. 62"},{"n":"Seek Thoughts","l":3,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a handful of copper coins)","range":"40 ft.","target":"40-ft.-radius emanation centered on you","duration":"concentration, up to 1 minute/level","save":"Will negates","sr":"no","effect":"Similar to detect thoughts, seek thoughts allows you to sift through the surface thoughts of those around you. You may scan for either the answer to a simple question (such as “Where is the hidden lair of the wererats?”) or for information on a general topic (such as the beliefs of an evil cult). You detect the number of creatures who are thinking about this question or topic within range, as well as their location if they are visible to you. Seek thoughts does not let you read actual surface thoughts, only if a given creature is thinking about the topic you are concentrating on. A successful Will save prevents you from sensing a creature’s thoughts for the duration of the spell.\nYou can maintain concentration on seek thoughts while you engage in normal conversation, allowing you to ask leading questions about topics of interest. A creature conversing with you while you concentrate can notice that you are distracted with a successful DC 25 Sense Motive check.","source":"Advanced Player's Guide pg. 242"},{"n":"Sending","l":3,"school":"evocation","castingTime":"10 minutes","components":"V, S, M/DF (fine copper wire)","range":"see text","target":"one creature","duration":"1 round; see text","save":"none","sr":"no","effect":"You contact a particular creature with which you are familiar and send a short message of 25 words or less to the subject. The subject recognizes you if it knows you. It can answer in like manner immediately. A creature with an Intelligence score as low as 1 can understand the sending, though the subject's ability to react is limited as normal by its Intelligence. Even if the sending is received, the subject is not obligated to act upon it in any manner.\nIf the creature in question is not on the same plane of existence as you are, there is a 5% chance that the sending does not arrive. (Local conditions on other planes may worsen this chance considerably.)\nMythic Sending\n##Source## Mythic Adventures pg. 107\nYou can contact a number of additional creatures equal to your tier. Each creature must receive the same message, and can communicate back only to you.\nAugmented (3rd): If you expend two uses of mythic power, you can send the message to unfamiliar creatures (using the same number of creatures as non-augmented mythic sending). You must either describe the intended recipients in general or specific terms (such as “orcs,” “the queen of this country,” or “left-handed half-elven males”) or specify restrictions such as range, creature type, and alignment (such as “all good-aligned humanoids in the castle on the hill”). If a greater number of creatures meet your description than the maximum number you can send to, the closest ones to you receive the message.","source":"PRPG Core Rulebook pg. 339"},{"n":"Sensory Amplifier","l":3,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"S","range":"personal","target":"10-ft.-radius emanation centered on you","duration":"1 round/level (D)","save":"Will negates","sr":"yes","effect":"You open the minds of all creatures near you and enhance their sensory receptors. All living creatures other than you in the area gain a +5 bonus on Perception checks. Sighted creatures gain low-light vision, and creatures with a sense of smell gain scent. In addition, the first time each round that a creature in the area takes damage, it takes an additional 2d6 points of damage of the same type. Despite being within the area, the caster does not take this extra damage.","source":"Occult Origins pg. 29"},{"n":"Shadow Enchantment","l":3,"school":"illusion (shadow) [shadow]","castingTime":"1 standard action","components":"V, S","range":"see text","target":"see text","duration":"see text","save":"Will disbelief, see text","sr":"yes","effect":"You use material from the Shadow Plane to cast a quasi-real, illusory version of a psychic, sorcerer, or wizard enchantment spell of 2nd level or lower. Spells that deal damage or have other effects work as normal unless the affected creature succeeds at a Will save. If the disbelieved enchantment spell has a damaging effect, that effect is one-fifth as strong (if applicable) or only 20% likely to occur. If recognized as a shadow enchantment, a damaging spell deals only one-fifth (20%) the normal amount of damage.\n\nIf the disbelieved attack has a special effect other than damage, that effect is one-fifth as strong (if applicable) or only 20% likely to occur. Regardless of the result of the save to disbelieve, an affected creature is also allowed any save (or spell resistance) that the spell being simulated allows, but the save DC is set according to shadow enchantment’s level (3rd) rather than the spell’s normal level. Objects, mindless creatures, and creatures immune to mind-affecting effects automatically succeed at their Will saves against this spell.","source":"Occult Realms pg. 17"},{"n":"Shadowmind","l":3,"school":"illusion (phantasm)","castingTime":"1 standard action","components":"V, S, M (a small square of black silk)","range":"medium (100 ft. + 10 ft./level)","target":"up to one creature/level, no two of which can be more than 30 ft. apart","duration":"1 minute/level","save":"Will negates","sr":"yes","effect":"Targets perceive their surroundings as one step darker than they really are; the illusion affects only their vision, not actual light levels, and bypasses both darkvision and low-light vision (though not magical darkness detection).","source":"Blood of Shadows pg. 16"},{"n":"Shroud of Innocuity","l":3,"school":"illusion (glamer)","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one willing creature plus one/2 caster levels, no two of which can be more than 30 ft. apart","duration":"1 hour/level (D)","save":"none (harmless); see text","sr":"no","effect":"All affected creatures are veiled with a commonplace appearance. This appearance varies based on the viewer, but is always an ordinary member of that viewer’s race, ethnicity, or nationality. This familiarity grants a +2 bonus on Diplomacy checks attempted by affected targets against those not affected by the spell.\n\nCreatures with an attitude of unfriendly or hostile toward an affected target can attempt a Will save to disbelieve the effect the first time they encounter that target.","source":"Heroes of the High Court pg. 10"},{"n":"Smug Narcissism","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a tiny shard of a mirror)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"10 minute/level (D)","save":"Will negates","sr":"yes","effect":"You cause your target to become overwhelmed by its own importance, talents, and attractiveness. The target cannot help but look at itself in every reflective surface at every possible opportunity. In social situations, the target always tries to comment about how attractive it is or how ugly someone else is by comparison. The target remains constantly distracted, always looking for a reflective surface to gaze upon (such as a mirror, pool of water, a polished shield, and so on). The distraction gives the target a –2 penalty on all skill checks. In combat, the target worries about enemies damaging its appearance, and focuses on defense rather than offense (casting defensive spells rather than offensive spells, using the fight defensively or total defense action, and so on).","source":"Ultimate Magic pg. 238"},{"n":"Spite","l":3,"school":"abjuration","castingTime":"1 round","components":"V, S, M (rare inks worth 250 gp)","range":"personal","target":"you","duration":"1 hour/level (D) or until discharged","save":"none","sr":"no","effect":"Choose a single touch range spell of 4th level or lower with a casting time of 1 standard action or less. As part of the action of casting spite, you cast the associated spell and bind it into a defensive ward in the form of a tattoo, birthmark, or wart somewhere upon your body. The next time you are hit by a melee attack or a combat maneuver is used successfully against you, the stored spell is triggered against your foe. You do not need to succeed on a touch attack to affect the target, but in all other respects the spell is treated as though you had cast it normally. If the attacking creature is not a valid target for the spell, the stored spell is lost with no effect.  You can have only one spite spell in effect at a time; if you cast this spell a second time, the previous spell effect ends.","source":"Advanced Player's Guide pg. 246"},{"n":"Stage Fright","l":3,"school":"enchantment (compulsion) [emotion, fear, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"1 creature/level, no two of which may be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"Fills targets with crippling stage fright and self-doubt. Those who fail their save take a -4 penalty on all ability checks, skill checks, and concentration checks, including checks to cast defensively or operate delicate devices under pressure.","source":"Arcane Anthology pg. 27"},{"n":"Symbol Of Laughter","l":3,"school":"enchantment (charm) [mind-affecting]","castingTime":"10 minutes","components":"V, S, M (mercury and phosphorus, plus powdered diamond and opal worth a total of 1,000 gp)","range":"0 ft.; see text","target":"one symbol","duration":"see text","save":"Will negates","sr":"yes","effect":"This spell functions as symbol of death, except that all creatures within 60 feet are affected with uncontrollable laughter (as hideous laughter) for 1 round per caster level.  Unlike symbol of death, symbol of laughter has no hit point limit; once it is triggered, a symbol of laughter remains active for 1 minute per caster level.  Symbol of laughter can be made permanent with a permanency spell by a caster of 10th level or higher at a cost of 5,000 gp.","source":"Advanced Class Guide pg. 196"},{"n":"Synaptic Pulse","l":3,"school":"enchantment ( compulsion ) [ mind-affecting ]","castingTime":"1 standard action","components":"V","range":"30 ft.","target":"30-ft.-radius spread centered on you","duration":"1 round","save":"Will negates","sr":"yes","effect":"You emit a pulsating mental blast that stuns all creatures in range of your psychic shriek for 1 round.","source":"Occult Adventures pg. 187"},{"n":"Synaptic Scramble","l":3,"school":"enchantment ( compulsion ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You scramble the synaptic connections of your target, causing it to lose the ability to coherently communicate and to take unintended actions when it meant to perform others. The target cannot effectively communicate while under the spell’s influence, and thus cannot engage in acts like speaking, attempting Bluff checks to pass secret messages, writing, or using telepathy, although the spell doesn’t prevent verbalizations made for purposes other than communication, such as command words or the verbal component of spellcasting. The target’s mind is too scrambled to take full-round actions or longer actions, as the target’s attention inevitably wanders before the action completes. Whenever the target attempts to take a move action or a standard action, roll on the following table instead. If the result on the table is an action that the target cannot take, the target takes no action instead. d% Action 1–20 Move action (must use move action to move) 21–40 Other move action (perform a move action other than moving) 41–60 Attack action (spend a standard action on the attack action, attacking once with a weapon) 61–80 Other standard action (perform a standard action that isn’t the attack action) 81–100 Desired action (perform whatever standard or move action the creature desires to perform)","source":"Occult Adventures pg. 187"},{"n":"Synesthesia","l":3,"school":"illusion ( phantasm ) [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 round/level","save":"Will negates","sr":"yes","effect":"You overstimulate the senses of the affected creature, causing its senses to interfere with another. While a creature is under the effects of this spell, sensory input is processed by the wrong senses, such that noise triggers bursts of colors, smells create sounds, and so on. The affected creature moves at half speed, has a 20% miss chance on attacks, and takes a –4 penalty to AC and on skill checks and Reflex saves. Successful spellcasting while affected requires a concentration check with a DC equal to this spell’s save DC plus the level of spell being cast. In addition, the affected creature is considered distracted for the purpose of attempting Perception checks. Effects that negate or reduce concealment do not affect the miss chance from synesthesia .","source":"Occult Adventures pg. 187"},{"n":"Terrible Remorse","l":3,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"1 living creature","duration":"1 round/level","save":"Will partial (see text)","sr":"yes","effect":"You fill a target with such profound remorse that it begins to harm itself. Each round, the target must save or deal 1d8 points of damage + its Strength modifier to itself using an item held in its hand or with unarmed attacks. If the creature saves, it is staggered for 1 round and takes a -2 penalty to Armor Class, after which the spell ends.","source":"Ultimate Magic pg. 243"},{"n":"They Know","l":3,"school":"enchantment (compulsion) [emotion, fear]","castingTime":"1 standard action","components":"V, S, F/DF, M (a drop of black ink)","range":"medium (100 ft. + 10 ft./level)","target":"one intelligent creature","duration":"1 minute/level (D)","save":"Will negates","sr":"yes","effect":"You instill a target with the fear that the nearest other intelligent creature knows her darkest secret. If she is in the midst of another situation as vital as protecting her darkest secret, such as combat, this doesn’t cause her to cease participating, but otherwise, she becomes compelled to use her abilities and skills to determine exactly how much the other individual knows. Even if she isn’t around other creatures or otherwise avoids confronting her paranoia for a time, the nagging fear causes the target to become shaken for the duration of the spell (though this doesn’t stack with other fear effects to make the target frightened or panicked).\n\nThe subject’s paranoia increases over time, forcing her to take additional steps to protect herself from the other creature. Depending on her personality (or subject to the GM’s discretion), she might confess, publicly demand to know what the other creature knows, attack the other creature to silence it, or offer the other creature a bribe.\n\nThe spell fails if the target truly feels she has nothing to hide.","source":"Ultimate Intrigue pg. 226"},{"n":"Tongues, Communal","l":3,"school":"divination","castingTime":"1 standard action","components":"V, M/DF (a clay model of a ziggurat)","range":"touch","target":"creatures touched","duration":"10 min./level","save":"Will negates (harmless)","sr":"no","effect":"This spell functions like tongues, except you divide the duration in 10-minute intervals among the creatures touched.","source":"Ultimate Combat pg. 248"},{"n":"Trade Items","l":3,"school":"conjuration (teleportation)","castingTime":"1 standard action","components":"V, S, F (any held object weighing no more than 5 lbs./level)","range":"close (25 ft. + 5 ft./2 levels)","target":"one object weighing no more than 5 lbs./level","duration":"instantaneous","save":"Will negates (object)","sr":"yes (object)","effect":"You cause the target object and the object used as a focus for the spell to immediately swap places. The target object appears in your hand (or falls to the ground in your square if you are unable to hold it). The stronger the connection between the two objects, the more difficult the spell is to resist, as indicated on the table below. The modifiers are cumulative.\n\nSimilarity DC The two objects are the same type of object (such as “keys,” “swords,” “scrolls”)+1 The two objects are made of the same material+1 The two objects have the same weight (accurate to the nearest ounce)+1 The two objects are part of the same set or made in the exact same mold+2 The target object has a higher gp value than the focus item–2 The target object is tied its holder, such as a bonded item –2","source":"Ultimate Intrigue pg. 226"},{"n":"Triggered Suggestion","l":3,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, M (a snake’s tongue and a honeycomb)","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 day/level or until completed","save":"Will negates","sr":"yes","effect":"This spell functions as suggestion, except you can use it only to specify a condition that triggers a special activity, and the subject does not remember that you made the suggestion. For example, you could use triggered suggestion on a palace guard to make him attack the king the next time he and the king are alone, and the guard would not remember the suggestion to do so until the trigger occurred.","source":"Advanced Class Guide pg. 197"},{"n":"Unflappable Mien","l":3,"school":"evocation [force]","castingTime":"1 standard action","components":"V, S, F (a diamond clasp, brooch, or pin worth at least 100 gp)","range":"personal","target":"you","duration":"10 minutes/level or until discharged; see yext","save":"see text","sr":"","effect":"When a creature attempts to touch you with an attack (such as a touch attack, an unarmed strike, an attack with a natural weapon, or a grapple), it feels a field of force blocking its way. It can choose to abandon the attempt, losing its action, or to push through the ward. If it pushes through, you can trigger a wave of force against that creature. This discharges the spell, deals 1d4 points of force damage per caster level (maximum 10d4), and pushes the creature back 5 feet. If the creature cannot be pushed back 5 feet (if a solid surface is directly behind it, for example), it takes 2d4 additional points of force damage. A successful Fortitude saving throw halves the total amount of force damage the creature takes.\n\nMembers of the Prophet of Kalistrade prestige class can cast this spell, even though it is not a divination or enchantment.","source":"Disciple's Doctrine pg. 19"},{"n":"Vampiric Touch","l":3,"school":"necromancy","castingTime":"1 standard action","components":"V, S","range":"touch","target":"living creature touched","duration":"instantaneous/1 hour; see text","save":"none","sr":"yes","effect":"A melee touch attack deals 1d6 damage per 2 caster levels (maximum 10d6), and you gain temporary hit points equal to the damage dealt (capped at the target's current hit points plus its Constitution score). These temporary hit points last up to 1 hour.","source":"PRPG Core Rulebook pg. 364"},{"n":"Vision of Hell","l":3,"school":"illusion (glamer) [evil, fear]","castingTime":"1 standard action","components":"V, M (a pinch of brimstone)","range":"medium (100 ft. + 10 ft./level)","target":"50-ft.-radius emanation","duration":"1 minute/level (D)","save":"Will negates","sr":"no","effect":"You overlay a realistic illusion of a terrifying hellscape upon an area. Structures, equipment, and creatures within the area are not hidden, though environmental features take on an infernal appearance. While you are prepared for these images and are not affected by them, any other creature within the area must make a Will save or become shaken and also take a –2 penalty on saves versus fear effects; the fear and penalty persists as long as the creature remains in the area. Devils and any lawful evil creatures suffer no negative effects from this spell.","source":"Ultimate Magic pg. 248, Book of the Damned - Volume 1: Princes of Darkness pg. 47"},{"n":"Witness","l":3,"school":"divination (scrying)","castingTime":"1 standard action","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one living creature","duration":"1 minute/level (D)","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You link your senses to the target, allowing you to see and hear through its eyes and ears. As a move action you can shift your senses from yourself to the target or back again. When using the target’s senses, you are blind and deaf. When perceiving through the target, you use its normal and special senses (such as darkvision), not your own.","source":"Ultimate Magic pg. 249"},{"n":"Akashic Communion","l":4,"school":"divination","castingTime":"10 minutes","components":"V, S, M/DF (a square of reflective silver worth 100 gp)","range":"personal","target":"","duration":"1 minute/level","save":"","sr":"","effect":"You attempt to obtain a glimpse of some specific event from the Akashic Record (Occult Adventures 244), the extraplanar repository of all experiences that have ever occurred. This allows you to attempt one Knowledge skill check of your choice per 3 caster levels you have, each with a +10 insight bonus. You are treated as trained in any Knowledge skills used for these checks, and can use this spell to reroll a Knowledge skill check you have already failed. The GM rolls these Knowledge checks in secret, as the Akashic Record is incredibly remote, and impressions gleaned from the distant repository are sometimes skewed when received. On a natural 1, the resulting answer is wildly inaccurate.\n\nThis spell provides experiential guidance based on your ability to understand the flashes of insight gleaned from the Akashic Record, rather than the perfect knowledge available to those who travel to the extraplanar repository of knowledge. If you lag, discuss the answers, or go off to do anything else, the spell ends. Once you have used this spell to gain information on a specific topic or event, you cannot use it for Knowledge checks regarding that topic or event again until you have gained a caster level.","source":"Magic Tactics Toolbox pg. 16"},{"n":"Amnesia","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"instantaneous","save":"Will negates","sr":"yes","effect":"You cause the target to lose most of its memories; its skills, its past, and even its name become mysteries to it. While the target can build new memories, it has trouble accessing those gained before falling victim to the spell. The target can still speak and read any languages it knows and perform basic tasks, but it loses all class abilities, feats, and skill ranks gained before being affected by amnesia. It retains its base attack bonus, saving throws bonuses, Combat Maneuver Bonus, Combat Maneuver Defense, total experience points, Hit Dice, and hit points. If the target gains a character level while suffering from amnesia, it can use any abilities gained by that class level normally. If the class level it gained was from a class in which it already has levels, it gains the abilities of a 1st-level character of that class, even though it is technically of a higher level in that class.\n\nIf the amnesia is cured, the target regains the full abilities of the class, including those gained from any levels taken while suffering from this condition. Amnesia can be removed only by heal, limited wish, miracle, psychic surgeryOA, or wish.","source":"Villain Codex pg. 8"},{"n":"Animus Mine, Greater","l":4,"school":"abjuration [ mind-affecting ]","castingTime":"1 standard action","components":"V, S","range":"personal","target":"","duration":"1 hour/level or until discharged","save":"Will negates (harmless)","sr":"no","effect":"This functions as per animus mine , except the triggering creature is stunned for 1d4 rounds instead of staggered. If the target succeeds at a Will saving throw, it takes only half damage and negates the stunned effect. If the target fails this Will saving throw, you automatically succeed at any saving throw against the mind-affecting effect that triggered the mine.","source":"Heroes of the Darklands pg. 20"},{"n":"Apathy","l":4,"school":"enchantment (compulsion) [emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a shiny bead)","range":"long (400 ft. + 40 ft./level)","target":"one creature","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"You cause a creature to temporarily lose interest in a passion or pursuit, taking the heat off your trail to facilitate a getaway, the finalization of a scheme, or the elimination of incriminating evidence. When casting the spell, you designate a subject or activity about which the target becomes indifferent. While under the effects of apathy, the target takes a –5 penalty on all skill checks and ability checks to investigate, pursue, or otherwise advance its goals in relation to the designated subject. In most cases, however, the target does not attempt such checks if they can be avoided, as it simply has no interest in putting effort into the endeavor.\n\nIf the chosen activity is something that would be harmful for the target to refrain from doing (such as eating, sleeping, or holding its breath underwater), the target receives a +5 bonus on the saving throw or other check required by its inaction, and receives a new saving throw to negate the effects of this spell with the same +5 bonus immediately after. The bonus on these saving throws and checks increases by 1 for each subsequent check required by the same condition. If you directly interact with the target of this spell (such as engaging it in combat or targeting it with another spell or effect), the spell immediately ends.","source":"Inner Sea Intrigue pg. 58"},{"n":"Arcane Eye","l":4,"school":"divination (scrying)","castingTime":"10 minutes","components":"V, S, M (a bit of bat fur)","range":"unlimited","target":"magical sensor","duration":"1 min./level (D)","save":"none","sr":"no","effect":"You create an invisible magical sensor that sends you visual information. You can create the arcane eye at any point you can see, but it can then travel outside your line of sight without hindrance. An arcane eye travels at 30 feet per round (300 feet per minute) if viewing an area ahead as a human would (primarily looking at the floor) or 10 feet per round (100 feet per minute) if examining the ceiling and walls as well as the floor ahead. It sees exactly as you would see if you were there.\nThe eye can travel in any direction as long as the spell lasts. Solid barriers block its passage, but it can pass through a hole or space as small as 1 inch in diameter. The eye can't enter another plane of existence, even through a gate or similar magical portal.\nYou must concentrate to use an arcane eye. If you do not concentrate, the eye is inert until you again concentrate.","source":"PRPG Core Rulebook pg. 243"},{"n":"Assume Appearance, Greater","l":4,"school":"transmutation (polymorph)","castingTime":"1 minute","components":"V, S, F (corpse or likeness of the deceased creature whose form you plan to assume)","range":"personal","target":"you","duration":"1 day/level (D)","save":"none","sr":"no","effect":"This spell functions similar to assume appearance, except that you can imitate a creature even if you have only a likeness (such as a sketch or painting) that is fairly accurate. If there is an age difference between the likeness and the actual creature, you take on the appearance of the creature near the end of its life. If you have heard the creature whose form you plan to assume speak aloud, you can also copy its voice as vocal alteration (speak with dead can also be used to fulfill this requirement). The spell doesn't grant insight into the dead creature's mannerisms\nAdditionally, if a likeness used as a focus for the spell is kept on your person or within 30 feet at all times, the aura of greater assume appearance is redirected to the likeness instead of to you, similar to a reverse application of the misdirection spell.","source":"Horror Adventures pg. 109"},{"n":"Battlemind Link","l":4,"school":"divination [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"personal and close (25 ft. + 5 ft./2 levels)","target":"you and 1 ally","duration":"1 minute/level","save":"Will negates (harmless)","sr":"yes (harmless)","effect":"You fuse your thoughts with an ally’s, allowing the two of you to fight in tandem, perfectly coordinated. You and the ally each roll initiative in combat and use the higher die result before adding modifiers. This has three effects.\n\nMelee: If you both make melee attacks against the same creature, you both make attack rolls and both use the higher of the two dice for your attack rolls (plus bonuses).\nRanged: If you both make ranged attacks against the same creature, you both make attack rolls and both use the higher of the two dice for your attack roll (plus bonuses).\nSpell: If you both cast spells and target the same area or same creature, affected creatures take a –2 penalty on their saving throw against the spells.\n\nYou and the target lose these benefits if you cannot see each other or if you or the target is unconscious or helpless.","source":"Ultimate Magic pg. 207"},{"n":"Break Enchantment","l":4,"school":"abjuration","castingTime":"1 minute","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"up to one creature per level, all within 30 ft. of each other","duration":"instantaneous","save":"see text","sr":"no","effect":"This spell frees victims from enchantments, transmutations, and curses. Break enchantment can reverse even an instantaneous effect. For each such effect, you make a caster level check (1d20 + caster level, maximum +15) against a DC of 11 + caster level of the effect. Success means that the creature is free of the spell, curse, or effect. For a cursed magic item, the DC is equal to the DC of the curse.\n\nIf the spell is one that cannot be dispelled by dispel magic or stone to flesh, break enchantment works only if that spell is 5th level or lower.\n\nIf the effect comes from a permanent magic item, break enchantment does not remove the curse from the item, but it does free the victim from the item's effects.","source":"PRPG Core Rulebook pg. 251"},{"n":"Charm Person, Mass","l":4,"school":"enchantment (charm) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one or more humanoid creatures, no two of which can be more than 30 ft. apart","duration":"1 hour/level","save":"Will negates","sr":"yes","effect":"This spell functions like charm person, except that mass charm person affects a number of humanoid creatures whose combined Hit Dice don’t exceed twice your level. If there are more potential targets than you can affect, you choose them one at a time until you reach the limit of HD you can affect. If you cast mass charm person on only one creature, you ignore the spell’s HD limit.","source":"Ultimate Intrigue pg. 206"},{"n":"Charon's Dispensation","l":4,"school":"Abjuration","castingTime":"1 standard action","components":"V, S, M (2 silver coins)","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature/level","duration":"1 minute/level","save":"Will negates (harmless)","sr":"Yes (harmless)","effect":"The target of this spell gains immunity to the harmful effects of touching or drinking from the River Styx and a +4 profane bonus on saves against effects that alter or suppress memory (such as modify memory or mindwipe). This does not grant the target the ability to breathe water, nor does it grant any protection against creatures or mundane hazards such as rapids. The spell has no power to restore memory to a creature already suffering from an existing fugue or amnesia state.","source":"Book of the Damned"},{"n":"Command, Greater","l":4,"school":"Enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature/level, no two of which can be more than 30 ft. apart","duration":"1 round/level","save":"Will negates","sr":"Yes","effect":"This spell functions similarly to command but affects multiple creatures per caster level, and compulsions persist beyond the initial round. Affected creatures receive additional Will saves at the start of their turns following the initial casting to potentially break the spell's effects. All targeted creatures must receive the same instruction.","source":"Core Rulebook"},{"n":"Complex Hallucination","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 standard action","components":"S","range":"long (400 ft. + 40 ft./level)","target":"one creature/level, no two of which can be more than 30 ft. apart","duration":"concentration + 3 rounds","save":"Will disbelief","sr":"yes","effect":"This spell functions as audiovisual hallucination, except that the phantasm you create can also include olfactory, tactile, and thermal effects.","source":"Ultimate Intrigue pg. 206"},{"n":"Contagious Suggestion","l":4,"school":"enchantment (compulsion) [language-dependent, mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one living creature","duration":"1 hour/level or until completed (D)","save":"","sr":"","effect":"This spell functions as per suggestion, except the target can pass on the enchantment to other targets. The target is compelled to communicate your suggestion to another creature, forcing the new target to attempt a saving throw as if it were the initial target. If a secondary target successfully saves, the suggestion effect on the initial target isn’t negated. If a secondary target fails, it is placed under the same compulsion as the initial target and can further spread the suggestion. This spell can affect a total number of Hit Dice of creatures equal to your caster level. Creatures that save against this spell cannot be affected by that particular casting of contagious suggestion for 24 hours.","source":"Blood of the Beast pg. 14"},{"n":"Create Mindscape","l":4,"school":"illusion (phantasm) [mind-affecting]","castingTime":"1 round","components":"V, S","range":"long (400 ft. + 40 ft./level)","target":"one creature","duration":"10 minutes/level","save":"Will disbelief, see text","sr":"yes","effect":"You create an immersive mindscape (see page 235) that the minds of both you and another creature enter together. You choose whether the mindscape is overt or veiled, and whether it’s harmless or harmful. You can choose any shape and size trait, as well as any gravity trait (though you can’t make it so the gravity is so strong it harms creatures within). The mindscape has normal time, no alignment traits, and normal magic.\n\nYou designate where both you and your subject appear. You don’t need line of sight to draw the subject creature into the mindscape, but you must be aware of its presence within range. If you target an area with more than one sentient creature and you have never seen any of the creatures before (for example, if you know a group of soldiers is inside a barracks but you can’t see them through the door), the subject of this spell is selected at random. If you have seen firsthand the creature you wish to target (continuing the example, if you spied the sergeant entering the room moments before), you can select it unerringly from among all the creatures. You must appear somewhere in your mindscape, though it’s relatively easy to shield yourself from the view of any other creatures inside if they don’t realize they’re in a mindscape. You must also create a method of exit from the mindscape when you cast this spell, and that method must be possible to achieve based on the traits of the mindscape, even if it is obscure or difficult. The GM decides whether a method of escape is reasonable. Anything that would be a reasonable method of waking from a dream during deep sleep could allow one to leave a mindscape.\n\nMore creatures than the initial two can enter an existing mindscape, typically through the use of the mindscape door spell. You can create illusory creatures within the mindscape, but you’re able to direct or concentrate on only one at a time. Only this creature is believable; any others largely remain silent or speak generic, repetitive phrases.\n\nAs is normal with mindscapes, you and any other creatures within the mindscape are unable to take actions within the real world, and your bodies lose their Dexterity bonuses to AC.\n\nIf you choose to create a veiled mindscape, the first time another creature interacts with the environment, it can attempt a Will save to disbelieve the effect. Disbelieving a mindscape reveals to that creature that it’s within a mindscape and gives it the knowledge needed to leave the mindscape, but doesn’t free it from the mindscape. For example, if you create a mindscape that takes the form of a parlor inside a stately mansion, and your target creature succeeds at its Will save, it gains the understanding that walking out the front door of the mansion allows it to return to its physical body, but it must actually move through the mental landscape of the mansion to reach the front door and exit in order to flee the mindscape. If the mindscape is overt, the creature automatically knows how to exit if it so chooses.\n\nThis spell ends at any time that you choose to depart the mindscape, freeing the target as well. Any creature that drops below 0 hit points while inside the mindscape returns to its body. If this happens to you, the spell also ends, freeing anyone still inside.\n\nCreate mindscape can be made permanent with a permanency spell by a caster of 12th level or higher at a cost of 10,000 gp. You and other creatures aware of a permanent mindscape can come and go using the mindscape door spell.","source":"Occult Adventures"},{"n":"Curse of the Outcast","l":4,"school":"enchantment (compulsion) [curse, emotion, mind-affecting]","castingTime":"1 standard action","components":"V, S, M (a handful of earthworms)","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"permanent","save":"Will negates","sr":"yes","effect":"Everything about the target seems off-putting and grating, and everyone he meets is compelled to see the worst in him. Whenever the target attempts a Bluff, Diplomacy, Intimidate, or Perform check, he must roll twice and take the lower result.\n\nAdditionally, each creature he encounters has its initial attitude toward him reduced by one step (helpful becomes friendly, friendly becomes indifferent, and so on).","source":"Ultimate Intrigue pg. 209"},{"n":"Curse, Major","l":4,"school":"Necromancy [curse]","castingTime":"1 standard action","components":"V, S","range":"Close (25 ft. + 5 ft./2 levels)","target":"One creature","duration":"Permanent","save":"Will negates","sr":"Yes","effect":"This spell functions as bestow curse, except the DC to remove the curse is equal to the save DC + 5.","source":"Ultimate Magic"},{"n":"Daze, Mass","l":4,"school":"enchantment (compulsion) [mind-affecting]","castingTime":"1 standard action","components":"V, S","range":"medium (100 ft. + 10 ft./level)","target":"one or more humanoid creatures, no two of which may be more than 30 ft. apart","duration":"1 round","save":"will negates","sr":"yes","effect":"This spell functions as daze, except as noted above.","source":"Ultimate Magic pg. 216"},{"n":"Deceitful Veneer","l":4,"school":"illusion (glamer)","castingTime":"1 standard action","components":"V, S","range":"close (25 ft. + 5 ft./2 levels)","target":"one creature","duration":"10 minutes/level (D)","save":"Will negates","sr":"yes","effect":"Subtly warps the target's aura and body language so that everything it says appears false to magical lie detection and to Sense Motive checks, which require a DC 15 + your caster level check to see through; while the target is within close ra
